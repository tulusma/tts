<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b8322a">
<title>Grammar HSK 1</title>
<style>:root{--bg:#faf7f2;--card:#fff;--ink:#1f1b16;--mut:#6b6258;--line:#e6dfd4;--acc:#b8322a;--acc2:#f6e3e0;--ok:#1e7a46;--okb:#e2f3e8;--bad:#b3261e;--badb:#fbe5e3;--box:#f3efe7;--zh:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#211e1b;--ink:#ece6dd;--mut:#a39a8f;--line:#38322c;--acc:#e0675d;--acc2:#3a2321;--ok:#5cc58a;--okb:#1c3326;--bad:#f08178;--badb:#3d2220;--box:#2a2622}}
:root[data-theme="dark"]{--bg:#171513;--card:#211e1b;--ink:#ece6dd;--mut:#a39a8f;--line:#38322c;--acc:#e0675d;--acc2:#3a2321;--ok:#5cc58a;--okb:#1c3326;--bad:#f08178;--badb:#3d2220;--box:#2a2622}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--acc);color:#fff}
.top h1{flex:1;margin:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:rgba(255,255,255,.18);border:0;border-radius:8px;width:36px;height:34px;font-size:22px;line-height:1;color:#fff}
.tg{display:flex;gap:6px}
.tg button{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:999px;padding:3px 10px;font-size:13px}
.tg button[aria-pressed="true"]{background:#fff;color:var(--acc)}
main{max-width:760px;margin:0 auto;padding:16px 16px 80px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.hero p{margin:4px 0;color:var(--mut)}
.stat{display:flex;gap:10px;margin:12px 0 4px;flex-wrap:wrap}
.stat div{background:var(--box);border-radius:10px;padding:8px 12px;font-size:14px}
.stat b{font-size:18px;display:block}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 0}
.btn{display:block;width:100%;text-align:center;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:11px 12px;font-weight:600}
.btn.alt{background:transparent;color:var(--acc)}
.btn[disabled]{opacity:.45;cursor:default}
h2.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:22px 0 8px}
.les{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.les-h{display:flex;align-items:baseline;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.les-h .n{font-weight:700;color:var(--acc);min-width:28px}
.les-h .z{font-family:var(--zh);font-size:17px;flex:1}
.les-h .q{font-size:13px;color:var(--acc);background:none;border:0;padding:0;text-decoration:underline}
.tp{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px}
.tp:first-of-type{border-top:0}
.tp .t{flex:1}
.tp .c{font-size:12px;color:var(--mut);white-space:nowrap}
.tp:hover{background:var(--box)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--acc)}
.kode{display:inline-block;font-size:12px;color:var(--mut);background:var(--box);border-radius:6px;padding:2px 8px;margin-bottom:8px}
.ttl2{font-size:21px;line-height:1.3;margin:0 0 6px}
.rumus{font-family:var(--zh);background:var(--acc2);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:16px}
.jelas p{margin:0 0 10px}
.poin{margin:0;padding-left:20px}.poin li{margin:4px 0}
.ex{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:8px;align-items:flex-start}
.ex:first-of-type{border-top:0;padding-top:0}
.ex .b{flex:1;min-width:0}
.zh{font-family:var(--zh);font-size:19px;line-height:1.5}
.py{color:var(--mut);font-size:14px}
.id{font-size:14px}
.tag{display:inline-block;font-size:11px;background:var(--box);color:var(--mut);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.tag.bk{background:var(--acc2);color:var(--acc)}
.say{border:1px solid var(--line);background:var(--box);border-radius:8px;width:34px;height:34px;flex:none;font-size:15px}
.err{border-top:1px solid var(--line);padding:10px 0}
.err:first-of-type{border-top:0;padding-top:0}
.x{color:var(--bad)}.v{color:var(--ok)}
.x .zh{text-decoration:line-through;text-decoration-thickness:1px}
.why{font-size:14px;color:var(--mut);margin-top:2px}
.nav2{display:flex;gap:10px;margin-top:6px}
.nav2 .btn{flex:1}
.aud{font-size:14px;color:var(--mut)}
.aud a{color:var(--acc)}
.hide-py .py{display:none}.hide-id .id{display:none}
/* kuis */
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:2px 0 14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.qh{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:4px}
.qt{font-size:13px;color:var(--mut);margin:0 0 6px}
.qq{font-size:18px;margin:0 0 4px}
.qq.zhq{font-family:var(--zh);font-size:22px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-family:var(--zh);font-size:17px}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.no{border-color:var(--bad);background:var(--badb)}
.opt[disabled]{cursor:default}
.ansline{min-height:56px;border:1.5px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tile{font-family:var(--zh);font-size:18px;background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:6px 11px;min-width:40px}
.tile.used{visibility:hidden}
.ansline .tile{background:var(--acc2);border-color:var(--acc)}
.fb{border-radius:10px;padding:12px;margin-top:12px;font-size:15px}
.fb.ok{background:var(--okb)}.fb.no{background:var(--badb)}
.fb b{display:block;margin-bottom:4px}
.bsrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.res{text-align:center;padding:10px 0}
.res .big{font-size:46px;font-weight:700;color:var(--acc);line-height:1.1}
.wl{margin-top:8px}
.wl .err .t{font-size:12px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:30px 0}
@media (max-width:420px){.acts{grid-template-columns:1fr}.zh{font-size:18px}}
.say{display:none}
body.tts .say{display:inline-block}
.fb .say{margin-left:8px;vertical-align:middle}
[hidden]{display:none!important}
main a{color:var(--acc)}
.tabs{display:flex;gap:6px;background:var(--box);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.zhs{font-family:var(--zh)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.wc{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 6px;min-height:96px;text-align:center}
.wc .wh{font-family:var(--zh);font-size:26px;line-height:1.3}
.wc .py{font-size:14px}.wc .id{font-size:13px;line-height:1.3}
.rv{cursor:pointer}
.rv:not(.open) .py,.rv:not(.open) .id{visibility:hidden}
.wc.open{border-color:var(--acc)}
.rvbar{display:flex;gap:8px;margin-top:10px}.rvbar .btn{flex:1;padding:8px}
.trk{margin:14px 0 4px;font-size:14px;font-weight:600}.trk:first-of-type{margin-top:4px}
.spk{font-family:var(--zh);color:var(--mut);font-size:16px}
.ex.rv .zh{display:inline}
</style></head>

empat 在家 harus sebelum kata kerja 看."}, {"k": "2-1.17", "t": "bs", "s": "我们明天去商店。", "sp": "Wǒmen míngtiān qù shāngdiàn.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: S + waktu + KK + O."}]}, {"id": "3-1", "pel": 3, "judul": "Kalimat 是 (A adalah B)", "kode": "一36", "rumus": ["A + 是 + B", "A + 不是 + B", "A + 也是 + B"], "jelas": ["是 (shì) menghubungkan dua kata benda: A adalah B. Dipakai untuk menyebut identitas, kebangsaan, pekerjaan, hubungan: 我是中国人, 他是老师, 这是我女朋友.", "Bentuk ingkarnya selalu 不是. Tidak pernah 没是. 我不是安妮 = saya bukan Annie.", "Kata keterangan seperti 也 (juga) dan 都 (semua) diletakkan sebelum 是: 她也是泰国人, 我们都是学生.", "Kesalahan paling sering pelajar Indonesia: memakai 是 di depan kata sifat karena terbiasa dengan \"adalah\". Untuk kata sifat (忙, 好, 冷) JANGAN pakai 是. Bilang 我很忙, bukan 我是忙. Lihat topik Kalimat Kata Sifat (pelajaran 10).", "是 juga dipakai untuk \"di tempat ini adalah …\" (学校前边是商店, di depan sekolah adalah toko), tetapi itu dibahas bersama kalimat keberadaan di pelajaran 9."], "poin": ["是 = adalah, hanya di antara dua kata benda.", "Ingkar: 不是 (bú shì, nada 不 berubah karena 是 nada 4).", "也/都 masuk sebelum 是.", "Kata sifat tidak memakai 是."], "contoh": [{"zh": "我是中国人。", "py": "Wǒ shì Zhōngguó rén.", "id": "Aku orang Tiongkok.", "b": true, "tr": "03-1"}, {"zh": "我不是安妮，我是白家月。", "py": "Wǒ bú shì Ānnī, wǒ shì Bái Jiāyuè.", "id": "Aku bukan Annie, aku Bai Jiayue.", "b": true, "tr": "02-3"}, {"zh": "她也是泰国人。", "py": "Tā yě shì Tàiguó rén.", "id": "Dia juga orang Thailand.", "b": true, "tr": "03-3"}, {"zh": "这是谁？", "py": "Zhè shì shéi?", "id": "Ini siapa?", "b": true, "tr": "03-3"}, {"zh": "我们都是学生。", "py": "Wǒmen dōu shì xuéshēng.", "id": "Kami semua pelajar.", "b": false, "tr": null}, {"zh": "他是我的汉语老师。", "py": "Tā shì wǒ de Hànyǔ lǎoshī.", "id": "Dia guru bahasa Mandarin saya.", "b": false, "tr": null}, {"zh": "那不是我的杯子。", "py": "Nà bú shì wǒ de bēizi.", "id": "Itu bukan cangkir saya.", "b": false, "tr": null}, {"zh": "我爸爸是医生，我妈妈也是医生。", "py": "Wǒ bàba shì yīshēng, wǒ māma yě shì yīshēng.", "id": "Ayah saya dokter, ibu saya juga dokter.", "b": false, "tr": null}, {"zh": "你是哪国人？——我是印度尼西亚人。", "py": "Nǐ shì nǎ guó rén? — Wǒ shì Yìndùníxīyà rén.", "id": "Kamu orang mana? — Saya orang Indonesia.", "b": false, "tr": null}], "salah": [{"s": "我没是老师。", "sp": "Wǒ méi shì lǎoshī.", "n": "", "b": "我不是老师。", "bp": "Wǒ bú shì lǎoshī.", "a": "是 hanya diingkari dengan 不."}, {"s": "我是很忙。", "sp": "Wǒ shì hěn máng.", "n": "", "b": "我很忙。", "bp": "Wǒ hěn máng.", "a": "Kata sifat tidak memakai 是."}, {"s": "我是也学生。", "sp": "Wǒ shì yě xuéshēng.", "n": "", "b": "我也是学生。", "bp": "Wǒ yě shì xuéshēng.", "a": "也 harus sebelum 是."}], "latihan": [{"k": "3-1.0", "t": "pg", "q": "我___印度尼西亚人。", "o": ["是", "很", "有", "在"], "a": 0, "x": "Kebangsaan: A 是 B.", "f": "我是印度尼西亚人。", "fp": "Wǒ shì Yìndùníxīyà rén."}, {"k": "3-1.1", "t": "pg", "q": "他___老师，他是医生。", "o": ["没是", "不是", "是不", "没有"], "a": 1, "x": "Ingkar 是 selalu 不是.", "f": "他不是老师，他是医生。", "fp": "Tā bú shì lǎoshī, tā shì yīshēng."}, {"k": "3-1.2", "t": "pg", "q": "我是学生，她___是学生。", "o": ["也", "都", "很", "不"], "a": 0, "x": "也 = juga, diletakkan sebelum 是.", "f": "我是学生，她也是学生。", "fp": "Wǒ shì xuéshēng, tā yě shì xuéshēng."}, {"k": "3-1.3", "t": "bs", "s": "我没是中国人。", "sp": "Wǒ méi shì Zhōngguó rén.", "n": "", "ok": false, "b": "我不是中国人。", "bp": "Wǒ bú shì Zhōngguó rén.", "x": "是 tidak pernah diingkari dengan 没."}, {"k": "3-1.4", "t": "bs", "s": "这是我妈妈。", "sp": "Zhè shì wǒ māma.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: identitas dengan 是."}, {"k": "3-1.5", "t": "bs", "s": "今天是很冷。", "sp": "Jīntiān shì hěn lěng.", "n": "", "ok": false, "b": "今天很冷。", "bp": "Jīntiān hěn lěng.", "x": "冷 adalah kata sifat, tidak memakai 是."}, {"k": "3-1.6", "t": "su", "w": ["他", "不是", "法国人"], "s": "他不是法国人。", "alt": [], "p": "Tā bú shì Fǎguó rén.", "x": "Dia bukan orang Prancis."}, {"k": "3-1.7", "t": "su", "w": ["我们", "都", "是", "学生"], "s": "我们都是学生。", "alt": [], "p": "Wǒmen dōu shì xuéshēng.", "x": "Kami semua pelajar."}, {"k": "3-1.8", "t": "su", "w": ["你", "是", "哪国人"], "s": "你是哪国人？", "alt": [], "p": "Nǐ shì nǎ guó rén?", "x": "Kamu orang negara mana?"}, {"k": "3-1.9", "t": "pg", "q": "\"Ini bukan buku saya\" =", "o": ["这不是我的书。", "这没是我的书。", "这是不我的书。", "这不我的书是。"], "a": 0, "x": "Pola: A + 不是 + B."}, {"k": "3-1.10", "t": "pg", "q": "那___我的手机，我的手机在家里。", "o": ["不是", "没是", "没有", "不有"], "a": 0, "x": "是 diingkari dengan 不: 不是.", "f": "那不是我的手机，我的手机在家里。", "fp": "Nà bú shì wǒ de shǒujī, wǒ de shǒujī zài jiā lǐ."}, {"k": "3-1.11", "t": "pg", "q": "我们___是中国人。(semua)", "o": ["都", "很", "有", "在"], "a": 0, "x": "都 (semua) diletakkan sebelum 是.", "f": "我们都是中国人。", "fp": "Wǒmen dōu shì Zhōngguó rén."}, {"k": "3-1.12", "t": "pg", "q": "Mana yang SALAH?", "o": ["他是医生。", "他是很高。", "他不是老师。", "他也是学生。"], "a": 1, "x": "高 kata sifat, tidak memakai 是: 他很高。"}, {"k": "3-1.13", "t": "su", "w": ["我", "爸爸", "是", "医生"], "s": "我爸爸是医生。", "alt": [], "p": "Wǒ bàba shì yīshēng.", "x": "Ayah saya dokter."}, {"k": "3-1.14", "t": "su", "w": ["这", "不", "是", "我", "的", "书"], "s": "这不是我的书。", "alt": [], "p": "Zhè bú shì wǒ de shū.", "x": "Ini bukan buku saya."}, {"k": "3-1.15", "t": "su", "w": ["她", "也", "是", "汉语", "老师"], "s": "她也是汉语老师。", "alt": [], "p": "Tā yě shì Hànyǔ lǎoshī.", "x": "Dia juga guru bahasa Mandarin."}, {"k": "3-1.16", "t": "bs", "s": "我们都是印度尼西亚人。", "sp": "Wǒmen dōu shì Yìndùníxīyà rén.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 都 sebelum 是."}, {"k": "3-1.17", "t": "bs", "s": "我妈妈是很漂亮。", "sp": "Wǒ māma shì hěn piàoliang.", "n": "", "ok": false, "b": "我妈妈很漂亮。", "bp": "Wǒ māma hěn piàoliang.", "x": "漂亮 kata sifat, jadi tidak memakai 是."}]}, {"id": "3-2", "pel": 3, "judul": "Partikel struktur 的", "kode": "一20", "rumus": ["Pemilik + 的 + benda (我的书)", "Penjelas + 的 + benda (中文老师 / 新的电脑)", "Kata ganti + (的) + keluarga/teman (我妈妈, 我女朋友)"], "jelas": ["的 (de) menghubungkan penjelas dengan kata benda. Fungsinya mirip \"-nya\" atau \"milik\", tetapi urutannya terbalik dari bahasa Indonesia: 我的书 = saya + 的 + buku = buku saya.", "Untuk kepemilikan biasa, 的 wajib: 老师的电脑 (komputer guru), 我的手机 (HP saya).", "Untuk orang dekat (keluarga, teman, pacar) dan lembaga sendiri, 的 biasanya dihilangkan setelah kata ganti: 我妈妈, 我女朋友, 我们学校. Memakai 的 di sini tidak salah, hanya terdengar lebih kaku.", "Jika bendanya sudah jelas dari konteks, kata bendanya boleh dibuang: 这是我的 (ini punya saya). 那是谁的书？—是我的。", "Satu kata sifat bersuku kata satu langsung menempel tanpa 的: 新电脑, 好朋友. Jika kata sifat diberi 很, 的 wajib: 很好的朋友."], "poin": ["Urutan: pemilik/penjelas di depan, benda di belakang.", "Keluarga & teman: 的 boleh hilang (我妈妈).", "Benda boleh dibuang jika jelas: 是我的。", "很 + KS + 的 + benda."], "contoh": [{"zh": "我的中文老师也是中国人。", "py": "Wǒ de Zhōngwén lǎoshī yě shì Zhōngguó rén.", "id": "Guru bahasa Mandarinku juga orang Tiongkok.", "b": true, "tr": "03-1"}, {"zh": "这是你的新电脑吗？", "py": "Zhè shì nǐ de xīn diànnǎo ma?", "id": "Ini komputer barumu?", "b": true, "tr": "05-5"}, {"zh": "那是谁的书？", "py": "Nà shì shéi de shū?", "id": "Itu buku siapa?", "b": true, "tr": "09-3"}, {"zh": "这是我女朋友。", "py": "Zhè shì wǒ nǚpéngyou.", "id": "Ini pacarku.", "b": true, "tr": "03-3"}, {"zh": "他是一个很好的老师。", "py": "Tā shì yí gè hěn hǎo de lǎoshī.", "id": "Dia guru yang sangat baik.", "b": false, "tr": null}, {"zh": "这是我朋友的手机。", "py": "Zhè shì wǒ péngyou de shǒujī.", "id": "Ini ponsel teman saya.", "b": false, "tr": null}, {"zh": "她是我们的汉语老师。", "py": "Tā shì wǒmen de Hànyǔ lǎoshī.", "id": "Dia guru bahasa Mandarin kami.", "b": false, "tr": null}, {"zh": "我爸爸在医院工作。", "py": "Wǒ bàba zài yīyuàn gōngzuò.", "id": "Ayah saya bekerja di rumah sakit.", "b": false, "tr": null}, {"zh": "这是谁的杯子？——是王老师的。", "py": "Zhè shì shéi de bēizi? — Shì Wáng lǎoshī de.", "id": "Ini cangkir siapa? — Punya Guru Wang.", "b": false, "tr": null}], "salah": [{"s": "书的我", "sp": "Shū de wǒ", "n": "", "b": "我的书", "bp": "Wǒ de shū", "a": "Pemilik di depan, benda di belakang."}, {"s": "他是很好朋友。", "sp": "Tā shì hěn hǎo péngyou.", "n": "", "b": "他是很好的朋友。", "bp": "Tā shì hěn hǎo de péngyou.", "a": "Setelah 很 + kata sifat, 的 wajib."}], "latihan": [{"k": "3-2.0", "t": "pg", "q": "这是我___手机。", "o": ["的", "是", "了", "吗"], "a": 0, "x": "Kepemilikan: 我的手机.", "f": "这是我的手机。", "fp": "Zhè shì wǒ de shǒujī."}, {"k": "3-2.1", "t": "pg", "q": "\"buku guru\" =", "o": ["书的老师", "老师的书", "老师书的", "的老师书"], "a": 1, "x": "Pemilik (老师) di depan."}, {"k": "3-2.2", "t": "pg", "q": "那是谁的杯子？——是___。", "o": ["我", "我的", "的我", "我是"], "a": 1, "x": "Benda boleh dibuang: 是我的.", "f": "那是谁的杯子？——是我的。", "fp": "Nà shì shéi de bēizi? — Shì wǒ de."}, {"k": "3-2.3", "t": "bs", "s": "这是电脑的我。", "sp": "Zhè shì diànnǎo de wǒ.", "n": "", "ok": false, "b": "这是我的电脑。", "bp": "Zhè shì wǒ de diànnǎo.", "x": "Pemilik selalu di depan 的."}, {"k": "3-2.4", "t": "bs", "s": "这是我妈妈。", "sp": "Zhè shì wǒ māma.", "n": "", "ok": true, "b": null, "bp": "", "x": "Untuk keluarga, 的 boleh dihilangkan."}, {"k": "3-2.5", "t": "bs", "s": "她是很漂亮女孩子。", "sp": "Tā shì hěn piàoliang nǚ háizi.", "n": "", "ok": false, "b": "她是很漂亮的女孩子。", "bp": "Tā shì hěn piàoliang de nǚ háizi.", "x": "很 + KS harus diikuti 的 sebelum benda."}, {"k": "3-2.6", "t": "su", "w": ["这", "是", "我", "的", "电脑"], "s": "这是我的电脑。", "alt": [], "p": "Zhè shì wǒ de diànnǎo.", "x": "Ini komputer saya."}, {"k": "3-2.7", "t": "su", "w": ["你", "的", "手机号", "是", "多少"], "s": "你的手机号是多少？", "alt": [], "p": "Nǐ de shǒujīhào shì duōshao?", "x": "Nomor HP-mu berapa?"}, {"k": "3-2.8", "t": "su", "w": ["那", "是", "老师", "的", "书"], "s": "那是老师的书。", "alt": [], "p": "Nà shì lǎoshī de shū.", "x": "Itu buku guru."}, {"k": "3-2.9", "t": "pg", "q": "\"teman baik saya\" yang paling wajar =", "o": ["我的好朋友", "好朋友的我", "我好的朋友的", "朋友好我的"], "a": 0, "x": "Pemilik + 的 + (KS satu suku) + benda."}, {"k": "3-2.10", "t": "pg", "q": "这是___的电脑？——是我哥哥的。", "o": ["谁", "什么", "哪", "几"], "a": 0, "x": "谁的 = milik siapa.", "f": "这是谁的电脑？——是我哥哥的。", "fp": "Zhè shì shéi de diànnǎo? — Shì wǒ gēge de."}, {"k": "3-2.11", "t": "pg", "q": "\"teman ibu\" =", "o": ["妈妈的朋友", "朋友的妈妈", "妈妈朋友的", "的妈妈朋友"], "a": 0, "x": "Pemilik (妈妈) di depan, lalu 的, lalu benda (朋友). 朋友的妈妈 = ibu teman."}, {"k": "3-2.12", "t": "pg", "q": "Mana yang paling wajar untuk \"ayah saya\"?", "o": ["我爸爸", "爸爸的我", "爸爸我", "的我爸爸"], "a": 0, "x": "Untuk anggota keluarga, 的 biasanya dihilangkan: 我爸爸."}, {"k": "3-2.13", "t": "su", "w": ["这", "是", "王老师", "的", "杯子"], "s": "这是王老师的杯子。", "alt": [], "p": "Zhè shì Wáng lǎoshī de bēizi.", "x": "Ini cangkir Guru Wang."}, {"k": "3-2.14", "t": "su", "w": ["那", "本", "书", "是", "谁", "的"], "s": "那本书是谁的？", "alt": [], "p": "Nà běn shū shì shéi de?", "x": "Buku itu milik siapa?"}, {"k": "3-2.15", "t": "su", "w": ["他", "是", "我", "的", "好", "朋友"], "s": "他是我的好朋友。", "alt": [], "p": "Tā shì wǒ de hǎo péngyou.", "x": "Dia teman baik saya."}, {"k": "3-2.16", "t": "bs", "s": "这是我的妈妈的书。", "sp": "Zhè shì wǒ de māma de shū.", "n": "", "ok": false, "b": "这是我妈妈的书。", "bp": "Zhè shì wǒ māma de shū.", "x": "Hindari dua 的 berturut-turut; 的 pertama (di depan keluarga) dihilangkan."}, {"k": "3-2.17", "t": "bs", "s": "那是他的电脑。", "sp": "Nà shì tā de diànnǎo.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 他的 + 电脑."}]}, {"id": "3-3", "pel": 3, "judul": "Pertanyaan ya/tidak dengan 吗", "kode": "一45", "rumus": ["Kalimat berita + 吗？"], "jelas": ["Cara paling mudah membuat pertanyaan: ambil kalimat berita, tambahkan 吗 (ma) di akhir. Susunan kata tidak berubah. 你是老师。→ 你是老师吗？", "Jawabannya mengulang kata kerja atau kata sifat utamanya, bukan \"ya/tidak\": 你忙吗？—忙。/ 不忙。 你是学生吗？—是。/ 不是。 Bisa juga dengan 对 (benar) atau 是的 (iya).", "PENTING: jika kalimat sudah memakai kata tanya (什么, 谁, 哪儿, 几, 多少, 怎么), JANGAN tambah 吗. 你叫什么名字？ sudah pertanyaan. 你叫什么名字吗？ salah.", "Begitu juga dengan pertanyaan positif-negatif (去不去) dan pertanyaan 还是: tidak memakai 吗.", "Nada: 吗 bernada netral (ringan). Intonasi kalimat tetap datar, tidak perlu naik seperti bahasa Indonesia."], "poin": ["Kalimat berita + 吗 = pertanyaan ya/tidak.", "Jawab dengan kata kerja/sifatnya: 是 / 不是, 忙 / 不忙.", "Tidak dipakai ma?", "x": "Apakah ayahmu ada di rumah?"}, {"k": "3-3.15", "t": "su", "w": ["你", "有", "中文", "书", "吗"], "s": "你有中文书吗？", "alt": [], "p": "Nǐ yǒu Zhōngwén shū ma?", "x": "Kamu punya buku bahasa Mandarin?"}, {"k": "3-3.16", "t": "bs", "s": "你叫什么名字吗？", "sp": "Nǐ jiào shénme míngzi ma?", "n": "", "ok": false, "b": "你叫什么名字？", "bp": "Nǐ jiào shénme míngzi?", "x": "Sudah ada kata tanya 什么, 吗 harus dibuang."}, {"k": "3-3.17", "t": "bs", "s": "你会说汉语吗？", "sp": "Nǐ huì shuō Hànyǔ ma?", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: kalimat berita + 吗."}]}, {"id": "4-1", "pel": 4, "judul": "Kalimat 有 (1): punya / ada", "kode": "一37", "rumus": ["Orang + 有 + benda (punya)", "Orang + 没有 + benda", "Tempat + 有 + benda (ada, lihat pelajaran 9)"], "jelas": ["有 (yǒu) berarti \"punya\" jika subjeknya orang: 我有两个哥哥. Jika subjeknya tempat, artinya \"ada\": 我家有四口人 (di keluargaku ada empat orang).", "Ingkarnya SELALU 没有 (méiyǒu), boleh disingkat 没. Tidak pernah 不有. Ini aturan yang harus dihafal mati.", "Setelah 没有, benda biasanya tanpa bilangan: 我没有哥哥 (bukan 我没有两个哥哥, kecuali sedang membantah jumlah).", "Bertanya: 你有……吗？ atau 你有没有……？ Jawaban: 有。/ 没有。", "Untuk bertanya jumlah: 你有几个……？ (sedikit, biasanya < 10) atau 你有多少……？ (banyak/tak tentu)."], "poin": ["有 = punya (orang) / ada (tempat).", "Ingkar: 没有 / 没, tidak pernah 不有.", "Tanya: 有……吗？ / 有没有……？", "Jawab singkat: 有 / 没有."], "contoh": [{"zh": "我有两个哥哥，你呢？", "py": "Wǒ yǒu liǎng gè gēge, nǐ ne?", "id": "Aku punya dua kakak laki-laki. Kalau kamu?", "b": true, "tr": "04-3"}, {"zh": "我没有哥哥。", "py": "Wǒ méiyǒu gēge.", "id": "Aku tidak punya kakak laki-laki.", "b": true, "tr": "04-3"}, {"zh": "我有两个孩子，一个儿子，一个女儿。", "py": "Wǒ yǒu liǎng gè háizi, yí gè érzi, yí gè nǚ'ér.", "id": "Saya punya dua anak, satu putra dan satu putri.", "b": true, "tr": "04-5"}, {"zh": "请问，有杯子吗？——有。", "py": "Qǐngwèn, yǒu bēizi ma? — Yǒu.", "id": "Permisi, ada cangkir? — Ada.", "b": true, "tr": "10-1"}, {"zh": "你有没有中文书？", "py": "Nǐ yǒu méiyǒu Zhōngwén shū?", "id": "Kamu punya buku bahasa Mandarin atau tidak?", "b": false, "tr": null}, {"zh": "他有很多中国朋友。", "py": "Tā yǒu hěn duō Zhōngguó péngyou.", "id": "Dia punya banyak teman orang Tiongkok.", "b": false, "tr": null}, {"zh": "我没有电脑，我有手机。", "py": "Wǒ méiyǒu diànnǎo, wǒ yǒu shǒujī.", "id": "Saya tidak punya komputer, saya punya ponsel.", "b": false, "tr": null}, {"zh": "你有时间吗？——有。", "py": "Nǐ yǒu shíjiān ma? — Yǒu.", "id": "Kamu ada waktu? — Ada.", "b": false, "tr": null}, {"zh": "我们学校有三个中国老师。", "py": "Wǒmen xuéxiào yǒu sān gè Zhōngguó lǎoshī.", "id": "Sekolah kami punya tiga guru orang Tiongkok.", "b": false, "tr": null}], "salah": [{"s": "我不有钱。", "sp": "Wǒ bù yǒu qián.", "n": "", "b": "我没有钱。", "bp": "Wǒ méiyǒu qián.", "a": "有 diingkari dengan 没, bukan 不."}, {"s": "我是有一个妹妹。", "sp": "Wǒ shì yǒu yí gè mèimei.", "n": "", "b": "我有一个妹妹。", "bp": "Wǒ yǒu yí gè mèimei.", "a": "Jangan tambah 是 sebelum 有."}, {"s": "我有两哥哥。", "sp": "Wǒ yǒu liǎng gēge.", "n": "", "b": "我有两个哥哥。", "bp": "Wǒ yǒu liǎng gè gēge.", "a": "Bilangan + kata satuan (个) + benda."}], "latihan": [{"k": "4-1.0", "t": "pg", "q": "我___一个妹妹。", "o": ["有", "是", "在", "会"], "a": 0, "x": "Punya = 有.", "f": "我有一个妹妹。", "fp": "Wǒ yǒu yí gè mèimei."}, {"k": "4-1.1", "t": "pg", "q": "我___哥哥。", "o": ["不有", "没有", "没是", "不是"], "a": 1, "x": "Ingkar 有 = 没有.", "f": "我没有哥哥。", "fp": "Wǒ méiyǒu gēge."}, {"k": "4-1.2", "t": "pg", "q": "你有中文书吗？——Jawaban \"ada\":", "o": ["是。", "有。", "对有。", "在。"], "a": 1, "x": "Jawab dengan kata kerjanya: 有."}, {"k": "4-1.3", "t": "bs", "s": "他不有手机。", "sp": "Tā bù yǒu shǒujī.", "n": "", "ok": false, "b": "他没有手机。", "bp": "Tā méiyǒu shǒujī.", "x": "有 tidak pernah memakai 不."}, {"k": "4-1.4", "t": "bs", "s": "我们学校有很多学生。", "sp": "Wǒmen xuéxiào yǒu hěn duō xuéshēng.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: tempat + 有 + benda."}, {"k": "4-1.5", "t": "bs", "s": "我是有一个妹妹。", "sp": "Wǒ shì yǒu yí gè mèimei.", "n": "", "ok": false, "b": "我有一个妹妹。", "bp": "Wǒ yǒu yí gè mèimei.", "x": "Jangan menambah 是 sebelum 有."}, {"k": "4-1.6", "t": "su", "w": ["我", "有", "两", "个", "孩子"], "s": "我有两个孩子。", "alt": [], "p": "Wǒ yǒu liǎng gè háizi.", "x": "Saya punya dua anak."}, {"k": "4-1.7", "t": "su", "w": ["他", "没有", "中文", "名字"], "s": "他没有中文名字。", "alt": [], "p": "Tā méiyǒu Zhōngwén míngzi.", "x": "Dia tidak punya nama Mandarin."}, {"k": "4-1.8", "t": "su", "w": ["你", "有", "没有", "哥哥"], "s": "你有没有哥哥？", "alt": [], "p": "Nǐ yǒu méiyǒu gēge?", "x": "Kamu punya kakak laki-laki atau tidak?"}, {"k": "4-1.9", "t": "pg", "q": "\"Di kelas tidak ada orang\" =", "o": ["教室里没有人。", "教室里不有人。", "教室里是没人。", "没有教室里人。"], "a": 0, "x": "Tempat + 没有 + benda."}, {"k": "4-1.10", "t": "pg", "q": "我今天很忙，___时间。", "o": ["没有", "不有", "不是", "没是"], "a": 0, "x": "有 selalu diingkari dengan 没: 没有.", "f": "我今天很忙，没有时间。", "fp": "Wǒ jīntiān hěn máng, méiyǒu shíjiān."}, {"k": "4-1.11", "t": "pg", "q": "你有没有猫？——Jawaban \"tidak punya\":", "o": ["没有。", "不有。", "不是。", "不。"], "a": 0, "x": "Jawaban negatif untuk 有 adalah 没有."}, {"k": "4-1.12", "t": "pg", "q": "\"Dia punya dua anak perempuan\" =", "o": ["她有两个女儿。", "她是两个女儿。", "她在两个女儿。", "她有二个女儿。"], "a": 0, "x": "Punya = 有; sebelum kata satuan pakai 两, bukan 二."}, {"k": "4-1.13", "t": "su", "w": ["我", "有", "一", "个", "中国", "朋友"], "s": "我有一个中国朋友。", "alt": [], "p": "Wǒ yǒu yí gè Zhōngguó péngyou.", "x": "Saya punya seorang teman orang Tiongkok."}, {"k": "4-1.14", "t": "su", "w": ["我", "没有", "电脑"], "s": "我没有电脑。", "alt": [], "p": "Wǒ méiyǒu diànnǎo.", "x": "Saya tidak punya komputer."}, {"k": "4-1.15", "t": "su", "w": ["你", "有", "时间", "吗"], "s": "你有时间吗？", "alt": [], "p": "Nǐ yǒu shíjiān ma?", "x": "Kamu ada waktu?"}, {"k": "4-1.16", "t": "bs", "s": "我没有钱。", "sp": "Wǒ méiyǒu qián.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 没有 untuk \"tidak punya\"."}, {"k": "4-1.17", "t": "bs", "s": "我妹妹不有手机。", "sp": "Wǒ mèimei bù yǒu shǒujī.", "n": "", "ok": false, "b": "我妹妹没有手机。", "bp": "Wǒ mèimei méiyǒu shǒujī.", "x": "有 tidak pernah diingkari dengan 不."}]}, {"id": "4-2", "pel": 4, "judul": "Menyebut bilangan", "kode": "一07", "rumus": ["一 二 三 四 五 六 七 八 九 十", "十一 = 10+1, 二十 = 2×10, 二十五 = 2×10+5", "一百 (100), 零 (0), 两 (dua sebelum kata satuan)"], "jelas": ["Bilangan Mandarin sangat teratur. Puluhan dibentuk seperti perkalian: 二十 (2×10) = 20, 三十 = 30. Satuan ditambahkan di belakang: 二十五 = 25, 九十九 = 99.", "Belasan cukup 十 + angka: 十一 (11), 十五 (15). Tidak perlu 一十.", "100 = 一百. 105 = 一百零五 (nol di tengah wajib disebut). 120 = 一百二十.", "二 vs 两: keduanya \"dua\". Sebelum kata satuan dipakai 两: 两个人, 两本书, 两点 (jam 2). Saat menghitung, angka di nomor telepon, dan di bilangan puluhan/belasan dipakai 二: 一、二、三, 十二, 二十, 第二.", "Nomor telepon, nomor kamar, dan tahun dibaca angka per angka. 1 sering dibaca yāo agar tidak tertukar dengan 七 (qī): 139 → yāo sān jiǔ."], "poin": ["20 = 二十, 25 = 二十五, 100 = 一百.", "两 sebelum kata satuan; 二 saat menghitung, di puluhan, dan urutan.", "Nomor telepon dibaca per angka; 1 = yāo.", "Nol di tengah disebut: 一百零五."], "contoh": [{"zh": "她有二十个学生。", "py": "Tā yǒu èrshí gè xuéshēng.", "id": "Dia punya dua puluh murid.", "b": true, "tr": "04-1"}, {"zh": "我有两个哥哥。", "py": "Wǒ yǒu liǎng gè gēge.", "id": "Aku punya dua kakak laki-laki.", "b": true, "tr": "04-3"}, {"zh": "我的手机号是+86 13552721160。", "py": "Wǒ de shǒujīhào shì bā liù yāo sān wǔ wǔ èr qī èr yāo yāo liù líng.", "id": "Nomor HP-ku +86 13552721160. Nomor dibaca per angka, 1 = yāo.", "b": true, "tr": "06-1"}, {"zh": "我们班有十五个学生。", "py": "Wǒmen bān yǒu shíwǔ gè xuéshēng.", "id": "Kelas kami ada lima belas murid.", "b": false, "tr": null}, {"zh": "一百零八", "py": "Yìbǎi líng bā", "id": "seratus delapan", "b": false, "tr": null}, {"zh": "我们班有十八个学生。", "py": "Wǒmen bān yǒu shíbā gè xuéshēng.", "id": "Kelas kami ada delapan belas siswa.", "b": false, "tr": null}, {"zh": "我妈妈今年四十五岁。", "py": "Wǒ māma jīnnián sìshíwǔ suì.", "id": "Ibu saya tahun ini berumur empat puluh lima tahun.", "b": false, "tr": null}, {"zh": "我家有两只猫。", "py": "Wǒ jiā yǒu liǎng zhī māo.", "id": "Di rumah saya ada dua ekor kucing.", "b": false, "tr": null}, {"zh": "这本书一百二十块。", "py": "Zhè běn shū yìbǎi'èrshí kuài.", "id": "Buku ini seratus dua puluh yuan.", "b": false, "tr": null}], "salah": [{"s": "二个人", "sp": "Èr gè rén", "n": "", "b": "两个人", "bp": "Liǎng gè rén", "a": "Sebelum kata satuan pakai 两."}, {"s": "一十五", "sp": "Yīshíwǔ", "n": "", "b": "十五", "bp": "Shíwǔ", "a": "Belasan cukup 十 + angka."}, {"s": "两十", "sp": "Liǎngshí", "n": "", "b": "二十", "bp": "Èrshí", "a": "Puluhan memakai 二."}], "latihan": [{"k": "4-2.0", "t": "pg", "q": "35 dibaca …", "o": ["三十五", "五十三", "三五", "三十和五"], "a": 0, "x": "3×10 + 5."}, {"k": "4-2.1", "t": "pg", "q": "我有___个妹妹。(2)", "o": ["二", "两", "俩个", "第二"], "a": 1, "x": "Sebelum kata satuan pakai 两.", "f": "我有两个妹妹。", "fp": "Wǒ yǒu liǎng gè mèimei."}, {"k": "4-2.2", "t": "pg", "q": "12 dibaca …", "o": ["一十二", "十二", "二十一", "两十"], "a": 1, "x": "Belasan: 十 + 2."}, {"k": "4-2.3", "t": "pg", "q": "80 =", "o": ["八十", "十八", "八零", "八百"], "a": 0, "x": "8×10."}, {"k": "4-2.4", "t": "pg", "q": "105 =", "o": ["一百五", "一百零五", "一零五", "十五"], "a": 1, "x": "Nol di tengah wajib: 一百零五. (一百五 berarti 150.)"}, {"k": "4-2.5", "t": "bs", "s": "我们班有二十个学生。", "sp": "Wǒmen bān yǒu èrshí gè xuéshēng.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 二 dipakai dalam puluhan."}, {"k": "4-2.6", "t": "bs", "s": "我有二本书。", "sp": "Wǒ yǒu èr běn shū.", "n": "", "ok": false, "b": "我有两本书。", "bp": "Wǒ yǒu liǎng běn shū.", "x": "Sebelum kata satuan pakai 两."}, {"k": "4-2.7", "t": "pg", "q": "Dalam nomor telepon, angka 1 biasanya dibaca …", "o": ["yī", "yāo", "yì", "líng"], "a": 1, "x": "Agar tidak tertukar dengan 七 qī."}, {"k": "4-2.8", "t": "pg", "q": "十九 =", "o": ["9", "19", "90", "109"], "a": 1, "x": "10 + 9.", "qp": "Shíjiǔ ="}, {"k": "4-2.9", "t": "pg", "q": "99 =", "o": ["九九", "九十九", "九百九", "十九九"], "a": 1, "x": "9×10 + 9."}, {"k": "4-2.10", "t": "pg", "q": "47 dibaca …", "o": ["四十七", "七十四", "四七", "四十和七"], "a": 0, "x": "Puluhan dulu (四十), lalu satuan (七)."}, {"k": "4-2.11", "t": "pg", "q": "我有___本中文书。(2)", "o": 08, 一23", "rumus": ["Bilangan + kata satuan + benda (两个人)", "这/那/哪 + (bilangan) + kata satuan + benda (这本书)"], "jelas": ["Dalam bahasa Mandarin, bilangan tidak boleh langsung menempel ke benda. Harus ada kata satuan di tengah, seperti \"seekor\", \"sebuah\", \"selembar\" dalam bahasa Indonesia, tetapi wajib selalu.", "个 (gè) adalah kata satuan paling umum, untuk orang dan banyak benda: 一个人, 两个孩子, 一个苹果.", "Kata satuan lain di HSK 1: 本 (buku), 口 (anggota keluarga: 四口人), 杯 (cangkir/gelas), 家 (toko, perusahaan), 件 (baju, urusan), 只 (hewan kecil), 块 (uang/potongan), 岁 (umur, tanpa benda), 斤 (setengah kilo).", "Kata satuan juga wajib setelah 这/那/哪/几: 这本书 (buku ini), 那个人 (orang itu), 几个学生 (berapa murid). 这书 tidak salah dalam bahasa lisan, tetapi untuk ujian pakai kata satuan.", "Jika bilangannya 1, sering 一 dihilangkan setelah 这/那: 这个, 那本."], "poin": ["Bilangan + satuan + benda, satuan tidak boleh hilang.", "个 = paling umum.", "本 buku, 口 anggota keluarga, 杯 minuman, 件 baju, 只 hewan, 家 toko.", "这/那/几 + satuan + benda."], "contoh": [{"zh": "你家有几口人？", "py": "Nǐ jiā yǒu jǐ kǒu rén?", "id": "Keluargamu ada berapa orang?", "b": true, "tr": "04-3"}, {"zh": "我家有四口人。", "py": "Wǒ jiā yǒu sì kǒu rén.", "id": "Keluargaku ada empat orang.", "b": true, "tr": "04-3"}, {"zh": "椅子上有一本中文书。", "py": "Yǐzi shàng yǒu yì běn Zhōngwén shū.", "id": "Di kursi ada sebuah buku bahasa Mandarin.", "b": true, "tr": "09-3"}, {"zh": "房间外有一只小猫。", "py": "Fángjiān wài yǒu yì zhī xiǎomāo.", "id": "Di luar kamar ada seekor kucing kecil.", "b": true, "tr": "08-1"}, {"zh": "请给我一杯茶。", "py": "Qǐng gěi wǒ yì bēi chá.", "id": "Tolong beri saya secangkir teh.", "b": true, "tr": "13-5"}, {"zh": "这件衣服很好看。", "py": "Zhè jiàn yīfu hěn hǎokàn.", "id": "Baju ini bagus.", "b": false, "tr": null}, {"zh": "我买了三本书。", "py": "Wǒ mǎi le sān běn shū.", "id": "Saya membeli tiga buku.", "b": false, "tr": null}, {"zh": "桌子上有一杯水。", "py": "Zhuōzi shàng yǒu yì bēi shuǐ.", "id": "Di atas meja ada segelas air.", "b": false, "tr": null}, {"  "py": "Nǐ xiǎng hē shénme?", "id": "Kamu mau minum apa?", "b": false, "tr": null}, {"zh": "我不想去，下午还有事。", "py": "Wǒ bù xiǎng qù, xiàwǔ hái yǒu shì.", "id": "Aku tidak mau pergi, siang ini masih ada urusan.", "b": true, "tr": "07-3"}, {"zh": "我想喝一杯茶。", "py": "Wǒ xiǎng hē yì bēi chá.", "id": "Saya ingin minum secangkir teh.", "b": false, "tr": null}, {"zh": "明天我想在家休息。", "py": "Míngtiān wǒ xiǎng zài jiā xiūxi.", "id": "Besok saya ingin beristirahat di rumah.", "b": false, "tr": null}, {"zh": "你想去哪儿？", "py": "Nǐ xiǎng qù nǎr?", "id": "Kamu ingin pergi ke mana?", "b": false, "tr": null}, {"zh": "我很想我的爸爸妈妈。", "py": "Wǒ hěn xiǎng wǒ de bàba māma.", "id": "Saya sangat rindu ayah dan ibu saya.", "b": false, "tr": null}], "salah": [{"s": "我想去不。", "sp": "Wǒ xiǎng qù bù.", "n": "", "b": "我不想去。", "bp": "Wǒ bù xiǎng qù.", "a": "不 sebelum 想."}, {"s": "我吃想米饭。", "sp": "Wǒ chī xiǎng mǐfàn.", "n": "", "b": "我想吃米饭。", "bp": "Wǒ xiǎng chī mǐfàn.", "a": "想 sebelum kata kerja."}], "latihan": [{"k": "6-1.0", "t": "pg", "q": "我___喝茶。(ingin)", "o": ["想", "会", "是", "有"], "a": 0, "x": "Ingin = 想.", "f": "我想喝茶。", "fp": "Wǒ xiǎng hē chá."}, {"k": "6-1.1", "t": "pg", "q": "我很___妈妈。(kangen)", "o": ["想", "会", "能", "要"], "a": 0, "x": "想 + orang = kangen.", "f": "我很想妈妈。", "fp": "Wǒ hěn xiǎng māma."}, {"k": "6-1.2", "t": "pg", "q": "我___去，我很累。", "o": ["不想", "没想", "想不", "不是"], "a": 0, "x": "Ingkar keinginan: 不想.", "f": "我不想去，我很累。", "fp": "Wǒ bù xiǎng qù, wǒ hěn lèi."}, {"k": "6-1.3", "t": "bs", "s": "我想去北京。", "sp": "Wǒ xiǎng qù Běijīng.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "6-1.4", "t": "bs", "s": "她吃想苹果。", "sp": "Tā chī xiǎng píngguǒ.", "n": "", "ok": false, "b": "她想吃苹果。", "bp": "Tā xiǎng chī píngguǒ.", "x": "想 sebelum kata kerja."}, {"k": "6-1.5", "t": "su", "w": ["你", "想", "喝", "什么"], "s": "你想喝什么？", "alt": [], "p": "Nǐ xiǎng hē shénme?", "x": "Kamu mau minum apa?"}, {"k": "6-1.6", "t": "su", "w": ["我", "不想", "吃", "包子"], "s": "我不想吃包子。", "alt": [], "p": "Wǒ bù xiǎng chī bāozi.", "x": "Aku tidak mau makan bakpao."}, {"k": "6-1.7", "t": "su", "w": ["我们", "很", "想", "你"], "s": "我们很想你。", "alt": [], "p": "Wǒmen hěn xiǎng nǐ.", "x": "Kami kangen sekali padamu."}, {"k": "6-1.8", "t": "pg", "q": "\"Saya mau beli susu\" =", "o": ["我想买牛奶。", "我买想牛奶。", "我想牛奶买。", "想我买牛奶。"], "a": 0, "x": "S + 想 + KK + O."}, {"k": "6-1.9", "t": "pg", "q": "我___看电影，我们去吧！", "o": ["想", "会", "有", "是"], "a": 0, "x": "Ingin = 想.", "f": "我想看电影，我们去吧！", "fp": "Wǒ xiǎng kàn diànyǐng, wǒmen qù ba!"}, {"k": "6-1.10", "t": "pg", "q": "我今天很累，不___做饭。", "o": ["想", "是", "有", "在"], "a": 0, "x": "不想 = tidak ingin.", "f": "我今天很累，不想做饭。", "fp": "Wǒ jīntiān hěn lèi, bù xiǎng zuòfàn."}, {"k": "6-1.11", "t": "pg", "q": "\"Kamu ingin makan apa?\" =", "o": ["你想吃什么？", "你吃想什么？", "你想什么吃？", "什么你想吃吗？"], "a": 0, "x": "S + 想 + KK + O; 什么 di posisi objek."}, {"k": "6-1.12", "t": "su", "w": ["你", "想", "去", "哪儿"], "s": "你想去哪儿？", "alt": [], "p": "Nǐ xiǎng qù nǎr?", "x": "Kamu ingin pergi ke mana?"}, {"k": "6-1.13", "t": "su", "w": ["我", "想", "喝", "一", "杯", "茶"], "s": "我想喝一杯茶。", "alt": [], "p": "Wǒ xiǎng hē yì bēi chá.", "x": "Saya ingin minum secangkir teh."}, {"k": "6-1.14", "t": "su", "w": ["我", "很", "想", "我", "妈妈"], "s": "我很想我妈妈。", "alt": [], "p": "Wǒ hěn xiǎng wǒ māma.", "x": "Saya sangat rindu ibu saya."}, {"k": "6-1.15", "t": "bs", "s": "我想买一本书。", "sp": "Wǒ xiǎng mǎi yì běn shū.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 想 + KK + O."}, {"k": "6-1.16", "t": "bs", "s": "我想不去学校。", "sp": "Wǒ xiǎng bú qù xuéxiào.", "n": "", "ok": false, "b": "我不想去学校。", "bp": "Wǒ bù xiǎng qù xuéxiào.", "x": "不 diletakkan sebelum 想."}]}, {"id": "6-2", "pel": 6, "judul": "Kalimat kata kerja berantai (1) 连动句", "kode": "(buku)", "rumus": ["S + 去/来 + tempat + KK + O (pergi ke … untuk …)", "S + 坐/开 + kendaraan + 去 + tempat (cara)"], "jelas": ["Satu subjek bisa diikuti dua kata kerja berturut-turut. Urutannya mengikuti urutan kejadian: pertama pergi, baru melakukan sesuatu. 我去超市买东西 = saya pergi ke supermarket (lalu) belanja.", "Pola pertama: 去/来 + tempat + kegiatan. Artinya \"pergi ke … untuk …\". 我去电影院看电影.", "Pola kedua: cara + 去/来. Kata kerja pertama menjelaskan cara: 我坐车去 (saya naik kendaraan pergi), 他开车来学校.", "Tidak perlu kata \"untuk\" atau \"lalu\". Bahasa Indonesia \"Saya pergi belanja ke supermarket\" harus diurutkan ulang menjadi 我去超市买东西.", "Kata waktu dan 想/要/会 diletakkan sebelum kata kerja pertama: 我明天想去超市买东西."], "poin": ["Urutan kata kerja = urutan kejadian.", "去 + tempat + kegiatan.", "Cara (坐车/开车) + 去/来 + tempat.", "Waktu dan 想/要 sebelum kata kerja pertama."], "contoh": [{"zh": "我想去超市买东西。", "py": "Wǒ xiǎng qù chāoshì mǎi dōngxi.", "id": "Aku mau ke supermarket belanja.", "b": true, "tr": "06-3"}, {"zh": "下午我想去电影院看电影。", "py": "Xiàwǔ wǒ xiǎng qù diànyǐngyuàn kàn diànyǐng.", "id": "Siang ini aku mau ke bioskop nonton film.", "b": true, "tr": "07-3"}, {"zh": "你去店里买些菜吧。", "py": "Nǐ qù diàn lǐ mǎi xiē cài ba.", "id": "Tolong ke toko beli sayur ya.", "b": true, "tr": "07-5"}, {"zh": "我没开车，坐车呢。", "py": "Wǒ méi kāichē, zuò chē ne.", "id": "Aku tidak menyetir, aku naik kendaraan.", "b": true, "tr": "11-1"}, {"zh": "我坐飞机去北京。", "py": "Wǒ zuò fēijī qù Běijīng.", "id": "Saya naik pesawat ke Beijing.", "b": false, "tr": null}, {"zh": "他去图书馆看书。", "py": "Tā qù túshūguǎn kàn shū.", "id": "Dia pergi ke perpustakaan untuk membaca buku.", "b": false, "tr": null}, {"zh": "我明天去医院看病。", "py": "Wǒ míngtiān qù yīyuàn kànbìng.", "id": "Besok saya pergi ke rumah sakit untuk berobat.", "b": false, "tr": null}, {"zh": "爸爸开车去公司。", "py": "Bàba kāichē qù gōngsī.", "id": "Ayah pergi ke kantor dengan menyetir mobil.", "b": false, "tr": null}, {"zh": "小雪来我家吃饭。", "py": "Xiǎoxuě lái wǒ jiā chīfàn.", "id": "Xiao Xue datang ke rumah saya untuk makan.", "b": false, "tr": null}], "salah": [{"s": "我买东西去超市。", "sp": "Wǒ mǎi dōngxi qù chāoshì.", "n": "", "b": "我去超市买东西。", "bp": "Wǒ qù chāoshì mǎi dōngxi.", "a": "Pergi dulu, baru belanja."}, {"s": "我去北京坐飞机。", "sp": "Wǒ qù Běijīng zuò fēijī.", "n": "", "b": "我坐飞机去北京。", "bp": "Wǒ zuò fēijī qù Běijīng.", "a": "Cara (坐飞机) di depan 去. Kalimat salah ini berarti \"saya pergi ke Beijing untuk naik pesawat\"."}], "latihan": [{"k": "6-2.0", "t": "su", "w": ["我", "去", "超市", "买", "东西"], "s": "我去超市买东西。", "alt": [], "p": "Wǒ qù chāoshì mǎi dōngxi.", "x": "Saya pergi ke supermarket belanja."}, {"k": "6-2.1", "t": "su", "w": ["他", "坐", "车", "去", "学校"], "s": "他坐车去学校。", "alt": [], "p": "Tā zuò chē qù xuéxiào.", "x": "Dia naik kendaraan ke sekolah."}, {"k": "6-2.2", "t": "su", "w": ["我们", "去", "饭店", "吃饭"], "s": "我们去饭店吃饭。", "alt": [], "p": "Wǒmen qù fàndiàn chīfàn.", "x": "Kami pergi ke restoran makan."}, {"k": "6-2.3", "t": "su", "w": ["妈妈", "明天", "想", "去", "商店", "买", "衣服"], "s": "妈妈明天想去商店买衣服。", "alt": ["明天妈妈想去商店买衣服。"], "p": "Māma míngtiān xiǎng qù shāngdiàn mǎi yīfu.", "x": "Besok ibu mau pergi ke toko beli baju."}, {"k": "6-2.4", "t": "pg", "q": "\"Saya pergi ke bioskop menonton film\" =", "o": ["我去电影院看电影。", "我看电影去电影院。", "我去看电影院电影。", "电影院我去看电影。"], "a": 0, "x": "去 + tempat + kegiatan."}, {"k": "6-2.5", "t": "pg", "q": "\"Dia naik pesawat ke Beijing\" =", "o": ["他去北京坐飞机。", "他坐飞机去北京。", "他飞机坐去北京。", "他去坐北京飞机。"], "a": 1, "x": "Cara (坐飞机) + 去 + tempat."}, {"k": "6-2.6", "t": "bs", "s": "我买菜去超市。", "sp": "Wǒ mǎi cài qù chāoshì.", "n": "", "ok": false, "b": "我去超市买菜。", "bp": "Wǒ qù chāoshì mǎi cài.", "x": "Urutan kejadian: pergi dulu."}, {"k": "6-2.7", "t": "bs", "s": "我开车去公司。", "sp": "Wǒ kāichē qù gōngsī.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: cara + 去 + tempat."}, {"k": "6-2.8", "t": "pg", "q": "Di mana 想 diletakkan? 我___去___超市___买___东西。", "o": ["sebelum 去", "sebelum 超市", "sebelum 买", "sebelum 东西"], "a": 0, "x": "想 sebelum kata kerja pertama: 我想去超市买东西."}, {"k": "6-2.9", "t": "pg", "q": "\"Saya pergi ke toko membeli baju\" =", "o": ["我去商店买衣服。", "我买衣服去商店。", "我去买商店衣服。", "商店我去买衣服。"], "a": 0, "x": "Pergi ke tempat dulu (去商店), lalu tujuannya (买衣服)."}, {"k": "6-2.10", "t": "pg", "q": "\"Kami naik taksi ke bandara\" =", "o": ["我们坐出租车去机场。", "我们去机场坐出租车。", "我们坐去机场出租车。", "我们出租车坐去机场。"], "a": 0, "x": "Cara (坐出租车) di depan, lalu 去 + tempat."}, {"k": "6-2.11", "t": "pg", "q": "Di mana 不 diletakkan? 我___去___商店___买___东西。(Saya tidak pergi ke toko belanja.)", "o": ["sebelum 去", "sebelum 商店", "sebelum 买", "sebelum 东西"], "a": 0, "x": "不 diletakkan sebelum kata kerja pertama."}, {"k": "6-2.12", "t": "su", "w": ["他", "去", "图书馆", "看", "书"], "s": "他去图书馆看书。", "alt": [], "p": "Tā qù túshūguǎn kàn shū.", "x": "Dia pergi ke perpustakaan untuk membaca buku."}, {"k": "6-2.13", "t": "su", "w": ["我", "明天", "去", "医院", "看病"], "s": "我明天去医院看病。", "alt": ["明天我去医院看病。"], "p": "Wǒ míngtiān qù yīyuàn kànbìng.", "x": "Besok saya pergi ke rumah sakit untuk berobat."}, {"k": "6-2.14", "t": "su", "w": ["爸爸", "开车", "去", "公司"], "s": "爸爸开车去公司。", "alt": [], "p": "Bàba kāichē qù gōngsī.", "x": "Ayah pergi ke kantor dengan menyetir mobil."}, {"k": "6-2.15", "t": "bs", "s": "我吃饭去饭店。", "sp": "Wǒ chīfàn qù fàndiàn.", "n": "", "ok": false, "b": "我去饭店吃饭。", "bp": "Wǒ qù fàndiàn chīfàn.", "x": "Pergi ke tempat dulu, baru kegiatannya."}, {"k": "6-2.16", "t": "bs", "s": "朋友来我家喝茶。", "sp": "Péngyou lái wǒ jiā hē chá.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 来 + tempat + KK + O."}]}, {"id": "6-3", "pel": 6, "judul": "Kata tanya 怎么 (bagaimana caranya)", "kode": "一04, 一46", "rumus": ["S + 怎么 + KK？ (bagaimana cara …)", "怎么 + 没/不 + KK？ (kenapa tidak …)"], "jelas": ["怎么 (zěnme) + kata kerja menanyakan CARA: 我们怎么去？ = kita ke sana naik apa / bagaimana caranya? Jawabannya biasanya cara: 坐车去, 开车去.", "怎么 selalu diletakkan langsung sebelum kata kerja. 这个字怎么写？ = huruf ini cara menulisnya bagaimana? 怎么说？ = bagaimana mengatakannya?", "怎么 + 没/不 + kata kerja menanyakan alasan dengan nada heran: 你怎么没来？ = kok kamu tidak datang?", "Seperti kata tanya lain, 怎么 tidak dipakai bersama 吗.", "Jangan tertukar dengan 怎么样 (pelajaran 10) yang menanyakan pendapat atau keadaan: 这件衣服怎么样？ = baju ini bagaimana (bagus tidak)?"], "poin": ["怎么 + KK = bagaimana caranya.", "Langsung sebelum kata kerja.", "怎么没/不 = kok tidak.", "Beda dengan 怎么样 (pendapat)."], "contoh": [{"zh": "好的。我们怎么去？", "py": "Hǎo de. Wǒmen zěnme qù?", "id": "Baiklah. Kita ke sana naik apa?", "b": true, "tr": "06-5"}, {"zh": "这个字怎么写？", "py": "Zhège zì zěnme xiě?", "id": "Huruf ini cara menulisnya bagaimana?", "b": false, "tr": null}, {"zh": "\"谢谢\"用印尼语怎么说？", "py": "\"Xièxie\" yòng Yìnníyǔ zěnme shuō?", "id": "\"谢谢\" dalam bahasa Indonesia bagaimana mengatakannya?", "b": false, "tr": null}, {"zh": "你怎么没来？", "py": "Nǐ zěnme méi lái?", "id": "Kok kamu tidak datang?", "b": false, "tr": null}, {"zh": "我们坐车去。", "py": "Wǒmen zuò chē qù.", "id": "Kita naik kendaraan.", "b": false, "tr": null}, {"zh": "这个字怎么读？", "py": "Zhège zì zěnme dú?", "id": "Huruf ini dibaca bagaimana?", "b": false, "tr": null}, {"zh": "你怎么去机场？——坐出租车去。", "py": "Nǐ zěnme qù jīchǎng? — Zuò chūzūchē qù.", "id": "Kamu ke bandara naik apa? — Naik taksi.", "b": false, "tr": null}, {"zh": "\"苹果\"用印尼语怎么说？", "py": "\"Píngguǒ\" yòng Yìnníyǔ zěnme shuō?", "id": "Bagaimana mengatakan \"苹果\" dalam bahasa Indonesia?", "b": false, "tr": null}, {"zh": "他怎么还没来？", "py": "Tā zěnme hái méi lái?", "id": "Kenapa dia belum datang juga?", "b": false, "tr": null}], "salah": [{"s": "我们去怎么？", "sp": "Wǒmen qù zěnme?", "n": "", "b": "我们怎么去？", "bp": "Wǒmen zěnme qù?", "a": "怎么 sebelum kata kerja."}, {"s": "这个字怎么写吗？", "sp": "Zhège zì zěnme xiě ma?", "n": "", "b": "这个字怎么写？", "bp": "Zhège zì zěnme xiě?", "a": "Sudah ada kata tanya."}], "latihan": [{"k": "6-3.0", "t": "pg", "q": "你___去机场？——坐车去。", "o": ["怎么", "什么", "哪儿", "几"], "a": 0, "x": "Menanyakan cara = 怎么.", "f": "你怎么去机场？——坐车去。", "fp": "Nǐ zěnme qù jīchǎng? — Zuò chē qù."}, {"k": "6-3.1", "t": "pg", "q": "这个汉字___读？", "o": ["怎么", "怎么样", "谁", "哪"], "a": 0, "x": "Cara membaca = 怎么 + KK.", "f": "这个汉字怎么读？", "fp": "Zhège Hànzì zěnme dú?"}, {"k": "6-3.2", "t": "pg", "q": "Jawaban yang cocok untuk 你怎么来学校？", "o": ["我开车来。", "我在学校。", "我是学生。", "我很好。"], "a": 0, "x": "Ditanya cara, jawab cara."}, { ?", "x": "怎么 harus sebelum kata kerja."}]}, {"id": "7-1", "pel": 7, "judul": "Menyebut waktu (2): jam", "kode": "一44", "rumus": ["angka + 点 (jam) + angka + 分 (menit)", "半 = setengah (… lewat 30)", "早上/上午/中午/下午/晚上 + jam"], "jelas": ["Jam = angka + 点 (diǎn): 八点 = jam 8. Menit = angka + 分 (fēn): 八点十分 = 8.10. Jam 2 dibaca 两点, bukan 二点.", "半 (bàn) = setengah jam: 六点半 = 6.30. Perhatikan: dalam bahasa Indonesia 6.30 disebut \"setengah tujuh\", tetapi Mandarin menyebut 六点半 (enam lewat setengah). Ini sering tertukar!", "Bagian hari diletakkan sebelum jam: 早上七点 (jam 7 pagi), 上午十点 (jam 10 pagi), 中午十二点, 下午两点 (jam 2 siang), 晚上六点半 (jam 6.30 sore/malam).", "Bertanya jam: 现在几点？ Bertanya kapan: 你几点下班？ / 你什么时候来？", "Urutan besar ke kecil tetap berlaku: 明天下午两点 (besok, siang, jam 2)."], "poin": ["点 = jam, 分 = menit, 半 = setengah.", "六点半 = 6.30 (bukan \"setengah enam\").", "两点, bukan 二点.", "Bagian hari sebelum jam."], "contoh": [{"zh": "现在几点？", "py": "Xiànzài jǐ diǎn?", "id": "Sekarang jam berapa?", "b": true, "tr": "07-1"}, {"zh": "我上午十点十分有课。", "py": "Wǒ shàngwǔ shí diǎn shí fēn yǒu kè.", "id": "Aku ada kelas jam sepuluh lewat sepuluh pagi.", "b": true, "tr": "07-1"}, {"zh": "我们下午两点见吧。", "py": "Wǒmen xiàwǔ liǎng diǎn jiàn ba.", "id": "Kita ketemu jam dua siang saja ya.", "b": true, "tr": "07-1"}, {"zh": "我晚上六点半下班。", "py": "Wǒ wǎnshang liù diǎn bàn xiàbān.", "id": "Aku pulang kerja jam 6.30 sore.", "b": false, "tr": null}, {"zh": "明天下午两点还上课呢，四点半下课。", "py": "Míngtiān xiàwǔ liǎng diǎn hái shàngkè ne, sì diǎn bàn xiàkè.", "id": "Besok jam dua siang masih ada kelas, selesai jam setengah lima.", "b": true, "tr": "07-3"}, {"zh": "我每天早上六点半起床。", "py": "Wǒ měi tiān zǎoshang liù diǎn bàn qǐchuáng.", "id": "Setiap pagi saya bangun jam setengah tujuh.", "b": false, "tr": null}, {"zh": "现在九点十五分。", "py": "Xiànzài jiǔ diǎn shíwǔ fēn.", "id": "Sekarang jam sembilan lewat lima belas menit.", "b": false, "tr": null}, {"zh": "电影晚上八点开始。", "py": "Diànyǐng wǎnshang bā diǎn kāishǐ.", "id": "Filmnya mulai jam d , 下午, 两点) boleh di awal kalimat atau tepat setelah subjek, tetapi selalu SEBELUM kata kerja: 我明天去 / 明天我去. Tidak boleh di akhir: 我去明天 salah.", "Kata keterangan (副词) seperti 也, 都, 还, 很, 不, 常常, 再, 马上 hanya boleh setelah subjek dan sebelum kata kerja/sifat. Kata keterangan TIDAK boleh di awal kalimat: 也我是学生 salah, harus 我也是学生.", "Jika ada beberapa kata keterangan, urutan umum: 也/都 dulu, baru 不/很: 我们都不去 (kami semua tidak pergi), 他也很忙.", "Jika ada kata waktu dan kata keterangan: waktu dulu, lalu kata keterangan: 我明天也去, 他下午还上课."], "poin": ["Waktu: awal kalimat atau setelah subjek, sebelum KK.", "Kata keterangan: hanya setelah subjek, sebelum KK.", "也/都 sebelum 不/很.", "Waktu sebelum kata keterangan."], "contoh": [{"zh": "我明天下午两点还上课呢。", "py": "Wǒ míngtiān xiàwǔ liǎng diǎn hái shàngkè ne.", "id": "Besok jam dua siang aku masih ada kelas.", "b": true, "tr": "07-3"}, {"zh": "下午我想去电影院看电影。", "py": "Xiàwǔ wǒ xiǎng qù diànyǐngyuàn kàn diànyǐng.", "id": "Siang ini aku mau ke bioskop nonton film.", "b": true, "tr": "07-3"}, {"zh": "认识你我也很高兴。", "py": "Rènshi nǐ wǒ yě hěn gāoxìng.", "id": "Aku juga senang berkenalan denganmu.", "b": true, "tr": "02-5"}, {"zh": "我们都不去。", "py": "Wǒmen dōu bú qù.", "id": "Kami semua tidak pergi.", "b": false, "tr": null}, {"zh": "他今天也很忙。", "py": "Tā jīntiān yě hěn máng.", "id": "Hari ini dia juga sibuk.", "b": false, "tr": null}, {"zh": "我妈妈也很喜欢喝茶。", "py": "Wǒ māma yě hěn xǐhuan hē chá.", "id": "Ibu saya juga sangat suka minum teh.", "b": false, "tr": null}, {"zh": "他们明天都不来。", "py": "Tāmen míngtiān dōu bù lái.", "id": "Besok mereka semua tidak datang.", "b": false, "tr": null}, {"zh": "今天下午我还有一节课。", "py": "Jīntiān xiàwǔ wǒ hái yǒu yì jié kè.", "id": "Sore ini saya masih ada satu jam pelajaran.", "b": false, "tr": null}, {"zh": "我今天不去学校。", "py": "Wǒ jīntiān bú qù xuéxiào.", "id": "Hari ini saya tidak pergi ke sekolah.", "b": false, "tr": null}], "salah": [{"s": "也我是学生。", "sp": "Yě wǒ shì xuéshēng.", "n": "", "b": "我也是学生。", "bp": "Wǒ yě shì xuéshēng.", "a": + 很 + KS."}, {"k": "7-3.11", "t": "pg", "q": "Mana yang benar?", "o": ["我今天不去学校。", "我不今天去学校。", "我今天去不学校。", "不我今天去学校。"], "a": 0, "x": "Kata waktu dulu, lalu 不 langsung sebelum kata kerja."}, {"k": "7-3.12", "t": "su", "w": ["我", "妈妈", "也", "很", "喜欢", "喝", "茶"], "s": "我妈妈也很喜欢喝茶。", "alt": [], "p": "Wǒ māma yě hěn xǐhuan hē chá.", "x": "Ibu saya juga sangat suka minum teh."}, {"k": "7-3.13", "t": "su", "w": ["他们", "明天", "都", "不", "来"], "s": "他们明天都不来。", "alt": ["明天他们都不来。"], "p": "Tāmen míngtiān dōu bù lái.", "x": "Besok mereka semua tidak datang."}, {"k": "7-3.14", "t": "su", "w": ["我", "晚上", "还", "要", "工作"], "s": "我晚上还要工作。", "alt": ["晚上我还要工作。"], "p": "Wǒ wǎnshang hái yào gōngzuò.", "x": "Malam ini saya masih harus bekerja."}, {"k": "7-3.15", "t": "bs", "s": "他们也都是学生。", "sp": "Tāmen yě dōu shì xuéshēng.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: jika 也 dan 都 bersama, urutannya 也都."}, {"k": "7-3.16", "t": "bs", "s": "我们去都商店。", "sp": "Wǒmen qù dōu shāngdiàn.", "n": "", "ok": false, "b": "我们都去商店。", "bp": "Wǒmen dōu qù shāngdiàn.", "x": "都 harus sebelum kata kerja."}]}, {"id": "7-4", "pel": 7, "judul": "Partikel 呢 (2): melunakkan dan \"lagi/masih\"", "kode": "一22", "rumus": ["Kalimat tanya (dengan kata tanya) + 呢？", "S + (还/在) + KK + 呢 (sedang/masih)"], "jelas": ["Pada pertanyaan yang sudah memakai kata tanya, 呢 di akhir membuat nada lebih lembut dan akrab: 你在哪儿呢？ (kamu lagi di mana sih?). 我们在哪儿见呢？", "Pada kalimat berita, 呢 menekankan bahwa keadaan sedang berlangsung atau masih berlanjut: 我在家里呢 (aku lagi di rumah), 明天下午还上课呢 (masih ada kelas).", "还没……呢 = belum … (masih belum): 还没吃饭呢 = belum makan.", "Bedakan dengan 呢 (1) \"kalau X?\" (pelajaran 4). Di sini 呢 menempel pada kalimat lengkap.", "呢 tidak dipakai bersama 吗 dalam satu kalimat."], "poin": ["Kata tanya + … + 呢？ = lebih lembut.", "Kalimat berita + 呢 = sedang/masih.", "还没 + KK + 呢 = belum.", "Tidak bersama 吗."], "contoh": [{"zh": "喂，你在哪儿呢？", "py": "Wèi, nǐ zài nǎr ne?", "id": "Halo, kamu lagi di mana?", "b": true, "tr": "07-5"}, {"zh": "我在家里呢。", "py": "Wǒ zài jiā lǐ ne.", "id": "Aku lagi di rumah.", "b": true, "tr": "07-5"}, {"zh": "小胡，还没吃饭呢？——没吃呢。", "py": "Xiǎo Hú, hái méi chīfàn ne? — Méi chī ne.", "id": "Xiao Hu, belum makan juga? — Belum.", "b": true, "tr": "08-5"}, {"zh": "我们在哪儿见呢？", "py": "Wǒmen zài nǎr jiàn ne?", "id": "Kita ketemu di mana ya?", "b": true, "tr": "08-3"}, {"zh": "它在桌子下呢。", "py": "Tā zài zhuōzi xià ne.", "id": "Dia (kucing) di bawah meja.", "b": true, "tr": "08-1"}, {"zh": "你在看什么呢？", "py": "Nǐ zài kàn shénme ne?", "id": "Kamu sedang menonton apa?", "b": false, "tr": null}, {"zh": "爸爸还在睡觉呢。", "py": "Bàba hái zài shuìjiào ne.", "id": "Ayah masih tidur.", "b": false, "tr": null}, {"zh": "我们去哪儿吃饭呢？", "py": "Wǒmen qù nǎr chīfàn ne?", "id": "Kita makan di mana, ya?", "b": false, "tr": null}, {"zh": "他还没来呢。", "py": "Tā hái méi lái ne.", "id": "Dia belum datang.", "b": false, "tr": null}], "salah": [{"s": "你在哪儿吗？", "sp": "Nǐ zài nǎr ma?", "n": "", "b": "你在哪儿呢？", "bp": "Nǐ zài nǎr ne?", "a": "Kata tanya tidak bersama 吗; 呢 boleh."}, {"s": "我还没吃饭了。", "sp": "Wǒ hái méi chīfàn le.", "n": "", "b": "我还没吃饭呢。", "bp": "Wǒ hái méi chīfàn ne.", "a": "还没 tidak memakai 了; pakai 呢."}], "latihan": [{"k": "7-4.0", "t": "pg", "q": "你在做什么___？", "o": ["呢", "吗", "吧", "是"], "a": 0, "x": "Kata tanya + 呢 (lembut).", "f": "你在做什么呢？", "fp": "Nǐ zài zuò shénme ne?"}, {"k": "7-4.1", "t": "pg", "q": "我还没吃饭___。", "o": ["呢", "了", "吗", "吧"], "a": 0, "x": "还没……呢 = belum.", "f": "我还没吃饭呢。", "fp": "Wǒ hái méi chīfàn ne."}, {"k": "7-4.2", "t": "pg", "q": "Mana yang SALAH?", "o": ["你去哪儿呢？", "你去哪儿吗？", "我在家呢。", "他还没来呢。"], "a": 1, "x": "哪儿 sudah kata tanya; jangan + 吗."}, {"k": "7-4.3", "t": "bs", "s": "他还没起床了。", "sp": "Tā hái méi qǐchuáng le.", "n": "", "ok": false, "b": "他还没起床呢。", "bp": "Tā hái méi qǐchuáng ne.", "x": "Setelah 还没 pakai 呢, bukan 了."}, {"k": "7-4.4", "t": "bs", "s": "我在学校呢。", "sp": "Wǒ zài xuéxiào ne.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "7-4.5", "t  Indonesia \"di atas meja\".", "Bentuk satu suku (上, 下, 里, 外, 前, 后) biasanya menempel langsung ke benda: 桌子上, 房间里, 学校外. Bentuk dua suku (上边, 前边, 里边, 左边, 右边, 旁边) bisa menempel ke benda atau berdiri sendiri: 学校前边, 前边有一家商店.", "Arah mata angin: 东 (timur), 南 (selatan), 西 (barat), 北 (utara), dengan bentuk 东边, 西边, dan seterusnya.", "Nama negara dan kota TIDAK memakai 里: 我在北京 (bukan 我在北京里). Tetapi benda dan ruangan memakai: 在家里, 在房间里, 在教室里.", "Kata arah sering dipakai dengan 在 (pelajaran 8): 书在桌子上; dan dengan 有 (pelajaran 9): 桌子上有一本书."], "poin": ["Benda + kata arah (terbalik dari bahasa Indonesia).", "上下里外前后 menempel; 前边/左边 dll. bisa berdiri sendiri.", "Kota/negara tanpa 里.", "东南西北 + 边."], "contoh": [{"zh": "它在桌子下呢。", "py": "Tā zài zhuōzi xià ne.", "id": "Dia di bawah meja.", "b": true, "tr": "08-1"}, {"zh": "房间外有一只小猫。", "py": "Fángjiān wài yǒu yì zhī xiǎomāo.", "id": "Di luar kamar ada seekor kucing kecil.", "b": true, "tr": "08-1"}, {"zh": "学校前边有一家电影院。", "py": "Xuéxiào qiánbian yǒu yì jiā diànyǐngyuàn.", "id": "Di depan sekolah ada sebuah bioskop.", "b": true, "tr": "09-1"}, {"zh": "我们七点在电影院外边见。", "py": "Wǒmen qī diǎn zài diànyǐngyuàn wàibian jiàn.", "id": "Kita ketemu di luar bioskop jam tujuh.", "b": true, "tr": "09-1"}, {"zh": "杯子在这边。", "py": "Bēizi zài zhèbiān.", "id": "Cangkirnya di sebelah sini.", "b": true, "tr": "10-1"}, {"zh": "医院在学校东边。", "py": "Yīyuàn zài xuéxiào dōngbian.", "id": "Rumah sakit di sebelah timur sekolah.", "b": false, "tr": null}, {"zh": "猫在椅子下边。", "py": "Māo zài yǐzi xiàbian.", "id": "Kucing ada di bawah kursi.", "b": false, "tr": null}, {"zh": "商店在医院旁边。", "py": "Shāngdiàn zài yīyuàn pángbiān.", "id": "Toko ada di sebelah rumah sakit.", "b": false, "tr": null}, {"zh": "杯子里有水。", "py": "Bēizi lǐ yǒu shuǐ.", "id": "Di dalam cangkir ada air.", "b": false, "tr": null}, {"zh": "我家后边有一个大商店。", "py": "Wǒ jiā hòubian yǒu yí gè dà shāngdiàn.", "id": "Di belakang rumah saya ada sebuah toko besar.", "b": false, "tr": null}], "salah": [{"s": "上桌子", "sp": "Shàng zhuōzi", "n": "", "b": "桌子上", "bp": "Zhuōzi shàng", "a": "Kata arah setelah benda."}, {"s": "我在北京里。", "sp": "Wǒ zài Běijīng lǐ.", "n": "", "b": "我在北京。", "bp": "Wǒ zài Běijīng.", "a": "Kota tidak memakai 里."}, {"s": "在前边学校", "sp": "Zài qiánbian xuéxiào", "n": "", "b": "在学校前边", "bp": "Zài xuéxiào qiánbian", "a": "Benda dulu, lalu arah."}], "latihan": [{"k": "8-1.0", "t": "pg", "q": "\"di atas meja\" =", "o": ["上桌子", "桌子上", "在上桌子", "桌子下"], "a": 1, "x": "Benda + 上."}, {"k": "8-1.1", "t": "pg", "q": "\"di dalam kamar\" =", "o": ["房间里", "里房间", "房间外", "房间上"], "a": 0, "x": "Benda + 里."}, {"k": "8-1.2", "t": "pg", "q": "\"di depan sekolah\" =", "o": ["前边学校", "学校前边", "学校后边", "前学校边"], "a": 1, "x": "Benda + 前边."}, {"k": "8-1.3", "t": "pg", "q": "猫在椅子___。(di bawah)", "o": ["下", "上", "里", "前"], "a": 0, "x": "下 = bawah.", "f": "猫在椅子下。", "fp": "Māo zài yǐzi xià."}, {"k": "8-1.4", "t": "pg", "q": "\"sebelah barat\" =", "o": ["东边", "南边", "西边", "北边"], "a": 2, "x": "西 = barat."}, {"k": "8-1.5", "t": "bs", "s": "我在雅加达里工作。", "sp": "Wǒ zài Yǎjiādá lǐ gōngzuò.", "n": "", "ok": false, "b": "我在雅加达工作。", "bp": "Wǒ zài Yǎjiādá gōngzuò.", "x": "Nama kota tidak memakai 里."}, {"k": "8-1.6", "t": "bs", "s": "书在桌子上。", "sp": "Shū zài zhuōzi shàng.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "8-1.7", "t": "su", "w": ["手机", "在", "桌子", "上"], "s": "手机在桌子上。", "alt": [], "p": "Shǒujī zài zhuōzi shàng.", "x": "HP di atas meja."}, {"k": "8-1.8", "t": "su", "w": ["超市", "在", "医院", "后边"], "s": "超市在医院后边。", "alt": [], "p": "Chāoshì zài yīyuàn hòubian.", "x": "Supermarket di belakang rumah sakit."}, {"k": "8-1.9", "t": "su", "w": ["我", "在", "房间", "里"], "s": "我在房间里。", "alt": [], "p": "Wǒ zài fángjiān li.", "x": "Saya di dalam kamar."}, {"k": "8-1.10", "t": "pg", "q": "\"sebelah kiri\" =", "o": ["左边", "右边", "前边", "后边"], "a": 0, "x": "左边 = kiri, 右边 = kanan."}, {"k": "8-1.11", "t": "pg", "q": "小狗在桌子___。(di bawah)", "o": ["下边", "上边", "里边", "前边"], "a": 0, "x": "Di bawah = 下边.", "f": "小狗在桌子下边。", "fp": "Xiǎogǒu zài zhuōzi xiàbian."}, {"k": "8-1.12", "t": "pg", "q": "\"di luar rumah\" =", "o": ["家外边", "外边家", "家里边", "在外家边"], "a": 0, "x": "Benda dulu, lalu kata arah: 家 + 外边."}, {"k": "8-1.13", "t": "su", "w": ["猫", "在", "椅子", "下边"], "s": "猫在椅子下边。", "alt": [], "p": "Māo zài yǐzi xiàbian.", "x": "Kucing ada di bawah kursi."}, {"k": "8-1.14", "t": "su", "w": ["杯子", "里", "有", "水"], "s": "杯子里有水。", "alt": [], "p": "Bēizi lǐ yǒu shuǐ.", "x": "Di dalam cangkir ada air."}, {"k": "8-1.15", "t": "su", "w": ["商店", "在", "医院", "旁边"], "s": "商店在医院旁边。", "alt": [], "p": "Shāngdiàn zài yīyuàn pángbiān.", "x": "Toko ada di sebelah rumah sakit."}, {"k": "8-1.16", "t": "bs", "s": "我的手机在里书包。", "sp": "Wǒ de shǒujī zài lǐ shūbāo.", "n": "", "ok": false, "b": "我的手机在书包里。", "bp": "Wǒ de shǒujī zài shūbāo lǐ.", "x": "Kata arah (里) diletakkan setelah benda."}, {"k": "8-1.17", "t": "bs", "s": "学校左边有一个商店。", "sp": "Xuéxiào zuǒbian yǒu yí gè shāngdiàn.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: benda + kata arah + 有."}]}, {"id": "8-2", "pel": 8, "judul": "Kata depan 在 (di)", "kode": "一16", "rumus": ["S + 在 + tempat (berada di)", "S + 在 + tempat + KK (melakukan di)", "S + 不在 + tempat"], "jelas": ["在 (zài) punya dua peran. Sebagai kata kerja: \"berada di\". 我在家 = saya (berada) di rumah. 它在哪儿呢？ = dia di mana?", "Sebagai kata depan: menunjukkan tempat kegiatan, dan seluruh frasa 在 + tempat diletakkan SEBELUM kata kerja: 我爸爸在医院工作 = ayah saya bekerja di rumah sakit.", "Ini kebalikan dari bahasa Indonesia \"bekerja di rumah sakit\". Jangan menaruh 在 + tempat di akhir kalimat: 我工作在医院 salah untuk HSK 1.", "Ingkar: 不在. 他不在家 = dia tidak di rumah. 我不在学校吃饭 = saya tidak makan di sekolah.", "Kata keterangan seperti 也/都/不 diletakkan sebelum 在: 我爸爸也在医院工作.", "在 juga punya arti \"sedang\" (pelajaran 11). 我在看书 = saya sedang membaca."], "poin": ["在 + tempat = berada di.", "在 + tempat + KK (tempat sebelum kata kerja).", "Ingkar: 不在.", "也/都/不 sebelum 在."], "contoh": [{"zh": "我爸爸也在医院工作。", "py": "Wǒ bàba yě zài yīyuàn gōngzuò.", "id": "Ayahku juga bekerja di rumah sakit.", "b": true, "tr": "08-5"}, {"zh": "我在学校吃午饭。", "py": "Wǒ zài xuéxiào chī wǔfàn.", "id": "Aku makan siang di sekolah.", "b": true, "tr": "08-3"}, {"zh": "喂，你在哪儿呢？——我在家里呢。", "py": "Wèi, nǐ zài nǎr ne? — Wǒ zài jiā lǐ ne.", "id": "Halo, kamu di mana? — Aku di rumah.", "b": true, "tr": "07-5"}, {"zh": "他不在家。", "py": "Tā bú zài jiā.", "id": "Dia tidak di rumah.", "b": false, "tr": null}, {"zh": "在学校书店前见吧。", "py": "Zài xuéxiào shūdiàn qián jiàn ba.", "id": "Ketemu di depan toko buku sekolah saja.", "b": true, "tr": "08-3"}, {"zh": "我哥哥在北京工作。", "py": "Wǒ gēge zài Běijīng gōngzuò.", "id": "Kakak laki-laki saya bekerja di Beijing.", "b": false, "tr": null}, {"zh": "妈妈不在家，她在超市。", "py": "Māma bú zài jiā, tā zài chāoshì.", "id": "Ibu tidak di rumah, dia di supermarket.", "b": false, "tr": null}, {"zh": "我们在饭店吃饭吧。", "py": "Wǒmen zài fàndiàn chīfàn ba.", "id": "Ayo kita makan di restoran.", "b": false, "tr": null}, {"zh": "你朋友在哪儿学习汉语？", "py": "Nǐ péngyou zài nǎr xuéxí Hànyǔ?", "id": "Temanmu belajar bahasa Mandarin di mana?", "b": false, "tr": null}], "salah": [{"s": "我工作在医院。", "sp": "Wǒ gōngzuò zài yīyuàn.", "n": "", "b": "我在医院工作。", "bp": "Wǒ zài yīyuàn gōngzuò.", "a": "在 + tempat sebelum kata kerja."}, {"s": "我在家不吃饭。", "sp": "Wǒ zài jiā bù chīfàn.", "n": "tidak makan di rumah", "b": "我不在家吃饭。", "bp": "Wǒ bú zài jiā chīfàn.", "a": "不 sebelum 在 untuk menyangkal \"di rumah\"."}], "latihan": [{"k": "8-2.0", "t": "pg", "q": "我___家里。", "o": ["在", "是", "有", "去"], "a": 0, "x": "Berada di = 在.", "f": "我在家里。", "fp": "Wǒ zài jiā lǐ."}, {"k": "8-2.1", "t": "pg", "q": "\"Saya belajar di perpustakaan\" =", "o": ["我学习在图书馆。", "我在图书馆学习。", "在我图书馆学习。", "我图书馆在学习。"], "a": 1, "x": "在 + tempat + KK."}, {"k": "8-2.2", "t": "pg", "q": "他___家，他在公司。", "o": ["不在", "没是", "不是", "没有在"], "a": 0, "x": "Ingkar 在 = 不在.", "f": "他不在家，他在公司。", "fp": "Tā bú zài jiā, tā zài gōngsī."}, {"k": "8-2.3", "t": "bs", "s": "我妈妈在超市工作。", "sp": "Wǒ māma zài chāosh "我们在饭店吃饭吧。", "alt": [], "p": "Wǒmen zài fàndiàn chīfàn ba.", "x": "Ayo kita makan di restoran."}, {"k": "8-2.16", "t": "bs", "s": "我在家看电视。", "sp": "Wǒ zài jiā kàn diànshì.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 在 + tempat + KK."}, {"k": "8-2.17", "t": "bs", "s": "他看书在图书馆。", "sp": "Tā kàn shū zài túshūguǎn.", "n": "", "ok": false, "b": "他在图书馆看书。", "bp": "Tā zài túshūguǎn kàn shū.", "x": "在 + tempat harus sebelum kata kerja."}]}, {"id": "8-3", "pel": 8, "judul": "Kata kerja bantu 能 (bisa karena kondisi)", "kode": "一02", "rumus": ["S + 能 + KK", "S + 不能 + KK", "能……吗？"], "jelas": ["能 (néng) = bisa/mampu karena kondisi memungkinkan: ada waktu, sehat, sempat, ukurannya cocok, atau diizinkan. 下午两点你能到吗？ = jam dua kamu bisa sampai?", "Bandingkan dengan 会 (kemampuan hasil belajar). 我会游泳 = saya bisa berenang (sudah belajar). 我今天不能游泳 = hari ini saya tidak bisa berenang (misalnya sakit).", "能 juga dipakai untuk izin: 这儿能坐吗？ = di sini boleh duduk? Jawaban: 能 / 不能. (Untuk izin, 可以 lebih umum; lihat pelajaran 13.)", "Ingkar: 不能. Tidak pernah 没能 di HSK 1.", "Jawaban singkat: 能。/ 不能。"], "poin": ["能 = bisa karena kondisi/kesempatan.", "会 = bisa karena belajar.", "Ingkar 不能.", "Juga untuk izin (seperti 可以)."], "contoh": [{"zh": "下午两点你能到吗？——我能到。", "py": "Xiàwǔ liǎng diǎn nǐ néng dào ma? — Wǒ néng dào.", "id": "Jam dua siang kamu bisa sampai? — Bisa.", "b": true, "tr": "08-3"}, {"zh": "小雪能穿，买一件吧。", "py": "Xiǎoxuě néng chuān, mǎi yí jiàn ba.", "id": "Xiaoxue bisa memakainya, beli satu yuk.", "b": true, "tr": "10-5"}, {"zh": "小明能穿吗？——不能。", "py": "Xiǎomíng néng chuān ma? — Bù néng.", "id": "Xiaoming bisa pakai juga? — Tidak bisa.", "b": true, "tr": "10-5"}, {"zh": "你什么时候能到饭店？", "py": "Nǐ shénme shíhou néng dào fàndiàn?", "id": "Kapan kamu bisa sampai di restoran?", "b": true, "tr": "11-1"}, {"zh": "我今天很忙，不能去。", "py": "Wǒ jīntiān hěn máng, bù néng qù.", "id": "Hari ini saya sibuk, tidak bisa pergi.", "b": false, "tr": null}, {"zh": "明天你能来吗？——能。", "py": "Míngtiān nǐ néng lái ma? — Néng.", "id": "Besok kamu bisa datang? — Bisa.", "b": false, "tr": null}, {"zh": "我今天有事，不能去看电影。", "py": "Wǒ jīntiān yǒu shì, bù néng qù kàn diànyǐng.", "id": "Hari ini saya ada urusan, tidak bisa menonton film.", "b": false, "tr": null}, {"zh": "你能帮我一下吗？", "py": "Nǐ néng bāng wǒ yíxià ma?", "id": "Bisakah kamu membantu saya sebentar?", "b": false, "tr": null}, {"zh": "他病了，不能来上课。", "py": "Tā bìng le, bù néng lái shàngkè.", "id": "Dia sakit, tidak bisa datang ke kelas.", "b": false, "tr": null}], "salah": [{"s": "我能说汉语，我学了两年。", "sp": "Wǒ néng shuō Hànyǔ, wǒ xué le liǎng nián.", "n": "", "b": "我会说汉语，我学了两年。", "bp": "Wǒ huì shuō Hànyǔ, wǒ xué le liǎng nián.", "a": "Kemampuan hasil belajar lebih tepat 会."}, {"s": "我没能去。", "sp": "Wǒ méi néng qù.", "n": "", "b": "我不能去。", "bp": "Wǒ bù néng qù.", "a": "HSK 1: ingkar 能 = 不能."}], "latihan": [{"k": "8-3.0", "t": "pg", "q": "我今天有事，不___去。", "o": ["能", "会", "是", "有"], "a": 0, "x": "Tidak bisa karena ada urusan (kondisi) = 不能.", "f": "我今天有事，不能去。", "fp": "Wǒ jīntiān yǒu shì, bù néng qù."}, {"k": "8-3.1", "t": "pg", "q": "我___说汉语，我学了一年。", "o": ["会", "能", "在", "是"], "a": 0, "x": "Hasil belajar = 会.", "f": "我会说汉语，我学了一年。", "fp": "Wǒ huì shuō Hànyǔ, wǒ xué le yì nián."}, {"k": "8-3.2", "t": "pg", "q": "明天你___来吗？——能。", "o": ["能", "会", "是", "在"], "a": 0, "x": "Jawaban 能 → pertanyaan 能.", "f": "明天你能来吗？——能。", "fp": "Míngtiān nǐ néng lái ma? — Néng."}, {"k": "8-3.3", "t": "pg", "q": "他病了，今天不___上班。", "o": ["能", "会", "想", "是"], "a": 0, "x": "Kondisi sakit = 不能.", "f": "他病了，今天不能上班。", "fp": "Tā bìng le, jīntiān bù néng shàngbān."}, {"k": "8-3.4", "t": "bs", "s": "我会开车，可是今天不能开。", "sp": "Wǒ huì kāichē, kěshì jīntiān bù néng kāi.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 会 (bisa menyetir) dan 不能 (kondisi hari ini)."}, {"k": "8-3.5", "t": "bs", "s": "这件衣服太小了，我不会穿。", "sp": "Zhè jiàn yīfu tài xiǎo le, wǒ bú huì chuān.", "n": "", "ok": false, "b": "这件衣服太小了，我不能穿。", "bp": "Zhè jiàn yīfu tài xiǎo le, wǒ bù néng chuān.", "x": "Ukuran tid  + O？ (sudah … belum)", "S + 是不是 + …？"], "jelas": ["Cara lain membuat pertanyaan ya/tidak: ulang kata kerja atau sifat dalam bentuk positif dan negatif. 你去不去？ = kamu pergi atau tidak?", "不 di tengah bernada netral (bu): qù bu qù, hǎo bu hǎo.", "Untuk kejadian yang sudah lewat, pakai V没V: 你开车没开车？ = kamu tadi menyetir atau tidak? 弟弟起床没起床？ = adik sudah bangun belum?", "Kata kerja dua suku sering hanya mengulang suku pertama: 喜不喜欢 (喜欢不喜欢 juga benar).", "是不是 bisa diselipkan untuk memastikan: 它是不是在超市后边？ = apakah (betul) di belakang supermarket?", "Jangan menambah 吗! Dan kata keterangan seperti 也/都/很 tidak bisa dipakai dengan pola ini: 你也去不去 salah; pakai 你也去吗？"], "poin": ["KK不KK / KS不KS = … atau tidak?", "KK没KK = sudah … belum (lampau).", "是不是 untuk memastikan.", "Tanpa 吗, tanpa 很/也/都."], "contoh": [{"zh": "它是不是在超市后边？", "py": "Tā shì bu shì zài chāoshì hòubian?", "id": "Apakah restorannya di belakang supermarket?", "b": true, "tr": "11-1"}, {"zh": "你开车没开车？", "py": "Nǐ kāichē méi kāichē?", "id": "Kamu menyetir atau tidak?", "b": true, "tr": "11-1"}, {"zh": "他今天去不去那里？", "py": "Tā jīntiān qù bu qù nàlǐ?", "id": "Hari ini dia ke sana atau tidak?", "b": true, "tr": "11-5"}, {"zh": "弟弟起床没起床呢？", "py": "Dìdi qǐchuáng méi qǐchuáng ne?", "id": "Adikmu sudah bangun belum?", "b": true, "tr": "11-5"}, {"zh": "这个菜好不好吃？", "py": "Zhège cài hǎo bu hǎochī?", "id": "Masakan ini enak tidak?", "b": false, "tr": null}, {"zh": "你忙不忙？", "py": "Nǐ máng bu máng?", "id": "Kamu sibuk atau tidak?", "b": false, "tr": null}, {"zh": "你喜欢不喜欢喝茶？", "py": "Nǐ xǐhuan bu xǐhuan hē chá?", "id": "Kamu suka minum teh atau tidak?", "b": false, "tr": null}, {"zh": "他是不是你哥哥？", "py": "Tā shì bu shì nǐ gēge?", "id": "Apakah dia kakakmu?", "b": false, "tr": null}, {"zh": "你昨天看没看电影？", "py": "Nǐ zuótiān kàn méi kàn diànyǐng?", "id": "Kemarin kamu menonton film atau tidak?", "b": false, "tr": null}], "salah": [{"s": "你去不去吗？", "sp": "Nǐ qù bu qù ma?", "n": "", "b": "你去不去？", "bp": "Nǐ qù bu qù?", "a": "Tanpa 吗."}, {"s": "你很 呢.", "呢 di akhir menguatkan; kadang cukup sendiri.", "Ingkar: 没(在)."], "contoh": [{"zh": "还不知道，正在找呢。", "py": "Hái bù zhīdào, zhèngzài zhǎo ne.", "id": "Belum tahu, aku lagi mencarinya.", "b": true, "tr": "11-1"}, {"zh": "没起床呢，还在睡觉。", "py": "Méi qǐchuáng ne, hái zài shuìjiào.", "id": "Belum bangun, masih tidur.", "b": true, "tr": "11-5"}, {"zh": "有些人在看书，有些人睡觉了。", "py": "Yǒuxiē rén zài kàn shū, yǒuxiē rén shuìjiào le.", "id": "Ada yang sedang membaca buku, ada yang tertidur.", "b": true, "tr": "14-1"}, {"zh": "我在看电视呢。", "py": "Wǒ zài kàn diànshì ne.", "id": "Saya sedang menonton TV.", "b": false, "tr": null}, {"zh": "你在做什么？——我在做饭。", "py": "Nǐ zài zuò shénme? — Wǒ zài zuòfàn.", "id": "Kamu sedang apa? — Saya sedang memasak.", "b": false, "tr": null}, {"zh": "妈妈在做饭呢。", "py": "Māma zài zuòfàn ne.", "id": "Ibu sedang memasak.", "b": false, "tr": null}, {"zh": "他们正在上课。", "py": "Tāmen zhèngzài shàngkè.", "id": "Mereka sedang belajar di kelas.", "b": false, "tr": null}, {"zh": "弟弟正在打电话呢。", "py": "Dìdi zhèngzài dǎdiànhuà ne.", "id": "Adik sedang menelepon.", "b": false, "tr": null}, {"zh": "我没在睡觉，我在看电视。", "py": "Wǒ méi zài shuìjiào, wǒ zài kàn diànshì.", "id": "Saya tidak sedang tidur, saya sedang menonton TV.", "b": false, "tr": null}], "salah": [{"s": "我看电视在。", "sp": "Wǒ kàn diànshì zài.", "n": "", "b": "我在看电视。", "bp": "Wǒ zài kàn diànshì.", "a": "在 sebelum kata kerja."}, {"s": "我不在看书。", "sp": "Wǒ bú zài kàn shū.", "n": "", "b": "我没在看书。", "bp": "Wǒ méi zài kàn shū.", "a": "Ingkar \"sedang\" = 没(在)."}], "latihan": [{"k": "11-2.0", "t": "pg", "q": "他___睡觉，别说话。", "o": ["在", "是", "有", "了"], "a": 0, "x": "Sedang = 在 + KK.", "f": "他在睡觉，别说话。", "fp": "Tā zài shuìjiào, bié shuōhuà."}, {"k": "11-2.1", "t": "pg", "q": "你在做什么___？", "o": ["呢", "吗", "了", "吧"], "a": 0, "x": "Kata tanya + 呢.", "f": "你在做什么呢？", "fp": "Nǐ zài zuò shénme ne?"}, {"k": "11-2.2", "t": "pg", "q": "我___看电视，我在看书。", "o": ["没在", "不在", "没是", "不是"], "a": 0, "x": "Ingkar \"sedang\" = 没在.", "f": "我没在看电视，我在看书。", "fp": "Wǒ
