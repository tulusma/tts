", "在", "做饭", "呢"], "s": "妈妈在做饭呢。", "alt": [], "p": "Māma zài zuòfàn ne.", "x": "Ibu sedang memasak."}, {"k": "11-2.16", "t": "bs", "s": "我们正在吃饭呢。", "sp": "Wǒmen zhèngzài chīfàn ne.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 正在 + KK + 呢."}, {"k": "11-2.17", "t": "bs", "s": "我在看了电视。", "sp": "Wǒ zài kàn le diànshì.", "n": "", "ok": false, "b": "我在看电视。", "bp": "Wǒ zài kàn diànshì.", "x": "在 (sedang) tidak dipakai bersama 了."}]}, {"id": "11-3", "pel": 11, "judul": "Kata kerja bantu 要 (mau, akan)", "kode": "一03", "rumus": ["S + 要 + KK (mau/akan)", "S + 要 + benda (mau/minta)", "Ingkar keinginan: 不想; 不要 = jangan"], "jelas": ["要 (yào) + kata kerja = mau/akan melakukan, lebih tegas dan pasti daripada 想. 他今天要和小朋友玩 = hari ini dia mau main dengan teman-temannya (sudah berniat).", "要 + benda = mau/minta (saat memesan): 我要一斤饺子, 您要什么？", "Ingkar penting: untuk \"tidak mau\", pakai 不想 (我不想去). 不要 + KK berarti \"jangan\": 不要说话 = jangan bicara. Untuk benda, 不要 = tidak mau (这个我不要).", "要 juga bisa berarti \"perlu waktu\": 到北京要几个小时？ = ke Beijing perlu berapa jam?", "Urutan dengan waktu: 我明天要去北京."], "poin": ["要 + KK = mau/akan (tegas).", "要 + benda = minta/pesan.", "不想 = tidak mau; 不要 + KK = jangan.", "要 + waktu = perlu (waktu)."], "contoh": [{"zh": "我昨天问他，他对我说，他不去，他今天要和小朋友玩。", "py": "Wǒ zuótiān wèn tā, tā duì wǒ shuō, tā bú qù, tā jīntiān yào hé xiǎopéngyou wán.", "id": "Kemarin aku tanya dia, katanya dia tidak ikut; hari ini dia mau main dengan teman-temannya.", "b": true, "tr": "11-5"}, {"zh": "我要一斤饺子。", "py": "Wǒ yào yì jīn jiǎozi.", "id": "Saya pesan satu jin jiaozi.", "b": true, "tr": "13-5"}, {"zh": "您还要什么？", "py": "Nín hái yào shénme?", "id": "Mau pesan apa lagi?", "b": true, "tr": "13-3"}, {"zh": "你们的飞机到北京要几个小时？", "py": "Nǐmen de fēijī dào Běijīng yào jǐ gè xiǎoshí?", "id": "Pesawat kalian ke Beijing perlu berapa jam?", "b": true, "tr": "15-5"}, {"zh": "请大家不要说话！", "py": "Qǐng dàjiā búyào shuōhuà!", "id": "Semuanya tolong jangan mengobrol!", "b": true, "tr": "14-3"}, {"zh": "我要一杯咖啡。", "py": "Wǒ yào yì bēi kāfēi.", "id": "Saya mau secangkir kopi.", "b": false, "tr": null}, {"zh": "明天我要去医院看病。", "py": "Míngtiān wǒ yào qù yīyuàn kànbìng.", "id": "Besok saya mau ke rumah sakit berobat.", "b": false, "tr": null}, {"zh": "从这儿到机场要一个小时。", "py": "Cóng zhèr dào jīchǎng yào yí gè xiǎoshí.", "id": "Dari sini ke bandara perlu satu jam.", "b": false, "tr": null}, {"zh": "上课的时候不要睡觉。", "py": "Shàngkè de shíhou búyào shuìjiào.", "id": "Waktu pelajaran jangan tidur.", "b": false, "tr": null}], "salah": [{"s": "我不要去。", "sp": "Wǒ búyào qù.", "n": "saya tidak mau pergi", "b": "我不想去。", "bp": "Wǒ bù xiǎng qù.", "a": "不要 + KK terdengar seperti \"jangan\"; untuk \"tidak mau\" pakai 不想."}, {"s": "我要去北京明天。", "sp": "Wǒ yào qù Běijīng míngtiān.", "n": "", "b": "我明天要去北京。", "bp": "Wǒ míngtiān yào qù Běijīng.", "a": "Waktu sebelum 要."}], "latihan": [{"k": "11-3.0", "t": "pg", "q": "服务员：您___什么？", "o": ["要", "会", "能", "在"], "a": 0, "x": "Memesan = 要.", "f": "服务员：您要什么？", "fp": "Fúwùyuán: nín yào shénme?"}, {"k": "11-3.1", "t": "pg", "q": "\"Saya tidak mau minum kopi\" yang paling tepat =", "o": ["我不想喝咖啡。", "我不要喝咖啡。", "我没要喝咖啡。", "我要不喝咖啡。"], "a": 0, "x": "Tidak mau = 不想."}, {"k": "11-3.2", "t": "pg", "q": "上课了，___说话！(jangan)", "o": ["不要", "不想", "没要", "不会"], "a": 0, "x": "不要 + KK = jangan.", "f": "上课了，不要说话！", "fp": "Shàngkè le, búyào shuōhuà!"}, {"k": "11-3.3", "t": "pg", "q": "到上海___两个小时。(perlu)", "o": ["要", "想", "会", "在"], "a": 0, "x": "要 + waktu = perlu.", "f": "到上海要两个小时。", "fp": "Dào Shànghǎi yào liǎng gè xiǎoshí."}, {"k": "11-3.4", "t": "bs", "s": "我明天要去北京。", "sp": "Wǒ míngtiān yào qù Běijīng.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "11-3.5", "t": "bs", "s": "我要去上海明天。", "sp": "Wǒ yào qù Shànghǎi míngtiān.", "n": "", "ok": false, "b": "我明天要去上海。", "bp": "Wǒ míngtiān yào qù Shànghǎi.", "x": "Waktu sebelum 要."}, {"k": "11-3.6", "t": "su", "w": ["我", "要", "一", "杯", "茶"], "s": "我要一杯茶。", "alt": [], "p": "Wǒ yào yì bēi chá.", "x": "Saya pesan secangkir teh."}, {"k": "11-3.7", "t": "su", "w": ["他", "明天", "要", "去", "北京"], "s": "他明天要去北京。", "alt": ["明天他要去北京。"], "p": "Tā míngtiān yào qù Běijīng.", "x": "Besok dia akan pergi ke Beijing."}, {"k": "11-3.8", "t": "su", "w": ["请", "不要", "说话"], "s": "请不要说话。", "alt": [], "p": "Qǐng búyào shuōhuà.", "x": "Tolong jangan bicara."}, {"k": "11-3.9", "t": "pg", "q": "服务员，我___两个包子。", "o": ["要", "会", "能", "是"], "a": 0, "x": "要 + benda = mau/minta.", "f": "服务员，我要两个包子。", "fp": "Fúwùyuán, wǒ yào liǎng gè bāozi."}, {"k": "11-3.10", "t": "pg", "q": "坐车去学校___二十分钟。(perlu)", "o": ["要", "想", "会", "在"], "a": 0, "x": "要 + waktu = perlu (waktu).", "f": "坐车去学校要二十分钟。", "fp": "Zuò chē qù xuéxiào yào èrshí fēnzhōng."}, {"k": "11-3.11", "t": "pg", "q": "在图书馆里___打电话。(jangan)", "o": ["不要", "不想", "没要", "不会"], "a": 0, "x": "Jangan = 不要.", "f": "在图书馆里不要打电话。", "fp": "Zài túshūguǎn lǐ búyào dǎdiànhuà."}, {"k": "11-3.12", "t": "su", "w": ["我", "要", "一", "杯", "咖啡"], "s": "我要一杯咖啡。", "alt": [], "p": "Wǒ yào yì bēi kāfēi.", "x": "Saya mau secangkir kopi."}, {"k": "11-3.13", "t": "su", "w": ["明天", "我", "要", "去", "医院", "看病"], "s": "明天我要去医院看病。", "alt": ["我明天要去医院看病。"], "p": "Míngtiān wǒ yào qù yīyuàn kànbìng.", "x": "Besok saya mau ke rumah sakit berobat."}, {"k": "11-3.14", "t": "su", "w": ["上课", "的", "时候", "不要", "睡觉"], "s": "上课的时候不要睡觉。", "alt": [], "p": "Shàngkè de shíhou búyào shuìjiào.", "x": "Waktu pelajaran jangan tidur."}, {"k": "11-3.15", "t": "bs", "s": "我要两斤苹果。", "sp": "Wǒ yào liǎng jīn píngguǒ.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 要 + bilangan + satuan + benda."}, {"k": "11-3.16", "t": "bs", "s": "我不要去学校，我很累。", "sp": "Wǒ búyào qù xuéxiào, wǒ hěn lèi.", "n": "tidak ingin", "ok": false, "b": "我不想去学校，我很累。", "bp": "Wǒ bù xiǎng qù xuéxiào, wǒ hěn lèi.", "x": "Untuk \"tidak ingin\" lebih tepat 不想; 不要 terutama berarti \"jangan\"."}]}, {"id": "12-1", "pel": 12, "judul": "Kalimat tanpa subjek-predikat 非主谓句", "kode": "一31", "rumus": ["KK + O (+ 了) untuk cuaca: 下雨了, 下雪了", "Satu kata/frasa: 车！ 谁？ 好的。"], "jelas": ["Beberapa kalimat Mandarin tidak punya subjek. Yang paling umum adalah cuaca: 下雨了 (turun hujan), 下雪了 (turun salju). Tidak ada \"siapa\" yang menurunkan hujan, jadi tidak perlu subjek. Jangan menambahkan 天 atau 它 sebagai subjek.", "Ungkapan satu kata juga kalimat utuh: 车！ (awas mobil!), 好的。 (baiklah), 谢谢！, 再见！", "Kata waktu boleh di depan: 昨天下雪了 (kemarin turun salju), 明天下雨吗？", "Ingkar: 没下雨 (tidak hujan, lampau) atau 不下雨 (tidak akan hujan)."], "poin": ["Cuaca: 下雨 / 下雪 tanpa subjek.", "Ungkapan pendek = kalimat utuh.", "Waktu boleh di depan."], "contoh": [{"zh": "这里的天不太好，下雨了。", "py": "Zhèlǐ de tiān bú tài hǎo, xià yǔ le.", "id": "Cuaca di sini kurang bagus, turun hujan.", "b": true, "tr": "12-1"}, {"zh": "昨天下雪了。", "py": "Zuótiān xià xuě le.", "id": "Kemarin turun salju.", "b": true, "tr": "12-3"}, {"zh": "好的。", "py": "Hǎo de.", "id": "Baiklah.", "b": true, "tr": "12-5"}, {"zh": "明天下雨吗？", "py": "Míngtiān xià yǔ ma?", "id": "Besok hujan?", "b": false, "tr": null}, {"zh": "车！", "py": "Chē!", "id": "Awas, mobil!", "b": false, "tr": null}, {"zh": "下雨了，我们别出去了。", "py": "Xià yǔ le, wǒmen bié chūqù le.", "id": "Hujan turun, kita jangan keluar.", "b": false, "tr": null}, {"zh": "外边下雨了吗？——没下。", "py": "Wàibian xià yǔ le ma? — Méi xià.", "id": "Di luar hujan? — Tidak.", "b": false, "tr": null}, {"zh": "谢谢！——不客气。", "py": "Xièxie! — Búkèqi.", "id": "Terima kasih! — Sama-sama.", "b": false, "tr": null}, {"zh": "上课了！", "py": "Shàngkè le!", "id": "Pelajaran dimulai!", "b": false, "tr": null}], "salah": [{"s": "雨下了。", "sp": "Yǔ xià le.", "n": "hujan turun", "b": "下雨了。", "bp": "Xià yǔ le.", "a": "Pola baku: 下雨了."}, {"s": "天下雨了。", "sp": "Tiān xià yǔ le.", "n": "", "b": "下雨了。", "bp": "Xià yǔ le.", "a": "Tidak perlu subjek."}], "latihan": [{"k": "12-1.0", "t": "pg", "q": "\"Turun hujan\" =", "o": ["下雨了。", "雨下了。", "是雨了。", "有雨下。"], "a": 0, "x": "下雨了."}, {"k": "12-1.1", "t": "pg", "q": "\"Kemarin turun salju\" =", "o": ["昨天下雪了。", "下雪昨天了。", "雪昨天下了。", "昨天雪下。"], "a": 0, "x": "Waktu + 下雪了."}, {"k": "12-1.2", "t": "pg", "q": "Mana yang termasuk kalimat tanpa subjek?", "o": ["我是学生。", "下雨了。", "他很高。", "她有书。"], "a": 1, "x": "下雨了 tidak punya subjek."}, {"k": "12-1.3", "t": "bs", "s": "下雪了。", "sp": "Xià xuě le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "12-1.4", "t": "bs", "s": "天下雨了。", "sp": "Tiān xià yǔ le.", "n": "", "ok": false, "b": "下雨了。", "bp": "Xià yǔ le.", "x": "Tidak perlu subjek 天."}, {"k": "12-1.5", "t": "su", "w": ["明天", "下", "雨", "吗"], "s": "明天下雨吗？", "alt": ["下明天雨吗？"], "p": "Míngtiān xià yǔ ma?", "x": "Besok hujan?"}, {"k": "12-1.6", "t": "su", "w": ["昨天", "下", "雪", "了"], "s": "昨天下雪了。", "alt": ["下昨天雪了。"], "p": "Zuótiān xià xuě le.", "x": "Kemarin turun salju."}, {"k": "12-1.7", "t": "pg", "q": "\"Di luar turun salju\" =", "o": ["外边下雪了。", "外边雪下了。", "外边是雪了。", "外边有下雪了。"], "a": 0, "x": "Cuaca: 下雪, kata kerja di depan."}, {"k": "12-1.8", "t": "pg", "q": "Mana yang termasuk kalimat tanpa subjek?", "o": ["上课了！", "我是老师。", "他很忙。", "书在桌子上。"], "a": 0, "x": "上课了 tidak punya subjek."}, {"k": "12-1.9", "t": "pg", "q": "外边下雨了吗？——Jawaban \"tidak\":", "o": ["没下。", "不下了吗。", "没有雨下。", "不是。"], "a": 0, "x": "Belum/tidak terjadi: 没 + KK."}, {"k": "12-1.10", "t": "su", "w": ["外边", "下", "雨", "了"], "s": "外边下雨了。", "alt": [], "p": "Wàibian xià yǔ le.", "x": "Di luar turun hujan."}, {"k": "12-1.11", "t": "su", "w": ["下", "雨", "了，", "我们", "别", "出去", "了"], "s": "下雨了，我们别出去了。", "alt": [], "p": "Xià yǔ le, wǒmen bié chūqù le.", "x": "Hujan turun, kita jangan keluar."}, {"k": "12-1.12", "t": "su", "w": ["今天", "下", "雪", "吗"], "s": "今天下雪吗？", "alt": ["下今天雪吗？"], "p": "Jīntiān xià xuě ma?", "x": "Apakah hari ini turun salju?"}, {"k": "12-1.13", "t": "bs", "s": "雨下了。", "sp": "Yǔ xià le.", "n": "hujan turun", "ok": false, "b": "下雨了。", "bp": "Xià yǔ le.", "x": "Untuk cuaca, kata kerja 下 di depan: 下雨."}, {"k": "12-1.14", "t": "bs", "s": "上课了！", "sp": "Shàngkè le!", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: kalimat tanpa subjek."}]}, {"id": "12-2", "pel": 12, "judul": "Partikel 了 (1) di akhir kalimat: perubahan", "kode": "一22, 一40", "rumus": ["Kalimat + 了 (sudah/jadi …, keadaan baru)", "KS + 了: 病了, 忙了, 冷了", "不 + KK + 了 = tidak … lagi"], "jelas": ["了 (le) di AKHIR kalimat menandai perubahan atau keadaan baru: sesuatu yang tadinya tidak begitu, sekarang begitu. 下雨了 = (tadinya tidak, sekarang) hujan. 我病了 = saya (jadi) sakit.", "Dengan kata sifat: 天冷了 (cuaca sudah jadi dingin), 他们都忙了 (mereka jadi sibuk). Dengan umur dan waktu: 我二十岁了 (sekarang sudah 20 tahun), 八点了 (sudah jam delapan).", "Dengan 会/能: 你们会说汉语了 = kalian sudah bisa berbahasa Mandarin (sebelumnya belum).", "不 + KK + 了 = tidak … lagi (rencana berubah): 我不去了 = saya tidak jadi pergi.", "Ini berbeda dari 了 (2) setelah kata kerja (pelajaran 14) yang menandai tindakan selesai. 了 akhir kalimat lebih tentang \"situasi sekarang sudah berubah\".", "Setelah 还没 tidak memakai 了: 他还没来 (bukan 他还没来了)."], "poin": ["了 akhir kalimat = perubahan / keadaan baru.", "KS/umur/waktu + 了: 冷了, 二十岁了, 八点了.", "不……了 = tidak lagi / tidak jadi.", "Tidak dipakai setelah 还没."], "contoh": [{"zh": "医生，我病了。", "py": "Yīshēng, wǒ bìng le.", "id": "Dokter, saya sakit.", "b": true, "tr": "12-5"}, {"zh": "你昨天没来公司，生病了？", "py": "Nǐ zuótiān méi lái gōngsī, shēngbìng le?", "id": "Kemarin kamu tidak datang ke kantor, sakit ya?", "b": true, "tr": "12-3"}, {"zh": "对。儿子也上小学了。", "py": "Duì. Érzi yě shàng xiǎoxué le.", "id": "Iya. Putra kita juga (sudah) masuk SD.", "b": true, "tr": "14-5"}, {"zh": "上学后，他们都忙了。", "py": "Shàngxué hòu, tāmen dōu máng le.", "id": "Setelah mulai sekolah, mereka berdua jadi sibuk.", "b": true, "tr": "14-5"}, {"zh": "我二十岁了。", "py": "Wǒ èrshí suì le.", "id": "Saya sudah 20 tahun.", "b": false, "tr": null}, {"zh": "我不去了。", "py": "Wǒ bú qù le.", "id": "Saya tidak jadi pergi.", "b": false, "tr": null}, {"zh": "天冷了。", "py": "Tiān lěng le.", "id": "Cuaca sudah menjadi dingin.", "b": false, "tr": null}, {"zh": "我哥哥是医生了。", "py": "Wǒ gēge shì yīshēng le.", "id": "Kakak laki-laki saya sudah menjadi dokter.", "b": false, "tr": null}, {"zh": "现在十点了，我们睡觉吧。", "py": "Xiànzài shí diǎn le, wǒmen shuìjiào ba.", "id": "Sudah jam sepuluh, ayo tidur.", "b": false, "tr": null}, {"zh": "我不喝咖啡了。", "py": "Wǒ bù hē kāfēi le.", "id": "Saya tidak minum kopi lagi.", "b": false, "tr": null}], "salah": [{"s": "他还没来了。", "sp": "Tā hái méi lái le.", "n": "", "b": "他还没来。", "bp": "Tā hái méi lái.", "a": "还没 tanpa 了."}, {"s": "我是二十岁了。", "sp": "Wǒ shì èrshí suì le.", "n": "", "b": "我二十岁了。", "bp": "Wǒ èrshí suì le.", "a": "Umur tanpa 是."}], "latihan": [{"k": "12-2.0", "t": "pg", "q": "天冷___，多穿衣服。", "o": ["了", "吗", "的", "呢"], "a": 0, "x": "Perubahan cuaca: 了.", "f": "天冷了，多穿衣服。", "fp": "Tiān lěng le, duō chuān yīfu."}, {"k": "12-2.1", "t": "pg", "q": "\"Saya tidak jadi pergi\" =", "o": ["我不去了。", "我没去了。", "我了不去。", "我不了去。"], "a": 0, "x": "不……了 = tidak jadi."}, {"k": "12-2.2", "t": "pg", "q": "Mana yang SALAH?", "o": ["我病了。", "下雨了。", "他还没来了。", "八点了。"], "a": 2, "x": "还没 tidak memakai 了."}, {"k": "12-2.3", "t": "pg", "q": "\"Sekarang sudah jam sembilan\" =", "o": ["九点了。", "九点是。", "了九点。", "是九点了吗。"], "a": 0, "x": "Waktu + 了."}, {"k": "12-2.4", "t": "bs", "s": "我二十岁了。", "sp": "Wǒ èrshí suì le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: umur baru."}, {"k": "12-2.5", "t": "bs", "s": "她还没起床了。", "sp": "Tā hái méi qǐchuáng le.", "n": "", "ok": false, "b": "她还没起床。", "bp": "Tā hái méi qǐchuáng.", "x": "还没 tanpa 了."}, {"k": "12-2.6", "t": "su", "w": ["我", "女儿", "上", "小学", "了"], "s": "我女儿上小学了。", "alt": [], "p": "Wǒ nǚ'ér shàng xiǎoxué le.", "x": "Putri saya sudah masuk SD."}, {"k": "12-2.7", "t": "su", "w": ["你们", "会", "说", "汉语", "了"], "s": "你们会说汉语了。", "alt": [], "p": "Nǐmen huì shuō Hànyǔ le.", "x": "Kalian sudah bisa berbahasa Mandarin."}, {"k": "12-2.8", "t": "su", "w": ["他", "不", "来", "了"], "s": "他不来了。", "alt": [], "p": "Tā bù lái le.", "x": "Dia tidak jadi datang."}, {"k": "12-2.9", "t": "pg", "q": "现在十二点___，我们吃饭吧。", "o": ["了", "吗", "呢", "的"], "a": 0, "x": "了 di a ntí.", "x": "Objek orang (老师) di depan objek benda."}]}, {"id": "14-1", "pel": 14, "judul": "Partikel aspek 了 (2) setelah kata kerja: selesai", "kode": "一21, 一41", "rumus": ["S + KK + 了 + bilangan/keterangan + O", "Ingkar: S + 没(有) + KK (tanpa 了)", "Tanya: ……了吗？ / ……了没有？"], "jelas": ["了 langsung setelah kata kerja menandai tindakan yang sudah selesai/terjadi: 我看了一个电影 = saya (sudah) menonton sebuah film.", "Objek setelah KK + 了 biasanya diberi penjelas (bilangan, kata sifat, dll.): 买了一本书, 去了西安. Kalimat seperti 我吃了饭 terasa belum selesai, seakan ada lanjutan (我吃了饭就去 = setelah makan saya langsung pergi). Jika objek tanpa penjelas, pakai 了 di akhir: 我吃饭了.", "Ingkar: 没 + KK, dan 了 HILANG: 我没看电影 (bukan 我没看了电影). Ini aturan penting.", "Bertanya: 你看见王老师了吗？ / 你吃饭了没有？ Jawaban: 看见了。/ 没看见。", "了 bukan \"masa lampau\". Kebiasaan di masa lalu tidak memakai 了: 我以前常常去 (dulu saya sering pergi). Dan 了 juga bisa untuk masa depan yang akan selesai."], "poin": ["KK + 了 = tindakan selesai.", "Objek biasanya dengan bilangan: 看了一个电影.", "Ingkar: 没 + KK, tanpa 了.", "Tanya: ……了吗？ / ……了没有？"], "contoh": [{"zh": "我看了一个电影。", "py": "Wǒ kàn le yí gè diànyǐng.", "id": "Aku menonton sebuah film.", "b": true, "tr": "14-1"}, {"zh": "去年我和男朋友去了西安。", "py": "Qùnián wǒ hé nánpéngyou qù le Xī'ān.", "id": "Tahun lalu aku dan pacarku ke Xi'an.", "b": true, "tr": "15-3"}, {"zh": "你们上火车后看见王老师了吗？——没看见。", "py": "Nǐmen shàng huǒchē hòu kànjiàn Wáng lǎoshī le ma? — Méi kànjiàn.", "id": "Setelah naik kereta, kalian melihat Bu Wang? — Tidak.", "b": true, "tr": "14-1"}, {"zh": "我们家有了一个中学生。", "py": "Wǒmen jiā yǒu le yí gè zhōngxuéshēng.", "id": "Keluarga kita jadi punya seorang anak SMP.", "b": true, "tr": "14-5"}, {"zh": "我昨天买了两本书。", "py": "Wǒ zuótiān mǎi le liǎng běn shū.", "id": "Kemarin saya membeli dua buku.", "b": false, "tr": null}, {"zh": "我今天喝了三杯茶。", "py": "Wǒ jīntiān hē le sān bēi chá.", "id": "Hari ini saya minum tiga cangkir teh.", "b": false, "tr": null}, {"zh": "她昨天买了一件新衣服。", "py": "Tā zuótiān mǎi le yí jiàn , {"k": "14-3.14", "t": "su", "w": ["我们", "班", "的", "学生", "都", "很", "好"], "s": "我们班的学生都很好。", "alt": [], "p": "Wǒmen bān de xuéshēng dōu hěn hǎo.", "x": "Siswa-siswa di kelas kami semuanya baik."}, {"k": "14-3.15", "t": "bs", "s": "我们都喜欢吃中国菜。", "sp": "Wǒmen dōu xǐhuan chī Zhōngguó cài.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 都 sebelum kata kerja."}, {"k": "14-3.16", "t": "bs", "s": "他们喜欢都喝咖啡。", "sp": "Tāmen xǐhuan dōu hē kāfēi.", "n": "", "ok": false, "b": "他们都喜欢喝咖啡。", "bp": "Tāmen dōu xǐhuan hē kāfēi.", "x": "都 harus sebelum kata kerja pertama."}]}, {"id": "15-1", "pel": 15, "judul": "Kalimat majemuk setara \"……，还/也……\"", "kode": "一13, 一39", "rumus": ["S + KK1 + O1，(S) + 也 + KK2 (juga)", "S + KK1，还 + KK2 (selain itu juga)", "A……，B 也……"], "jelas": ["Dua klausa yang setara bisa dihubungkan dengan 也 (juga) atau 还 (juga, selain itu) di klausa kedua. Keduanya kata keterangan, jadi harus diletakkan setelah subjek dan sebelum kata kerja/sifat.", "也 untuk menambahkan hal yang sejajar: 我喜欢这个，也喜欢那个 (saya suka yang ini, juga suka yang itu). Juga untuk subjek berbeda dengan predikat sama: 他是学生，我也是学生.", "还 untuk menambahkan hal lain dengan nada \"bahkan/lagi pula\": 这些菜都好吃，还很好看 (enak, lagi pula cantik). 他要去上海，还要去北京.", "Subjek klausa kedua boleh dihilangkan jika sama: 我爱吃中国菜，也喜欢做.", "Klausa setara juga bisa tanpa kata penghubung: 我白天在家里读书，晚上去外边唱歌.", "Tidak memakai 和 untuk menghubungkan dua klausa! 和 hanya menghubungkan kata benda. 我吃饭和看电视 salah untuk \"saya makan dan nonton TV\"; pakai 我吃饭，也看电视 atau 一边……一边……."], "poin": ["……，也…… = …, juga ….", "……，还…… = …, lagi pula/juga ….", "也/还 setelah subjek, sebelum KK.", "和 tidak menghubungkan klausa."], "contoh": [{"zh": "这些菜都好吃，还很好看。", "py": "Zhèxiē cài dōu hǎochī, hái hěn hǎokàn.", "id": "Masakan ini semuanya enak, juga cantik dilihat.", "b": true, "tr": "15-1"}, {"zh": "我爱吃中国菜，也喜欢做。", "py": "Wǒ ài chī Zhōngguó cài, yě xǐhuan zuò.", "id": "Aku suka makan masakan Tiongkok, juga suka memasaknya.", "b": true, "tr": "15-1"}, "Nǐ zhù zài nǎr?"}, {"h": "桌子", "p": "zhuōzi", "a": "meja", "ex": "桌子上有一本书。", "exi": "Di atas meja ada sebuah buku.", "exp": "Zhuōzi shàng yǒu yì běn shū."}, {"h": "字", "p": "zì", "a": "huruf; karakter", "ex": "你的字写得很漂亮。", "exi": "Tulisanmu sangat rapi dan indah.", "exp": "Nǐ de zì xiě de hěn piàoliang."}, {"h": "昨天", "p": "zuótiān", "a": "kemarin", "ex": "你昨天怎么没来上课？", "exi": "Kenapa kemarin kamu tidak masuk kelas?", "exp": "Nǐ zuótiān zěnme méi lái shàngkè?"}, {"h": "坐", "p": "zuò", "a": "duduk; naik (kendaraan)", "ex": "我们坐出租车回家。", "exi": "Kami naik taksi pulang.", "exp": "Wǒmen zuò chūzūchē huí jiā."}, {"h": "做", "p": "zuò", "a": "membuat; melakukan", "ex": "你在做什么？", "exi": "Kamu sedang apa?", "exp": "Nǐ zài zuò shénme?"}, {"h": "做饭", "p": "zuò fàn", "a": "memasak", "ex": "周末我在家做饭。", "exi": "Akhir pekan saya memasak di rumah.", "exp": "Zhōumò wǒ zài jiā zuòfàn."}]}}</script>
<script>(function(){
'use strict';
var D=JSON.parse(document.getElementById('DATA').textContent);
var T=D.topik, byId={}, Q={};
T.forEach(function(t){byId[t.id]=t;t.latihan.forEach(function(q){q.tid=t.id;Q[q.k]=q;});});
var main=document.getElementById('main'), ttl=document.getElementById('ttl'), bk=document.getElementById('bk');
var st={py:true,id:true,salah:{}}; // hanya selama aplikasi terbuka
var quiz=null;

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function el(h){var d=document.createElement('div');d.innerHTML=h;return d;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function pelName(p){return p===99?'Tambahan (daftar resmi)':'Pelajaran '+p;}
function topicsOf(p){return T.filter(function(t){return t.pel===p;});}
function nSalah(){return Object.keys(st.salah).length;}
function tabs(on){return '<div class="tabs"><button data-go="#"'+(on==='g'?' class="on"':'')+'>Grammar<\/button><button data-go="#b"'+(on==='b'?' class="on"':'')+'>Membaca hanzi<\/button><\/div>';}

/* ---------- suara (Web Speech, hanya jika ada suara Mandarin) ---------- */
var zhVoice=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  var vs=speechSynthesis.getVoices()||[];
  zhVoice=vs.filter(function(v){return /^zh[-_](CN|Hans)/i.test(v.lang);})[0]||vs.filter(function(v){return /^zh/i.test(v.lang);})[0]||null;
  document.body.classList.toggle('tts',!!zhVoice);
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t){if(!zhVoice)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.voice=zhVoice;u.lang=zhVoice.lang;u.rate=0.8;speechSynthesis.speak(u);}
main.addEventListener('click',function(e){var b=e.target.closest('[data-say]');if(b){say(b.getAttribute('data-say'));e.stopPropagation();}});
function audUrl(id){return (D.audio[+id.slice(0,2)]||'')+'#'+id;}
function sayBtn(z){return '<button class="say" data-say="'+esc(z)+'" aria-label="Dengarkan">🔊<\/button>';}

/* ---------- toggle pinyin / arti ---------- */
function applyTg(){
  document.body.classList.toggle('hide-py',!st.py);document.body.classList.toggle('hide-id',!st.id);
  document.getElementById('tpy').setAttribute('aria-pressed',st.py);document.getElementById('tid').setAttribute('aria-pressed',st.id);
}
document.getElementById('tpy').onclick=function(){st.py=!st.py;applyTg();};
document.getElementById('tid').onclick=function(){st.id=!st.id;applyTg();};
bk.onclick=function(){if(history.length>1)history.back();else location.hash='';};

/* ---------- beranda ---------- */
function home(){
  ttl.textContent='Grammar HSK '+D.level;bk.hidden=true;
  var nq=0;T.forEach(function(t){nq+=t.latihan.length;});
  var h=tabs('g')+'<div class="hero"><b>'+esc(D.buku)+'<\/b><p>'+esc(D.intro)+'<\/p>'+
   '<div class="stat"><div><b>'+T.length+'<\/b>poin grammar<\/div><div><b>'+nq+'<\/b>soal latihan<\/div><div><b>'+nSalah()+'<\/b>soal salah (sesi ini)<\/div><\/div>'+
   '<div class="acts"><button class="btn" data-go="#q/mix">Latihan campuran (20 soal)<\/button><button class="btn alt" data-go="#q/salah"'+(nSalah()?'':' disabled')+'>Ulangi soal yang salah<\/button><\/div><\/div>';
  var pels=[];T.forEach(function(t){if(pels.indexOf(t.pel)<0)pels.push(t.pel);});
  pels.forEach(function(p){
    if(p===99)h+='<h2 class="sec">Tambahan dari daftar resmi HSK 3.0<\/h2>';
    else if(p===pels[0])h+='<h2 class="sec">Grammar di buku<\/h2>';
    var ts=topicsOf(p),n=0;ts.forEach(function(t){n+=t.latihan.length;});
    h+='<div class="les"><div class="les-h"><span class="n">'+(p===99?'+':p)+'<\/span><span class="z">'+esc(p===99?'Tidak dibahas di buku':D.judul[p])+'<\/span><button class="q" data-go="#q/pel/'+p+'">Uji '+n+' soal<\/button><\/div>';
    ts.forEach(function(t){h+='<button class="tp" data-go="#t/'+t.id+'"><span class="t">'+esc(t.judul)+'<\/span><span class="c">'+t.latihan.length+' soal ›<\/span><\/button>';});
    h+='<\/div>';
  });
  h+='<p class="aud" style="text-align:center;margin-top:20px">Catatan: kemajuan dan daftar soal salah hanya tersimpan selama halaman ini terbuka.<\/p>';
  main.innerHTML=h;
}
main.addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b&&!b.disabled){location.hash=b.getAttribute('data-go');}});

/* ---------- halaman topik ---------- */
function topic(id){
  var t=byId[id];if(!t)return home();
  ttl.textContent=(t.pel===99?'Tambahan':'Pelajaran '+t.pel)+' · '+t.judul;bk.hidden=false;
  var h='<div class="card"><span class="kode">'+esc(pelName(t.pel))+' · daftar resmi '+esc(t.kode)+'<\/span><h2 class="ttl2">'+esc(t.judul)+'<\/h2>';
  t.rumus.forEach(function(r){h+='<div class="rumus">'+esc(r)+'<\/div>';});h+='<\/div>';
  h+='<div class="card jelas"><h3>Penjelasan<\/h3>';t.jelas.forEach(function(p){h+='<p>'+esc(p)+'<\/p>';});h+='<\/div>';
  h+='<div class="card"><h3>Yang harus diingat<\/h3><ul class="poin">';t.poin.forEach(function(p){h+='<li>'+esc(p)+'<\/li>';});h+='<\/ul><\/div>';
  h+='<div class="card"><h3>Contoh kalimat<\/h3>';
  t.contoh.forEach(function(c){
    h+='<div class="ex"><div class="b"><div class="zh">'+esc(c.zh)+(c.b?'<span class="tag bk">buku<\/span>'+(c.tr?'<a class="tag bk" href="'+audUrl(c.tr)+'">🎧 '+c.tr+'<\/a>':''):'')+'<\/div><div class="py">'+esc(c.py)+'<\/div><div class="id">'+esc(c.id)+'<\/div><\/div>'+sayBtn(c.zh)+'<\/div>';
  });
  h+='<\/div>';
  if(t.salah.length){h+='<div class="card"><h3>Kesalahan yang sering terjadi<\/h3>';
    t.salah.forEach(function(s){h+='<div class="err"><div class="x"><span class="zh">✗ '+esc(s.s)+'<\/span>'+(s.n?' <span class="tag">'+esc(s.n)+'<\/span>':'')+'<\/div><div class="v"><span class="zh">✓ '+esc(s.b)+'<\/span><\/div><div class="py">'+esc(s.bp)+'<\/div><div class="why">'+esc(s.a)+'<\/div><\/div>';});
    h+='<\/div>';}
  var rek=D.rekaman[t.pel];
  if(rek){h+='<div class="card aud"><h3>🎧 Rekaman pelajaran '+t.pel+'<\/h3>Dialog: '+rek.filter(function(r){return r.j==='dialog';}).map(function(r){return '<a href="'+audUrl(r.id)+'">'+r.id+'<\/a>'+(r.awal?' ('+esc(r.awal)+')':'');}).join(', ')+'.<br>Tautan membuka <b>'+esc(D.audio[t.pel])+'<\/b>; simpan kedua file di folder yang sama.<\/div>';}
  var i=T.indexOf(t),pv=T[i-1],nx=T[i+1];
  h+='<button class="btn" data-go="#q/topik/'+t.id+'">Kerjakan '+t.latihan.length+' soal latihan<\/button>';
  h+='<div class="nav2" style="margin-top:10px">'+(pv?'<button class="btn alt" data-go="#t/'+pv.id+'">‹ Sebelumnya<\/button>':'')+(nx?'<button class="btn alt" data-go="#t/'+nx.id+'">Berikutnya ›<\/button>':'')+'<\/div>';
  main.innerHTML=h;window.scrollTo(0,0);
}

/* ---------- kuis ---------- */
function startQuiz(kind,arg){
  var list=[],judul='Latihan';
  if(kind==='topik'){var t=byId[arg];if(!t)return home();list=shuffle(t.latihan);judul=t.judul;}
  else if(kind==='pel'){var p=+arg;topicsOf(p).forEach(function(t){list=list.concat(t.latihan);});list=shuffle(list);judul='Uji '+pelName(p);}
  else if(kind==='mix'){var all=[];T.forEach(function(t){all=all.concat(t.latihan);});list=shuffle(all).slice(0,20);judul='Latihan campuran';}
  else if(kind==='salah'){list=shuffle(Object.keys(st.salah).map(function(k){return st.salah[k];}));judul='Ulangi soal yang salah';}
  else if(kind==='ulang'&&quiz){list=shuffle(quiz.wrong);judul=quiz.judul;}
  else if(kind.charAt(0)==='r'){var rq=readQuiz(kind,arg);list=rq.list;judul=rq.judul;}
  if(!list.length){main.innerHTML='<div class="empty">Belum ada soal di sini.<\/div>';return;}
  quiz={list:list,i:0,score:0,wrong:[],judul:judul,back:kind==='topik'?'#t/'+arg:(kind==='rp'||kind==='rd')?'#b/p/'+arg:kind==='rs'?'#b/s/'+arg:kind==='rmix'?'#b':''};
  renderQ();
}
function hdr(){var q=quiz;return '<div class="qh"><span>Soal '+(q.i+1)+' / '+q.list.length+'<\/span><span>Benar: '+q.score+'<\/span><\/div><div class="bar"><i style="width:'+(q.i/q.list.length*100)+'%"><\/i><\/div>';}
function srcLink(q){var t=byId[q.tid];if(!t)return q.lbl?'<div class="why">'+esc(q.lbl)+'<\/div>':'';return '<div class="why">Topik: <a href="#t/'+t.id+'">'+esc(t.judul)+'<\/a><\/div>';}
function mark(q,ok){if(ok){quiz.score++;delete st.salah[q.k];}else{quiz.wrong.push(q);st.salah[q.k]=q;}}
function nextBtn(){return '<button class="btn" id="nx" style="margin-top:12px">'+(quiz.i+1<quiz.list.length?'Soal berikutnya':'Lihat hasil')+'<\/button>';}
function bindNext(){var b=document.getElementById('nx');b.onclick=function(){quiz.i++;if(quiz.i<quiz.list.length)renderQ();else result();};b.focus();}
function renderQ(){
  var q=quiz.list[quiz.i];ttl.textContent=quiz.judul;bk.hidden=false;
  if(q.t==='pg')qPG(q);else if(q.t==='su')qSU(q);else qBS(q);
  window.scrollTo(0,0);
}
function qPG(q){
  var zhq=q.zq!==undefined?q.zq:!/[A-Za-z]/.test(q.q.replace(/\([^)]*\)/g,''));
  var h='<div class="card">'+hdr()+'<p class="qt">'+esc(q.qt||'Pilih jawaban yang tepat')+'<\/p><p class="qq'+(zhq?' zhq':'')+'">'+esc(q.q).replace('___','<u>&nbsp;&nbsp;&nbsp;&nbsp;<\/u>')+'<\/p>'+(q.qp?'<div class="py">'+esc(q.qp)+'<\/div>':'');
  var ord=shuffle(q.o.map(function(o,i){return i;}));
  h+='<div class="opts">'+ord.map(function(i){return '<button class="opt" data-i="'+i+'">'+esc(q.o[i])+'<\/button>';}).join('')+'<\/div><div id="fbx"><\/div><\/div>';
  main.innerHTML=h;
  main.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
    var i=+b.getAttribute('data-i'),ok=i===q.a;mark(q,ok);
    main.querySelectorAll('.opt').forEach(function(x){x.disabled=true;var j=+x.getAttribute('data-i');if(j===q.a)x.classList.add('ok');else if(j===i)x.classList.add('no');});
    var f='<div class="fb '+(ok?'ok':'no')+'"><b>'+(ok?'Benar!':'Kurang tepat. Jawaban: '+esc(q.o[q.a]))+'<\/b>';
    if(q.f)f+='<div class="zh">'+esc(q.f)+sayBtn(q.f)+'<\/div><div class="py">'+esc(q.fp)+'<\/div>';
    f+=esc(q.x)+srcLink(q)+'<\/div>'+nextBtn();
    document.getElementById('fbx').innerHTML=f;bindNext();
  };});
}
function qSU(q){
  var idx=q.w.map(function(w,i){return i;}),ord=idx;
  for(var k=0;k<8&&ord.join()===idx.join();k++)ord=shuffle(idx);
  var picked=[];
  var h='<div class="card">'+hdr()+'<p class="qt">Susun menjadi kalimat yang benar<\/p><p class="qq">'+esc(q.x)+'<\/p><div class="ansline" id="al"><\/div><div class="pool" id="pl">'+
    ord.map(function(i){return '<button class="tile" data-i="'+i+'">'+esc(q.w[i])+'<\/button>';}).join('')+'<\/div><button class="btn" id="ck" disabled>Periksa<\/button><div id="fbx"><\/div><\/div>';
  main.innerHTML=h;
  var al=document.getElementById('al'),pl=document.getElementById('pl'),ck=document.getElementById('ck'),done=false;
  function draw(){al.innerHTML=picked.map(function(i,p){return '<button class="tile" data-p="'+p+'">'+esc(q.w[i])+'<\/button>';}).join('');
    pl.querySelectorAll('.tile').forEach(function(b){b.classList.toggle('used',picked.indexOf(+b.getAttribute('data-i'))>=0);});
    ck.disabled=picked.length!==q.w.length;}
  pl.onclick=function(e){var b=e.target.closest('.tile');if(!b||done)return;var i=+b.getAttribute('data-i');if(picked.indexOf(i)<0){picked.push(i);draw();}};
  al.onclick=function(e){var b=e.target.closest('.tile');if(!b||done)return;picked.splice(+b.getAttribute('data-p'),1);draw();};
  ck.onclick=function(){
    done=true;ck.hidden=true;
    var mine=picked.map(function(i){return q.w[i];}).join('')+q.s.slice(-1);
    var ok=mine===q.s||q.alt.indexOf(mine)>=0;mark(q,ok);
    var f='<div class="fb '+(ok?'ok':'no')+'"><b>'+(ok?'Benar!':'Kurang tepat. Susunan yang benar:')+'<\/b><div class="zh">'+esc(q.s)+sayBtn(q.s)+'<\/div><div class="py">'+esc(q.p)+'<\/div><div class="id">'+esc(q.x)+'<\/div>';
    if(q.alt.length)f+='<div class="why">Juga benar: '+esc(q.alt.join(' / '))+'<\/div>';
    if(!ok)f+='<div class="why">Jawaban Anda: '+esc(mine)+'<\/div>';
    f+=srcLink(q)+'<\/div>'+nextBtn();
    document.getElementById('fbx').innerHTML=f;bindNext();
  };
}
function qBS(q){
  var h='<div class="card">'+hdr()+'<p class="qt">Apakah kalimat ini benar?<\/p><p class="qq zhq">'+esc(q.s)+'<\/p><div class="py">'+esc(q.sp)+'<\/div>'+(q.n?'<div class="why">('+esc(q.n)+')<\/div>':'')+
    '<div class="bsrow"><button class="opt" data-v="1">✓ Benar<\/button><button class="opt" data-v="0">✗ Salah<\/button><\/div><div id="fbx"><\/div><\/div>';
  main.innerHTML=h;
  main.querySelectorAll('.bsrow .opt').forEach(function(b){b.onclick=function(){
    var v=b.getAttribute('data-v')==='1',ok=v===q.ok;mark(q,ok);
    main.querySelectorAll('.bsrow .opt').forEach(function(x){x.disabled=true;var xv=x.getAttribute('data-v')==='1';if(xv===q.ok)x.classList.add('ok');else if(x===b)x.classList.add('no');});
    var f='<div class="fb '+(ok?'ok':'no')+'"><b>'+(ok?'Benar!':'Kurang tepat.')+' Kalimat ini '+(q.ok?'sudah benar.':'salah.')+'<\/b>';
    if(!q.ok)f+='<div>Perbaikan:<\/div><div class="zh">'+esc(q.b)+'<\/div><div class="py">'+esc(q.bp)+'<\/div>';
    f+=esc(q.x)+srcLink(q)+'<\/div>'+nextBtn();
    document.getElementById('fbx').innerHTML=f;bindNext();
  };});
}
function answerText(q){
  if(q.t==='pg')return q.f||q.o[q.a];
  if(q.t==='su')return q.s;
  return q.ok?'Kalimat sudah benar':'Salah → '+q.b;
}
function qText(q){return q.t==='pg'?q.q:q.t==='su'?q.x:q.s;}
function result(){
  var q=quiz,pc=Math.round(q.score/q.list.length*100);
  var msg=pc===100?'Sempurna!':pc>=80?'Bagus sekali.':pc>=60?'Lumayan, ulangi yang salah.':'Baca lagi penjelasannya, lalu coba lagi.';
  var h='<div class="card res">'+'<div class="big">'+q.score+' / '+q.list.length+'<\/div><p>'+pc+'% benar. '+msg+'<\/p>'+
   '<div class="acts">'+(q.wrong.length?'<button class="btn" id="ul">Ulangi '+q.wrong.length+' soal yang salah<\/button>':'')+'<button class="btn alt" data-go="'+(q.back||'')+'">'+(q.back?'Kembali':'Kembali ke beranda')+'<\/button><\/div><\/div>';
  if(q.wrong.length){h+='<div class="card wl"><h3>Soal yang salah<\/h3>';
    q.wrong.forEach(function(w){h+='<div class="err"><div class="t">'+esc(byId[w.tid]?byId[w.tid].judul:(w.lbl||''))+'<\/div><div>'+esc(qText(w))+'<\/div><div class="v"><span class="zh">✓ '+esc(answerText(w))+'<\/span><\/div><div class="why">'+esc(w.x)+'<\/div><\/div>';});
    h+='<\/div>';}
  main.innerHTML=h;
  var ul=document.getElementById('ul');if(ul)ul.onclick=function(){startQuiz('ulang');};
  if(q.back==='')main.querySelector('[data-go=""]').onclick=function(){location.hash='';home();};
  window.scrollTo(0,0);
}

/* ---------- membaca hanzi ---------- */
var BC=D.baca||{pel:{},kata:[]}, SETN=25;
var POOL=(function(){var m={},a=[];function add(w){if(w&&w.h&&w.p&&w.a&&!m[w.h]){m[w.h]=1;a.push(w);}}
  BC.kata.forEach(add);Object.keys(BC.pel).forEach(function(p){BC.pel[p].kata.forEach(add);});return a;})();
var SENT=(function(){var a=[];Object.keys(BC.pel).forEach(function(p){BC.pel[p].dialog.forEach(function(d){if(d.id)a.push({zh:d.zh,py:d.py,id:d.id,lbl:'Dialog pelajaran '+p});});});
  BC.kata.forEach(function(w){if(w.ex&&w.exi)a.push({zh:w.ex,py:w.exp,id:w.exi,lbl:'Contoh kata '+w.h});});return a;})();
function nSet(){return Math.ceil(BC.kata.length/SETN);}
function setWords(n){return BC.kata.slice(n*SETN,(n+1)*SETN);}
function revealCSS(){return '';}
var TONES={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù',ü:'ǖǘǚǜ'};
function toneVariants(p){
  var out=[];var chars=p.split('');
  chars.forEach(function(c,i){Object.keys(TONES).forEach(function(v){var k=TONES[v].indexOf(c);if(k>=0){for(var t=0;t<4;t++){if(t!==k){var cc=chars.slice();cc[i]=TONES[v][t];out.push(cc.join(''));}}}});});
  return shuffle(out);
}
function syl(p){return (p.match(/[aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]+/gi)||[]).length;}
function pick(arr,n,not,pref){var a=shuffle(arr.filter(function(x){return not.indexOf(x)<0;}));if(pref){var b=a.filter(pref),c=a.filter(function(x){return !pref(x);});a=b.concat(c);}var out=[];a.forEach(function(x){if(out.length<n&&out.indexOf(x)<0)out.push(x);});return out;}
function mk(q,o,ans,extra){var opts=[ans].concat(o).slice(0,4);var r={t:'pg',q:q,o:opts,a:0};for(var k in extra)r[k]=extra[k];return r;}
function wordQ(w,type,lbl){
  var x=w.a, base={x:x,lbl:lbl,k:'r:'+type+':'+w.h};
  if(type==='hp'){var tv=toneVariants(w.p).filter(function(v){return v!==w.p;}).slice(0,2);var oth=pick(POOL.map(function(z){return z.p;}),3,[w.p].concat(tv),function(p){return syl(p)===syl(w.p);});
    return mk(w.h,tv.concat(oth).slice(0,3),w.p,Object.assign(base,{qt:'Bagaimana cara membaca kata ini?',zq:true,f:w.h,fp:w.p}));}
  if(type==='ha'){return mk(w.h,pick(POOL.map(function(z){return z.a;}),3,[w.a]),w.a,Object.assign(base,{qt:'Apa arti kata ini?',zq:true,f:w.h,fp:w.p}));}
  if(type==='ah'){return mk(w.a,pick(POOL.map(function(z){return z.h;}),3,[w.h],function(h){return h.length===w.h.length;}),w.h,Object.assign(base,{qt:'Pilih hanzi untuk arti ini',zq:false,f:w.h,fp:w.p}));}
  return mk(w.p,pick(POOL.map(function(z){return z.h;}),3,[w.h],function(h){return h.length===w.h.length;}),w.h,Object.assign(base,{qt:'Pilih hanzi untuk pinyin ini',zq:false,f:w.h,fp:w.p}));
}
function sentQ(s,lbl){
  return mk(s.zh,pick(SENT.map(function(z){return z.id;}),3,[s.id]),s.id,{qt:'Baca kalimat ini. Apa artinya?',zq:true,f:s.zh,fp:s.py,x:s.id,lbl:lbl||s.lbl,k:'r:s:'+s.zh});
}
function wordQs(ws,lbl,n){var T4=['hp','ha','ah','ph'],a=[];ws.forEach(function(w){T4.forEach(function(t){a.push(wordQ(w,t,lbl));});});a=shuffle(a);return n?a.slice(0,n):a;}
function readQuiz(kind,arg){
  if(kind==='rp'){var P=BC.pel[arg];return {list:wordQs(P.kata.filter(function(w){return w.p&&w.a;}),'Kosakata pelajaran '+arg,30),judul:'Kosakata pelajaran '+arg};}
  if(kind==='rd'){var P2=BC.pel[arg];return {list:shuffle(P2.dialog.filter(function(d){return d.id;}).map(function(d){return sentQ({zh:d.zh,py:d.py,id:d.id},'Dialog pelajaran '+arg);})),judul:'Membaca dialog pelajaran '+arg};}
  if(kind==='rs'){var n=+arg;return {list:wordQs(setWords(n),'Kata resmi set '+(n+1),40),judul:'Kata resmi · set '+(n+1)};}
  if(kind==='rss'){var n2=+arg;return {list:shuffle(setWords(n2).filter(function(w){return w.ex&&w.exi;}).map(function(w){return sentQ({zh:w.ex,py:w.exp,id:w.exi},'Contoh kata '+w.h);})),judul:'Membaca kalimat · set '+(n2+1)};}
  var mix=shuffle(wordQs(shuffle(POOL).slice(0,15),'Kuis acak')).slice(0,15).concat(shuffle(SENT).slice(0,5).map(function(s){return sentQ(s);}));
  return {list:shuffle(mix),judul:'Kuis membaca acak'};
}
function bacaHome(){
  ttl.textContent='Membaca hanzi · HSK '+D.level;bk.hidden=true;
  var pels=Object.keys(BC.pel).map(Number).sort(function(a,b){return a-b;});
  var h=tabs('b')+'<div class="hero"><b>Latihan membaca hanzi HSK '+D.level+'<\/b><p>Baca kosakata dan dialog buku per pelajaran, lalu kata-kata daftar resmi HSK '+D.level+'. Pinyin dan arti tersembunyi: ketuk untuk memeriksa bacaan Anda.<\/p>'+
    '<div class="stat"><div><b>'+POOL.length+'<\/b>kata<\/div><div><b>'+SENT.length+'<\/b>kalimat untuk dibaca<\/div><\/div>'+
    '<div class="acts"><button class="btn" data-go="#q/rmix">Kuis membaca acak (20 soal)<\/button><button class="btn alt" data-go="#q/salah"'+(nSalah()?'':' disabled')+'>Ulangi soal yang salah<\/button><\/div><\/div>';
  if(pels.length){h+='<h2 class="sec">Per pelajaran buku<\/h2><div class="les">';
    pels.forEach(function(p){var P=BC.pel[p];h+='<button class="tp" data-go="#b/p/'+p+'"><span class="t"><b style="color:var(--acc)">'+p+'<\/b> &nbsp;<span class="zhs">'+esc(P.judul||D.judul[p]||'')+'<\/span><\/span><span class="c">'+P.kata.length+' kata · '+P.dialog.length+' kalimat ›<\/span><\/button>';});
    h+='<\/div>';}
  var miss=[];for(var i=1;i<=Object.keys(D.judul).length;i++)if(!BC.pel[i])miss.push(i);
  if(miss.length&&pels.length)h+='<p class="aud">Teks buku pelajaran '+miss.join(', ')+' belum tersedia; latih kata-katanya lewat daftar resmi di bawah.<\/p>';
  h+='<h2 class="sec">Daftar kata resmi HSK '+D.level+' ('+BC.kata.length+' kata)<\/h2><div class="les">';
  for(var n=0;n<nSet();n++){var ws=setWords(n);h+='<button class="tp" data-go="#b/s/'+n+'"><span class="t">Set '+(n+1)+' &nbsp;<span class="zhs">'+esc(ws[0].h)+' … '+esc(ws[ws.length-1].h)+'<\/span><\/span><span class="c">'+ws.length+' kata ›<\/span><\/button>';}
  h+='<\/div>';
  main.innerHTML=h;window.scrollTo(0,0);
}
function wordCards(ws){
  return '<div class="wgrid">'+ws.map(function(w){return '<button class="wc rv"><span class="wh">'+esc(w.h)+'<\/span><span class="py">'+esc(w.p)+'<\/span><span class="id">'+esc(w.a)+'<\/span><\/button>';}).join('')+'<\/div>';
}
function revealBar(){return '<div class="rvbar"><button class="btn alt" data-rv="1">Tampilkan semua<\/button><button class="btn alt" data-rv="0">Sembunyikan semua<\/button><\/div>';}
function bacaPel(p){
  var P=BC.pel[p];if(!P)return bacaHome();
  ttl.textContent='Membaca · Pelajaran '+p;bk.hidden=false;
  var h='<div class="card"><span class="kode">Pelajaran '+p+'<\/span><h2 class="ttl2 zhs">'+esc(P.judul||D.judul[p]||'')+'<\/h2>'+(P.arti?'<p class="aud" style="margin:0">'+esc(P.arti)+'<\/p>':'')+
    '<p class="aud">Baca hanzi dulu, lalu ketuk untuk melihat pinyin dan artinya.<\/p>'+revealBar()+'<\/div>';
  if(P.kata.length)h+='<div class="card"><h3>Kosakata ('+P.kata.length+')<\/h3>'+wordCards(P.kata)+'<button class="btn" style="margin-top:12px" data-go="#q/rp/'+p+'">Kuis kosakata pelajaran ini<\/button><\/div>';
  if(P.dialog.length){h+='<div class="card"><h3>Dialog buku<\/h3>';var lt='';
    P.dialog.forEach(function(d){if(d.tr&&d.tr!==lt){lt=d.tr;h+='<div class="trk"><a href="'+audUrl(d.tr)+'">🎧 '+d.tr+'<\/a><\/div>';}
      h+='<div class="ex rv"><div class="b">'+(d.s?'<span class="spk">'+esc(d.s)+'：<\/span>':'')+'<span class="zh">'+esc(d.zh)+'<\/span><div class="py">'+esc(d.py)+'<\/div><div class="id">'+esc(d.id)+'<\/div><\/div>'+sayBtn(d.zh)+'<\/div>';});
    h+='<button class="btn" style="margin-top:12px" data-go="#q/rd/'+p+'">Kuis membaca dialog<\/button><\/div>';}
  main.innerHTML=h;window.scrollTo(0,0);
}
function bacaSet(n){
  var ws=setWords(n);if(!ws.length)return bacaHome();
  ttl.textContent='Kata resmi · set '+(n+1);bk.hidden=false;
  var h='<div class="card"><span class="kode">Daftar resmi HSK '+D.level+' · set '+(n+1)+' dari '+nSet()+'<\/span><p class="aud">Ketuk kata atau kalimat untuk melihat pinyin dan artinya.<\/p>'+revealBar()+'<\/div>';
  h+='<div class="card"><h3>Kata<\/h3>'+wordCards(ws)+'<button class="btn" style="margin-top:12px" data-go="#q/rs/'+n+'">Kuis kata set ini<\/button><\/div>';
  var ex=ws.filter(function(w){return w.ex;});
  if(ex.length){h+='<div class="card"><h3>Kalimat contoh<\/h3>';ex.forEach(function(w){h+='<div class="ex rv"><div class="b"><span class="zh">'+esc(w.ex)+'<\/span><div class="py">'+esc(w.exp)+'<\/div><div class="id">'+esc(w.exi)+'<\/div><\/div>'+sayBtn(w.ex)+'<\/div>';});
    h+='<button class="btn" style="margin-top:12px" data-go="#q/rss/'+n+'">Kuis membaca kalimat<\/button><\/div>';}
  var nav='<div class="nav2">'+(n>0?'<button class="btn alt" data-go="#b/s/'+(n-1)+'">‹ Set '+n+'<\/button>':'')+(n+1<nSet()?'<button class="btn alt" data-go="#b/s/'+(n+1)+'">Set '+(n+2)+' ›<\/button>':'')+'<\/div>';
  main.innerHTML=h+nav;window.scrollTo(0,0);
}
main.addEventListener('click',function(e){
  var r=e.target.closest('[data-rv]');if(r){var on=r.getAttribute('data-rv')==='1';main.querySelectorAll('.rv').forEach(function(x){x.classList.toggle('open',on);});return;}
  if(e.target.closest('[data-say]')||e.target.closest('a'))return;
  var v=e.target.closest('.rv');if(v)v.classList.toggle('open');
});
window.__uji={q:function(){return quiz;},info:function(){return {pel:Object.keys(BC.pel),sets:nSet(),pool:POOL.length,sent:SENT.length};}};

/* ---------- rute ---------- */
function route(){
  var h=location.hash.replace(/^#/,'').split('/');
  if(h[0]==='t')topic(h[1]);
  else if(h[0]==='b'){if(h[1]==='p')bacaPel(h[2]);else if(h[1]==='s')bacaSet(+h[2]);else bacaHome();}
  else if(h[0]==='q')startQuiz(h[1],h[2]);
  else home();
}
window.addEventListener('hashchange',route);
applyTg();route();
})();
</script>
