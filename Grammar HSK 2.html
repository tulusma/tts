": "06-1", "j": "dialog", "awal": "明天就是女儿的生日了。"}, {"id": "06-3", "j": "dialog", "awal": "小雪，生日快乐！"}, {"id": "06-5", "j": "dialog", "awal": "小雪，看看今天有什么好吃的。"}, {"id": "06-7", "j": "dialog", "awal": "今天是女儿的生日。"}], "7": [{"id": "07-1", "j": "dialog", "awal": "安妮，你是什么时候从北京回来的？"}, {"id": "07-3", "j": "dialog", "awal": "天中，你是不是很喜欢打篮球？"}, {"id": "07-5", "j": "dialog", "awal": "你篮球打得怎么样？"}, {"id": "07-7", "j": "dialog", "awal": "我的爱好是运动。"}], "8": [{"id": "08-1", "j": "dialog", "awal": "你看，这两块手表怎么样？"}, {"id": "08-3", "j": "dialog", "awal": "今天有不少电影，我们看个电影吧。"}, {"id": "08-5", "j": "dialog", "awal": "您好！就要这几个菜吧，谢谢！"}, {"id": "08-7", "j": "dialog", "awal": "虽然妻子忘了今天是自己的生日，但是丈夫记得。"}], "9": [{"id": "09-1", "j": "dialog", "awal": "儿子的裤子坏了，我们给他买条新的吧。"}, {"id": "09-3", "j": "dialog", "awal": "门口有家奶茶店。你想喝杯奶茶吗？"}, {"id": "09-5", "j": "dialog", "awal": "我们打车回去吧。"}, {"id": "09-7", "j": "dialog", "awal": "这周刘明休息，我下班后跟他去了一家商店。"}], "10": [{"id": "10-1", "j": "dialog", "awal": "小明，你们明天开学，你准备好了吗？"}, {"id": "10-3", "j": "dialog", "awal": "小雪，你在做什么呢？"}, {"id": "10-5", "j": "dialog", "awal": "妈妈，我回来了！"}, {"id": "10-7", "j": "dialog", "awal": "快要开学了，爸爸帮弟弟准备书包、本子和笔。"}], "11": [{"id": "11-1", "j": "dialog", "awal": "家月，都下课了，你怎么还不回家？"}, {"id": "11-3", "j": "dialog", "awal": "现在路上车多，还下着雪，我开慢一点儿。"}, {"id": "11-5", "j": "dialog", "awal": "李文，快请进！"}, {"id": "11-7", "j": "dialog", "awal": "我这几天经常头疼，从药店买了点儿药，没去医院。"}], "12": [{"id": "12-1", "j": "dialog", "awal": "喂，家月，是你啊！有什么事情吗？"}, {"id": "12-3", "j": "dialog", "awal": "喂，一飞，听家月说你那边下雪了，下得大不大？"}, {"id": "12-5", "j": "dialog", "awal": "喂，家月，今天天气不错，我们去跑步吧。"}, {"id": "12-7", "j": "dialog", "awal": "前几天天气不好，我没走路，每天坐两站地铁去学校。"}], "13": [{"id": "13-1", "j": "dialog", "awal": "时间过得真快啊！新年就要到了。"}, {"id": "13-3", "j": "dialog", "awal": "王老师，今天的词比昨天多了十个。"}, {"id": "13-5", "j": "dialog", "awal": "家月，你觉得这个本子怎么样？"}, {"id": "13-7", "j": "dialog", "awal": "新年就要到了，安妮送给我一个新本子。"}], "14": [{"id": "14-1", "j": "dialog", "awal": "王老师，你家楼下站着一个人。"}, {"id": "14-3", "j": "dialog", "awal": "同乐，真是你啊！上次打电话，你说有时间过来看我，没想到这么快就来了！"}, {"id": "14-5", "j": "dialog", "awal": "一飞，你住的房子真不错，很大，离学校也不远。"}, {"id": "14-7", "j": "dialog", "awal": "我男朋友姓杨，叫杨同乐。"}], "15": [{"id": "15-1", "j": "dialog", "awal": "考试就要开始了，请大家写上姓名，写好后就可以做题了。"}, {"id": "15-3", "j": "dialog", "awal": "考完试了，我现在可以出国旅游了。"}, {"id": "15-5", "j": "dialog", "awal": "李文，你有一年没回国了吧？"}, {"id": "15-7", "j": "dialog", "awal": "我六月的时候回过一次北京，现在有半年多没回去了，我有点儿想家。"}]}, "judul": {"1": "她请我们吃了北京烤鸭", "2": "还是打车去北大吧", "3": "我想去西安旅游", "4": "你穿红色的很好看", "5": "第一次去中国朋友家", "6": "小雪，生日快乐！", "7": "他篮球打得很好", "8": "虽然你忘了，但是我记得", "9": "我去买杯奶茶", "10": "就要考试了", "11": "我最喜欢吃中国菜", "12": "这里比北京冷多了", "13": "我们爱上中文课", "14": "一个人过年多没意思啊", "15": "我想再去一次中国"}, "audio": {"1": "https://claude.ai/artifact/NT94yGgCpxzmt9KhtujrVM", "2": "https://claude.ai/artifact/NT94yGgCpxzmt9KhtujrVM", "3": "https://claude.ai/artifact/NT94yGgCpxzmt9KhtujrVM", "4": "https://claude.ai/artifact/NT94yGgCpxzmt9KhtujrVM", "5": "https://claude.ai/artifact/NT94yGgCpxzmt9KhtujrVM", "6": "https://claude.ai/artifact/NT94yGgCpxzmt9KhtujrVM", "7": "https://claude.ai/artifact/NT94yGgCpxzmt9KhtujrVM", "8": "https://claude.ai/artifact/NT94yGgCpxzmt9KhtujrVM", "9": "https://claude.ai/artifact/NT94yGgCpxzmt9KhtujrVM", "10": "https://claude.ai/artifact/NT94yGgCpxzmt9KhtujrVM", "11": "https://claude.ai/artifact/NT94yGgCpxzmt9KhtujrVM", "12": "https://claude.ai/artifact/NT94yGgCpxzmt9KhtujrVM", "13": "https://claude.ai/artifact/NT94yGgCpxzmt9KhtujrVM", "14": "https://claude.ai/artifact/NT94yGgCpxzmt9KhtujrVM", "15": "https://claude.ai/artifact/NT94yGgCpxzmt9KhtujrVM"}, "level": 2, "buku": "新HSK教程 2 · HSK 3.0", "intro": "Semua grammar di bagian 小语讲堂 buku HSK 2 Anda (pelajaran 1–15), lengkap dengan contoh dari buku dan soal latihan.", "baca": {"pel": {"1": {"judul": "她请我们吃了北京烤鸭", "arti": "Dia mentraktir kami makan bebek panggang Beijing", "kata": [{"h": "就", "p": "jiù", "k": "副", "a": "memang, justru (menegaskan)"}, {"h": "给", "p": "gěi", "k": "介", "a": "kepada, untuk (memperkenalkan penerima tindakan)"}, {"h": "让", "p": "ràng", "k": "动", "a": "menyuruh, membiarkan, mengizinkan"}, {"h": "接", "p": "jiē", "k": "动", "a": "menjemput, menyambut, menerima"}, {"h": "次", "p": "cì", "k": "量", "a": "kali (kata penggolong frekuensi)"}, {"h": "旅游", "p": "lǚyóu", "k": "动", "a": "berwisata, melancong"}, {"h": "帮忙", "p": "bāngmáng", "k": "动", "a": "membantu"}, {"h": "不好意思", "p": "bù hǎoyìsi", "k": "—", "a": "merasa tidak enak/malu (melakukan sesuatu), maaf"}, {"h": "已经", "p": "yǐjīng", "k": "副", "a": "sudah"}, {"h": "那", "p": "nà", "k": "连", "a": "kalau begitu"}, {"h": "介绍", "p": "jièshào", "k": "动", "a": "memperkenalkan"}, {"h": "有时", "p": "yǒushí", "k": "副", "a": "kadang-kadang"}, {"h": "懂", "p": "dǒng", "k": "动", "a": "mengerti, paham, tahu"}, {"h": "意思", "p": "yìsi", "k": "名", "a": "arti, maksud, ide"}, {"h": "北京烤鸭", "p": "Běijīng Kǎoyā", "k": "专名", "a": "bebek panggang Beijing (Peking Duck)"}], "dialog": [{"s": "白家月", "zh": "请问，您是王一飞老师的姐姐吗？", "id": "Permisi, apakah Anda kakak Bu Wang Yifei?", "tr": "01-1", "py": "Qǐngwèn, nín shì Wáng Yīfēi lǎoshī de jiějie ma?"}, {"s": "王一雪", "zh": "是的，你们就是她的学生吧？", "id": "Ya. Kalian pasti murid-muridnya, ya?", "tr": "01-1", "py": "Shì de, nǐmen jiù shì tā de xuéshēng ba?"}, {"s": "白家月", "zh": "对。我是白家月，她是安妮。", "id": "Betul. Saya Bai Jiayue, dan dia Annie.", "tr": "01-1", "py": "Duì. Wǒ shì Bái Jiāyuè, tā shì Ānnī."}, {"s": "王一雪", "zh": "你们好，我叫王一雪。一飞给我打电话了，让我来接你们。", "id": "Halo, nama saya Wang Yixue. Yifei sudah menelepon saya dan meminta saya menjemput kalian.", "tr": "01-1", "py": "Nǐmen hǎo, wǒ jiào Wáng Yīxuě. Yīfēi gěi wǒ dǎdiànhuà le, ràng wǒ lái jiē nǐmen."}, {"s": "白家月、安妮", "zh": "谢谢您。", "id": "Terima kasih banyak.", "tr": "01-1", "py": "Xièxie nín."}, {"s": "王一雪", "zh": "不客气。", "id": "Sama-sama.", "tr": "01-1", "py": "Búkèqi."}, {"s": "王一雪", "zh": "你们是第一次来北京吗？", "id": "Apakah ini pertama kalinya kalian datang ke Beijing?", "tr": "01-3", "py": "Nǐmen shì dìyī cì lái Běijīng ma?"}, {"s": "白家月", "zh": "是的，我们都是第一次来。", "id": "Ya, kami berdua baru pertama kali datang.", "tr": "01-3", "py": "Shì de, wǒmen dōu shì dìyī cì lái."}, {"s": "王一雪", "zh": "你们是来学中文的吗？", "id": "Apakah kalian datang untuk belajar bahasa Mandarin?", "tr": "01-3", "py": "Nǐmen shì lái xué Zhōngwén de ma?"}, {"s": "安妮", "zh": "不是，我们是来旅游的。", "id": "Bukan, kami datang untuk berwisata.", "tr": "01-3", "py": "Bú shì, wǒmen shì lái lǚyóu de."}, {"s": "王一雪", "zh": "我这几天都不忙，你们有事就找我。", "id": "Beberapa hari ini saya tidak sibuk. Kalau ada perlu, cari saya saja.", "tr": "01-3", "py": "Wǒ zhè jǐ tiān dōu bù máng, nǐmen yǒu shì jiù zhǎo wǒ."}, {"s": "白家月", "zh": "好的，谢谢您。", "id": "Baik, terima kasih.", "tr": "01-3", "py": "Hǎo de, xièxie nín."}, {"s": "陈天中", "zh": "喂，家月，你明天有时间吗？我想请你帮个忙。", "id": "Halo, Jiayue, besok kamu ada waktu? Aku mau minta tolong.", "tr": "01-5", "py": "Wèi, Jiāyuè, nǐ míngtiān yǒu shíjiān ma? Wǒ xiǎng qǐng nǐ bāng gè máng."}, {"s": "白家月", "zh": "不好意思，天中，我已经到北京了。", "id": "Maaf, Tianzhong, aku sudah sampai di Beijing.", "tr": "01-5", "py": "Bùhǎoyìsī, Tiānzhōng, wǒ yǐjīng dào Běijīng le."}, {"s": "陈天中", "zh": "你是什么时候到的？", "id": "Kapan kamu sampai?", "tr": "01-5", "py": "Nǐ shì shénme shíhou dào de?"}, {"s": "白家月", "zh": "我是今天早上到的。你有事可以叫李文帮忙，他还在学校呢。", "id": "Aku sampai tadi pagi. Kalau ada perlu, kamu bisa minta tolong Li Wen, dia masih di kampus.", "tr": "01-5", "py": "Wǒ shì jīntiān zǎoshang dào de. Nǐ yǒu shì kěyǐ jiào Lǐ Wén bāngmáng, tā hái zài xuéxiào ne."}, {"s": "陈天中", "zh": "好的，那我给他打个电话。", "id": "Baik, kalau begitu aku telepon dia.", "tr": "01-5", "py": "Hǎo de, nà wǒ gěi tā dǎ gè diànhuà."}, {"s": "白家月", "zh": "好，再见！", "id": "Oke, sampai jumpa!", "tr": "01-5", "py": "Hǎo, zàijiàn!"}, {"s": "", "zh": "王老师，我们已经到北京了，是您姐姐来接的我们。", "id": "Bu Wang, kami sudah sampai di Beijing. Kakak Ibu yang menjemput kami.", "tr": "01-7", "py": "Wáng lǎoshī, wǒmen yǐjīng dào Běijīng le, shì nín jiějie lái jiē de wǒmen."}, {"s": "", "zh": "她请我们吃了北京烤鸭，还给我们介绍了很多东西。", "id": "Dia mentraktir kami makan bebek panggang Beijing, dan juga menjelaskan banyak hal kepada kami.", "tr": "01-7", "py": "Tā qǐng wǒmen chī le běijīngkǎoyā, huán gěi wǒmen jièshào le hěn duō dōngxi."}, {"s": "", "zh": "我们的中文不太好，有时不太懂她的意思。", "id": "Bahasa Mandarin kami belum terlalu bagus, jadi kadang-kadang kami kurang paham maksudnya.", "tr": "01-7", "py": "Wǒmen de Zhōngwén bú tài hǎo, yǒushí bú tài dǒng tā de yìsi."}], "teks": [{"tr": "01-1", "nama": "课文1 · Dijemput di bandara"}, {"tr": "01-3", "nama": "课文2 · Datang untuk berwisata"}, {"tr": "01-5", "nama": "课文3 · Telepon dari Chen Tianzhong"}, {"tr": "01-7", "nama": "课文4 · Pesan untuk Bu Wang"}]}, "2": {"judul": "还是打车去北大吧", "arti": "Naik taksi saja ke Universitas Peking", "kata": [{"h": "公交车", "p": "gōngjiāochē", "k": "名", "a": "bus"}, {"h": "但", "p": "dàn", "k": "连", "a": "tetapi, namun"}, {"h": "车站", "p": "chēzhàn", "k": "名", "a": "halte, stasiun"}, {"h": "远", "p": "yuǎn", "k": "形", "a": "jauh"}, {"h": "打车", "p": "dǎchē", "k": "动", "a": "naik taksi, memanggil taksi"}, {"h": "还是", "p": "háishi", "k": "副", "a": "sebaiknya, lebih baik"}, {"h": "北京大学", "p": "Běijīng Dàxué", "k": "专名", "a": "Universitas Peking"}, {"h": "啊", "p": "a", "k": "助", "a": "partikel di akhir kalimat (menyatakan kagum, setuju, dll.)"}, {"h": "万", "p": "wàn", "k": "数", "a": "sepuluh ribu"}, {"h": "名", "p": "míng", "k": "量/名", "a": "penggolong untuk orang; peringkat (dalam lomba); nama"}, {"h": "网上", "p": "wǎngshang", "k": "名", "a": "daring, di internet"}, {"h": "外国", "p": "wàiguó", "k": "名", "a": "luar negeri, asing"}, {"h": "间", "p": "jiān", "k": "量", "a": "penggolong untuk ruangan/kamar"}, {"h": "教室", "p": "jiàoshì", "k": "名", "a": "ruang kelas"}, {"h": "票", "p": "piào", "k": "名", "a": "tiket, karcis"}, {"h": "别", "p": "bié", "k": "副", "a": "jangan; sebaiknya tidak"}, {"h": "过来", "p": "guòlái", "k": "动", "a": "datang ke sini"}], "dialog": [{"s": "白家月", "zh": "请问，这儿有到北京大学的公交车吗？", "id": "Permisi, apakah dari sini ada bus kota ke Universitas Peking?", "tr": "02-1", "py": "Qǐngwèn, zhèr yǒu dào běijīngdàxué de gōngjiāochē ma?"}, {"s": "服务员", "zh": "有，但车站有点儿远。", "id": "Ada, tetapi haltenya agak jauh.", "tr": "02-1", "py": "Yǒu, dàn chēzhàn yǒudiǎnr yuǎn."}, {"s": "白家月", "zh": "这儿好打车吗？", "id": "Di sini gampang dapat taksi?", "tr": "02-1", "py": "Zhèr hǎo dǎchē ma?"}, {"s": "服务员", "zh": "好打车。", "id": "Gampang.", "tr": "02-1", "py": "Hǎo dǎchē."}, {"s": "白家月", "zh": "谢谢。安妮，我们还是打车去吧。", "id": "Terima kasih. Annie, kita naik taksi saja.", "tr": "02-1", "py": "Xièxie. Ānnī, wǒmen háishi dǎchē qù ba."}, {"s": "安妮", "zh": "好，没问题。", "id": "Oke, tidak masalah.", "tr": "02-1", "py": "Hǎo, méi wèntí."}, {"s": "白家月", "zh": "学校里人真多啊！", "id": "Di kampus orangnya banyak sekali!", "tr": "02-3", "py": "Xuéxiào lǐ rén zhēn duō a!"}, {"s": "安妮", "zh": "是啊，北京大学有四万多名学生呢！", "id": "Iya, Universitas Peking punya lebih dari empat puluh ribu mahasiswa!", "tr": "02-3", "py": "Shì a, běijīngdàxué yǒu sìwàn duō míng xuéshēng ne!"}, {"s": "白家月", "zh": "你是怎么知道的？", "id": "Kamu tahu dari mana?", "tr": "02-3", "py": "Nǐ shì zěnme zhīdào de?"}, {"s": "安妮", "zh": "是网上说的，网上还说北京大学有三千多名外国学生。", "id": "Dari internet. Di internet juga dibilang Universitas Peking punya lebih dari tiga ribu mahasiswa asing.", "tr": "02-3", "py": "Shì wǎngshang shuō de, wǎngshang hái shuō běijīngdàxué yǒu sānqiān duō míng wàiguó xuéshēng."}, {"s": "白家月", "zh": "我也想来这儿学习。", "id": "Aku juga ingin belajar di sini.", "tr": "02-3", "py": "Wǒ yě xiǎng lái zhèr xuéxí."}, {"s": "安妮", "zh": "那边就有一间教室，我们去看一下吧。", "id": "Di sebelah sana ada ruang kelas. Ayo kita lihat sebentar.", "tr": "02-3", "py": "Nàbiān jiù yǒu yì jiān jiàoshì, wǒmen qù kàn yíxià ba."}, {"s": "安妮", "zh": "家月，你看，学校里有家电影院！", "id": "Jiayue, lihat, di kampus ada bioskop!", "tr": "02-5", "py": "Jiāyuè, nǐ kàn, xuéxiào lǐ yǒu jiā diànyǐngyuàn!"}, {"s": "白家月", "zh": "是啊，电影院还不小。", "id": "Iya, bioskopnya lumayan besar.", "tr": "02-5", "py": "Shì a, diànyǐngyuàn hái bù xiǎo."}, {"s": "安妮", "zh": "他们卖的电影票也很便宜。", "id": "Tiket film yang mereka jual juga murah sekali.", "tr": "02-5", "py": "Tāmen mài de diànyǐng piào yě hěn piányi."}, {"s": "白家月", "zh": "天啊！有的还不到二十块钱。", "id": "Ya ampun! Ada yang harganya bahkan tidak sampai dua puluh yuan.", "tr": "02-5", "py": "Tiān a! Yǒude hái bú dào èrshí kuài qián."}, {"s": "安妮", "zh": "那你想不想去看个电影？", "id": "Jadi, kamu mau nonton film tidak?", "tr": "02-5", "py": "Nà nǐ xiǎng bu xiǎng qù kàn gè diànyǐng?"}, {"s": "白家月", "zh": "还是别看电影了，北京大学就很好看！", "id": "Sebaiknya tidak usah nonton film. Universitas Peking sendiri sudah sangat menarik!", "tr": "02-5", "py": "Háishi bié kàn diànyǐng le, běijīngdàxué jiù hěn hǎokàn!"}, {"s": "", "zh": "北京大学很大，有四万多名学生。", "id": "Universitas Peking sangat besar, mahasiswanya lebih dari empat puluh ribu orang.", "tr": "02-7", "py": "Běijīngdàxué hěn dà, yǒu sìwàn duō míng xuéshēng."}, {"s": "", "zh": "学校很漂亮，里边还有家电影院，电影票也不贵，我们有时间还想再过来看个电影。", "id": "Kampusnya indah, di dalamnya bahkan ada bioskop, dan tiket filmnya juga tidak mahal. Kalau ada waktu, kami ingin datang lagi untuk menonton film.", "tr": "02-7", "py": "Xuéxiào hěn piàoliang, lǐbian hái yǒu jiā diànyǐngyuàn, diànyǐng piào yě bú guì, wǒmen yǒu shíjiān hái xiǎng zài guòlái kàn gè diànyǐng."}], "teks": [{"tr": "02-1", "nama": "课文1 · Bertanya di resepsionis hotel"}, {"tr": "02-3", "nama": "课文2 · Kampus yang ramai"}, {"tr": "02-5", "nama": "课文3 · Bioskop di kampus"}, {"tr": "02-7", "nama": "课文4 · Pesan untuk Chen Tianzhong"}]}, "3": {"judul": "我想去西安旅游", "arti": "Aku ingin berwisata ke Xi'an", "kata": [{"h": "回来", "p": "huílái", "k": "动", "a": "kembali, pulang (ke sini)"}, {"h": "这么", "p": "zhème", "k": "代", "a": "begini, se… ini, sangat"}, {"h": "完", "p": "wán", "k": "动", "a": "selesai, habis"}, {"h": "一起", "p": "yìqǐ", "k": "副", "a": "bersama-sama"}, {"h": "出去", "p": "chūqù", "k": "动", "a": "pergi keluar"}, {"h": "洗", "p": "xǐ", "k": "动", "a": "mencuci"}, {"h": "自己", "p": "zìjǐ", "k": "代", "a": "diri sendiri"}, {"h": "拿", "p": "ná", "k": "动", "a": "mengambil, memegang"}, {"h": "手", "p": "shǒu", "k": "名", "a": "tangan"}, {"h": "为什么", "p": "wèi shénme", "k": "—", "a": "mengapa, kenapa"}, {"h": "不错", "p": "búcuò", "k": "形", "a": "lumayan, cukup bagus"}, {"h": "送", "p": "sòng", "k": "动", "a": "mengantar (seseorang ke tujuan); memberi (hadiah)"}, {"h": "回去", "p": "huíqù", "k": "动", "a": "kembali, pulang (ke sana)"}, {"h": "每", "p": "měi", "k": "代", "a": "setiap, tiap"}, {"h": "累", "p": "lèi", "k": "形", "a": "lelah, capek"}], "dialog": [{"s": "王一雪", "zh": "今天回来这么晚啊！", "id": "Hari ini pulangnya malam sekali!", "tr": "03-1", "py": "Jīntiān huílái zhème wǎn a!"}, {"s": "刘明", "zh": "工作太多了，下班的时候没做完。", "id": "Pekerjaannya terlalu banyak, waktu jam pulang belum selesai.", "tr": "03-1", "py": "Gōngzuò tài duō le, xiàbān de shíhou méi zuò wán."}, {"s": "王一雪", "zh": "菜都做好了，过来吃饭吧。", "id": "Masakannya sudah siap semua, ayo sini makan.", "tr": "03-1", "py": "Cài dōu zuò hǎo le, guòlái chīfàn ba."}, {"s": "刘明", "zh": "我想休息一下，喝杯水。", "id": "Aku mau istirahat sebentar dan minum segelas air.", "tr": "03-1", "py": "Wǒ xiǎng xiūxi yíxià, hē bēi shuǐ."}, {"s": "王一雪", "zh": "好的。", "id": "Baiklah.", "tr": "03-1", "py": "Hǎo de."}, {"s": "刘明", "zh": "我们找个时间去旅游，怎么样？", "id": "Bagaimana kalau kita cari waktu untuk berlibur?", "tr": "03-3", "py": "Wǒmen zhǎo gè shíjiān qù lǚyóu, zěnmeyàng?"}, {"s": "王一雪", "zh": "好啊，我也很想一起出去玩。", "id": "Boleh, aku juga ingin sekali pergi jalan-jalan bersama.", "tr": "03-3", "py": "Hǎo a, wǒ yě hěn xiǎng yìqǐ chūqù wán."}, {"s": "刘明", "zh": "你想去哪儿？", "id": "Kamu mau ke mana?", "tr": "03-3", "py": "Nǐ xiǎng qù nǎr?"}, {"s": "王一雪", "zh": "我还没想好呢。", "id": "Aku belum memutuskan.", "tr": "03-3", "py": "Wǒ hái méi xiǎng hǎo ne."}, {"s": "刘明", "zh": "那你再想一想，你想好了，我来买票。", "id": "Kalau begitu pikirkan lagi. Kalau sudah kamu putuskan, aku yang beli tiketnya.", "tr": "03-3", "py": "Nà nǐ zài xiǎng yì xiǎng, nǐ xiǎng hǎo le, wǒ lái mǎi piào."}, {"s": "刘明", "zh": "吃个苹果吧，我都洗好了。", "id": "Makan apel, yuk. Semuanya sudah kucuci.", "tr": "03-5", "py": "Chī gè píngguǒ ba, wǒ dōu xǐ hǎo le."}, {"s": "王一雪", "zh": "好的。", "id": "Baik.", "tr": "03-5", "py": "Hǎo de."}, {"s": "刘明", "zh": "就在桌子上，你自己拿。", "id": "Ada di atas meja, ambil sendiri ya.", "tr": "03-5", "py": "Jiù zài zhuōzi shàng, nǐ zìjǐ ná."}, {"s": "王一雪", "zh": "我去洗洗手。对了，我们去西安旅游，怎么样？", "id": "Aku cuci tangan dulu. Oh iya, bagaimana kalau kita berlibur ke Xi'an?", "tr": "03-5", "py": "Wǒ qù xǐ xǐ shǒu. Duì le, wǒmen qù Xī'ān lǚyóu, zěnmeyàng?"}, {"s": "刘明", "zh": "为什么想去西安？", "id": "Kenapa ingin ke Xi'an?", "tr": "03-5", "py": "Wèishénme xiǎng qù Xī'ān?"}, {"s": "王一雪", "zh": "我看了看网上的介绍，这个时候去西安很不错！", "id": "Aku sudah membaca informasinya di internet. Pergi ke Xi'an pada waktu seperti ini bagus sekali!", "tr": "03-5", "py": "Wǒ kàn le kàn wǎngshang de jièshào, zhège shíhou qù Xī'ān hěn búcuò!"}, {"s": "", "zh": "早上，刘明开车送孩子去学校，送完孩子回家后，医院就来电话了，让他回去上班。", "id": "Pagi ini Liu Ming mengantar anak ke sekolah dengan mobil. Setelah mengantar anak dan pulang ke rumah, rumah sakit langsung menelepon dan memintanya kembali bekerja.", "tr": "03-7", "py": "Zǎoshang, Liú Míng kāichē sòng háizi qù xuéxiào, sòng wán háizi huí jiā hòu, yīyuàn jiù lái diànhuà le, ràng tā huíqù shàngbān."}, {"s": "", "zh": "我觉得他这个月每天都很累，真想让他休息休息。", "id": "Menurutku bulan ini dia lelah sekali setiap hari. Aku benar-benar ingin dia bisa beristirahat.", "tr": "03-7", "py": "Wǒ juéde tā zhège yuè měi tiān dōu hěn lèi, zhēn xiǎng ràng tā xiūxi xiūxi."}], "teks": [{"tr": "03-1", "nama": "课文1 · Pulang terlambat"}, {"tr": "03-3", "nama": "课文2 · Mencari waktu untuk berlibur"}, {"tr": "03-5", "nama": "课文3 · Ke Xi'an saja"}, {"tr": "03-7", "nama": "课文4 · Suamiku terlalu lelah"}]}, "4": {"judul": "你穿红色的很好看", "arti": "Kamu cocok memakai warna merah", "kata": [{"h": "过", "p": "guo", "k": "助", "a": "partikel setelah kata kerja, menyatakan tindakan/keadaan di masa lalu (pernah)"}, {"h": "商场", "p": "shāngchǎng", "k": "名", "a": "pusat perbelanjaan, toserba, mal"}, {"h": "进去", "p": "jìnqù", "k": "动", "a": "masuk (ke dalam)"}, {"h": "条", "p": "tiáo", "k": "量", "a": "penggolong untuk benda panjang/ramping (celana, jalan, ikan, dll.)"}, {"h": "裤子", "p": "kùzi", "k": "名", "a": "celana"}, {"h": "白色", "p": "báisè", "k": "名", "a": "warna putih"}, {"h": "因为", "p": "yīnwèi", "k": "连", "a": "karena"}, {"h": "试", "p": "shì", "k": "动", "a": "mencoba"}, {"h": "红色", "p": "hóngsè", "k": "名", "a": "warna merah"}, {"h": "所以", "p": "suǒyǐ", "k": "连", "a": "jadi, maka, oleh karena itu"}, {"h": "书包", "p": "shūbāo", "k": "名", "a": "tas sekolah"}, {"h": "过去", "p": "guòqù", "k": "动", "a": "lewat; pergi ke sana"}, {"h": "绿色", "p": "lǜsè", "k": "名", "a": "warna hijau"}, {"h": "黑色", "p": "hēisè", "k": "名", "a": "warna hitam"}, {"h": "更", "p": "gèng", "k": "副", "a": "lebih, bahkan lebih"}, {"h": "颜色", "p": "yánsè", "k": "名", "a": "warna"}], "dialog": [{"s": "刘小雪", "zh": "妈妈，我们来过这家商场吗？", "id": "Ma, kita pernah datang ke mal ini?", "tr": "04-1", "py": "Māma, wǒmen lái guò zhè jiā shāngchǎng ma?"}, {"s": "王一雪", "zh": "没来过，这是新开的。", "id": "Belum pernah, ini mal yang baru buka.", "tr": "04-1", "py": "Méi lái guò, zhè shì xīn kāi de."}, {"s": "刘小雪", "zh": "我们进去看看吧。", "id": "Ayo kita masuk lihat-lihat.", "tr": "04-1", "py": "Wǒmen jìnqù kànkan ba."}, {"s": "王一雪", "zh": "好啊！你想买点儿什么？", "id": "Boleh! Kamu mau beli apa?", "tr": "04-1", "py": "Hǎo a! Nǐ xiǎng mǎi diǎnr shénme?"}, {"s": "刘小雪", "zh": "我想买条裤子。", "id": "Aku mau beli celana.", "tr": "04-1", "py": "Wǒ xiǎng mǎi tiáo kùzi."}, {"s": "王一雪", "zh": "没问题。", "id": "Tidak masalah.", "tr": "04-1", "py": "Méi wèntí."}, {"s": "刘小雪", "zh": "妈妈，我想买这条白色的裤子。", "id": "Ma, aku mau beli celana putih ini.", "tr": "04-3", "py": "Māma, wǒ xiǎng mǎi zhè tiáo báisè de kùzi."}, {"s": "王一雪", "zh": "你有很多白色的衣服，为什么还买白色的？", "id": "Kamu sudah punya banyak baju putih, kenapa beli yang putih lagi?", "tr": "04-3", "py": "Nǐ yǒu hěn duō báisè de yīfu, wèishénme hái mǎi báisè de?"}, {"s": "刘小雪", "zh": "因为我喜欢白色啊！", "id": "Karena aku suka warna putih!", "tr": "04-3", "py": "Yīnwèi wǒ xǐhuan báisè a!"}, {"s": "王一雪", "zh": "我觉得这条白色的不太好看，你试试那条红色的吧。", "id": "Menurutku yang putih ini kurang bagus. Coba yang merah itu.", "tr": "04-3", "py": "Wǒ juéde zhè tiáo báisè de bú tài hǎokàn, nǐ shì shì nà tiáo hóngsè de ba."}, {"s": "刘小雪", "zh": "我没穿过红色的，红色的好看吗？", "id": "Aku belum pernah pakai yang merah. Memangnya yang merah bagus?", "tr": "04-3", "py": "Wǒ méi chuān guò hóngsè de, hóngsè de hǎokàn ma?"}, {"s": "王一雪", "zh": "就是因为没穿过，所以要试试啊！", "id": "Justru karena belum pernah pakai, makanya harus dicoba!", "tr": "04-3", "py": "Jiù shì yīnwèi méi chuān guò, suǒyǐ yào shì shì a!"}, {"s": "刘小雪", "zh": "妈妈，我想买个新书包。", "id": "Ma, aku mau beli tas sekolah baru.", "tr": "04-5", "py": "Māma, wǒ xiǎng mǎi gè xīn shūbāo."}, {"s": "王一雪", "zh": "好，那边卖书包，我们过去看看吧。", "id": "Baik, di sebelah sana ada yang jual tas sekolah. Ayo kita ke sana lihat-lihat.", "tr": "04-5", "py": "Hǎo, nàbiān mài shūbāo, wǒmen guòqù kànkan ba."}, {"s": "刘小雪", "zh": "这么多漂亮的书包！", "id": "Banyak sekali tas yang bagus!", "tr": "04-5", "py": "Zhème duō piàoliang de shūbāo!"}, {"s": "王一雪", "zh": "红色的、绿色的、黑色的，你想买哪个？", "id": "Ada yang merah, hijau, hitam. Kamu mau beli yang mana?", "tr": "04-5", "py": "Hóngsè de, lǜsè de, hēisè de, nǐ xiǎng mǎi nǎge?"}, {"s": "刘小雪", "zh": "绿色的吧。", "id": "Yang hijau saja.", "tr": "04-5", "py": "Lǜsè de ba."}, {"s": "王一雪", "zh": "不错，我也觉得绿色的更好看。", "id": "Bagus, menurutku juga yang hijau lebih bagus.", "tr": "04-5", "py": "Búcuò, wǒ yě juéde lǜsè de gèng hǎokàn."}, {"s": "", "zh": "我和妈妈去了一家商场。", "id": "Aku dan Mama pergi ke sebuah mal.", "tr": "04-7", "py": "Wǒ hé māma qù le yì jiā shāngchǎng."}, {"s": "", "zh": "因为是新开的，所以这几天东西很便宜。", "id": "Karena baru buka, beberapa hari ini barang-barangnya murah.", "tr": "04-7", "py": "Yīnwèi shì xīn kāi de, suǒyǐ zhè jǐ tiān dōngxi hěn piányi."}, {"s": "", "zh": "商场里的衣服颜色很多。", "id": "Baju di mal itu warnanya bermacam-macam.", "tr": "04-7", "py": "Shāngchǎng lǐ de yīfu yánsè hěn duō."}, {"s": "", "zh": "我没穿过红色的裤子，妈妈让我试了试，我觉得我穿红色的也很好看。", "id": "Aku belum pernah memakai celana merah. Mama menyuruhku mencobanya, dan ternyata aku juga cocok memakai warna merah.", "tr": "04-7", "py": "Wǒ méi chuān guò hóngsè de kùzi, māma ràng wǒ shì le shì, wǒ juéde wǒ chuān hóngsè de yě hěn hǎokàn."}], "teks": [{"tr": "04-1", "nama": "课文1 · Mal yang baru buka"}, {"tr": "04-3", "nama": "课文2 · Celana putih atau merah"}, {"tr": "04-5", "nama": "课文3 · Memilih tas sekolah"}, {"tr": "04-7", "nama": "课文4 · Buku harian Xiaoxue"}]}, "5": {"judul": "第一次去中国朋友家", "arti": "Pertama kali ke rumah teman Tionghoa", "kata": [{"h": "快", "p": "kuài", "k": "副/形", "a": "cepat, segera (bergegas)"}, {"h": "下来", "p": "xiàlái", "k": "动", "a": "turun (ke sini)"}, {"h": "上来", "p": "shànglái", "k": "动", "a": "naik (ke sini)"}, {"h": "上去", "p": "shàngqù", "k": "动", "a": "naik (ke sana)"}, {"h": "下面", "p": "xiàmiàn", "k": "名", "a": "bawah, di bawah (lantai bawah)"}, {"h": "面", "p": "miàn", "k": "后缀", "a": "akhiran pembentuk kata tempat/arah"}, {"h": "等", "p": "děng", "k": "动", "a": "menunggu"}, {"h": "一会儿", "p": "yíhuìr", "k": "数量", "a": "sebentar lagi, segera"}, {"h": "下去", "p": "xiàqù", "k": "动", "a": "turun (ke sana)"}, {"h": "进来", "p": "jìnlái", "k": "动", "a": "masuk (ke sini)"}, {"h": "爷爷", "p": "yéye", "k": "名", "a": "kakek"}, {"h": "奶奶", "p": "nǎinai", "k": "名", "a": "nenek"}, {"h": "礼物", "p": "lǐwù", "k": "名", "a": "hadiah, kado"}, {"h": "准备", "p": "zhǔnbèi", "k": "动", "a": "menyiapkan"}, {"h": "奶茶", "p": "nǎichá", "k": "名", "a": "teh susu, bubble tea"}, {"h": "跟", "p": "gēn", "k": "介/连", "a": "dengan, bersama; dan"}, {"h": "走", "p": "zǒu", "k": "动", "a": "berjalan (kaki); pergi"}, {"h": "酒店", "p": "jiǔdiàn", "k": "名", "a": "hotel"}], "dialog": [{"s": "安妮", "zh": "家月，快下来吧，第一次去中国朋友家，别晚了。", "id": "Jiayue, cepat turun! Ini pertama kalinya kita ke rumah teman Tionghoa, jangan sampai terlambat.", "tr": "05-1", "py": "Jiāyuè, kuài xiàlái ba, dìyī cì qù Zhōngguó péngyou jiā, bié wǎn le."}, {"s": "白家月", "zh": "还有时间，你上来吧。", "id": "Masih ada waktu. Kamu naik saja ke sini.", "tr": "05-1", "py": "Hái yǒu shíjiān, nǐ shànglái ba."}, {"s": "安妮", "zh": "我不上去了，就在下面等你。", "id": "Aku tidak naik, aku tunggu kamu di bawah saja.", "tr": "05-1", "py": "Wǒ bú shàngqù le, jiù zài xiàmiàn děng nǐ."}, {"s": "白家月", "zh": "那我一会儿就下去。", "id": "Kalau begitu sebentar lagi aku turun.", "tr": "05-1", "py": "Nà wǒ yíhuìr jiù xiàqù."}, {"s": "安妮", "zh": "你快点儿吧。", "id": "Cepat sedikit, ya.", "tr": "05-1", "py": "Nǐ kuài diǎnr ba."}, {"s": "白家月", "zh": "没事，一雪姐说11点前到就可以。", "id": "Tenang saja, Kak Yixue bilang asal sampai sebelum jam 11 sudah cukup.", "tr": "05-1", "py": "Méishì, Yīxuě jiě shuō 1 1 diǎn qián dào jiù kěyǐ."}, {"s": "王一雪", "zh": "家月、安妮，快进来！我给你们介绍一下，这是孩子们的爷爷、奶奶。", "id": "Jiayue, Annie, ayo masuk! Saya perkenalkan, ini kakek dan nenek anak-anak.", "tr": "05-3", "py": "Jiāyuè, Ānnī, kuài jìnlái! Wǒ gěi nǐmen jièshào yíxià, zhè shì háizimen de yéye, nǎinai."}, {"s": "白家月、安妮", "zh": "你们好！", "id": "Halo!", "tr": "05-3", "py": "Nǐmen hǎo!"}, {"s": "王一雪", "zh": "爸、妈，这是白家月，这是安妮。她们都是一飞的学生。", "id": "Pa, Ma, ini Bai Jiayue, dan ini Annie. Mereka murid-murid Yifei.", "tr": "05-3", "py": "Bà, mā, zhè shì Bái Jiāyuè, zhè shì Ānnī. Tāmen dōu shì Yīfēi de xuéshēng."}, {"s": "刘爷爷", "zh": "家月、安妮，你们好！", "id": "Jiayue, Annie, halo!", "tr": "05-3", "py": "Jiāyuè, Ānnī, nǐmen hǎo!"}, {"s": "白家月", "zh": "这是送你们的礼物。", "id": "Ini hadiah untuk Kakek dan Nenek.", "tr": "05-3", "py": "Zhè shì sòng nǐmen de lǐwù."}, {"s": "刘爷爷", "zh": "你们太客气了，还拿这么多礼物来！", "id": "Kalian terlalu sungkan, sampai membawa hadiah sebanyak ini!", "tr": "05-3", "py": "Nǐmen tài kèqi le, hái ná zhème duō lǐwù lái!"}, {"s": "白家月", "zh": "一雪姐，这是给孩子们准备的礼物。", "id": "Kak Yixue, ini hadiah yang kami siapkan untuk anak-anak.", "tr": "05-3", "py": "Yīxuě jiě, zhè shì gěi háizimen zhǔnbèi de lǐwù."}, {"s": "王一雪", "zh": "谢谢！你们别客气，快坐吧！", "id": "Terima kasih! Jangan sungkan, ayo duduk!", "tr": "05-3", "py": "Xièxie! Nǐmen bié kèqi, kuài zuò ba!"}, {"s": "王一雪", "zh": "都12点了，我们吃饭吧。", "id": "Sudah jam 12, ayo kita makan.", "tr": "05-5", "py": "Dōu 1 2 diǎn le, wǒmen chīfàn ba."}, {"s": "白家月", "zh": "这么多好吃的，您太客气了！", "id": "Banyak sekali makanan enak, Anda terlalu repot!", "tr": "05-5", "py": "Zhème duō hǎochī de, nín tài kèqi le!"}, {"s": "王一雪", "zh": "都是我自己做的，你们多吃点儿。", "id": "Semuanya saya masak sendiri. Makan yang banyak, ya.", "tr": "05-5", "py": "Dōu shì wǒ zìjǐ zuò de, nǐmen duō chī diǎnr."}, {"s": "白家月", "zh": "奶茶也很好喝，是您自己做的吗？", "id": "Teh susunya juga enak. Apakah Kakak sendiri yang membuatnya?", "tr": "05-5", "py": "Nǎichá yě hěn hǎo hē, shì nín zìjǐ zuò de ma?"}, {"s": "王一雪", "zh": "不是，奶茶是爷爷买的。", "id": "Bukan, teh susunya dibeli Kakek.", "tr": "05-5", "py": "Bú shì, nǎichá shì yéye mǎi de."}, {"s": "白家月", "zh": "在哪儿买的？我还没喝过这么好喝的奶茶。", "id": "Belinya di mana? Aku belum pernah minum teh susu seenak ini.", "tr": "05-5", "py": "Zài nǎr mǎi de? Wǒ hái méi hē guò zhème hǎo hē de nǎichá."}, {"s": "王一雪", "zh": "就在前边的商场，吃完饭你们可以跟我去看看。", "id": "Di mal depan sana. Selesai makan, kalian boleh ikut saya ke sana untuk melihat-lihat.", "tr": "05-5", "py": "Jiù zài qiánbian de shāngchǎng, chī wán fàn nǐmen kěyǐ gēn wǒ qù kànkan."}, {"s": "", "zh": "回国前一天，我们去一雪姐家了。", "id": "Sehari sebelum pulang ke negara kami, kami pergi ke rumah Kak Yixue.", "tr": "05-7", "py": "Huí guó qián yì tiān, wǒmen qù Yīxuě jiě jiā le."}, {"s": "", "zh": "到她家的时候，饭菜都做好了。", "id": "Waktu kami sampai di rumahnya, makanannya sudah siap semua.", "tr": "05-7", "py": "Dào tā jiā de shíhou, fàn cài dōu zuò hǎo le."}, {"s": "", "zh": "刘爷爷还准备了奶茶。", "id": "Kakek Liu juga sudah menyiapkan teh susu.", "tr": "05-7", "py": "Liú yéye hái zhǔnbèi le nǎichá."}, {"s": "", "zh": "因为吃了太多东西，我们吃完饭是走回酒店的。", "id": "Karena makan terlalu banyak, setelah makan kami pulang ke hotel dengan berjalan kaki.", "tr": "05-7", "py": "Yīnwèi chī le tài duō dōngxi, wǒmen chī wán fàn shì zǒu huí jiǔdiàn de."}], "teks": [{"tr": "05-1", "nama": "课文1 · Cepat turun!"}, {"tr": "05-3", "nama": "课文2 · Bertemu kakek dan nenek"}, {"tr": "05-5", "nama": "课文3 · Makan bersama keluarga"}, {"tr": "05-7", "nama": "课文4 · Pesan untuk Li Wen"}]}, "6": {"judul": "小雪，生日快乐！", "arti": "Selamat ulang tahun, Xiaoxue!", "kata": [{"h": "生日", "p": "shēngrì", "k": "名", "a": "ulang tahun"}, {"h": "忘", "p": "wàng", "k": "动", "a": "lupa"}, {"h": "画", "p": "huà", "k": "动/名", "a": "menggambar; lukisan"}, {"h": "画笔", "p": "huàbǐ", "k": "名", "a": "pensil warna; kuas lukis"}, {"h": "蛋糕", "p": "dàngāo", "k": "名", "a": "kue"}, {"h": "快乐", "p": "kuàilè", "k": "形", "a": "gembira, bahagia"}, {"h": "打开", "p": "dǎkāi", "k": "动", "a": "membuka"}, {"h": "长", "p": "cháng", "k": "形", "a": "panjang"}, {"h": "鱼", "p": "yú", "k": "名", "a": "ikan"}, {"h": "肉", "p": "ròu", "k": "名", "a": "daging"}, {"h": "过", "p": "guò", "k": "动", "a": "melewatkan (waktu), merayakan"}, {"h": "地", "p": "de", "k": "助", "a": "partikel yang dipakai setelah keterangan cara (sebelum kata kerja)"}, {"h": "床", "p": "chuáng", "k": "名", "a": "tempat tidur"}, {"h": "舒服", "p": "shūfu", "k": "形", "a": "nyaman, enak (badan)"}], "dialog": [{"s": "王一雪", "zh": "明天就是女儿的生日了。", "id": "Besok ulang tahun anak perempuan kita.", "tr": "06-1", "py": "Míngtiān jiù shì nǚ'ér de shēngrì le."}, {"s": "刘明", "zh": "你不说，我还真忘了。我们给她准备个什么礼物呢？", "id": "Kalau kamu tidak bilang, aku benar-benar lupa. Kita siapkan hadiah apa untuknya?", "tr": "06-1", "py": "Nǐ bù shuō, wǒ hái zhēn wàng le. Wǒmen gěi tā zhǔnbèi gè shénme lǐwù ne?"}, {"s": "王一雪", "zh": "她喜欢画画，你觉得画笔怎么样？", "id": "Dia suka menggambar. Bagaimana menurutmu kalau alat gambar?", "tr": "06-1", "py": "Tā xǐhuan huà huà, nǐ juéde huàbǐ zěnmeyàng?"}, {"s": "刘明", "zh": "就送画笔吧！", "id": "Kita beri alat gambar saja!", "tr": "06-1", "py": "Jiù sòng huàbǐ ba!"}, {"s": "王一雪", "zh": "那我明天上午就去买。", "id": "Kalau begitu besok pagi aku langsung pergi membelinya.", "tr": "06-1", "py": "Nà wǒ míngtiān shàngwǔ jiù qù mǎi."}, {"s": "刘明", "zh": "好的！我再给她买个大大的生日蛋糕。", "id": "Baik! Aku akan membelikan dia kue ulang tahun yang besar.", "tr": "06-1", "py": "Hǎo de! Wǒ zài gěi tā mǎi gè dà dà de shēngrì dàngāo."}, {"s": "刘明", "zh": "小雪，生日快乐！", "id": "Xiaoxue, selamat ulang tahun!", "tr": "06-3", "py": "Xiǎoxuě, shēngrì kuàilè!"}, {"s": "刘小明", "zh": "姐姐，生日快乐！", "id": "Kak, selamat ulang tahun!", "tr": "06-3", "py": "Jiějie, shēngrì kuàilè!"}, {"s": "王一雪", "zh": "小雪，这是爸爸、妈妈送你的礼物。", "id": "Xiaoxue, ini hadiah dari Papa dan Mama untukmu.", "tr": "06-3", "py": "Xiǎoxuě, zhè shì bàba, māma sòng nǐ de lǐwù."}, {"s": "刘明", "zh": "你打开看看喜欢不喜欢。", "id": "Buka dan lihat, kamu suka atau tidak.", "tr": "06-3", "py": "Nǐ dǎkāi kànkan xǐhuan bu xǐhuan."}, {"s": "刘小雪", "zh": "画笔！我很喜欢！", "id": "Alat gambar! Aku suka sekali!", "tr": "06-3", "py": "Huàbǐ! Wǒ hěn xǐhuan!"}, {"s": "王一雪", "zh": "那你想画点儿什么？", "id": "Kalau begitu kamu mau menggambar apa?", "tr": "06-3", "py": "Nà nǐ xiǎng huà diǎnr shénme?"}, {"s": "刘小雪", "zh": "画我们的家！有爸爸、妈妈、弟弟，还有黑色的狗、白色的猫什么的。", "id": "Menggambar rumah kita! Ada Papa, Mama, adik, juga anjing hitam, kucing putih, dan lain-lain.", "tr": "06-3", "py": "Huà wǒmen de jiā! Yǒu bàba, māma, dìdi, hái yǒu hēisè de gǒu, báisè de māo shénme de."}, {"s": "刘小明", "zh": "那我要画一个穿白色衣服的姐姐。", "id": "Kalau begitu aku mau menggambar kakak yang memakai baju putih.", "tr": "06-3", "py": "Nà wǒ yào huà yí gè chuān báisè yīfu de jiějie."}, {"s": "刘明", "zh": "小雪，看看今天有什么好吃的。", "id": "Xiaoxue, lihat ada makanan enak apa hari ini.", "tr": "06-5", "py": "Xiǎoxuě, kànkan jīntiān yǒu shénme hǎochī de."}, {"s": "刘小雪", "zh": "长长的面条儿，大大的蛋糕。", "id": "Mi yang panjang dan kue yang besar.", "tr": "06-5", "py": "Cháng cháng de miàntiáor, dà dà de dàngāo."}, {"s": "刘明", "zh": "你看，还有鱼啊肉啊什么的，都是你喜欢吃的。", "id": "Lihat, masih ada ikan, daging, dan lain-lain. Semuanya kamu suka.", "tr": "06-5", "py": "Nǐ kàn, hái yǒu yú a ròu a shénme de, dōu shì nǐ xǐhuan chī de."}, {"s": "刘小雪", "zh": "谢谢爸爸、妈妈！", "id": "Terima kasih, Papa, Mama!", "tr": "06-5", "py": "Xièxie bàba, māma!"}, {"s": "王一雪", "zh": "快去叫弟弟过来吃饭吧，吃完饭我们还要出去玩呢。", "id": "Cepat panggil adikmu ke sini untuk makan. Habis makan kita masih mau keluar jalan-jalan.", "tr": "06-5", "py": "Kuài qù jiào dìdi guòlái chīfàn ba, chī wán fàn wǒmen hái yào chūqù wán ne."}, {"s": "刘小雪", "zh": "过生日真好啊！", "id": "Ulang tahun itu menyenangkan sekali!", "tr": "06-5", "py": "Guò shēngrì zhēn hǎo a!"}, {"s": "王一雪", "zh": "是的，过生日就要吃好吃的，还要高高兴兴地玩。", "id": "Benar. Saat ulang tahun harus makan yang enak dan bermain dengan gembira.", "tr": "06-5", "py": "Shì de, guò shēngrì jiù yào chī hǎochī de, hái yào gāo gāoxìng xìng dì wán."}, {"s": "", "zh": "今天是女儿的生日。", "id": "Hari ini ulang tahun anak perempuan kami.", "tr": "06-7", "py": "Jīntiān shì nǚ'ér de shēngrì."}, {"s": "", "zh": "我们买了蛋糕，做了面条儿，还做了鱼啊肉啊什么的。", "id": "Kami membeli kue, membuat mi, dan juga memasak ikan, daging, dan lain-lain.", "tr": "06-7", "py": "Wǒmen mǎi le dàngāo, zuò le miàntiáor, hái zuò le yú a ròu a shénme de."}, {"s": "", "zh": "吃完晚饭，一家人去看了个电影。", "id": "Selesai makan malam, sekeluarga pergi menonton film.", "tr": "06-7", "py": "Chī wán wǎnfàn, yì jiārén qù kàn le gè diànyǐng."}, {"s": "", "zh": "回家后，孩子们早早地就上床了。", "id": "Setelah pulang, anak-anak cepat-cepat naik ke tempat tidur.", "tr": "06-7", "py": "Huí jiā hòu, háizimen zǎo zǎo dì jiù shàng chuáng le."}, {"s": "", "zh": "明天不上学，他们说要舒舒服服地睡一觉，让我们晚点儿叫他们起床。", "id": "Besok tidak sekolah. Mereka bilang mau tidur nyenyak dan meminta kami membangunkan mereka agak siang.", "tr": "06-7", "py": "Míngtiān bú shàngxué, tāmen shuō yào shū shūfu fú dì shuì yí jiào, ràng wǒmen wǎndiǎnr jiào tāmen qǐchuáng."}, {"s": "", "zh": "这是很忙、很累，但很快乐的一天。", "id": "Hari ini sibuk dan melelahkan, tetapi sangat membahagiakan.", "tr": "06-7", "py": "Zhè shì hěn máng, hěn lèi, dàn hěn kuàilè de yì tiān."}], "teks": [{"tr": "06-1", "nama": "课文1 · Hadiah untuk Xiaoxue"}, {"tr": "06-3", "nama": "课文2 · Membuka hadiah"}, {"tr": "06-5", "nama": "课文3 · Makanan ulang tahun"}, {"tr": "06-7", "nama": "课文4 · Buku harian Wang Yixue"}]}, "7": {"judul": "他篮球打得很好", "arti": "Dia jago main basket", "kata": [{"h": "从", "p": "cóng", "k": "介", "a": "dari"}, {"h": "往", "p": "wǎng", "k": "介/动", "a": "ke arah, menuju"}, {"h": "跑", "p": "pǎo", "k": "动", "a": "berlari; pergi (ke suatu tempat)"}, {"h": "打", "p": "dǎ", "k": "动", "a": "bermain (permainan/olahraga bola); memukul"}, {"h": "篮球", "p": "lánqiú", "k": "名", "a": "bola basket"}, {"h": "运动", "p": "yùndòng", "k": "名/动", "a": "olahraga; berolahraga"}, {"h": "踢", "p": "tī", "k": "动", "a": "menendang, bermain (sepak bola)"}, {"h": "足球", "p": "zúqiú", "k": "名", "a": "sepak bola"}, {"h": "球", "p": "qiú", "k": "名", "a": "bola"}, {"h": "得", "p": "de", "k": "助", "a": "partikel antara kata kerja/kata sifat dan pelengkapnya (menyatakan hasil atau tingkat)"}, {"h": "跑步", "p": "pǎobù", "k": "动", "a": "berlari, jogging"}, {"h": "游泳", "p": "yóuyǒng", "k": "动", "a": "berenang"}, {"h": "游", "p": "yóu", "k": "动", "a": "berenang"}, {"h": "爱好", "p": "àihào", "k": "名/动", "a": "hobi; gemar"}, {"h": "开始", "p": "kāishǐ", "k": "动/名", "a": "mulai; awal"}], "dialog": [{"s": "陈天中", "zh": "安妮，你是什么时候从北京回来的？", "id": "Annie, kapan kamu pulang dari Beijing?", "tr": "07-1", "py": "Ānnī, nǐ shì shénme shíhou cóng Běijīng huílái de?"}, {"s": "安妮", "zh": "昨天下午。天中，你怎么一下课就往外跑？", "id": "Kemarin sore. Tianzhong, kenapa begitu kelas selesai kamu langsung lari keluar?", "tr": "07-1", "py": "Zuótiān xiàwǔ. Tiānzhōng, nǐ zěnme yíxià kè jiù wǎng wài pǎo?"}, {"s": "陈天中", "zh": "我跟同学说好了，一起去打篮球。", "id": "Aku sudah janji dengan teman sekelas untuk main basket bersama.", "tr": "07-1", "py": "Wǒ gēn tóngxué shuō hǎo le, yìqǐ qù dǎ lánqiú."}, {"s": "安妮", "zh": "我也想跟你们一起玩。", "id": "Aku juga mau ikut main bersama kalian.", "tr": "07-1", "py": "Wǒ yě xiǎng gēn nǐmen yìqǐ wán."}, {"s": "陈天中", "zh": "没问题，走吧。", "id": "Boleh, ayo berangkat.", "tr": "07-1", "py": "Méi wèntí, zǒu ba."}, {"s": "安妮", "zh": "天中，你是不是很喜欢打篮球？", "id": "Tianzhong, kamu suka sekali main basket, ya?", "tr": "07-3", "py": "Tiānzhōng, nǐ shì bu shì hěn xǐhuan dǎ lánqiú?"}, {"s": "陈天中", "zh": "没错。", "id": "Betul.", "tr": "07-3", "py": "Méi cuò."}, {"s": "安妮", "zh": "你还喜欢什么运动？", "id": "Olahraga apa lagi yang kamu suka?", "tr": "07-3", "py": "Nǐ hái xǐhuan shénme yùndòng?"}, {"s": "陈天中", "zh": "我还喜欢踢足球，一到星期天就跟朋友们去踢球。", "id": "Aku juga suka main sepak bola. Setiap hari Minggu aku main bola bersama teman-teman.", "tr": "07-3", "py": "Wǒ hái xǐhuan tī zúqiú, yí dào xīngqītiān jiù gēn péngyoumen qù tī qiú."}, {"s": "安妮", "zh": "你踢得怎么样？", "id": "Mainmu bagaimana?", "tr": "07-3", "py": "Nǐ tī de zěnmeyàng?"}, {"s": "陈天中", "zh": "我踢得还可以。", "id": "Lumayanlah.", "tr": "07-3", "py": "Wǒ tī de hái kěyǐ."}, {"s": "陈天中", "zh": "你篮球打得怎么样？", "id": "Main basketmu bagaimana?", "tr": "07-5", "py": "Nǐ lánqiú dǎ de zěnmeyàng?"}, {"s": "安妮", "zh": "打得还可以。", "id": "Mainku lumayan.", "tr": "07-5", "py": "Dǎ de hái kěyǐ."}, {"s": "陈天中", "zh": "跑步呢？你跑得快不快？", "id": "Kalau lari? Larimu cepat tidak?", "tr": "07-5", "py": "Pǎobù ne? Nǐ pǎo de kuài bu kuài?"}, {"s": "安妮", "zh": "我跑得不快，也不太喜欢跑步。", "id": "Lariku tidak cepat, dan aku juga kurang suka lari.", "tr": "07-5", "py": "Wǒ pǎo de bú kuài, yě bú tài xǐhuan pǎobù."}, {"s": "陈天中", "zh": "那你喜欢游泳吗？", "id": "Kalau begitu, kamu suka berenang?", "tr": "07-5", "py": "Nà nǐ xǐhuan yóuyǒng ma?"}, {"s": "安妮", "zh": "喜欢，但我游泳游得不快。", "id": "Suka, tetapi renangku tidak cepat.", "tr": "07-5", "py": "Xǐhuan, dàn wǒ yóuyǒng yóu de bú kuài."}, {"s": "", "zh": "我的爱好是运动。", "id": "Hobiku olahraga.", "tr": "07-7", "py": "Wǒ de àihào shì yùndòng."}, {"s": "", "zh": "从上小学开始，我每天都跟爸爸去运动。", "id": "Sejak masuk SD, setiap hari aku berolahraga bersama Ayah.", "tr": "07-7", "py": "Cóng shàng xiǎoxué kāishǐ, wǒ měi tiān dōu gēn bàba qù yùndòng."}, {"s": "", "zh": "现在我篮球打得很好，足球踢得不错，游泳游得也很快。", "id": "Sekarang aku jago main basket, main sepak bolaku lumayan, dan berenangku juga cepat.", "tr": "07-7", "py": "Xiànzài wǒ lánqiú dǎ de hěn hǎo, zúqiú tī de búcuò, yóuyǒng yóu de yě hěn kuài."}, {"s": "", "zh": "我一有时间就去运动。", "id": "Begitu ada waktu, aku langsung berolahraga.", "tr": "07-7", "py": "Wǒ yì yǒu shíjiān jiù qù yùndòng."}], "teks": [{"tr": "07-1", "nama": "课文1 · Langsung lari setelah kelas"}, {"tr": "07-3", "nama": "课文2 · Olahraga kesukaan Tianzhong"}, {"tr": "07-5", "nama": "课文3 · Lari dan renang"}, {"tr": "07-7", "nama": "课文4 · Buku harian Chen Tianzhong"}]}, "8": {"judul": "虽然你忘了，但是我记得", "arti": "Meskipun kamu lupa, aku ingat", "kata": [{"h": "手表", "p": "shǒubiǎo", "k": "名", "a": "jam tangan"}, {"h": "左边", "p": "zuǒbian", "k": "名", "a": "sebelah kiri"}, {"h": "左", "p": "zuǒ", "k": "名", "a": "kiri"}, {"h": "比", "p": "bǐ", "k": "介/动", "a": "daripada; membandingkan"}, {"h": "右边", "p": "yòubian", "k": "名", "a": "sebelah kanan"}, {"h": "右", "p": "yòu", "k": "名", "a": "kanan"}, {"h": "记得", "p": "jìde", "k": "动", "a": "ingat"}, {"h": "爱情片", "p": "àiqíngpiàn", "k": "名", "a": "film romantis"}, {"h": "有意思", "p": "yǒu yìsi", "k": "形", "a": "menarik, seru"}, {"h": "点", "p": "diǎn", "k": "动", "a": "memilih, memesan (makanan)"}, {"h": "虽然", "p": "suīrán", "k": "连", "a": "meskipun, walaupun"}, {"h": "但是", "p": "dànshì", "k": "连", "a": "tetapi, namun"}, {"h": "花", "p": "huā", "k": "动", "a": "menghabiskan (uang, waktu)"}, {"h": "妻子", "p": "qīzi", "k": "名", "a": "istri"}, {"h": "丈夫", "p": "zhàngfu", "k": "名", "a": "suami"}, {"h": "饭馆", "p": "fànguǎn", "k": "名", "a": "rumah makan, restoran"}], "dialog": [{"s": "王一雪", "zh": "你看，这两块手表怎么样？", "id": "Lihat, bagaimana dua jam tangan ini?", "tr": "08-1", "py": "Nǐ kàn, zhè liǎng kuài shǒubiǎo zěnmeyàng?"}, {"s": "刘明", "zh": "都不错！", "id": "Dua-duanya bagus!", "tr": "08-1", "py": "Dōu búcuò!"}, {"s": "王一雪", "zh": "我喜欢左边这个。", "id": "Aku suka yang sebelah kiri ini.", "tr": "08-1", "py": "Wǒ xǐhuan zuǒbian zhège."}, {"s": "刘明", "zh": "我也觉得左边的比右边的好看。", "id": "Menurutku juga yang kiri lebih bagus daripada yang kanan.", "tr": "08-1", "py": "Wǒ yě juéde zuǒbian de bǐ yòubian de hǎokàn."}, {"s": "王一雪", "zh": "你看看要多少钱！", "id": "Coba lihat harganya berapa!", "tr": "08-1", "py": "Nǐ kànkan yào duōshao qián!"}, {"s": "刘明", "zh": "真不便宜！八千八！", "id": "Mahal sekali! Delapan ribu delapan ratus!", "tr": "08-1", "py": "Zhēn bú piányi! Bāqiānbā!"}, {"s": "刘明", "zh": "今天有不少电影，我们看个电影吧。", "id": "Hari ini ada banyak film. Ayo kita nonton film.", "tr": "08-3", "py": "Jīntiān yǒu bù shǎo diànyǐng, wǒmen kàn gè diànyǐng ba."}, {"s": "王一雪", "zh": "好啊！我们看哪个？", "id": "Boleh! Kita nonton yang mana?", "tr": "08-3", "py": "Hǎo a! Wǒmen kàn nǎge?"}, {"s": "刘明", "zh": "我记得你喜欢看爱情片，我们看那个爱情片，怎么样？", "id": "Aku ingat kamu suka film romantis. Bagaimana kalau kita nonton film romantis itu?", "tr": "08-3", "py": "Wǒ jìde nǐ xǐhuan kàn àiqíngpiàn, wǒmen kàn nàge àiqíngpiàn, zěnmeyàng?"}, {"s": "王一雪", "zh": "还是看这个吧，我看网上说这个电影比那个爱情片更有意思。", "id": "Yang ini saja. Aku baca di internet, film ini lebih seru daripada film romantis itu.", "tr": "08-3", "py": "Háishi kàn zhège ba, wǒ kàn wǎngshang shuō zhège diànyǐng bǐ nàge àiqíngpiàn gèng yǒuyìsi."}, {"s": "刘明", "zh": "好。我去买票。", "id": "Baik. Aku beli tiketnya.", "tr": "08-3", "py": "Hǎo. Wǒ qù mǎi piào."}, {"s": "王一雪", "zh": "到网上买吧，网上买比在这里买便宜。", "id": "Beli lewat internet saja, beli online lebih murah daripada beli di sini.", "tr": "08-3", "py": "Dào wǎngshang mǎi ba, wǎngshang mǎi bǐ zài zhèlǐ mǎi piányi."}, {"s": "刘明", "zh": "您好！就要这几个菜吧，谢谢！", "id": "Halo! Kami pesan beberapa masakan ini saja, terima kasih!", "tr": "08-5", "py": "Nín hǎo! Jiù yào zhè jǐ gè cài ba, xièxie!"}, {"s": "王一雪", "zh": "怎么点这么多菜？", "id": "Kenapa pesan masakan sebanyak ini?", "tr": "08-5", "py": "Zěnme diǎn zhème duō cài?"}, {"s": "刘明", "zh": "你想想，今天是几月几号？", "id": "Coba pikir, hari ini tanggal berapa?", "tr": "08-5", "py": "Nǐ xiǎngxiǎng, jīntiān shì jǐ yuè jǐ hào?"}, {"s": "王一雪", "zh": "8月27号。啊！我的生日！", "id": "Tanggal 27 Agustus. Ah! Ulang tahunku!", "tr": "08-5", "py": "8 Yuè 2 7 hào. A! Wǒ de shēngrì!"}, {"s": "刘明", "zh": "生日快乐！虽然你忘了，但是我记得。你看看这是什么？", "id": "Selamat ulang tahun! Meskipun kamu lupa, aku ingat. Coba lihat, ini apa?", "tr": "08-5", "py": "Shēngrì kuàilè! Suīrán nǐ wàng le, dànshì wǒ jìde. Nǐ kànkan zhè shì shénme?"}, {"s": "王一雪", "zh": "手表！吃饭、看电影、买手表，今天花了不少钱吧？", "id": "Jam tangan! Makan, nonton film, beli jam tangan... hari ini pasti menghabiskan banyak uang, ya?", "tr": "08-5", "py": "Shǒubiǎo! Chīfàn, kàn diànyǐng, mǎi shǒubiǎo, jīntiān huā le bù shǎo qián ba?"}, {"s": "刘明", "zh": "虽然花了一些钱，但是我们过了一个快乐的生日。", "id": "Meskipun menghabiskan sedikit uang, kita merayakan ulang tahun yang bahagia.", "tr": "08-5", "py": "Suīrán huā le yìxiē qián, dànshì wǒmen guò le yí gè kuàilè de shēngrì."}, {"s": "", "zh": "虽然妻子忘了今天是自己的生日，但是丈夫记得。", "id": "Meskipun sang istri lupa bahwa hari ini ulang tahunnya, sang suami ingat.", "tr": "08-7", "py": "Suīrán qīzi wàng le jīntiān shì zìjǐ de shēngrì, dànshì zhàngfu jìde."}, {"s": "", "zh": "丈夫请妻子去饭馆吃饭、去电影院看电影，还给妻子买了一块非常漂亮的手表。", "id": "Suami mentraktir istrinya makan di restoran dan menonton film di bioskop, bahkan membelikannya jam tangan yang sangat bagus.", "tr": "08-7", "py": "Zhàngfu qǐng qīzi qù fànguǎn chīfàn, qù diànyǐngyuàn kàn diànyǐng, huán gěi qīzi mǎi le yí kuài fēicháng piàoliang de shǒubiǎo."}, {"s": "", "zh": "妻子觉得今天很快乐。", "id": "Sang istri merasa hari ini sangat bahagia.", "tr": "08-7", "py": "Qīzi juéde jīntiān hěn kuàilè."}], "teks": [{"tr": "08-1", "nama": "课文1 · Memilih jam tangan"}, {"tr": "08-3", "nama": "课文2 · Film apa yang ditonton?"}, {"tr": "08-5", "nama": "课文3 · Kejutan ulang tahun"}, {"tr": "08-7", "nama": "课文4 · Hari istimewa Wang Yixue"}]}, "9": {"judul": "我去买杯奶茶", "arti": "Aku mau beli segelas bubble tea", "kata": [{"h": "坏", "p": "huài", "k": "形", "a": "buruk; rusak"}, {"h": "旁边", "p": "pángbiān", "k": "名", "a": "samping, sebelah"}, {"h": "男孩儿", "p": "nánháir", "k": "名", "a": "anak laki-laki"}, {"h": "这样", "p": "zhèyàng", "k": "代", "a": "seperti ini, begini"}, {"h": "个子", "p": "gèzi", "k": "名", "a": "tinggi badan, perawakan"}, {"h": "那么", "p": "nàme", "k": "代", "a": "se… itu, seperti itu"}, {"h": "高", "p": "gāo", "k": "形", "a": "tinggi"}, {"h": "门口", "p": "ménkǒu", "k": "名", "a": "ambang pintu, pintu masuk"}, {"h": "咖啡", "p": "kāfēi", "k": "名", "a": "kopi"}, {"h": "离", "p": "lí", "k": "动", "a": "berjarak dari, jauh/dekat dari"}, {"h": "近", "p": "jìn", "k": "形", "a": "dekat, di dekat"}, {"h": "走路", "p": "zǒulù", "k": "动", "a": "berjalan kaki"}, {"h": "周", "p": "zhōu", "k": "名", "a": "minggu, pekan"}], "dialog": [{"s": "王一雪", "zh": "儿子的裤子坏了，我们给他买条新的吧。", "id": "Celana anak kita rusak. Ayo kita belikan dia yang baru.", "tr": "09-1", "py": "Érzi de kùzi huài le, wǒmen gěi tā mǎi tiáo xīn de ba."}, {"s": "刘明", "zh": "好啊。", "id": "Boleh.", "tr": "09-1", "py": "Hǎo a."}, {"s": "王一雪", "zh": "你看这条黑色的怎么样？", "id": "Bagaimana menurutmu yang hitam ini?", "tr": "09-1", "py": "Nǐ kàn zhè tiáo hēisè de zěnmeyàng?"}, {"s": "刘明", "zh": "没有你上次买的那条好看。", "id": "Tidak sebagus yang kamu beli waktu itu.", "tr": "09-1", "py": "Méiyǒu nǐ shàng cì mǎi de nà tiáo hǎokàn."}, {"s": "王一雪", "zh": "旁边那个男孩儿就穿了这样的裤子，我觉得很好看啊！", "id": "Anak laki-laki di sebelah sana memakai celana seperti ini, menurutku bagus kok!", "tr": "09-1", "py": "Pángbiān nàge nánháir jiù chuān le zhèyàng de kùzi, wǒ juéde hěn hǎokàn a!"}, {"s": "刘明", "zh": "儿子的个子没有他那么高，穿上就不会太好看。", "id": "Badan anak kita tidak setinggi dia. Kalau dipakai, pasti tidak terlalu bagus.", "tr": "09-1", "py": "Érzi de gèzi méiyǒu tā nàme gāo, chuān shàng jiù bú huì tài hǎokàn."}, {"s": "王一雪", "zh": "好吧，我们再去那边看看。", "id": "Baiklah, kita lihat-lihat lagi ke sebelah sana.", "tr": "09-1", "py": "Hǎo ba, wǒmen zài qù nàbiān kànkan."}, {"s": "王一雪", "zh": "门口有家奶茶店。你想喝杯奶茶吗？", "id": "Di depan pintu ada kedai teh susu. Kamu mau minum segelas?", "tr": "09-3", "py": "Ménkǒu yǒu jiā nǎichá diàn. Nǐ xiǎng hē bēi nǎichá ma?"}, {"s": "刘明", "zh": "我想喝咖啡，还是去咖啡店吧。", "id": "Aku mau minum kopi. Kita ke kedai kopi saja.", "tr": "09-3", "py": "Wǒ xiǎng hē kāfēi, háishi qù kāfēi diàn ba."}, {"s": "王一雪", "zh": "咖啡店离这儿有点儿远。", "id": "Kedai kopinya agak jauh dari sini.", "tr": "09-3", "py": "Kāfēi diàn lí zhèr yǒudiǎnr yuǎn."}, {"s": "刘明", "zh": "没关系，那家店的咖啡很好喝。", "id": "Tidak apa-apa, kopi di kedai itu enak sekali.", "tr": "09-3", "py": "Méiguānxi, nà jiā diàn de kāfēi hěn hǎo hē."}, {"s": "王一雪", "zh": "那你等一下，我去买杯奶茶。", "id": "Kalau begitu tunggu sebentar, aku beli segelas teh susu dulu.", "tr": "09-3", "py": "Nà nǐ děng yíxià, wǒ qù mǎi bēi nǎichá."}, {"s": "刘明", "zh": "你不想喝咖啡吗？", "id": "Kamu tidak mau minum kopi?", "tr": "09-3", "py": "Nǐ bù xiǎng hē kāfēi ma?"}, {"s": "王一雪", "zh": "喝了咖啡，晚上就别想睡觉了。", "id": "Kalau minum kopi, malamnya aku tidak bisa tidur.", "tr": "09-3", "py": "Hē le kāfēi, wǎnshang jiù bié xiǎng shuìjiào le."}, {"s": "刘明", "zh": "我们打车回去吧。", "id": "Kita pulang naik taksi saja.", "tr": "09-5", "py": "Wǒmen dǎchē huíqù ba."}, {"s": "王一雪", "zh": "这里离家很近，还是走路吧。", "id": "Dari sini ke rumah dekat, lebih baik jalan kaki saja.", "tr": "09-5", "py": "Zhèlǐ lí jiā hěn jìn, háishi zǒulù ba."}, {"s": "刘明", "zh": "要走多长时间？", "id": "Harus jalan berapa lama?", "tr": "09-5", "py": "Yào zǒu duō cháng shíjiān?"}, {"s": "王一雪", "zh": "走半个多小时就到了。", "id": "Jalan setengah jam lebih sudah sampai.", "tr": "09-5", "py": "Zǒu bàn gè duō xiǎoshí jiù dào le."}, {"s": "刘明", "zh": "好的。每天上下班都坐车，今天运动运动吧。", "id": "Baiklah. Setiap hari berangkat dan pulang kerja selalu naik kendaraan, hari ini kita olahraga sedikit.", "tr": "09-5", "py": "Hǎo de. Měi tiān shàng xiàbān dōu zuò chē, jīntiān yùndòng yùndòng ba."}, {"s": "", "zh": "这周刘明休息，我下班后跟他去了一家商店。", "id": "Minggu ini Liu Ming libur. Sepulang kerja aku pergi ke sebuah toko bersamanya.", "tr": "09-7", "py": "Zhè zhōu Liú Míng xiūxi, wǒ xiàbān hòu gēn tā qù le yì jiā shāngdiàn."}, {"s": "", "zh": "商店里边的衣服没有大商场里的好看。", "id": "Baju di toko itu tidak sebagus baju di mal besar.", "tr": "09-7", "py": "Shāngdiàn lǐbian de yīfu méiyǒu dà shāngchǎng lǐ de hǎokàn."}, {"s": "", "zh": "我们没有买到喜欢的衣服，从商店出来就到咖啡店坐了坐。", "id": "Kami tidak menemukan baju yang kami suka, jadi setelah keluar dari toko kami duduk-duduk sebentar di kedai kopi.", "tr": "09-7", "py": "Wǒmen méiyǒu mǎi dào xǐhuan de yīfu, cóng shāngdiàn chūlái jiù dào kāfēi diàn zuò le zuò."}, {"s": "", "zh": "因为想运动运动，所以喝完东西，我们就走回家了。", "id": "Karena ingin sedikit berolahraga, setelah selesai minum kami berjalan kaki pulang.", "tr": "09-7", "py": "Yīnwèi xiǎng yùndòng yùndòng, suǒyǐ hē wán dōngxi, wǒmen jiù zǒu huí jiā le."}], "teks": [{"tr": "09-1", "nama": "课文1 · Celana baru untuk anak"}, {"tr": "09-3", "nama": "课文2 · Kopi atau teh susu?"}, {"tr": "09-5", "nama": "课文3 · Jalan kaki pulang"}, {"tr": "09-7", "nama": "课文4 · Buku harian Wang Yixue"}]}, "10": {"judul": "就要考试了", "arti": "Ujian sudah dekat", "kata": [{"h": "开学", "p": "kāixué", "k": "动", "a": "mulai sekolah (awal semester)"}, {"h": "门", "p": "mén", "k": "名", "a": "pintu"}, {"h": "后面", "p": "hòumiàn", "k": "名", "a": "belakang"}, {"h": "笔", "p": "bǐ", "k": "名", "a": "pena; pensil"}, {"h": "帮", "p": "bāng", "k": "动", "a": "membantu"}, {"h": "考试", "p": "kǎoshì", "k": "动/名", "a": "menempuh ujian; ujian"}, {"h": "词", "p": "cí", "k": "名", "a": "kata"}, {"h": "本子", "p": "běnzi", "k": "名", "a": "buku tulis"}, {"h": "错", "p": "cuò", "k": "形", "a": "salah, keliru"}, {"h": "题", "p": "tí", "k": "名", "a": "soal, pertanyaan"}, {"h": "还是", "p": "háishi", "k": "连", "a": "atau (dalam kalimat tanya)"}, {"h": "考", "p": "kǎo", "k": "动", "a": "menempuh ujian"}, {"h": "快要", "p": "kuàiyào", "k": "副", "a": "hampir, akan segera"}, {"h": "笑", "p": "xiào", "k": "动", "a": "tersenyum, tertawa"}], "dialog": [{"s": "刘明", "zh": "小明，你们明天开学，你准备好了吗？", "id": "Xiaoming, besok kalian mulai sekolah. Kamu sudah siap?", "tr": "10-1", "py": "Xiǎomíng, nǐmen míngtiān kāixué, nǐ zhǔnbèi hǎo le ma?"}, {"s": "刘小明", "zh": "明天就开学啊？爸爸，我的书包你看见了吗？", "id": "Besok sudah mulai sekolah? Papa, Papa lihat tas sekolahku?", "tr": "10-1", "py": "Míngtiān jiù kāixué a? Bàba, wǒ de shūbāo nǐ kànjiàn le ma?"}, {"s": "刘明", "zh": "书包在门后面。", "id": "Tasnya di belakang pintu.", "tr": "10-1", "py": "Shūbāo zài mén hòumiàn."}, {"s": "刘小明", "zh": "书在哪儿呢？笔呢？", "id": "Bukunya di mana? Penanya?", "tr": "10-1", "py": "Shū zài nǎr ne? Bǐ ne?"}, {"s": "刘明", "zh": "书在床上，笔在桌子上。", "id": "Bukunya di atas tempat tidur, penanya di atas meja.", "tr": "10-1", "py": "Shū zài chuáng shàng, bǐ zài zhuōzi shàng."}, {"s": "刘小明", "zh": "太好了！现在都准备好了。", "id": "Bagus! Sekarang semuanya sudah siap.", "tr": "10-1", "py": "Tài hǎo le! Xiànzài dōu zhǔnbèi hǎo le."}, {"s": "刘明", "zh": "这次爸爸帮你，下次你自己准备，好不好？", "id": "Kali ini Papa bantu, lain kali kamu siapkan sendiri, ya?", "tr": "10-1", "py": "Zhè cì bàba bāng nǐ, xià cì nǐ zìjǐ zhǔnbèi, hǎo bu hǎo?"}, {"s": "刘小明", "zh": "好！", "id": "Oke!", "tr": "10-1", "py": "Hǎo!"}, {"s": "王一雪", "zh": "小雪，你在做什么呢？", "id": "Xiaoxue, kamu sedang apa?", "tr": "10-3", "py": "Xiǎoxuě, nǐ zài zuò shénme ne?"}, {"s": "刘小雪", "zh": "明天考试，我在看书呢。", "id": "Besok ujian, aku sedang membaca buku.", "tr": "10-3", "py": "Míngtiān kǎoshì, wǒ zài kàn shū ne."}, {"s": "王一雪", "zh": "这些词要好好看看。", "id": "Kata-kata ini harus dipelajari baik-baik.", "tr": "10-3", "py": "Zhèxiē cí yào hǎo hǎokàn kàn."}, {"s": "刘小雪", "zh": "我看过了，意思也都懂了。", "id": "Sudah kubaca, artinya juga sudah paham semua.", "tr": "10-3", "py": "Wǒ kàn guò le, yìsi yě dōu dǒng le."}, {"s": "王一雪", "zh": "你的本子呢？本子上做错的题也要看一看。", "id": "Mana buku tulismu? Soal-soal yang salah di buku tulis juga harus dilihat lagi.", "tr": "10-3", "py": "Nǐ de běnzi ne? Běnzi shàng zuò cuò de tí yě yào kàn yí kàn."}, {"s": "刘小雪", "zh": "妈妈，是您准备考试还是我准备考试？", "id": "Ma, yang mau ujian itu Mama atau aku?", "tr": "10-3", "py": "Māma, shì nín zhǔnbèi kǎoshì háishi wǒ zhǔnbèi kǎoshì?"}, {"s": "刘小雪", "zh": "妈妈，我回来了！", "id": "Ma, aku pulang!", "tr": "10-5", "py": "Māma, wǒ huílái le!"}, {"s": "王一雪", "zh": "我买了奶茶，就在桌子上，自己去拿吧。", "id": "Mama beli teh susu, ada di atas meja. Ambil sendiri, ya.", "tr": "10-5", "py": "Wǒ mǎi le nǎichá, jiù zài zhuōzi shàng, zìjǐ qù ná ba."}, {"s": "刘小雪", "zh": "谢谢妈妈！", "id": "Terima kasih, Ma!", "tr": "10-5", "py": "Xièxie māma!"}, {"s": "王一雪", "zh": "今天考试考得怎么样？", "id": "Ujian hari ini bagaimana?", "tr": "10-5", "py": "Jīntiān kǎoshì kǎo de zěnmeyàng?"}, {"s": "刘小雪", "zh": "我觉得比上次好。", "id": "Menurutku lebih baik daripada yang terakhir.", "tr": "10-5", "py": "Wǒ juéde bǐ shàng cì hǎo."}, {"s": "王一雪", "zh": "真不错！饭菜快要做好了，你叫弟弟一起去洗手吧。", "id": "Hebat! Makanannya sebentar lagi siap. Ajak adikmu cuci tangan bersama.", "tr": "10-5", "py": "Zhēn búcuò! Fàn cài kuàiyào zuò hǎo le, nǐ jiào dìdi yìqǐ qù xǐ shǒu ba."}, {"s": "刘小明", "zh": "妈妈，我是第一名，姐姐还没洗完呢。", "id": "Ma, aku yang pertama selesai, Kakak belum selesai cuci tangan.", "tr": "10-5", "py": "Māma, wǒ shì dìyī míng, jiějie hái méi xǐ wán ne."}, {"s": "王一雪", "zh": "你洗得真快啊！", "id": "Cepat sekali kamu cuci tangannya!", "tr": "10-5", "py": "Nǐ xǐ de zhēn kuài a!"}, {"s": "", "zh": "快要开学了，爸爸帮弟弟准备书包、本子和笔。", "id": "Sekolah sebentar lagi mulai. Papa membantu adik menyiapkan tas, buku tulis, dan pena.", "tr": "10-7", "py": "Kuàiyào kāixué le, bàba bāng dìdi zhǔnbèi shūbāo, běnzi hé bǐ."}, {"s": "", "zh": "就要考试了，妈妈让我看书、看做错的题。", "id": "Ujian sudah dekat, Mama menyuruhku membaca buku dan melihat lagi soal-soal yang salah.", "tr": "10-7", "py": "Jiù yào kǎoshì le, māma ràng wǒ kàn shū, kàn zuò cuò de tí."}, {"s": "", "zh": "我们上学，爸爸、妈妈比我们还忙。", "id": "Kami yang sekolah, tetapi Papa dan Mama malah lebih sibuk daripada kami.", "tr": "10-7", "py": "Wǒmen shàngxué, bàba, māma bǐ wǒmen hái máng."}, {"s": "", "zh": "我问他们：\"是我和弟弟上学还是你们上学？\"", "id": "Aku bertanya kepada mereka, \"Yang sekolah itu aku dan adik, atau kalian?\"", "tr": "10-7", "py": "Wǒ wèn tāmen: \"Shì wǒ hé dìdi shàngxué háishi nǐmen shàngxué?\""}, {"s": "", "zh": "我问完，他们都笑了。", "id": "Setelah aku bertanya, mereka berdua tertawa.", "tr": "10-7", "py": "Wǒ wèn wán, tāmen dōu xiào le."}], "teks": [{"tr": "10-1", "nama": "课文1 · Persiapan masuk sekolah"}, {"tr": "10-3", "nama": "课文2 · Belajar untuk ujian"}, {"tr": "10-5", "nama": "课文3 · Hasil ujian"}, {"tr": "10-7", "nama": "课文4 · Buku harian Xiaoxue"}]}, "11": {"judul": "我最喜欢吃中国菜", "arti": "Aku paling suka masakan Tiongkok", "kata": [{"h": "头", "p": "tóu", "k": "名", "a": "kepala"}, {"h": "疼", "p": "téng", "k": "形", "a": "sakit, nyeri"}, {"h": "经常", "p": "jīngcháng", "k": "副", "a": "sering"}, {"h": "动", "p": "dòng", "k": "动", "a": "bergerak"}, {"h": "着", "p": "zhe", "k": "助", "a": "partikel keadaan berlangsung"}, {"h": "路上", "p": "lùshang", "k": "名", "a": "jalan; perjalanan"}, {"h": "慢", "p": "màn", "k": "形", "a": "lambat, pelan"}, {"h": "进", "p": "jìn", "k": "动", "a": "masuk"}, {"h": "药", "p": "yào", "k": "名", "a": "obat"}, {"h": "身体", "p": "shēntǐ", "k": "名", "a": "badan, kesehatan"}, {"h": "时", "p": "shí", "k": "名", "a": "waktu, saat (suatu periode waktu)"}, {"h": "最", "p": "zuì", "k": "副", "a": "paling"}, {"h": "药店", "p": "yàodiàn", "k": "名", "a": "apotek, toko obat"}], "dialog": [{"s": "王一飞", "zh": "家月，都下课了，你怎么还不回家？", "id": "Jiayue, kelas sudah selesai, kenapa kamu belum pulang?", "tr": "11-1", "py": "Jiāyuè, dōu xiàkè le, nǐ zěnme hái bù huí jiā?"}, {"s": "白家月", "zh": "我头疼，不太舒服。", "id": "Kepalaku sakit, badanku kurang enak.", "tr": "11-1", "py": "Wǒ tóu téng, bú tài shūfu."}, {"s": "王一飞", "zh": "你这几天经常头疼，去医院看看吧。", "id": "Beberapa hari ini kamu sering sakit kepala. Periksa ke rumah sakit, ya.", "tr": "11-1", "py": "Nǐ zhè jǐ tiān jīngcháng tóu téng, qù yīyuàn kànkan ba."}, {"s": "白家月", "zh": "我想休息一下，现在不能动，一动就疼。", "id": "Aku mau istirahat sebentar. Sekarang aku tidak bisa bergerak, begitu bergerak langsung sakit.", "tr": "11-1", "py": "Wǒ xiǎng xiūxi yíxià, xiànzài bù néng dòng, yí dòng jiù téng."}, {"s": "王一飞", "zh": "那你在这儿坐着，我去开车，一会儿送你去医院。", "id": "Kalau begitu kamu duduk saja di sini. Aku ambil mobil, sebentar lagi kuantar kamu ke rumah sakit.", "tr": "11-1", "py": "Nà nǐ zài zhèr zuò zhe, wǒ qù kāichē, yíhuìr sòng nǐ qù yīyuàn."}, {"s": "白家月", "zh": "谢谢王老师。", "id": "Terima kasih, Bu Wang.", "tr": "11-1", "py": "Xièxie Wáng lǎoshī."}, {"s": "王一飞", "zh": "现在路上车多，还下着雪，我开慢一点儿。", "id": "Sekarang di jalan banyak mobil dan salju masih turun. Aku menyetir pelan-pelan saja.", "tr": "11-3", "py": "Xiànzài lùshang chē duō, hái xià zhe xuě, wǒ kāi màn yìdiǎnr."}, {"s": "白家月", "zh": "没问题，现在头没那么疼了。", "id": "Tidak apa-apa, sekarang kepalaku tidak terlalu sakit lagi.", "tr": "11-3", "py": "Méi wèntí, xiànzài tóu méi nàme téng le."}, {"s": "王一飞", "zh": "好。李文来电话了，你帮我接一下。", "id": "Baik. Li Wen menelepon, tolong angkatkan ya.", "tr": "11-3", "py": "Hǎo. Lǐ Wén lái diànhuà le, nǐ bāng wǒ jiē yíxià."}, {"s": "白家月", "zh": "喂，李文，王老师开着车呢，你找她有事吗？", "id": "Halo, Li Wen. Bu Wang sedang menyetir. Ada perlu dengan beliau?", "tr": "11-3", "py": "Wèi, Lǐ Wén, Wáng lǎoshī kāi zhe chē ne, nǐ zhǎo tā yǒu shì ma?"}, {"s": "李文", "zh": "没什么事。今天雪这么大，你们开车去哪儿啊？", "id": "Tidak ada yang penting. Hari ini saljunya lebat sekali, kalian naik mobil mau ke mana?", "tr": "11-3", "py": "Méi shénme shì. Jīntiān xuě zhème dà, nǐmen kāichē qù nǎr a?"}, {"s": "白家月", "zh": "去医院，我头有点儿疼。", "id": "Ke rumah sakit, kepalaku agak sakit.", "tr": "11-3", "py": "Qù yīyuàn, wǒ tóu yǒudiǎnr téng."}, {"s": "李文", "zh": "那我一会儿去看看你。", "id": "Kalau begitu nanti aku datang menjengukmu.", "tr": "11-3", "py": "Nà wǒ yíhuìr qù kànkan nǐ."}, {"s": "白家月", "zh": "李文，快请进！", "id": "Li Wen, silakan masuk!", "tr": "11-5", "py": "Lǐ Wén, kuài qǐng jìn!"}, {"s": "李文", "zh": "家月，你怎么样了？头还疼吗？", "id": "Jiayue, bagaimana keadaanmu? Kepalamu masih sakit?", "tr": "11-5", "py": "Jiāyuè, nǐ zěnmeyàng le? Tóu hái téng ma?"}, {"s": "白家月", "zh": "不那么疼了。医生开了一些药，吃完就好多了。", "id": "Sudah tidak terlalu sakit. Dokter memberi beberapa obat; setelah diminum, rasanya jauh lebih baik.", "tr": "11-5", "py": "Bú nàme téng le. Yīshēng kāi le yìxiē yào, chī wán jiù hǎoduō le."}, {"s": "李文", "zh": "那就好！", "id": "Syukurlah!", "tr": "11-5", "py": "Nà jiù hǎo!"}, {"s": "王一飞", "zh": "家月，你想不想吃点儿东西？", "id": "Jiayue, kamu mau makan sesuatu?", "tr": "11-5", "py": "Jiāyuè, nǐ xiǎng bu xiǎng chī diǎnr dōngxi?"}, {"s": "李文", "zh": "吃点儿吧，身体不舒服时更要好好吃饭。", "id": "Makanlah sedikit. Saat badan kurang sehat, justru harus makan dengan baik.", "tr": "11-5", "py": "Chī diǎnr ba, shēntǐ bù shūfu shí gèng yào hǎo hǎochī fàn."}, {"s": "白家月", "zh": "吃点儿什么呢？", "id": "Makan apa, ya?", "tr": "11-5", "py": "Chī diǎnr shénme ne?"}, {"s": "王一飞", "zh": "你最喜欢吃中国菜，我做几个中国菜吧。", "id": "Kamu paling suka masakan Tiongkok. Aku masakkan beberapa masakan Tiongkok, ya.", "tr": "11-5", "py": "Nǐ zuì xǐhuan chī Zhōngguó cài, wǒ zuò jǐ gè Zhōngguó cài ba."}, {"s": "白家月", "zh": "好的，谢谢王老师。", "id": "Baik, terima kasih, Bu Wang.", "tr": "11-5", "py": "Hǎo de, xièxie Wáng lǎoshī."}, {"s": "", "zh": "我这几天经常头疼，从药店买了点儿药，没去医院。", "id": "Beberapa hari ini aku sering sakit kepala. Aku membeli obat di apotek dan tidak pergi ke rumah sakit.", "tr": "11-7", "py": "Wǒ zhè jǐ tiān jīngcháng tóu téng, cóng yàodiàn mǎi le diǎnr yào, méi qù yīyuàn."}, {"s": "", "zh": "今天下课后，王老师看我不舒服，就送我去医院了。", "id": "Hari ini setelah kelas, Bu Wang melihat aku kurang sehat, lalu mengantarku ke rumah sakit.", "tr": "11-7", "py": "Jīntiān xiàkè hòu, Wáng lǎoshī kàn wǒ bù shūfu, jiù sòng wǒ qù yīyuàn le."}, {"s": "", "zh": "从医院回来，李文也来看我了。", "id": "Setelah pulang dari rumah sakit, Li Wen juga datang menjengukku.", "tr": "11-7", "py": "Cóng yīyuàn huílái, Lǐ Wén yě lái kàn wǒ le."}, {"s": "", "zh": "现在他们都回去了，我也要睡觉了。", "id": "Sekarang mereka sudah pulang, dan aku juga mau tidur.", "tr": "11-7", "py": "Xiànzài tāmen dōu huíqù le, wǒ yě yào shuìjiào le."}], "teks": [{"tr": "11-1", "nama": "课文1 · Sakit kepala setelah kelas"}, {"tr": "11-3", "nama": "课文2 · Telepon dari Li Wen"}, {"tr": "11-5", "nama": "课文3 · Li Wen datang menjenguk"}, {"tr": "11-7", "nama": "课文4 · Buku harian Bai Jiayue"}]}, "12": {"judul": "这里比北京冷多了", "arti": "Di sini jauh lebih dingin daripada Beijing", "kata": [{"h": "事情", "p": "shìqing", "k": "名", "a": "urusan, hal"}, {"h": "晴", "p": "qíng", "k": "形", "a": "cerah"}, {"h": "正", "p": "zhèng", "k": "副", "a": "sedang (berlangsung)"}, {"h": "外面", "p": "wàimiàn", "k": "名", "a": "luar"}, {"h": "阴", "p": "yīn", "k": "形", "a": "mendung"}, {"h": "从小", "p": "cóngxiǎo", "k": "副", "a": "sejak kecil"}, {"h": "地铁", "p": "dìtiě", "k": "名", "a": "kereta bawah tanah, MRT"}, {"h": "楼", "p": "lóu", "k": "名", "a": "gedung"}, {"h": "站", "p": "zhàn", "k": "名", "a": "halte, stasiun"}, {"h": "小时候", "p": "xiǎoshíhou", "k": "名", "a": "masa kecil, waktu kecil"}, {"h": "好", "p": "hǎo", "k": "副", "a": "sangat, betul-betul"}], "dialog": [{"s": "王一雪", "zh": "喂，家月，是你啊！有什么事情吗？", "id": "Halo, Jiayue, ternyata kamu! Ada apa?", "tr": "12-1", "py": "Wèi, Jiāyuè, shì nǐ a! Yǒu shénme shìqing ma?"}, {"s": "白家月", "zh": "没什么事，就想跟您说说话。", "id": "Tidak ada apa-apa, cuma ingin mengobrol dengan Kakak.", "tr": "12-1", "py": "Méi shénme shì, jiù xiǎng gēn nín shuō shuōhuà."}, {"s": "王一雪", "zh": "好啊。你今天没课吗？", "id": "Boleh. Hari ini kamu tidak ada kelas?", "tr": "12-1", "py": "Hǎo a. Nǐ jīntiān méi kè ma?"}, {"s": "白家月", "zh": "下午有课。您那里天气怎么样？", "id": "Sore ada kelas. Cuaca di tempat Kakak bagaimana?", "tr": "12-1", "py": "Xiàwǔ yǒu kè. Nín nàlǐ tiānqì zěnmeyàng?"}, {"s": "王一雪", "zh": "北京这几天虽然是晴天，但是有点儿冷。", "id": "Beberapa hari ini Beijing memang cerah, tetapi agak dingin.", "tr": "12-1", "py": "Běijīng zhè jǐ tiān suīrán shì qíng tiān, dànshì yǒudiǎnr lěng."}, {"s": "白家月", "zh": "我这里比北京冷多了，外边还正下着雪呢！", "id": "Di sini jauh lebih dingin daripada Beijing, di luar salju sedang turun!", "tr": "12-1", "py": "Wǒ zhèlǐ bǐ Běijīng lěng duō le, wàibian hái zhèng xià zhe xuě ne!"}, {"s": "王一雪", "zh": "喂，一飞，听家月说你那边下雪了，下得大不大？", "id": "Halo, Yifei. Kata Jiayue di sana turun salju. Lebat tidak?", "tr": "12-3", "py": "Wèi, Yīfēi, tīng Jiāyuè shuō nǐ nàbiān xià xuě le, xià de dà bu dà?"}, {"s": "王一飞", "zh": "今天不大，昨天比今天下得大。", "id": "Hari ini tidak lebat. Kemarin lebih lebat daripada hari ini.", "tr": "12-3", "py": "Jīntiān bú dà, zuótiān bǐ jīntiān xià de dà."}, {"s": "王一雪", "zh": "天气不好，你去外面的时候多穿点儿衣服。", "id": "Cuacanya tidak bagus. Kalau keluar, pakai baju lebih tebal.", "tr": "12-3", "py": "Tiānqì bù hǎo, nǐ qù wàimiàn de shíhou duō chuān diǎnr yīfu."}, {"s": "王一飞", "zh": "这几天我在网上上课，没出去过。", "id": "Beberapa hari ini aku mengajar secara daring, belum pernah keluar.", "tr": "12-3", "py": "Zhè jǐ tiān wǒ zài wǎngshang shàngkè, méi chūqù guò."}, {"s": "王一雪", "zh": "那就好，有事记得给我打电话。", "id": "Syukurlah. Kalau ada apa-apa, jangan lupa telepon aku.", "tr": "12-3", "py": "Nà jiù hǎo, yǒu shì jìde gěi wǒ dǎdiànhuà."}, {"s": "王一飞", "zh": "好的。现在不下雪了，我出去买点儿吃的。", "id": "Baik. Sekarang salju sudah berhenti, aku mau keluar beli makanan.", "tr": "12-3", "py": "Hǎo de. Xiànzài bú xià xuě le, wǒ chūqù mǎi diǎnr chī de."}, {"s": "王一雪", "zh": "一次多买点儿，阴天下雪什么的就少出去吧。", "id": "Sekali belanja beli yang banyak. Kalau mendung, bersalju, dan sebagainya, kurangi keluar rumah.", "tr": "12-3", "py": "Yí cì duō mǎi diǎnr, yīn tiān xià xuě shénme de jiù shǎo chūqù ba."}, {"s": "李文", "zh": "喂，家月，今天天气不错，我们去跑步吧。", "id": "Halo, Jiayue, hari ini cuacanya bagus. Ayo kita lari.", "tr": "12-5", "py": "Wèi, Jiāyuè, jīntiān tiānqì búcuò, wǒmen qù pǎobù ba."}, {"s": "白家月", "zh": "你跑步跑得比我快，我们能一起跑吗？", "id": "Larimu lebih cepat daripada aku. Memangnya kita bisa lari bersama?", "tr": "12-5", "py": "Nǐ pǎobù pǎo de bǐ wǒ kuài, wǒmen néng yìqǐ pǎo ma?"}, {"s": "李文", "zh": "可以的，我慢慢跑，等着你。", "id": "Bisa. Aku lari pelan-pelan dan menunggumu.", "tr": "12-5", "py": "Kěyǐ de, wǒ màn màn pǎo, děng zhe nǐ."}, {"s": "白家月", "zh": "好吧。你真爱跑步啊！", "id": "Baiklah. Kamu benar-benar suka lari, ya!", "tr": "12-5", "py": "Hǎo ba. Nǐ zhēn ài pǎobù a!"}, {"s": "李文", "zh": "我从小就经常跟爸爸跑步，跑步能让人快乐！", "id": "Sejak kecil aku sering lari bersama ayahku. Lari bisa membuat orang bahagia!", "tr": "12-5", "py": "Wǒ cóngxiǎo jiù jīngcháng gēn bàba pǎobù, pǎobù néng ràng rén kuàilè!"}, {"s": "白家月", "zh": "好，那我准备一下。", "id": "Oke, kalau begitu aku siap-siap dulu.", "tr": "12-5", "py": "Hǎo, nà wǒ zhǔnbèi yíxià."}, {"s": "李文", "zh": "我现在坐地铁去找你，一会儿楼下见。", "id": "Sekarang aku naik kereta bawah tanah ke tempatmu. Sampai ketemu di bawah sebentar lagi.", "tr": "12-5", "py": "Wǒ xiànzài zuò dìtiě qù zhǎo nǐ, yíhuìr lóu xià jiàn."}, {"s": "", "zh": "前几天天气不好，我没走路，每天坐两站地铁去学校。", "id": "Beberapa hari terakhir cuacanya buruk, jadi aku tidak jalan kaki; setiap hari aku naik kereta bawah tanah dua stasiun ke sekolah.", "tr": "12-7", "py": "Qián jǐ tiān tiānqì bù hǎo, wǒ méi zǒulù, měi tiān zuò liǎng zhàn dìtiě qù xuéxiào."}, {"s": "", "zh": "今天是个大晴天，李文让我跟他去外面跑步。", "id": "Hari ini cerah sekali, dan Li Wen mengajakku lari di luar bersamanya.", "tr": "12-7", "py": "Jīntiān shì gè dà qíng tiān, Lǐ Wén ràng wǒ gēn tā qù wàimiàn pǎobù."}, {"s": "", "zh": "他小时候经常跑步，跑得比我快，但是他会等我。", "id": "Waktu kecil dia sering lari, larinya lebih cepat daripada aku, tapi dia mau menungguku.", "tr": "12-7", "py": "Tā xiǎoshíhou jīngcháng pǎobù, pǎo de bǐ wǒ kuài, dànshì tā huì děng wǒ."}, {"s": "", "zh": "跟李文一起跑步，我好高兴啊！", "id": "Lari bersama Li Wen, aku senang sekali!", "tr": "12-7", "py": "Gēn Lǐ Wén yìqǐ pǎobù, wǒ hǎo gāoxìng a!"}], "teks": [{"tr": "12-1", "nama": "课文1 · Telepon dari Jiayue"}, {"tr": "12-3", "nama": "课文2 · Hujan salju di sana"}, {"tr": "12-5", "nama": "课文3 · Ajakan lari pagi"}, {"tr": "12-7", "nama": "课文4 · Buku harian Bai Jiayue"}]}, "13": {"judul": "我们爱上中文课", "arti": "Kami suka ikut kelas bahasa Mandarin", "kata": [{"h": "新年", "p": "xīnnián", "k": "名", "a": "Tahun Baru"}, {"h": "教", "p": "jiāo", "k": "动", "a": "mengajar"}, {"h": "花", "p": "huā", "k": "名", "a": "bunga"}, {"h": "希望", "p": "xīwàng", "k": "动", "a": "berharap"}, {"h": "上面", "p": "shàngmiàn", "k": "名", "a": "permukaan (benda), di atas"}, {"h": "洗手间", "p": "xǐshǒujiān", "k": "名", "a": "toilet, kamar kecil"}, {"h": "里面", "p": "lǐmiàn", "k": "名", "a": "dalam, bagian dalam"}, {"h": "笔", "p": "bǐ", "k": "量", "a": "goresan (penggolong untuk goresan hanzi)"}, {"h": "可能", "p": "kěnéng", "k": "动", "a": "mungkin, bisa jadi"}, {"h": "上网", "p": "shàngwǎng", "k": "动", "a": "berinternet, online"}, {"h": "那样", "p": "nàyàng", "k": "代", "a": "(dengan) begitu, sehingga"}, {"h": "告诉", "p": "gàosu", "k": "动", "a": "memberi tahu"}, {"h": "班", "p": "bān", "k": "名", "a": "kelas (kelompok siswa)"}], "dialog": [{"s": "白家月", "zh": "时间过得真快啊！新年就要到了。", "id": "Waktu berlalu cepat sekali! Tahun Baru sudah hampir tiba.", "tr": "13-1", "py": "Shíjiān guò de zhēn kuài a! Xīnnián jiù yào dào le."}, {"s": "陈天中", "zh": "这一年王老师教我们中文，每天工作都很累。", "id": "Setahun ini Bu Wang mengajari kami bahasa Mandarin, setiap hari beliau bekerja keras sampai lelah.", "tr": "13-1", "py": "Zhè yì nián Wáng lǎoshī jiāo wǒmen Zhōngwén, měi tiān gōngzuò dōu hěn lèi."}, {"s": "白家月", "zh": "是啊，她教得很好。因为她，我们都非常爱上中文课。", "id": "Iya, beliau mengajar dengan sangat baik. Karena beliau, kami semua sangat suka ikut kelas bahasa Mandarin.", "tr": "13-1", "py": "Shì a, tā jiāo de hěn hǎo. Yīnwèi tā, wǒmen dōu fēicháng ài shàng Zhōngwén kè."}, {"s": "陈天中", "zh": "我们给她准备个新年礼物吧。你觉得送给她什么好呢？", "id": "Ayo kita siapkan hadiah Tahun Baru untuk beliau. Menurutmu sebaiknya kita beri apa?", "tr": "13-1", "py": "Wǒmen gěi tā zhǔnbèi gè xīnnián lǐwù ba. Nǐ juéde sòng gěi tā shénme hǎo ne?"}, {"s": "白家月", "zh": "王老师喜欢花，就送给她花吧。", "id": "Bu Wang suka bunga. Kita beri beliau bunga saja.", "tr": "13-1", "py": "Wáng lǎoshī xǐhuan huā, jiù sòng gěi tā huā ba."}, {"s": "陈天中", "zh": "那我们去花店看看，现在买花的人多，希望花店还有漂亮的花。", "id": "Kalau begitu ayo kita lihat ke toko bunga. Sekarang banyak orang membeli bunga, semoga di toko masih ada bunga yang bagus.", "tr": "13-1", "py": "Nà wǒmen qù huā diàn kànkan, xiànzài mǎi huā de rén duō, xīwàng huā diàn hái yǒu piàoliang de huā."}, {"s": "白家月", "zh": "王老师，今天的词比昨天多了十个。", "id": "Bu Wang, kosakata hari ini sepuluh kata lebih banyak daripada kemarin.", "tr": "13-3", "py": "Wáng lǎoshī, jīntiān de cí bǐ zuótiān duō le shí gè."}, {"s": "王一飞", "zh": "是啊！你们都学会了吗？", "id": "Betul! Kalian semua sudah hafal?", "tr": "13-3", "py": "Shì a! Nǐmen dōu xué huì le ma?"}, {"s": "安妮", "zh": "学会了，没有问题。", "id": "Sudah, tidak ada masalah.", "tr": "13-3", "py": "Xué huì le, méiyǒu wèntí."}, {"s": "王一飞", "zh": "好。现在我来说，你们在本子上面写。", "id": "Bagus. Sekarang saya yang mengucapkan, kalian tulis di buku tulis.", "tr": "13-3", "py": "Hǎo. Xiànzài wǒ lái shuō, nǐmen zài běnzi shàngmiàn xiě."}, {"s": "王一飞", "zh": "同学们，\"洗手间\"的\"间\"字写错了，它的里面是\"日\"，不是\"口\"。", "id": "Anak-anak, karakter 间 dalam 洗手间 ditulis salah. Bagian dalamnya 日, bukan 口.", "tr": "13-3", "py": "Tóngxuémen,\" xǐshǒujiān\" de\" jiān\" zì xiě cuò le, tā de lǐmiàn shì\" rì\", bú shì\" kǒu\"."}, {"s": "白家月", "zh": "\"日\"比\"口\"多一笔，写\"口\"就是\"问题\"的\"问\"了。", "id": "日 punya satu goresan lebih banyak daripada 口. Kalau ditulis 口, jadinya 问 seperti dalam 问题.", "tr": "13-3", "py": "\"Rì\" bǐ\" kǒu\" duō yì bǐ, xiě\" kǒu\" jiù shì\" wèntí\" de\" wèn\" le."}, {"s": "王一飞", "zh": "没错，你说得很对。", "id": "Tepat, kamu benar sekali.", "tr": "13-3", "py": "Méi cuò, nǐ shuō de hěn duì."}, {"s": "安妮", "zh": "家月，你觉得这个本子怎么样？", "id": "Jiayue, bagaimana menurutmu buku tulis ini?", "tr": "13-5", "py": "Jiāyuè, nǐ juéde zhège běnzi zěnmeyàng?"}, {"s": "白家月", "zh": "很漂亮，多少钱一个？", "id": "Cantik sekali. Berapa harganya satu?", "tr": "13-5", "py": "Hěn piàoliang, duōshao qián yí gè?"}, {"s": "安妮", "zh": "比我们一起买的那个本子贵一点儿。", "id": "Sedikit lebih mahal daripada buku tulis yang kita beli bersama waktu itu.", "tr": "13-5", "py": "Bǐ wǒmen yìqǐ mǎi de nàge běnzi guì yìdiǎnr."}, {"s": "白家月", "zh": "这么漂亮的本子，不可能贵一点儿吧？", "id": "Buku tulis secantik ini, tidak mungkin cuma sedikit lebih mahal, kan?", "tr": "13-5", "py": "Zhème piàoliang de běnzi, bù kěnéng guì yìdiǎnr ba?"}, {"s": "安妮", "zh": "我是上网买的，真没那么贵。我买了两个，送你一个。", "id": "Aku membelinya online, benar-benar tidak semahal itu. Aku beli dua, satu untukmu.", "tr": "13-5", "py": "Wǒ shì shàngwǎng mǎi de, zhēn méi nàme guì. Wǒ mǎi le liǎng gè, sòng nǐ yí gè."}, {"s": "白家月", "zh": "谢谢！那我送给你什么呢？", "id": "Terima kasih! Lalu aku memberimu apa?", "tr": "13-5", "py": "Xièxie! Nà wǒ sòng gěi nǐ shénme ne?"}, {"s": "安妮", "zh": "咖啡杯吧，我最喜欢喝咖啡了。", "id": "Cangkir kopi saja, aku paling suka minum kopi.", "tr": "13-5", "py": "Kāfēi bēi ba, wǒ zuì xǐhuan hē kāfēi le."}, {"s": "白家月", "zh": "好，那样我们就都有新年礼物了！", "id": "Oke, dengan begitu kita berdua sama-sama punya hadiah Tahun Baru.", "tr": "13-5", "py": "Hǎo, nàyàng wǒmen jiù dōu yǒu xīnnián lǐwù le!"}, {"s": "", "zh": "新年就要到了，安妮送给我一个新本子。", "id": "Tahun Baru sudah hampir tiba. Annie memberiku sebuah buku tulis baru.", "tr": "13-7", "py": "Xīnnián jiù yào dào le, Ānnī sòng gěi wǒ yí gè xīn běnzi."}, {"s": "", "zh": "她告诉我是在网上买的，比我的本子贵一点儿。", "id": "Dia bilang dia membelinya online, dan harganya sedikit lebih mahal daripada buku tulisku.", "tr": "13-7", "py": "Tā gàosu wǒ shì zài wǎngshang mǎi de, bǐ wǒ de běnzi guì yìdiǎnr."}, {"s": "", "zh": "我们班同学也送了王老师漂亮的花，希望她高高兴兴地过个新年。", "id": "Teman-teman sekelasku juga memberi Bu Wang bunga yang indah, semoga beliau merayakan Tahun Baru dengan gembira.", "tr": "13-7", "py": "Wǒmen bān tóngxué yě sòng le Wáng lǎoshī piàoliang de huā, xīwàng tā gāo gāoxìng xìng dì guò gè xīnnián."}], "teks": [{"tr": "13-1", "nama": "课文1 · Hadiah Tahun Baru untuk guru"}, {"tr": "13-3", "nama": "课文2 · Karakter 间 yang salah"}, {"tr": "13-5", "nama": "课文3 · Buku tulis yang cantik"}, {"tr": "13-7", "nama": "课文4 · Buku harian Bai Jiayue"}]}, "14": {"judul": "一个人过年多没意思啊", "arti": "Merayakan Imlek sendirian tidak seru", "kata": [{"h": "站", "p": "zhàn", "k": "动", "a": "berdiri"}, {"h": "包", "p": "bāo", "k": "名/动/量", "a": "tas; membungkus; bungkus"}, {"h": "过年", "p": "guònián", "k": "动", "a": "merayakan Tahun Baru Imlek"}, {"h": "没意思", "p": "méi yìsi", "k": "—", "a": "tidak seru, membosankan"}, {"h": "位", "p": "wèi", "k": "量", "a": "penggolong sopan untuk orang"}, {"h": "前面", "p": "qiánmiàn", "k": "名", "a": "depan"}, {"h": "房子", "p": "fángzi", "k": "名", "a": "rumah"}, {"h": "小孩儿", "p": "xiǎoháir", "k": "名", "a": "anak kecil"}, {"h": "女孩儿", "p": "nǚháir", "k": "名", "a": "anak perempuan"}, {"h": "姓", "p": "xìng", "k": "动", "a": "bermarga"}, {"h": "眼睛", "p": "yǎnjing", "k": "名", "a": "mata"}, {"h": "跳舞", "p": "tiàowǔ", "k": "动", "a": "menari"}], "dialog": [{"s": "李文", "zh": "王老师，你家楼下站着一个人。", "id": "Bu Wang, ada seseorang berdiri di bawah gedung rumah Ibu.", "tr": "14-1", "py": "Wáng lǎoshī, nǐ jiā lóu xià zhàn zhe yí gè rén."}, {"s": "王一飞", "zh": "我家楼下？我看看。", "id": "Di bawah rumahku? Coba kulihat.", "tr": "14-1", "py": "Wǒ jiā lóu xià? Wǒ kànkan."}, {"s": "李文", "zh": "那个人穿着黑色的裤子，手里还拿着一个黑色的包。", "id": "Orang itu memakai celana hitam, dan tangannya membawa sebuah tas hitam.", "tr": "14-1", "py": "Nàge rén chuān zhe hēisè de kùzi, shǒu lǐ hái ná zhe yí gè hēisè de bāo."}, {"s": "王一飞", "zh": "我看见那个人了，他是我男朋友。", "id": "Aku sudah melihat orang itu. Dia pacarku.", "tr": "14-1", "py": "Wǒ kànjiàn nàge rén le, tā shì wǒ nánpéngyou."}, {"s": "李文", "zh": "那我们快过去吧。", "id": "Kalau begitu ayo cepat ke sana.", "tr": "14-1", "py": "Nà wǒmen kuài guòqù ba."}, {"s": "王一飞", "zh": "同乐，真是你啊！上次打电话，你说有时间过来看我，没想到这么快就来了！", "id": "Tongle, ternyata benar kamu! Waktu menelepon terakhir kali kamu bilang akan datang menjengukku kalau ada waktu. Tidak kusangka secepat ini!", "tr": "14-3", "py": "Tónglè, zhēn shì nǐ a! Shàng cì dǎdiànhuà, nǐ shuō yǒu shíjiān guòlái kàn wǒ, méi xiǎng dào zhème kuài jiù lái le!"}, {"s": "杨同乐", "zh": "就要过年了，你一个人在这儿多没意思啊，所以我就早早过来了。", "id": "Sebentar lagi Imlek. Betapa tidak serunya kamu sendirian di sini, jadi aku datang lebih awal.", "tr": "14-3", "py": "Jiù yào guònián le, nǐ yí gè rén zài zhèr duō méiyìsi a, suǒyǐ wǒ jiù zǎo zǎo guòlái le."}, {"s": "王一飞", "zh": "你能来，我太高兴了！", "id": "Kamu bisa datang, aku senang sekali!", "tr": "14-3", "py": "Nǐ néng lái, wǒ tài gāoxìng le!"}, {"s": "杨同乐", "zh": "一飞，你旁边这位是？", "id": "Yifei, siapa yang di sebelahmu ini?", "tr": "14-3", "py": "Yīfēi, nǐ pángbiān zhè wèi shì?"}, {"s": "王一飞", "zh": "同乐，这是李文，他在我们学校学医。李文，这是我男朋友杨同乐。", "id": "Tongle, ini Li Wen, dia kuliah kedokteran di kampus kami. Li Wen, ini pacarku, Yang Tongle.", "tr": "14-3", "py": "Tónglè, zhè shì Lǐ Wén, tā zài wǒmen xuéxiào xué yī. Lǐ Wén, zhè shì wǒ nánpéngyou Yáng Tónglè."}, {"s": "杨同乐", "zh": "李文，很高兴认识你！", "id": "Li Wen, senang berkenalan denganmu!", "tr": "14-3", "py": "Lǐ Wén, hěn gāoxìng rènshi nǐ!"}, {"s": "李文", "zh": "认识你我也很高兴！我家就在前面那个楼，有时间来玩。", "id": "Aku juga senang berkenalan denganmu! Rumahku di gedung depan itu, kalau ada waktu mampirlah.", "tr": "14-3", "py": "Rènshi nǐ wǒ yě hěn gāoxìng! Wǒ jiā jiù zài qiánmiàn nàge lóu, yǒu shíjiān lái wán."}, {"s": "杨同乐", "zh": "一飞，你住的房子真不错，很大，离学校也不远。", "id": "Yifei, rumah yang kamu tinggali bagus sekali, besar, dan tidak jauh dari kampus.", "tr": "14-5", "py": "Yīfēi, nǐ zhù de fángzi zhēn búcuò, hěn dà, lí xuéxiào yě bù yuǎn."}, {"s": "王一飞", "zh": "是啊！我楼下还住着一家中国人，他们人很好。", "id": "Iya! Di lantai bawahku juga tinggal sebuah keluarga Tionghoa, mereka orangnya baik sekali.", "tr": "14-5", "py": "Shì a! Wǒ lóu xià hái zhù zhe yì jiā Zhōngguó rén, tāmen rén hěn hǎo."}, {"s": "杨同乐", "zh": "这样你有事情就可以找他们帮忙。", "id": "Dengan begitu kalau ada perlu kamu bisa minta tolong mereka.", "tr": "14-5", "py": "Zhèyàng nǐ yǒu shìqing jiù kěyǐ zhǎo tāmen bāngmáng."}, {"s": "王一飞", "zh": "对，我也帮他们家的小孩儿学中文。", "id": "Betul, aku juga membantu anak mereka belajar bahasa Mandarin.", "tr": "14-5", "py": "Duì, wǒ yě bāng tāmen jiā de xiǎoháir xué Zhōngwén."}, {"s": "杨同乐", "zh": "我记得你跟我说过，是个女孩儿，学得也很好。", "id": "Aku ingat kamu pernah cerita padaku, anaknya perempuan dan belajarnya juga bagus.", "tr": "14-5", "py": "Wǒ jìde nǐ gēn wǒ shuō guò, shì gè nǚháir, xué de yě hěn hǎo."}, {"s": "王一飞", "zh": "没错，她经常跑上来找我玩。", "id": "Benar, dia sering berlari naik ke sini untuk bermain denganku.", "tr": "14-5", "py": "Méi cuò, tā jīngcháng pǎo shànglái zhǎo wǒ wán."}, {"s": "杨同乐", "zh": "你问问他们什么时候有时间，我请他们吃个饭。", "id": "Coba tanya kapan mereka ada waktu, aku mau mentraktir mereka makan.", "tr": "14-5", "py": "Nǐ wèn wèn tāmen shénme shíhou yǒu shíjiān, wǒ qǐng tāmen chī gè fàn."}, {"s": "", "zh": "我男朋友姓杨，叫杨同乐。", "id": "Pacarku bermarga Yang, namanya Yang Tongle.", "tr": "14-7", "py": "Wǒ nánpéngyou xìng yáng, jiào Yáng Tónglè."}, {"s": "", "zh": "他高个子、大眼睛，唱歌唱得很好，跳舞跳得也不错。", "id": "Badannya tinggi, matanya besar, nyanyinya bagus, dan menarinya juga lumayan.", "tr": "14-7", "py": "Tā gāo gèzi, dà yǎnjing, chànggē chàng de hěn hǎo, tiàowǔ tiào de yě búcuò."}, {"s": "", "zh": "他和我姐姐一起工作，是姐姐介绍我们认识的。", "id": "Dia bekerja bersama kakak sepupuku, dan kakak sepupukulah yang memperkenalkan kami.", "tr": "14-7", "py": "Tā hé wǒ jiějie yìqǐ gōngzuò, shì jiějie jièshào wǒmen rènshi de."}, {"s": "", "zh": "他告诉我，从见到我的第一天开始，他就喜欢上我了。", "id": "Dia bilang, sejak hari pertama bertemu denganku, dia langsung jatuh hati padaku.", "tr": "14-7", "py": "Tā gàosu wǒ, cóng jiàn dào wǒ de dìyī tiān kāishǐ, tā jiù xǐhuan shàng wǒ le."}], "teks": [{"tr": "14-1", "nama": "课文1 · Ada orang di bawah"}, {"tr": "14-3", "nama": "课文2 · Tongle datang"}, {"tr": "14-5", "nama": "课文3 · Tetangga di lantai bawah"}, {"tr": "14-7", "nama": "课文4 · Buku harian Wang Yifei"}]}, "15": {"judul": "我想再去一次中国", "arti": "Aku ingin ke Tiongkok sekali lagi", "kata": [{"h": "姓名", "p": "xìngmíng", "k": "名", "a": "nama lengkap"}, {"h": "出国", "p": "chūguó", "k": "动", "a": "pergi ke luar negeri"}, {"h": "门票", "p": "ménpiào", "k": "名", "a": "tiket masuk"}, {"h": "高中", "p": "gāozhōng", "k": "名", "a": "SMA"}, {"h": "出门", "p": "chūmén", "k": "动", "a": "keluar rumah, bepergian"}, {"h": "路", "p": "lù", "k": "名", "a": "jalan"}, {"h": "颐和园", "p": "Yíhé Yuán", "k": "专名", "a": "Istana Musim Panas (di Beijing)"}, {"h": "机场", "p": "jīchǎng", "k": "名", "a": "bandara"}, {"h": "机票", "p": "jīpiào", "k": "名", "a": "tiket pesawat"}, {"h": "飞", "p": "fēi", "k": "动", "a": "terbang"}, {"h": "好像", "p": "hǎoxiàng", "k": "动", "a": "seperti, mirip"}, {"h": "鸟", "p": "niǎo", "k": "名", "a": "burung"}], "dialog": [{"s": "王一飞", "zh": "考试就要开始了，请大家写上姓名，写好后就可以做题了。", "id": "Ujian akan segera dimulai. Silakan semua menulis nama lengkap; setelah selesai, kalian boleh mulai mengerjakan soal.", "tr": "15-1", "py": "Kǎoshì jiù yào kāishǐ le, qǐng dàjiā xiě shàng xìngmíng, xiě hǎo hòu jiù kěyǐ zuò tí le."}, {"s": "白家月", "zh": "老师，我做完了。", "id": "Bu, saya sudah selesai.", "tr": "15-1", "py": "Lǎoshī, wǒ zuò wán le."}, {"s": "陈天中", "zh": "老师，我也做完了。", "id": "Bu, saya juga sudah selesai.", "tr": "15-1", "py": "Lǎoshī, wǒ yě zuò wán le."}, {"s": "王一飞", "zh": "……对了，你们考完试想做什么？", "id": "... Oh ya, setelah ujian kalian ingin melakukan apa?", "tr": "15-1", "py": "…… Duì le, nǐmen kǎo wán shì xiǎng zuò shénme?"}, {"s": "白家月", "zh": "我很想去中国，虽然去过一次，但是很想再去一次。", "id": "Saya ingin sekali pergi ke Tiongkok. Meskipun sudah pernah sekali, saya ingin ke sana sekali lagi.", "tr": "15-1", "py": "Wǒ hěn xiǎng qù Zhōngguó, suīrán qù guò yí cì, dànshì hěn xiǎng zài qù yí cì."}, {"s": "王一飞", "zh": "不错，到中国后你就可以经常说中文了。", "id": "Bagus, setelah sampai di Tiongkok kamu bisa sering berbicara bahasa Mandarin.", "tr": "15-1", "py": "Búcuò, dào Zhōngguó hòu nǐ jiù kěyǐ jīngcháng shuō Zhōngwén le."}, {"s": "白家月", "zh": "考完试了，我现在可以出国旅游了。", "id": "Ujian sudah selesai, sekarang aku bisa berwisata ke luar negeri.", "tr": "15-3", "py": "Kǎo wán shì le, wǒ xiànzài kěyǐ chūguó lǚyóu le."}, {"s": "李文", "zh": "你要去哪儿？", "id": "Kamu mau ke mana?", "tr": "15-3", "py": "Nǐ yào qù nǎr?"}, {"s": "白家月", "zh": "我要再去一次北京。", "id": "Aku mau ke Beijing sekali lagi.", "tr": "15-3", "py": "Wǒ yào zài qù yí cì Běijīng."}, {"s": "李文", "zh": "为什么还去北京？", "id": "Kenapa ke Beijing lagi?", "tr": "15-3", "py": "Wèishénme hái qù Běijīng?"}, {"s": "白家月", "zh": "因为我想再吃一次烤鸭，再喝一次奶茶，再去北京大学看一次电影……", "id": "Karena aku ingin makan bebek panggang sekali lagi, minum teh susu sekali lagi, dan menonton film di Universitas Peking sekali lagi...", "tr": "15-3", "py": "Yīnwèi wǒ xiǎng zài chī yí cì kǎo yā, zài hē yí cì nǎichá, zài qù běijīngdàxué kàn yí cì diànyǐng……"}, {"s": "李文", "zh": "你想做的事情很多啊！", "id": "Banyak sekali yang ingin kamu lakukan!", "tr": "15-3", "py": "Nǐ xiǎng zuò de shìqing hěn duō a!"}, {"s": "白家月", "zh": "是啊，你看，我还在网上买好颐和园的门票了呢。", "id": "Iya. Lihat, aku bahkan sudah membeli tiket masuk Istana Musim Panas secara online.", "tr": "15-3", "py": "Shì a, nǐ kàn, wǒ hái zài wǎngshang mǎi hǎo yíhéyuán de ménpiào le ne."}, {"s": "李文", "zh": "我的高中同学就在颐和园上班，可以让他给你好好介绍介绍。", "id": "Teman SMA-ku bekerja di Istana Musim Panas. Aku bisa memintanya menjelaskan banyak hal untukmu.", "tr": "15-3", "py": "Wǒ
