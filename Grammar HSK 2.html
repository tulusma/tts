angsung di belakang daftar. Jangan menambah 等等 sekaligus dengan 什么的.", "Untuk daftar kegiatan juga bisa: 休息的时候，我喜欢看书、听音乐什么的。"], "poin": ["什么的 = dan lain-lain (di akhir daftar).", "Daftar dipisah 、 atau 和; lisan: A啊、B啊什么的.", "Bukan pertanyaan.", "Bisa untuk benda maupun kegiatan."], "contoh": [{"zh": "画我们的家！有爸爸、妈妈、弟弟，还有黑色的狗、白色的猫什么的。", "py": "Huà wǒmen de jiā! Yǒu bàba, māma, dìdi, hái yǒu hēisè de gǒu, báisè de māo shénme de.", "id": "Menggambar rumah kita! Ada Ayah, Ibu, adik, juga anjing hitam, kucing putih, dan lain-lain.", "b": true, "tr": "06-3"}, {"zh": "桌子上有电脑、杯子、书和画笔什么的。", "py": "Zhuōzi shàng yǒu diànnǎo, bēizi, shū hé huàbǐ shénme de.", "id": "Di atas meja ada komputer, gelas, buku, pensil gambar, dan lain-lain.", "b": true, "tr": null}, {"zh": "她拿来了一些水、面包和苹果什么的。", "py": "Tā ná lái le yìxiē shuǐ, miànbāo hé píngguǒ shénme de.", "id": "Dia membawa air, roti, apel, dan lain-lain.", "b": true, "tr": null}, {"zh": "妈妈做了鱼啊肉啊什么的。", "py": "Māma zuò le yú a ròu a shénme de.", "id": "Ibu memasak ikan, daging, dan lain-lain.", "b": true, "tr": null}, {"zh": "你看，还有鱼啊肉啊什么的，都是你喜欢吃的。", "py": "Nǐ kàn, hái yǒu yú a ròu a shénme de, dōu shì nǐ xǐhuan chī de.", "id": "Lihat, masih ada ikan, daging, dan lain-lain, semuanya kesukaanmu.", "b": true, "tr": "06-5"}, {"zh": "足球、篮球什么的，我都喜欢。", "py": "Zúqiú, lánqiú shénme de, wǒ dōu xǐhuan.", "id": "Sepak bola, basket, dan lain-lain, saya suka semua.", "b": true, "tr": null}, {"zh": "包子、饺子什么的，我都爱吃。", "py": "Bāozi, jiǎozi shénme de, wǒ dōu ài chī.", "id": "Bakpao, jiaozi, dan lain-lain, saya suka semua.", "b": false, "tr": null}, {"zh": "休息的时候，我喜欢看书、听音乐什么的。", "py": "Xiūxi de shíhou, wǒ xǐhuan kàn shū, tīng yīnyuè shénme de.", "id": "Saat istirahat, saya suka membaca, mendengarkan musik, dan lain-lain.", "b": false, "tr": null}, {"zh": "超市里有水果、牛奶、面包什么的。", "py": "Chāoshì lǐ yǒu shuǐguǒ, niúnǎi, miànbāo shénme de.", "id": "Di supermarket ada buah, susu, roti, dan lain-lain.", "b": false, "tr": null}, {"zh": "那间教室里有桌子、椅子、电脑什么的。", "py": "Nà /frasa KS + 地 + KK", "很 + KS + 地 + KK (很快地吃完)", "KS ulang + 地 + KK (高高兴兴地玩)"], "jelas": ["地 (de, nada netral) diletakkan di antara keterangan (biasanya kata sifat) dan kata kerja, untuk menunjukkan CARA atau KEADAAN saat tindakan dilakukan. Artinya mirip \"dengan …\" atau akhiran \"-nya\" dalam bahasa Indonesia: 高高兴兴地玩 = bermain dengan gembira; 很快地吃完早饭 = makan pagi dengan cepat.", "Tiga 的/地/得 dibaca sama (de) tetapi berbeda fungsi: 的 sebelum kata BENDA (漂亮的衣服), 地 sebelum kata KERJA (认真地学习), 得 setelah kata kerja untuk pelengkap keadaan (跑得很快, pelajaran 7).", "Keterangan yang memakai 地 biasanya kata sifat dua suku kata atau kata sifat yang diberi 很/非常 atau diulang: 很快地, 非常认真地, 高高兴兴地, 早早地, 舒舒服服地.", "Kata sifat satu suku kata yang umum sering langsung di depan kata kerja tanpa 地: 快走 (cepat jalan!), 多吃 (makan banyak), 早来. Dengan 很 di depannya, 地 diperlukan: 很快地走了.", "Jebakan pelajar Indonesia: dalam bahasa Indonesia keterangan cara sering di belakang (\"dia makan dengan cepat\"). Dalam bahasa Mandarin keterangan cara + 地 diletakkan SEBELUM kata kerja: 他很快地吃完了饭.", "Bandingkan: 他很快地跑了 (dia lari dengan cepat — cara saat itu) dan 他跑得很快 (larinya cepat — penilaian hasil/kemampuan)."], "poin": ["KS + 地 + KK = melakukan dengan cara ….", "的 + benda; 地 + kerja; 得 setelah kerja.", "很快地, 认真地, 高高兴兴地, 早早地.", "Keterangan cara di depan kata kerja."], "contoh": [{"zh": "过生日就要吃好吃的，还要高高兴兴地玩。", "py": "Guò shēngrì jiù yào chī hǎochī de, hái yào gāo gāoxìng xìng dì wán.", "id": "Saat ulang tahun harus makan yang enak dan bermain dengan gembira.", "b": true, "tr": "06-5"}, {"zh": "老师早早地到了教室。", "py": "Lǎoshī zǎo zǎo dì dào le jiàoshì.", "id": "Guru sudah tiba di kelas pagi-pagi sekali.", "b": true, "tr": null}, {"zh": "爸爸很快地吃完早饭，就去上班了。", "py": "Bàba hěn kuài dì chī wán zǎofàn, jiù qù shàngbān le.", "id": "Ayah cepat-cepat menghabiskan sarapan, lalu berangkat kerja.", "b": true, "tr": null}, {"zh": "他早早地到了教室。", "py": "Tā zǎo zǎo dì dào le jiàoshì.", "id": "Dia tiba di kelas pagi-pagi sekali.", "b": true, "tr": null}, {"zh": "回家后，孩子们早早地就上床了。", "py": "Huí jiā hòu, háizimen zǎo zǎo dì jiù shàng chuáng le.", "id": "Setelah pulang, anak-anak sudah naik ke tempat tidur lebih awal.", "b": true, "tr": "06-7"}, {"zh": "他们说要舒舒服服地睡一觉。", "py": "Tāmen shuō yào shū shūfu fú dì shuì yí jiào.", "id": "Mereka bilang mau tidur dengan nyaman.", "b": true, "tr": "06-7"}, {"zh": "姐姐生病了，早早地回房间休息了。", "py": "Jiějie shēngbìng le, zǎo zǎo dì huí fángjiān xiūxi le.", "id": "Kakak sakit, lebih awal kembali ke kamar untuk istirahat.", "b": false, "tr": null}, {"zh": "小明拿到礼物，高兴地说：“这个礼物太好了！”", "py": "Xiǎomíng ná dào lǐwù, gāoxìng de shuō: \"Zhège lǐwù tài hǎo le!\"", "id": "Xiaoming menerima hadiah dan berkata dengan gembira: \"Hadiah ini bagus sekali!\"", "b": false, "tr": null}, {"zh": "你回家好好地睡一觉吧。", "py": "Nǐ huí jiā hǎo hǎo dì shuì yí jiào ba.", "id": "Pulanglah dan tidurlah baik-baik.", "b": false, "tr": null}, {"zh": "学生们认真地听老师说话。", "py": "Xuéshēngmen rènzhēn dì tīng lǎoshī shuōhuà.", "id": "Para siswa mendengarkan guru dengan serius.", "b": false, "tr": null}, {"zh": "她慢慢地走进了教室。", "py": "Tā màn màn dì zǒu jìn le jiàoshì.", "id": "Dia berjalan masuk ke kelas pelan-pelan.", "b": false, "tr": null}], "salah": [{"s": "他高兴的说。", "sp": "Tā gāoxìng de shuō.", "n": "", "b": "他高兴地说。", "bp": "Tā gāoxìng de shuō.", "a": "Sebelum kata kerja memakai 地, bukan 的."}, {"s": "他吃饭很快地。", "sp": "Tā chīfàn hěn kuài dì.", "n": "", "b": "他很快地吃饭。", "bp": "Tā hěn kuài dì chīfàn.", "a": "Keterangan cara + 地 sebelum kata kerja."}, {"s": "她买了一件漂亮地衣服。", "sp": "Tā mǎi le yí jiàn piàoliang dì yīfu.", "n": "", "b": "她买了一件漂亮的衣服。", "bp": "Tā mǎi le yí jiàn piàoliang de yīfu.", "a": "Sebelum kata benda memakai 的."}], "latihan": [{"k": "6-3.0", "t": "pg", "q": "还要高高兴兴___玩。", "o": ["地", "的", "得", "了"], "a": 0, "x": "KS + 地 + KK.", "f": "还要高高兴兴地玩。", "fp": "Hái yào gāo gāoxìng xìng dì wán."}, {"k": "6-3.1", "t": "pg", "q": "她买了一件漂亮___衣服。", "o": ["的", "地", "得", "过"], "a": 0, "x": "Sebelum kata benda: 的.", "f": "她买了一件漂亮的衣服。", "fp": "Tā mǎi le yí jiàn piàoliang de yīfu."}, {"k": "6-3.2", "t": "pg", "q": "爸爸很快___吃完早饭，就去上班了。", "o": ["地", "的", "得", "着"], "a": 0, "x": "Cara melakukan: 很快地 + KK.", "f": "爸爸很快地吃完早饭，就去上班了。", "fp": "Bàba hěn kuài dì chī wán zǎofàn, jiù qù shàngbān le."}, {"k": "6-3.3", "t": "pg", "q": "Mana yang benar?", "o": ["老师早早地到了教室。", "老师到了教室早早地。", "老师早早的到了教室。", "早早地老师到了教室的。"], "a": 0, "x": "Keterangan + 地 sebelum kata kerja."}, {"k": "6-3.4", "t": "pg", "q": "Kalimat mana yang memakai 地 dengan BENAR?", "o": ["他认真地学习。", "这是我地书。", "他跑地很快。", "好看地衣服"], "a": 0, "x": "地 sebelum kata kerja 学习."}, {"k": "6-3.5", "t": "pg", "q": "\"Para siswa mendengarkan guru dengan serius.\" =", "o": ["学生们认真地听老师说话。", "学生们听老师说话认真地。", "学生们认真的听老师说话的。", "认真地学生们听老师说话。"], "a": 0, "x": "认真地 + 听."}, {"k": "6-3.6", "t": "pg", "q": "A：你姐姐去哪儿了？ B：她生病了，___回房间休息了。", "o": ["早早地", "早早的", "早早得", "早地早"], "a": 0, "x": "早早地 + KK."}, {"k": "6-3.7", "t": "su", "w": ["老师", "早早", "地", "到", "了", "教室"], "s": "老师早早地到了教室。", "alt": [], "p": "Lǎoshī zǎo zǎo dì dào le jiàoshì.", "x": "Guru sudah tiba di kelas pagi-pagi sekali."}, {"k": "6-3.8", "t": "su", "w": ["爸爸", "很", "快", "地", "吃", "完", "早饭"], "s": "爸爸很快地吃完早饭。", "alt": [], "p": "Bàba hěn kuài dì chī wán zǎofàn.", "x": "Ayah cepat-cepat menghabiskan sarapan."}, {"k": "6-3.9", "t": "su", "w": ["我们", "要", "高高兴兴", "地", "玩"], "s": "我们要高高兴兴地玩。", "alt": [], "p": "Wǒmen yào gāo gāoxìng xìng dì wán.", "x": "Kita harus bermain dengan gembira."}, {"k": "6-3.10", "t": "su", "w": ["学生们", "认真", "地", "听", "老师", "说话"], "s": "学生们认真地听老师说话。", "alt": [], "p": "Xuéshēngmen rènzhēn dì tīng lǎoshī shuōhuà.", "x": "Para siswa mendengarkan guru dengan serius."}, {"k": "6-3.11", "t": "su", "w": ["你", "回", "家", "好好", "地", "睡", "一", "觉", "吧"], "s": "你回家好好地睡一觉吧。", "alt": [], "p": "Nǐ huí jiā hǎo hǎo dì shuì yí jiào ba.", "x": "Pulanglah dan tidurlah baik-baik."}, {"k": "6-3.12", "t": "su", "w": ["她", "慢慢", "地", "走进", "了", "教室"], "s": "她慢慢地走进了教室。", "alt": [], "p": "Tā màn màn dì zǒu jìn le jiàoshì.", "x": "Dia berjalan masuk ke kelas pelan-pelan."}, {"k": "6-3.13", "t": "bs", "s": "他高兴地说：“谢谢！”", "sp": "Tā gāoxìng de shuō: \"Xièxie!\"", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "6-3.14", "t": "bs", "s": "他认真的学习。", "sp": "Tā rènzhēn de xuéxí.", "n": "", "ok": false, "b": "他认真地学习。", "bp": "Tā rènzhēn dì xuéxí.", "x": "Sebelum kata kerja: 地."}, {"k": "6-3.15", "t": "bs", "s": "孩子们早早地就上床了。", "sp": "Háizimen zǎo zǎo dì jiù shàng chuáng le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "6-3.16", "t": "bs", "s": "这是一件漂亮地衣服。", "sp": "Zhè shì yí jiàn piàoliang dì yīfu.", "n": "", "ok": false, "b": "这是一件漂亮的衣服。", "bp": "Zhè shì yí jiàn piàoliang de yīfu.", "x": "Sebelum kata benda: 的."}, {"k": "6-3.17", "t": "bs", "s": "她慢慢地走进了教室。", "sp": "Tā màn màn dì zǒu jìn le jiàoshì.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "7-1", "pel": 7, "judul": "Kalimat ringkas 一……就……: begitu … langsung …", "kode": "紧缩复句\"一……就……\"", "rumus": ["S + 一 + KK1 + 就 + KK2 (subjek sama)", "S1 + 一 + KK1，S2 + 就 + KK2 (subjek beda)", "一 + kondisi + 就 + hasil (setiap kali …)"], "jelas": ["一……就…… menyatakan bahwa tindakan kedua terjadi SEGERA setelah tindakan pertama: \"begitu … langsung …\". 我一下飞机就给妈妈打电话 = begitu turun dari pesawat, saya langsung menelepon ibu.", "Pola ini juga bisa berarti hubungan syarat-akibat atau kebiasaan: \"setiap kali …, pasti …\". 一到星期六，陈天中就跟同学去打篮球 = setiap kali hari Sabtu tiba, Chen Tianzhong (langsung) main basket bersama teman. 他一有时间就运动 = setiap ada waktu dia berolahraga.", "Posisi subjek: jika subjeknya SAMA, subjek cukup sekali, di depan 一: 你怎么一下课就往外跑？ Jika subjeknya BERBEDA, subjek pertama di depan 一 dan subjek kedua di depan 就: 我一到家，妈妈就打来电话了。 Ingat: 就 harus langsung di depan kata kerja kedua, setelah subjek kedua. 就妈妈打来电话 salah.", "一 dan 就 adalah kata keterangan, jadi keduanya diletakkan sebelum kata kerja. Tidak ada kata \"setelah\" (以后) yang perlu ditambahkan, meskipun dalam bahasa Indonesia kita sering bilang \"begitu selesai kelas\".", "Nada 一 di sini mengikuti aturan perubahan nada: sebelum nada 4 dibaca yí (一到 yí dào, 一下课 yí xià kè), sebelum nada 1, 2, 3 dibaca yì (一说 yì shuō, 一回家 yì huí jiā, 一有时间 yì yǒu shíjiān).", "Jebakan pelajar Indonesia: menaruh 就 sebelum subjek kedua karena terbiasa \"langsung ibu menelepon\". Dalam bahasa Mandarin urutannya: subjek + 就 + kata kerja."], "poin": ["一……就…… = begitu … langsung … / setiap kali … pasti ….", "Subjek sama: S + 一 + KK1 + 就 + KK2.", "Subjek beda: S1 + 一 + KK1，S2 + 就 + KK2.", "就 selalu tepat sebelum kata kerja kedua."], "contoh": [{"zh": "你怎么一下课就往外跑？", "py": "Nǐ zěnme yíxià kè jiù wǎng wài pǎo?", "id": "Kenapa begitu kelas selesai kamu langsung lari keluar?", "b": true, "tr": "07-1"}, {"zh": "我一到家，妈妈就打来电话了。", "py": "Wǒ yí dào jiā, māma jiù dǎ lái diànhuà le.", "id": "Begitu saya sampai di rumah, ibu langsung menelepon.", "b": true, "tr": null}, {"zh": "一到星期六，陈天中就跟同学去打篮球。", "py": "Yí dào xīngqīliù, Chén Tiānzhōng jiù gēn tóngxué qù dǎ lánqiú.", "id": "Setiap hari Sabtu tiba, Chen Tianzhong langsung main basket dengan teman-temannya.", "b": true, "tr": null}, {"zh": "我一下飞机就给妈妈打电话。", "py": "Wǒ yíxià fēijī jiù gěi māma dǎdiànhuà.", "id": "Begitu turun dari pesawat, saya langsung menelepon ibu.", "b": true, "tr": null}, {"zh": "我还喜欢踢足球，一到星期天就跟朋友们去踢球。", "py": "Wǒ hái xǐhuan tī zúqiú, yí dào xīngqītiān jiù gēn péngyoumen qù tī qiú.", "id": "Saya juga suka main sepak bola; setiap hari Minggu saya main bola dengan teman-teman.", "b": true, "tr": "07-3"}, {"zh": "他一有时间就运动。", "py": "Tā yì yǒu shíjiān jiù yùndòng.", "id": "Setiap ada waktu, dia langsung berolahraga.", "b": false, "tr": null}, {"zh": "好的，我一下班就回来。", "py": "Hǎo de, wǒ yíxià bān jiù huílái.", "id": "Baik, begitu pulang kerja saya langsung pulang.", "b": false, "tr": null}, {"zh": "小猫一看见鱼就过来了。", "py": "Xiǎomāo yí kànjiàn yú jiù guòlái le.", "id": "Begitu melihat ikan, kucing kecil itu langsung datang.", "b": false, "tr": null}, {"zh": "他一回家就睡觉了。", "py": "Tā yì 一下班就回来", "下班一就回来", "一就下班回来", "就一下班回来"], "a": 0, "x": "一 + KK1 + 就 + KK2."}, {"k": "7-1.6", "t": "pg", "q": "Mana arti yang paling tepat untuk 他一回家就睡觉了？", "o": ["Begitu sampai di rumah, dia langsung tidur.", "Dia pulang lalu tidak tidur.", "Dia tidur di rumah satu kali.", "Dia ingin pulang dan tidur."], "a": 0, "x": "一……就 = begitu … langsung …."}, {"k": "7-1.7", "t": "su", "w": ["你", "怎么", "一", "下课", "就", "往外", "跑"], "s": "你怎么一下课就往外跑？", "alt": [], "p": "Nǐ zěnme yíxià kè jiù wǎng wài pǎo?", "x": "Kenapa begitu kelas selesai kamu langsung lari keluar?"}, {"k": "7-1.8", "t": "su", "w": ["我", "一", "到", "家，", "妈妈", "就", "打来", "电话", "了"], "s": "我一到家，妈妈就打来电话了。", "alt": [], "p": "Wǒ yí dào jiā, māma jiù dǎ lái diànhuà le.", "x": "Begitu saya sampai di rumah, ibu langsung menelepon."}, {"k": "7-1.9", "t": "su", "w": ["我", "一", "下", "飞机", "就", "给", "妈妈", "打", "电话"], "s": "我一下飞机就给妈妈打电话。", "alt": [], "p": "Wǒ yíxià fēijī jiù gěi māma dǎdiànhuà.", "x": "Begitu turun dari pesawat, saya langsung menelepon ibu."}, {"k": "7-1.10", "t": "su", "w": ["他", "一", "有", "时间", "就", "运动"], "s": "他一有时间就运动。", "alt": [], "p": "Tā yì yǒu shíjiān jiù yùndòng.", "x": "Setiap ada waktu, dia langsung berolahraga."}, {"k": "7-1.11", "t": "su", "w": ["小猫", "一", "看见", "鱼", "就", "过来", "了"], "s": "小猫一看见鱼就过来了。", "alt": [], "p": "Xiǎomāo yí kànjiàn yú jiù guòlái le.", "x": "Begitu melihat ikan, kucing kecil itu langsung datang."}, {"k": "7-1.12", "t": "su", "w": ["我", "一", "说，", "他", "就", "懂", "了"], "s": "我一说，他就懂了。", "alt": [], "p": "Wǒ yì shuō, tā jiù dǒng le.", "x": "Begitu saya jelaskan, dia langsung paham."}, {"k": "7-1.13", "t": "bs", "s": "他一回家就睡觉了。", "sp": "Tā yì huí jiā jiù shuìjiào le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "7-1.14", "t": "bs", "s": "我一到家，就妈妈打来电话了。", "sp": "Wǒ yí dào jiā, jiù māma dǎ lái diànhuà le.", "n": "", "ok": false, "b": "我一到家，妈妈就打来电话了。", "bp": "Wǒ yí dào jiā, māma jiù dǎ lái diànhuà le.", "x": "Subjek kedua sebelum 就."}, {"k": "7-1.15", "t": "bs", "s": "一到星期天，他就去踢球。", "sp": "Yí dào xīngqītiān, tā jiù qù tī qiú.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "7-1.16", "t": "bs", "s": "我下课一就去吃饭。", "sp": "Wǒ xiàkè yí jiù qù chīfàn.", "n": "", "ok": false, "b": "我一下课就去吃饭。", "bp": "Wǒ yíxià kè jiù qù chīfàn.", "x": "一 sebelum kata kerja pertama."}, {"k": "7-1.17", "t": "bs", "s": "天气一冷，我就不想起床。", "sp": "Tiānqì yì lěng, wǒ jiù bù xiǎng qǐchuáng.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "7-2", "pel": 7, "judul": "Pelengkap keadaan (1): KK + 得 + KS", "kode": "状态补语（1）", "rumus": ["S + KK + 得 + (很/还/不) + KS", "Ingkar: KK + 得 + 不 + KS", "Tanya: …吗？ / KK + 得 + KS不KS？ / KK + 得 + 怎么样？"], "jelas": ["Pelengkap keadaan menilai atau menggambarkan bagaimana sebuah tindakan dilakukan: cepat atau lambat, baik atau buruk, pagi atau siang. Polanya: kata kerja + 得 + frasa kata sifat. 他们玩得很高兴 = mereka bermain dengan gembira; 白家月跑得不快 = larinya Bai Jiayue tidak cepat.", "Kata sifat setelah 得 biasanya diberi kata keterangan seperti 很, 非常, 太, 还可以, 不太. Seperti kalimat kata sifat biasa, 很 di sini sering hanya pelengkap irama, tidak selalu berarti \"sangat\".", "Bentuk ingkar: 不 diletakkan sebelum kata SIFAT, bukan sebelum kata kerja: 跑得不快 (larinya tidak cepat). 不跑得快 salah.", "Tiga bentuk tanya: (1) …吗？ 你跑得快吗？ (2) KK + 得 + KS不KS？ 他来得早不早？ (3) KK + 得 + 怎么样？ 他们玩得怎么样？ Jawaban singkat yang sering: 还可以 (lumayan).", "Jebakan pelajar Indonesia: bahasa Indonesia menaruh kata sifat langsung di belakang kata kerja (\"dia lari cepat\"). Dalam bahasa Mandarin wajib ada 得: 他跑得很快。 Jangan tertukar dengan 的 dan 地: 得 setelah kata kerja.", "Beda dengan 地: 他很快地跑了 (cara pada saat itu, keterangan di depan) vs 他跑得很快 (penilaian: larinya cepat, pelengkap di belakang)."], "poin": ["KK + 得 + KS = menilai cara/hasil tindakan.", "Ingkar: KK + 得 + 不 + KS.", "Tanya: 吗 / KS不KS / 怎么样.", "Wajib 得 setelah kata kerja."], "contoh": [{"zh": "我踢得还可以。", "py": "Wǒ tī de hái kěyǐ.", "id": "Main bola saya lumayan.", "b": true, "tr": "07-3"}, {"zh": "他们玩得很高兴。", "py": "Tāmen wán de hěn gāoxìng.", "id": "Mereka bermain dengan gembira.", "b": true, "tr": null}, {"zh": "白家月跑得不快。", "py": "Bái Jiāyuè pǎo de bú kuài.", "id": "Lari Bai Jiayue tidak cepat.", "b": true, "tr": null}, {"zh": "你跑得快吗？", "py": "Nǐ pǎo de kuài ma?", "id": "Larimu cepat?", "b": true, "tr": null}, {"zh": "他来得早不早？", "py": "Tā lái de zǎo bu zǎo?", "id": "Dia datang pagi atau tidak?", "b": true, "tr": null}, {"zh": "他们玩得怎么样？", "py": "Tāmen wán de zěnmeyàng?", "id": "Mereka bermain bagaimana?", "b": true, "tr": null}, {"zh": "你踢得怎么样？", "py": "Nǐ tī de zěnmeyàng?", "id": "Main bolamu bagaimana?", "b": true, "tr": "07-3"}, {"zh": "跑步呢？你跑得快不快？", "py": "Pǎobù ne? Nǐ pǎo de kuài bu kuài?", "id": "Bagaimana dengan lari? Larimu cepat atau tidak?", "b": true, "tr": "07-5"}, {"zh": "我跑得不快，也不太喜欢跑步。", "py": "Wǒ pǎo de bú kuài, yě bú tài xǐhuan pǎobù.", "id": "Lari saya tidak cepat, dan saya juga kurang suka lari.", "b": true, "tr": "07-5"}, {"zh": "她唱得非常好听。", "py": "Tā chàng de fēicháng hǎotīng.", "id": "Nyanyiannya sangat merdu.", "b": false, "tr": null}, {"zh": "你昨天晚上睡得好吗？——睡得不太好。", "py": "Nǐ zuótiān wǎnshang shuì de hǎo ma? — Shuì de bú tài hǎo.", "id": "Semalam tidurmu nyenyak? — Kurang nyenyak.", "b": false, "tr": null}, {"zh": "他今天来得很晚。", "py": "Tā jīntiān lái de hěn wǎn.", "id": "Hari ini dia datang terlambat.", "b": false, "tr": null}], "salah": [{"s": "他跑很快。", "sp": "Tā pǎo hěn kuài.", "n": "", "b": "他跑得很快。", "bp": "Tā pǎo de hěn kuài.", "a": "Pelengkap keadaan wajib memakai 得."}, {"s": "他不跑得快。", "sp": "Tā bù pǎo de kuài.", "n": "", "b": "他跑得不快。", "bp": "Tā pǎo de bú kuài.", "a": "不 sebelum kata sifat."}, {"s": "他们玩的很高兴。", "sp": "Tāmen wán de hěn gāoxìng.", "n": "", "b": "他们玩得很高兴。", "bp": "Tāmen wán de hěn gāoxìng.", "a": "Setelah kata kerja memakai 得, bukan 的."}], "latihan": [{"k": "7-2.0", "t": "pg", "q": "他们玩___很高兴。", "o": ["得", "的", "地", "了"], "a": 0, "x": "KK + 得 + KS.", "f": "他们玩得很高兴。", "fp": "Tāmen wán de hěn gāoxìng."}, {"k": "7-2.1", "t": "pg", "q": "Ingkar dari 白家月跑得快。", "o": ["白家月跑得不快。", "白家月不跑得快。", "白家月没跑得快。", "白家月跑不得快。"], "a": 0, "x": "不 sebelum kata sifat."}, {"k": "7-2.2", "t": "pg", "q": "A：你踢得怎么样？ B：我踢得___。", "o": ["还可以", "还可以得", "可以还", "得还可以"], "a": 0, "x": "Jawaban: KK + 得 + 还可以."}, {"k": "7-2.3", "t": "pg", "q": "他来得早___早？", "o": ["不", "没", "吗", "了"], "a": 0, "x": "KS不KS: 早不早.", "f": "他来得早不早？", "fp": "Tā lái de zǎo bu zǎo?"}, {"k": "7-2.4", "t": "pg", "q": "Mana yang SALAH?", "o": ["她唱得很好听。", "他跑得不快。", "我睡得很好。", "他说很快汉语。"], "a": 3, "x": "Perlu 得; dan objek ditangani di topik berikut."}, {"k": "7-2.5", "t": "pg", "q": "\"Hari ini dia datang terlambat.\" =", "o": ["他今天来得很晚。", "他今天来很晚得。", "他今天得来很晚。", "他今天来的很晚地。"], "a": 0, "x": "来 + 得 + 很晚."}, {"k": "7-2.6", "t": "pg", "q": "A：你昨天晚上___？ B：睡得不太好。", "o": ["睡得好吗", "睡好得吗", "得睡好吗", "睡得吗好"], "a": 0, "x": "Tanya: KK + 得 + KS + 吗."}, {"k": "7-2.7", "t": "su", "w": ["我", "踢", "得", "还", "可以"], "s": "我踢得还可以。", "alt": [], "p": "Wǒ tī de hái kěyǐ.", "x": "Main bola saya lumayan."}, {"k": "7-2.8", "t": "su", "w": ["他们", "玩", "得", "很", "高兴"], "s": "他们玩得很高兴。", "alt": [], "p": "Tāmen wán de hěn gāoxìng.", "x": "Mereka bermain dengan gembira."}, {"k": "7-2.9", "t": "su", "w": ["白家月", "跑", "得", "不", "快"], "s": "白家月跑得不快。", "alt": [], "p": "Bái Jiāyuè pǎo de bú kuài.", "x": "Lari Bai Jiayue tidak cepat."}, {"k": "7-2.10", "t": "su", "w": ["你", "跑", "得", "快", "不", "快"], "s": "你跑得快不快？", "alt": [], "p": "Nǐ pǎo de kuài bu kuài?", "x": "Larimu cepat atau tidak?"}, {"k": "7-2.11", "t": "su", "w": ["他们", "玩", "得", "怎么样"], "s": "他们玩得怎么样？", "alt": [], "p": "Tāmen wán de zěnmeyàng?", "x": "Mereka bermain bagaimana?"}, {"k": "7-2.12", "t": "su", "w": ["她", "唱", "得", "非常", "好听"], "s": "她唱得非常好听。", "alt": [], "p": "Tā chàng de fēicháng hǎotīng.", "x": "Nyanyiannya sangat merdu."}, {"k": "7-2.13", "t": "bs", "s": "他来得很早。", "sp": "Tā lái de hěn zǎo.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "7-2.14", "t": "bs", "s": "他跑很快。", "sp": "Tā pǎo hěn kuài.", "n": "", "ok": false, "b": "他跑得很快。", "bp": "Tā pǎo de hěn kuài.", "x": "Perlu 得."}, {"k": "7-2.15", "t": "bs", "s": "你踢得怎么样？", "sp": "Nǐ tī de zěnmeyàng?", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "7-2.16", "t": "bs", "s": "我不睡得好。", "sp": "Wǒ bú shuì de hǎo.", "n": "", "ok": false, "b": "我睡得不好。", "bp": "Wǒ shuì de bù hǎo.", "x": "不 sebelum kata sifat."}, {"k": "7-2.17", "t": "bs", "s": "他们玩得很高兴。", "sp": "Tāmen wán de hěn gāoxìng.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "7-3", "pel": 7, "judul": "Pelengkap keadaan (2): dengan objek dan kata kerja pisah", "kode": "状态补语（2）", "rumus": ["S + (KK) + O + KK + 得 + KS (写汉字写得很好看)", "S + O + KK + 得 + KS (篮球打得很好)", "Kata kerja pisah: 游泳游得…, 唱歌唱得…"], "jelas": ["Jika kata kerja punya objek, objek TIDAK boleh diletakkan di antara kata kerja dan 得, juga tidak setelah 得. 他打篮球得很好 dan 他打得篮球很好 keduanya salah.", "Ada dua cara yang benar. Cara 1 — ulangi kata kerjanya: S + KK + O + KK + 得 + KS. 白家月写汉字写得很好看。 Cara 2 — pindahkan objek ke depan kata kerja (kata kerja pertama dihapus): S + O + KK + 得 + KS. 他篮球打得很好。 你篮球打得怎么样？", "Kata kerja pisah (离合词) seperti 游泳, 唱歌, 跑步, 跳舞, 睡觉, 说话 sebenarnya sudah berisi kata kerja + objek, jadi bagian kata kerjanya harus diulang: 我游泳游得不快; 安妮唱歌唱得很好听; 他跑步跑得很快. Atau cukup kata kerja + 得: 我游得不快.", "Bentuk ingkar dan tanya sama dengan pelengkap keadaan (1): 我游泳游得不快。 你中文说得怎么样？ 她唱歌唱得好听吗？", "Jebakan pelajar Indonesia: kalimat \"Dia berbicara bahasa Mandarin dengan lancar\" sering diterjemahkan langsung menjadi 他说汉语很好. Yang benar: 他说汉语说得很好 atau 他汉语说得很好.", "Subjek bisa juga diikuti 的 dan objek: 他的汉语说得很好. Untuk pemula, dua cara utama di atas sudah cukup."], "poin": ["Objek tidak boleh di antara KK dan 得.", "Cara 1: KK + O + KK + 得 + KS.", "Cara 2: O + KK + 得 + KS.", "Kata kerja pisah: ulangi bagian kata kerja (游泳游得)."], "contoh": [{"zh": "我游泳游得不快。", "py": "Wǒ yóuyǒng yóu de bú kuài.", "id": "Renang saya tidak cepat.", "b": true, "tr": "07-5"}, {"zh": "你篮球打得怎么样？", "py": "Nǐ lánqiú dǎ de zěnmeyàng?", "id": "Main basketmu bagaimana?", "b": true, "tr": "07-5"}, {"zh": "白家月写汉字写得很好看。", "py": "Bái Jiāyuè xiě Hànzì xiě de hěn hǎokàn.", "id": "Tulisan hanzi Bai Jiayue sangat bagus.", "b": true, "tr": null}, {"zh": "他篮球打得很好。", "py": "Tā lánqiú dǎ de hěn hǎo.", "id": "Dia jago main basket.", "b": true, "tr": null}, {"zh": "喜欢，但我游泳游得不快。", "py": "Xǐhuan, dàn wǒ yóuyǒng yóu de bú kuài.", "id": "Suka, tapi renang saya tidak cepat.", "b": true, "tr": "07-5"}, {"zh": "安妮唱歌唱得很好听。", "py": "Ānnī chànggē chàng de hěn hǎotīng.", "id": "Nyanyian Annie sangat merdu.", "b": false, "tr": null}, {"zh": "家月中文说得很好。", "py": "Jiāyuè Zhōngwén shuō de hěn hǎo.", "id": "Bahasa Mandarin Jiayue sangat bagus.", "b": false, "tr": null}, {"zh": "他足球踢得怎么样？", "py": "Tā zúqiú tī de zěnmeyàng?", "id": "Main sepak bolanya bagaimana?", "b": false, "tr": null}, {"zh": "妈妈做饭做得非常好吃。", "py": "Māma zuòfàn zuò de fēicháng hǎochī.", "id": "Masakan ibu sangat enak.", "b": false, "tr": null}, {"zh": "他跑步跑得很快。", "py": "Tā pǎobù pǎo de hěn kuài.", "id": "Larinya sangat cepat.", "b": false, "tr": null}, {"zh": "我汉字写得不太好看。", "py": "Wǒ Hànzì xiě de bú tài hǎokàn.", "id": "Tulisan hanzi saya kurang bagus.", "b": false, "tr": null}, {"zh": "你说汉语说得真好！", "py": "Nǐ shuō Hànyǔ shuō de zhēn hǎo!", "id": "Bahasa Mandarinmu bagus sekali!", "b": false, "tr": null}], "salah": [{"s": "他打篮球得很好。", "sp": "Tā dǎ lánqiú de hěn hǎo.", "n": "", "b": "他篮球打得很好。 / 他打篮球打得很好。", "bp": "Tā lánqiú dǎ de hěn hǎo. / Tā dǎ lánqiú dǎ de hěn hǎo.", "a": "Objek tidak boleh di antara kata kerja dan 得."}, {"s": "我游泳得不快。", "sp": "Wǒ yóuyǒng de bú kuài.", "n": "", "b": "我游泳游得不快。", "bp": "Wǒ yóuyǒng yóu de bú kuài.", "a": "Kata kerja pisah: ulangi 游."}, {"s": "他说得汉语很好。", "sp": "Tā shuō de Hànyǔ hěn hǎo.", "n": "", "b": "他汉语说得很好。", "bp": "Tā Hànyǔ shuō de hěn hǎo.", "a": "Objek tidak boleh setelah 得."}], "latihan": [{"k": "7-3.0", "t": "pg", "q": "我游泳___得不快。", "o": ["游", "泳", "游泳", "得"], "a": 0, "x": "Kata kerja pisah: at pola positifnya."], "poin": ["A 比 B + KS = A lebih … daripada B.", "Kata sifat selalu di akhir.", "A dan B bisa KB, frasa 的, atau frasa KK.", "Selisih ditaruh setelah KS: 大两岁."], "contoh": [{"zh": "我也觉得左边的比右边的好看。", "py": "Wǒ yě juéde zuǒbian de bǐ yòubian de hǎokàn.", "id": "Menurut saya juga yang kiri lebih bagus daripada yang kanan.", "b": true, "tr": "08-1"}, {"zh": "今天比昨天冷。", "py": "Jīntiān bǐ zuótiān lěng.", "id": "Hari ini lebih dingin daripada kemarin.", "b": true, "tr": null}, {"zh": "他觉得踢足球比打篮球有意思。", "py": "Tā juéde tī zúqiú bǐ dǎ lánqiú yǒuyìsi.", "id": "Menurutnya main sepak bola lebih seru daripada main basket.", "b": true, "tr": null}, {"zh": "网上买比在这里买便宜。", "py": "Wǎngshang mǎi bǐ zài zhèlǐ mǎi piányi.", "id": "Beli online lebih murah daripada beli di sini.", "b": true, "tr": "08-3"}, {"zh": "她比我大。", "py": "Tā bǐ wǒ dà.", "id": "Dia lebih tua daripada saya.", "b": true, "tr": null}, {"zh": "饺子比面条儿好吃。", "py": "Jiǎozi bǐ miàntiáor hǎochī.", "id": "Jiaozi lebih enak daripada mi.", "b": false, "tr": null}, {"zh": "这家书店比前边那家大。", "py": "Zhè jiā shūdiàn bǐ qiánbian nà jiā dà.", "id": "Toko buku ini lebih besar daripada yang di depan itu.", "b": false, "tr": null}, {"zh": "这条黑色的裤子比那条白色的长。", "py": "Zhè tiáo hēisè de kùzi bǐ nà tiáo báisè de cháng.", "id": "Celana hitam ini lebih panjang daripada yang putih itu.", "b": false, "tr": null}, {"zh": "哥哥比我高。", "py": "Gēge bǐ wǒ gāo.", "id": "Kakak laki-laki lebih tinggi daripada saya.", "b": false, "tr": null}, {"zh": "坐地铁比打车便宜。", "py": "Zuò dìtiě bǐ dǎchē piányi.", "id": "Naik kereta bawah tanah lebih murah daripada naik taksi.", "b": false, "tr": null}, {"zh": "她比我大两岁。", "py": "Tā bǐ wǒ dà liǎng suì.", "id": "Dia dua tahun lebih tua daripada saya.", "b": false, "tr": null}], "salah": [{"s": "今天比昨天是冷。", "sp": "Jīntiān bǐ zuótiān shì lěng.", "n": "", "b": "今天比昨天冷。", "bp": "Jīntiān bǐ zuótiān lěng.", "a": "Tidak memakai 是 sebelum kata sifat."}, {"s": "今天冷比昨天。", "sp": "Jīntiān lěng bǐ zuótiān.", "n": "", "b": "今天比昨天冷 ih enak).", "Dengan 更/还, kalimat mengandung makna bahwa B juga sudah memiliki sifat itu. 这个电影比那个爱情片更有意思 berarti film romantis itu sudah seru, dan film ini lebih seru lagi. Tanpa 更/还 (这个电影比那个有意思), tidak ada anggapan itu.", "还 dalam perbandingan terasa lebih emosional (heran/menekankan), 更 lebih netral. Keduanya diletakkan tepat sebelum kata sifat, setelah B.", "更 juga bisa dipakai tanpa 比 jika pembanding sudah jelas: 我也觉得绿色的更好看。", "Jebakan pelajar Indonesia: \"jauh lebih mahal\" jangan diterjemahkan 比……很贵. Untuk HSK 2, cukup gunakan 更/还; ungkapan \"jauh lebih\" (多了/得多) dipelajari kemudian."], "poin": ["Dalam kalimat 比 tidak boleh 很/非常/太/真.", "更/还 + KS = lebih … lagi / bahkan lebih.", "更/还 menyiratkan B juga sudah ….", "更 boleh tanpa 比 jika jelas."], "contoh": [{"zh": "我看网上说这个电影比那个爱情片更有意思。", "py": "Wǒ kàn wǎngshang shuō zhège diànyǐng bǐ nàge àiqíngpiàn gèng yǒuyìsi.", "id": "Saya baca di internet, film ini lebih seru daripada film romantis itu.", "b": true, "tr": "08-3"}, {"zh": "今天比昨天更热。", "py": "Jīntiān bǐ zuótiān gèng rè.", "id": "Hari ini lebih panas lagi daripada kemarin.", "b": true, "tr": null}, {"zh": "我觉得奶茶比牛奶还好喝。", "py": "Wǒ juéde nǎichá bǐ niúnǎi hái hǎo hē.", "id": "Menurut saya teh susu bahkan lebih enak daripada susu.", "b": true, "tr": null}, {"zh": "我也觉得绿色的更好看。", "py": "Wǒ yě juéde lǜsè de gèng hǎokàn.", "id": "Saya juga merasa yang hijau lebih bagus.", "b": true, "tr": "04-5"}, {"zh": "我觉得你做的菜比饭馆的还好吃。", "py": "Wǒ juéde nǐ zuò de cài bǐ fànguǎn de hái hǎochī.", "id": "Menurut saya masakanmu bahkan lebih enak daripada masakan restoran.", "b": false, "tr": null}, {"zh": "我喜欢绿茶，我觉得绿茶比红茶更好喝。", "py": "Wǒ xǐhuan lǜchá, wǒ juéde lǜchá bǐ hóngchá gèng hǎo hē.", "id": "Saya suka teh hijau, menurut saya teh hijau lebih enak daripada teh hitam.", "b": false, "tr": null}, {"zh": "今天晚上比昨天晚上还冷。", "py": "Jīntiān wǎnshang bǐ zuótiān wǎnshang hái lěng.", "id": "Malam ini bahkan lebih dingin daripada tadi malam.", "b": false, "tr": null}, {"zh": "妈妈的床比我的床更舒服。", "py": "  wǒ gèng gāo.", "x": "更 sebelum kata sifat."}, {"k": "8-2.17", "t": "bs", "s": "弟弟比哥哥非常高。", "sp": "Dìdi bǐ gēge fēicháng gāo.", "n": "", "ok": false, "b": "弟弟比哥哥还高。", "bp": "Dìdi bǐ gēge hái gāo.", "x": "非常 tidak dipakai; ganti 还/更."}]}, {"id": "8-3", "pel": 8, "judul": "Kalimat pertentangan: 虽然……，但是……", "kode": "转折复句\"虽然……，但是……\"", "rumus": ["虽然 + fakta，但是 + hal yang berlawanan", "Boleh hanya 虽然……，S + 还是… / hanya …，但是…", "S + 虽然…… (subjek boleh sebelum 虽然)"], "jelas": ["虽然 (meskipun) mengantar fakta pertama, 但是 (tetapi) mengantar hal yang berlawanan dengan dugaan. 虽然你忘了，但是我记得 = meskipun kamu lupa, (tetapi) saya ingat.", "Bahasa Indonesia biasanya hanya memakai salah satu (\"meskipun …, saya …\" atau \"…, tetapi …\"). Dalam bahasa Mandarin pasangan 虽然……但是…… sangat wajar dan sering. Keduanya juga boleh dipakai sendiri: 外边下雪了，但是不太冷。 / 虽然觉得有点儿累，我还是走回家了。", "Posisi 虽然: di awal klausa pertama, atau setelah subjek: 虽然他很忙 / 他虽然很忙. 但是 selalu di awal klausa kedua (sebelum subjek kedua jika ada): 虽然妻子忘了……，但是丈夫记得。", "Di klausa kedua sering muncul 还是 (tetap) atau 也: 虽然很晚了，他还是在教室里学习。 但是 boleh diganti 可是 atau 但 dalam bahasa lisan.", "Jebakan pelajar Indonesia: jangan memakai 虽然 dan 所以 bersama (itu pola sebab-akibat). Pasangan 虽然 adalah 但是/可是/还是.", "Pola ini juga cocok untuk menilai sesuatu dengan seimbang: 这件衣服虽然有点儿贵，但是很好看。"], "poin": ["虽然 = meskipun; 但是 = tetapi.", "Boleh berpasangan atau salah satu.", "虽然 di awal atau setelah subjek; 但是 di awal klausa kedua.", "Jangan memasangkan 虽然 dengan 所以."], "contoh": [{"zh": "虽然你忘了，但是我记得。", "py": "Suīrán nǐ wàng le, dànshì wǒ jìde.", "id": "Meskipun kamu lupa, saya ingat.", "b": true, "tr": "08-5"}, {"zh": "外边下雪了，但是不太冷。", "py": "Wàibian xià xuě le, dànshì bú tài lěng.", "id": "Di luar turun salju, tetapi tidak terlalu dingin.", "b": true, "tr": null}, {"zh": "虽然觉得有点儿累，我还是走回家了。", "py": "Suīrán juéde yǒudiǎnr lèi, wǒ háishi zǒu huí jiā le.", "id": "Meskipun agak capek, saya tetap berjalan pulang.", "b": true, "tr": null}, {"zh": "虽然花了一些钱，但是我们过了一个快乐的生日。", "py": "Suīrán huā le yìxiē qián, dànshì wǒmen guò le yí gè kuàilè de shēngrì.", "id": "Meskipun menghabiskan sedikit uang, kita merayakan ulang tahun yang bahagia.", "b": true, "tr": "08-5"}, {"zh": "虽然妻子忘了今天是自己的生日，但是丈夫记得。", "py": "Suīrán qīzi wàng le jīntiān shì zìjǐ de shēngrì, dànshì zhàngfu jìde.", "id": "Meskipun sang istri lupa bahwa hari ini ulang tahunnya, sang suami ingat.", "b": true, "tr": "08-7"}, {"zh": "虽然有到学校的公交车，但是车站有点儿远。", "py": "Suīrán yǒu dào xuéxiào de gōngjiāochē, dànshì chēzhàn yǒudiǎnr yuǎn.", "id": "Meskipun ada bus ke sekolah, haltenya agak jauh.", "b": false, "tr": null}, {"zh": "我喜欢打篮球，但是打得不太好。", "py": "Wǒ xǐhuan dǎ lánqiú, dànshì dǎ de bú tài hǎo.", "id": "Saya suka main basket, tetapi mainnya kurang bagus.", "b": false, "tr": null}, {"zh": "虽然很晚了，他还在教室里学习。", "py": "Suīrán hěn wǎn le, tā hái zài jiàoshì lǐ xuéxí.", "id": "Meskipun sudah larut, dia masih belajar di kelas.", "b": false, "tr": null}, {"zh": "这件衣服虽然有点儿贵，但是很好看。", "py": "Zhè jiàn yīfu suīrán yǒudiǎnr guì, dànshì hěn hǎokàn.", "id": "Baju ini meskipun agak mahal, tetapi sangat bagus.", "b": false, "tr": null}, {"zh": "虽然他是中国人，但是他不会做中国菜。", "py": "Suīrán tā shì Zhōngguó rén, dànshì tā bú huì zuò Zhōngguó cài.", "id": "Meskipun dia orang Tiongkok, dia tidak bisa memasak masakan Tiongkok.", "b": false, "tr": null}], "salah": [{"s": "虽然下雨了，所以我们没出去。", "sp": "Suīrán xià yǔ le, suǒyǐ wǒmen méi chūqù.", "n": "", "b": "因为下雨了，所以我们没出去。", "bp": "Yīnwèi xià yǔ le, suǒyǐ wǒmen méi chūqù.", "a": "虽然 berpasangan dengan 但是, bukan 所以."}, {"s": "虽然他很忙，他但是每天学习。", "sp": "Suīrán tā hěn máng, tā dànshì měi tiān xuéxí.", "n": "", "b": "虽然他很忙，但是他每天学习。", "bp": "Suīrán tā hěn máng, dànshì tā měi tiān xuéxí.", "a": "但是 di awal klausa kedua, sebelum subjek."}, {"s": "但是你忘了，虽然我记得。", "sp": "Dànshì nǐ wàng le, suīrán wǒ jìde.", "n": "", "b": "虽然你忘了，但是我记得。", "bp": "Suīrán nǐ wàng le, dànshì wǒ jìde.", "a": "虽然 di klausa pertama, 但是 di klausa kedua."}], "latihan": [{"k": "8-3.0", "t": "pg", "q": "__ : [], "p": "Zhè jiàn yīfu suīrán yǒudiǎnr guì, dànshì hěn hǎokàn.", "x": "Baju ini meskipun agak mahal, tetapi sangat bagus."}, {"k": "8-3.11", "t": "su", "w": ["我", "喜欢", "打篮球，", "但是", "打得", "不", "太", "好"], "s": "我喜欢打篮球，但是打得不太好。", "alt": [], "p": "Wǒ xǐhuan dǎ lánqiú, dànshì dǎ de bú tài hǎo.", "x": "Saya suka main basket, tetapi mainnya kurang bagus."}, {"k": "8-3.12", "t": "su", "w": ["虽然", "有点儿", "累，", "我", "还是", "走", "回", "家", "了"], "s": "虽然有点儿累，我还是走回家了。", "alt": [], "p": "Suīrán yǒudiǎnr lèi, wǒ háishi zǒu huí jiā le.", "x": "Meskipun agak capek, saya tetap berjalan pulang."}, {"k": "8-3.13", "t": "bs", "s": "虽然你忘了，但是我记得。", "sp": "Suīrán nǐ wàng le, dànshì wǒ jìde.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "8-3.14", "t": "bs", "s": "虽然下雨了，所以我没去。", "sp": "Suīrán xià yǔ le, suǒyǐ wǒ méi qù.", "n": "", "ok": false, "b": "虽然下雨了，但是我还是去了。", "bp": "Suīrán xià yǔ le, dànshì wǒ háishi qù le.", "x": "虽然 berpasangan dengan 但是/还是."}, {"k": "8-3.15", "t": "bs", "s": "外边下雪了，但是不太冷。", "sp": "Wàibian xià xuě le, dànshì bú tài lěng.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 但是 boleh sendiri."}, {"k": "8-3.16", "t": "bs", "s": "但是很贵，虽然很好看。", "sp": "Dànshì hěn guì, suīrán hěn hǎokàn.", "n": "", "ok": false, "b": "虽然很贵，但是很好看。", "bp": "Suīrán hěn guì, dànshì hěn hǎokàn.", "x": "虽然 di klausa pertama."}, {"k": "8-3.17", "t": "bs", "s": "他虽然很忙，但是每天都学习中文。", "sp": "Tā suīrán hěn máng, dànshì měi tiān dōu xuéxí Zhōngwén.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 虽然 setelah subjek."}]}, {"id": "9-1", "pel": 9, "judul": "Kalimat perbandingan (3): A 没有 B (这么/那么) + KS", "kode": "比较句（3）", "rumus": ["A + 没有 + B + KS", "A + 没有 + B + 这么/那么 + KS", "A + 有 + B + (这么/那么) + KS + 吗？"], "jelas": ["Pola 没有 dipakai untuk mengatakan \"A tidak se-… B\", artinya A kalah dari B dalam hal tertentu. 这块手表没有那块好看 = jam tangan ini tidak sebagus yang itu (yang itu lebih bagus).", "Susunannya: A + 没有 + B + kata sifat. Di depan kata sifat boleh ditambah 这么 (sebegini) atau 那么 (sebegitu) untuk menegaskan bahwa B memang tinggi tingkatnya. 这么 dipakai bila B dekat/sedang dibicarakan sekarang (昨天没有今天这么冷), 那么 bila B jauh atau orang/benda lain (儿子的个子没有他那么高).", "Bentuk positif 有 terutama dipakai dalam pertanyaan: 妹妹有姐姐高吗？ (Apakah adik perempuan setinggi kakaknya?) Jawabannya 有 / 没有.", "Bandingkan dengan 比: 今天比昨天冷 (hari ini lebih dingin) dan 昨天没有今天冷 (kemarin tidak sedingin hari ini) maknanya hampir sama, hanya sudut pandangnya berbeda. 没有 TIDAK sama dengan 不比. 我不比他高 berarti \"aku tidak lebih tinggi dari dia\" (bisa sama tinggi), sedangkan 我没有他高 jelas berarti dia lebih tinggi.", "Jebakan pelajar Indonesia: (1) memakai 不有; ingkar 有 selalu 没有. (2) Menambah 很/非常/太 di depan kata sifat: 我没有他很高 salah. (3) Menambah jumlah selisih: 我没有他高两厘米 salah; pola 没有 tidak bisa diberi angka atau 一点儿/多了.", "Kata sifat boleh diganti frasa sifat atau pelengkap: 我跑得没有他快, 我没有他跑得快. Di tingkat HSK 2 cukup kuasai bentuk dasar A 没有 B + KS."], "poin": ["A 没有 B + KS = A tidak se-KS B (B lebih).", "这么 untuk B yang dekat/sekarang, 那么 untuk B yang jauh/lain.", "Tanya: A 有 B + KS + 吗？", "Tanpa 很/太 dan tanpa angka selisih.", "Ingkar selalu 没有, bukan 不有."], "contoh": [{"zh": "儿子的个子没有他那么高。", "py": "Érzi de gèzi méiyǒu tā nàme gāo.", "id": "Tinggi badan anak kita tidak setinggi dia.", "b": true, "tr": "09-1"}, {"zh": "昨天没有今天这么冷。", "py": "Zuótiān méiyǒu jīntiān zhème lěng.", "id": "Kemarin tidak sedingin hari ini.", "b": true, "tr": null}, {"zh": "这块手表没有那块好看。", "py": "Zhè kuài shǒubiǎo méiyǒu nà kuài hǎokàn.", "id": "Jam tangan ini tidak sebagus yang itu.", "b": true, "tr": null}, {"zh": "妹妹有姐姐高吗？", "py": "Mèimei yǒu jiějie gāo ma?", "id": "Apakah adik perempuan setinggi kakaknya?", "b": true, "tr": null}, {"zh": "那件衣服有这件好看吗？", "py": "Nà jiàn yīfu yǒu zhè jiàn hǎokàn ma?", "id": "Apakah baju itu sebagus yang ini?", "b": true, "tr": null}, {"zh": "没有你上次买的那条好看。", "py": "Méiyǒu nǐ shàng cì mǎi de nà tiáo hǎokàn.", "id": "Tidak sebagus yang kamu beli waktu itu.", "b": true, "tr": "09-1"}, {"zh": "商店里边的衣服没有大商场里的好看。", "py": "Shāngdiàn lǐbian de yīfu méiyǒu dà shāngchǎng lǐ de hǎokàn.", "id": "Baju di toko itu tidak sebagus yang di mal besar.", "b": true, "tr": "09-7"}, {"zh": "姐姐没有哥哥高。", "py": "Jiějie méiyǒu gēge gāo.", "id": "Kakak perempuan tidak setinggi kakak laki-laki.", "b": true, "tr": null}, {"zh": "坐公交车没有打车快。", "py": "Zuò gōngjiāochē méiyǒu dǎchē kuài.", "id": "Naik bus tidak secepat naik taksi.", "b": true, "tr": null}, {"zh": "现在头没那么疼了。", "py": "Xiànzài tóu méi nàme téng le.", "id": "Sekarang kepalaku tidak sesakit tadi.", "b": true, "tr": "11-3"}, {"zh": "我的汉语没有他的好。", "py": "Wǒ de Hànyǔ méiyǒu tā de hǎo.", "id": "Bahasa Mandarinku tidak sebagus punyanya.", "b": false, "tr": null}, {"zh": "这个苹果没有那个大。", "py": "Zhège píngguǒ méiyǒu nàge dà.", "id": "Apel ini tidak sebesar yang itu.", "b": false, "tr": null}, {"zh": "今天的工作没有昨天那么多。", "py": "Jīntiān de gōngzuò méiyǒu zuótiān nàme duō.", "id": "Pekerjaan hari ini tidak sebanyak kemarin.", "b": false, "tr": null}, {"zh": "我家没有你家那么远。", "py": "Wǒ jiā méiyǒu nǐ jiā nàme yuǎn.", "id": "Rumahku tidak sejauh rumahmu.", "b": false, "tr": null}, {"zh": "你弟弟有你高吗？——没有，他比我矮一点儿。", "py": "Nǐ dìdi yǒu nǐ gāo ma? — Méiyǒu, tā bǐ wǒ ǎi yìdiǎnr.", "id": "Adikmu setinggi kamu? — Tidak, dia sedikit lebih pendek dariku.", "b": false, "tr": null}], "salah": [{"s": "我不有他高。", "sp": "Wǒ bù yǒu tā gāo.", "n": "", "b": "我没有他高。", "bp": "Wǒ méiyǒu tā gāo.", "a": "Ingkar 有 selalu 没有."}, {"s": "今天没有昨天很冷。", "sp": "Jīntiān méiyǒu zuótiān hěn lěng.", "n": "", "b": "今天没有昨天冷。", "bp": "Jīntiān méiyǒu zuótiān lěng.", "a": "Jangan pakai 很 di depan kata sifat dalam pola 没有."}, {"s": "我没有他高两岁。", "sp": "Wǒ méiyǒu tā gāo liǎng suì.", "n": "aku dua tahun lebih muda", "b": "他比我大两岁。", "bp": "Tā bǐ wǒ dà liǎng suì.", "a": "Pola 没有 tidak bisa diberi angka selisih; pakai 比 + jumlah."}, {"s": "这件没有那件好看一点儿。", "sp": "Zhè jiàn méiyǒu nà jiàn hǎokàn yìdiǎnr.", "n": "", "b": "这件没有那件好看。", "bp": "Zhè jiàn méiyǒu nà jiàn hǎokàn.", "a": "一点儿/多了 tidak dipakai dengan 没有."}], "latihan": [{"k": "9-1.0", "t": "pg", "q": "这块手表___那块好看。", "o": ["没有", "不有", "不是", "没是"], "a": 0, "x": "Perbandingan \"tidak se-…\": 没有.", "f": "这块手表没有那块好看。", "fp": "Zhè kuài shǒubiǎo méiyǒu nà kuài hǎokàn."}, {"k": "9-1.1", "t": "pg", "q": "昨天没有今天___冷。", "o": ["这么", "很", "太", "非常"], "a": 0, "x": "这么/那么 boleh di depan KS; 很/太/非常 tidak boleh.", "f": "昨天没有今天这么冷。", "fp": "Zuótiān méiyǒu jīntiān zhème lěng."}, {"k": "9-1.2", "t": "pg", "q": "\"Kakak perempuan tidak setinggi kakak laki-laki\" =", "o": ["姐姐没有哥哥高。", "哥哥没有姐姐高。", "姐姐没有高哥哥。", "姐姐不有哥哥高。"], "a": 0, "x": "A (姐姐) + 没有 + B (哥哥) + KS."}, {"k": "9-1.3", "t": "pg", "q": "\"我没有他高\" artinya …", "o": ["Dia lebih tinggi dariku.", "Aku lebih tinggi darinya.", "Kami sama tinggi.", "Aku tidak tinggi."], "a": 0, "x": "A 没有 B 高 = B lebih tinggi."}, {"k": "9-1.4", "t": "pg", "q": "Pertanyaan yang benar: \"Apakah adikmu setinggi kamu?\"", "o": ["你弟弟有你高吗？", "你弟弟没有你高吗吗？", "你弟弟有你很高吗？", "你弟弟是你高吗？"], "a": 0, "x": "Bentuk tanya: A 有 B + KS + 吗？"}, {"k": "9-1.5", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["坐公交车没有打车快。", "北京没有这儿那么热。", "我没有他高一点儿。", "这个没有那个好。"], "a": 2, "x": "一点儿 tidak dipakai dalam pola 没有."}, {"k": "9-1.6", "t": "pg", "q": "A: 你儿子几岁了？ B: 四岁，没有你女儿___。", "o": ["大", "很大", "大一点儿", "大多了"], "a": 0, "x": "Pola 没有 + KS saja."}, {"k": "9-1.7", "t": "pg", "q": "Kalimat yang maknanya sama dengan \"今天比昨天冷\":", "o": ["昨天没有今天冷。", "今天没有昨天冷。", "昨天比今天冷。", "今天有昨天冷吗？"], "a": 0, "x": "今天 lebih dingin = 昨天 tidak sedingin 今天."}, {"k": "9-1.8", "t": "su", "w": ["这", "块", "手表", "没有", "那", "块", "好看"], "s": "这块手表没有那块好看。", "alt": [], "p": "Zhè kuài shǒubiǎo méiyǒu nà kuài hǎokàn.", "x": "Jam tangan ini tidak sebagus yang itu."}, {"k": "9-1.9", "t": "su", "w": ["昨天", "没有", "今天", "这么", "冷"], "s": "昨天没有今天这么冷。", "alt": ["没有昨天今天这么冷。"], "p": "Zuótiān méiyǒu jīntiān zhème lěng.", "x": "Kemarin tidak sedingin hari ini."}, {"k": "9-1.10", "t": "su", "w": ["坐", "公交车", "没有", "打车", "快"], "s": "坐公交车没有打车快。", "alt": [], "p": "Zuò gōngjiāochē méiyǒu dǎchē kuài.", "x": "Naik bus tidak secepat naik taksi."}, {"k": "9-1.11", "t": "su", "w": ["妹妹", "有", "姐姐", "高", "吗"], "s": "妹妹有姐姐高吗？", "alt": [], "p": "Mèimei yǒu jiějie gāo ma?", "x": "Apakah adik perempuan setinggi kakaknya?"}, {"k": "9-1.12", "t": "su", "w": ["我", "的", "汉语", "没有", "他", "的", "好"], "s": "我的汉语没有他的好。", "alt": [], "p": "Wǒ de Hànyǔ méiyǒu tā de hǎo.", "x": "Bahasa Mandarinku tidak sebagus punyanya."}, {"k": "9-1.13", "t": "su", "w": ["儿子", "的", "个子", "没有", "他", "那么", "高"], "s": "儿子的个子没有他那么高。", "alt": [], "p": "Érzi de gèzi méiyǒu tā nàme gāo.", "x": "Tinggi anak kita tidak setinggi dia."}, {"k": "9-1.14", "t": "bs", "s": "我不有我哥哥高。", "sp": "Wǒ bù yǒu wǒ gēge gāo.", "n": "", "ok": false, "b": "我没有我哥哥高。", "bp": "Wǒ méiyǒu wǒ gēge gāo.", "x": "Ingkar 有 adalah 没有."}, {"k": "9-1.15", "t": "bs", "s": "这件衣服没有那件好看。", "sp": "Zhè jiàn yīfu méiyǒu nà jiàn hǎokàn.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: A 没有 B + KS."}, {"k": "9-1.16", "t": "bs", "s": "今天没有昨天非常热。", "sp": "Jīntiān méiyǒu zuótiān fēicháng rè.", "n": "", "ok": false, "b": "今天没有昨天热。", "bp": "Jīntiān méiyǒu zuótiān rè.", "x": "Jangan pakai 非常 dalam pola 没有."}, {"k": "9-1.17", "t": "bs", "s": "那家店的咖啡有这家好喝吗？", "sp": "Nà jiā diàn de kāfēi yǒu zhè jiā hǎo hē ma?", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: bentuk tanya dengan 有."}, {"k": "9-1.18", "t": "bs", "s": "我没有他跑得快。", "sp": "Wǒ méiyǒu tā pǎo de kuài.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: pelengkap keadaan juga boleh setelah 没有 B."}]}, {"id": "9-2", "pel": 9, "judul": "Kata kerja 离: A 离 B + jarak/waktu", "kode": "动词\"离\"", "rumus": ["A + 离 + B + 远/近/不远", "A + 离 + B + 有 + jarak/waktu", "现在 + 离 + peristiwa + 还有 + waktu"], "jelas": ["离 (lí) menyatakan jarak antara dua titik, baik jarak tempat maupun jarak waktu. Artinya kira-kira \"berjarak dari\": 学校离医院不远 = sekolah tidak jauh dari rumah sakit.", "Susunannya: A + 离 + B + keterangan jarak. Keterangan jarak biasanya kata sifat 远 (jauh) / 近 (dekat), diberi 很, 不, 有点儿, 不太: 咖啡店离这儿有点儿远. Bisa juga 有 + jarak/waktu: 我家离公司有两站.", "Untuk jarak waktu: 现在离我的生日还有三天 = sekarang (sampai) ulang tahunku masih tiga hari lagi. Pola ini sangat berguna: 离考试还有一个星期, 离下班还有一个小时.", "Bertanya: A 离 B 远吗？ / A 离 B 远不远？ / A 离 B 有多远？ Untuk waktu: 现在离……还有多长时间？", "Jebakan pelajar Indonesia: kata \"dari\" diterjemahkan dengan 从. 从 dipakai untuk titik awal gerakan (从家去学校 = dari rumah ke sekolah), sedangkan untuk JARAK harus 离. 我家从学校很近 salah; yang benar 我家离学校很近.", "Jebakan kedua: urutan. Dalam bahasa Indonesia \"Rumahku dekat dari sekolah\" kata sifat di tengah; dalam Mandarin kata sifat selalu di akhir: 我家离学校很近. Kata keterangan (很, 不, 有点儿) juga di depan kata sifat, bukan di depan 离."], "poin": ["A 离 B + 远/近: jarak tempat.", "Sekarang 离 peristiwa + 还有 + waktu: jarak waktu.", "Jarak = 离, titik awal gerakan = 从.", "很/不/有点儿 di depan 远/近, di akhir kalimat."], "contoh": [{"zh": "咖啡店离这儿有点儿远。", "py": "Kāfēi diàn lí zhèr yǒudiǎnr yuǎn.", "id": "Kedai kopi agak jauh dari sini.", "b": true, "tr": "09-3"}, {"zh": "学校离医院不远。", "py": "Xuéxiào lí yīyuàn bù yuǎn.", "id": "Sekolah tidak jauh dari rumah sakit.", "b": true, "tr": null}, {"zh": "现在离我的生日还有三天。", "py": "Xiànzài lí wǒ de shēngrì hái yǒu sān tiān.", "id": "Sekarang sampai ulang tahunku masih tiga hari lagi.", "b": true, "tr": null}, {"zh": "这里离家很近，还是走路吧。", "py": "Zhèlǐ lí jiā hěn jìn, háishi zǒulù ba.", "id": "Di sini dekat dari rumah, lebih baik jalan kaki saja.", "b": true, "tr": "09-5"}, {"zh": "我家离学校很近。", "py": "Wǒ jiā lí xuéxiào hěn jìn.", "id": "Rumahku dekat dari sekolah.", "b": true, "tr": null}, {"zh": "你住的房子离学校也不远。", "py": "Nǐ zhù de fángzi lí xuéxiào yě bù yuǎn.", "id": "Rumah yang kamu tinggali juga tidak jauh dari sekolah.", "b": true, "tr": null}, {"zh": "咖啡店离这儿远不远？", "py": "Kāfēi diàn lí zhèr yuǎn bu yuǎn?", "id": "Kedai kopi jauh tidak dari sini?", "b": true, "tr": null}, {"zh": "公司离我家有两站。", "py": "Gōngsī lí wǒ jiā yǒu liǎng zhàn.", "id": "Kantor berjarak dua halte dari rumahku.", "b": false, "tr": null}, {"zh": "火车站离这儿远吗？——不太远，走路十分钟。", "py": "Huǒchē zhàn lí zhèr yuǎn ma? — Bú tài yuǎn, zǒulù shí fēnzhōng.", "id": "Stasiun kereta jauh dari sini? — Tidak terlalu, jalan kaki sepuluh menit.", "b": false, "tr": null}, {"zh": "现在离下班还有一个小时。", "py": "Xiànzài lí xiàbān hái yǒu yí gè xiǎoshí.", "id": "Sekarang masih satu jam lagi sampai pulang kerja.", "b": false, "tr": null}, {"zh": "离考试还有一个星期，我们要好好准备。", "py": "Lí kǎoshì hái yǒu yí gè xīngqī, wǒmen yào hǎo hǎo zhǔnbèi.", "id": "Ujian tinggal satu minggu lagi, kita harus bersiap baik-baik.", "b": false, "tr": null}, {"zh": "我们住的酒店离商场很近。", "py": "Wǒmen zhù de jiǔdiàn lí shāngchǎng hěn jìn.", "id": "Hotel tempat kami menginap dekat dengan mal.", "b": false, "tr": null}, {"zh": "北京离上海有点儿远，坐飞机去吧。", "py": "Běijīng lí Shànghǎi yǒudiǎnr yuǎn, zuò fēijī qù ba.", "id": "Beijing agak jauh dari Shanghai, naik pesawat saja.", "b": false, "tr": null}], "salah": [{"s": "我家从学校很近。", "sp": "Wǒ jiā cóng xuéxiào hěn jìn.", "n": "", "b": "我家离学校很近。", "bp": "Wǒ jiā lí xuéxiào hěn jìn.", "a": "Untuk jarak pakai 离, bukan 从."}, {"s": "我家很近离学校。", "sp": "Wǒ jiā hěn jìn lí xuéxiào.", "n": "", "b": "我家离学校很近。", "bp": "Wǒ jiā lí xuéxiào hěn jìn.", "a": "Kata sifat jarak (近) di akhir kalimat."}, {"s": "我家离学校是很远。", "sp": "Wǒ jiā lí xuéxiào shì hěn yuǎn.", "n": "", "b": "我家离学校很远。", "bp": "Wǒ jiā lí xuéxiào hěn yuǎn.", "a": "Jangan menambah 是 sebelum kata sifat."}, {"s": "现在离考试有三天还。", "sp": "Xiànzài lí kǎoshì yǒu sān tiān hái.", "n": "", "b": "现在离考试还有三天。", "bp": "Xiànzài lí kǎoshì hái yǒu sān tiān.", "a": "还 di depan 有."}], "latihan": [{"k": "9-2.0", "t": "pg", "q": "学校___医院不远。", "o": ["离", "从", "在", "到"], "a": 0, "x": "Jarak dua tempat: 离.", "f": "学校离医院不远。", "fp": "Xuéxiào lí yīyuàn bù yuǎn."}, {"k": "9-2.1", "t": "pg", "q": "现在___我的生日还有三天。", "o": ["离", "从", "在", "给"], "a": 0, "x": "Jarak waktu: 现在离……还有…….", "f": "现在离我的生日还有三天。", "fp": "Xiànzài lí wǒ de shēngrì hái yǒu sān tiān."}, {"k": "9-2.2", "t": "pg", "q": "\"Rumahku sangat dekat dari kantor\" =", "o": ["我家离公司很近。", "我家从公司很近。", "我家很近离公司。", "公司离很近我家。"], "a": 0, "x": "A 离 B + 很近."}, {"k": "9-2.3", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["咖啡店离这儿有点儿远。", "我从家去学校。", "我家从这儿不远。", "现在离下班还有十分钟。"], "a": 2, "x": "Jarak harus 离: 我家离这儿不远."}, {"k": "9-2.4", "t": "pg", "q": "A: 火车站离这儿___？ B: 不远，走路五分钟就到了。", "o": ["远不远", "远不", "是远", "远吧吗"], "a": 0, "x": "Tanya positif-negatif: 远不远."}, {"k": "9-2.5", "t": "pg", "q": "现在离考试___一个星期。", "o": ["还有", "还是", "有还", "是有"], "a": 0, "x": "还有 + waktu: masih ada …", "f": "现在离考试还有一个星期。", "fp": "Xiànzài lí kǎoshì hái yǒu yí gè xīngqī."}, {"k": "9-2.6", "t": "pg", "q": "Mana yang tepat: \"Masih dua hari lagi sampai Tahun Baru\"?", "o": ["现在离新年还有两天。", "现在从新年还有两天。", "新年离现在两天还有。", "现在离新年两天还。"], "a": 0, "x": "现在 + 离 + peristiwa + 还有 + waktu."}, {"k": "9-2.7", "t": "su", "w": ["咖啡店", "离", "这儿", "有点儿", "远"], "s": "咖啡店离这儿有点儿远。", "alt": [], "p": "Kāfēi diàn lí zhèr yǒudiǎnr yuǎn.", "x": "Kedai kopi agak jauh dari sini."}, {"k": "9-2.8", "t": "su", "w": ["学校", "离", "医院", "不", "远"], "s": "学校离医院不远。", "alt": [], "p": "Xuéxiào lí yīyuàn bù yuǎn.", "x": "Sekolah tidak jauh dari rumah sakit."}, {"k": "9-2.9", "t": "su", "w": ["现在", "离", "我", "的", "生日", "还有", "三", "天"], "s": "现在离我的生日还有三天。", "alt": ["离现在我的生日还有三天。"], "p": "Xiànzài lí wǒ de shēngrì hái yǒu sān tiān.", "x": "Sekarang sampai ulang tahunku masih tiga hari lagi."}, {"k": "9-2.10", "t": "su", "w": ["这里", "离", "家", "很", "近，", "还是", "走路", "吧"], "s": "这里离家很近，还是走路吧。", "alt": [], "p": "Zhèlǐ lí jiā hěn jìn, háishi zǒulù ba.", "x": "Di sini dekat dari rumah, lebih baik jalan kaki saja."}, {"k": "9-2.11", "t": "su", "w": ["火车站", "离", "这儿", "远", "吗"], "s": "火车站离这儿远吗？", "alt": [], "p": "Huǒchē zhàn lí zhèr yuǎn ma?", "x": "Stasiun kereta jauh dari sini?"}, {"k": "9-2.12", "t": "su", "w": ["现在", "离", "下班", "还有", "一", "个", "小时"], "s": "现在离下班还有一个小时。", "alt": ["离现在下班还有一个小时。"], "p": "Xiànzài lí xiàbān hái yǒu yí gè xiǎoshí.", "x": "Sekarang masih satu jam lagi sampai pulang kerja."}, {"k": "9-2.13", "t": "bs", "s": "我们的酒店从商场很近。", "sp": "Wǒmen de jiǔdiàn cóng shāngchǎng hěn jìn.", "n": "", "ok": false, "b": "我们的酒店离商场很近。", "bp": "Wǒmen de jiǔdiàn lí shāngchǎng hěn jìn.", "x": "Jarak memakai 离."}, {"k": "9-2.14", "t": "bs", "s": "公司离我家不太远。", "sp": "Gōngsī lí wǒ jiā bú tài yuǎn.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "9-2.15", "t": "bs", "s": "现在离考试还有两天。", "sp": "Xiànzài lí kǎoshì hái yǒu liǎng tiān.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: jarak waktu."}, {"k": "9-2.16", "t": "bs", "s": "医院很远离这儿。", "sp": "Yīyuàn hěn yuǎn lí zhèr.", "n": "", "ok": false, "b": "医院离这儿很远。", "bp": "Yīyuàn lí zhèr hěn yuǎn.", "x": "很远 di akhir kalimat."}, {"k": "9-2.17", "t": "bs", "s": "我每天从家走路去学校。", "sp": "Wǒ měi tiān cóng jiā zǒulù qù xuéxiào.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 从 untuk titik awal gerakan."}]}, {"id": "9-3", "pel": 9, "judul": "Pelengkap lama waktu (1): KK + durasi", "kode": "时量补语（1）", "rumus": ["S + KK + (了) + durasi", "S + KK + 了 + durasi + (的) + objek benda", "S + KK + 了 + kata ganti/nama + durasi", "S + KK + O + KK + 了 + durasi (KK diulang)"], "jelas": ["Lama waktu (十分钟, 一个小时, 两年, 一个下午) diletakkan SETELAH kata kerja untuk menyatakan berapa lama suatu kegiatan berlangsung: 我们休息十分钟 (kami istirahat sepuluh menit), 他们学了两年 (mereka belajar dua tahun).", "Bila ada objek benda, objek ditaruh setelah lama waktu: 他写了半个小时汉字. Bila objeknya kata ganti atau sebutan orang (她, 我, 陈天中), objek ditaruh SEBELUM lama waktu: 李文等了她一个小时.", "Cara lain yang sangat umum: ulangi kata kerjanya. S + KK + O + KK + 了 + durasi: 他们学中文学了两年, 李文等她等了一个小时.", "Kata kerja pisah (离合词) seperti 游泳, 跑步, 睡觉, 上课 harus diulang bagian kata kerjanya: 安妮游泳游了一个下午, 陈天中跑步跑了两个小时. Tidak boleh 游泳了一个下午.", "Dua 了: KK + 了 + durasi + 了 di akhir kalimat berarti kegiatan itu SUDAH berlangsung selama itu dan MASIH berlanjut. 他写了半个小时汉字了 = dia sudah menulis hanzi setengah jam (dan masih menulis). Tanpa 了 akhir: kegiatan sudah selesai.", "Jebakan pelajar Indonesia: lama waktu diletakkan di depan kata kerja seperti keterangan waktu (我两个小时学习 salah). Ingat: titik waktu (三点, 明天) di depan kata kerja; LAMA waktu (三个小时) di belakang kata kerja. Bertanya: ……了多长时间？ / ……了多久？"], "poin": ["Lama waktu selalu setelah kata kerja.", "Objek benda setelah durasi; kata ganti/nama sebelum durasi.", "Bisa ulang KK: 学中文学了两年.", "Kata kerja pisah wajib diulang: 跑步跑了…….", "KK了 + durasi + 了 = masih berlangsung."], "contoh": [{"zh": "走半个多小时就到了。", "py": "Zǒu bàn gè duō xiǎoshí jiù dào le.", "id": "Jalan kaki setengah jam lebih sudah sampai.", "b": true, "tr": "09-5"}, {"zh": "他们学了两年。", "py": "Tāmen xué le liǎng nián.", "id": "Mereka belajar dua tahun.", "b": true, "tr": null}, {"zh": "我们休息十分钟。", "py": "Wǒmen xiūxi shí fēnzhōng.", "id": "Kita istirahat sepuluh menit.", "b": true, "tr": null}, {"zh": "我看了一个晚上电视。", "py": "Wǒ kàn le yí gè wǎnshang diànshì.", "id": "Saya menonton televisi semalaman.", "b": false, "tr": null}, {"zh": "李文等了她一个小时。", "py": "Lǐ Wén děng le tā yí gè xiǎoshí.", "id": "Li Wen menunggunya satu jam.", "b": true, "tr": null}, {"zh": "我等了陈天中二十多分钟。", "py": "Wǒ děng le Chén Tiānzhōng èrshí duō fēnzhōng.", "id": "Saya menunggu Chen Tianzhong dua puluh menit lebih.", "b": false, "tr": null}, {"zh": "他们学中文学了两年。", "py": "Tāmen xué Zhōngwén xué le liǎng nián.", "id": "Mereka belajar bahasa Mandarin selama dua tahun.", "b": true, "tr": null}, {"zh": "李文等她等了一个小时。", "py": "Lǐ Wén děng tā děng le yí gè xiǎoshí.", "id": "Li Wen menunggunya selama satu jam.", "b": true, "tr": null}, {"zh": "安妮游泳游了一个下午。", "py": "Ānnī yóuyǒng yóu le yí gè xiàwǔ.", "id": "Annie berenang sepanjang sore.", "b": true, "tr": null}, {"zh": "陈天中跑步跑了两个小时。", "py": "Chén Tiānzhōng pǎobù pǎo le liǎng gè xiǎoshí.", "id": "Chen Tianzhong berlari selama dua jam.", "b": true, "tr": null}, {"zh": "他写了半个小时汉字了。", "py": "Tā xiě le bàn gè xiǎoshí Hànzì le.", "id": "Dia sudah menulis hanzi setengah jam (masih menulis).", "b": true, "tr": null}, {"zh": "陈天中跑步跑了两个小时了。", "py": "Chén Tiānzhōng pǎobù pǎo le liǎng gè xiǎoshí le.", "id": "Chen Tianzhong sudah berlari dua jam (masih berlari).", "b": true, "tr": null}, {"zh": "要走多长时间？", "py": "Yào zǒu duō cháng shíjiān?", "id": "Harus jalan berapa lama?", "b": true, "tr": "09-5"}, {"zh": "我每天睡七个小时。", "py": "Wǒ měi tiān shuì qī gè xiǎoshí.", "id": "Setiap hari saya tidur tujuh jam.", "b": false, "tr": null}, {"zh": "你学汉语学了多长时间？——学了一年。", "py": "Nǐ xué Hànyǔ xué le duō cháng shíjiān? — Xué le yì nián.", "id": "Kamu sudah belajar bahasa Mandarin berapa lama? — Satu tahun.", "b": false, "tr": null}, {"zh": "请等我一会儿。", "py": "Qǐng děng wǒ yíhuìr.", "id": "Tolong tunggu saya sebentar.", "b": false, "tr": null}], "salah": [{"s": "我两个小时学习了。", "sp": "Wǒ liǎng gè xiǎoshí xuéxí le.", "n": "", "b": "我学习了两个小时。", "bp": "Wǒ xuéxí le liǎng gè xiǎoshí.", "a": "Lama waktu harus setelah kata kerja."}, {"s": "他学了汉语两年。", "sp": "Tā xué le Hànyǔ liǎng nián.", "n": "", "b": "他学了两年汉语。 / 他学汉语学了两年。", "bp": "Tā xué le liǎng nián Hànyǔ. / Tā xué Hànyǔ xué le liǎng nián.", "a": "Objek benda diletakkan setelah durasi, atau ulangi kata kerja."}, {"s": "李文等了一个小时她。", "sp": "Lǐ Wén děng le yí gè xiǎoshí tā.", "n": "", "b": "李文等了她一个小时。", "bp": "Lǐ Wén děng le tā yí gè xiǎoshí.", "a": "Kata ganti diletakkan sebelum durasi."}, {"s": "安妮游泳了一个下午。", "sp": "Ānnī yóuyǒng le yí gè xiàwǔ.", "n": "", "b": "安妮游泳游了一个下午。", "bp": "Ānnī yóuyǒng yóu le yí gè xiàwǔ.", "a": "Kata kerja pisah 游泳 harus diulang: 游泳游了……."}], "latihan": [{"k": "9-3.0", "t": "pg", "q": "我们休息___。", "o": ["十分钟", "十点", "十分钟的时候", "在十分钟"], "a": 0, "x": "Lama waktu (十分钟) setelah kata kerja.", "f": "我们休息十分钟。", "fp": "Wǒmen xiūxi shí fēnzhōng."}, {"k": "9-3.1", "t": "pg", "q": "\"Dia menunggu saya satu jam\" =", "o": ["他等了我一个小时。", "他等了一个小时我。", "他一个小时等了我。", "他等我了一个小时。"], "a": 0, "x": "Kata ganti (我) sebelum durasi."}, {"k": "9-3.2", "t": "pg", "q": "\"Dia belajar bahasa Mandarin dua tahun\" yang benar …", "o": ["他学了两年汉语。", "他学了汉语两年。", "他两年学了汉语。", "他汉语两年学了。"], "a": 0, "x": "Objek benda setelah durasi."}, {"k": "9-3.3", "t": "pg", "q": "陈天中跑步___了两个小时。", "o": ["跑", "走", "是", "有"], "a": 0, "x": "Kata kerja pisah diulang: 跑步跑了…….", "f": "陈天中跑步跑了两个小时。", "fp": "Chén Tiānzhōng pǎobù pǎo le liǎng gè xiǎoshí."}, {"k": "9-3.4", "t": "pg", "q": "\"他写了半个小时汉字了\" berarti …", "o": ["Dia sudah menulis setengah jam dan masih menulis.", "Dia selesai menulis setengah jam lalu.", "Dia akan menulis setengah jam.", "Dia menulis jam setengah."], "a": 0, "x": "了…了: kegiatan masih berlangsung."}, {"k": "9-3.5", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["我每天睡七个小时。", "安妮游泳游了一个下午。", "我等了他二十分钟。", "我们一个小时休息了。"], "a": 3, "x": "Durasi harus setelah kata kerja: 我们休息了一个小时."}, {"k": "9-3.6", "t": "pg", "q": "A: 你学汉语学了多长时间？ B: ___", "o": ["学了一年。", "一年学了。", "学一年了吗。", "一年了学。"], "a": 0, "x": "Jawab dengan KK + 了 + durasi."}, {"k": "9-3.7", "t": "pg", "q": "Mana yang tepat untuk \"Saya menunggu Chen Tianzhong dua puluh menit\"?", "o": ["我等了陈天中二十分钟。", "我等了二十分钟陈天中。", "我二十分钟等了陈天中。", "我陈天中等了二十分钟。"], "a": 0, "x": "Nama orang sebelum durasi."}, {"k": "9-3.8", "t": "su", "w": ["我们", "休息", "十", "分钟"], "s": "我们休息十分钟。", "alt": [], "p": "Wǒmen xiūxi shí fēnzhōng.", "x": "Kita istirahat sepuluh menit."}, {"k": "9-3.9", "t": "su", "w": ["李文", "等", "了", "她", "一", "个", "小时"], "s": "李文等了她一个小时。", "alt": [], "p": "Lǐ Wén děng le tā yí gè xiǎoshí.", "x": "Li Wen menunggunya satu jam."}, {"k": "9-3.10", "t": "su", "w": ["他们", "学", "中文", "学", "了", "两", "年"], "s": "他们学中文学了两年。", "alt": [], "p": "Tāmen xué Zhōngwén xué le liǎng nián.", "x": "Mereka belajar bahasa Mandarin selama dua tahun."}, {"k": "9-3.11", "t": "su", "w": ["安妮", "游泳", "游", "了", "一", "个", "下午"], "s": "安妮游泳游了一个下午。", "alt": [], "p": "Ānnī yóuyǒng yóu le yí gè xiàwǔ.", "x": "Annie berenang sepanjang sore."}, {"k": "9-3.12", "t": "su", "w": ["我", "每天", "睡", "七", "个", "小时"], "s": "我每天睡七个小时。", "alt": [], "p": "Wǒ měi tiān shuì qī gè xiǎoshí.", "x": "Setiap hari saya tidur tujuh jam."}, {"k": "9-3.13", "t": "su", "w": ["他", "写", "了", "半", "个", "小时", "汉字", "了"], "s": "他写了半个小时汉字了。", "alt": [], "p": "Tā xiě le bàn gè xiǎoshí Hànzì le.", "x": "Dia sudah menulis hanzi setengah jam (masih menulis)."}, {"k": "9-3.14", "t": "su", "w": ["你", "学", "了", "多", "长", "时间"], "s": "你学了多长时间？", "alt": [], "p": "Nǐ xué le duō cháng shíjiān?", "x": "Kamu sudah belajar berapa lama?"}, {"k": "9-3.15", "t": "bs", "s": "他跑步了一个小时。", "sp": "Tā pǎobù le yí gè xiǎoshí.", "n": "", "ok": false, "b": "他跑步跑了一个小时。", "bp": "Tā pǎobù pǎo le yí gè xiǎoshí.", "x": "跑步 kata kerja pisah, ulangi 跑."}, {"k": "9-3.16", "t": "bs", "s": "我们走了半个多小时就到了。", "sp": "Wǒmen zǒu le bàn gè duō xiǎoshí jiù dào le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "9-3.17", "t": "bs", "s": "我看了电视两个小时。", "sp": "Wǒ kàn le diànshì liǎng gè xiǎoshí.", "n": "", "ok": false, "b": "我看了两个小时电视。", "bp": "Wǒ kàn le liǎng gè xiǎoshí diànshì.", "x": "Objek benda setelah durasi."}, {"k": "9-3.18", "t": "bs", "s": "李文等她等了一个小时。", "sp": "Lǐ Wén děng tā děng le yí gè xiǎoshí.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: kata kerja diulang."}, {"k": "9-3.19", "t": "bs", "s": "我三个小时学习汉语。", "sp": "Wǒ sān gè xiǎoshí xuéxí Hànyǔ.", "n": "", "ok": false, "b": "我学习了三个小时汉语。", "bp": "Wǒ xuéxí le sān gè xiǎoshí Hànyǔ.", "x": "Lama waktu tidak di depan kata kerja."}]}, {"id": "10-1", "pel": 10, "judul": "Kalimat berpredikat klausa (S + S kecil + predikat)", "kode": "主谓谓语句", "rumus": ["Subjek besar + [subjek kecil + predikat]", "弟弟 + 手很小", "Objek/topik + subjek + KK (这件事他知道)"], "jelas": ["Dalam kalimat ini predikatnya sendiri berupa \"subjek + predikat\" kecil yang menjelaskan subjek besar. 弟弟手很小 = adik (subjek besar) + tangannya kecil (subjek kecil 手 + predikat 很小).", "Biasanya subjek kecil adalah bagian dari subjek besar atau berhubungan dengannya: 他学习很好 (dia, belajarnya bagus), 王老师工作很忙 (Guru Wang, pekerjaannya sibuk), 我头疼 (aku, kepalaku sakit).", "Jenis kedua: hal yang dibicarakan (topik) ditaruh di depan, lalu pelaku dan kata kerjanya: 这件事他知道 (hal ini, dia tahu), 我的书包你看见了吗？ (tas sekolahku, kamu lihat?). Topik di depan memberi penekanan.", "Pola ini sangat mirip bahasa Indonesia lisan: \"Adik tangannya kecil\", \"Dia belajarnya bagus\". Bedanya, dalam Mandarin tidak ada \"-nya\"; cukup jajarkan saja: 弟弟手很小. Tidak perlu 的 dan tidak perlu 是.", "Ingkar dan tanya diletakkan pada predikat kecil: 他身体不好, 你身体好吗？, 刘明工作忙不忙？ Jangan taruh 不 di depan subjek kecil (他不身体好 salah).", "Kata sifat dalam predikat kecil biasanya memakai 很 (atau kata keterangan lain) seperti kalimat kata sifat biasa: 他个子很高, 这里人很多."], "poin": ["Subjek besar + subjek kecil + predikat.", "Subjek kecil = bagian/aspek dari subjek besar.", "Topik bisa di depan: 这件事他知道.", "Tanpa 是 dan tanpa \"-nya\".", "Ingkar/tanya pada predikat kecil."], "contoh": [{"zh": "我的书包你看见了吗？", "py": "Wǒ de shūbāo nǐ kànjiàn le ma?", "id": "Tas sekolahku, kamu lihat?", "b": true, "tr": "10-1"}, {"zh": "弟弟手很小。", "py": "Dìdi shǒu hěn xiǎo.", "id": "Tangan adik kecil.", "b": true, "tr": null}, {"zh": "这件事他知道。", "py": "Zhè jiàn shì tā zhīdào.", "id": "Hal ini dia tahu.", "b": true, "tr": null}, {"zh": "他学习很好。", "py": "Tā xuéxí hěn hǎo.", "id": "Dia belajarnya bagus.", "b": true, "tr": null}, {"zh": "我头疼，不太舒服。", "py": "Wǒ tóu téng, bú tài shūfu.", "id": "Kepalaku sakit, kurang enak badan.", "b": true, "tr": "11-1"}, {"zh": "你这几天经常头疼。", "py": "Nǐ zhè jǐ tiān jīngcháng tóu téng.", "id": "Beberapa hari ini kamu sering sakit kepala.", "b": true, "tr": "11-1"}, {"zh": "现在路上车多。", "py": "Xiànzài lùshang chē duō.", "id": "Sekarang di jalan mobilnya banyak.", "b": true, "tr": "11-3"}, {"zh": "他们人很好。", "py": "Tāmen rén hěn hǎo.", "id": "Mereka orangnya baik sekali.", "b": true, "tr": "14-5"}, {"zh": "刘明工作忙吗？", "py": "Liú Míng gōngzuò máng ma?", "id": "Liu Ming pekerjaannya sibuk?", "b": true, "tr": null}, {"zh": "这个电影我看过。", "py": "Zhège diànyǐng wǒ kàn guò.", "id": "Film ini sudah pernah saya tonton.", "b": false, "tr": null}, {"zh": "王老师身体很好。", "py": "Wáng lǎoshī shēntǐ hěn hǎo.", "id": "Guru Wang badannya sehat.", "b": false, "tr": null}, {"zh": "这家饭馆菜很好吃。", "py": "Zhè jiā fànguǎn cài hěn hǎochī.", "id": "Restoran ini makanannya enak.", "b": false, "tr": null}, {"zh": "我妹妹个子不高。", "py": "Wǒ mèimei gèzi bù gāo.", "id": "Adik perempuanku badannya tidak tinggi.", "b": false, "tr": null}, {"zh": "北京冬天很冷。", "py": "Běijīng dōngtiān hěn lěng.", "id": "Beijing musim dinginnya sangat dingin.", "b": false, "tr": null}, {"zh": "这件衣服颜色很漂亮。", "py": "Zhè jiàn yīfu yánsè hěn piàoliang.", "id": "Baju ini warnanya cantik.", "b": false, "tr": null}], "salah": [{"s": "弟弟是手很小。", "sp": "Dìdi shì shǒu hěn xiǎo.", "n": "", "b": "弟弟手很小。", "bp": "Dìdi shǒu hěn xiǎo.", "a": "Tidak perlu 是."}, {"s": "他不学习好。", "sp": "Tā bù xuéxí hǎo.", "n": "", "b": "他学习不好。", "bp": "Tā xuéxí bù hǎo.", "a": "不 masuk ke predikat kecil, sebelum 好."}, {"s": "我疼头。", "sp": "Wǒ téng tóu.", "n": "", "b": "我头疼。", "bp": "Wǒ tóu téng.", "a": "Subjek kecil (头) di depan predikat (疼)."}], "latihan": [{"k": "10-1.0", "t": "pg", "q": "弟弟___很小。", "o": ["手", "是手", "手是", "的是"], "a": 0, "x": "Subjek kecil langsung diikuti predikat.", "f": "弟弟手很小。", "fp": "Dìdi shǒu hěn xiǎo."}, {"k": "10-1.1", "t": "pg", "q": "\"Dia belajarnya kurang bagus\" =", "o": ["他学习不太好。", "他不太学习好。", "他是学习不好。", "不他学习好。"], "a": 0, "x": "不太 di predikat kecil."}, {"k": "10-1.2", "t": "pg", "q": "\"Kepalaku sakit\" =", "o": ["我头疼。", "我疼头。", "头我疼。", "我是头疼的。"], "a": 0, "x": "Subjek + subjek kecil + predikat."}, {"k": "10-1.3", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["这件事他知道。", "王老师工作很忙。", "这里人很多。", "他是身体很好。"], "a": 3, "x": "Tidak memakai 是: 他身体很好."}, {"k": "10-1.4", "t": "pg", "q": "A: 陈天中学习怎么样？ B: ___", "o": ["他学习很好。", "他很学习好。", "他是学习好。", "好他学习。"], "a": 0, "x": "Subjek + 学习 + 很好."}, {"k": "10-1.5", "t": "pg", "q": "Pertanyaan yang benar: \"Liu Ming pekerjaannya sibuk tidak?\"", "o": ["刘明工作忙不忙？", "刘明忙不忙工作？", "刘明不忙工作吗？", "工作刘明忙不吗？"], "a": 0, "x": "Tanya pada predikat kecil: 忙不忙."}, {"k": "10-1.6", "t": "pg", "q": "这个电影，___很好看。", "o": ["我觉得", "我是", "是我", "的我"], "a": 0, "x": "Topik di depan, lalu S + KK: 我觉得很好看.", "f": "这个电影，我觉得很好看。", "fp": "Zhège diànyǐng, wǒ juéde hěn hǎokàn."}, {"k": "10-1.7", "t": "su", "w": ["弟弟", "手", "很", "小"], "s": "弟弟手很小。", "alt": [], "p": "Dìdi shǒu hěn xiǎo.", "x": "Tangan adik kecil."}, {"k": "10-1.8", "t": "su", "w": ["这", "件", "事", "他", "知道"], "s": "这件事他知道。", "alt": [], "p": "Zhè jiàn shì tā zhīdào.", "x": "Hal ini dia tahu."}, {"k": "10-1.9", "t": "su", "w": ["我", "的", "书包", "你", "看见", "了", "吗"], "s": "我的书包你看见了吗？", "alt": [], "p": "Wǒ de shūbāo nǐ kànjiàn le ma?", "x": "Tas sekolahku, kamu lihat?"}, {"k": "10-1.10", "t": "su", "w": ["王", "老师", "工作", "很", "忙"], "s": "王老师工作很忙。", "alt": [], "p": "Wáng lǎoshī gōngzuò hěn máng.", "x": "Guru Wang pekerjaannya sibuk."}, {"k": "10-1.11", "t": "su", "w": ["现在", "路上", "车", "很", "多"], "s": "现在路上车很多。", "alt": ["路上现在车很多。"], "p": "Xiànzài lùshang chē hěn duō.", "x": "Sekarang di jalan mobilnya banyak."}, {"k": "10-1.12", "t": "su", "w": ["我", "妹妹", "个子", "不", "高"], "s": "我妹妹个子不高。", "alt": [], "p": "Wǒ mèimei gèzi bù gāo.", "x": "Adik perempuanku badannya tidak tinggi."}, {"k": "10-1.13", "t": "bs", "s": "他身体很好。", "sp": "Tā shēntǐ hěn hǎo.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "10-1.14", "t": "bs", "s": "我们老师是工作很忙。", "sp": "Wǒmen lǎoshī shì gōngzuò hěn máng.", "n": "", "ok": false, "b": "我们老师工作很忙。", "bp": "Wǒmen lǎoshī gōngzuò hěn máng.", "x": "Jangan tambah 是."}, {"k": "10-1.15", "t": "bs", "s": "这家饭馆菜很好吃。", "sp": "Zhè jiā fànguǎn cài hěn hǎochī.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "10-1.16", "t": "bs", "s": "他不个子高。", "sp": "Tā bú gèzi gāo.", "n": "", "ok": false, "b": "他个子不高。", "bp": "Tā gèzi bù gāo.", "x": "不 di depan predikat kecil (高)."}, {"k": "10-1.17", "t": "bs", "s": "这件事我不知道。", "sp": "Zhè jiàn shì wǒ bù zhīdào.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: topik di depan."}]}, {"id": "10-2", "pel": 10, "judul": "Pertanyaan pilihan: (是) A 还是 B？", "kode": "选择问句", "rumus": ["(是) A 还是 B？", "S + KK + A + 还是 + B？", "S + KK + A + 还是 + KK + B？"], "jelas": ["还是 (háishi) di kalimat tanya berarti \"atau\", memberi pilihan kepada pendengar: 你喝咖啡还是茶？ (Kamu minum kopi atau teh?). Pendengar menjawab dengan memilih salah satu.", "Pilihan bisa berupa kata benda, kata kerja, waktu, atau seluruh klausa: 今天还是明天？, 是您准备考试还是我准备考试？ 是 di depan pilihan pertama boleh dipakai atau tidak.", "Bisa juga lebih dari dua pilihan: 你更喜欢打篮球、踢足球还是游泳？ Pilihan-pilihan awal dipisah tanda 、 dan 还是 ditaruh sebelum pilihan terakhir.", "PENTING: pertanyaan 还是 sudah merupakan pertanyaan, jadi TIDAK memakai 吗 di akhir. 你喝茶还是咖啡吗？ salah. Boleh memakai 呢 untuk melunakkan: 你去还是他去呢？", "Jebakan pelajar Indonesia: kata \"atau\" dalam bahasa Indonesia dipakai di kalimat tanya maupun berita. Dalam Mandarin, 还是 untuk \"atau\" di kalimat TANYA. Untuk kalimat berita (\"Saya minum teh atau kopi, terserah\") dipakai 或者 (dipelajari di HSK 3).", "Jika kata kerja utamanya 是, cukup satu 是: 你是老师还是学生？ (bukan 你是是老师还是是学生). 还是 juga punya arti lain \"lebih baik … saja\" (还是走路吧) yang sudah muncul di pelajaran 9; bedakan dari konteks."], "poin": ["(是) A 还是 B？ = A atau B?", "Tanpa 吗 di akhir.", "Tiga pilihan: A、B 还是 C？", "还是 = \"atau\" di kalimat tanya saja."], "contoh": [{"zh": "妈妈，是您准备考试还是我准备考试？", "py": "Māma, shì nín zhǔnbèi kǎoshì háishi wǒ zhǔnbèi kǎoshì?", "id": "Ma, yang mau ujian itu Mama atau aku?", "b": true, "tr": "10-3"}, {"zh": "你更喜欢打篮球、踢足球还是游泳？", "py": "Nǐ gèng xǐhuan dǎ lánqiú, tī zúqiú háishi yóuyǒng?", "id": "Kamu lebih suka main basket, sepak bola, atau berenang?", "b": true, "tr": null}, {"zh": "我们什么时候去看电影？今天还是明天？", "py": "Wǒmen shénme shíhou qù kàn diànyǐng? Jīntiān háishi míngtiān?", "id": "Kapan kita nonton film? Hari ini atau besok?", "b": true, "tr": null}, {"zh": "你喝咖啡还是茶？", "py": "Nǐ hē kāfēi háishi chá?", "id": "Kamu minum kopi atau teh?", "b": true, "tr": null}, {"zh": "是我和弟弟上学还是你们上学？", "py": "Shì wǒ hé dìdi shàngxué háishi nǐmen shàngxué?", "id": "Yang sekolah itu aku dan adik, atau kalian?", "b": true, "tr": "10-7"}, {"zh": "左边这块手表好看还是右边那块好看？", "py": "Zuǒbian zhè kuài shǒubiǎo hǎokàn háishi yòubian nà kuài hǎokàn?", "id": "Jam tangan kiri ini yang bagus atau yang kanan itu?", "b": true, "tr": null}, {"zh": "你吃饺子还是包子？", "py": "Nǐ chī jiǎozi háishi bāozi?", "id": "Kamu makan jiaozi atau bakpao?", "b": false, "tr": null}, {"zh": "我们坐公交车去还是打车去？", "py": "Wǒmen zuò gōngjiāochē qù háishi dǎchē qù?", "id": "Kita naik bus atau naik taksi?", "b": false, "tr": null}, {"zh": "你是老师还是学生？", "py": "Nǐ shì lǎoshī háishi xuéshēng?", "id": "Kamu guru atau murid?", "b": false, "tr": null}, {"zh": "你买白色的还是黑色的？", "py": "Nǐ mǎi báisè de háishi hēisè de?", "id": "Kamu beli yang putih atau yang hitam?", "b": false, "tr": null}, {"zh": "你想在家看电视还是去看电影？", "py": "Nǐ xiǎng zài jiā kàn diànshì háishi qù kàn diànyǐng?", "id": "Kamu mau nonton TV di rumah atau pergi nonton film?", "b": false, "tr": null}, {"zh": "他是中国人还是日本人？", "py": "Tā shì Zhōngguó rén háishi Rìběn rén?", "id": "Dia orang Tiongkok atau orang Jepang?", "b": false, "tr": null}], "salah": [{"s": "你喝茶还是咖啡吗？", "sp": "Nǐ hē chá háishi kāfēi ma?", "n": "", "b": "你喝茶还是咖啡？", "bp": "Nǐ hē chá háishi kāfēi?", "a": "Pertanyaan 还是 tidak memakai 吗."}, {"s": "你是是老师还是是学生？", "sp": "Nǐ shì shì lǎoshī háishi shì xuéshēng?", "n": "", "b": "你是老师还是学生？", "bp": "Nǐ shì lǎoshī háishi xuéshēng?", "a": "Cukup satu 是."}, {"s": "你喝茶或者咖啡？", "sp": "Nǐ hē chá huòzhě kāfēi?", "n": "bertanya", "b": "你喝茶还是咖啡？", "bp": "Nǐ hē chá háishi kāfēi?", "a": "Untuk bertanya pakai 还是."}], "latihan": [{"k": "10-2.0", "t": "pg", "q": "你喝咖啡___茶？", "o": ["还是", "和", "也", "都"], "a": 0, "x": "Pilihan dalam pertanyaan: 还是.", "f": "你喝咖啡还是茶？", "fp": "Nǐ hē kāfēi háishi chá?"}, {"k": "10-2.1", "t": "pg", "q": "你是老师还是学生___", "o": ["？", "吗？", "吧吗？", "呢吗？"], "a": 0, "x": "Pertanyaan 还是 tanpa 吗."}, {"k": "10-2.2", "t": "pg", "q": "\"Kita pergi hari ini atau besok?\" =", "o": ["我们今天去还是明天去？", "我们今天去还是明天去吗？", "我们今天去和明天去？", "我们今天还是去明天吗？"], "a": 0, "x":
