<html lang="id"><head><meta charset="utf-8">

<title>Grammar HSK 2</title>
<style>:root{--bg:#faf7f2;--card:#fff;--ink:#1f1b16;--mut:#6b6258;--line:#e6dfd4;--acc:#b8322a;--acc2:#f6e3e0;--ok:#1e7a46;--okb:#e2f3e8;--bad:#b3261e;--badb:#fbe5e3;--box:#f3efe7;--zh:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#211e1b;--ink:#ece6dd;--mut:#a39a8f;--line:#38322c;--acc:#e0675d;--acc2:#3a2321;--ok:#5cc58a;--okb:#1c3326;--bad:#f08178;--badb:#3d2220;--box:#2a2622}}
:root[data-theme="dark"]{--bg:#171513;--card:#211e1b;--ink:#ece6dd;--mut:#a39a8f;--line:#38322c;--acc:#e0675d;--acc2:#3a2321;--ok:#5cc58a;--okb:#1c3326;--bad:#f08178;--badb:#3d2220;--box:#2a2622}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--acc);color:#fff}
.top h1{flex:1;margin:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:rgba(255,255,255,.18);border:0;border-radius:8px;width:36px;height:34px;font-size:22px;line-height:1;color:#fff}
.tg{display:flex;gap:6px}
.tg button{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:999px;padding:3px 10px;font-size:13px}
.tg button[aria-pressed="true"]{background:#fff;color:var(--acc)}
main{max-width:760px;margin:0 auto;padding:16px 16px 80px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.hero p{margin:4px 0;color:var(--mut)}
.stat{display:flex;gap:10px;margin:12px 0 4px;flex-wrap:wrap}
.stat div{background:var(--box);border-radius:10px;padding:8px 12px;font-size:14px}
.stat b{font-size:18px;display:block}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 0}
.btn{display:block;width:100%;text-align:center;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:11px 12px;font-weight:600}
.btn.alt{background:transparent;color:var(--acc)}
.btn[disabled]{opacity:.45;cursor:default}
h2.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:22px 0 8px}
.les{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.les-h{display:flex;align-items:baseline;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.les-h .n{font-weight:700;color:var(--acc);min-width:28px}
.les-h .z{font-family:var(--zh);font-size:17px;flex:1}
.les-h .q{font-size:13px;color:var(--acc);background:none;border:0;padding:0;text-decoration:underline}
.tp{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px}
.tp:first-of-type{border-top:0}
.tp .t{flex:1}
.tp .c{font-size:12px;color:var(--mut);white-space:nowrap}
.tp:hover{background:var(--box)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--acc)}
.kode{display:inline-block;font-size:12px;color:var(--mut);background:var(--box);border-radius:6px;padding:2px 8px;margin-bottom:8px}
.ttl2{font-size:21px;line-height:1.3;margin:0 0 6px}
.rumus{font-family:var(--zh);background:var(--acc2);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:16px}
.jelas p{margin:0 0 10px}
.poin{margin:0;padding-left:20px}.poin li{margin:4px 0}
.ex{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:8px;align-items:flex-start}
.ex:first-of-type{border-top:0;padding-top:0}
.ex .b{flex:1;min-width:0}
.zh{font-family:var(--zh);font-size:19px;line-height:1.5}
.py{color:var(--mut);font-size:14px}
.id{font-size:14px}
.tag{display:inline-block;font-size:11px;background:var(--box);color:var(--mut);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.tag.bk{background:var(--acc2);color:var(--acc)}
.say{border:1px solid var(--line);background:var(--box);border-radius:8px;width:34px;height:34px;flex:none;font-size:15px}
.err{border-top:1px solid var(--line);padding:10px 0}
.err:first-of-type{border-top:0;padding-top:0}
.x{color:var(--bad)}.v{color:var(--ok)}
.x .zh{text-decoration:line-through;text-decoration-thickness:1px}
.why{font-size:14px;color:var(--mut);margin-top:2px}
.nav2{display:flex;gap:10px;margin-top:6px}
.nav2 .btn{flex:1}
.aud{font-size:14px;color:var(--mut)}
.aud a{color:var(--acc)}
.hide-py .py{display:none}.hide-id .id{display:none}
/* kuis */
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:2px 0 14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.qh{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:4px}
.qt{font-size:13px;color:var(--mut);margin:0 0 6px}
.qq{font-size:18px;margin:0 0 4px}
.qq.zhq{font-family:var(--zh);font-size:22px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-family:var(--zh);font-size:17px}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.no{border-color:var(--bad);background:var(--badb)}
.opt[disabled]{cursor:default}
.ansline{min-height:56px;border:1.5px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tile{font-family:var(--zh);font-size:18px;background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:6px 11px;min-width:40px}
.tile.used{visibility:hidden}
.ansline .tile{background:var(--acc2);border-color:var(--acc)}
.fb{border-radius:10px;padding:12px;margin-top:12px;font-size:15px}
.fb.ok{background:var(--okb)}.fb.no{background:var(--badb)}
.fb b{display:block;margin-bottom:4px}
.bsrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.res{text-align:center;padding:10px 0}
.res .big{font-size:46px;font-weight:700;color:var(--acc);line-height:1.1}
.wl{margin-top:8px}
.wl .err .t{font-size:12px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:30px 0}
@media (max-width:420px){.acts{grid-template-columns:1fr}.zh{font-size:18px}}
.say{display:none}
body.tts .say{display:inline-block}
.fb .say{margin-left:8px;vertical-align:middle}
[hidden]{display:none!important}
main a{color:var(--acc)}
.tabs{display:flex;gap:6px;background:var(--box);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.zhs{font-family:var(--zh)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.wc{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 6px;min-height:96px;text-align:center}
.wc .wh{font-family:var(--zh);font-size:26px;line-height:1.3}
.wc .py{font-size:14px}.wc .id{font-size:13px;line-height:1.3}
.rv{cursor:pointer}
.rv:not(.open) .py,.rv:not(.open) .id{visibility:hidden}
.wc.open{border-color:var(--acc)}
.rvbar{display:flex;gap:8px;margin-top:10px}.rvbar .btn{flex:1;padding:8px}
.trk{margin:14px 0 4px;font-size:14px;font-weight:600}.trk:first-of-type{margin-top:4px}
.spk{font-family:var(--zh);color:var(--mut);font-size:16px}
.ex.rv .zh{display:inline}
</style></head>

<script type="application/json" id="DATA">{"topik": [{"id": "1-1", "pel": 1, "judul": "Partikel 吧 (2): menebak / memastikan — …吧？", "kode": "语气助词\"吧\"（2）", "rumus": ["Kalimat dugaan + 吧？", "你是老师吧？ = Anda guru, kan?", "Bandingkan: … + 吗？ (benar-benar tidak tahu)"], "jelas": ["Di HSK 1 kita sudah belajar 吧 untuk ajakan atau saran (我们走吧 = ayo kita pergi). Di pelajaran ini 吧 dipakai di akhir pertanyaan untuk MENEBAK atau MEMASTIKAN. Penutur sudah punya dugaan dan hampir yakin, lalu minta lawan bicara membenarkan. Artinya mirip \"…, kan?\", \"…, ya?\" atau \"pasti …, ya?\" dalam bahasa Indonesia.", "Susunannya sangat mudah: tulis kalimat berita yang berisi dugaan Anda, lalu tambahkan 吧 di akhir dengan tanda tanya. 陈天中是泰国人。→ 陈天中是泰国人吧？ (Chen Tianzhong orang Thailand, kan?). Urutan kata tidak berubah sama sekali.", "Beda dengan 吗: kalimat dengan 吗 adalah pertanyaan netral, penutur benar-benar tidak tahu jawabannya (你是老师吗？ = Apakah Anda guru?). Kalimat dengan 吧 berarti penutur sudah menduga \"ya\" (你是老师吧？ = Anda guru, kan?). Jawabannya sama: 对 / 是的 jika benar, 不是 jika salah.", "Seperti 吗, 吧 penebak TIDAK boleh dipakai bersama kata tanya (什么, 谁, 哪儿, 几, 怎么) atau bentuk positif-negatif (是不是, 去不去). 你是哪国人吧？ salah, karena penanya tidak sedang menebak apa pun.", "Jebakan untuk pelajar Indonesia: kita sering menambah \"kan\" di tengah kalimat (\"Kamu kan guru?\"). Dalam bahasa Mandarin 吧 selalu di paling akhir kalimat. Selain itu, bedakan nada: 吧 penebak diucapkan dengan nada sedikit naik seperti pertanyaan, sedangkan 吧 ajakan datar.", "Konteks membantu membedakan dua fungsi 吧: jika ada tanda tanya dan isinya dugaan tentang fakta → menebak. Jika isinya tindakan yang diusulkan → ajakan/saran. 你累了吧？休息一下吧。 = Kamu capek, kan? Istirahatlah sebentar."], "poin": ["吧 di akhir pertanyaan = \"…, kan?\" (menebak, hampir yakin).", "吗 = tidak tahu sama sekali; 吧 = sudah punya dugaan.", "Tidak dipakai bersama kata tanya atau 是不是.", "吧 selalu di paling akhir kalimat."], "contoh": [{"zh": "你们就是她的学生 "了"], "a": 0, "x": "Menebak/memastikan: kalimat dugaan + 吧？"}, {"k": "1-1.1", "t": "pg", "q": "Kalimat mana yang menunjukkan penutur MENEBAK dan hampir yakin?", "o": ["你是中国人吧？", "你是中国人吗？", "你是哪国人？", "你是什么人？"], "a": 0, "x": "吧 di akhir pertanyaan = sudah punya dugaan."}, {"k": "1-1.2", "t": "pg", "q": "\"Kamu capek, kan?\" =", "o": ["你累了吧？", "你累了吗吧？", "吧你累了？", "你累吧了？"], "a": 0, "x": "Kalimat berita + 吧 di akhir."}, {"k": "1-1.3", "t": "pg", "q": "A：你是安妮吧？ B：___", "o": ["对，我是安妮。", "我是安妮吧。", "吧，我是安妮。", "我不安妮。"], "a": 0, "x": "Jawab dengan 对 / 是的 jika dugaan benar."}, {"k": "1-1.4", "t": "pg", "q": "Pertanyaan mana yang SALAH?", "o": ["他是老师吧？", "你去哪儿吧？", "今天很冷吧？", "这是你的书吧？"], "a": 1, "x": "哪儿 sudah kata tanya; tidak boleh + 吧."}, {"k": "1-1.5", "t": "pg", "q": "吧 dalam 我们走吧。 berfungsi sebagai …, sedangkan dalam 你是学生吧？ sebagai …", "o": ["ajakan; tebakan", "tebakan; ajakan", "larangan; perintah", "pertanyaan netral; ajakan"], "a": 0, "x": "Tindakan yang diusulkan = ajakan; dugaan tentang fakta = tebakan."}, {"k": "1-1.6", "t": "pg", "q": "这件衣服很贵___？", "o": ["吧", "什么", "几", "谁"], "a": 0, "x": "Menebak harga mahal: …很贵吧？", "f": "这件衣服很贵吧？", "fp": "Zhè jiàn yīfu hěn guì ba?"}, {"k": "1-1.7", "t": "su", "w": ["你", "是", "老师", "吧"], "s": "你是老师吧？", "alt": [], "p": "Nǐ shì lǎoshī ba?", "x": "Anda guru, kan?"}, {"k": "1-1.8", "t": "su", "w": ["她", "唱歌", "很", "好听", "吧"], "s": "她唱歌很好听吧？", "alt": [], "p": "Tā chànggē hěn hǎotīng ba?", "x": "Nyanyiannya enak didengar, kan?"}, {"k": "1-1.9", "t": "su", "w": ["你们", "就", "是", "她", "的", "学生", "吧"], "s": "你们就是她的学生吧？", "alt": [], "p": "Nǐmen jiù shì tā de xuéshēng ba?", "x": "Kalian pasti murid-muridnya, ya?"}, {"k": "1-1.10", "t": "su", "w": ["你", "是", "第一", "次", "来", "北京", "吧"], "s": "你是第一次来北京吧？", "alt": [], "p": "Nǐ shì dìyī cì lái Běijīng ba?", "x": "Kamu baru pertama kali ke Beijing, ya?"}, {"k": "1-1.11", "t": "su", "w": ["这", "是", "你", "的", "手机", "吧"], "s": "这是你的手机吧？", "alt": [], "p": "Zhè shì nǐ de shǒujī ba?", "x": "Ini HP-mu, kan?"}, {"k": "1-1.12", "t": "su", "w": ["陈天中", "是", "泰国人", "吧"], "s": "陈天中是泰国人吧？", "alt": [], "p": "Chén Tiānzhōng shì Tàiguó rén ba?", "x": "Chen Tianzhong orang Thailand, kan?"}, {"k": "1-1.13", "t": "bs", "s": "你是老师吧？", "sp": "Nǐ shì lǎoshī ba?", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: dugaan + 吧."}, {"k": "1-1.14", "t": "bs", "s": "你叫什么名字吧？", "sp": "Nǐ jiào shénme míngzi ba?", "n": "", "ok": false, "b": "你叫什么名字？", "bp": "Nǐ jiào shénme míngzi?", "x": "Ada kata tanya 什么, 吧 penebak tidak dipakai."}, {"k": "1-1.15", "t": "bs", "s": "他是泰国人吧？", "sp": "Tā shì Tàiguó rén ba?", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "1-1.16", "t": "bs", "s": "吧这是你的书？", "sp": "Ba zhè shì nǐ de shū?", "n": "", "ok": false, "b": "这是你的书吧？", "bp": "Zhè shì nǐ de shū ba?", "x": "吧 selalu di akhir."}, {"k": "1-1.17", "t": "bs", "s": "你是不是学生吧？", "sp": "Nǐ shì bu shì xuéshēng ba?", "n": "", "ok": false, "b": "你是不是学生？", "bp": "Nǐ shì bu shì xuéshēng?", "x": "是不是 sudah pertanyaan; 吧 tidak perlu."}]}, {"id": "1-2", "pel": 1, "judul": "Kalimat 是……的: menekankan waktu, tempat, cara", "kode": "\"是……的\"句", "rumus": ["S + 是 + (waktu / tempat / cara / tujuan) + KK + 的", "Ingkar: S + 不是 + … + KK + 的", "Tanya: S + 是 + 什么时候/在哪儿/怎么 + KK + 的？"], "jelas": ["Kalimat 是……的 dipakai untuk peristiwa yang SUDAH terjadi, ketika kedua pembicara sudah tahu peristiwanya, dan yang ingin ditekankan adalah detailnya: kapan, di mana, dengan cara apa, siapa pelakunya, atau untuk tujuan apa. Misalnya kita sudah tahu Jiayue sudah sampai; yang ditanyakan adalah kapan: 你是什么时候到的？—我是今天早上到的。", "Susunannya: bagian yang ditekankan diletakkan tepat setelah 是, lalu kata kerja, lalu 的 di akhir. 我是昨天到的 (waktu), 苹果是在哪儿买的？ (tempat), 我们是坐出租车去的 (cara), 我们是来旅游的 (tujuan), 是您姐姐来接的我们 (pelaku).", "Dalam kalimat positif dan tanya, 是 boleh dihilangkan: 我昨天到的。苹果在哪儿买的？ Tetapi dalam kalimat ingkar 是 TIDAK boleh hilang: 我们不是坐出租车去的。 Ingkarnya memakai 不是, bukan 没.", "Beda dengan 了: 了 hanya menyatakan peristiwa sudah terjadi (我到北京了 = saya sudah sampai di Beijing, kabar baru). 是……的 menekankan detail peristiwa yang sudah diketahui (我是昨天到的 = saya sampainya kemarin). Biasanya 了 tidak dipakai bersama 是……的: jangan katakan 我是昨天到了的.", "Jika kata kerja punya objek, objek boleh diletakkan sebelum atau sesudah 的: 我是在书店看见安妮的 / 我是在书店看见的安妮. Untuk pemula, letakkan saja objek sebelum 的.", "Jebakan pelajar Indonesia: dalam bahasa Indonesia kita cukup bilang \"Saya datang kemarin\". Dalam bahasa Mandarin, jika yang ditanya memang waktunya (peristiwa sudah diketahui), pakailah 是……的. Pola ini sangat sering muncul dalam percakapan sehari-hari dan ujian HSK."], "poin": ["Untuk peristiwa lampau yang sudah diketahui; tekankan kapan/di mana/bagaimana/siapa/untuk apa.", "Yang ditekankan diletakkan setelah 是; 的 di akhir.", "是 boleh hilang di kalimat positif/tanya, wajib ada di kalimat ingkar (不是…的).", "Jangan campur dengan 了."], "contoh": [{"zh": "我们是来旅游的。", "py": "Wǒmen shì lái lǚyóu de.", "id": "Kami datang untuk berwisata.", "b": true, "tr": "01-3"}, {"zh": "苹果在哪儿买的？", "py": "Píngguǒ zài nǎr mǎi de?", "id": "Apelnya beli di mana?", "b": true, "tr": null}, {"zh": "我们不是坐出租车去的。", "py": "Wǒmen bú shì zuò chūzūchē qù de.", "id": "Kami perginya bukan naik taksi.", "b": true, "tr": null}, {"zh": "你是什么时候到的？——我是今天早上到的。", "py": "Nǐ shì shénme shíhou dào de? — Wǒ shì jīntiān zǎoshang dào de.", "id": "Kamu sampai kapan? — Saya sampai tadi pagi.", "b": true, "tr": "01-5"}, {"zh": "你们是来学中文的吗？", "py": "Nǐmen shì lái xué Zhōngwén de ma?", "id": "Kalian datang untuk belajar bahasa Mandarin?", "b": true, "tr": "01-3"}, {"zh": "是您姐姐来接的我们。", "py": "Shì nín jiějie lái jiē de wǒmen.", "id": "Kakak Anda yang menjemput kami.", "b": true, "tr": "01-7"}, {"zh": "我是昨天到的。", "py": "Wǒ shì zuótiān dào de.", "id": "Saya sampainya kemarin.", "b": true, "tr": null}, {"zh": "我是在书店看见安妮的。", "py": "Wǒ shì zài shūdiàn kànjiàn Ānnī de.", "id": "Saya melihat Annie di toko buku.", "b": true, "tr": null}, {"zh": "你是坐车来学校的吗？——不是，我是走路来的。", "py": "Nǐ shì zuò chē lái xuéxiào de ma? — Bú shì, wǒ shì zǒulù lái de.", "id": "Kamu ke sekolah naik kendaraan? — Bukan, saya jalan kaki.", "b": false, "tr": null}, {"zh": "这件衣服是妈妈给我买的。", "py": "Zhè jiàn yīfu shì māma gěi wǒ mǎi de.", "id": "Baju ini ibu yang membelikan untuk saya.", "b": false, "tr": null}, {"zh": "他是2024年来中国的。", "py": "Tā shì 2 0 2 4 nián lái Zhōngguó de.", "id": "Dia datang ke Tiongkok tahun 2024.", "b": false, "tr": null}], "salah": [{"s": "我们没是坐出租车去的。", "sp": "Wǒmen méi shì zuò chūzūchē qù de.", "n": "", "b": "我们不是坐出租车去的。", "bp": "Wǒmen bú shì zuò chūzūchē qù de.", "a": "Ingkar 是……的 memakai 不是."}, {"s": "我们不坐出租车去的。", "sp": "Wǒmen bú zuò chūzūchē qù de.", "n": "", "b": "我们不是坐出租车去的。", "bp": "Wǒmen bú shì zuò chūzūchē qù de.", "a": "Dalam kalimat ingkar 是 tidak boleh dihilangkan."}, {"s": "我是昨天到了的。", "sp": "Wǒ shì zuótiān dào le de.", "n": "", "b": "我是昨天到的。", "bp": "Wǒ shì zuótiān dào de.", "a": "是……的 tidak dipakai bersama 了."}, {"s": "我是到的昨天。", "sp": "Wǒ shì dào de zuótiān.", "n": "", "b": "我是昨天到的。", "bp": "Wǒ shì zuótiān dào de.", "a": "Waktu yang ditekankan diletakkan setelah 是, sebelum kata kerja."}], "latihan": [{"k": "1-2.0", "t": "pg", "q": "你是什么时候到___？", "o": ["的", "了", "吗", "过"], "a": 0, "x": "Menanyakan waktu peristiwa yang sudah terjadi: 是……的.", "f": "你是什么时候到的？", "fp": "Nǐ shì shénme shíhou dào de?"}, {"k": "1-2.1", "t": "pg", "q": "\"Saya datang naik pesawat.\" (peristiwa sudah diketahui) =", "o": ["我是坐飞机来的。", "我坐飞机来了的。", "我是来坐飞机的。", "我来是坐飞机的。"], "a": 0, "x": "Cara (坐飞机) setelah 是, kata kerja, lalu 的."}, {"k": "1-2.2", "t": "pg", "q": "Ingkar yang benar untuk 我是坐出租车来的。", "o": ["我不是坐出租车来的。", "我没是坐出租车来的。", "我不坐出租车来的。", "我是不坐出租车来的。"], "a": 0, "x": "Ingkar: 不是……的; 是 wajib ada."}, {"k": "1-2.3", "t": "pg", "q": "A：你们是来学中文的吗？ B：不是，我们是来___的。", "o": ["旅游", "旅游了", "旅游过", "去旅游了"], "a": 0, "x": "Tujuan: 是来旅游的."}, {"k": "1-2.4", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["我昨天到的。", "苹果在哪儿买的？", "我们不坐车去的。", "你是怎么来的？"], "a": 2, "x": "Kalimat ingkar harus memakai 不是: 我们不是坐车去的。"}, {"k": "1-2.5", "t": "pg", "q": "A：你是在哪儿看见安妮的？ B：___", "o": ["我是在书店看见她的。", "我在书店看见她了吗。", "我是书店在看见她的。", "我看见她是在的书店。"], "a": 0, "x": "Tempat (在书店) setelah 是, sebelum kata kerja."}, {"k": "1-2.6", "t": "pg", "q": "Kapan memakai 是……的?", "o": ["Untuk menekankan detail peristiwa yang sudah terjadi", "Untuk rencana besok", "Untuk kebiasaan setiap hari", "Untuk ajakan"], "a": 0, "x": "是……的 menekankan waktu/tempat/cara peristiwa lampau."}, {"k": "1-2.7", "t": "su", "w": ["我", "是", "昨天", "到", "的"], "s": "我是昨天到的。", "alt": [], "p": "Wǒ shì zuótiān dào de.", "x": "Saya sampainya kemarin."}, {"k": "1-2.8", "t": "su", "w": ["你", "是", "什么", "时候", "到", "的"], "s": "你是什么时候到的？", "alt": [], "p": "Nǐ shì shénme shíhou dào de?", "x": "Kamu sampai kapan?"}, {"k": "1-2.9", "t": "su", "w": ["我们", "是", "来", "旅游", "的"], "s": "我们是来旅游的。", "alt": [], "p": "Wǒmen shì lái lǚyóu de.", "x": "Kami datang untuk berwisata."}, {"k": "1-2.10", "t": "su", "w": ["我们", "不", "是", "坐", "出租车", "去", "的"], "s": "我们不是坐出租车去的。", "alt": [], "p": "Wǒmen bú shì zuò chūzūchē qù de.", "x": "Kami perginya bukan naik taksi."}, {"k": "1-2.11", "t": "su", "w": ["你", "是", "怎么", "来", "学校", "的"], "s": "你是怎么来学校的？", "alt": [], "p": "Nǐ shì zěnme lái xuéxiào de?", "x": "Kamu ke sekolah dengan cara apa?"}, {"k": "1-2.12", "t": "su", "w": ["这些", "苹果", "是", "在", "哪儿", "买", "的"], "s": "这些苹果是在哪儿买的？", "alt": [], "p": "Zhèxiē píngguǒ shì zài nǎr mǎi de?", "x": "Apel-apel ini dibeli di mana?"}, {"k": "1-2.13", "t": "bs", "s": "我是今天早上到的。", "sp": "Wǒ shì jīntiān zǎoshang dào de.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: menekankan waktu."}, {"k": "1-2.14", "t": "bs", "s": "我没是坐飞机来的。", "sp": "Wǒ méi shì zuò fēijī lái de.", "n": "", "ok": false, "b": "我不是坐飞机来的。", "bp": "Wǒ bú shì zuò fēijī lái de.", "x": "Ingkar memakai 不是."}, {"k": "1-2.15", "t": "bs", "s": "你们是来学中文的吗？", "sp": "Nǐmen shì lái xué Zhōngwén de ma?", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: menanyakan tujuan."}, {"k": "1-2.16", "t": "bs", "s": "他是去年来了的。", "sp": "Tā shì qùnián lái le de.", "n": "", "ok": false, "b": "他是去年来的。", "bp": "Tā shì qùnián lái de.", "x": "Tidak memakai 了 dalam 是……的."}, {"k": "1-2.17", "t": "bs", "s": "我们不坐公交车来的。", "sp": "Wǒmen bú zuò gōngjiāochē lái de.", "n": "", "ok": false, "b": "我们不是坐公交车来的。", "bp": "Wǒmen bú shì zuò gōngjiāochē lái de.", "x": "Dalam kalimat ingkar 是 wajib ada."}]}, {"id": "1-3", "pel": 1, "judul": "Kalimat poros (兼语句): 请 / 让 / 叫 + orang + KK", "kode": "兼语句", "rumus": ["S + 请/让/叫 + O(=S2) + KK (+ O)", "我想请你帮个忙。", "Ingkar: S + 不/没 + 请/让/叫 + O + KK"], "jelas": ["Dalam kalimat poros, ada dua kata kerja. Objek dari kata kerja pertama sekaligus menjadi pelaku kata kerja kedua. 王老师让我们说中文: 我们 adalah objek dari 让 (menyuruh kami), dan sekaligus pelaku 说中文 (kami yang berbicara bahasa Mandarin). Kata 我们 menjadi \"poros\".", "Kata kerja pertama yang dipelajari di sini: 请 (mengundang, meminta dengan sopan, atau mentraktir), 让 (menyuruh, membiarkan, meminta), 叫 (menyuruh, memanggil, lebih lisan). 我想请你帮个忙 = saya ingin minta tolong kamu; 她请我们吃了北京烤鸭 = dia mentraktir kami bebek panggang Beijing; 妈妈叫孩子们回家 = ibu menyuruh anak-anak pulang.", "Bentuk ingkar: 不 atau 没 diletakkan sebelum kata kerja PERTAMA (请/让/叫), bukan sebelum kata kerja kedua. 妈妈不让我看电视 = ibu tidak membolehkan saya menonton TV. 他没请我吃饭 = dia tidak mentraktir saya makan. Kata keterangan seperti 想, 要, 可以 juga diletakkan sebelum 请/让/叫: 你有事可以叫李文帮忙.", "Penanda waktu 了 biasanya diletakkan setelah kata kerja kedua, bukan setelah 请/让/叫: 她请我们吃了北京烤鸭。 Jangan katakan 她请了我们吃北京烤鸭.", "Jebakan pelajar Indonesia: dalam bahasa Indonesia kita sering memakai \"untuk\" atau \"supaya\": \"Ibu menyuruh saya untuk pulang\". Dalam bahasa Mandarin tidak ada kata penghubung itu; langsung 妈妈让我回家. Jangan menyisipkan 为了 atau 给.", "Perbedaan rasa: 请 paling sopan (meminta dengan hormat atau mentraktir). 让 netral dan paling umum. 叫 lebih santai dan lisan. Untuk guru, orang tua, atasan yang meminta kita, 让 dan 叫 biasa dipakai; untuk kita yang meminta orang lain dengan sopan, pakai 请."], "poin": ["Objek kata kerja pertama = pelaku kata kerja kedua.", "请 = mengundang/mentraktir/minta dengan sopan; 让 = menyuruh/membiarkan; 叫 = menyuruh (lisan).", "不/没/想/要 diletakkan sebelum 请/让/叫.", "Tidak ada kata \"untuk/supaya\" di antaranya."], "contoh": [{"zh": "我想请你帮个忙。", "py": "Wǒ xiǎng qǐng nǐ bāng gè máng.", "id": "Saya ingin minta tolong kamu.", "b": true, "tr": "01-5"}, {"zh": "王老师让我们说中文。", "py": "Wáng lǎoshī ràng wǒmen shuō Zhōngwén.", "id": "Bu Guru Wang menyuruh kami berbicara bahasa Mandarin.", "b": true, "tr": null}, {"zh": "妈妈叫孩子们回家。", "py": "Māma jiào háizimen huí jiā.", "id": "Ibu menyuruh anak-anak pulang.", "b": true, "tr": null}, {"zh": "她请我们吃了北京烤鸭。", "py": "Tā qǐng wǒmen chī le běijīngkǎoyā.", "id": "Dia mentraktir kami bebek panggang Beijing.", "b": true, "tr": "01-7"}, {"zh": "一飞给我打电话了，让我来接你们。", "py": "Yīfēi gěi wǒ dǎdiànhuà le, ràng wǒ lái jiē nǐmen.", "id": "Yifei menelepon saya, menyuruh saya menjemput kalian.", "b": true, "tr": "01-1"}, {"zh": "你有事可以叫李文帮忙。", "py": "Nǐ yǒu shì kěyǐ jiào Lǐ Wén bāngmáng.", "id": "Kalau ada perlu, kamu bisa minta Li Wen membantu.", "b": true, "tr": "01-5"}, {"zh": "明天我想请朋友来家里吃饭。", "py": "Míngtiān wǒ xiǎng qǐng péngyou lái jiā li chīfàn.", "id": "Besok saya ingin mengundang teman makan di rumah.", "b": false, "tr": null}, {"zh": "家月，王老师让你去找她。", "py": "Jiāyuè, Wáng lǎoshī ràng nǐ qù zhǎo tā.", "id": "Jiayue, Bu Guru Wang menyuruhmu menemuinya.", "b": false, "tr": null}, {"zh": "妈妈叫我去超市买点儿水果。", "py": "Māma jiào wǒ qù chāoshì mǎi diǎnr shuǐguǒ.", "id": "Ibu menyuruh saya ke supermarket membeli sedikit buah.", "b": false, "tr": null}, {"zh": "医生不让他喝咖啡。", "py": "Yīshēng bú ràng tā hē kāfēi.", "id": "Dokter tidak membolehkan dia minum kopi.", "b": false, "tr": null}, {"zh": "今天我请你看电影吧。", "py": "Jīntiān wǒ qǐng nǐ kàn diànyǐng ba.", "id": "Hari ini saya traktir kamu nonton film, ya.", "b": false, "tr": null}], "salah": [{"s": "妈妈让我为了回家。", "sp": "Māma ràng wǒ wèile huí jiā.", "n": "", "b": "妈妈让我回家。", "bp": "Māma ràng wǒ huí jiā.", "a": "Tidak ada kata \"untuk/supaya\" di antara dua kata kerja."}, {"s": "妈妈让我不看电视。（maksud: Ibu tidak membolehkan saya menonton TV.）", "sp": "Māma ràng wǒ bú kàn diànshì. (m a k s u d: I b u t i d a k m e m b o l e h k a n s a y a m e n o n t o n T V.)", "n": "", "b": "妈妈不让我看电视。", "bp": "Māma bú ràng wǒ kàn diànshì.", "a": "不 diletakkan sebelum kata kerja pertama (让)."}, {"s": "她请了我们吃北京烤鸭。", "sp": "Tā qǐng le wǒmen chī běijīngkǎoyā.", "n": "", "b": "她请我们吃了北京烤鸭。", "bp": "Tā qǐng wǒmen chī le běijīngkǎoyā.", "a": "了 diletakkan setelah kata kerja kedua."}], "latihan": [{"k": "1-3.0", "t": "pg", "q": "我想___你帮个忙。", "o": ["请", "是", "在", "给"], "a": 0, "x": "Meminta tolong dengan sopan: 请 + orang + KK.", "f": "我想请你帮个忙。", "fp": "Wǒ xiǎng qǐng nǐ bāng gè máng."}, {"k": "1-3.1", "t": "pg", "q": "\"Ibu tidak membolehkan saya keluar.\" =", "o": ["妈妈不让我出去。", "妈妈让我不出去。", "妈妈让不我出去。", "不妈妈让我出去。"], "a": 0, "x": "不 sebelum kata kerja pertama 让."}, {"k": "1-3.2", "t": "pg", "q": "Dalam 王老师让我们说中文, siapa yang berbicara bahasa Mandarin?", "o": ["我们", "王老师", "Keduanya", "Tidak jelas"], "a": 0, "x": "Objek 让 (我们) menjadi pelaku 说."}, {"k": "1-3.3", "t": "pg", "q": "她___我们吃了北京烤鸭。（mentraktir）", "o": ["请", "叫", "是", "有"], "a": 0, "x": "请 = mentraktir."}, {"k": "1-3.4", "t": "pg", "q": "Kalimat mana yang benar?", "o": ["医生让他多休息。", "医生让他为了多休息。", "医生他让多休息。", "医生让多休息他。"], "a": 0, "x": "S + 让 + orang + KK."}, {"k": "1-3.5", "t": "pg", "q": "你有事可以___李文帮忙。", "o": ["叫", "是", "的", "过"], "a": 0, "x": "叫 + orang + KK: menyuruh/minta.", "f": "你有事可以叫李文帮忙。", "fp": "Nǐ yǒu shì kěyǐ jiào Lǐ Wén bāngmáng."}, {"k": "1-3.6", "t": "pg", "q": "Di mana posisi 了? 她请我们吃___北京烤鸭___。", "o": ["setelah 吃", "setelah 请", "di awal kalimat", "setelah 她"], "a": 0, "x": "了 setelah kata kerja kedua: 吃了."}, {"k": "1-3.7", "t": "su", "w": ["我", "想", "请", "你", "帮", "个", "忙"], "s": "我想请你帮个忙。", "alt": [], "p": "Wǒ xiǎng qǐng nǐ bāng gè máng.", "x": "Saya ingin minta tolong kamu."}, {"k": "1-3.8", "t": "su", "w": ["王老师", "让", "我们", "说", "中文"], "s": "王老师让我们说中文。", "alt": [], "p": "Wáng lǎoshī ràng wǒmen shuō Zhōngwén.", "x": "Bu Guru Wang menyuruh kami berbicara bahasa Mandarin."}, {"k": "1-3.9", "t": "su", "w": ["妈妈", "叫", "孩子们", "回", "家"], "s": "妈妈叫孩子们回家。", "alt": [], "p": "Māma jiào háizimen huí jiā.", "x": "Ibu menyuruh anak-anak pulang."}, {"k": "1-3.10", "t": "su", "w": ["她", "请", "我们", "吃", "了", "北京烤鸭"], "s": "她请我们吃了北京烤鸭。", "alt": [], "p": "Tā qǐng wǒmen chī le běijīngkǎoyā.", "x": "Dia mentraktir kami bebek panggang Beijing."}, {"k": "1-3.11", "t": "su", "w": ["医生", "不", "让", "他", "喝", "咖啡"], "s": "医生不让他喝咖啡。", "alt": [], "p": "Yīshēng bú ràng tā hē kāfēi.", "x": "Dokter tidak membolehkan dia minum kopi."}, {"k": "1-3.12", "t": "su", "w": ["明天", "我", "想", "请", "朋友", "来", "家里", "吃饭"], "s": "明天我想请朋友来家里吃饭。", "alt": ["我明天想请朋友来家里吃饭。"], "p": "Míngtiān wǒ xiǎng qǐng péngyou lái jiā li chīfàn.", "x": "Besok saya ingin mengundang teman makan di rumah."}, {"k": "1-3.13", "t": "bs", "s": "妈妈让我去超市买水果。", "sp": "Māma ràng wǒ qù chāoshì mǎi shuǐguǒ.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: S + 让 + orang + KK."}, {"k": "1-3.14", "t": "bs", "s": "老师让我们为了说中文。", "sp": "Lǎoshī ràng wǒmen wèile shuō Zhōngwén.", "n": "", "ok": false, "b": "老师让我们说中文。", "bp": "Lǎoshī ràng wǒmen shuō Zhōngwén.", "x": "Tidak memakai 为了 di antara dua kata kerja."}, {"k": "1-3.15", "t": "bs", "s": "我请了他吃饭。", "sp": "Wǒ qǐng le tā chīfàn.", "n": "", "ok": false, "b": "我请他吃饭了。", "bp": "Wǒ qǐng tā chīfàn le.", "x": "了 setelah kata kerja kedua."}, {"k": "1-3.16", "t": "bs", "s": "你有事可以叫李文帮忙。", "sp": "Nǐ yǒu shì kěyǐ jiào Lǐ Wén bāngmáng.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 可以 sebelum 叫."}, {"k": "1-3.17", "t": "bs", "s": "妈妈让我不看电视。（maksud: Ibu tidak membolehkan saya menonton TV.）", "sp": "Māma ràng wǒ bú kàn diànshì. (m a k s u d: I b u t i d a k m e m b o l e h k a n s a y a m e n o n t o n T V.)", "n": "", "ok": false, "b": "妈妈不让我看电视。", "bp": "Māma bú ràng wǒ kàn diànshì.", "x": "不 sebelum 让."}]}, {"id": "2-1", "pel": 2, "judul": "Pola 还是……吧: sebaiknya … saja", "kode": "固定格式\"还是……吧\"", "rumus": ["(S +) 还是 + KK/frasa + 吧", "还是 + 别 + KK + 吧/了", "Konteks: ada pilihan lain, tapi yang ini lebih baik"], "jelas": ["Pola 还是……吧 dipakai untuk menyatakan pilihan yang lebih disukai setelah menimbang beberapa kemungkinan. Artinya \"sebaiknya … saja\", \"lebih baik … deh\". Contoh: ada bus, tapi haltenya jauh, jadi 我们还是打车去吧 (kita naik taksi saja).", "Susunannya: 还是 diletakkan sebelum kata kerja (setelah subjek jika ada), dan 吧 di akhir kalimat. 你第一次去北京，还是找个人接你吧 (sebaiknya cari orang untuk menjemputmu). Subjek boleh di depan 还是: 我们还是……吧.", "Bentuk larangan halus: 还是别……了/吧 = sebaiknya jangan … deh. 还是别看电影了，北京大学就很好看！ (Sudahlah, tidak usah nonton film; kampus Universitas Peking sendiri sudah sangat menarik).", "Jangan bingung dengan 还是 dalam pertanyaan pilihan dari HSK 1 (你喝茶还是喝咖啡？ = teh atau kopi?). Di pola ini 还是 bukan \"atau\", melainkan \"sebaiknya\", dan selalu ditutup dengan 吧, tanpa tanda tanya.", "Pola ini biasanya muncul setelah alasan: 打车太贵了，还是坐公交车吧。 明天有雨，我们还是今天去吧。 Dalam bahasa Indonesia kita sering memakai \"mending …\" (\"mending naik taksi\"); padanan yang pas adalah 还是……吧.", "Nadanya lembut dan menyarankan, cocok untuk memberi usul kepada teman atau keluarga."], "poin": ["还是……吧 = sebaiknya … saja (setelah menimbang pilihan).", "还是 sebelum kata kerja; 吧 di akhir.", "还是别……了/吧 = sebaiknya jangan.", "Bukan 还是 \"atau\" dalam pertanyaan."], "contoh": [{"zh": "我们还是打车去吧。", "py": "Wǒmen háishi dǎchē qù ba.", "id": "Kita naik taksi saja.", "b": true, "tr": "02-1"}, {"zh": "那件衣服很好看，还是买那件吧。", "py": "Nà jiàn yīfu hěn hǎokàn, háishi mǎi nà jiàn ba.", "id": "Baju itu bagus, beli yang itu saja.", "b": true, "tr": null}, {"zh": "你第一次去北京，还是找个人接你吧。", "py": "Nǐ dìyī cì qù Běijīng, háishi zhǎo gè rén jiē nǐ ba.", "id": "Kamu baru pertama kali ke Beijing, sebaiknya cari orang untuk menjemputmu.", "b": true, "tr": nul inya lebihnya berupa pecahan dari satuan itu.", "Untuk kata satuan yang juga berfungsi sebagai kata benda seperti 岁, 天, 年, 块(钱), 多 bisa langsung mengikuti: 十多岁 (belasan tahun), 三岁多 (tiga tahun lebih), 二十多天, 两年多.", "Jebakan pelajar Indonesia: urutan \"dua puluh lebih orang\" vs \"lima ribu lebih\" dalam bahasa Indonesia fleksibel, tetapi dalam bahasa Mandarin 多 harus tepat di posisinya. 二十个多学生 salah; 五多块钱 juga salah. Ingat: angka bulat → 多 sebelum kata satuan; angka satuan → 多 setelah kata satuan.", "Jangan tertukar dengan 多少 (berapa) dan 很多 (banyak). 多 dalam pola ini hanya menempel pada angka."], "poin": ["Angka bulat (十/二十/一百…) + 多 + kata satuan: 二十多个.", "Angka 1–9 + kata satuan + 多: 五块多, 三个多月.", "多 = \"lebih/-an\", jumlah tidak pasti.", "Jangan tertukar dengan 多少 dan 很多."], "contoh": [{"zh": "北京大学有四万多名学生呢！", "py": "Běijīngdàxué yǒu sìwàn duō míng xuéshēng ne!", "id": "Universitas Peking punya lebih dari empat puluh ribu mahasiswa!", "b": true, "tr": "02-3"}, {"zh": "教室里有二十多个学生。", "py": "Jiàoshì lǐ yǒu èrshí duō gè xuéshēng.", "id": "Di kelas ada dua puluh lebih siswa.", "b": true, "tr": null}, {"zh": "这两个苹果五块多钱。", "py": "Zhè liǎng gè píngguǒ wǔ kuài duō qián.", "id": "Dua apel ini lima yuan lebih.", "b": true, "tr": null}, {"zh": "我有二十多本中文书。", "py": "Wǒ yǒu èrshí duō běn Zhōngwén shū.", "id": "Saya punya dua puluh lebih buku bahasa Mandarin.", "b": true, "tr": null}, {"zh": "网上还说北京大学有三千多名外国学生。", "py": "Wǎngshang hái shuō běijīngdàxué yǒu sānqiān duō míng wàiguó xuéshēng.", "id": "Di internet juga dikatakan Universitas Peking punya lebih dari tiga ribu mahasiswa asing.", "b": true, "tr": "02-3"}, {"zh": "这件衣服三百多块。", "py": "Zhè jiàn yīfu sānbǎi duō kuài.", "id": "Baju ini tiga ratus yuan lebih.", "b": false, "tr": null}, {"zh": "我家的小狗三岁多了。", "py": "Wǒ jiā de xiǎogǒu sān suì duō le.", "id": "Anjing kecil saya sudah tiga tahun lebih.", "b": false, "tr": null}, {"zh": "我学中文学了一年多。", "py": "Wǒ xué Zhōngwén xué le yì nián duō.", "id": "Saya sudah belajar bahasa Mandarin s Tā lái Zhōngguó yì duō nián le.", "n": "", "ok": false, "b": "他来中国一年多了。", "bp": "Tā lái Zhōngguó yì nián duō le.", "x": "一 + 年 + 多."}]}, {"id": "2-3", "pel": 2, "judul": "KK, frasa KK, dan frasa S-P sebagai penjelas: 他们卖的电影票", "kode": "动词/动词性短语/主谓短语作定语", "rumus": ["KK/frasa KK + 的 + KB (学中文的学生)", "S + KK + 的 + KB (朋友给我的杯子)", "Penjelas selalu di DEPAN kata benda"], "jelas": ["Dalam bahasa Mandarin, keterangan tentang kata benda selalu diletakkan di depan, disambung dengan 的. Selain kata ganti dan kata sifat, penjelas bisa berupa kata kerja atau frasa kata kerja (学中文的学生 = siswa yang belajar bahasa Mandarin) atau frasa subjek-predikat (朋友给我的杯子 = gelas yang diberikan teman kepada saya).", "Dalam bahasa Indonesia kita memakai \"yang\" dan penjelasnya di BELAKANG: \"tiket film yang mereka jual\". Dalam bahasa Mandarin urutannya terbalik: 他们卖的电影票 = mereka jual + 的 + tiket film. Jadi 的 berperan seperti \"yang\", tetapi posisinya di antara penjelas dan kata benda.", "Cara membuatnya: ambil kalimat lengkap (他们卖电影票), keluarkan kata benda yang ingin dijelaskan (电影票), taruh di belakang, lalu sisipkan 的: 他们卖的 + 电影票. Contoh lain: 你做菜 → 你做的菜 (masakan yang kamu buat); 那个人唱歌 → 唱歌的那个人 / 那个唱歌的人.", "Dengan penjelas berupa frasa kata kerja, 的 WAJIB ada. 他们卖电影票 adalah kalimat (\"mereka menjual tiket film\"), sedangkan 他们卖的电影票 adalah frasa benda (\"tiket film yang mereka jual\"). Tanpa 的, artinya berubah.", "Kata penunjuk + kata satuan bisa di depan atau di belakang penjelas: 那个唱歌的人 atau 唱歌的那个人 keduanya benar. 新来的这个老师 = guru yang baru datang ini.", "Jika kata bendanya sudah jelas, boleh dihilangkan dan tersisa frasa 的 (lihat pelajaran 4): 这是谁的苹果？—我买的。"], "poin": ["Penjelas (KK/frasa KK/S+KK) + 的 + KB.", "Urutan terbalik dari bahasa Indonesia \"KB + yang + …\".", "的 wajib; tanpa 的 menjadi kalimat.", "那个唱歌的人 = 唱歌的那个人."], "contoh": [{"zh": "他们卖的电影票也很便宜。", "py": "Tāmen mài de diànyǐng piào yě hěn piányi.", "id": "Tiket film yang mereka jual juga murah.", "b": true, "tr": "02-5"}, {"zh": "现在学中文的学生很多。", "py": "Xiànzài xué Zhōngwén de xuéshēng hěn duō.", "id": "Sekarang siswa yang belajar bahasa Mandarin banyak.", "b": true, "tr": null}, {"zh": "这是朋友给我的杯子。", "py": "Zhè shì péngyou gěi wǒ de bēizi.", "id": "Ini gelas yang diberikan teman kepada saya.", "b": true, "tr": null}, {"zh": "你认识那个唱歌的人吗？", "py": "Nǐ rènshi nàge chànggē de rén ma?", "id": "Kamu kenal orang yang sedang bernyanyi itu?", "b": true, "tr": null}, {"zh": "这是我买的苹果，很好吃。", "py": "Zhè shì wǒ mǎi de píngguǒ, hěn hǎochī.", "id": "Ini apel yang saya beli, enak sekali.", "b": false, "tr": null}, {"zh": "我很喜欢你做的菜。", "py": "Wǒ hěn xǐhuan nǐ zuò de cài.", "id": "Saya sangat suka masakan yang kamu buat.", "b": false, "tr": null}, {"zh": "新来的这个老师是哪国人？", "py": "Xīn lái de zhège lǎoshī shì nǎ guó rén?", "id": "Guru yang baru datang ini orang negara mana?", "b": false, "tr": null}, {"zh": "你昨天看的电影怎么样？", "py": "Nǐ zuótiān kàn de diànyǐng zěnmeyàng?", "id": "Film yang kamu tonton kemarin bagaimana?", "b": false, "tr": null}, {"zh": "妈妈给我买的衣服很漂亮。", "py": "Māma gěi wǒ mǎi de yīfu hěn piàoliang.", "id": "Baju yang dibelikan ibu untuk saya sangat cantik.", "b": false, "tr": null}, {"zh": "坐在前边的人是我哥哥。", "py": "Zuò zài qiánbian de rén shì wǒ gēge.", "id": "Orang yang duduk di depan itu kakak laki-laki saya.", "b": false, "tr": null}], "salah": [{"s": "电影票他们卖的很便宜。（maksud: tiket film yang mereka jual murah）", "sp": "Diànyǐng piào tāmen mài de hěn piányi. (m a k s u d: t i k e t f i l m y a n g m e r e k a j u a l m u r a h)", "n": "", "b": "他们卖的电影票很便宜。", "bp": "Tāmen mài de diànyǐng piào hěn piányi.", "a": "Penjelas harus di depan kata benda."}, {"s": "我喜欢你做菜。（maksud: masakan yang kamu buat）", "sp": "Wǒ xǐhuan nǐ zuò cài. (m a k s u d: m a s a k a n y a n g k a m u b u a t)", "n": "", "b": "我喜欢你做的菜。", "bp": "Wǒ xǐhuan nǐ zuò de cài.", "a": "Tanpa 的, artinya \"saya suka kamu memasak\"."}, {"s": "学生的学中文很多。", "sp": "Xuéshēng de xué Zhōngwén hěn duō.", "n": "", "b": "学中文的学生很多。", "bp": "Xué Zhōngwén de xuéshēng hěn duō.", "a": "的 di antara penjelas dan kata benda, bukan setelah kata benda."}], "latihan": [{"k": "2-3.0", "t": "pg", "q": "这是朋友给我___杯子。", "o": ["的", "了", "地", "得"], "a": 0, "x": "Frasa S-P + 的 + KB.", "f": "这是朋友给我的杯子。", "fp": "Zhè shì péngyou gěi wǒ de bēizi."}, {"k": "2-3.1", "t": "pg", "q": "\"buku yang saya beli kemarin\" =", "o": ["我昨天买的书", "书我昨天买的", "我昨天的买书", "昨天书我买的"], "a": 0, "x": "Penjelas di depan, 的, lalu kata benda."}, {"k": "2-3.2", "t": "pg", "q": "\"orang yang bernyanyi itu\" yang benar …", "o": ["那个唱歌的人", "人唱歌的那个", "那个人的唱歌", "唱歌那个人的"], "a": 0, "x": "那个 + penjelas + 的 + 人."}, {"k": "2-3.3", "t": "pg", "q": "Mana yang berarti \"Saya suka masakan yang ibu buat\"?", "o": ["我喜欢妈妈做的菜。", "我喜欢妈妈做菜。", "我喜欢菜妈妈做的。", "我喜欢的妈妈做菜。"], "a": 0, "x": "妈妈做的 + 菜."}, {"k": "2-3.4", "t": "pg", "q": "现在___学生很多。（yang belajar bahasa Mandarin）", "o": ["学中文的", "中文学的", "学的中文", "的学中文"], "a": 0, "x": "Frasa KK + 的 + KB."}, {"k": "2-3.5", "t": "pg", "q": "你昨天看___电影怎么样？", "o": ["的", "了", "过", "得"], "a": 0, "x": "你昨天看的 + 电影.", "f": "你昨天看的电影怎么样？", "fp": "Nǐ zuótiān kàn de diànyǐng zěnmeyàng?"}, {"k": "2-3.6", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["他们卖的电影票很便宜。", "这是我买的苹果。", "电影票的他们卖很便宜。", "新来的老师很好。"], "a": 2, "x": "的 harus sebelum kata benda: 他们卖的电影票."}, {"k": "2-3.7", "t": "su", "w": ["他们", "卖", "的", "电影票", "也", "很", "便宜"], "s": "他们卖的电影票也很便宜。", "alt": [], "p": "Tāmen mài de diànyǐng piào yě hěn piányi.", "x": "Tiket film yang mereka jual juga murah."}, {"k": "2-3.8", "t": "su", "w": ["这", "是", "朋友", "给", "我", "的", "杯子"], "s": "这是朋友给我的杯子。", "alt": [], "p": "Zhè shì péngyou gěi wǒ de bēizi.", "x": "Ini gelas yang diberikan teman kepada saya."}, {"k": "2-3.9", "t": "su", "w": ["现在", "学", "中文", "的", "学生", "很", "多"], "s": "现在学中文的学生很多。", "alt": ["学现在中文的学生很多。"], "p": "Xiànzài xué Zhōngwén de xuéshēng hěn duō.", "x": "Sekarang siswa yang belajar bahasa Mandarin banyak."}, {"k": "2-3.10", "t": "su", "w": ["我", "很", "喜欢", "你", "做", "的", "菜"], "s": "我很喜欢你做的菜。", "alt": [], "p": "Wǒ hěn xǐhuan nǐ zuò de cài.", "x": "Saya sangat suka masakan yang kamu buat."}, {"k": "2-3.11", "t": "su", "w": ["你", "认识", "那个", "唱歌", "的", "人", "吗"], "s": "你认识那个唱歌的人吗？", "alt": [], "p": "Nǐ rènshi nàge chànggē de rén ma?", "x": "Kamu kenal orang yang bernyanyi itu?"}, {"k": "2-3.12", "t": "su", "w": ["妈妈", "给", "我", "买", "的", "衣服", "很", "漂亮"], "s": "妈妈给我买的衣服很漂亮。", "alt": [], "p": "Māma gěi wǒ mǎi de yīfu hěn piàoliang.", "x": "Baju yang dibelikan ibu untuk saya sangat cantik."}, {"k": "2-3.13", "t": "bs", "s": "这是我昨天买的书。", "sp": "Zhè shì wǒ zuótiān mǎi de shū.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "2-3.14", "t": "bs", "s": "书我昨天买的很好看。", "sp": "Shū wǒ zuótiān mǎi de hěn hǎokàn.", "n": "", "ok": false, "b": "我昨天买的书很好看。", "bp": "Wǒ zuótiān mǎi de shū hěn hǎokàn.", "x": "Penjelas di depan kata benda."}, {"k": "2-3.15", "t": "bs", "s": "新来的这个老师是中国人。", "sp": "Xīn lái de zhège lǎoshī shì Zhōngguó rén.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "2-3.16", "t": "bs", "s": "我喜欢你做菜很好吃。", "sp": "Wǒ xǐhuan nǐ zuò cài hěn hǎochī.", "n": "", "ok": false, "b": "我觉得你做的菜很好吃。", "bp": "Wǒ juéde nǐ zuò de cài hěn hǎochī.", "x": "Perlu 的: 你做的菜 = masakan yang kamu buat."}, {"k": "2-3.17", "t": "bs", "s": "坐在前边的人是我哥哥。", "sp": "Zuò zài qiánbian de rén shì wǒ gēge.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "3-1", "pel": 3, "judul": "Pelengkap hasil: KK + 完/好/晚/会/懂/见", "kode": "结果补语", "rumus": ["S + KK + pelengkap hasil (+ O) + 了", "Ingkar: S + 没(有) + KK + pelengkap (tanpa 了)", "Tanya: …了吗？ / …(了)没有？ / KK + 没 + KK + pelengkap？"], "jelas": ["Pelengkap hasil adalah kata kerja atau kata sifat yang menempel langsung setelah kata kerja untuk menunjukkan HASIL tindakan. 做 = mengerjakan, 做好 = selesai dikerjakan dengan baik; 吃 = makan, 吃完 = selesai makan/habis; 来 = datang, 来晚 = datang terlambat; 学 = belajar, 学会 = belajar sampai bisa; 看 = melihat/membaca, 看见 = melihat (terlihat), 看懂 = membaca sampai paham.", "Pelengkap yang sering dipakai di HSK 2: 完 (selesai), 好 (beres/baik), 会 (sampai bisa), 懂 (sampai paham), 见 (tertangkap indra: 看见, 听见), 晚 (terlambat), 到 (sampai/berhasil), 错 (salah). Kata kerja dan pelengkapnya menempel erat; objek diletakkan SETELAH pelengkap: 我吃完饭了, bukan 我吃饭完了.", "Bentuk ingkar memakai 没(有) di depan kata kerja dan 了 DIHAPUS: 我没吃完饭。 小雪没来晚。 Jangan memakai 不: 我不吃完饭 salah untuk arti \"belum selesai makan\". Untuk keadaan yang masih berlangsung bisa ditambah 还: 我还没想好呢 (saya belum memutuskan).", "Ada tiga bentuk tanya: (1) tambahkan 了吗: 你吃完饭了吗？ (2) tambahkan (了)没有: 小雪来晚了没有？ (3) KK + 没 + KK + pelengkap: 你学没学会？", "Jebakan pelajar Indonesia: bahasa Indonesia sering cukup memakai kata \"sudah\" (sudah makan, sudah lihat). Bahasa Mandarin membedakan 看 (melihat, aktivitas) dan 看见 (berhasil melihat), 听 dan 听见, 找 dan 找到. 我看了，但是没看见 = saya sudah mencari-cari dengan mata, tetapi tidak melihatnya.", "Kata keterangan seperti 都 dan 已经 diletakkan sebelum kata kerja: 菜都做好了 (masakannya sudah siap semua)."], "poin": ["KK + 完/好/会/懂/见/晚/到/错 = hasil tindakan.", "Objek setelah pelengkap: 吃完饭.", "Ingkar: 没 + KK + pelengkap, tanpa 了.", "Tanya: 了吗 / 没有 / KK没KK+pelengkap."], "contoh": [{"zh": "菜都做好了。", "py": "Cài dōu zuò hǎo le.", "id": "Masakannya sudah siap semua.", "b": true, "tr": "03-1"}, {"zh": "小雪今天来晚了。", "py": "Xiǎoxuě jīntiān lái wǎn le.", "id": "Xiaoxue hari ini datang terlambat.", "b": true, "tr": null}, {"zh": "我没吃完饭。", "py": "Wǒ méi chī wán fàn.", "id": "Saya belum selesai makan.", "b": true, "tr": null}, {"zh": "小雪没来晚。", "py": "Xiǎoxuě méi lái wǎn.", "id": "Xiaoxue tidak datang terlambat.", "b": true, "tr": null}, {"zh": "你吃完饭了吗？", "py": "Nǐ chī wán fàn le ma?", "id": "Kamu sudah selesai makan?", "b": true, "tr": null}, {"zh": "小雪来晚了没有？", "py": "Xiǎoxuě lái wǎn le méiyǒu?", "id": "Xiaoxue datang terlambat atau tidak?", "b": true, "tr": null}, {"zh": "你学没学会？", "py": "Nǐ xué méi xué huì?", "id": "Kamu sudah bisa belum?", "b": true, "tr": null}, {"zh": "工作太多了，下班的时候没做完。", "py": "Gōngzuò tài duō le, xiàbān de shíhou méi zuò wán.", "id": "Pekerjaannya terlalu banyak, waktu pulang kerja belum selesai.", "b": true, "tr": "03-1"}, {"zh": "我还没想好呢。", "py": "Wǒ hái méi xiǎng hǎo ne.", "id": "Saya belum memutuskan.", "b": true, "tr": "03-3"}, {"zh": "我吃完饭了。", "py": "Wǒ chī wán fàn le.", "id": "Saya sudah selesai makan.", "b": true, "tr": null}, {"zh": "这本书我没看懂，有很多问题。", "py": "Zhè běn shū wǒ méi kàn dǒng, yǒu hěn duō wèntí.", "id": "Buku ini tidak saya pahami, ada banyak pertanyaan.", "b": false, "tr": null}, {"zh": "老师，我写完了。", "py": "Lǎoshī, wǒ xiě wán le.", "id": "Bu guru, saya sudah selesai menulis.", "b": false, "tr": null}, {"zh": "我没看见你的手机。", "py": "Wǒ méi kànjiàn nǐ de shǒujī.", "id": "Saya tidak melihat HP-mu.", "b": false, "tr": null}], "salah": [{"s": "我吃饭完了。", "sp": "Wǒ chīfàn wán le.", "n": "", "b": "我吃完饭了。", "bp": "Wǒ chī wán fàn le.", "a": "Pelengkap menempel pada kata kerja; objek di belakang."}, {"s": "我没吃完饭了。", "sp": "Wǒ méi chī wán fàn le.", "n": "", "b": "我没吃完饭。", "bp": "Wǒ méi chī wán fàn.", "a": "Kalimat ingkar dengan 没 tidak memakai 了."}, {"s": "我不看懂这本书。（maksud: saya tidak paham isi buku ini）", "sp": "Wǒ bú kàn dǒng zhè běn shū. (m a k s u d: s a y a t i d a k p a h a m i s i b u k u i n i)", "n": "", "b": "我没看懂这本书。", "bp": "Wǒ méi kàn dǒng zhè běn shū.", "a": "Hasil yang tidak tercapai diingkari dengan 没."}], "latihan": [{"k": "3-1.0", "t": "pg", "q": "菜都做___了，过来吃饭吧。", "o": ["好", "见", "会", "晚"], "a": 0, "x": "做好 = selesai dimasak.", "f": "菜都做好了，过来吃饭吧。", "fp": "Cài dōu zuò hǎo le, guòlái chīfàn ba."}, {"k": "3-1.1", "t": "pg", "q": "Ingkar dari 我吃完饭了。", "o": ["我没吃完饭。", "我不吃完饭。", "我没吃完饭了。", "我吃没完饭。"], "a": 0, "x": "没 + KK + pelengkap, tanpa 了."}, {"k": "3-1.2", "t": "pg", "q": "你学___学会？", "o": ["没", "不", "了", "过"], "a": 0, "x": "Tanya: KK + 没 + KK + pelengkap.", "f": "你学没学会？", "fp": "Nǐ xué méi xué huì?"}, {"k": "3-1.3", "t": "pg", "q": "我找了，但是没看___你的书。", "o": ["见", "完", "会", "晚"], "a": 0, "x": "看见 = berhasil melihat.", "f": "我找了，但是没看见你的书。", "fp": "Wǒ zhǎo le, dànshì méi kànjiàn nǐ de shū."}, {"k": "3-1.4", "t": "pg", "q": "\"Xiaoxue hari ini datang terlambat.\" =", "o": ["小雪今天来晚了。", "小雪今天晚来了。", "小雪来今天晚了。", "小雪今天来了晚。"], "a": 0, "x": "来晚 = datang terlambat; waktu sebelum kata kerja."}, {"k": "3-1.5", "t": "pg", "q": "A：这本书你看懂了吗？ B：___，我有很多问题。", "o": ["没看懂", "不看懂", "看没懂", "没懂看"], "a": 0, "x": "Ingkar: 没 + 看懂."}, {"k": "3-1.6", "t": "pg", "q": "Mana yang SALAH?", "o": ["我写完作业了。", "我吃饭完了。", "你听见了吗？", "他学会了。"], "a": 1, "x": "Objek setelah pelengkap: 吃完饭."}, {"k": "3-1.7", "t": "su", "w": ["菜", "都", "做", "好", "了"], "s": "菜都做好了。", "alt": [], "p": "Cài dōu zuò hǎo le.", "x": "Masakannya sudah siap semua."}, {"k": "3-1.8", "t": "su", "w": ["我", "没", "吃", "完", "饭"], "s": "我没吃完饭。", "alt": [], "p": "Wǒ méi chī wán fàn.", "x": "Saya belum selesai makan."}, {"k": "3-1.9", "t": "su", "w": ["你", "吃", "完", "饭", "了", "吗"], "s": "你吃完饭了吗？", "alt": [], "p": "Nǐ chī wán fàn le ma?", "x": "Kamu sudah selesai makan?"}, {"k": "3-1.10", "t": "su", "w": ["小雪", "今天", "来", "晚", "了"], "s": "小雪今天来晚了。", "alt": ["今天小雪来晚了。"], "p": "Xiǎoxuě jīntiān lái wǎn le.", "x": "Xiaoxue hari ini datang terlambat."}, {"k": "3-1.11", "t": "su", "w": ["我", "还", "没", "想", "好", "呢"], "s": "我还没想好呢。", "alt": [], "p": "Wǒ hái méi xiǎng hǎo ne.", "x": "Saya belum memutuskan."}, {"k": "3-1.12", "t": "su", "w": ["你", "看", "懂", "这", "本", "书", "了", "吗"], "s": "你看懂这本书了吗？", "alt": [], "p": "Nǐ kàn dǒng zhè běn shū le ma?", "x": "Kamu sudah paham buku ini?"}, {"k": "3-1.13", "t": "bs", "s": "我吃完饭了。", "sp": "Wǒ chī wán fàn le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "3-1.14", "t": "bs", "s": "我没做完了。", "sp": "Wǒ méi zuò wán le.", "n": "", "ok": false, "b": "我没做完。", "bp": "Wǒ méi zuò wán.", "x": "Tanpa 了 dalam kalimat ingkar."}, {"k": "3-1.15", "t": "bs", "s": "你学没学会？", "sp": "Nǐ xué méi xué huì?", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: bentuk tanya ketiga."}, {"k": "3-1.16", "t": "bs", "s": "我看书完了。", "sp": "Wǒ kàn shū wán le.", "n": "", "ok": false, "b": "我看完书了。", "bp": "Wǒ kàn wán shū le.", "x": "Pelengkap 完 langsung setelah kata kerja, objek di belakangnya."}, {"k": "3-1.17", "t": "bs", "s": "小雪没来晚。", "sp": "Xiǎoxuě méi lái wǎn.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "3-2", "pel": 3, "judul": "Pengulangan kata kerja (1): AA / A一A / ABAB / AAB", "kode": "动词重叠（1）", "rumus": ["KK satu suku: A(一)A — 想想 / 想一想", "KK dua suku: ABAB — 休息休息", "KK pisah (离合词): AAB — 帮帮忙"], "jelas": ["Kata kerja tindakan yang bisa diulang atau berlangsung beberapa saat dapat digandakan untuk menyatakan tindakan yang singkat, sedikit, atau sekadar mencoba. Nadanya santai dan akrab, banyak dipakai dalam bahasa lisan. Mirip \"lihat-lihat\", \"coba pikir\", \"istirahat sebentar\" dalam bahasa Indonesia.", "Kata kerja satu suku kata: AA atau A一A. 想想 = 想一想 (coba pikirkan), 看看 = 看一看, 试试 = 试一试. Suku kedua dan 一 diucapkan ringan (nada netral).", "Kata kerja dua suku kata: ABAB, BUKAN AABB. 休息休息 (istirahat sebentar), 介绍介绍 (perkenalkan sedikit), 学习学习. AABB adalah pola kata SIFAT (高高兴兴), jangan dicampur.", "Kata kerja pisah (离合词: KK + O yang menyatu, seperti 帮忙, 洗手, 跑步, 唱歌, 聊天儿) diulang dengan pola AAB: 帮帮忙, 洗洗手, 跑跑步, 唱唱歌, 聊聊天儿. Yang diulang hanya bagian kata kerjanya.", "Pengulangan sering dipakai dalam permintaan dan saran agar terdengar lebih halus: 你能过来帮帮忙吗？ 你试试那条红色的吧。 Kata kerja yang tidak menunjukkan tindakan (是, 有, 在, 喜欢, 认识, 知道) tidak diulang.", "Kata kerja yang diulang tidak bisa diikuti pelengkap jumlah atau hasil lagi: 看看一下 salah; pilih 看看 atau 看一下. Untuk tindakan yang sudah terjadi, polanya berbeda (A了A), lihat topik berikutnya."], "poin": ["Arti: sebentar, sedikit, mencoba; nada santai.", "Satu suku: AA / A一A (想一想).", "Dua suku: ABAB (休息休息), bukan AABB.", "Kata kerja pisah: AAB (帮帮忙, 洗洗手)."], "contoh": [{"zh": "那你再想一想，你想好了，我来买票。", "py": "Nà nǐ zài xiǎng yì xiǎng, nǐ xiǎng hǎo le, wǒ lái mǎi piào.", "id": "Kalau begitu pikirkan lagi; kalau sudah kamu putuskan, aku yang beli tiketnya.", "b": true, "tr": "03-3"}, {"zh": "我有点儿累，现在想休息休息。", "py": "Wǒ yǒudiǎnr lèi, xiànzài xiǎng xiūxi xiūxi.", "id": "Saya agak capek, sekarang mau istirahat sebentar.", "b": true, "tr": null}, {"zh": "你能过来帮帮忙吗？", "py": "Nǐ néng guòlái bāng bāngmáng ma?", "id": "Bisa ke sini bantu sebentar?", "b": true, "tr": null}, {"zh": "我想休息休息。", "py": "Wǒ xiǎng xiūxi xiūxi.", "id": "Saya mau istirahat sebentar.", "b": true, "tr": null}, {"zh": "我们进去看看吧。", "py": "Wǒmen jìnqù kànkan ba.", "id": "Ayo kita masuk melihat-lihat.", "b": true, "tr": "04-1"}, {"zh": "我去洗洗手。", "py": "Wǒ qù xǐ xǐ shǒu.", "id": "Saya mau cuci tangan dulu.", "b": true, "tr": "03-5"}, {"zh": "你试试那条红色的吧。", "py": "Nǐ shì shì nà tiáo hóngsè de ba.", "id": "Coba yang merah itu.", "b": true, "tr": "04-3"}, {"zh": "真想让他休息休息。", "py": "Zhēn xiǎng ràng tā xiūxi xiūxi.", "id": "Sungguh ingin membuatnya istirahat sebentar.", "b": true, "tr": "03-7"}, {"zh": "你给我们介绍介绍你的家吧。", "py": "Nǐ gěi wǒmen jièshào jièshào nǐ de jiā ba.", "id": "Ceritakan sedikit tentang keluargamu kepada kami.", "b": false, "tr": null}, {"zh": "这个问题你去问问老师吧。", "py": "Zhège wèntí nǐ qù wèn wèn lǎoshī ba.", "id": "Pertanyaan ini coba tanyakan ke guru.", "b": false, "tr": null}, {"zh": "周末我们一起去跑跑步吧。", "py": "Zhōumò wǒmen yìqǐ qù pǎo pǎobù ba.", "id": "Akhir pekan ayo kita lari-lari bersama.", "b": false, "tr": null}, {"zh": "让我听听这首歌。", "py": "Ràng wǒ tīng tīng zhè shǒu gē.", "id": "Biar saya dengarkan lagu ini.", "b": false, "tr": null}], "salah": [{"s": "我想休休息息。", "sp": "Wǒ xiǎng xiū xiūxi xī.", "n": "", "b": "我想休息休息。", "bp": "Wǒ xiǎng xiūxi xiūxi.", "a": "Kata kerja dua suku diulang ABAB."}, {"s": "你能过来帮忙帮忙吗？", "sp": "Nǐ néng guòlái bāngmáng bāngmáng ma?", "n": "", "b": "你能过来帮帮忙吗？", "bp": "Nǐ néng guòlái bāng bāngmáng ma?", "a": "Kata kerja pisah 帮忙 diulang AAB."}, {"s": "我喜欢喜欢她。", "sp": "Wǒ xǐhuan xǐhuan tā.", "n": "", "b": "我喜欢她。", "bp": "Wǒ xǐhuan tā.", "a": "喜欢 bukan kata kerja tindakan; tidak diulang."}], "latihan": [{"k": "3-2.0", "t": "pg", "q": u kejadiannya."], "poin": ["Sudah terjadi + satu suku: A了A (看了看).", "Dua suku: AB了一下 (休息了一下).", "Kata kerja pisah: A了AB (帮了帮忙).", "了 selalu setelah suku kata kerja pertama."], "contoh": [{"zh": "我看了看网上的介绍。", "py": "Wǒ kàn le kàn wǎngshang de jièshào.", "id": "Saya sudah melihat-lihat informasinya di internet.", "b": true, "tr": "03-5"}, {"zh": "我休息了一下，现在觉得不累了。", "py": "Wǒ xiūxi le yíxià, xiànzài juéde bú lèi le.", "id": "Saya sudah istirahat sebentar, sekarang tidak capek lagi.", "b": true, "tr": null}, {"zh": "他昨天来帮了帮忙。", "py": "Tā zuótiān lái bāng le bāngmáng.", "id": "Kemarin dia datang membantu sebentar.", "b": true, "tr": null}, {"zh": "我看了看这本书。", "py": "Wǒ kàn le kàn zhè běn shū.", "id": "Saya sudah membaca-baca buku ini.", "b": true, "tr": null}, {"zh": "妈妈让我试了试，我觉得我穿红色的也很好看。", "py": "Māma ràng wǒ shì le shì, wǒ juéde wǒ chuān hóngsè de yě hěn hǎokàn.", "id": "Ibu menyuruh saya mencoba, saya rasa saya juga cocok memakai warna merah.", "b": true, "tr": "04-7"}, {"zh": "他想了想，说：“好吧。”", "py": "Tā xiǎng le xiǎng, shuō: \"Hǎo ba.\"", "id": "Dia berpikir sebentar, lalu berkata: \"Baiklah.\"", "b": false, "tr": null}, {"zh": "我在桌子上找了找，但是没有找到。", "py": "Wǒ zài zhuōzi shàng zhǎo le zhǎo, dànshì méiyǒu zhǎo dào.", "id": "Saya sudah mencari-cari di atas meja, tetapi tidak ketemu.", "b": false, "tr": null}, {"zh": "老师给我们介绍了一下北京。", "py": "Lǎoshī gěi wǒmen jièshào le yíxià Běijīng.", "id": "Guru memperkenalkan sedikit tentang Beijing kepada kami.", "b": false, "tr": null}, {"zh": "吃完饭，我们在外边走了走。", "py": "Chī wán fàn, wǒmen zài wàibian zǒu le zǒu.", "id": "Selesai makan, kami jalan-jalan sebentar di luar.", "b": false, "tr": null}, {"zh": "他洗了洗手，就去吃饭了。", "py": "Tā xǐ le xǐ shǒu, jiù qù chīfàn le.", "id": "Dia cuci tangan sebentar, lalu pergi makan.", "b": false, "tr": null}, {"zh": "昨天下午我在房间看了看书。", "py": "Zuótiān xiàwǔ wǒ zài fángjiān kàn le kàn shū.", "id": "Kemarin sore saya membaca-baca buku di kamar.", "b": false, "tr": null}], "salah": [{"s": "我看看了网上的介绍。", "sp": "Wǒ kànka ……，所以……", "kode": "因果复句\"因为……，所以……\"", "rumus": ["因为 + sebab，所以 + akibat", "Boleh hanya 因为…，… atau …，所以…", "Tanya sebab: 为什么……？ — 因为……"], "jelas": ["因为 (karena) mengantar sebab, 所以 (maka/jadi) mengantar akibat. Kalimatnya: 因为我生病了，所以没去上班 = karena saya sakit, (maka) saya tidak masuk kerja.", "Dalam bahasa Indonesia, kita jarang memakai \"karena … maka …\" sekaligus; tetapi dalam bahasa Mandarin pasangan 因为……所以…… sangat wajar. Kedua kata juga boleh dipakai sendiri-sendiri: 因为我生病了，今天没去上班。 / 我没去过他家，所以让他来车站接我。", "Urutan yang paling umum: sebab dulu, lalu akibat. Kata 因为 dan 所以 diletakkan di awal klausanya masing-masing, atau setelah subjek: 我因为生病，没去上班。", "Untuk menjawab pertanyaan 为什么 (mengapa), jawab dengan 因为……: 你为什么还买白色的？—因为我喜欢白色啊！ Jangan menjawab dengan 所以.", "就是因为……，所以…… memberi penekanan \"justru karena …\": 就是因为没穿过，所以要试试啊！", "Jebakan pelajar Indonesia: jangan menulis 所以 di awal kalimat sebab (\"所以我生病了\") karena terbalik artinya. Ingat: 因为 = sebab, 所以 = akibat."], "poin": ["因为 = karena (sebab); 所以 = jadi/maka (akibat).", "Boleh dipakai berpasangan atau salah satu.", "Jawaban 为什么 dimulai dengan 因为.", "就是因为…所以… = justru karena …"], "contoh": [{"zh": "就是因为没穿过，所以要试试啊！", "py": "Jiù shì yīnwèi méi chuān guò, suǒyǐ yào shì shì a!", "id": "Justru karena belum pernah pakai, makanya harus dicoba!", "b": true, "tr": "04-3"}, {"zh": "因为我生病了，今天没去上班。", "py": "Yīnwèi wǒ shēngbìng le, jīntiān méi qù shàngbān.", "id": "Karena saya sakit, hari ini saya tidak masuk kerja.", "b": true, "tr": null}, {"zh": "我没去过他家，所以让他来车站接我。", "py": "Wǒ méi qù guò tā jiā, suǒyǐ ràng tā lái chēzhàn jiē wǒ.", "id": "Saya belum pernah ke rumahnya, jadi saya memintanya menjemput saya di stasiun.", "b": true, "tr": null}, {"zh": "因为我生病了，所以没去上班。", "py": "Yīnwèi wǒ shēngbìng le, suǒyǐ méi qù shàngbān.", "id": "Karena saya sakit, jadi saya tidak masuk kerja.", "b": true, "tr": null}, {"zh": "因为我喜欢白色啊！", "py": "Yīnwèi wǒ xǐhuan báisè a!", "id": "Karena saya suka warna putih!", "b": true, "tr": "04-3"}, {"zh": "因为是新开的，所以这几天东西很便宜。", "py": "Yīnwèi shì xīn kāi de, suǒyǐ zhè jǐ tiān dōngxi hěn piányi.", "id": "Karena baru buka, jadi beberapa hari ini barangnya murah.", "b": true, "tr": "04-7"}, {"zh": "因为今天下雨，所以我们没出去玩。", "py": "Yīnwèi jīntiān xià yǔ, suǒyǐ wǒmen méi chūqù wán.", "id": "Karena hari ini hujan, jadi kami tidak keluar bermain.", "b": false, "tr": null}, {"zh": "他很累，所以早早地睡觉了。", "py": "Tā hěn lèi, suǒyǐ zǎo zǎo dì shuìjiào le.", "id": "Dia sangat capek, jadi dia tidur lebih awal.", "b": false, "tr": null}, {"zh": "你为什么想去西安？——因为那儿很漂亮。", "py": "Nǐ wèishénme xiǎng qù Xī'ān? — Yīnwèi nàr hěn piàoliang.", "id": "Kenapa kamu ingin ke Xi'an? — Karena di sana sangat indah.", "b": false, "tr": null}, {"zh": "因为工作太多了，所以他回来得很晚。", "py": "Yīnwèi gōngzuò tài duō le, suǒyǐ tā huílái de hěn wǎn.", "id": "Karena pekerjaannya terlalu banyak, jadi dia pulang larut.", "b": false, "tr": null}], "salah": [{"s": "所以我生病了，因为没去上班。", "sp": "Suǒyǐ wǒ shēngbìng le, yīnwèi méi qù shàngbān.", "n": "", "b": "因为我生病了，所以没去上班。", "bp": "Yīnwèi wǒ shēngbìng le, suǒyǐ méi qù shàngbān.", "a": "因为 untuk sebab, 所以 untuk akibat."}, {"s": "你为什么不来？——所以我很忙。", "sp": "Nǐ wèishénme bù lái? — Suǒyǐ wǒ hěn máng.", "n": "", "b": "你为什么不来？——因为我很忙。", "bp": "Nǐ wèishénme bù lái? — Yīnwèi wǒ hěn máng.", "a": "Jawaban 为什么 memakai 因为."}], "latihan": [{"k": "4-2.0", "t": "pg", "q": "___我生病了，所以今天没去上班。", "o": ["因为", "所以", "但是", "还是"], "a": 0, "x": "Sebab diantar 因为.", "f": "因为我生病了，所以今天没去上班。", "fp": "Yīnwèi wǒ shēngbìng le, suǒyǐ jīntiān méi qù shàngbān."}, {"k": "4-2.1", "t": "pg", "q": "我没去过他家，___让他来车站接我。", "o": ["所以", "因为", "虽然", "可是吧"], "a": 0, "x": "Akibat diantar 所以.", "f": "我没去过他家，所以让他来车站接我。", "fp": "Wǒ méi qù guò tā jiā, suǒyǐ ràng tā lái chēzhàn jiē wǒ."}, {"k": "4-2.2", "t": "pg", "q": "A：你为什么还买白色的？ B：___我喜欢白色啊！", "o": ["因为", "所以", "但是", "还是"], "a": 0, "x": "Jawaban 为什么: 因为."}, {"k": "4-2.3", "t": "pg", "q": "Mana yang urutannya benar?", "o": ["因为下雨，所以我们没去。", "所以下雨，因为我们没去。", "因为我们没去，所以下雨。", "下雨所以，因为我们没去。"], "a": 0, "x": "Sebab (下雨) → akibat (没去)."}, {"k": "4-2.4", "t": "pg", "q": "就是因为没穿过，___要试试啊！", "o": ["所以", "因为", "但是", "就"], "a": 0, "x": "就是因为……所以…….", "f": "就是因为没穿过，所以要试试啊！", "fp": "Jiù shì yīnwèi méi chuān guò, suǒyǐ yào shì shì a!"}, {"k": "4-2.5", "t": "pg", "q": "\"Karena dia sangat capek, jadi dia tidur lebih awal.\" =", "o": ["因为他很累，所以早早地睡觉了。", "所以他很累，因为早早地睡觉了。", "因为他早早地睡觉了，所以很累。", "他很累因为，所以早早地睡觉了。"], "a": 0, "x": "因为 + sebab，所以 + akibat."}, {"k": "4-2.6", "t": "pg", "q": "因为是新开的，___这几天东西很便宜。", "o": ["所以", "因为", "虽然", "还是"], "a": 0, "x": "Akibat: 所以.", "f": "因为是新开的，所以这几天东西很便宜。", "fp": "Yīnwèi shì xīn kāi de, suǒyǐ zhè jǐ tiān dōngxi hěn piányi."}, {"k": "4-2.7", "t": "su", "w": ["因为", "我", "生病", "了，", "所以", "没", "去", "上班"], "s": "因为我生病了，所以没去上班。", "alt": [], "p": "Yīnwèi wǒ shēngbìng le, suǒyǐ méi qù shàngbān.", "x": "Karena saya sakit, jadi saya tidak masuk kerja."}, {"k": "4-2.8", "t": "su", "w": ["我", "没去过", "他", "家，", "所以", "让", "他", "来接", "我"], "s": "我没去过他家，所以让他来接我。", "alt": [], "p": "Wǒ méi qù guò tā jiā, suǒyǐ ràng tā lái jiē wǒ.", "x": "Saya belum pernah ke rumahnya, jadi saya memintanya menjemput saya."}, {"k": "4-2.9", "t": "su", "w": ["因为", "今天", "下雨，", "所以", "我们", "没", "出去"], "s": "因为今天下雨，所以我们没出去。", "alt": ["今天因为下雨，所以我们没出去。"], "p": "Yīnwèi jīntiān xià yǔ, suǒyǐ wǒmen méi chūqù.", "x": "Karena hari ini hujan, jadi kami tidak keluar."}, {"k": "4-2.10", "t": "su", "w": ["因为", "我", "喜欢", "白色", "啊"], "s": "因为我喜欢白色啊。", "alt": [], "p": "Yīnwèi wǒ xǐhuan báisè a.", "x": "Karena saya suka warna putih!"}, {"k": "4-2.11", "t": "su", "w": ["因为", "那儿", "很", "漂亮"], "s": "因为那儿很漂亮。", "alt": [], "p": "Yīnwèi nàr hěn piàoliang.", "x": "Karena di sana sangat indah."}, {"k": "4-2.12", "t": "su", "w": ["就是", "因为", "没", "穿", "过，", "所以", "要", "试试"], "s": "就是因为没穿过，所以要试试。", "alt": [], "p": "Jiù shì yīnwèi méi chuān guò, suǒyǐ yào shì shì.", "x": "Justru karena belum pernah pakai, makanya harus dicoba."}, {"k": "4-2.13", "t": "bs", "s": "因为我生病了，今天没去上班。", "sp": "Yīnwèi wǒ shēngbìng le, jīntiān méi qù shàngbān.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 因为 boleh dipakai sendiri."}, {"k": "4-2.14", "t": "bs", "s": "所以我很忙，因为没去。", "sp": "Suǒyǐ wǒ hěn máng, yīnwèi méi qù.", "n": "", "ok": false, "b": "因为我很忙，所以没去。", "bp": "Yīnwèi wǒ hěn máng, suǒyǐ méi qù.", "x": "Sebab dengan 因为, akibat dengan 所以."}, {"k": "4-2.15", "t": "bs", "s": "他很累，所以早早地睡觉了。", "sp": "Tā hěn lèi, suǒyǐ zǎo zǎo dì shuìjiào le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 所以 boleh dipakai sendiri."}, {"k": "4-2.16", "t": "bs", "s": "你为什么不来？——所以我生病了。", "sp": "Nǐ wèishénme bù lái? — Suǒyǐ wǒ shēngbìng le.", "n": "", "ok": false, "b": "你为什么不来？——因为我生病了。", "bp": "Nǐ wèishénme bù lái? — Yīnwèi wǒ shēngbìng le.", "x": "Menjawab 为什么 dengan 因为."}, {"k": "4-2.17", "t": "bs", "s": "因为是新开的，所以这几天东西很便宜。", "sp": "Yīnwèi shì xīn kāi de, suǒyǐ zhè jǐ tiān dōngxi hěn piányi.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "4-3", "pel": 4, "judul": "Frasa 的: 红色的 = yang merah", "kode": "\"的\"字短语", "rumus": ["KB / KG / KK / KS + 的 = \"yang …\" (kata benda dihilangkan)", "红色的 = 红色的书包", "妈妈买的 = 妈妈买的面包"], "jelas": ["Jika kata benda sudah jelas dari konteks, kata benda setelah 的 boleh dihilangkan. Frasa yang tersisa (… + 的) berfungsi seperti kata benda dan artinya \"yang …\": 红色的 = yang merah, 妈妈买的 = yang dibeli ibu, 便宜的 = yang murah, 我的 = punya saya.", "Bagian di depan 的 bisa berupa kata benda (木头的), kata ganti (我的, 他的), kata sifat (新的, 便宜的, 红色的), kata kerja atau frasa kata kerja (买的, 新开的, 妈妈做的).", "Bahasa Indonesia punya pola yang sangat mirip: \"yang merah\", \"yang murah\", \"yang dibeli Papa\". Bedanya hanya posisi: 的 di BELAKANG, sedangkan \"yang\" di depan. 红色的 = merah + 的 = yang merah.", "Frasa 的 bisa menjadi subjek atau objek: 红色的好看 (yang merah bagus), 我要那件便宜的 (saya mau yang murah itu), 这是新开的 (ini yang baru buka). Kata penunjuk dan satuan boleh di depannya: 那条红色的, 这个大的.", "Pastikan pendengar tahu benda yang dimaksud. Jika belum jelas, sebutkan kata bendanya lengkap: 红色的书包.", "Jangan lupa 的. 我要红色 berarti \"saya mau warna merah (warnanya)\", sedangkan 我要红色的 berarti \"saya mau yang merah (barangnya)\"."], "poin": ["… + 的 = \"yang …\"; kata benda dihilangkan.", "Depan 的: KB, KG, KS, KK, frasa KK.", "Bisa menjadi subjek atau objek.", "红色 (warna) ≠ 红色的 (barang yang merah)."], "contoh": [{"zh": "红色的、绿色的、黑色的，你想买哪个？", "py": "Hóngsè de, lǜsè de, hēisè de, nǐ xiǎng mǎi nǎge?", "id": "Yang merah, yang hijau, yang hitam, kamu mau beli yang mana?", "b": true, "tr": "04-5"}, {"zh": "这个面包是爸爸买的，妈妈买的在那儿。", "py": "Zhège miànbāo shì bàba mǎi de, māma mǎi de zài nàr.", "id": "Roti ini yang dibeli Papa; yang dibeli Mama ada di sana.", "b": true, "tr": null}, {"zh": "这件衣服太贵了，还是买那件便宜的吧。", "py": "Zhè jiàn yīfu tài guì le, háishi mǎi nà jiàn piányi de ba.", "id": "Baju ini terlalu mahal, beli yang murah itu saja.", "b": true, "tr": null}, {"zh": "红色的好看。", "py": "Hóngsè de hǎokàn.", "id": "Yang merah bagus.", "b": true, "tr": "04-3"}, {"zh": "我觉得这条白色的不太好看，你试试那条红色的吧。", "py": "Wǒ juéde zhè tiáo báisè de bú tài hǎokàn, nǐ shì shì nà tiáo hóngsè de ba.", "id": "Menurut saya yang putih ini kurang bagus, coba yang merah itu.", "b": true, "tr": "04-3"}, {"zh": "没来过，这是新开的。", "py": "Méi lái guò, zhè shì xīn kāi de.", "id": "Belum pernah, ini yang baru buka.", "b": true, "tr": "04-1"}, {"zh": "绿色的吧。——不错，我也觉得绿色的更好看。", "py": "Lǜsè de ba. — Búcuò, wǒ yě juéde lǜsè de gèng hǎokàn.", "id": "Yang hijau saja. — Bagus, saya juga merasa yang hijau lebih bagus.", "b": true, "tr": "04-5"}, {"zh": "桌子上那本是你的吗？", "py": "Zhuōzi shàng nà běn shì nǐ de ma?", "id": "Yang di atas meja itu punyamu?", "b": false, "tr": null}, {"zh": "我要这个大的。", "py": "Wǒ yào zhège dà de.", "id": "Saya mau yang besar ini.", "b": false, "tr": null}, {"zh": "今天的饭菜是爸爸做的，我更喜欢吃妈妈做的。", "py": "Jīntiān de fàn cài shì bàba zuò de, wǒ gèng xǐhuan chī māma zuò de.", "id": "Masakan hari ini yang dibuat Papa; saya lebih suka yang dibuat Mama.", "b": false, "tr": null}, {"zh": "这些书不是我的，是老师的。", "py": "Zhèxiē shū bú shì wǒ de, shì lǎoshī de.", "id": "Buku-buku ini bukan punya saya, punya guru.", "b": false, "tr": null}], "salah": [{"s": "我要买红色。（maksud: saya mau beli yang merah）", "sp": "Wǒ yào mǎi hóngsè. (m a k s u d: s a y a m a u b e l i y a n g m e r a h)", "n": "", "b": "我要买红色的。", "bp": "Wǒ yào mǎi hóngsè de.", "a": "Tanpa 的, 红色 hanya berarti warnanya."}, {"s": "的便宜我买。", "sp": "De piányi wǒ mǎi.", "n": "", "b": "我买便宜的。", "bp": "Wǒ mǎi piányi de.", "a": "的 di belakang penjelas: 便宜的."}, {"s": "这是妈妈的买。", "sp": "Zhè shì māma de mǎi.", "n": "", "b": "这是妈妈买的。", "bp": "Zhè shì māma mǎi de.", "a": "Frasa KK: 妈妈买 + 的."}], "latihan": [{"k": "4-3.0", "t": "pg", "q": "这件衣服太贵了，还是买那件便宜___吧。", "o": ["的", "地", "得", "了"], "a": 0, "x": "便宜的 = yang murah.", "f": "这件衣服太贵了，还是买那件便宜的吧。", "fp": "Zhè jiàn yīfu tài guì le, háishi mǎi nà jiàn piányi de ba."}, {"k": "4-3.1", "t": "pg", "q": "这个面包是爸爸买的，妈妈___在那儿。", "o": ["买的", "的买", "买", "买了"], "a": 0, "x": "妈妈买的 = yang dibeli ibu.", "f": "这个面包是爸爸买的，妈妈买的在那儿。", "fp": "Zhège miànbāo shì bàba mǎi de, māma mǎi de zài nàr."}, {"k": "4-3.2", "t": "pg", "q": "\"Yang merah bagus.\" =", "o": ["红色的好看。", "红色好看的。", "的红色好看。", "好看红色的。"], "a": 0, "x": "Frasa 的 sebagai subjek."}, {"k": "4-3.3", "t": "pg", "q": "A：你看见我的书了吗？ B：桌子上那本是___吗？", "o": ["你的", "你", "的你", "你是"], "a": 0, "x": "你的 = punyamu."}, {"k": "4-3.4", "t": "pg", "q": "Apa arti 我更喜欢吃妈妈做的。", "o": ["Saya lebih suka makan yang dibuat ibu.", "Saya lebih suka makan dengan ibu.", "Ibu lebih suka masak.", "Saya suka ibu memasak."], "a": 0, "x": "妈妈做的 = (masakan) yang dibuat ibu."}, {"k": "4-3.5", "t": "pg", "q": "Mana yang SALAH?", "o": ["我要大的。", "这是新开的。", "这本书是老师的。", "我要买的红色。"], "a": 3, "x": "Yang benar: 我要买红色的。"}, {"k": "4-3.6", "t": "pg", "q": "红色的、绿色的、黑色的，你想买___？", "o": ["哪个", "什么的", "哪儿", "谁"], "a": 0, "x": "Memilih benda: 哪个.", "f": "红色的、绿色的、黑色的，你想买哪个？", "fp": "Hóngsè de, lǜsè de, hēisè de, nǐ xiǎng mǎi nǎge?"}, {"k": "4-3.7", "t": "su", "w": ["红色", "的", "好看"], "s": "红色的好看。", "alt": [], "p": "Hóngsè de hǎokàn.", "x": "Yang merah bagus."}, {"k": "4-3.8", "t": "su", "w": ["这", "是", "新", "开", "的"], "s": "这是新开的。", "alt": [], "p": "Zhè shì xīn kāi de.", "x": "Ini yang baru buka."}, {"k": "4-3.9", "t": "su", "w": ["还是", "买", "那", "件", "便宜", "的", "吧"], "s": "还是买那件便宜的吧。", "alt": [], "p": "Háishi mǎi nà jiàn piányi de ba.", "x": "Beli yang murah itu saja."}, {"k": "4-3.10", "t": "su", "w": ["妈妈", "买", "的", "在", "那儿"], "s": "妈妈买的在那儿。", "alt": [], "p": "Māma mǎi de zài nàr.", "x": "Yang dibeli ibu ada di sana."}, {"k": "4-3.11", "t": "su", "w": ["我", "也", "觉得", "绿色", "的", "更", "好看"], "s": "我也觉得绿色的更好看。", "alt": [], "p": "Wǒ yě juéde lǜsè de gèng hǎokàn.", "x": "Saya juga merasa yang hijau lebih bagus."}, {"k": "4-3.12", "t": "su", "w": ["这些", "书", "不", "是", "我", "的"], "s": "这些书不是我的。", "alt": [], "p": "Zhèxiē shū bú shì wǒ de.", "x": "Buku-buku ini bukan punya saya."}, {"k": "4-3.13", "t": "bs", "s": "我要这个大的。", "sp": "Wǒ yào zhège dà de.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "4-3.14", "t": "bs", "s": "我想买红色。（maksud: barang yang merah）", "sp": "Wǒ xiǎng mǎi hóngsè. (m a k s u d: b a r a n g y a n g m e r a h)", "n": "", "ok": false, "b": "我想买红色的。", "bp": "Wǒ xiǎng mǎi hóngsè de.", "x": "Perlu 的 untuk \"yang merah\"."}, {"k": "4-3.15", "t": "bs", "s": "这个面包是爸爸买的。", "sp": "Zhège miànbāo shì bàba mǎi de.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "4-3.16", "t": "bs", "s": "的便宜好。", "sp": "De piányi hǎo.", "n": "", "ok": false, "b": "便宜的好。", "bp": "Piányi de hǎo.", "x": "的 di belakang kata sifat."}, {"k": "4-3.17", "t": "bs", "s": "这本书是老师的。", "sp": "Zhè běn shū shì lǎoshī de.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "5-1", "pel": 5, "judul": "Pelengkap arah sederhana (1): KK + 来 / 去", "kode": "简单趋向补语（1）", "rumus": ["KK + 来 (mendekati pembicara)", "KK + 去 (menjauhi pembicara)", "KK utama: 上 下 进 出 回 过 + 来/去; juga 拿 送 买 找 走…; 起来 = bangun"], "jelas": ["Pelengkap arah 来 dan 去 menunjukkan arah gerak dibandingkan dengan posisi PEMBICARA. 来 = gerak mendekati pembicara, 去 = gerak menjauhi pembicara. Jika saya di bawah dan teman di atas, saya bilang 你下来吧 (turunlah ke sini) dan 我不上去了 (saya tidak naik ke sana).", "Kata kerja yang paling sering dipakai: 上 (naik), 下 (turun), 进 (masuk), 出 (keluar), 回 (kembali), 过 (menyeberang/menghampiri). Kombinasinya: 上来/上去, 下来/下去, 进来/进去, 出来/出去, 回来/回去, 过来/过去.", "Kata kerja tindakan lain juga bisa diberi 来/去: 拿来 (bawa ke sini), 送去 (antar ke sana), 买来, 找来, 走去, 叫来. 她拿来一本中文书 = dia membawa (ke sini) sebuah buku bahasa Mandarin.", "起来 punya arti khusus: bangun (dari tidur) atau berdiri/gerak ke atas. 今天早上五点她就起来了。 你起来吧，让小妹妹坐这儿。 Tidak ada 起去.", "Jebakan pelajar Indonesia: bahasa Indonesia sering tidak menyebut arah (\"turun!\", \"masuk!\"). Dalam bahasa Mandarin, perintah seperti itu hampir selalu memakai 来/去: 快进来！(masuklah!), 快下来吧！(cepat turun!). Pilih 来 atau 去 menurut posisi pembicara, bukan posisi pendengar.", "Bentuk ingkar memakai 不 (rencana) atau 没 (belum terjadi): 我不上去了。 他还没回来。 来/去 di sini diucapkan dengan nada netral."], "poin": ["来 = ke arah pembicara; 去 = menjauh dari pembicara.", "上/下/进/出/回/过 + 来/去.", "拿/送/买/找/走 + 来/去 juga bisa.", "起来 = bangun / berdiri."], "contoh": [{"zh": "我不上去了，就在下面等你。", "py": "Wǒ bú shàngqù le, jiù zài xiàmiàn děng nǐ.", "id": "Saya tidak naik, saya tunggu kamu di bawah saja.", "b": true, "tr": "05-1"}, {"zh": "家月到下边了，你下去接她吧。", "py": "Jiāyuè dào xiàbian le, nǐ xiàqù jiē tā ba.", "id": "Jiayue sudah di bawah, turunlah menjemputnya.", "b": true, "tr": null}, {"zh": "我在外边呢，你出来吧。", "py": "Wǒ zài wàibian ne, nǐ chūlái ba.", "id": "Saya di luar, keluarlah.", "b": true, "tr": null}, {"zh": "她拿来一本中文书。", "py": "Tā ná lái yì běn Zhōngwén shū.", "id": "Dia membawa sebuah buku bahasa Mandarin.", "b": true, "tr": null}, {"zh": "你别过来拿了，我给你送去。", "py": "Nǐ bié guòlái ná le, wǒ gěi nǐ sòng qù.", "id": "Tidak usah ke sini mengambilnya, saya antarkan ke sana.", "b": true, "tr": null}, {"zh": "今天早上五点她就起来了。", "py": "Jīntiān zǎoshang wǔ diǎn tā jiù qǐlái le.", "id": "Pagi ini dia sudah bangun jam lima.", "b": true, "tr": null}, {"zh": "你起来吧，让小妹妹坐这儿。", "py": "Nǐ qǐlái ba, ràng xiǎo mèimei zuò zhèr.", "id": "Berdirilah, biar adik kecil duduk di sini.", "b": true, "tr": null}, {"zh": "家月，快下来吧！", "py": "Jiāyuè, kuài xiàlái ba!", "id": "Jiayue, cepat turun!", "b": true, "tr": "05-1"}, {"zh": "还有时间，你上来吧。", "py": "Hái yǒu shíjiān, nǐ shànglái ba.", "id": "Masih ada waktu, naiklah ke sini.", "b": true, "tr": "05-1"}, {"zh": "那我一会儿就下去。", "py": "Nà wǒ yíhuìr jiù xiàqù.", "id": "Kalau begitu sebentar lagi saya turun.", "b": true, "tr": "05-1"}, {"zh": "你过来吧。", "py": "Nǐ guòlái ba.", "id": "Ke sinilah.", "b": true, "tr": null}, {"zh": "爸爸还没回来。", "py": "Bàba hái méi huílái.", "id": "Ayah belum pulang.", "b": false, "tr": null}], "salah": [{"s": "我在楼下，你下去吧。（maksud: saya di bawah, suruh teman turun ke saya）", "sp": "Wǒ zài lóu xià, nǐ xiàqù ba. (m a k s u d: s a y a d i b a w a h, s u r u h t e m a n t u r u n k e s a y a)", "n": "", "b": "我在楼下，你下来吧。", "bp": "Wǒ zài lóu xià, nǐ xiàlái ba.", "a": "Gerak menuju pembicara memakai 来."}, {"s": "我七点起去。", "sp": "Wǒ qī diǎn qǐ qù.", "n": "", "b": "我七点起来。", "bp": "Wǒ qī diǎn qǐlái.", "a": "Untuk bangun tidur hanya ada 起来."}, {"s": "我在外边呢，你出去吧。（pembicara di luar）", "sp": "Wǒ zài wàibian ne, nǐ chūqù ba. (p e m b i c a r a d i l u a r)", "n": "", "b": "我在外边呢，你出来吧。", "bp": "Wǒ zài wàibian ne, nǐ chūlái ba.", "a": "Pembicara di luar, jadi pendengar \"keluar ke sini\": 出来."}], "latihan": [{"k": "5-1.0", "t": "pg", "q": "（Saya di bawah, kamu di lantai atas.）你快___吧！", "o": ["下来", "下去", "上来", "出去"], "a": 0, "x": "Turun menuju pembicara: 下来."}, {"k": "5-1.1", "t": "pg", "q": "（Saya di bawah.）我不___了，就在下面等你。", "o": ["上去", "上来", "下来", "进来"], "a": 0, "x": "Naik menjauhi pembicara: 上去."}, {"k": "5-1.2", "t": "pg", "q": "我在外边呢，你___吧。", "o": ["出来", "出去", "进去", "回去"], "a": 0, "x": "Pembicara di luar: keluar ke sini = 出来.", "f": "我在外边呢，你出来吧。", "fp": "Wǒ zài wàibian ne, nǐ chūlái ba."}, {"k": "5-1.3", "t": "pg", "q": "今天早上五点她就___了。", "o": ["起来", "起去", "上来", "下来"], "a": 0, "x": "Bangun tidur = 起来.", "f": "今天早上五点她就起来了。", "fp": "Jīntiān zǎoshang wǔ diǎn tā jiù qǐlái le."}, {"k": "5-1.4", "t": "pg", "q": "你别过来拿了，我给你送___。", "o": ["去", "来", "上", "下"], "a": 0, "x": "Menjauhi pembicara ke tempat pendengar: 送去.", "f": "你别过来拿了，我给你送去。", "fp": "Nǐ bié guòlái ná le, wǒ gěi nǐ sòng qù."}, {"k": "5-1.5", "t": "pg", "q": "（Tuan rumah di dalam rumah berkata kepada tamu）快___！", "o": ["进来", "进去", "出来", "回去"], "a": 0, "x": "Masuk menuju pembicara: 进来."}, {"k": "5-1.6", "t": "pg", "q": "家月到下边了，你下___接她吧。（pembicara di atas）", "o": ["去", "来", "上", "回"], "a": 0, "x": "Menjauh dari pembicara: 下去."}, {"k": "5-1.7", "t": "su", "w": ["我", "不", "上去", "了，", "就", "在", "下面", "等", "你"], "s": "我不上去了，就在下面等你。", "alt": [], "p": "Wǒ bú shàngqù le, jiù zài xiàmiàn děng nǐ.", "x": "Saya tidak naik, saya tunggu kamu di bawah saja."}, {"k": "5-1.8", "t": "su", "w": ["我", "在", "外边", "呢，", "你", "出来", "吧"], "s": "我在外边呢，你出来吧。", "alt": [], "p": "Wǒ zài wàibian ne, nǐ chūlái ba.", "x": "Saya di luar, keluarlah."}, {"k": "5-1.9", "t": "su", "w": ["她", "拿来", "一", "本", "中文书"], "s": "她拿来一本中文书。", "alt": [], "p": "Tā ná lái yì běn Zhōngwén shū.", "x": "Dia membawa sebuah buku bahasa Mandarin."}, {"k": "5-1.10", "t": "su", "w": ["那", "我", "一会儿", "就", "下去"], "s": "那我一会儿就下去。", "alt": [], "p": "Nà wǒ yíhuìr jiù xiàqù.", "x": "Kalau begitu sebentar lagi saya turun."}, {"k": "5-1.11", "t": "su", "w": ["今天", "早上", "五", "点", "她", "就", "起来", "了"], "s": "今天早上五点她就起来了。", "alt": [], "p": "Jīntiān zǎoshang wǔ diǎn tā jiù qǐlái le.", "x": "Pagi ini dia sudah bangun jam lima."}, {"k": "5-1.12", "t": "su", "w": ["你", "别", "过来", "拿", "了，", "我", "给", "你", "送去"], "s": "你别过来拿了，我给你送去。", "alt": [], "p": "Nǐ bié guòlái ná le, wǒ gěi nǐ sòng qù.", "x": "Tidak usah ke sini mengambilnya, saya antarkan ke sana."}, {"k": "5-1.13", "t": "bs", "s": "你上来吧。", "sp": "Nǐ shànglái ba.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "5-1.14", "t": "bs", "s": "我每天七点起去。", "sp": "Wǒ měi tiān qī diǎn qǐ qù.", "n": "", "ok": false, "b": "我每天七点起来。", "bp": "Wǒ měi tiān qī diǎn qǐlái.", "x": "Hanya ada 起来."}, {"k": "5-1.15", "t": "bs", "s": "我在外边呢，你出来吧。", "sp": "Wǒ zài wàibian ne, nǐ chūlái ba.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "5-1.16", "t": "bs", "s": "（Pembicara di dalam rumah）快进去吧！", "sp": "(P e m b i c a r a d i d a l a m r u m a h) Kuài jìnqù ba!", "n": "", "ok": false, "b": "快进来吧！", "bp": "Kuài jìnlái ba!", "x": "Menuju pembicara: 进来."}, {"k": "5-1.17", "t": "bs", "s": "爸爸还没回来。", "sp": "Bàba hái méi huílái.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "5-2", "pel": 5, "judul": "Pelengkap arah sederhana (2): posisi objek", "kode": "简单趋向补语（2）", "rumus": ["Objek tempat: KK + tempat + 来/去 (进教室来)", "Objek benda: KK + benda + 来/去 atau KK + 来/去 + benda", "KK + 上/下/进/出/回/过 + objek (买回了很多水果)"], "jelas": ["Jika kata kerja dengan pelengkap arah juga punya objek, posisi objek bergantung pada jenisnya. Objek TEMPAT selalu diletakkan sebelum 来/去: 进教室来, 回家去, 上楼来. Tidak boleh 进来教室.", "Objek BENDA boleh diletakkan sebelum atau sesudah 来/去: 拿这么多礼物来 = 拿来这么多礼物; 送来了一本书 = 送了一本书来. Keduanya benar. Jika sudah terjadi dan objeknya berbilangan, posisi setelah 来/去 sangat umum: 家月给我送来了一本书.", "Kata kerja seperti 开, 买, 拿, 请, 送, 找, 走 juga bisa diikuti pelengkap 上, 下, 进, 出, 回, 过 (tanpa 来/去). Biasanya kata kerja ini membawa objek yang diletakkan SETELAH pelengkap: 爸爸买回了很多水果 (membeli dan membawa pulang banyak buah), 妈妈拿出了二十块钱 (mengeluarkan dua puluh yuan).", "Hubungan dengan kata kerja yang pernah dipelajari: 回家 (pulang) + 去 = 回家去; 进教室 + 来 = 进教室来. 王老师进教室去了 = Bu Guru Wang masuk ke kelas (menjauhi pembicara).", "Jebakan pelajar Indonesia: urutan \"masuk ke kelas\" membuat kita ingin menulis 进来教室. Ingat aturannya: tempat diapit di tengah — 进 + 教室 + 来.", "Ingkar memakai 没 atau 不 di depan kata kerja: 他没回家去。 我不拿礼物去了。"], "poin": ["Objek tempat: di antara KK dan 来/去 (进教室来).", "Objek benda: sebelum atau sesudah 来/去.", "KK + 回/出/进… + objek: 买回水果, 拿出钱.", "Jangan: 进来教室, 回去家."], "contoh": [{"zh": "你们太客气了，还拿这么多礼物来！", "py": "Nǐmen tài kèqi le, hái ná zhème duō lǐwù lái!", "id": "Kalian terlalu sungkan, sampai membawa hadiah sebanyak ini!", "b": true, "tr": "05-3"}, {"zh": "家月给我送来了一本书。", "py": "Jiāyuè gěi wǒ sòng lái le yì běn shū.", "id": "Jiayue mengantarkan sebuah buku untuk saya.", "b": true, "tr": null}, {"zh": "上课了，你们快进教室来吧。", "py": "Shàngkè le, nǐmen kuài jìn jiàoshì lái ba.", "id": "Pelajaran sudah mulai, cepat masuk ke kelas.", "b": true, "tr": null}, {"zh": "爸爸今天买回了很多水果。", "py": "Bàba jīntiān mǎi huí le hěn duō shuǐguǒ.", "id": "Hari ini Ayah membeli dan membawa pulang banyak buah.", "b": true, "tr": null}, {"zh": "妈妈拿出了二十块钱，让小雪自己去买点儿吃的。", "py": "Māma ná chū le èrshí kuài qián, ràng Xiǎoxuě zìjǐ qù mǎi diǎnr chī de.", "id": "Ibu mengeluarkan dua puluh yuan dan menyuruh Xiaoxue membeli makanan sendiri.", "b": true, "tr": null}, {"zh": "王老师进教室去了。", "py": "Wáng lǎoshī jìn jiàoshì qù le.", "id": "Bu Guru Wang masuk ke kelas.", "b": true, "tr": null}, {"zh": "小李吃完饭，已经回宿舍去了。", "py": "Xiǎo Lǐ chī wán fàn, yǐjīng huí sù shè qù le.", "id": "Xiao Li sudah selesai makan dan sudah kembali ke asrama.", "b": false, "tr": null}, {"zh": "你明天带一本中文书来吧。", "py": "Nǐ míngtiān dài yì běn Zhōngwén shū lái ba.", "id": "Besok bawalah sebuah buku bahasa Mandarin.", "b": false, "tr": null}, {"zh": "他从房间里走出来了。", "py": "Tā cóng fángjiān li zǒu chūlái le.", "id": "Dia berjalan keluar dari kamar.", "b": false, "tr": null}, {"zh": "我给奶奶送去了一些水果。", "py": "Wǒ gěi nǎinai sòng qù le yìxiē shuǐguǒ.", "id": "Saya mengantarkan beberapa buah untuk nenek.", "b": false, "tr": null}, {"zh": "我看见他回家去了。", "py": "Wǒ kànjiàn tā huí jiā qù le.", "id": "Saya melihat dia pulang ke rumah.", "b": false, "tr": null}], "salah": [{"s": "上课了，你们快进来教室吧。", "sp": "Shàngkè le, nǐmen kuài jìnlái jiàoshì ba.", "n": "", "b": "上课了，你们快进教室来吧。", "bp": "Shàngkè le, nǐmen kuài jìn jiàoshì lái ba.",  nada menekankan atau tidak puas: 都八点半了，你还不起床吗？ = Sudah jam setengah sembilan, kamu belum bangun juga?", "都 di sini bukan \"semua\". Ia diletakkan sebelum waktu, angka, atau kata kerja, dan 了 di akhir bagian itu: 都十二点了 (sudah jam dua belas), 都三天了 (sudah tiga hari), 我都去过北京了 (saya sudah pernah ke Beijing).", "Pola ini biasanya diikuti kalimat kedua berisi saran, ajakan, atau keluhan: 都十二点了，我们吃饭吧。 都十二点了，你快睡觉吧。 我都去过北京了，不想再去了。", "Beda dengan 已经……了: 已经十二点了 netral (memberi informasi), sedangkan 都十二点了 lebih emosional (terasa sudah terlalu lama/larut). Dalam bahasa Indonesia, nadanya mirip \"Udah jam dua belas, lho!\"", "Dengan subjek: subjek diletakkan sebelum 都: 我都去过北京了. Dengan kata waktu: 都 di awal kalimat: 都八点了.", "Jebakan: jangan lupa 了 di akhir. 都十二点 tanpa 了 terdengar tidak lengkap."], "poin": ["都……了 = sudah … (menekankan/agak mengeluh).", "都 + waktu/angka/KK + 了.", "Sering diikuti saran atau keluhan.", "都 di sini bukan \"semua\"."], "contoh": [{"zh": "都十二点了，我们吃饭吧。", "py": "Dōu shí'èr diǎn le, wǒmen chīfàn ba.", "id": "Sudah jam dua belas, ayo kita makan.", "b": true, "tr": null}, {"zh": "都八点半了，你还不起床吗？", "py": "Dōu bā diǎn bàn le, nǐ hái bù qǐchuáng ma?", "id": "Sudah jam setengah sembilan, kamu belum bangun juga?", "b": true, "tr": null}, {"zh": "我都去过北京了，不想再去了。", "py": "Wǒ dōu qù guò Běijīng le, bù xiǎng zài qù le.", "id": "Saya sudah pernah ke Beijing, tidak ingin ke sana lagi.", "b": true, "tr": null}, {"zh": "都十二点了，你快睡觉吧。", "py": "Dōu shí'èr diǎn le, nǐ kuài shuìjiào ba.", "id": "Sudah jam dua belas, cepatlah tidur.", "b": true, "tr": null}, {"zh": "都十点了，你怎么还不来？", "py": "Dōu shí diǎn le, nǐ zěnme hái bù lái?", "id": "Sudah jam sepuluh, kenapa kamu belum datang juga?", "b": false, "tr": null}, {"zh": "你的病都好了，为什么还不去上班？", "py": "Nǐ de bìng dōu hǎo le, wèishénme hái bú qù shàngbān?", "id": "Penyakitmu sudah sembuh, kenapa belum masuk kerja juga?", "b": false, "tr": null}, {"zh": "他都二十岁了，还不会做饭。", "py": "Tā dōu èrshí suì le, hái bú huì zuòfàn.", "id": "Dia sudah dua pulu .17", "t": "bs", "s": "这件衣服我都穿了三年了。", "sp": "Zhè jiàn yīfu wǒ dōu chuān le sān nián le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "6-1", "pel": 6, "judul": "Pengulangan kata sifat: AA / AABB", "kode": "形容词重叠", "rumus": ["KS satu suku: AA (+的) — 大大的", "KS dua suku: AABB (+的) — 漂漂亮亮的", "Sebagai keterangan cara: AABB + 地 + KK"], "jelas": ["Kata sifat yang diulang menunjukkan tingkat yang tinggi dan sering membawa rasa sayang atau suka. 大大的蛋糕 = kue yang besaaar; 小小的猫 = kucing kecil mungil. Nadanya hidup dan akrab.", "Kata sifat satu suku kata: AA, biasanya diikuti 的: 大大的, 小小的, 长长的, 高高的, 早早地. Kata sifat dua suku kata: AABB (bukan ABAB): 漂漂亮亮, 高高兴兴, 舒舒服服, 干干净净.", "Kata sifat yang diulang bisa menjadi penjelas kata benda (大大的生日蛋糕, 长长的面条儿), predikat dengan 的 (这只猫小小的; 她每天都漂漂亮亮的), atau keterangan cara dengan 地 (高高兴兴地玩, 舒舒服服地睡一觉).", "PENTING: kata sifat yang diulang TIDAK boleh diberi kata penguat 很, 非常, 太, dan tidak bisa diingkari dengan 不. 很大大的 salah; 不漂漂亮亮 salah. Pengulangan sendiri sudah berarti \"sangat\".", "Jebakan pelajar Indonesia: pengulangan dalam bahasa Indonesia sering berarti jamak (buku-buku) atau \"agak\" (kemerah-merahan). Dalam bahasa Mandarin pengulangan kata sifat berarti \"sangat/sungguh\". Bedakan juga dengan pengulangan kata kerja: KK dua suku ABAB (休息休息), KS dua suku AABB (高高兴兴).", "Sebagai predikat, kata sifat ulang biasanya diakhiri 的: 这只猫小小的。 Tanpa 的 terdengar tidak lengkap."], "poin": ["AA / AABB = sangat …, dengan rasa sayang.", "Satu suku AA (大大的); dua suku AABB (漂漂亮亮).", "Tidak boleh + 很/非常/不.", "Biasanya + 的 (penjelas/predikat) atau + 地 (cara)."], "contoh": [{"zh": "我再给她买个大大的生日蛋糕。", "py": "Wǒ zài gěi tā mǎi gè dà dà de shēngrì dàngāo.", "id": "Saya akan membelikannya kue ulang tahun yang besar.", "b": true, "tr": "06-1"}, {"zh": "这只猫小小的，真让人喜欢。", "py": "Zhè zhī māo xiǎo xiǎo de, zhēn ràng rén xǐhuan.", "id": "Kucing ini kecil mungil, sungguh menggemaskan.", "b": true, "tr": null}, {"zh": "一雪的女儿每天都漂漂亮亮的。", "py": "Yīxuě d
