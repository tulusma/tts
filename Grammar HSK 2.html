明天去？", "sp": "Wǒmen jīntiān qù háishi míngtiān qù?", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "10-2.15", "t": "bs", "s": "你喜欢猫和狗？", "sp": "Nǐ xǐhuan māo hé gǒu?", "n": "bertanya pilihan", "ok": false, "b": "你喜欢猫还是狗？", "bp": "Nǐ xǐhuan māo háishi gǒu?", "x": "Pilihan dalam pertanyaan: 还是."}, {"k": "10-2.16", "t": "bs", "s": "他是你哥哥还是你弟弟？", "sp": "Tā shì nǐ gēge háishi nǐ dìdi?", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "10-2.17", "t": "bs", "s": "你是是医生还是是老师？", "sp": "Nǐ shì shì yīshēng háishi shì lǎoshī?", "n": "", "ok": false, "b": "你是医生还是老师？", "bp": "Nǐ shì yīshēng háishi lǎoshī?", "x": "Cukup satu 是."}]}, {"id": "10-3", "pel": 10, "judul": "Akan segera: 要/快/快要/就要……了", "kode": "固定格式\"要/快/快要/就要……了\"", "rumus": ["(快)要 + KK/KS + 了", "快 + KK/KS/waktu + 了", "Waktu + 就要 + KK + 了", "还没……呢 (ingkar)"], "jelas": ["Pola ini menyatakan bahwa sesuatu AKAN SEGERA terjadi. 火车快开了 = keretanya sebentar lagi berangkat. 了 di akhir kalimat wajib.", "Empat bentuk: 要……了, 快……了, 快要……了, 就要……了. Maknanya mirip. 快 dan 快要 menekankan \"sudah dekat sekali\"; 就要 menekankan \"sebentar lagi, sudah pasti\".", "Aturan penting: jika ada keterangan waktu yang jelas (明天, 下星期, 十点), pakai 就要……了, BUKAN 快要/快. 我们下星期就要考试了 benar; 我们下星期快要考试了 salah.", "快 bisa langsung diikuti kata waktu/bilangan: 快十二点了 (sudah hampir jam dua belas), 他快二十岁了. 快要 dan 就要 biasanya diikuti kata kerja.", "Bertanya: ……快……了吗？ Jawab: 快了 / 还没呢 / 还早呢. Bentuk ingkarnya bukan 不快……了, melainkan 还没(有)……呢: 火车还没开呢.", "Jebakan pelajar Indonesia: lupa 了 di akhir karena \"akan\" dalam bahasa Indonesia tidak perlu penanda di akhir. Juga jangan tertukar dengan 了 penanda selesai: 火车开了 (kereta sudah berangkat) vs 火车快开了 (kereta segera berangkat)."], "poin": ["要/快/快要/就要 … 了 = segera, sebentar lagi.", "Ada waktu jelas → 就要……了.", "快 + bilangan/waktu + 了 (快十点了).", "了 di akhir wajib.", "Ingkar: 还没……呢."], "contoh": [{"zh": "饭菜快要做好了。", "py": "Fàn cài kuàiyào zuò hǎo le.", "id": "Masakannya sebentar lagi matang.", "b": true, "tr": "10-5"}, {"zh": "火车快开了。", "py": "Huǒchē kuài kāi le.", "id": "Keretanya sebentar lagi berangkat.", "b": true, "tr": null}, {"zh": "我们下星期就要考试了。", "py": "Wǒmen xià xīngqī jiù yào kǎoshì le.", "id": "Minggu depan kami sudah ujian.", "b": true, "tr": null}, {"zh": "我要回国了。", "py": "Wǒ yào huí guó le.", "id": "Saya akan segera pulang ke negara saya.", "b": true, "tr": null}, {"zh": "快要开学了，爸爸帮弟弟准备书包、本子和笔。", "py": "Kuàiyào kāixué le, bàba bāng dìdi zhǔnbèi shūbāo, běnzi hé bǐ.", "id": "Sebentar lagi masuk sekolah, ayah membantu adik menyiapkan tas, buku tulis, dan pena.", "b": true, "tr": "10-7"}, {"zh": "就要考试了，妈妈让我看书。", "py": "Jiù yào kǎoshì le, māma ràng wǒ kàn shū.", "id": "Ujian sudah dekat, ibu menyuruhku belajar.", "b": true, "tr": "10-7"}, {"zh": "新年就要到了。", "py": "Xīnnián jiù yào dào le.", "id": "Tahun Baru sebentar lagi tiba.", "b": true, "tr": "13-1"}, {"zh": "考试就要开始了，请大家写上姓名。", "py": "Kǎoshì jiù yào kāishǐ le, qǐng dàjiā xiě shàng xìngmíng.", "id": "Ujian segera dimulai, silakan semua menulis nama.", "b": true, "tr": "15-1"}, {"zh": "就要过年了，你一个人在这儿多没意思啊。", "py": "Jiù yào guònián le, nǐ yí gè rén zài zhèr duō méiyìsi a.", "id": "Sebentar lagi Tahun Baru Imlek, sendirian di sini betapa membosankan.", "b": true, "tr": "14-3"}, {"zh": "想到就要飞北京了，我还是很高兴的。", "py": "Xiǎng dào jiù yào fēi Běijīng le, wǒ háishi hěn gāoxìng de.", "id": "Memikirkan sebentar lagi terbang ke Beijing, aku tetap senang.", "b": true, "tr": "15-5"}, {"zh": "快十二点了，我们去吃饭吧。", "py": "Kuài shí'èr diǎn le, wǒmen qù chīfàn ba.", "id": "Sudah hampir jam dua belas, ayo kita makan.", "b": false, "tr": null}, {"zh": "要下雨了，别出去了。", "py": "Yào xià yǔ le, bié chūqù le.", "id": "Sebentar lagi hujan, jangan keluar.", "b": false, "tr": null}, {"zh": "电影快要开始了，你到哪儿了？", "py": "Diànyǐng kuàiyào kāishǐ le, nǐ dào nǎr le?", "id": "Filmnya sebentar lagi mulai, kamu sudah sampai mana?", "b": false, "tr": null}, {"zh": "他明天就要去北京了。", "py": "Tā míngtiān jiù yào qù Běijīng le.", "id": "Besok dia sudah berangkat ke Beijing.", "b": false, "tr": null}, {"zh": "火车开了吗？——还没开呢，快了。", "py": "Huǒchē kāi le ma? — Hái méi kāi ne, kuài le.", "id": "Keretanya sudah berangkat? — Belum, sebentar lagi.", "b": false, "tr": null}], "salah": [{"s": "我们明天快要考试了。", "sp": "Wǒmen míngtiān kuàiyào kǎoshì le.", "n": "", "b": "我们明天就要考试了。", "bp": "Wǒmen míngtiān jiù yào kǎoshì le.", "a": "Ada keterangan waktu → 就要."}, {"s": "火车快要开。", "sp": "Huǒchē kuàiyào kāi.", "n": "", "b": "火车快要开了。", "bp": "Huǒchē kuàiyào kāi le.", "a": "了 di akhir wajib."}, {"s": "火车不快开了。", "sp": "Huǒchē bú kuài kāi le.", "n": "belum berangkat", "b": "火车还没开呢。", "bp": "Huǒchē hái méi kāi ne.", "a": "Ingkarnya 还没……呢."}], "latihan": [{"k": "10-3.0", "t": "pg", "q": "火车快开___。", "o": ["了", "过", "着", "的"], "a": 0, "x": "Pola 快……了.", "f": "火车快开了。", "fp": "Huǒchē kuài kāi le."}, {"k": "10-3.1", "t": "pg", "q": "我们下星期___考试了。", "o": ["就要", "快要", "快", "要快"], "a": 0, "x": "Ada waktu (下星期) → 就要.", "f": "我们下星期就要考试了。", "fp": "Wǒmen xià xīngqī jiù yào kǎoshì le."}, {"k": "10-3.2", "t": "pg", "q": "___十二点了，我们去吃饭吧。", "o": ["快", "很", "太", "最"], "a": 0, "x": "快 + waktu/bilangan + 了 = sudah hampir.", "f": "快十二点了，我们去吃饭吧。", "fp": "Kuài shí'èr diǎn le, wǒmen qù chīfàn ba."}, {"k": "10-3.3", "t": "pg", "q": "\"Sebentar lagi hujan\" =", "o": ["要下雨了。", "下雨了。", "要下雨。", "下雨要了。"], "a": 0, "x": "要……了."}, {"k": "10-3.4", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["饭菜快要做好了。", "新年就要到了。", "他明天快要回国了。", "电影快开始了。"], "a": 2, "x": "Ada 明天 → 就要回国了."}, {"k": "10-3.5", "t": "pg", "q": "A: 火车开了吗？ B: ___", "o": ["还没开呢。", "不开了。", "没快开。", "不快开了。"], "a": 0, "x": "Ingkar: 还没……呢."}, {"k": "10-3.6", "t": "pg", "q": "\"火车快开了\" berarti …", "o": ["Kereta sebentar lagi berangkat.", "Kereta sudah berangkat.", "Kereta berjalan cepat.", "Kereta tidak berangkat."], "a": 0, "x": "快……了 = segera."}, {"k": "10-3.7", "t": "su", "w": ["饭菜", "快要", "做好", "了"], "s": "饭菜快要做好了。", "alt": [], "p": "Fàn cài kuàiyào zuò hǎo le.", "x": "Masakannya sebentar lagi matang."}, {"k": "10-3.8", "t": "su", "w": ["我们", "下", "星期", "就要", "考试", "了"], "s": "我们下星期就要考试了。", "alt": [], "p": "Wǒmen xià xīngqī jiù yào kǎoshì le.", "x": "Minggu depan kami sudah ujian."}, {"k": "10-3.9", "t": "su", "w": ["新年", "就要", "到", "了"], "s": "新年就要到了。", "alt": [], "p": "Xīnnián jiù yào dào le.", "x": "Tahun Baru sebentar lagi tiba."}, {"k": "10-3.10", "t": "su", "w": ["电影", "快要", "开始", "了"], "s": "电影快要开始了。", "alt": [], "p": "Diànyǐng kuàiyào kāishǐ le.", "x": "Filmnya sebentar lagi mulai."}, {"k": "10-3.11", "t": "su", "w": ["他", "明天", "就要", "去", "北京", "了"], "s": "他明天就要去北京了。", "alt": ["明天他就要去北京了。"], "p": "Tā míngtiān jiù yào qù Běijīng le.", "x": "Besok dia sudah berangkat ke Beijing."}, {"k": "10-3.12", "t": "su", "w": ["快", "十二", "点", "了"], "s": "快十二点了。", "alt": [], "p": "Kuài shí'èr diǎn le.", "x": "Sudah hampir jam dua belas."}, {"k": "10-3.13", "t": "bs", "s": "我们明天快要考试了。", "sp": "Wǒmen míngtiān kuàiyào kǎoshì le.", "n": "", "ok": false, "b": "我们明天就要考试了。", "bp": "Wǒmen míngtiān jiù yào kǎoshì le.", "x": "Ada waktu → 就要."}, {"k": "10-3.14", "t": "bs", "s": "火车快开了。", "sp": "Huǒchē kuài kāi le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "10-3.15", "t": "bs", "s": "考试就要开始。", "sp": "Kǎoshì jiù yào kāishǐ.", "n": "", "ok": false, "b": "考试就要开始了。", "bp": "Kǎoshì jiù yào kāishǐ le.", "x": "了 wajib di akhir."}, {"k": "10-3.16", "t": "bs", "s": "我妹妹快二十岁了。", "sp": "Wǒ mèimei kuài èrshí suì le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 快 + bilangan + 了."}, {"k": "10-3.17", "t": "bs", "s": "快要开学了，我还没准备好呢。", "sp": "Kuàiyào kāixué le, wǒ hái méi zhǔnbèi hǎo ne.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "11-1", "pel": 11, "judul": "Partikel aspek 着 (1): keadaan yang berlangsung", "kode": "动态助词\"着\"（1）", "rumus": ["S + KK + 着", "S + 没(有) + KK + 着", "S + 在 + tempat + KK + 着"], "jelas": ["着 (zhe) diletakkan langsung setelah kata kerja untuk menyatakan bahwa suatu tindakan atau keadaan sedang BERTAHAN/BERLANGSUNG: 教室的门开着 = pintu kelas (dalam keadaan) terbuka; 他在那儿坐着 = dia sedang duduk di sana.", "着 paling sering dipakai dengan kata kerja yang menghasilkan keadaan: 坐 (duduk), 站 (berdiri), 开 (terbuka/menyala), 穿 (memakai), 拿 (memegang), 等 (menunggu). Ia menggambarkan \"posisi/keadaan\", bukan gerakan yang berganti-ganti.", "Bentuk ingkar memakai 没(有) di depan kata kerja, dan 着 tetap ada: 教室的门没开着. Jangan pakai 不: 门不开着 salah.", "着 juga sering dipakai dalam kalimat perintah atau saran untuk mempertahankan keadaan: 那你在这儿坐着 (kalau begitu kamu duduk saja di sini), 你拿着 (kamu pegang saja). Di akhir kalimat sering ditambah 呢: 他在外边等着呢.", "Beda dengan 在/正在 + KK: 在 menekankan tindakan sedang dilakukan (他在穿衣服 = dia sedang berpakaian), 着 menekankan keadaan hasilnya (他穿着新衣服 = dia memakai baju baru). Bahasa Indonesia memakai \"sedang\" untuk keduanya, jadi hati-hati.", "Jebakan: jangan gabungkan 着 dengan 了 atau 过 pada kata kerja yang sama (坐着了 salah), dan jangan pakai 着 dengan kata kerja yang tidak bisa bertahan seperti 是, 有, 知道, 认识."], "poin": ["KK + 着 = keadaan sedang bertahan.", "Ingkar: 没(有) + KK + 着.", "Cocok dengan 坐, 站, 开, 穿, 拿, 等.", "Tidak dipakai dengan 是/有/知道.", "Tidak bersamaan dengan 了/过."], "contoh": [{"zh": "那你在这儿坐着。", "py": "Nà nǐ zài zhèr zuò zhe.", "id": "Kalau begitu kamu duduk saja di sini.", "b": true, "tr": "11-1"}, {"zh": "教室的门开着。", "py": "Jiàoshì de mén kāi zhe.", "id": "Pintu kelas terbuka.", "b": true, "tr": null}, {"zh": "教室的门没开着。", "py": "Jiàoshì de mén méi kāi zhe.", "id": "Pintu kelas tidak terbuka.", "b": true, "tr": null}, {"zh": "他在那儿坐着。", "py": "Tā zài nàr zuò zhe.", "id": "Dia sedang duduk di sana.", "b": true, "tr": null}, {"zh": "我慢慢跑，等着你。", "py": "Wǒ màn màn pǎo, děng zhe nǐ.", "id": "Aku lari pelan-pelan, menunggumu.", "b": true, "tr": "12-5"}, {"zh": "房间的门开着，但是刘爷爷没在里边。", "py": "Fángjiān de mén kāi zhe, dànshì Liú yéye méi zài lǐbian.", "id": "Pintu kamar terbuka, tetapi Kakek Liu tidak ada di dalam.", "b": true, "tr": null}, {"zh": "电视开着，可是没有人看。", "py": "Diànshì kāi zhe, kěshì méiyǒu rén kàn.", "id": "Televisinya menyala, tetapi tidak ada yang menonton.", "b": false, "tr": null}, {"zh": "你别站着，快坐吧。", "py": "Nǐ bié zhàn zhe, kuài zuò ba.", "id": "Jangan berdiri, ayo duduk.", "b": false, "tr": null}, {"zh": "他在外边等着呢。", "py": "Tā zài wàibian děng zhe ne.", "id": "Dia sedang menunggu di luar.", "b": false, "tr": null}, {"zh": "你的手机我拿着呢。", "py": "Nǐ de shǒujī wǒ ná zhe ne.", "id": "HP-mu aku yang pegang.", "b": false, "tr": null}, {"zh": "电视没开着，你可以看看书。", "py": "Diànshì méi kāi zhe, nǐ kěyǐ kànkan shū.", "id": "Televisinya tidak menyala, kamu bisa membaca buku.", "b": false, "tr": null}, {"zh": "孩子们在床上坐着看书。", "py": "Háizimen zài chuáng shàng zuò zhe kàn shū.", "id": "Anak-anak duduk di atas tempat tidur sambil membaca.", "b": false, "tr": null}], "salah": [{"s": "门不开着。", "sp": "Mén bù kāi zhe.", "n": "", "b": "门没开着。", "bp": "Mén méi kāi zhe.", "a": "Ingkar 着 memakai 没."}, {"s": "他坐着了。", "sp": "Tā zuò zhe le.", "n": "", "b": "他坐着呢。", "bp": "Tā zuò zhe ne.", "a": "着 tidak dipakai bersama 了 pada kata kerja itu; pakai 呢."}, {"s": "我知道着这件事。", "sp": "Wǒ zhīdào zhe zhè jiàn shì.", "n": "", "b": "我知道这件事。", "bp": "Wǒ zhīdào zhè jiàn shì.", "a": "知道 tidak bisa memakai 着."}], "latihan": [{"k": "11-1.0", "t": "pg", "q": "教室的门开___。", "o": ["着", "过", "的", "得"], "a": 0, "x": "Keadaan bertahan: KK + 着.", "f": "教室的门开着。", "fp": "Jiàoshì de mén kāi zhe."}, {"k": "11-1.1", "t": "pg", "q": "教室的门___开着。", "o": ["没", "不", "别", "没有着"], "a": 0, "x": "Ingkar: 没 + KK + 着.", "f": "教室的门没开着。", "fp": "Jiàoshì de mén méi kāi zhe."}, {"k": "11-1.2", "t": "pg", "q": "那你在这儿坐___，我去开车。", "o": ["着", "过", "了过", "得"], "a": 0, "x": "Saran mempertahankan keadaan: 坐着.", "f": "那你在这儿坐着，我去开车。", "fp": "Nà nǐ zài zhèr zuò zhe, wǒ qù kāichē."}, {"k": "11-1.3", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["电视开着。", "他在外边等着呢。", "门不开着。", "你别站着。"], "a": 2, "x": "Pakai 没开着."}, {"k": "11-1.4", "t": "pg", "q": "\"Dia sedang menunggu di luar\" =", "o": ["他在外边等着呢。", "他等着在外边了。", "他在外边着等呢。", "他外边等过着。"], "a": 0, "x": "S + 在 + tempat + KK + 着 + 呢."}, {"k": "11-1.5", "t": "pg", "q": "Kata kerja mana yang TIDAK bisa memakai 着?", "o": ["知道", "坐", "开", "站"], "a": 0, "x": "知道 tidak menyatakan keadaan yang bisa bertahan."}, {"k": "11-1.6", "t": "pg", "q": "A: 你看见我的手机了吗？ B: 别找了，我___。", "o": ["拿着呢", "拿着了", "拿过着", "着拿呢"], "a": 0, "x": "KK + 着 + 呢."}, {"k": "11-1.7", "t": "su", "w": ["那", "你", "在", "这儿", "坐", "着"], "s": "那你在这儿坐着。", "alt": [], "p": "Nà nǐ zài zhèr zuò zhe.", "x": "Kalau begitu kamu duduk saja di sini."}, {"k": "11-1.8", "t": "su", "w": ["教室", "的", "门", "开", "着"], "s": "教室的门开着。", "alt": [], "p": "Jiàoshì de mén kāi zhe.", "x": "Pintu kelas terbuka."}, {"k": "11-1.9", "t": "su", "w": ["教室", "的", "门", "没", "开", "着"], "s": "教室的门没开着。", "alt": [], "p": "Jiàoshì de mén méi kāi zhe.", "x": "Pintu kelas tidak terbuka."}, {"k": "11-1.10", "t": "su", "w": ["他", "在", "外边", "等", "着", "呢"], "s": "他在外边等着呢。", "alt": [], "p": "Tā zài wàibian děng zhe ne.", "x": "Dia sedang menunggu di luar."}, {"k": "11-1.11", "t": "su", "w": ["你", "别", "站", "着"], "s": "你别站着。", "alt": [], "p": "Nǐ bié zhàn zhe.", "x": "Jangan berdiri."}, {"k": "11-1.12", "t": "su", "w": ["电视", "开", "着，", "可是", "没有", "人", "看"], "s": "电视开着，可是没有人看。", "alt": [], "p": "Diànshì kāi zhe, kěshì méiyǒu rén kàn.", "x": "Televisinya menyala, tetapi tidak ada yang menonton."}, {"k": "11-1.13", "t": "bs", "s": "商店的门不开着。", "sp": "Shāngdiàn de mén bù kāi zhe.", "n": "", "ok": false, "b": "商店的门没开着。", "bp": "Shāngdiàn de mén méi kāi zhe.", "x": "Ingkar: 没."}, {"k": "11-1.14", "t": "bs", "s": "他在那儿坐着。", "sp": "Tā zài nàr zuò zhe.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "11-1.15", "t": "bs", "s": "我认识着他。", "sp": "Wǒ rènshi zhe tā.", "n": "", "ok": false, "b": "我认识他。", "bp": "Wǒ rènshi tā.", "x": "认识 tidak memakai 着."}, {"k": "11-1.16", "t": "bs", "s": "我慢慢跑，等着你。", "sp": "Wǒ màn màn pǎo, děng zhe nǐ.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "11-1.17", "t": "bs", "s": "你在这儿站着了。", "sp": "Nǐ zài zhèr zhàn zhe le.", "n": "", "ok": false, "b": "你在这儿站着。", "bp": "Nǐ zài zhèr zhàn zhe.", "x": "Jangan gabungkan 着 dan 了."}]}, {"id": "11-2", "pel": 11, "judul": "Partikel aspek 着 (2): KK + 着 + objek", "kode": "动态助词\"着\"（2）", "rumus": ["S + KK + 着 + O", "S + 没 + KK + 着 + O", "Tanya: …吗？ / …没有？ / KK + 没 + KK + 着 + O？"], "jelas": ["Jika kata kerja yang memakai 着 punya objek, objek diletakkan SETELAH 着: 她穿着白色的裤子 (dia memakai celana putih), 还下着雪 (salju masih turun).", "Ingkar tetap memakai 没 di depan kata kerja: 陈天中没拿着咖啡 (Chen Tianzhong tidak sedang memegang kopi).", "Ada tiga cara bertanya: (1) tambah 吗 di akhir: 教室的门开着吗？ (2) tambah 没有 di akhir: 白家月坐着没有？ (3) KK + 没 + KK + 着: 她拿没拿着手机？", "Sering muncul bersama 正/在/正在 dan 呢 untuk menegaskan \"sedang\": 外边还正下着雪呢, 王老师开着车呢. 正在 + KK + 着 + O + 呢 boleh, tetapi untuk pemula cukup KK + 着 + O (+ 呢).", "Jebakan pelajar Indonesia: objek ditaruh sebelum 着 karena dalam bahasa Indonesia tidak ada partikel seperti ini (她穿白色的裤子着 salah). Ingat: 着 menempel pada kata kerja, objek di belakangnya, sama seperti 了 dan 过.", "Pola ini banyak dipakai untuk menggambarkan penampilan orang: 他穿着黑色的衣服，手里拿着一个包. Sangat berguna untuk mendeskripsikan gambar."], "poin": ["Urutan: KK + 着 + objek.", "Ingkar: 没 + KK + 着 + O.", "Tanya: 吗 / 没有 / KK没KK着.", "Cocok untuk mendeskripsikan pakaian dan barang yang dipegang."], "contoh": [{"zh": "现在路上车多，还下着雪，我开慢一点儿。", "py": "Xiànzài lùshang chē duō, hái xià zhe xuě, wǒ kāi màn yìdiǎnr.", "id": "Sekarang di jalan banyak mobil dan salju masih turun, aku menyetir pelan-pelan.", "b": true, "tr": "11-3"}, {"zh": "她穿着白色的裤子。", "py": "Tā chuān zhe báisè de kùzi.", "id": "Dia memakai celana putih.", "b": true, "tr": null}, {"zh": "陈天中没拿着咖啡。", "py": "Chén Tiānzhōng méi ná zhe kāfēi.", "id": "Chen Tianzhong tidak sedang memegang kopi.", "b": true, "tr": null}, {"zh": "教室的门开着吗？", "py": "Jiàoshì de mén kāi zhe ma?", "id": "Apakah pintu kelas terbuka?", "b": true, "tr": null}, {"zh": "白家月坐着没有？", "py": "Bái Jiāyuè zuò zhe méiyǒu?", "id": "Bai Jiayue sedang duduk atau tidak?", "b": true, "tr": null}, {"zh": "她拿没拿着手机？", "py": "Tā ná méi ná zhuó shǒujī?", "id": "Dia sedang membawa HP atau tidak?", "b": true, "tr": null}, {"zh": "王老师开着车呢，你找她有事吗？", "py": "Wáng lǎoshī kāi zhe chē ne, nǐ zhǎo tā yǒu shì ma?", "id": "Guru Wang sedang menyetir, kamu ada perlu dengannya?", "b": true, "tr": "11-3"}, {"zh": "外边还正下着雪呢！", "py": "Wàibian hái zhèng xià zhe xuě ne!", "id": "Di luar salju masih sedang turun!", "b": true, "tr": "12-1"}, {"zh": "那个人穿着黑色的裤子，手里还拿着一个黑色的包。", "py": "Nàge rén chuān zhe hēisè de kùzi, shǒu lǐ hái ná zhe yí gè hēisè de bāo.", "id": "Orang itu memakai celana hitam, tangannya juga memegang tas hitam.", "b": true, "tr": "14-1"}, {"zh": "外边下着雨，你别出去跑步了。", "py": "Wàibian xià zhe yǔ, nǐ bié chūqù pǎobù le.", "id": "Di luar sedang hujan, jangan keluar lari.", "b": false, "tr": null}, {"zh": "安妮穿着红色的衣服，你看见她了吗？", "py": "Ānnī chuān zhe hóngsè de yīfu, nǐ kànjiàn tā le ma?", "id": "Annie memakai baju merah, kamu melihatnya?", "b": false, "tr": null}, {"zh": "小明手里拿着一个苹果。", "py": "Xiǎomíng shǒu lǐ ná zhe yí gè píngguǒ.", "id": "Xiaoming memegang sebuah apel.", "b": false, "tr": null}, {"zh": "他们开着电视吃饭。", "py": "Tāmen kāi zhe diànshì chīfàn.", "id": "Mereka makan sambil televisi menyala.", "b": false, "tr": null}, {"zh": "你穿着这件衣服很好看。", "py": "Nǐ chuān zhe zhè jiàn yīfu hěn hǎokàn.", "id": "Kamu memakai baju ini kelihatan bagus.", "b": false, "tr": null}], "salah": [{"s": "她穿白色的裤子着。", "sp": "Tā chuān báisè de kùzi zhe.", "n": "", "b": "她穿着白色的裤子。", "bp": "Tā chuān zhe báisè de kùzi.", "a": "着 langsung setelah kata kerja, objek di belakang."}, {"s": "他不拿着手机。", "sp": "Tā bù ná zhuó shǒujī.", "n": "", "b": "他没拿着手机。", "bp": "Tā méi ná zhuó shǒujī.", "a": "Ingkar memakai 没."}, {"s": "她拿着手机没拿？", "sp": "Tā ná zhuó shǒujī méi ná?", "n": "", "b": "她拿没拿着手机？", "bp": "Tā ná méi ná zhuó shǒujī?", "a": "Bentuk tanya: KK + 没 + KK + 着 + O."}], "latihan": [{"k": "11-2.0", "t": "pg", "q": "她穿___白色的裤子。", "o": ["着", "过着" \" jangan pakai 很, tetapi tambahkan 多了/得多 di belakang: 他比我很高 salah → 他比我高多了.", "Bandingkan tiga tingkat: 姐姐比我高一点儿 (sedikit lebih tinggi) – 姐姐比我高 (lebih tinggi) – 姐姐比我高多了 / 高得多 (jauh lebih tinggi). Atau 更 di depan kata sifat: 姐姐比我更高 (bahkan lebih tinggi).", "Jebakan pelajar Indonesia: menerjemahkan \"jauh lebih\" dengan 很多 di depan kata sifat (他比我很多高 salah) atau menulis 冷得多了 (gabungan keduanya, hindari). Pilih salah satu: 冷多了 atau 冷得多."], "poin": ["A 比 B + KS + 多了/得多 = jauh lebih KS.", "多了/得多 selalu setelah KS.", "Jangan 很/非常/太 dalam kalimat 比.", "Pilih salah satu: 多了 atau 得多."], "contoh": [{"zh": "我这里比北京冷多了。", "py": "Wǒ zhèlǐ bǐ Běijīng lěng duō le.", "id": "Di sini jauh lebih dingin daripada Beijing.", "b": true, "tr": "12-1"}, {"zh": "坐飞机比坐火车快得多。", "py": "Zuò fēijī bǐ zuò huǒchē kuài de duō.", "id": "Naik pesawat jauh lebih cepat daripada naik kereta.", "b": true, "tr": null}, {"zh": "他觉得红茶比绿茶好喝得多。", "py": "Tā juéde hóngchá bǐ lǜchá hǎo hē de duō.", "id": "Menurutnya teh hitam jauh lebih enak daripada teh hijau.", "b": true, "tr": null}, {"zh": "今天比昨天热多了。", "py": "Jīntiān bǐ zuótiān rè duō le.", "id": "Hari ini jauh lebih panas daripada kemarin.", "b": true, "tr": null}, {"zh": "我比弟弟高多了，但现在没有他高了。", "py": "Wǒ bǐ dìdi gāo duō le, dàn xiànzài méiyǒu tā gāo le.", "id": "Dulu aku jauh lebih tinggi dari adik, tapi sekarang tidak setinggi dia.", "b": true, "tr": null}, {"zh": "这个手机比那个贵得多。", "py": "Zhège shǒujī bǐ nàge guì de duō.", "id": "HP ini jauh lebih mahal daripada yang itu.", "b": false, "tr": null}, {"zh": "她的汉语比以前好多了。", "py": "Tā de Hànyǔ bǐ yǐqián hǎoduō le.", "id": "Bahasa Mandarinnya jauh lebih baik daripada dulu.", "b": false, "tr": null}, {"zh": "这件衣服比那件漂亮得多。", "py": "Zhè jiàn yīfu bǐ nà jiàn piàoliang de duō.", "id": "Baju ini jauh lebih cantik daripada yang itu.", "b": false, "tr": null}, {"zh": "吃了药，我现在比早上好多了。", "py": "Chī le yào, wǒ xiànzài bǐ zǎoshang hǎoduō le.", "id": "Setelah minum obat, sekarang aku jauh lebih baik daripada pagi tadi.", "b": false, "tr": null}, {"zh": "北京的冬天比上海冷得多。", "py": "Běijīng de dōngtiān bǐ Shànghǎi lěng de duō.", "id": "Musim dingin di Beijing jauh lebih dingin daripada Shanghai.", "b": false, "tr": null}, {"zh": "打车比坐公交车快多了。", "py": "Dǎchē bǐ zuò gōngjiāochē kuài duō le.", "id": "Naik taksi jauh lebih cepat daripada naik bus.", "b": false, "tr": null}], "salah": [{"s": "我比他很高。", "sp": "Wǒ bǐ tā hěn gāo.", "n": "", "b": "我比他高多了。", "bp": "Wǒ bǐ tā gāo duō le.", "a": "Dalam kalimat 比 tidak memakai 很; untuk \"jauh lebih\" pakai 多了."}, {"s": "今天比昨天多冷。", "sp": "Jīntiān bǐ zuótiān duō lěng.", "n": "", "b": "今天比昨天冷多了。", "bp": "Jīntiān bǐ zuótiān lěng duō le.", "a": "多了/得多 di belakang kata sifat."}, {"s": "这个比那个贵得多了。", "sp": "Zhège bǐ nàge guì de duō le.", "n": "", "b": "这个比那个贵得多。 / 这个比那个贵多了。", "bp": "Zhège bǐ nàge guì de duō. / Zhège bǐ nàge guì duō le.", "a": "Pilih salah satu, jangan digabung."}], "latihan": [{"k": "12-1.0", "t": "pg", "q": "我这里比北京冷___。", "o": ["多了", "很多", "很", "太"], "a": 0, "x": "KS + 多了.", "f": "我这里比北京冷多了。", "fp": "Wǒ zhèlǐ bǐ Běijīng lěng duō le."}, {"k": "12-1.1", "t": "pg", "q": "坐飞机比坐火车快___。", "o": ["得多", "很多", "多得", "多多"], "a": 0, "x": "KS + 得多.", "f": "坐飞机比坐火车快得多。", "fp": "Zuò fēijī bǐ zuò huǒchē kuài de duō."}, {"k": "12-1.2", "t": "pg", "q": "\"Hari ini jauh lebih panas daripada kemarin\" =", "o": ["今天比昨天热多了。", "今天比昨天很热。", "今天比昨天多热。", "今天很比昨天热。"], "a": 0, "x": "A 比 B + KS + 多了."}, {"k": "12-1.3", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["他比我高得多。", "这个比那个好多了。", "她比我非常漂亮。", "打车比坐公交车快多了。"], "a": 2, "x": "非常 tidak dalam kalimat 比."}, {"k": "12-1.4", "t": "pg", "q": "A: 吃了药，你现在怎么样？ B: ___", "o": ["比早上好多了。", "比早上很好。", "比早上多好了。", "很比早上好。"], "a": 0, "x": "比 + B + KS + 多了."}, {"k": "12-1.5", "t": "pg", "q": "Mana yang menyatakan perbedaan PALING BESAR?", "o": ["他比我高得多。", "他比我高一点儿。", "他比我高一些。", "他比我高。"], "a": 0, "x": "得多 = jauh lebih."}, {"k": "12-1.6", "t": "pg", "q": "这个手机比那个___。", "o": ["贵得多", "很贵得", "得多贵", "多得贵"], "a": 0, "x": "KS + 得多.", "f": "这个手机比那个贵得多。", "fp": "Zhège shǒujī bǐ nàge guì de duō."}, {"k": "12-1.7", "t": "su", "w": ["我", "这里", "比", "北京", "冷", "多了"], "s": "我这里比北京冷多了。", "alt": [], "p": "Wǒ zhèlǐ bǐ Běijīng lěng duō le.", "x": "Di sini jauh lebih dingin daripada Beijing."}, {"k": "12-1.8", "t": "su", "w": ["坐", "飞机", "比", "坐", "火车", "快", "得多"], "s": "坐飞机比坐火车快得多。", "alt": [], "p": "Zuò fēijī bǐ zuò huǒchē kuài de duō.", "x": "Naik pesawat jauh lebih cepat daripada naik kereta."}, {"k": "12-1.9", "t": "su", "w": ["他", "觉得", "红茶", "比", "绿茶", "好喝", "得多"], "s": "他觉得红茶比绿茶好喝得多。", "alt": [], "p": "Tā juéde hóngchá bǐ lǜchá hǎo hē de duō.", "x": "Menurutnya teh hitam jauh lebih enak daripada teh hijau."}, {"k": "12-1.10", "t": "su", "w": ["今天", "比", "昨天", "热", "多了"], "s": "今天比昨天热多了。", "alt": ["比今天昨天热多了。"], "p": "Jīntiān bǐ zuótiān rè duō le.", "x": "Hari ini jauh lebih panas daripada kemarin."}, {"k": "12-1.11", "t": "su", "w": ["她", "的", "汉语", "比", "以前", "好", "多了"], "s": "她的汉语比以前好多了。", "alt": [], "p": "Tā de Hànyǔ bǐ yǐqián hǎoduō le.", "x": "Bahasa Mandarinnya jauh lebih baik daripada dulu."}, {"k": "12-1.12", "t": "su", "w": ["这", "件", "衣服", "比", "那", "件", "漂亮", "得多"], "s": "这件衣服比那件漂亮得多。", "alt": [], "p": "Zhè jiàn yīfu bǐ nà jiàn piàoliang de duō.", "x": "Baju ini jauh lebih cantik daripada yang itu."}, {"k": "12-1.13", "t": "bs", "s": "我哥哥比我很高。", "sp": "Wǒ gēge bǐ wǒ hěn gāo.", "n": "", "ok": false, "b": "我哥哥比我高多了。", "bp": "Wǒ gēge bǐ wǒ gāo duō le.", "x": "Tidak pakai 很 dalam kalimat 比."}, {"k": "12-1.14", "t": "bs", "s": "北京的冬天比上海冷得多。", "sp": "Běijīng de dōngtiān bǐ Shànghǎi lěng de duō.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "12-1.15", "t": "bs", "s": "这家店比那家多贵。", "sp": "Zhè jiā diàn bǐ nà jiā duō guì.", "n": "", "ok": false, "b": "这家店比那家贵多了。", "bp": "Zhè jiā diàn bǐ nà jiā guì duō le.", "x": "多了 di belakang kata sifat."}, {"k": "12-1.16", "t": "bs", "s": "打车比坐公交车快多了。", "sp": "Dǎchē bǐ zuò gōngjiāochē kuài duō le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "12-1.17", "t": "bs", "s": "今天比昨天冷得多了。", "sp": "Jīntiān bǐ zuótiān lěng de duō le.", "n": "", "ok": false, "b": "今天比昨天冷得多。", "bp": "Jīntiān bǐ zuótiān lěng de duō.", "x": "Jangan gabung 得多 dan 了."}]}, {"id": "12-2", "pel": 12, "judul": "Kalimat perbandingan (5): 比 dengan pelengkap keadaan", "kode": "比较句（5）", "rumus": ["A + 比 + B + KK + 得 + KS", "A + KK + 得 + 比 + B + KS"], "jelas": ["Jika kata kerja diikuti pelengkap keadaan (KK + 得 + KS, pelajaran 7), kalimat perbandingannya bisa dibuat dengan dua posisi 比, dan keduanya benar.", "Posisi 1: 比 sebelum kata kerja: 妈妈比我睡得晚 (ibu tidur lebih larut daripada aku), 昨天比今天下得大 (kemarin hujan/saljunya lebih lebat).", "Posisi 2: 比 setelah 得: 李文跑得比白家月快 (Li Wen berlari lebih cepat daripada Bai Jiayue), 我写得比他快.", "Aturan yang sama dengan 比 biasa: tidak boleh 很/非常/太 di depan kata sifat. Boleh menambah 多了/得多, 一点儿, 更: 他跑得比我快多了, 他跑得比我更快.", "Bentuk ingkar memakai 没有: 我没有他跑得快 / 我跑得没有他快 (aku tidak berlari secepat dia).", "Jebakan pelajar Indonesia: urutan bahasa Indonesia \"Dia berlari lebih cepat dari aku\" membuat pelajar menulis 他跑比我得快 (得 terpisah dari kata kerja). Ingat: 得 selalu menempel langsung setelah kata kerja; 比 + B masuk sebelum kata kerja atau setelah 得, tidak di antara KK dan 得."], "poin": ["A 比 B + KK得KS.", "A + KK得 + 比 B + KS.", "得 selalu langsung setelah KK.", "Tanpa 很; boleh 多了/一点儿/更.", "Ingkar: A 没有 B + KK得KS."], "contoh": [{"zh": "昨天比今天下得大。", "py": "Zuótiān bǐ jīntiān xià de dà.", "id": "Kemarin (salju) turun lebih lebat daripada hari ini.", "b": true, "tr": "12-3"}, {"zh": "妈妈比我睡得晚。", "py": "Māma bǐ wǒ shuì de wǎn.", "id": "Ibu tidur lebih larut daripada aku.", "b": true, "tr": null}, {"zh": "李文跑得比白家月快。", "py": "Lǐ Wén pǎo de bǐ Bái Jiāyuè kuài.", "id": "Li Wen berlari lebih cepat daripada Bai Jiayue.", "b": true, "tr": null}, {"zh": "我写得比他快。", "py": "Wǒ xiě de bǐ tā kuài.", "id": "Aku menulis lebih cepat daripada dia.", "b": true, "tr": null}, {"zh": "他跑得比我快，但是他等着我。", "py": "Tā pǎo de bǐ wǒ kuài, dànshì tā děng zhe wǒ.", "id": "Dia berlari lebih cepat dariku, tetapi dia menungguku.", "b": true, "tr": null}, {"zh": "你今天比他来得早。", "py": "Nǐ jīntiān bǐ tā lái de zǎo.", "id": "Hari ini kamu datang lebih awal daripada dia.", "b": false, "tr": null}, {"zh": "姐姐比我吃得多。", "py": "Jiějie bǐ wǒ chī de duō.", "id": "Kakak makan lebih banyak daripada aku.", "b": false, "tr": null}, {"zh": "弟弟起得比我早。", "py": "Dìdi qǐ de bǐ wǒ zǎo.", "id": "Adik bangun lebih pagi daripada aku.", "b": false, "tr": null}, {"zh": "安妮说得比我好多了。", "py": "Ānnī shuō de bǐ wǒ hǎoduō le.", "id": "Annie berbicara jauh lebih bagus daripada aku.", "b": false, "tr": null}, {"zh": "这个外国人写得比我还好看。", "py": "Zhège wàiguó rén xiě de bǐ wǒ hái hǎokàn.", "id": "Orang asing ini menulis lebih bagus bahkan daripada aku.", "b": false, "tr": null}, {"zh": "我没有他跑得快。", "py": "Wǒ méiyǒu tā pǎo de kuài.", "id": "Aku tidak berlari secepat dia.", "b": false, "tr": null}], "salah": [{"s": "他跑比我得快。", "sp": "Tā pǎo bǐ wǒ de kuài.", "n": "", "b": "他跑得比我快。 / 他比我跑得快。", "bp": "Tā pǎo de bǐ wǒ kuài. / Tā bǐ wǒ pǎo de kuài.", "a": "得 harus langsung setelah kata kerja."}, {"s": "他跑得比我很快。", "sp": "Tā pǎo de bǐ wǒ hěn kuài.", "n": "", "b": "他跑得比我快。", "bp": "Tā pǎo de bǐ wǒ kuài.", "a": "Tidak pakai 很 dalam kalimat 比."}, {"s": "我比他得睡晚。", "sp": "Wǒ bǐ tā de shuì wǎn.", "n": "", "b": "我比他睡得晚。", "bp": "Wǒ bǐ tā shuì de wǎn.", "a": "Urutan: KK + 得 + KS."}], "latihan": [{"k": "12-2.0", "t": "pg", "q": "妈妈比我睡___晚。", "o": ["得", "的", "地", "着"], "a": 0, "x": "Pelengkap keadaan: KK + 得.", "f": "妈妈比我睡得晚。", "fp": "Māma bǐ wǒ shuì de wǎn."}, {"k": "12-2.1", "t": "pg", "q": "李文跑得___白家月快。", "o": ["比", "没", "跟", "很"], "a": 0, "x": "KK得 + 比 + B + KS.", "f": "李文跑得比白家月快。", "fp": "Lǐ Wén pǎo de bǐ Bái Jiāyuè kuài."}, {"k": "12-2.2", "t": "pg", "q": "\"Aku menulis lebih cepat daripada dia\" (pilih yang benar) =", "o": ["我写得比他快。", "我写比他得快。", "我得写比他快。", "我写得很比他快。"], "a": 0, "x": "KK得 + 比 B + KS."}, {"k": "12-2.3", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["他比我跑得快。", "他跑得比我快。", "他跑比我得快。", "他跑得比我快多了。"], "a": 2, "x": "得 harus menempel pada KK."}, {"k": "12-2.4", "t": "pg", "q": "他跑得比我___。", "o": ["快多了", "很快", "非常快", "太快"], "a": 0, "x": "Boleh 多了; tidak boleh 很/非常/太.", "f": "他跑得比我快多了。", "fp": "Tā pǎo de bǐ wǒ kuài duō le."}, {"k": "12-2.5", "t": "pg", "q": "Ingkar dari \"他比我跑得快\" =", "o": ["我没有他跑得快。", "我不比他跑得快了。", "我跑得不比他。", "我没跑得他快。"], "a": 0, "x": "A 没有 B + KK得KS."}, {"k": "12-2.6", "t": "pg", "q": "A: 家月，你今天来得真早！ B: 老师，天中___，他去外面跑步了。", "o": ["比我来得早", "来得比我很早", "比我得来早", "来比我得早"], "a": 0, "x": "比 B + KK得KS."}, {"k": "12-2.7", "t": "su", "w": ["妈妈比", "我", "睡得", "晚"], "s": "妈妈比我睡得晚。", "alt": [], "p": "Māma bǐ wǒ shuì de wǎn.", "x": "Ibu tidur lebih larut daripada aku."}, {"k": "12-2.8", "t": "su", "w": ["李文", "跑得比", "白家月", "快"], "s": "李文跑得比白家月快。", "alt": [], "p": "Lǐ Wén pǎo de bǐ Bái Jiāyuè kuài.", "x": "Li Wen berlari lebih cepat daripada Bai Jiayue."}, {"k": "12-2.9", "t": "su", "w": ["昨天比", "今天", "下得", "大"], "s": "昨天比今天下得大。", "alt": ["今天昨天比下得大。"], "p": "Zuótiān bǐ jīntiān xià de dà.", "x": "Kemarin turun lebih lebat daripada hari ini."}, {"k": "12-2.10", "t": "su", "w": ["姐姐比", "我", "吃得", "多"], "s": "姐姐比我吃得多。", "alt": [], "p": "Jiějie bǐ wǒ chī de duō.", "x": "Kakak makan lebih banyak daripada aku."}, {"k": "12-2.11", "t": "su", "w": ["弟弟", "起得比", "我", "早"], "s": "弟弟起得比我早。", "alt": [], "p": "Dìdi qǐ de bǐ wǒ zǎo.", "x": "Adik bangun lebih pagi daripada aku."}, {"k": "12-2.12", "t": "su", "w": ["安妮", "说得比", "我", "好", "多了"], "s": "安妮说得比我好多了。", "alt": [], "p": "Ānnī shuō de bǐ wǒ hǎoduō le.", "x": "Annie berbicara jauh lebih bagus daripada aku."}, {"k": "12-2.13", "t": "bs", "s": "我比他睡得晚。", "sp": "Wǒ bǐ tā shuì de wǎn.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "12-2.14", "t": "bs", "s": "她唱比我得好。", "sp": "Tā chàng bǐ wǒ de hǎo.", "n": "", "ok": false, "b": "她唱得比我好。", "bp": "Tā chàng de bǐ wǒ hǎo.", "x": "得 setelah kata kerja."}, {"k": "12-2.15", "t": "bs", "s": "他来得比我非常早。", "sp": "Tā lái de bǐ wǒ fēicháng zǎo.", "n": "", "ok": false, "b": "他来得比我早。", "bp": "Tā lái de bǐ wǒ zǎo.", "x": "Tidak pakai 非常."}, {"k": "12-2.16", "t": "bs", "s": "我写得比他快。", "sp": "Wǒ xiě de bǐ tā kuài.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "12-2.17", "t": "bs", "s": "我没有他跑得快。", "sp": "Wǒ méiyǒu tā pǎo de kuài.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: bentuk ingkar."}]}, {"id": "12-3", "pel": 12, "judul": "Kalimat perbandingan (6): 比 + objek + pelengkap keadaan", "kode": "比较句（6）", "rumus": ["A + KK + O + KK + 得 + 比 B + KS", "A + O + KK + 得 + 比 B + KS", "A + KK + O + 比 B + KK + 得 + KS"], "jelas": ["Jika kata kerja punya objek SEKALIGUS pelengkap keadaan, objek tidak boleh langsung diikuti 得. Ada dua jalan: ulangi kata kerjanya, atau pindahkan objek ke depan.", "Ulangi kata kerja: 他踢足球踢得比我好 / 他踢足球比我踢得好. Kata kerja pisah (跑步, 游泳, 唱歌, 跳舞) mengulang bagian kata kerjanya: 你跑步跑得比我快.", "Pindahkan objek ke depan kata kerja: 白家月汉字写得比陈天中好 (Bai Jiayue, hanzinya ditulis lebih bagus daripada Chen Tianzhong).", "Posisi 比 tetap fleksibel seperti pola (5): sebelum kata kerja kedua (他踢足球比我踢得好) atau setelah 得 (他踢足球踢得比我好).", "Jebakan pelajar Indonesia: langsung menempelkan 得 setelah objek: 他跑步得比我快, 她写汉字得比我好 — keduanya salah. Bahasa Indonesia tidak punya aturan ini, jadi biasakan \"ulang kata kerja\" setiap kali ada objek + 得."], "poin": ["Objek + 得 tidak boleh langsung.", "Ulangi KK: 跑步跑得比我快.", "Atau objek ke depan: 汉字写得比他好.", "比 sebelum KK kedua atau setelah 得."], "contoh": [{"zh": "你跑步跑得比我快。", "py": "Nǐ pǎobù pǎo de bǐ wǒ kuài.", "id": "Larimu lebih cepat daripada aku.", "b": true, "tr": "12-5"}, {"zh": "白家月汉字写得比陈天中好。", "py": "Bái Jiāyuè Hànzì xiě de bǐ Chén Tiānzhōng hǎo.", "id": "Tulisan hanzi Bai Jiayue lebih bagus daripada Chen Tianzhong.", "b": true, "tr": null}, {"zh": "他踢足球比我踢得好。", "py": "Tā tī zúqiú bǐ wǒ tī de hǎo.", "id": "Dia bermain sepak bola lebih baik daripada aku.", "b": true, "tr": null}, {"zh": "他打篮球打得比我好。", "py": "Tā dǎ lánqiú dǎ de bǐ wǒ hǎo.", "id": "Dia main basket lebih bagus daripada aku.", "b": false, "tr": null}, {"zh": "妈妈做菜做得比爸爸好吃。", "py": "Māma zuò cài zuò de bǐ bàba hǎochī.", "id": "Masakan ibu lebih enak daripada masakan ayah.", "b": false, "tr": null}, {"zh": "李文唱歌唱得比我好。", "py": "Lǐ Wén chànggē chàng de bǐ wǒ hǎo.", "id": "Li Wen bernyanyi lebih bagus daripada aku.", "b": false, "tr": null}, {"zh": "安妮汉语说得比我好多了。", "py": "Ānnī Hànyǔ shuō de bǐ wǒ hǎoduō le.", "id": "Bahasa Mandarin Annie jauh lebih bagus daripada aku.", "b": false, "tr": null}, {"zh": "杨同乐跳舞跳得比我好。", "py": "Yáng Tónglè tiàowǔ tiào de bǐ wǒ hǎo.", "id": "Yang Tongle menari lebih bagus daripada aku.", "b": false, "tr": null}, {"zh": "她游泳比我游得快。", "py": "Tā yóuyǒng bǐ wǒ yóu de kuài.", "id": "Dia berenang lebih cepat daripada aku.", "b": false, "tr": null}, {"zh": "我写汉字写得没有他好。", "py": "Wǒ xiě Hànzì xiě de méiyǒu tā hǎo.", "id": "Aku menulis hanzi tidak sebagus dia.", "b": false, "tr": null}], "salah": [{"s": "你跑步得比我快。", "sp": "Nǐ pǎobù de bǐ wǒ kuài.", "n": "", "b": "你跑步跑得比我快。", "bp": "Nǐ pǎobù pǎo de bǐ wǒ kuài.", "a": "Kata kerja pisah harus diulang sebelum 得."}, {"s": "她写汉字得比我好。", "sp": "Tā xiě Hànzì de bǐ wǒ hǎo.", "n": "", "b": "她写汉字写得比我好。 / 她汉字写得比我好。", "bp": "Tā xiě Hànzì xiě de bǐ wǒ hǎo. / Tā Hànzì xiě de bǐ wǒ hǎo.", "a": "Objek tidak boleh langsung diikuti 得."}, {"s": "他踢足球比我得好。", "sp": "Tā tī zúqiú bǐ wǒ de hǎo.", "n": "", "b": "他踢足球比我踢得好。", "bp": "Tā tī zúqiú bǐ wǒ tī de hǎo.", "a": "Sebelum 得 harus ada kata kerja."}], "latihan": [{"k": "12-3.0", "t": "pg", "q": "你跑步___得比我快。", "o": ["跑", "步", "走", "得"], "a": 0, "x": "Ulangi bagian kata kerja: 跑步跑得.", "f": "你跑步跑得比我快。", "fp": "Nǐ pǎobù pǎo de bǐ wǒ kuài."}, {"k": "12-3.1", "t": "pg", "q": "白家月汉字___得比陈天中好。", "o": ["写", "看", "学", "说"], "a": 0, "x": "Objek ke depan, lalu 写得.", "f": "白家月汉字写得比陈天中好。", "fp": "Bái Jiāyuè Hànzì xiě de bǐ Chén Tiānzhōng hǎo."}, {"k": "12-3.2", "t": "pg", "q": "他踢足球比我___好。", "o": ["踢得", "得", "的踢", "踢的"], "a": 0, "x": "比 B + KK得 + KS.", "f": "他踢足球比我踢得好。", "fp": "Tā tī zúqiú bǐ wǒ tī de hǎo."}, {"k": "12-3.3", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["他唱歌唱得比我好。", "他唱歌比我唱得好。", "他唱歌得比我好。", "他歌唱得比我好。"], "a": 2, "x": "Objek 歌 tidak boleh langsung diikuti 得."}, {"k": "12-3.4", "t": "pg", "q": "\"Ibu memasak lebih enak daripada ayah\" =", "o": ["妈妈做菜做得比爸爸好吃。", "妈妈做菜得比爸爸好吃。", "妈妈比爸爸做菜得好吃。", "妈妈做得菜比爸爸好吃。"], "a": 0, "x": "Ulangi KK: 做菜做得."}, {"k": "12-3.5", "t": "pg", "q": "A: 你们几个谁打篮球打得好？ B: 李文，他___。", "o": ["打得比我们都好", "打比我们得好", "得打比我们好", "比我们得打好"], "a": 0, "x": "KK得 + 比 B + KS."}, {"k": "12-3.6", "t": "pg", "q": "Bentuk ingkar yang benar:", "o": ["我写汉字写得没有他好。", "我写汉字得没有他好。", "我没写汉字得他好。", "我写汉字不比得他好。"], "a": 0, "x": "Ulangi KK, lalu 没有 B + KS."}, {"k": "12-3.7", "t": "su", "w": ["你", "跑步", "跑得比", "我", "快"], "s": "你跑步跑得比我快。", "alt": [], "p": "Nǐ pǎobù pǎo de bǐ wǒ kuài.", "x": "Larimu lebih cepat daripada aku."}, {"k": "12-3.8", "t": "su", "w": ["白家月", "汉字", "写得比", "陈天中", "好"], "s": "白家月汉字写得比陈天中好。", "alt": [], "p": "Bái Jiāyuè Hànzì xiě de bǐ Chén Tiānzhōng hǎo.", "x": "Tulisan hanzi Bai Jiayue lebih bagus daripada Chen Tianzhong."}, {"k": "12-3.9", "t": "su", "w": ["他踢足球比", "我", "踢得", "好"], "s": "他踢足球比我踢得好。", "alt": [], "p": "Tā tī zúqiú bǐ wǒ tī de hǎo.", "x": "Dia bermain sepak bola lebih baik daripada aku."}, {"k": "12-3.10", "t": "su", "w": ["妈妈", "做菜", "做得比", "爸爸", "好吃"], "s": "妈妈做菜做得比爸爸好吃。", "alt": [], "p": "Māma zuò cài zuò de bǐ bàba hǎochī.", "x": "Masakan ibu lebih enak daripada masakan ayah."}, {"k": "12-3.11", "t": "su", "w": ["李文", "唱歌", "唱得比", "我", "好"], "s": "李文唱歌唱得比我好。", "alt": [], "p": "Lǐ Wén chànggē chàng de bǐ wǒ hǎo.", "x": "Li Wen bernyanyi lebih bagus daripada aku."}, {"k": "12-3.12", "t": "su", "w": ["她游泳比", "我", "游得", "快"], "s": "她游泳比我游得快。", "alt": [], "p": "Tā yóuyǒng bǐ wǒ yóu de kuài.", "x": "Dia berenang lebih cepat daripada aku."}, {"k": "12-3.13", "t": "bs", "s": "他打篮球打得比我好。", "sp": "Tā dǎ lánqiú dǎ de bǐ wǒ hǎo.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "12-3.14", "t": "bs", "s": "我跳舞得比他好。", "sp": "Wǒ tiàowǔ de bǐ tā hǎo.", "n": "", "ok": false, "b": "我跳舞跳得比他好。", "bp": "Wǒ tiàowǔ tiào de bǐ tā hǎo.", "x": "Ulangi 跳."}, {"k": "12-3.15", "t": "bs", "s": "安妮汉语说得比我好多了。", "sp": "Ānnī Hànyǔ shuō de bǐ wǒ hǎoduō le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: objek di depan."}, {"k": "12-3.16", "t": "bs", "s": "他写汉字得比我快。", "sp": "Tā xiě Hànzì de bǐ wǒ kuài.", "n": "", "ok": false, "b": "他写汉字写得比我快。", "bp": "Tā xiě Hànzì xiě de bǐ wǒ kuài.", "x": "Objek tidak langsung diikuti 得."}, {"k": "12-3.17", "t": "bs", "s": "她游泳比我游得快。", "sp": "Tā yóuyǒng bǐ wǒ yóu de kuài.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "13-1", "pel": 13, "judul": "Kalimat dua objek (2): 拿/送/卖 + 给 + orang + benda", "kode": "双宾语句（2）", "rumus": ["S + 送/拿/卖 + 给 + orang + benda", "S + 送/拿/卖 + benda + 给 + orang", "S + 送 + orang + benda (送 tanpa 给)"], "jelas": ["Kalimat dua objek punya satu kata kerja dengan dua objek: objek pertama orang (penerima), objek kedua benda. Di pelajaran ini kata kerja 拿 (ambil), 送 (beri/hadiahkan), 卖 (jual) digabung dengan 给 (kepada): 她拿给我一杯水 = dia mengambilkan aku segelas air.", "Urutannya: KK + 给 + orang + benda. 他卖给我一本中文书 = dia menjual sebuah buku bahasa Mandarin kepadaku. Orang SELALU di depan benda.", "Urutan lain yang juga benar: KK + benda + 给 + orang: 我送一本书给她. Untuk 送, kata 给 boleh dihilangkan: 我们班同学送了王老师漂亮的花. Tetapi 拿 dan 卖 harus dengan 给 (卖我一本书, 拿我一杯水 terasa salah).", "Penanda waktu 了/过 diletakkan setelah 给: 安妮送给了我一个本子, atau setelah 送 bila tanpa 给: 送了我一个本子. Untuk pemula, bentuk 送给我一个…… paling aman.", "Jebakan pelajar Indonesia: urutan bahasa Indonesia \"memberi buku kepada dia\" membuat pelajar menulis 送给一本书她 (benda sebelum orang) — salah. Pilih salah satu: 送给她一本书 atau 送一本书给她.", "Bedakan dengan 给 sebagai kata depan sebelum kata kerja: 给我打电话 (menelepon saya), 给你买 (membelikan untukmu). Di pola ini 给 berada SETELAH kata kerja 拿/送/卖."], "poin": ["KK + 给 + orang + benda.", "Atau KK + benda + 给 + orang.", "送 boleh tanpa 给; 拿/卖 wajib 给.", "Orang selalu sebelum benda jika keduanya setelah 给."], "contoh": [{"zh": "王老师喜欢花，就送给她花吧。", "py": "Wáng lǎoshī xǐhuan huā, jiù sòng gěi tā huā ba.", "id": "Guru Wang suka bunga, kita beri beliau bunga saja.", "b": true, "tr": "13-1"}, {"zh": "她拿给我一杯水。", "py": "Tā ná gěi wǒ yì bēi shuǐ.", "id": "Dia mengambilkan aku segelas air.", "b": true, "tr": null}, {"zh": "他卖给我一本中文书。", "py": "Tā mài gěi wǒ yì běn Zhōngwén shū.", "id": "Dia menjual sebuah buku bahasa Mandarin kepadaku.", "b": true, "tr": null}, {"zh": "我送给她一本书。", "py": "Wǒ sòng gěi tā yì běn shū.", "id": "Aku memberinya sebuah buku.", "b": true, "tr": null}, {"zh": "新年就要到了，安妮送给我一个新本子。", "py": "Xīnnián jiù yào dào le, Ānnī sòng gěi wǒ yí gè xīn běnzi.", "id": "Tahun Baru sebentar lagi, Annie memberiku sebuah buku tulis baru.", "b": true, "tr": "13-7"}, {"zh": "我们班同学也送了王老师漂亮的花。", "py": "Wǒmen bān tóngxué yě sòng le Wáng lǎoshī piàoliang de huā.", "id": "Teman-teman sekelas juga memberi Guru Wang bunga yang cantik.", "b": true, "tr": "13-7"}, {"zh": "谢谢！那我送给你什么呢？", "py": "Xièxie! Nà wǒ sòng gěi nǐ shénme ne?", "id": "Terima kasih! Lalu aku memberimu apa?", "b": true, "tr": "13-5"}, {"zh": "你觉得送给她什么好呢？", "py": "Nǐ juéde sòng gěi tā shénme hǎo ne?", "id": "Menurutmu sebaiknya kita beri dia apa?", "b": true, "tr": "13-1"}, {"zh": "爸爸送给我一个新手机。", "py": "Bàba sòng gěi wǒ yí gè xīn shǒujī.", "id": "Ayah memberiku HP baru.", "b": false, "tr": null}, {"zh": "请拿给我那本书。", "py": "Qǐng ná gěi wǒ nà běn shū.", "id": "Tolong ambilkan aku buku itu.", "b": false, "tr": null}, {"zh": "那个人卖给我一个很便宜的手机。", "py": "Nàge rén mài gěi wǒ yí gè hěn piányi de shǒujī.", "id": "Orang itu menjual HP yang sangat murah kepadaku.", "b": false, "tr": null}, {"zh": "我想送一个杯子给妈妈。", "py": "Wǒ xiǎng sòng yí gè bēizi gěi māma.", "id": "Aku ingin memberi ibu sebuah cangkir.", "b": false, "tr": null}, {"zh": "生日的时候，朋友送给我很多礼物。", "py": "Shēngrì de shíhou, péngyou sòng gěi wǒ hěn duō lǐwù.", "id": "Saat ulang tahun, teman-teman memberiku banyak hadiah.", "b": false, "tr": null}], "salah": [{"s": "我送给一本书她。", "sp": "Wǒ sòng gěi yì běn shū tā.", "n": "", "b": "我送给她一本书。", "bp": "Wǒ sòng gěi tā yì běn shū.", "a": "Orang (她) sebelum benda (一本书)."}, {"s": "他卖我一本书。", "sp": "Tā mài wǒ yì běn shū.", "n": "", "b": "他卖给我一本书。", "bp": "Tā mài gěi wǒ yì běn shū.", "a": "卖 harus dengan 给."}, {"s": "她拿我一杯水。", "sp": "Tā ná wǒ yì bēi shuǐ.", "n": "", "b": "她拿给我一杯水。", "bp": "Tā ná gěi wǒ yì bēi shuǐ.", "a": "拿 harus dengan 给."}], "latihan": [{"k": "13-1.0", "t": "pg", "q": "她拿___我一杯水。", "o": ["给", "在", "从", "到"], "a": 0, "x": "拿 + 给 + orang + benda.", "f": "她拿给我一杯水。", "fp": "Tā ná gěi wǒ yì bēi shuǐ."}, {"k": "13-1.1", "t": "pg", "q": "\"Dia menjual buku kepadaku\" =", "o": ["他卖给我一本书。", "他卖一本书我。", "他卖给一本书我。", "他给卖我一本书。"], "a": 0, "x": "卖 + 给 + orang + benda."}, {"k": "13-1.2", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["我送给她一本书。", "我送一本书给她。", "我送给一本书她。", "我们送了王老师花。"], "a": 2, "x": "Orang sebelum benda."}, {"k": "13-1.3", "t": "pg", "q": "Kata kerja mana yang boleh TANPA 给 dalam pola dua objek?", "o": ["送", "卖", "拿", "走"], "a": 0, "x": "送 + orang + benda boleh; 拿/卖 perlu 给."}, {"k": "13-1.4", "t": "pg", "q": "A: 昨天你过生日，爸爸送___什么？ B: 一个新手机。", "o": ["给你", "你给", "给了你的", "你的给"], "a": 0, "x": "送给 + orang."}, {"k": "13-1.5", "t": "pg", "q": "我想送___，她会喜欢吗？", "o": ["给她一本书", "一本书她", "她给一本书", "给一本书她"], "a": 0, "x": "送给 + orang + benda.", "f": "我想送给她一本书，她会喜欢吗？", "fp": "Wǒ xiǎng sòng gěi tā yì běn shū, tā huì xǐhuan ma?"}, {"k": "13-1.6", "t": "pg", "q": "\"Tolong ambilkan aku segelas air\" =", "o": ["请拿给我一杯水。", "请拿我一杯水给。", "请给拿我一杯水。", "请拿一杯给水我。"], "a": 0, "x": "拿给 + orang + benda."}, {"k": "13-1.7", "t": "su", "w": ["她", "拿给", "我", "一", "杯", "水"], "s": "她拿给我一杯水。", "alt": [], "p": "Tā ná gěi wǒ yì bēi shuǐ.", "x": "Dia mengambilkan aku segelas air."}, {"k": "13-1.8", "t": "su", "w": ["他", "卖给", "我", "一", "本", "中文", "书"], "s": "他卖给我一本中文书。", "alt": [], "p": "Tā mài gěi wǒ yì běn Zhōngwén shū.", "x": "Dia menjual sebuah buku b = kakak tiga tahun lebih tua dariku.", "Selisih bisa berupa umur (三岁), jumlah (十个), waktu (五个多小时, 半个小时), uang (十块钱), tinggi, dan lain-lain: 坐飞机比坐火车快五个多小时.", "Bila menyatakan perubahan atau hasil yang sudah terjadi, sering ada 了 setelah kata sifat: 今天的词比昨天多了十个 (hari ini kosakatanya sepuluh lebih banyak dari kemarin).", "Jangan letakkan jumlah sebelum kata sifat. Bahasa Indonesia berkata \"tiga tahun lebih tua\", jadi pelajar sering menulis 姐姐比我三岁大 — salah. Dalam Mandarin: KS dulu, baru jumlah.", "Sama seperti kalimat 比 lainnya: tidak memakai 很/非常/太. Pola 没有 juga tidak bisa diberi jumlah; untuk \"lebih muda tiga tahun\" pakai 比 + 小三岁: 我比姐姐小三岁.", "Bertanya selisih: A 比 B + KS + 多少/几 + satuan？ 你比弟弟大几岁？ 这个比那个贵多少钱？"], "poin": ["A 比 B + KS + jumlah.", "Jumlah SETELAH kata sifat.", "Perubahan: KS + 了 + jumlah.", "Tanya: 大几岁？/ 贵多少？"], "contoh": [{"zh": "今天的词比昨天多了十个。", "py": "Jīntiān de cí bǐ zuótiān duō le shí gè.", "id": "Kosakata hari ini sepuluh lebih banyak daripada kemarin.", "b": true, "tr": "13-3"}, {"zh": "姐姐比我大三岁。", "py": "Jiějie bǐ wǒ dà sān suì.", "id": "Kakak tiga tahun lebih tua dariku.", "b": true, "tr": null}, {"zh": "坐飞机比坐火车快五个多小时。", "py": "Zuò fēijī bǐ zuò huǒchē kuài wǔ gè duō xiǎoshí.", "id": "Naik pesawat lima jam lebih cepat daripada naik kereta.", "b": true, "tr": null}, {"zh": "我哥哥比我大两岁。", "py": "Wǒ gēge bǐ wǒ dà liǎng suì.", "id": "Kakak laki-lakiku dua tahun lebih tua dariku.", "b": true, "tr": null}, {"zh": "\"日\"比\"口\"多一笔。", "py": "\"Rì\" bǐ\" kǒu\" duō yì bǐ.", "id": "\"日\" satu goresan lebih banyak daripada \"口\".", "b": true, "tr": "13-3"}, {"zh": "他今年二十九岁，比我还小一岁呢。", "py": "Tā jīnnián èrshíjiǔ suì, bǐ wǒ hái xiǎo yí suì ne.", "id": "Tahun ini dia dua puluh sembilan tahun, malah satu tahun lebih muda dariku.", "b": true, "tr": null}, {"zh": "今天我比昨天早起了半个小时。", "py": "Jīntiān wǒ bǐ zuótiān zǎo qǐ le bàn gè xiǎoshí.", "id": "Hari ini aku bangun setengah jam lebih awal daripada kemarin.", "b": false, "tr": null}, {"zh": "这件衣服比那件贵五十块钱。", "py": "Zhè jiàn yīfu bǐ nà jiàn guì wǔshí kuài qián.", "id": "Baju ini lima puluh yuan lebih mahal daripada yang itu.", "b": false, "tr": null}, {"zh": "我们班比他们班多三个学生。", "py": "Wǒmen bān bǐ tāmen bān duō sān gè xuéshēng.", "id": "Kelas kami tiga murid lebih banyak daripada kelas mereka.", "b": false, "tr": null}, {"zh": "你比弟弟大几岁？——我比他大四岁。", "py": "Nǐ bǐ dìdi dà jǐ suì? — Wǒ bǐ tā dà sì suì.", "id": "Kamu berapa tahun lebih tua dari adikmu? — Empat tahun.", "b": false, "tr": null}, {"zh": "这一课的汉字比第十课多二十个。", "py": "Zhè yí kè de Hànzì bǐ dì shí kè duō èrshí gè.", "id": "Hanzi pelajaran ini dua puluh lebih banyak daripada pelajaran sepuluh.", "b": false, "tr": null}, {"zh": "这个手机比那个贵多少钱？", "py": "Zhège shǒujī bǐ nàge guì duōshao qián?", "id": "HP ini lebih mahal berapa daripada yang itu?", "b": false, "tr": null}], "salah": [{"s": "姐姐比我三岁大。", "sp": "Jiějie bǐ wǒ sān suì dà.", "n": "", "b": "姐姐比我大三岁。", "bp": "Jiějie bǐ wǒ dà sān suì.", "a": "Jumlah setelah kata sifat."}, {"s": "他比我很大两岁。", "sp": "Tā bǐ wǒ hěn dà liǎng suì.", "n": "", "b": "他比我大两岁。", "bp": "Tā bǐ wǒ dà liǎng suì.", "a": "Tidak memakai 很."}, {"s": "我没有他大三岁。", "sp": "Wǒ méiyǒu tā dà sān suì.", "n": "", "b": "我比他小三岁。", "bp": "Wǒ bǐ tā xiǎo sān suì.", "a": "Pola 没有 tidak bisa diberi jumlah."}], "latihan": [{"k": "13-2.0", "t": "pg", "q": "姐姐比我___。", "o": ["大三岁", "三岁大", "很大三岁", "大岁三"], "a": 0, "x": "KS + jumlah.", "f": "姐姐比我大三岁。", "fp": "Jiějie bǐ wǒ dà sān suì."}, {"k": "13-2.1", "t": "pg", "q": "今天的词比昨天多了___。", "o": ["十个", "个十", "十", "很多十个"], "a": 0, "x": "Bilangan + satuan: 十个.", "f": "今天的词比昨天多了十个。", "fp": "Jīntiān de cí bǐ zuótiān duō le shí gè."}, {"k": "13-2.2", "t": "pg", "q": "\"Naik pesawat lima jam lebih cepat daripada naik kereta\" =", "o": ["坐飞机比坐火车快五个小时。", "坐飞机比坐火车五个小时快。", "坐飞机五个小时比坐火车快。", "坐飞机比五个小时坐火车快。"], "a": 0, "x": "KS + jumlah."}, {"k": "13-2.3", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["我比他大两岁。", "这件比那件贵十块钱。", "他比我两岁小。", "我们班比他们班多三个学生。"], "a": 2, "x": "Jumlah setelah KS: 小两岁."}, {"k": "13-2.4", "t": "pg", "q": "A: 你比弟弟大几岁？ B: ___", "o": ["我比他大四岁。", "我比他四岁大。", "我大他比四岁。", "我比他很大四岁。"], "a": 0, "x": "A 比 B + KS + jumlah."}, {"k": "13-2.5", "t": "pg", "q": "A: 今天你是几点起床的？ B: 七点半，比昨天___。", "o": ["早半个小时", "半个小时早", "很早半个小时", "早了半"], "a": 0, "x": "KS + jumlah waktu."}, {"k": "13-2.6", "t": "pg", "q": "\"Dia satu tahun lebih muda dariku\" =", "o": ["他比我小一岁。", "他没有我大一岁。", "他比我一岁小。", "他小比我一岁。"], "a": 0, "x": "Pakai 比 + 小 + jumlah."}, {"k": "13-2.7", "t": "su", "w": ["姐姐", "比", "我", "大", "三", "岁"], "s": "姐姐比我大三岁。", "alt": [], "p": "Jiějie bǐ wǒ dà sān suì.", "x": "Kakak tiga tahun lebih tua dariku."}, {"k": "13-2.8", "t": "su", "w": ["今天", "的", "词", "比", "昨天", "多了", "十", "个"], "s": "今天的词比昨天多了十个。", "alt": ["的今天词比昨天多了十个。"], "p": "Jīntiān de cí bǐ zuótiān duō le shí gè.", "x": "Kosakata hari ini sepuluh lebih banyak daripada kemarin."}, {"k": "13-2.9", "t": "su", "w": ["这", "件", "衣服", "比", "那", "件", "贵", "五十", "块", "钱"], "s": "这件衣服比那件贵五十块钱。", "alt": [], "p": "Zhè jiàn yīfu bǐ nà jiàn guì wǔshí kuài qián.", "x": "Baju ini lima puluh yuan lebih mahal daripada yang itu."}, {"k": "13-2.10", "t": "su", "w": ["我们", "班", "比", "他们", "班", "多", "三", "个", "学生"], "s": "我们班比他们班多三个学生。", "alt": [], "p": "Wǒmen bān bǐ tāmen bān duō sān gè xuéshēng.", "x": "Kelas kami tiga murid lebih banyak daripada kelas mereka."}, {"k": "13-2.11", "t": "su", "w": ["你", "比", "弟弟", "大", "几", "岁"], "s": "你比弟弟大几岁？", "alt": [], "p": "Nǐ bǐ dìdi dà jǐ suì?", "x": "Kamu berapa tahun lebih tua dari adikmu?"}, {"k": "13-2.12", "t": "su", "w": ["坐", "飞机", "比", "坐", "火车", "快", "五", "个", "多", "小时"], "s": "坐飞机比坐火车快五个多小时。", "alt": [], "p": "Zuò fēijī bǐ zuò huǒchē kuài wǔ gè duō xiǎoshí.", "x": "Naik pesawat lima jam lebih cepat daripada naik kereta."}, {"k": "13-2.13", "t": "bs", "s": "我哥哥比我两岁大。", "sp": "Wǒ gēge bǐ wǒ liǎng suì dà.", "n": "", "ok": false, "b": "我哥哥比我大两岁。", "bp": "Wǒ gēge bǐ wǒ dà liǎng suì.", "x": "Jumlah setelah KS."}, {"k": "13-2.14", "t": "bs", "s": "\"日\"比\"口\"多一笔。", "sp": "\"Rì\" bǐ\" kǒu\" duō yì bǐ.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "13-2.15", "t": "bs", "s": "这个比那个很贵十块钱。", "sp": "Zhège bǐ nàge hěn guì shí kuài qián.", "n": "", "ok": false, "b": "这个比那个贵十块钱。", "bp": "Zhège bǐ nàge guì shí kuài qián.", "x": "Tidak pakai 很."}, {"k": "13-2.16", "t": "bs", "s": "今天我比昨天早起了半个小时。", "sp": "Jīntiān wǒ bǐ zuótiān zǎo qǐ le bàn gè xiǎoshí.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "13-2.17", "t": "bs", "s": "我没有姐姐大三岁。", "sp": "Wǒ méiyǒu jiějie dà sān suì.", "n": "", "ok": false, "b": "我比姐姐小三岁。", "bp": "Wǒ bǐ jiějie xiǎo sān suì.", "x": "没有 tidak bisa dengan jumlah."}]}, {"id": "13-3", "pel": 13, "judul": "Kalimat perbandingan (8): A 比 B + KS + 一点儿/一些", "kode": "比较句（8）", "rumus": ["A + 比 + B + KS + 一点儿", "A + 比 + B + KS + 一些"], "jelas": ["一点儿 atau 一些 setelah kata sifat dalam kalimat 比 menyatakan perbedaan yang KECIL: \"sedikit lebih …\". 姐姐比我高一点儿 = kakak sedikit lebih tinggi dariku.", "一点儿 dan 一些 maknanya hampir sama; 一些 sedikit lebih formal. Dalam lisan 一点儿 sering disingkat 点儿: 贵点儿.", "Jangan letakkan 一点儿 sebelum kata sifat: 比我一点儿高 salah. Urutan Mandarin: KS + 一点儿.", "Bedakan dengan 有点儿 + KS (agak, biasanya bernada tidak puas, TANPA perbandingan): 这个本子有点儿贵 = buku tulis ini agak mahal. Dalam kalimat 比 tidak boleh 有点儿: 这个比那个有点儿贵 salah → 这个比那个贵一点儿.", "Ringkasan tingkat selisih dalam kalimat 比: 一点儿/一些 (sedikit) – tanpa tambahan (biasa) – 多了/得多 (jauh) – bilangan (pasti). Semuanya diletakkan SETELAH kata sifat."], "poin": ["A 比 B + KS + 一点儿/一些 = sedikit lebih.", "一点儿 setelah KS, bukan sebelum.", "有点儿 + KS = agak (tanpa 比).", "Semua penanda selisih di belakang KS."], "contoh": [{"zh": "比我们一起买的那个本子贵一点儿。", "py": "Bǐ wǒmen yìqǐ mǎi de nàge běnzi guì yìdiǎnr.", "id": "Sedikit lebih mahal daripada buku tulis yang kita beli bersama.", "b": true, "tr": "13-5"}, {"zh": "姐姐比我高一点儿。", "py": "Jiějie bǐ wǒ gāo yìdiǎnr.", "id": "Kakak sedikit lebih tinggi dariku.", "b": true, "tr": null}, {"zh": "那间教室比这间大一些。", "py": "Nà jiān jiàoshì bǐ zhè jiān dà yìxiē.", "id": "Kelas itu sedikit lebih besar daripada kelas ini.", "b": true, "tr": null}, {"zh": "她告诉我是在网上买的，比我的本子贵一点儿。", "py": "Tā gàosu wǒ shì zài wǎngshang mǎi de, bǐ wǒ de běnzi guì yìdiǎnr.", "id": "Dia bilang membelinya online, sedikit lebih mahal daripada buku tulisku.", "b": true, "tr": "13-7"}, {"zh": "今天比昨天冷一点儿。", "py": "Jīntiān bǐ zuótiān lěng yìdiǎnr.", "id": "Hari ini sedikit lebih dingin daripada kemarin.", "b": false, "tr": null}, {"zh": "今天的苹果比昨天的便宜一点儿。", "py": "Jīntiān de píngguǒ bǐ zuótiān de piányi yìdiǎnr.", "id": "Apel hari ini sedikit lebih murah daripada kemarin.", "b": false, "tr": null}, {"zh": "这条白色的裤子比那条黑色的长一些。", "py": "Zhè tiáo báisè de kùzi bǐ nà tiáo hēisè de cháng yìxiē.", "id": "Celana putih ini sedikit lebih panjang daripada yang hitam itu.", "b": false, "tr": null}, {"zh": "我的书包比你的贵一点儿。", "py": "Wǒ de shūbāo bǐ nǐ de guì yìdiǎnr.", "id": "Tas sekolahku sedikit lebih mahal daripada punyamu.", "b": false, "tr": null}, {"zh": "弟弟比我跑得快一点儿。", "py": "Dìdi bǐ wǒ pǎo de kuài yìdiǎnr.", "id": "Adik berlari sedikit lebih cepat dariku.", "b": false, "tr": null}, {"zh": "这家店的咖啡比那家好喝一些。", "py": "Zhè jiā diàn de kāfēi bǐ nà jiā hǎo hē yìxiē.", "id": "Kopi di kedai ini sedikit lebih enak daripada yang itu.", "b": false, "tr": null}, {"zh": "我家离学校比你家近一点儿。", "py": "Wǒ jiā lí xuéxiào bǐ nǐ jiā jìn yìdiǎnr.", "id": "Rumahku sedikit lebih dekat ke sekolah daripada rumahmu.", "b": false, "tr": null}], "salah": [{"s": "姐姐比我一点儿高。", "sp": "Jiějie bǐ wǒ yìdiǎnr gāo.", "n": "", "b": "姐姐比我高一点儿。", "bp": "Jiějie bǐ wǒ gāo yìdiǎnr.", "a": "一点儿 setelah kata sifat."}, {"s": "这个比那个有点儿贵。", "sp": "Zhège bǐ nàge yǒudiǎnr guì.", "n": "", "b": "这个比那个贵一点儿。", "bp": "Zhège bǐ nàge guì yìdiǎnr.", "a": "Dalam kalimat 比 pakai KS + 一点儿, bukan 有点儿."}, {"s": "他比我很高一点儿。", "sp": "Tā bǐ wǒ hěn gāo yìdiǎnr.", "n": "", "b": "他比我高一点儿。", "bp": "Tā bǐ wǒ gāo yìdiǎnr.", "a": "Tidak memakai 很."}], "latihan": [{"k": "13-3.0", "t": "pg", "q": "姐姐比我高___。", "o": ["一点儿", "有点儿", "很", "非常"], "a": 0, "x": "Selisih kecil: KS + 一点儿.", "f": "姐姐比我高一点儿。", "fp": "Jiějie bǐ wǒ gāo yìdiǎnr."}, {"k": "13-3.1", "t": "pg", "q": "那间教室比这间___。", "o": ["大一些", "一些大", "有点儿大", "很大一些"], "a": 0, "x": "KS + 一些.", "f": "那间教室比这间大一些。", "fp": "Nà jiān jiàoshì bǐ zhè jiān dà yìxiē."}, {"k": "13-3.2", "t": "pg", "q": "\"Hari ini sedikit lebih dingin daripada kemarin\" =", "o": ["今天比昨天冷一点儿。", "今天比昨天一点儿冷。", "今天比昨天有点儿冷。", "今天一点儿比昨天冷。"], "a": 0, "x": "KS + 一点儿."}, {"k": "13-3.3", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["这个本子有点儿贵。", "这个本子比那个贵一点儿。", "这个本子比那个有点儿贵。", "这个本子比那个贵一些。"], "a": 2, "x": "Dengan 比 tidak pakai 有点儿."}, {"k": "13-3.4", "t": "pg", "q": "\"这个比那个贵一点儿\" artinya …", "o": ["Ini sedikit lebih mahal daripada itu.", "Ini jauh lebih mahal daripada itu.", "Ini agak mahal.", "Ini tidak semahal itu."], "a": 0, "x": "一点儿 = sedikit."}, {"k": "13-3.5", "t": "pg", "q": "A: 你觉得这条白色的裤子长不长？ B: 比那条黑色的___，还是买那条吧。", "o": ["长一点儿", "一点儿长", "有点儿长", "很长"], "a": 0, "x": "KS + 一点儿."}, {"k": "13-3.6", "t": "pg", "q": "Mana yang paling tepat: \"Kopi ini agak pahit\" (tanpa perbandingan)?", "o": ["这杯咖啡有点儿苦。", "这杯咖啡苦一点儿比。", "这杯咖啡比一点儿苦。", "这杯咖啡一点儿苦。"], "a": 0, "x": "Tanpa perbandingan: 有点儿 + KS."}, {"k": "13-3.7", "t": "su", "w": ["姐姐", "比", "我", "高", "一点儿"], "s": "姐姐比我高一点儿。", "alt": [], "p": "Jiějie bǐ wǒ gāo yìdiǎnr.", "x": "Kakak sedikit lebih tinggi dariku."}, {"k": "13-3.8", "t": "su", "w": ["那", "间", "教室", "比", "这", "间", "大", "一些"], "s": "那间教室比这间大一些。", "alt": [], "p": "Nà jiān jiàoshì bǐ zhè jiān dà yìxiē.", "x": "Kelas itu sedikit lebih besar daripada kelas ini."}, {"k": "13-3.9", "t": "su", "w": ["今天", "比", "昨天", "冷", "一点儿"], "s": "今天比昨天冷一点儿。", "alt": ["比今天昨天冷一点儿。"], "p": "Jīntiān bǐ zuótiān lěng yìdiǎnr.", "x": "Hari ini sedikit lebih dingin daripada kemarin."}, {"k": "13-3.10", "t": "su", "w": ["我", "的", "书包", "比", "你", "的", "贵", "一点儿"], "s": "我的书包比你的贵一点儿。", "alt": [], "p": "Wǒ de shūbāo bǐ nǐ de guì yìdiǎnr.", "x": "Tas sekolahku sedikit lebih mahal daripada punyamu."}, {"k": "13-3.11", "t": "su", "w": ["弟弟", "比", "我", "跑", "得", "快", "一点儿"], "s": "弟弟比我跑得快一点儿。", "alt": [], "p": "Dìdi bǐ wǒ pǎo de kuài yìdiǎnr.", "x": "Adik berlari sedikit lebih cepat dariku."}, {"k": "13-3.12", "t": "su", "w": ["今天", "的", "苹果", "比", "昨天", "的", "便宜", "一点儿"], "s": "今天的苹果比昨天的便宜一点儿。", "alt": ["的今天苹果比昨天的便宜一点儿。"], "p": "Jīntiān de píngguǒ bǐ zuótiān de piányi yìdiǎnr.", "x": "Apel hari ini sedikit lebih murah daripada kemarin."}, {"k": "13-3.13", "t": "bs", "s": "这件衣服比那件一点儿贵。", "sp": "Zhè jiàn yīfu bǐ nà jiàn yìdiǎnr guì.", "n": "", "ok": false, "b": "这件衣服比那件贵一点儿。", "bp": "Zhè jiàn yīfu bǐ nà jiàn guì yìdiǎnr.", "x": "一点儿 setelah KS."}, {"k": "13-3.14", "t": "bs", "s": "那间教室比这间大一些。", "sp": "Nà jiān jiàoshì bǐ zhè jiān dà yìxiē.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "13-3.15", "t": "bs", "s": "我比他有点儿高。", "sp": "Wǒ bǐ tā yǒudiǎnr gāo.", "n": "", "ok": false, "b": "我比他高一点儿。", "bp": "Wǒ bǐ tā gāo yìdiǎnr.", "x": "Dalam kalimat 比 pakai 一点儿."}, {"k": "13-3.16", "t": "bs", "s": "这家店的咖啡比那家好喝一些。", "sp": "Zhè jiā diàn de kāfēi bǐ nà jiā hǎo hē yìxiē.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "13-3.17", "t": "bs", "s": "今天有点儿冷。", "sp": "Jīntiān yǒudiǎnr lěng.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: tanpa perbandingan memakai 有点儿."}]}, {"id": "14-1", "pel": 14, "judul": "Kalimat keberadaan (2): Tempat + KK + 着 + orang/benda", "kode": "存现句（2）", "rumus": ["Tempat + KK + 着 + (bilangan + satuan) + orang/benda", "楼下 + 站着 + 一个人"], "jelas": ["Pola ini menyatakan bahwa di suatu tempat ADA orang/benda dalam keadaan tertentu: 你家楼下站着一个人 = di bawah gedung rumahmu ada seseorang berdiri.", "Susunannya terbalik dari kalimat biasa: TEMPAT di depan, lalu KK + 着, lalu orang/benda di akhir. Bandingkan: 一个人站在楼下 (seseorang berdiri di bawah) dan 楼下站着一个人 (di bawah berdiri seseorang).", "Orang/benda di akhir biasanya TIDAK tertentu (一个人, 不少学生, 很多人). Jika orangnya tertentu (王老师, 那个人), pakai kalimat biasa: 王老师站在楼下.", "Tempat di awal TIDAK memakai 在. 在楼下站着一个人 kurang tepat; cukup 楼下站着一个人. Ini jebakan besar karena bahasa Indonesia berkata \"DI bawah berdiri…\". Kata tempat biasanya memakai kata arah: 手里, 桌子上, 教室里, 门口, 楼下.", "Kata kerja yang sering dipakai: 站, 坐, 住, 拿, 写, 穿, 开. 本子上面写着什么？ (Di buku tulis tertulis apa?), 我楼下住着一家中国人.", "Bedakan dengan 有 (存现句 1): 楼下有一个人 hanya menyatakan ada; 楼下站着一个人 juga menggambarkan bagaimana keadaannya (berdiri)."], "poin": ["Tempat + KK着 + orang/benda.", "Tempat tanpa 在 di awal.", "Orang/benda tidak tertentu (一个人, 很多人).", "Lebih hidup daripada 有: menggambarkan keadaan."], "contoh": [{"zh": "你家楼下站着一个人。", "py": "Nǐ jiā lóu xià zhàn zhe yí gè rén.", "id": "Di bawah gedung rumahmu ada seseorang berdiri.", "b": true, "tr": "14-1"}, {"zh": "爸爸手里拿着一杯咖啡。", "py": "Bàba shǒu lǐ ná zhe yì bēi kāfēi.", "id": "Di tangan ayah ada secangkir kopi.", "b": true, "tr": null}, {"zh": "那间教室里坐着不少学生。", "py": "Nà jiān jiàoshì lǐ zuò zhe bù shǎo xuéshēng.", "id": "Di kelas itu duduk cukup banyak siswa.", "b": true, "tr": null}, {"zh": "楼下站着很多人。", "py": "Lóu xià zhàn zhe hěn duō rén.", "id": "Di bawah berdiri banyak orang.", "b": true, "tr": null}, {"zh": "那个人手里还拿着一个黑色的包。", "py": "Nàge rén shǒu lǐ hái ná zhe yí gè hēisè de bāo.", "id": "Orang itu di tangannya juga memegang tas hitam.", "b": true, "tr": null}, {"zh": "我楼下还住着一家中国人。", "py": "Wǒ lóu xià hái zhù zhe yì jiā Zhōngguó rén.", "id": "Di lantai bawahku juga tinggal sebuah keluarga Tionghoa.", "b": true, "tr": "14-5"}, {"zh": "本子上面写着什么？", "py": "Běnzi shàngmiàn xiě zhe shénme?", "id": "Di buku tulis tertulis apa?", "b": true, "tr": null}, {"zh": "门口站着两个孩子。", "py": "Ménkǒu zhàn zhe liǎng gè háizi.", "id": "Di depan pintu berdiri dua anak.", "b": false, "tr": null}, {"zh": "桌子上写着我的名字。", "py": "Zhuōzi shàng xiě zhe wǒ de míngzi.", "id": "Di meja tertulis namaku.", "b": false, "tr": null}, {"zh": "椅子上坐着一个老人。", "py": "Yǐzi shàng zuò zhe yí gè lǎorén.", "id": "Di kursi duduk seorang lansia.", "b": false, "tr": null}, {"zh": "前面那个楼里住着很多学生。", "py": "Qiánmiàn nàge lóu lǐ zhù zhe hěn duō xuéshēng.", "id": "Di gedung depan itu tinggal banyak mahasiswa.", "b": false, "tr": null}, {"zh": "她手里拿着一本中文书。", "py": "Tā shǒu lǐ ná zhe yì běn Zhōngwén shū.", "id": "Di tangannya ada sebuah buku bahasa Mandarin.", "b": false, "tr": null}], "salah": [{"s": "在楼下站着一个人。", "sp": "Zài lóu xià zhàn zhe yí gè rén.", "n": "", "b": "楼下站着一个人。", "bp": "Lóu xià zhàn zhe yí gè rén.", "a": "Tempat di awal tidak memakai 在."}, {"s": "楼下站着王老师。", "sp": "Lóu xià zhàn zhe Wáng lǎoshī.", "n": "", "b": "王老师站在楼下。", "bp": "Wáng lǎoshī zhàn zài lóu xià.", "a": "Orang tertentu tidak cocok di akhir pola ini."}, {"s": "楼下一个人站着。", "sp": "Lóu xià yí gè rén zhàn zhe.", "n": "", "b": "楼下站着一个人。", "bp": "Lóu xià zhàn zhe yí gè rén.", "a": "Orang/benda di belakang KK着."}], "latihan": [{"k": "14-1.0", "t": "pg", "q": "你家楼下站___一个人。", "o": ["着", "了过", "的", "得"], "a": 0, "x": "Tempat + KK着 + orang.", "f": "你家楼下站着一个人。", "fp": "Nǐ jiā lóu xià zhàn zhe yí gè rén."}, {"k": "14-1.1", "t": "pg", "q": "\"Di kelas duduk banyak siswa\" =", "o": ["教室里坐着很多学生。", "在教室里很多学生坐着。", "很多学生坐着教室里。", "教室里很多学生坐着了。"], "a": 0, "x": "Tempat + 坐着 + orang."}, {"k": "14-1.2", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["门口站着两个孩子。", "在桌子上写着我的名字。", "爸爸手里拿着一杯咖啡。", "楼下站着很多人。"], "a": 1, "x": "Hapus 在 di awal."}, {"k": "14-1.3", "t": "pg", "q": "Mana yang tepat untuk orang tertentu (王老师)?", "o": ["王老师站在门口。", "门口站着王老师。", "在门口站着王老师。", "门口王老师站着了。"], "a": 0, "x": "Orang tertentu: kalimat biasa."}, {"k": "14-1.4", "t": "pg", "q": "A: 本子上面写着什么？ B: ___", "o": ["写着我的名字。", "我的名字写。", "是写我的名字着。", "写我的名字着。"], "a": 0, "x": "写着 + benda."}, {"k": "14-1.5", "t": "pg", "q": "爸爸手里___一杯咖啡。", "o": ["拿着", "拿了过", "着拿", "拿得"], "a": 0, "x": "KK + 着.", "f": "爸爸手里拿着一杯咖啡。", "fp": "Bàba shǒu lǐ ná zhe yì bēi kāfēi."}, {"k": "14-1.6", "t": "pg", "q": "\"Di lantai bawahku tinggal sebuah keluarga Tionghoa\" =", "o": ["我楼下住着一家中国人。", "我楼下一家中国人住着。", "在我楼下住一家中国人着。", "一家中国人住着我楼下。"], "a": 0, "x": "Tempat + 住着 + orang."}, {"k": "14-1.7", "t": "su", "w": ["你", "家", "楼下", "站", "着", "一", "个", "人"], "s": "你家楼下站着一个人。", "alt": [], "p": "Nǐ jiā lóu xià zhàn zhe yí gè rén.", "x": "Di bawah gedung rumahmu ada seseorang berdiri."}, {"k": "14-1.8", "t": "su", "w": ["爸爸", "手", "里", "拿", "着", "一", "杯", "咖啡"], "s": "爸爸手里拿着一杯咖啡。", "alt": [], "p": "Bàba shǒu lǐ ná zhe yì bēi kāfēi.", "x": "Di tangan ayah ada secangkir kopi."}, {"k": "14-1.9", "t": "su", "w": ["那", "间", "教室", "里", "坐", "着", "不少", "学生"], "s": "那间教室里坐着不少学生。", "alt": [], "p": "Nà jiān jiàoshì lǐ zuò zhe bù shǎo xuéshēng.", "x": "Di kelas itu duduk cukup banyak siswa."}, {"k": "14-1.10", "t": "su", "w": ["门口", "站", "着", "两", "个", "孩子"], "s": "门口站着两个孩子。", "alt": [], "p": "Ménkǒu zhàn zhe liǎng gè háizi.", "x": "Di depan pintu berdiri dua anak."}, {"k": "14-1.11", "t": "su", "w": ["本子", "上面", "写", "着", "什么"], "s": "本子上面写着什么？", "alt": [], "p": "Běnzi shàngmiàn xiě zhe shénme?", "x": "Di buku tulis tertulis apa?"}, {"k": "14-1.12", "t": "su", "w": ["椅子", "上", "坐", "着", "一", "个", "老人"], "s": "椅子上坐着一个老人。", "alt": [], "p": "Yǐzi shàng zuò zhe yí gè lǎorén.", "x": "Di kursi duduk seorang lansia."}, {"k": "14-1.13", "t": "bs", "s": "在教室里坐着很多学生。", "sp": "Zài jiàoshì lǐ zuò zhe hěn duō xuéshēng.", "n": "", "ok": false, "b": "教室里坐着很多学生。", "bp": "Jiàoshì lǐ zuò zhe hěn duō xuéshēng.", "x": "Hapus 在."}, {"k": "14-1.14", "t": "bs", "s": "楼下站着很多人。", "sp": "Lóu xià zhàn zhe hěn duō rén.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "14-1.15", "t": "bs", "s": "门口一个人站着。", "sp": "Ménkǒu yí gè rén zhàn zhe.", "n": "", "ok": false, "b": "门口站着一个人。", "bp": "Ménkǒu zhàn zhe yí gè rén.", "x": "Orang di belakang KK着."}, {"k": "14-1.16", "t": "bs", "s": "她手里拿着一本中文书。", "sp": "Tā shǒu lǐ ná zhe yì běn Zhōngwén shū.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "14-2", "pel": 14, "judul": "Kata keterangan derajat 多 dalam kalimat seru: 多……啊！", "kode": "程度副词\"多\"", "rumus": ["(S) + 多 + KS + 啊！", "S + KK + 得 + 多 + KS + 啊！", "多 + 没意思/有意思 + 啊！"], "jelas": ["多 (duō) dalam kalimat seru berarti \"betapa / alangkah / sungguh …!\" dan menyatakan tingkat yang sangat tinggi: 多好看啊！ = bagus sekali!, 你一个人在这儿多没意思啊！ = betapa tidak serunya kamu sendirian di sini!", "Susunannya: 多 + kata sifat (atau frasa seperti 没意思, 有意思) + 啊 di akhir. 啊 hampir selalu ada dan memberi rasa seru. Tanda bacanya ！", "Bisa dipakai dengan pelengkap keadaan: 她的汉语说得多好啊！ (betapa bagusnya bahasa Mandarinnya!). 多 masuk di depan kata sifat setelah 得.", "Bisa juga untuk saran yang bernada \"alangkah baiknya\": 我们一起去多好啊！ (alangkah baiknya kalau kita pergi bersama!).", "Jangan tertukar dengan 多 untuk bertanya: 你多大？ (umurmu berapa?), 离这儿多远？ (seberapa jauh?) — itu pertanyaan, diakhiri ？ dan tanpa 啊 seru. Juga jangan gabungkan 多 dengan 很/太/非常 (多很好啊 salah).", "Perbandingan dengan pola seru lain: 太……了 (terlalu/sangat), 真…… (sungguh). 太好了！, 真好！, 多好啊！ semuanya menyatakan kekaguman; 多……啊 terdengar paling ekspresif, mirip \"Aduh, betapa …!\""], "poin": ["多 + KS + 啊！ = betapa KS!", "KK得 + 多 + KS + 啊！", "Tanpa 很/太.", "Beda dengan 多 tanya: 多大？ 多远？"], "contoh": [{"zh": "你一个人在这儿多没意思啊！", "py": "Nǐ yí gè rén zài zhèr duō méiyìsi a!", "id": "Betapa tidak serunya kamu sendirian di sini!", "b": true, "tr": "14-3"}, {"zh": "我们一起去多好啊！", "py": "Wǒmen yìqǐ qù duō hǎo a!", "id": "Alangkah baiknya kalau kita pergi bersama!", "b": true, "tr": null}, {"zh": "多好看啊！买这件吧。", "py": "Duō hǎokàn a! Mǎi zhè jiàn ba.", "id": "Bagus sekali! Beli yang ini saja.", "b": true, "tr": null}, {"zh": "她的汉语说得多好啊！", "py": "Tā de Hànyǔ shuō de duō hǎo a!", "id": "Betapa bagusnya bahasa Mandarinnya!", "b": true, "tr": null}, {"zh": "一个人过年多没意思啊！", "py": "Yí gè rén guònián duō méiyìsi a!", "id": "Merayakan Tahun Baru Imlek sendirian betapa tidak serunya!", "b": true, "tr": null}, {"zh": "你看，那只小鸟多漂亮啊！", "py": "Nǐ kàn, nà zhī xiǎo niǎo duō piàoliang a!", "id": "Lihat, burung kecil itu cantik sekali!", "b": true, "tr": null}, {"zh": "你看，孩子们多高兴啊！", "py": "Nǐ kàn, háizimen duō gāoxìng a!", "id": "Lihat, anak-anak betapa gembiranya!", "b": false, "tr": null}, {"zh": "今天的天气多好啊！我们出去走走吧。", "py": "Jīntiān de tiānqì duō hǎo a! Wǒmen chūqù zǒu zǒu ba.", "id": "Cuaca hari ini bagus sekali! Ayo kita jalan-jalan.", "b": false, "tr": null}, {"zh": "这个菜多好吃啊！", "py": "Zhège cài duō hǎochī a!", "id": "Masakan ini enak sekali!", "b": false, "tr": null}, {"zh": "你家多大啊！", "py": "Nǐ jiā duō dà a!", "id": "Betapa besarnya rumahmu!", "b": false, "tr": null}, {"zh": "他跑得多快啊！", "py": "Tā pǎo de duō kuài a!", "id": "Betapa cepatnya dia berlari!", "b": false, "tr": null}, {"zh": "能跟朋友一起旅游，多有意思啊！", "py": "Néng gēn péngyou yìqǐ lǚyóu, duō yǒuyìsi a!", "id": "Bisa berwisata bersama teman, betapa serunya!", "b": false, "tr": null}], "salah": [{"s": "多很好看啊！", "sp": "Duō hěn hǎokàn a!", "n": "", "b": "多好看啊！", "bp": "Duō hǎokàn a!", "a": "多 tidak bersama 很."}, {"s": "他跑得快多啊！", "sp": "Tā pǎo de kuài duō a!", "n": "", "b": "他跑得多快啊！", "bp": "Tā pǎo de duō kuài a!", "a": "多 di depan kata sifat."}, {"s": "这个菜多好吃吗？", "sp": "Zhège cài duō hǎochī ma?", "n": "seru", "b": "这个菜多好吃啊！", "bp": "Zhège cài duō hǎochī a!", "a": "Kalimat seru memakai 啊, bukan 吗."}], "latihan": [{"k": "14-2.0", "t": "pg", "q": "你一个人在这儿___没意思啊！", "o": ["多", "很多", "太多", "多么很"], "a": 0, "x": "Seru: 多 + frasa sifat + 啊.", "f": "你一个人在这儿多没意思啊！", "fp": "Nǐ yí gè rén zài zhèr duō méiyìsi a!"}, {"k": "14-2.1", "t": "pg", "q": "多好看___！买这件吧。", "o": ["啊", "吗", "呢", "吧"], "a": 0, "x": "Kalimat seru diakhiri 啊.", "f": "多好看啊！买这件吧。", "fp": "Duō hǎokàn a! Mǎi zhè jiàn ba."}, {"k": "14-2.2", "t": "pg", "q": "\"Betapa cepatnya dia berlari!\" =", "o": ["他跑得多快啊！", "他多跑得快啊！", "他跑得快多啊！", "他跑多得快啊！"], "a": 0, "x": "KK得 + 多 + KS + 啊."}, {"k": "14-2.3", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["我们一起去多好啊！", "这个菜多好吃啊！", "她多很漂亮啊！", "孩子们多高兴啊！"], "a": 2, "x": "Hapus 很."}, {"k": "14-2.4", "t": "pg", "q": "Kalimat mana yang BUKAN kalimat seru?", "o": ["你今年多大？", "你家多大啊！", "多好啊！", "多漂亮啊！"], "a": 0, "x": "多大？ di sini kata tanya umur án duō méiyìsi a!", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "14-2.17", "t": "bs", "s": "能跟朋友一起旅游，多有意思啊！", "sp": "Néng gēn péngyou yìqǐ lǚyóu, duō yǒuyìsi a!", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "14-3", "pel": 14, "judul": "Pelengkap arah majemuk: KK + 上/下/进/出/回/过/起 + 来/去", "kode": "复合趋向补语", "rumus": ["KK + 上/下/进/出/回/过 + 来/去 (跑上来, 走下去)", "KK + 起来 (站起来)", "KK + 上/进/出/回… + TEMPAT + 来/去 (走出教室去)", "KK + 出/回… + 来/去 + benda  atau  KK + 出/回… + benda + 来/去"], "jelas": ["Pelengkap arah majemuk terdiri dari dua bagian setelah kata kerja: arah gerak (上 naik, 下 turun, 进 masuk, 出 keluar, 回 kembali, 过 lewat/menyeberang, 起 bangkit) + 来/去. 跑上来 = berlari naik (ke arah pembicara), 走上去 = berjalan naik (menjauhi pembicara).", "来 berarti gerakan MENDEKATI pembicara, 去 berarti MENJAUHI pembicara. Jika saya di lantai atas dan teman naik menemui saya: 她跑上来找我玩. Jika kami di bawah dan akan naik: 我们走上去吧.", "起来 berarti \"bangkit/ke atas dari posisi rendah\": 站起来 (berdiri), 拿起来 (mengangkat). Tidak ada 起去.", "Jika ada objek TEMPAT, tempat diletakkan di antara arah dan 来/去: 同学们都走出教室去了, 我们走回家去吧, 他跑上楼来了. Tidak boleh 走出去教室.", "Jika objeknya BENDA, boleh sebelum atau sesudah 来/去: 妈妈让我买回一些菜来 = 妈妈让我买回来一些菜; 白家月从书包里找出来一个漂亮的本子.", "Jebakan pelajar Indonesia: bahasa Indonesia jarang menunjukkan arah pembicara (\"dia naik\" saja), jadi pelajar lupa 来/去 atau menaruh tempat di akhir (走进去教室). Ingat rumus: KK + arah + TEMPAT + 来/去. Ungkapan 喜欢上 (mulai menyukai) memakai 上 dengan makna kiasan."], "poin": ["KK + arah + 来/去; 来 = mendekat, 去 = menjauh.", "起来 = bangkit (站起来).", "Tempat di antara arah dan 来/去: 走出教室去.", "Benda boleh sebelum/sesudah 来/去."], "contoh": [{"zh": "她经常跑上来找我玩。", "py": "Tā jīngcháng pǎo shànglái zhǎo wǒ wán.", "id": "Dia sering berlari naik ke sini untuk bermain denganku.", "b": true, "tr": "14-5"}, {"zh": "楼不高，我们走上去吧。", "py": "Lóu bù gāo, wǒmen zǒu shàngqù ba.", "id": "Gedungnya tidak tinggi, kita jalan kaki naik saja.", "b": true, "tr": null}, {"zh": "一听到老师叫他的名字，他就站起来了。", "py": "Yì tīng dào lǎoshī jiào tā de míngzi, tā jiù zhàn qǐlái le.", "id": "Begitu mendengar guru memanggil namanya, dia langsung berdiri.", "b": true, "tr": null}, {"zh": "同学们都走出教室去了。", "py": "Tóngxuémen dōu zǒu chū jiàoshì qù le.", "id": "Semua siswa sudah berjalan keluar dari kelas.", "b": true, "tr": null}, {"zh": "妈妈让我买回一些菜来。", "py": "Māma ràng wǒ mǎi huí yìxiē cài lái.", "id": "Ibu menyuruhku membeli sayur dan membawanya pulang.", "b": true, "tr": null}, {"zh": "白家月从书包里找出来一个漂亮的本子。", "py": "Bái Jiāyuè cóng shūbāo lǐ zhǎo chūlái yí gè piàoliang de běnzi.", "id": "Bai Jiayue mengeluarkan sebuah buku tulis cantik dari tasnya.", "b": true, "tr": null}, {"zh": "我们走回家去吧。", "py": "Wǒmen zǒu huí jiā qù ba.", "id": "Ayo kita jalan kaki pulang.", "b": true, "tr": null}, {"zh": "他告诉我，从见到我的第一天开始，他就喜欢上我了。", "py": "Tā gàosu wǒ, cóng jiàn dào wǒ de dìyī tiān kāishǐ, tā jiù xǐhuan shàng wǒ le.", "id": "Dia bilang sejak hari pertama bertemu, dia sudah mulai menyukaiku.", "b": true, "tr": "14-7"}, {"zh": "老师走进教室来了。", "py": "Lǎoshī zǒu jìn jiàoshì lái le.", "id": "Guru berjalan masuk ke kelas (ke arah kami).", "b": false, "tr": null}, {"zh": "你快跑过来！", "py": "Nǐ kuài pǎo guòlái!", "id": "Cepat lari ke sini!", "b": false, "tr": null}, {"zh": "他从房间里走出来了。", "py": "Tā cóng fángjiān li zǒu chūlái le.", "id": "Dia berjalan keluar dari kamar.", "b": false, "tr": null}, {"zh": "小狗跑下楼去了。", "py": "Xiǎogǒu pǎo xià lóu qù le.", "id": "Anak anjing itu berlari turun ke bawah.", "b": false, "tr": null}, {"zh": "请大家站起来。", "py": "Qǐng dàjiā zhàn qǐlái.", "id": "Silakan semua berdiri.", "b": false, "tr": null}, {"zh": "爸爸买回来很多水果。", "py": "Bàba mǎi huílái hěn duō shuǐguǒ.", "id": "Ayah membeli banyak buah dan membawanya pulang.", "b": false, "tr": null}], "salah": [{"s": "同学们都走出去教室了。", "sp": "Tóngxuémen dōu zǒu chūqù jiàoshì le.", "n": "", "b": "同学们都走出教室去了。", "bp": "Tóngxuémen dōu zǒu chū jiàoshì qù le.", "a": "Tempat diletakkan sebelum 来/去."}, {"s": "他站起去了。", "sp": "Tā zhàn qǐ qù le.", "n": "", "b": "他站起来了。", "bp": "Tā zhàn qǐlái le.", "a": "Tidak ada 起去; pakai 起来."}, {"s": "老师走进来教室。", "sp": "Lǎoshī zǒu jìnlái jiàoshì.", "n": "", "b": "老师走进教室来。", "bp": "Lǎoshī zǒu jìn jiàoshì lái.", "a": "Tempat di antara 进 dan 来."}], "latihan": [{"k": "14-3.0", "t": "pg", "q": "楼不高，我们走上___吧。(kami masih di bawah)", "o": ["去", "来", "起", "回"], "a": 0, "x": "Menjauhi pembicara: 去.", "f": "楼不高，我们走上去吧。", "fp": "Lóu bù gāo, wǒmen zǒu shàngqù ba."}, {"k": "14-3.1", "t": "pg", "q": "她经常跑上___找我玩。(saya di atas)", "o": ["来", "去", "起", "过"], "a": 0, "x": "Mendekati pembicara: 来.", "f": "她经常跑上来找我玩。", "fp": "Tā jīngcháng pǎo shànglái zhǎo wǒ wán."}, {"k": "14-3.2", "t": "pg", "q": "听到老师叫他的名字，他就站___了。", "o": ["起来", "起去", "上去", "下来"], "a": 0, "x": "Berdiri = 站起来.", "f": "听到老师叫他的名字，他就站起来了。", "fp": "Tīng dào lǎoshī jiào tā de míngzi, tā jiù zhàn qǐlái le."}, {"k": "14-3.3", "t": "pg", "q": "\"Semua siswa berjalan keluar dari kelas\" =", "o": ["同学们都走出教室去了。", "同学们都走出去教室了。", "同学们都走教室出去了。", "同学们都出走教室去了。"], "a": 0, "x": "KK + 出 + tempat + 去."}, {"k": "14-3.4", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["我们走回家去吧。", "老师走进教室来了。", "他跑上去楼了。", "妈妈让我买回一些菜来。"], "a": 2, "x": "Tempat sebelum 去: 他跑上楼去了."}, {"k": "14-3.5", "t": "pg", "q": "A: 小雪呢？她不去商场吗？ B: 她早都___了，在楼下等我们呢。", "o": ["下去", "上来", "进来", "起来"], "a": 0, "x": "Turun ke bawah (menjauh): 下去."}, {"k": "14-3.6", "t": "pg", "q": "Mana yang BENAR untuk objek benda?", "o": ["白家月找出来一个本子。", "白家月找一个本子出来去。", "白家月找出本子去来。", "白家月出来找本子一个。"], "a": 0, "x": "Benda boleh setelah 出来."}, {"k": "14-3.7", "t": "pg", "q": "你快跑___！我在这儿等你。", "o": ["过来", "过去", "起去", "下去"], "a": 0, "x": "Ke arah pembicara: 过来.", "f": "你快跑过来！我在这儿等你。", "fp": "Nǐ kuài pǎo guòlái! Wǒ zài zhèr děng nǐ."}, {"k": "14-3.8", "t": "su", "w": ["楼", "不", "高，", "我们", "走", "上去", "吧"], "s": "楼不高，我们走上去吧。", "alt": [], "p": "Lóu bù gāo, wǒmen zǒu shàngqù ba.", "x": "Gedungnya tidak tinggi, kita jalan kaki naik saja."}, {"k": "14-3.9", "t": "su", "w": ["她", "经常", "跑", "上来", "找", "我", "玩"], "s": "她经常跑上来找我玩。", "alt": [], "p": "Tā jīngcháng pǎo shànglái zhǎo wǒ wán.", "x": "Dia sering berlari naik ke sini untuk bermain denganku."}, {"k": "14-3.10", "t": "su", "w": ["同学们", "都", "走", "出", "教室", "去", "了"], "s": "同学们都走出教室去了。", "alt": [], "p": "Tóngxuémen dōu zǒu chū jiàoshì qù le.", "x": "Semua siswa sudah berjalan keluar dari kelas."}, {"k": "14-3.11", "t": "su", "w": ["我们", "走", "回", "家", "去", "吧"], "s": "我们走回家去吧。", "alt": [], "p": "Wǒmen zǒu huí jiā qù ba.", "x": "Ayo kita jalan kaki pulang."}, {"k": "14-3.12", "t": "su", "w": ["老师", "走", "进", "教室", "来", "了"], "s": "老师走进教室来了。", "alt": [], "p": "Lǎoshī zǒu jìn jiàoshì lái le.", "x": "Guru berjalan masuk ke kelas."}, {"k": "14-3.13", "t": "su", "w": ["请", "大家", "站", "起来"], "s": "请大家站起来。", "alt": [], "p": "Qǐng dàjiā zhàn qǐlái.", "x": "Silakan semua berdiri."}, {"k": "14-3.14", "t": "bs", "s": "他走进去房间了。", "sp": "Tā zǒu jìnqù fángjiān le.", "n": "", "ok": false, "b": "他走进房间去了。", "bp": "Tā zǒu jìn fángjiān qù le.", "x": "Tempat sebelum 去."}, {"k": "14-3.15", "t": "bs", "s": "一听到老师叫他的名字，他就站起来了。", "sp": "Yì tīng dào lǎoshī jiào tā de míngzi, tā jiù zhàn qǐlái le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "14-3.16", "t": "bs", "s": "我们站起去吧。", "sp": "Wǒmen zhàn qǐ qù ba.", "n": "", "ok": false, "b": "我们站起来吧。", "bp": "Wǒmen zhàn qǐlái ba.", "x": "Tidak ada 起去."}, {"k": "14-3.17", "t": "bs", "s": "妈妈让我买回一些菜来。", "sp": "Māma ràng wǒ mǎi huí yìxiē cài lái.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "14-3.18", "t": "bs", "s": "爸爸买回来很多水果。", "sp": "Bàba mǎi huílái hěn duō shuǐguǒ.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: benda setelah 来."}]}, {"id": "15-1", "pel": 15, "judul": "Pelengkap frekuensi (1): KK + bilangan + 次", "kode": "动量补语（1）", "rumus": ["S + KK + (过/了) + bilangan + 次", "S + KK + 过 + 一次 + nama tempat/orang", "S + KK + 过 + nama tempat/orang + 一次"], "jelas": ["Bilangan + 次 (kali) diletakkan setelah kata kerja untuk menyatakan berapa kali suatu tindakan terjadi: 我去过一次 = aku pernah pergi sekali; 很想再去一次 = sangat ingin pergi sekali lagi.", "过 dan 了 menempel pada kata kerja, SEBELUM bilangan + 次: 去过两次, 见了两次. Tidak boleh 去两次过.", "Jika objeknya NAMA TEMPAT atau NAMA ORANG, objek boleh di depan atau di belakang 次: 安妮去过一次北京 = 安妮去过北京一次; 李文见了杨同乐两次 = 李文见了两次杨同乐.", "Bertanya: KK + 过 + 几次？ 你去过几次上海？ Untuk \"sekali lagi\" pakai 再 + KK + 一次: 我要再去一次北京.", "Jebakan pelajar Indonesia: bahasa Indonesia meletakkan \"dua kali\" di depan atau belakang (\"Saya dua kali ke Beijing\"), sehingga pelajar menulis 我两次去过北京 — salah. Dalam Mandarin frekuensi SELALU setelah kata kerja. Juga jangan pakai 个: 两个次 salah.", "Ingat beda dengan 第一次 (untuk pertama kali) yang diletakkan sebelum kata kerja: 我第一次去中国. 第一次 = urutan, 一次 setelah KK = jumlah."], "poin": ["KK + (过/了) + bilangan + 次.", "Nama tempat/orang: sebelum atau sesudah 次.", "再 + KK + 一次 = sekali lagi.", "Frekuensi tidak di depan kata kerja.", "第一次 + KK = untuk pertama kali."], "contoh": [{"zh": "我想去中国，虽然去过一次，但是很想再去一次。", "py": "Wǒ xiǎng qù Zhōngguó, suīrán qù guò yí cì, dànshì hěn xiǎng zài qù yí cì.", "id": "Aku ingin ke Tiongkok; meski sudah pernah sekali, aku sangat ingin pergi sekali lagi.", "b": true, "tr": null}, {"zh": "安妮去过一次北京。", "py": "Ānnī qù guò yí cì Běijīng.", "id": "Annie pernah sekali ke Beijing.", "b": true, "tr": null}, {"zh": "李文见了杨同乐两次。", "py": "Lǐ Wén jiàn le Yáng Tónglè liǎng cì.", "id": "Li Wen sudah dua kali bertemu Yang Tongle.", "b": true, "tr": null}, {"zh": "我去过两次北京。", "py": "Wǒ qù guò liǎng cì Běijīng.", "id": "Aku sudah dua kali ke Beijing.", "b": true, "tr": null}, {"zh": "我要再去一次北京。", "py": "Wǒ yào zài qù yí cì Běijīng.", "id": "Aku mau ke Beijing sekali lagi.", "b": true, "tr": "15-3"}, {"zh": "我六月的时候回去了一次。", "py": "Wǒ liù yuè de shíhou huíqù le yí cì.", "id": "Bulan Juni aku pulang sekali.", "b": true, "tr": "15-5"}, {"zh": "安妮去过北京一次。", "py": "Ānnī qù guò Běijīng yí cì.", "id": "Annie pernah ke Beijing sekali.", "b": false, "tr": null}, {"z 没 + KK + 了 = sudah … (lamanya) tidak melakukan sesuatu. 你有一年没回国了吧？ (kamu sudah setahun tidak pulang, ya?), 我有一个月没给家里打电话了.", "Bentuk ingkar 没有 + jumlah = belum mencapai: 他没有三十岁 (dia belum sampai tiga puluh tahun). Kata 不到 juga bermakna \"belum sampai\": 不到一年.", "Jebakan pelajar Indonesia: urutan \"sudah setahun tidak pulang\". Pelajar menulis 我一年没有回国 (boleh, tetapi kurang menekankan) atau 我没回国有一年 (salah). Pakai rumus: 有 + durasi + 没 + KK + 了, dan jangan lupa 了 di akhir.", "有 di sini tidak berarti \"punya\". Tanpa jumlah, 有 kembali bermakna punya/ada."], "poin": ["有 + jumlah = sudah mencapai.", "Sering dalam pertanyaan: 有十岁了吗？", "有 + durasi + 没 + KK + 了.", "Ingkar: 没有 + jumlah / 不到 + jumlah."], "contoh": [{"zh": "你有一年没回国了吧？", "py": "Nǐ yǒu yì nián méi huí guó le ba?", "id": "Kamu sudah setahun tidak pulang ke negaramu, ya?", "b": true, "tr": "15-5"}, {"zh": "你女儿今年有十岁了吗？", "py": "Nǐ nǚ'ér jīnnián yǒu shí suì le ma?", "id": "Apakah putrimu tahun ini sudah sepuluh tahun?", "b": true, "tr": null}, {"zh": "我有一个月没给家里打电话了。", "py": "Wǒ yǒu yí gè yuè méi gěi jiā li dǎdiànhuà le.", "id": "Sudah sebulan aku tidak menelepon ke rumah.", "b": true, "tr": null}, {"zh": "你的老师有三十岁吗？", "py": "Nǐ de lǎoshī yǒu sānshí suì ma?", "id": "Apakah gurumu sudah sampai tiga puluh tahun?", "b": true, "tr": null}, {"zh": "不到一年。我六月的时候回去了一次。", "py": "Bú dào yì nián. Wǒ liù yuè de shíhou huíqù le yí cì.", "id": "Belum sampai setahun. Bulan Juni aku pulang sekali.", "b": true, "tr": "15-5"}, {"zh": "飞北京的机票有八千块钱吗？——没有，现在机票便宜。", "py": "Fēi Běijīng de jīpiào yǒu bāqiān kuài qián ma? — Méiyǒu, xiànzài jīpiào piányi.", "id": "Tiket pesawat ke Beijing sampai delapan ribu yuan? — Tidak, sekarang tiket murah.", "b": true, "tr": null}, {"zh": "你男朋友有三十岁吗？——没有，他今年二十九岁。", "py": "Nǐ nánpéngyou yǒu sānshí suì ma? — Méiyǒu, tā jīnnián èrshíjiǔ suì.", "id": "Pacarmu sudah tiga puluh tahun? — Belum, tahun ini dia dua puluh sembilan.", "b": true, "tr": null}, {"zh": "我们两个有一年没见了吧？", "py": "Wǒmen liǎng gè yǒu yì nián méi  false, "b": "我有两年没见他了。", "bp": "Wǒ yǒu liǎng nián méi jiàn tā le.", "x": "有 + durasi + 没 + KK + 了."}, {"k": "15-3.14", "t": "bs", "s": "你的老师有三十岁吗？", "sp": "Nǐ de lǎoshī yǒu sānshí suì ma?", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "15-3.15", "t": "bs", "s": "我弟弟不有十八岁。", "sp": "Wǒ dìdi bù yǒu shíbā suì.", "n": "", "ok": false, "b": "我弟弟没有十八岁。", "bp": "Wǒ dìdi méiyǒu shíbā suì.", "x": "Ingkar: 没有."}, {"k": "15-3.16", "t": "bs", "s": "我有三年没吃妈妈做的菜了。", "sp": "Wǒ yǒu sān nián méi chī māma zuò de cài le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "15-3.17", "t": "bs", "s": "从这儿走到学校有二十分钟吗？", "sp": "Cóng zhèr zǒu dào xuéxiào yǒu èrshí fēnzhōng ma?", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}], "rekaman": {"1": [{"id": "01-1", "j": "dialog", "awal": "请问，您是王一飞老师的姐姐吗？"}, {"id": "01-3", "j": "dialog", "awal": "你们是第一次来北京吗？"}, {"id": "01-5", "j": "dialog", "awal": "喂，家月，你明天有时间吗？我想请你帮个忙。"}, {"id": "01-7", "j": "dialog", "awal": "王老师，我们已经到北京了，是您姐姐来接的我们。"}], "2": [{"id": "02-1", "j": "dialog", "awal": "请问，这儿有到北京大学的公交车吗？"}, {"id": "02-3", "j": "dialog", "awal": "学校里人真多啊！"}, {"id": "02-5", "j": "dialog", "awal": "家月，你看，学校里有家电影院！"}, {"id": "02-7", "j": "dialog", "awal": "北京大学很大，有四万多名学生。"}], "3": [{"id": "03-1", "j": "dialog", "awal": "今天回来这么晚啊！"}, {"id": "03-3", "j": "dialog", "awal": "我们找个时间去旅游，怎么样？"}, {"id": "03-5", "j": "dialog", "awal": "吃个苹果吧，我都洗好了。"}, {"id": "03-7", "j": "dialog", "awal": "早上，刘明开车送孩子去学校，送完孩子回家后，医院就来电话了，让他回去上班。"}], "4": [{"id": "04-1", "j": "dialog", "awal": "妈妈，我们来过这家商场吗？"}, {"id": "04-3", "j": "dialog", "awal": "妈妈，我想买这条白色的裤子。"}, {"id": "04-5", "j": "dialog", "awal": "妈妈，我想买个新书包。"}, {"id": "04-7", "j": "dialog", "awal": "我和妈妈去了一家商场。"}], "5": [{"id": "05-1", "j": "dialog", "awal": "家月，快下来吧，第一次去中国朋友家，别晚了。"}, {"id": "05-3", "j": "dialog", "awal": "家月、安妮，快进来！我给你们介绍一下，这是孩子们的爷爷、奶奶。"}, {"id": "05-5", "j": "dialog", "awal": "都12点了，我们吃饭吧。"}, {"id": "05-7", "j": "dialog", "awal": "回国前一天，我们去一雪姐家了。"}], "6": [{"id
