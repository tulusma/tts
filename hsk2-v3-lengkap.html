<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HSK 2 (v3.0) — 200 Kosakata Baru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141110; --bg-elevated:#1c1815; --bg-card:#221d19; --border:#332b25;
  --seal:#b3402f; --seal-bright:#d9553f; --gold:#c9a227; --paper:#ede6d6;
  --paper-dim:#a89d8a; --muted:#7d7368; --green:#5b7a5c;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--paper);font-family:'Inter',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;}
body::before{content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle at 20% 20%, rgba(201,162,39,0.04), transparent 40%),
                    radial-gradient(circle at 80% 70%, rgba(179,64,47,0.05), transparent 45%);
  pointer-events:none;z-index:0;}
header{position:sticky;top:0;z-index:20;background:rgba(20,17,16,0.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);padding:14px 16px 10px;}
.title-row{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;}
.title-hanzi{font-family:'Noto Serif SC',serif;font-size:22px;color:var(--seal-bright);line-height:1;}
.title-text{font-size:15px;font-weight:600;color:var(--paper);}
.title-sub{font-size:11px;color:var(--muted);margin-left:auto;}
.search-wrap{position:relative;}
#search{width:100%;background:var(--bg-elevated);border:1px solid var(--border);color:var(--paper);
  font-family:'Inter',sans-serif;font-size:14px;padding:10px 14px 10px 34px;border-radius:10px;outline:none;}
#search:focus{border-color:var(--gold);}
#search::placeholder{color:var(--muted);}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
.cat-scroll{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;}
.cat-scroll::-webkit-scrollbar{display:none;}
.cat-chip{flex:0 0 auto;padding:7px 13px;border-radius:100px;border:1px solid var(--border);
  background:var(--bg-elevated);color:var(--paper-dim);font-size:12.5px;font-weight:500;white-space:nowrap;
  cursor:pointer;transition:background .15s, color .15s, border-color .15s;}
.cat-chip.active{background:var(--seal);border-color:var(--seal);color:#fff;}
.progress-bar{height:3px;background:var(--border);position:relative;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--seal-bright));width:0%;transition:width .3s;}
main{position:relative;z-index:1;padding:16px;max-width:720px;margin:0 auto;padding-bottom:60px;}
.section-title{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.3px;margin:22px 2px 10px;
  display:flex;align-items:center;gap:8px;}
.section-title:first-child{margin-top:4px;}
.section-title .count{color:var(--muted);font-weight:500;font-size:11.5px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:12px 8px 10px;
  text-align:center;cursor:pointer;transition:transform .12s, border-color .12s, background .12s;}
.card:active{transform:scale(0.95);background:var(--bg-elevated);}
.card:hover{border-color:var(--gold);}
.card .hz{font-family:'Noto Serif SC',serif;font-size:26px;color:var(--paper);line-height:1.2;}
.card .py{font-size:10.5px;color:var(--gold);margin-top:3px;font-weight:500;}
.card .ar{font-size:10px;color:var(--paper-dim);margin-top:2px;line-height:1.25;min-height:24px;}
.empty-state{text-align:center;color:var(--muted);padding:60px 20px;font-size:13px;}
.empty-state .hz{font-size:34px;display:block;margin-bottom:10px;color:var(--border);font-family:'Noto Serif SC',serif;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:50;display:none;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:var(--bg-elevated);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 20px 28px;
  max-height:85vh;overflow-y:auto;border-top:1px solid var(--border);animation:slideUp .22s ease-out;position:relative;}
@keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:10px;margin:0 auto 16px;}
.modal-head{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
.modal-hz{font-family:'Noto Serif SC',serif;font-size:52px;color:var(--seal-bright);line-height:1;}
.modal-meta .py{font-size:16px;color:var(--gold);font-weight:600;}
.modal-meta .ar{font-size:14px;color:var(--paper);margin-top:3px;}
.modal-block{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px 15px;margin-bottom:10px;}
.modal-block .label{font-size:10.5px;font-weight:700;letter-spacing:.4px;color:var(--muted);margin-bottom:6px;}
.modal-block.komposisi .label{color:var(--gold);}
.modal-block.logika .label{color:var(--seal-bright);}
.modal-block p{font-size:13.5px;line-height:1.55;color:var(--paper-dim);}
.close-btn{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;
  background:var(--bg-card);border:1px solid var(--border);color:var(--paper-dim);font-size:15px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
@media(min-width:600px){.overlay{align-items:center;}.modal{border-radius:20px;max-width:480px;}}
.nav-links{display:flex;gap:8px;margin-top:10px;}
.nav-links a{font-size:11px;color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:4px 10px;border-radius:8px;}
.nav-links a.current{color:var(--gold);border-color:var(--gold);}
</style>
</head>
<body>

<header>
  <div class="title-row">
    <div class="title-hanzi">汉</div>
    <div class="title-text">HSK 2 · Standar 3.0</div>
    <div class="title-sub"><span id="totalCount">200</span> kata baru</div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="search" type="text" placeholder="Cari hanzi, pinyin, atau arti...">
  </div>
</header>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="cat-scroll" id="catScroll"></div>
<main id="main"></main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="close-btn" id="closeBtn">✕</div>
    <div class="modal-handle"></div>
    <div class="modal-head">
      <div class="modal-hz" id="mHz">爱</div>
      <div class="modal-meta">
        <div class="py" id="mPy">ài</div>
        <div class="ar" id="mAr">cinta</div>
      </div>
    </div>
    <div class="modal-block komposisi"><div class="label">KOMPOSISI</div><p id="mK"></p></div>
    <div class="modal-block logika"><div class="label">LOGIKA / CERITA</div><p id="mL"></p></div>
  </div>
</div>

const ALL_WORDS = [];
DATA.forEach(section=>{ section.words.forEach(w=>{ if(!w.skip){ ALL_WORDS.push({...w, cat:section.cat}); } }); });
document.getElementById('totalCount').textContent = ALL_WORDS.length;

const catScroll = document.getElementById('catScroll');
const main = document.getElementById('main');
let activeCat = 'Semua';

function renderChips(){
  catScroll.innerHTML = '';
  const cats = ['Semua', ...DATA.map(s=>s.cat)];
  cats.forEach(c=>{
    const chip = document.createElement('div');
    chip.className = 'cat-chip' + (c===activeCat ? ' active':'');
    chip.textContent = c;
    chip.onclick = ()=>{ activeCat = c; document.getElementById('search').value=''; render(); };
    catScroll.appendChild(chip);
  });
}
function cardHTML(w){
  return `<div class="card"><div class="hz">${w.h}</div><div class="py">${w.p}</div><div class="ar">${w.a}</div></div>`;
}
function render(){
  renderChips();
  const q = document.getElementById('search').value.trim().toLowerCase();
  main.innerHTML = '';
  if(q){
    const results = ALL_WORDS.filter(w=> w.h.includes(q) || w.p.toLowerCase().includes(q) || w.a.toLowerCase().includes(q));
    const title = document.createElement('div');
    title.className = 'section-title';
    title.innerHTML = `Hasil pencarian <span class="count">(${results.length})</span>`;
    main.appendChild(title);
    if(results.length===0){ main.innerHTML += `<div class="empty-state"><span class="hz">找</span>Tidak ditemukan. Coba kata kunci lain.</div>`; return; }
    const grid = document.createElement('div'); grid.className = 'grid';
    grid.innerHTML = results.map(cardHTML).join('');
    main.appendChild(grid);
    attachCardEvents(results);
    return;
  }
  const sectionsToShow = activeCat==='Semua' ? DATA : DATA.filter(s=>s.cat===activeCat);
  sectionsToShow.forEach(section=>{
    const words = section.words.filter(w=>!w.skip);
    const title = document.createElement('div');
    title.className = 'section-title';
    title.innerHTML = `${section.cat} <span class="count">(${words.length})</span>`;
    main.appendChild(title);
    const grid = document.createElement('div'); grid.className = 'grid';
    grid.innerHTML = words.map(cardHTML).join('');
    main.appendChild(grid);
    attachCardEvents(words);
  });
  updateProgress();
}
function attachCardEvents(words){
  const cards = main.querySelectorAll('.card');
  cards.forEach((card, i)=>{ card.addEventListener('click', ()=> openModal(words[i])); });
}
const overlay = document.getElementById('overlay');
function openModal(w){
  document.getElementById('mHz').textContent = w.h;
  document.getElementById('mPy').textContent = w.p;
  document.getElementById('mAr').textContent = w.a;
  document.getElementById('mK').textContent = w.k;
  document.getElementById('mL').textContent = w.l;
  overlay.classList.add('open');
  markSeen(w.h);
}
document.getElementById('closeBtn').onclick = ()=> overlay.classList.remove('open');
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.classList.remove('open'); });
const seen = new Set();
function markSeen(hz){ seen.add(hz); updateProgress(); }
function updateProgress(){ const pct = Math.round((seen.size / ALL_WORDS.length) * 100); document.getElementById('progressFill').style.width = pct + '%'; }
document.getElementById('search').addEventListener('input', render);
render();
</script>
</body>
</html>
