àngxué", "k": "v.", "a": "pulang sekolah"}, {"h": "游戏", "p": "yóuxì", "k": "n.", "a": "permainan"}, {"h": "老人", "p": "lǎorén", "k": "n.", "a": "orang tua, lansia"}, {"h": "根据", "p": "gēnjù", "k": "prep./v.", "a": "berdasarkan, menurut; berdasar pada"}, {"h": "了解", "p": "liǎojiě", "k": "v.", "a": "memahami, mengenal"}, {"h": "可是", "p": "kěshì", "k": "conj.", "a": "tetapi, namun"}, {"h": "以上", "p": "yǐshàng", "k": "n.", "a": "lebih dari, ke atas"}, {"h": "有名", "p": "yǒumíng", "k": "adj.", "a": "terkenal"}, {"h": "景点", "p": "jǐngdiǎn", "k": "n.", "a": "tempat wisata"}, {"h": "游客", "p": "yóukè", "k": "n.", "a": "wisatawan"}, {"h": "外地", "p": "wàidì", "k": "n.", "a": "daerah lain, luar daerah"}, {"h": "聊", "p": "liáo", "k": "v.", "a": "mengobrol"}, {"h": "南京", "p": "Nánjīng", "k": "专名", "a": "Nanjing"}, {"h": "河", "p": "hé", "k": "n.", "a": "sungai"}, {"h": "关系", "p": "guānxì", "k": "n.", "a": "hubungan"}, {"h": "养", "p": "yǎng", "k": "v.", "a": "memelihara, menghidupi, membesarkan"}, {"h": "黄河", "p": "Huáng Hé", "k": "专名", "a": "Sungai Kuning"}, {"h": "西北", "p": "xīběi", "k": "n.", "a": "barat laut"}, {"h": "经过", "p": "jīngguò", "k": "v./n.", "a": "melewati; proses"}, {"h": "草地", "p": "cǎodì", "k": "n.", "a": "padang rumput"}, {"h": "遇见", "p": "yùjiàn", "k": "v.", "a": "bertemu (secara kebetulan)"}], "dialog": [{"s": "杨同乐", "zh": "您搬到蓝天小区一段时间了，觉得怎么样？", "id": "Anda sudah beberapa waktu pindah ke kompleks Lantian, bagaimana rasanya?", "tr": "15-1", "py": "Nín bān dào lán tiān xiǎoqū yí duàn shíjiān le, juéde zěnmeyàng?"}, {"s": "王一雪", "zh": "小区环境挺好的，附近买东西也很方便，过马路就是超市。", "id": "Lingkungan kompleksnya cukup bagus, belanja di sekitarnya juga praktis, menyeberang jalan sudah ada supermarket.", "tr": "15-1", "py": "Xiǎoqū huánjìng tǐng hǎo de, fùjìn mǎi dōngxi yě hěn fāngbiàn, guò mǎlù jiù shì chāoshì."}, {"s": "杨同乐", "zh": "平时孩子们在哪儿玩？", "id": "Biasanya anak-anak bermain di mana?", "tr": "15-1", "py": "Píngshí háizimen zài nǎr wán?"}, {"s": "王一雪", "zh": "小区里有很多树，孩子们放学后就在树下做游戏。你想买房子吗？", "id": "Di dalam kompleks banyak pohon, sepulang sekolah anak-anak bermain di bawah pohon. Kamu mau beli rumah?", "tr": "15-1", "py": "Xiǎoqū lǐ yǒu hěn duō shù, háizimen fàngxué hòu jiù zài shù xià zuò yóuxì. Nǐ xiǎng mǎi fángzi ma?"}, {"s": "杨同乐", "zh": "是。我想买一个大房子，让我爸妈过来跟我一起住。", "id": "Iya. Saya ingin membeli rumah yang besar, supaya ayah dan ibu saya bisa datang dan tinggal bersama saya.", "tr": "15-1", "py": "Shì. Wǒ xiǎng mǎi yí gè dà fángzi, ràng wǒ bà mā guòlái gēn wǒ yìqǐ zhù."}, {"s": "王一雪", "zh": "蓝天小区的老人挺多的，这几年小区根据他们的需要，有了很多变化。", "id": "Di kompleks Lantian cukup banyak lansia; beberapa tahun ini kompleksnya banyak berubah menyesuaikan kebutuhan mereka.", "tr": "15-1", "py": "Lán tiān xiǎoqū de lǎorén tǐng duō de, zhè jǐ nián xiǎoqū gēnjù tāmen de xūyào, yǒu le hěn duō biànhuà."}, {"s": "杨同乐", "zh": "真不错！过几天我去蓝天小区看看。", "id": "Bagus sekali! Beberapa hari lagi saya akan melihat ke kompleks Lantian.", "tr": "15-1", "py": "Zhēn búcuò! Guò jǐ tiān wǒ qù lán tiān xiǎoqū kànkan."}, {"s": "王一雪", "zh": "假期我想去南京旅游，但是我不太了解那里。", "id": "Waktu liburan aku ingin berwisata ke Nanjing, tetapi aku kurang mengenal tempat itu.", "tr": "15-3", "py": "Jiàqī wǒ xiǎng qù nánjīng lǚyóu, dànshì wǒ bú tài liǎojiě nàlǐ."}, {"s": "杨同乐", "zh": "我虽然不是南京人，可是我是在南京上的大学，可以说是半个南京人。", "id": "Meskipun saya bukan orang Nanjing, saya kuliah di Nanjing, jadi bisa dibilang setengah orang Nanjing.", "tr": "15-3", "py": "Wǒ suīrán bú shì nánjīng rén, kěshì wǒ shì zài nánjīng shàng de dàxué, kěyǐ shuō shì bàn gè nánjīng rén."}, {"s": "王一雪", "zh": "太好了！你快给我介绍一下南京吧。", "id": "Bagus sekali! Cepat ceritakan tentang Nanjing kepadaku.", "tr": "15-3", "py": "Tài hǎo le! Nǐ kuài gěi wǒ jièshào yíxià nánjīng ba."}, {"s": "杨同乐", "zh": "南京有两千年以上的历史，有老城、老街，还有很多有名的景点，每年去旅游的游客特别多。", "id": "Nanjing punya sejarah lebih dari dua ribu tahun, ada kota tua, jalan-jalan tua, dan banyak tempat wisata terkenal; setiap tahun wisatawan yang datang sangat banyak.", "tr": "15-3", "py": "Nánjīng yǒu liǎngqiān nián yǐshàng de lìshǐ, yǒu lǎo chéng, lǎo jiē, hái yǒu hěn duō yǒumíng de jǐngdiǎn, měi nián qù lǚyóu de yóukè tèbié duō."}, {"s": "王一雪", "zh": "除了这些以外，你再告诉我一些外地人不知道的地方。", "id": "Selain itu, beri tahu aku juga beberapa tempat yang tidak diketahui orang luar daerah.", "tr": "15-3", "py": "Chúle zhèxiē yǐwài, nǐ zài gàosu wǒ yìxiē wàidì rén bù zhīdào de dìfang."}, {"s": "杨同乐", "zh": "那太多了，我得一点儿一点儿给您讲。", "id": "Itu banyak sekali, saya harus menceritakannya kepada Anda sedikit demi sedikit.", "tr": "15-3", "py": "Nà tài duō le, wǒ de yìdiǎnr yìdiǎnr gěi nín jiǎng."}, {"s": "王一雪", "zh": "行，下班后我请你吃晚饭，咱们边吃边聊。", "id": "Baik, sesudah pulang kerja kutraktir makan malam, kita makan sambil mengobrol.", "tr": "15-3", "py": "Xíng, xiàbān hòu wǒ qǐng nǐ chī wǎnfàn, zánmen biān chī biān liáo."}, {"s": "王一雪", "zh": "小明，中国有一条大河，它的名字跟颜色有关系，你知道是什么河吗？", "id": "Xiaoming, di Tiongkok ada sebuah sungai besar yang namanya berhubungan dengan warna, kamu tahu sungai apa itu?", "tr": "15-5", "py": "Xiǎomíng, Zhōngguó yǒu yì tiáo dà hé, tā de míngzi gēn yánsè yǒuguān xì, nǐ zhīdào shì shénme hé ma?"}, {"s": "刘小明", "zh": "我知道，是黄河！", "id": "Aku tahu, Sungai Kuning!", "tr": "15-5", "py": "Wǒ zhīdào, shì huánghé!"}, {"s": "王一雪", "zh": "你说对了。我再问问你，你知道它为什么叫黄河吗？", "id": "Kamu benar. Mama tanya lagi, kamu tahu kenapa namanya Sungai Kuning?", "tr": "15-5", "py": "Nǐ shuō duì le. Wǒ zài wèn wèn nǐ, nǐ zhīdào tā wèishénme jiào huánghé ma?"}, {"s": "刘小明", "zh": "因为河水看起来是黄色的，所以叫这个名字。黄河是中国最长的河吗？", "id": "Karena air sungainya kelihatan berwarna kuning, jadi dinamai begitu. Apakah Sungai Kuning sungai terpanjang di Tiongkok?", "tr": "15-5", "py": "Yīnwèi hé shuǐ kàn qǐlái shì huángsè de, suǒyǐ jiào zhège míngzi. Huánghé shì Zhōngguó zuì cháng de hé ma?"}, {"s": "王一雪", "zh": "不是。黄河虽然不是最长的河，可是在历史上很重要。", "id": "Bukan. Meskipun Sungai Kuning bukan sungai terpanjang, tetapi sangat penting dalam sejarah.", "tr": "15-5", "py": "Bú shì. Huánghé suīrán bú shì zuì cháng de hé, kěshì zài lìshǐ shàng hěn zhòngyào."}, {"s": "刘小明", "zh": "这个我知道。很久以前，很多中国人都住在黄河边上。", "id": "Itu aku tahu. Dahulu kala, banyak orang Tiongkok tinggal di tepi Sungai Kuning.", "tr": "15-5", "py": "Zhège wǒ zhīdào. Hěn jiǔ yǐqián, hěn duō Zhōngguó rén dōu zhù zài huánghé biān shàng."}, {"s": "王一雪", "zh": "对。在我们中国人看来，黄河像妈妈一样，养了我们几千年。", "id": "Betul. Menurut kami orang Tiongkok, Sungai Kuning seperti seorang ibu yang telah menghidupi kami selama ribuan tahun.", "tr": "15-5", "py": "Duì. Zài wǒmen Zhōngguó rén kànlái, huánghé xiàng māma yíyàng, yǎng le wǒmen jǐ qiān nián."}, {"s": "", "zh": "我小时候住在北京的西北边，有一条非常有名的河经过那里。", "id": "Waktu kecil aku tinggal di bagian barat laut Beijing, ada sebuah sungai yang sangat terkenal melintas di sana.", "tr": "15-7", "py": "Wǒ xiǎoshíhou zhù zài Běijīng de xīběi biān, yǒu yì tiáo fēicháng yǒumíng de hé jīngguò nàlǐ."}, {"s": "", "zh": "我家就住在河边。", "id": "Rumahku persis di tepi sungai.", "tr": "15-7", "py": "Wǒ jiā jiù zhù zài hé biān."}, {"s": "", "zh": "那里有高高的大树和绿绿的草地。", "id": "Di sana ada pohon-pohon besar yang tinggi dan padang rumput yang hijau.", "tr": "15-7", "py": "Nàlǐ yǒu gāo gāo de dà shù hé lǜ lǜ de cǎodì."}, {"s": "", "zh": "春天，河边的花都开了，看起来特别漂亮。", "id": "Pada musim semi, bunga-bunga di tepi sungai bermekaran, kelihatan sangat indah.", "tr": "15-7", "py": "Chūntiān, hé biān de huā dōu kāi le, kàn qǐlái tèbié piàoliang."}, {"s": "", "zh": "还记得小时候，一到夏天我就去河里游泳。", "id": "Aku masih ingat waktu kecil, setiap musim panas tiba aku berenang di sungai.", "tr": "15-7", "py": "Hái jìde xiǎoshíhou, yí dào xiàtiān wǒ jiù qù hé lǐ yóuyǒng."}, {"s": "", "zh": "长大以后，遇到什么不开心的事情，我就去河边的树下坐着，听听鸟叫，看看河水，跟遇见的朋友聊聊天儿，难过的事情不一会儿就忘了。", "id": "Setelah dewasa, kalau ada hal yang tidak menyenangkan, aku pergi duduk di bawah pohon di tepi sungai, mendengarkan kicau burung, memandangi air sungai, mengobrol dengan teman yang kutemui, dan dalam sekejap hal yang menyedihkan pun terlupakan.", "tr": "15-7", "py": "Zhǎng dà yǐhòu, yùdào shénme bù kāixīn de shìqing, wǒ jiù qù hé biān de shù xià zuò zhe, tīng tīng niǎo jiào, kànkan hé shuǐ, gēn yùjiàn de péngyou liáo liáotiānr, nánguò de shìqing bù yíhuìr jiù wàng le."}, {"s": "", "zh": "那是我最喜欢的地方。", "id": "Itulah tempat yang paling kusukai.", "tr": "15-7", "py": "Nà shì wǒ zuì xǐhuan de dìfang."}], "teks": [{"tr": "15-1", "nama": "课文1 · Kompleks perumahan Lantian"}, {"tr": "15-3", "nama": "课文2 · Memperkenalkan Nanjing"}, {"tr": "15-5", "nama": "课文3 · Sungai Kuning"}, {"tr": "15-7", "nama": "课文4 · Tempat favorit masa kecil"}]}, "16": {"judul": "我听说有的熊猫出国了", "arti": "Kudengar ada panda yang pergi ke luar negeri", "kata": [{"h": "脏", "p": "zāng", "k": "adj.", "a": "kotor"}, {"h": "可爱", "p": "kě'ài", "k": "adj.", "a": "lucu, menggemaskan"}, {"h": "一会儿", "p": "yíhuìr", "k": "adv.", "a": "sebentar …, sebentar … (berganti-ganti)"}, {"h": "脚", "p": "jiǎo", "k": "n.", "a": "kaki (telapak kaki)"}, {"h": "照顾", "p": "zhàogù", "k": "v.", "a": "merawat, menjaga"}, {"h": "好像", "p": "hǎoxiàng", "k": "v.", "a": "seperti, seolah-olah"}, {"h": "认得", "p": "rènde", "k": "v.", "a": "kenal, mengenali"}, {"h": "周末", "p": "zhōumò", "k": "n.", "a": "akhir pekan"}, {"h": "动物园", "p": "dòngwùyuán", "k": "n.", "a": "kebun binatang"}, {"h": "动物", "p": "dòngwù", "k": "n.", "a": "hewan, binatang"}, {"h": "大熊猫", "p": "dàxióngmāo", "k": "n.", "a": "panda raksasa"}, {"h": "奇怪", "p": "qíguài", "k": "adj.", "a": "aneh"}, {"h": "其实", "p": "qíshí", "k": "adv.", "a": "sebenarnya"}, {"h": "竹子", "p": "zhúzi", "k": "n.", "a": "bambu"}, {"h": "国宝", "p": "guóbǎo", "k": "n.", "a": "harta nasional"}, {"h": "全", "p": "quán", "k": "adj.", "a": "seluruh, semua"}, {"h": "野生", "p": "yěshēng", "k": "adj.", "a": "liar"}, {"h": "关于", "p": "guānyú", "k": "prep.", "a": "tentang, mengenai"}, {"h": "饱", "p": "bǎo", "k": "adj.", "a": "kenyang"}, {"h": "张", "p": "zhāng", "k": "v.", "a": "membuka (mulut, dll.)"}, {"h": "嘴", "p": "zuǐ", "k": "n.", "a": "mulut"}, {"h": "身边", "p": "shēnbiān", "k": "n.", "a": "sisi, di samping"}, {"h": "半天", "p": "bàntiān", "k": "num.-m.", "a": "lama sekali; setengah hari"}, {"h": "脸", "p": "liǎn", "k": "n.", "a": "wajah, muka"}, {"h": "大人", "p": "dàren", "k": "n.", "a": "orang dewasa"}, {"h": "喜爱", "p": "xǐ'ài", "k": "v.", "a": "menyukai, menyayangi"}], "dialog": [{"s": "刘小雪", "zh": "这只小猫你们养了多久了？", "id": "Kucing kecil ini sudah berapa lama kalian pelihara?", "tr": "16-1", "py": "Zhè zhī xiǎomāo nǐmen yǎng le duō jiǔ le?"}, {"s": "服务员", "zh": "已经一年多了。第一天看见它的时候，它又脏又小。", "id": "Sudah lebih dari setahun. Waktu pertama kali melihatnya, dia kotor dan kecil.", "tr": "16-1", "py": "Yǐjīng yì nián duō le. Dìyī tiān kànjiàn tā de shíhou, tā yòu zàng yòu xiǎo."}, {"s": "刘小雪", "zh": "现在它变得又干净又漂亮了。", "id": "Sekarang dia jadi bersih dan cantik.", "tr": "16-1", "py": "Xiànzài tā biàn de yòu gānjìng yòu piàoliang le."}, {"s": "服务员", "zh": "是啊。它还特别可爱，一会儿在你脚边睡觉，一会儿在你身上爬。", "id": "Iya. Dia juga sangat lucu, sebentar tidur di dekat kakimu, sebentar memanjat ke badanmu.", "tr": "16-1", "py": "Shì a. Tā hái tèbié kě'ài, yíhuìr zài nǐ jiǎo biān shuìjiào, yíhuìr zài nǐ shēn shàng pá."}, {"s": "刘小雪", "zh": "你们把它照顾得真好。", "id": "Kalian merawatnya dengan sangat baik.", "tr": "16-1", "py": "Nǐmen bǎ tā zhàogù de zhēn hǎo."}, {"s": "服务员", "zh": "它就好像我们的孩子，我们照顾它，它也认得我们了。", "id": "Dia seperti anak kami sendiri; kami merawatnya, dan dia juga sudah mengenal kami.", "tr": "16-1", "py": "Tā jiù hǎoxiàng wǒmen de háizi, wǒmen zhàogù tā, tā yě rènde wǒmen le."}, {"s": "刘小雪", "zh": "妈妈，我们家也养一只小猫吧。", "id": "Ma, kita juga pelihara seekor kucing kecil, yuk.", "tr": "16-1", "py": "Māma, wǒmen jiā yě yǎng yì zhī xiǎomāo ba."}, {"s": "王一雪", "zh": "咱们没时间照顾，还是别养了，我周末带你们去北京动物园看动物吧。", "id": "Kita tidak punya waktu untuk merawatnya, lebih baik jangan. Akhir pekan ini Mama ajak kalian ke Kebun Binatang Beijing untuk melihat hewan, ya.", "tr": "16-1", "py": "Zánmen méi shíjiān zhàogù, háishi bié yǎng le, wǒ zhōumò dài nǐmen qù Běijīng dòngwùyuán kàn dòngwù ba."}, {"s": "刘小明", "zh": "妈妈，大熊猫这个名字很奇怪，它们跟猫有什么关系？", "id": "Ma, nama panda raksasa (大熊猫, \"beruang-kucing besar\") itu aneh, apa hubungannya dengan kucing?", "tr": "16-3", "py": "Māma, dàxióngmāo zhège míngzi hěn qíguài, tāmen gēn māo yǒu shénme guānxì?"}, {"s": "王一雪", "zh": "这个问题问得好，它们跟猫没什么关系，其实应该叫大猫熊。", "id": "Pertanyaan yang bagus. Panda tidak ada hubungannya dengan kucing; sebenarnya seharusnya disebut 大猫熊 (\"beruang besar mirip kucing\").", "tr": "16-3", "py": "Zhège wèntí wèn de hǎo, tāmen gēn māo méi shénme guānxì, qíshí yīnggāi jiào dà māo xióng."}, {"s": "刘小明", "zh": "大熊猫为什么只吃竹子不吃肉？", "id": "Kenapa panda hanya makan bambu dan tidak makan daging?", "tr": "16-3", "py": "Dàxióngmāo wèishénme zhī chī zhúzi bù chī ròu?"}, {"s": "王一雪", "zh": "它们跟人一样，也可以吃肉，但是对肉不感兴趣。", "id": "Mereka sama seperti manusia, bisa juga makan daging, tetapi tidak tertarik pada daging.", "tr": "16-3", "py": "Tāmen gēn rén yíyàng, yě kěyǐ chī ròu, dànshì duì ròu bù gǎnxìngqù."}, {"s": "刘小明", "zh": "大熊猫为什么是中国的国宝？", "id": "Kenapa panda menjadi harta nasional Tiongkok?", "tr": "16-3", "py": "Dàxióngmāo wèishénme shì Zhōngguó de guóbǎo?"}, {"s": "王一雪", "zh": "全世界只有中国有野生大熊猫，中国是大熊猫的家。", "id": "Di seluruh dunia hanya Tiongkok yang punya panda liar; Tiongkok adalah rumah panda.", "tr": "16-3", "py": "Quán shìjiè zhǐyǒu Zhōngguó yǒu yěshēng dàxióngmāo, Zhōngguó shì dàxióngmāo de jiā."}, {"s": "刘小明", "zh": "我听说有的熊猫出国了，他们去哪儿了？", "id": "Kudengar ada panda yang pergi ke luar negeri, mereka pergi ke mana?", "tr": "16-3", "py": "Wǒ tīngshuō yǒude xióngmāo chūguó le, tāmen qù nǎr le?"}, {"s": "王一雪", "zh": "关于这个问题，我得慢慢给你讲。", "id": "Tentang pertanyaan ini, Mama harus menjelaskannya pelan-pelan kepadamu.", "tr": "16-3", "py": "Guānyú zhège wèntí, wǒ de màn màn gěi nǐ jiǎng."}, {"s": "刘小雪", "zh": "弟弟，你真是\"十万个为什么\"。", "id": "Adik, kamu benar-benar \"Seratus Ribu Mengapa\" (julukan untuk anak yang banyak bertanya).", "tr": "16-3", "py": "Dìdi, nǐ zhēn shì\" shíwàn gè wèishénme\"."}, {"s": "刘小雪", "zh": "这只大熊猫一会儿爬上去，一会儿跳下来，可爱极了！", "id": "Panda ini sebentar memanjat ke atas, sebentar melompat turun, lucu sekali!", "tr": "16-5", "py": "Zhè zhī dàxióngmāo yíhuìr pá shàngqù, yíhuìr tiào xiàlái, kě'ài jí le!"}, {"s": "王一雪", "zh": "它好像还没吃饱，站起来张着嘴找吃的呢。", "id": "Sepertinya dia belum kenyang, dia berdiri sambil membuka mulut mencari makanan.", "tr": "16-5", "py": "Tā hǎoxiàng hái méi chī bǎo, zhàn qǐlái Zhāng zhe zuǐ zhǎo chī de ne."}, {"s": "刘小雪", "zh": "它身边那只熊猫半天没动，是不是在睡觉呢？", "id": "Panda yang di sampingnya sudah lama sekali tidak bergerak, apakah sedang tidur?", "tr": "16-5", "py": "Tā shēnbiān nà zhī xióngmāo bàntiān méi dòng, shì bu shì zài shuìjiào ne?"}, {"s": "王一雪", "zh": "我看不见它的脸，可能是吧。一般来说，熊猫每天要睡很多次觉。", "id": "Mama tidak bisa melihat wajahnya, mungkin iya. Biasanya panda tidur berkali-kali setiap hari.", "tr": "16-5", "py": "Wǒ kàn bújiàn tā de liǎn, kěnéng shì ba. Yìbān lái shuō, xióngmāo měi tiān yào shuì hěn duō cì jiào."}, {"s": "刘小雪", "zh": "对，除了睡觉以外，很多时间都在吃东西。", "id": "Betul, selain tidur, sebagian besar waktunya dipakai untuk makan.", "tr": "16-5", "py": "Duì, chúle shuìjiào yǐwài, hěn duō shíjiān dōu zài chī dōngxi."}, {"s": "刘小明", "zh": "大熊猫的生活真舒服啊！", "id": "Hidup panda enak sekali!", "tr": "16-5", "py": "Dàxióngmāo de shēnghuó zhēn shūfu a!"}, {"s": "刘小雪", "zh": "妈妈，您帮我和这两只大熊猫照一张照片吧。", "id": "Ma, tolong fotokan aku dengan dua panda ini.", "tr": "16-5", "py": "Māma, nín bāng wǒ hé zhè liǎng zhī dàxióngmāo zhào yì Zhāng zhàopiàn ba."}, {"s": "", "zh": "今天我带小雪和小明去动物园玩了。", "id": "Hari ini aku mengajak Xiaoxue dan Xiaoming bermain ke kebun binatang.", "tr": "16-7", "py": "Jīntiān wǒ dài Xiǎoxuě hé Xiǎomíng qù dòngwùyuán wán le."}, {"s": "", "zh": "北京动物园是中国很有名的动物园，里面有非常多的动物，当然，大人和孩子最喜爱的还是大熊猫。", "id": "Kebun Binatang Beijing adalah kebun binatang yang sangat terkenal di Tiongkok, di dalamnya ada banyak sekali hewan; tentu saja, yang paling disukai orang dewasa dan anak-anak tetap panda raksasa.", "tr": "16-7", "py": "Běijīng dòngwùyuán shì Zhōngguó hěn yǒumíng de dòngwùyuán, lǐmiàn yǒu fēicháng duō de dòngwù, dāngrán, dàren hé háizi zuì xǐ'ài de háishi dàxióngmāo."}, {"s": "", "zh": "每天有很多游客去熊猫馆，他们带着相机去给可爱的大熊猫拍照。", "id": "Setiap hari banyak wisatawan pergi ke rumah panda, mereka membawa kamera untuk memotret panda yang lucu.", "tr": "16-7", "py": "Měi tiān yǒu hěn duō yóukè qù xióngmāo guǎn, tāmen dài zhe xiàngjī qù gěi kě'ài de dàxióngmāo pāizhào."}, {"s": "", "zh": "动物园早上七点半开门，晚上七点关门，冬天比夏天游客少，所以也比平时早关门一个小时。", "id": "Kebun binatang buka jam setengah delapan pagi dan tutup jam tujuh malam; pada musim dingin wisatawan lebih sedikit daripada musim panas, jadi kebun binatang juga tutup satu jam lebih awal dari biasanya.", "tr": "16-7", "py": "Dòngwùyuán zǎoshang qī diǎn bàn kāi mén, wǎnshang qī diǎn guān mén, dōngtiān bǐ xiàtiān yóukè shǎo, suǒyǐ yě bǐ píngshí zǎo guān mén yí gè xiǎoshí."}, {"s": "", "zh": "如果第一次来北京旅游，跟家人一起去北京动物园是个不错的选择。", "id": "Kalau pertama kali berwisata ke Beijing, pergi ke Kebun Binatang Beijing bersama keluarga adalah pilihan yang bagus.", "tr": "16-7", "py": "Rúguǒ dìyī cì lái Běijīng lǚyóu, gēn jiārén yìqǐ qù Běijīng dòngwùyuán shì gè búcuò de xuǎnzé."}], "teks": [{"tr": "16-1", "nama": "课文1 · Kucing di tempat adopsi hewan"}, {"tr": "16-3", "nama": "课文2 · Mengapa panda adalah harta nasional"}, {"tr": "16-5", "nama": "课文3 · Di rumah panda"}, {"tr": "16-7", "nama": "课文4 · Kebun Binatang Beijing"}]}, "17": {"judul": "我要多向认真的人学习", "arti": "Aku harus lebih banyak belajar dari orang yang teliti", "kata": [{"h": "向", "p": "xiàng", "k": "prep.", "a": "ke arah, kepada"}, {"h": "楼梯", "p": "lóutī", "k": "n.", "a": "tangga"}, {"h": "害怕", "p": "hàipà", "k": "v.", "a": "takut"}, {"h": "生气", "p": "shēngqì", "k": "v.", "a": "marah"}, {"h": "常见", "p": "cháng jiàn", "k": "-", "a": "sering terjadi, umum"}, {"h": "聪明", "p": "cōngmíng", "k": "adj.", "a": "pintar, cerdas"}, {"h": "错", "p": "cuò", "k": "n.", "a": "kesalahan"}, {"h": "认为", "p": "rènwéi", "k": "v.", "a": "menganggap, berpendapat"}, {"h": "到处", "p": "dàochù", "k": "adv.", "a": "di mana-mana"}, {"h": "继续", "p": "jìxù", "k": "v.", "a": "melanjutkan"}, {"h": "同意", "p": "tóngyì", "k": "v.", "a": "setuju"}, {"h": "可", "p": "kě", "k": "conj.", "a": "tetapi"}, {"h": "屋子", "p": "wūzi", "k": "n.", "a": "ruangan, kamar"}, {"h": "有关", "p": "yǒuguān", "k": "v./prep.", "a": "berhubungan dengan; tentang"}, {"h": "关机", "p": "guānjī", "k": "v.", "a": "mematikan (ponsel, komputer)"}, {"h": "前天", "p": "qiántiān", "k": "n.", "a": "kemarin lusa"}, {"h": "留学", "p": "liúxué", "k": "v.", "a": "belajar di luar negeri"}, {"h": "国家", "p": "guójiā", "k": "n.", "a": "negara"}, {"h": "比如", "p": "bǐrú", "k": "v.", "a": "misalnya"}, {"h": "查", "p": "chá", "k": "v.", "a": "mencari (informasi), memeriksa"}, {"h": "有用", "p": "yǒuyòng", "k": "adj.", "a": "berguna"}, {"h": "容易", "p": "róngyì", "k": "adj.", "a": "mudah"}, {"h": "回答", "p": "huídá", "k": "v.", "a": "menjawab"}, {"h": "方向", "p": "fāngxiàng", "k": "n.", "a": "arah"}, {"h": "只有", "p": "zhǐyǒu", "k": "conj.", "a": "hanya jika"}, {"h": "真正", "p": "zhēnzhèng", "k": "adv.", "a": "sungguh-sungguh, benar-benar"}, {"h": "难题", "p": "nántí", "k": "n.", "a": "masalah sulit, soal sulit"}], "dialog": [{"s": "刘小雪", "zh": "别再向前走了，李老师的办公室已经到了。", "id": "Jangan jalan terus ke depan, ruangan Bu Li sudah sampai.", "tr": "17-1", "py": "Bié zài xiàng qián zǒu le, Lǐ lǎoshī de bàngōngshì yǐjīng dào le."}, {"s": "同学", "zh": "你进去吧，我在楼梯那儿等你。我害怕见李老师。", "id": "Kamu masuk saja, aku tunggu di dekat tangga. Aku takut bertemu Bu Li.", "tr": "17-1", "py": "Nǐ jìnqù ba, wǒ zài lóutī nàr děng nǐ. Wǒ hàipà jiàn Lǐ lǎoshī."}, {"s": "刘小雪", "zh": "怎么回事？", "id": "Ada apa?", "tr": "17-1", "py": "Zěnme huí shì?"}, {"s": "同学", "zh": "最近我做错了好几件事，我怕李老师生气。", "id": "Akhir-akhir ini aku melakukan beberapa kesalahan, aku takut Bu Li marah.", "tr": "17-1", "py": "Zuìjìn wǒ zuò cuò le hǎo jǐ jiàn shì, wǒ pà Lǐ lǎoshī shēngqì."}, {"s": "刘小雪", "zh": "你想多了，做错事情是很常见的。", "id": "Kamu terlalu banyak berpikir, berbuat salah itu hal yang biasa.", "tr": "17-1", "py": "Nǐ xiǎng duō le, zuò cuò shìqing shì hěn chángjiàn de."}, {"s": "同学", "zh": "我把简单的事情做错了，李老师一定觉得我不认真。", "id": "Hal yang sederhana pun kukerjakan dengan salah, Bu Li pasti menganggap aku tidak sungguh-sungguh.", "tr": "17-1", "py": "Wǒ bǎ jiǎndān de shìqing zuò cuò le, Lǐ lǎoshī yídìng juéde wǒ bú rènzhēn."}, {"s": "刘小雪", "zh": "有的人虽然很聪明，但是会在简单的事情中出错，因为他们认为事情简单，就不会认真去做了。", "id": "Ada orang yang meskipun pintar, tetapi berbuat salah dalam hal yang sederhana, karena mereka menganggap hal itu mudah, jadi tidak mengerjakannya dengan sungguh-sungguh.", "tr": "17-1", "py": "Yǒude rén suīrán hěn cōngmíng, dànshì huì zài jiǎndān de shìqing zhōng chū cuò, yīnwèi tāmen rènwéi shìqing jiǎndān, jiù bú huì rènzhēn qù zuò le."}, {"s": "同学", "zh": "你说的就是我，以后我要多向认真的人学习。", "id": "Yang kamu bicarakan itu persis aku; mulai sekarang aku harus lebih banyak belajar dari orang yang teliti.", "tr": "17-1", "py": "Nǐ shuō de jiù shì wǒ, yǐhòu wǒ yào duō xiàng rènzhēn de rén xuéxí."}, {"s": "白家月", "zh": "太阳从西边出来了？这几天怎么总是在图书馆看见你？", "id": "Matahari terbit dari barat? Kenapa beberapa hari ini aku selalu melihatmu di perpustakaan?", "tr": "17-3", "py": "Tàiyáng cóng xībian chūlái le? Zhè jǐ tiān zěnme zǒngshì zài túshūguǎn kànjiàn nǐ?"}, {"s": "陈天中", "zh": "这有什么奇怪的？我是来学习的。", "id": "Apa anehnya? Aku datang untuk belajar.", "tr": "17-3", "py": "Zhè yǒu shénme qíguài de? Wǒ shì lái xuéxí de."}, {"s": "白家月", "zh": "你怎么还来图书馆学习？同学们都在到处找工作呢。", "id": "Kenapa kamu masih datang belajar di perpustakaan? Teman-teman semua sedang mencari kerja ke mana-mana.", "tr": "17-3", "py": "Nǐ zěnme hái lái túshūguǎn xuéxí? Tóngxuémen dōu zài dàochù zhǎo gōngzuò ne."}, {"s": "陈天中", "zh": "我不想现在就工作，还想继续学习，我爸妈也同意。可我还没想好学什么，所以来图书馆看看。", "id": "Aku belum mau bekerja sekarang, aku masih ingin melanjutkan studi, ayah dan ibuku juga setuju. Tetapi aku belum memutuskan mau belajar apa, jadi aku datang melihat-lihat di perpustakaan.", "tr": "17-3", "py": "Wǒ bù xiǎng xiànzài jiù gōngzuò, hái xiǎng jìxù xuéxí, wǒ bà mā yě tóngyì. Kě wǒ hái méi xiǎng hào xué shénme, suǒyǐ lái túshūguǎn kànkan."}, {"s": "白家月", "zh": "你不是喜欢玩电脑吗？你可以去看看跟电脑有关系的书。", "id": "Bukankah kamu suka main komputer? Kamu bisa membaca buku-buku yang berhubungan dengan komputer.", "tr": "17-3", "py": "Nǐ bú shì xǐhuan wán diànnǎo ma? Nǐ kěyǐ qù kànkan gēn diànnǎo yǒuguān xì de shū."}, {"s": "陈天中", "zh": "你说得对，我记得那个屋子里有些跟电脑有关的书，我去找找。", "id": "Kamu benar, seingatku di ruangan itu ada beberapa buku tentang komputer, aku coba cari.", "tr": "17-3", "py": "Nǐ shuō de duì, wǒ jìde nàge wūzi lǐ yǒuxiē gēn diànnǎo yǒuguān de shū, wǒ qù zhǎo zhǎo."}, {"s": "李文", "zh": "天中，你的手机怎么关机了？", "id": "Tianzhong, kenapa ponselmu mati?", "tr": "17-5", "py": "Tiānzhōng, nǐ de shǒujī zěnme guānjī le?"}, {"s": "陈天中", "zh": "我的手机没电了。你找我有事吗？", "id": "Baterai ponselku habis. Kamu mencariku, ada perlu apa?", "tr": "17-5", "py": "Wǒ de shǒujī méi diàn le. Nǐ zhǎo wǒ yǒu shì ma?"}, {"s": "李文", "zh": "前天我看见家月了，她告诉我你打算继续留学？", "id": "Kemarin lusa aku bertemu Jiayue, katanya kamu berencana melanjutkan studi di luar negeri?", "tr": "17-5", "py": "Qiántiān wǒ kànjiàn Jiāyuè le, tā gàosu wǒ nǐ dǎsuàn jìxù liúxué?"}, {"s": "陈天中", "zh": "是，可是我还没想好学什么，更没想好去哪个国家。", "id": "Iya, tetapi aku belum memutuskan mau belajar apa, apalagi mau ke negara mana.", "tr": "17-5", "py": "Shì, kěshì wǒ hái méi xiǎng hào xué shénme, gèng méi xiǎng hǎo qù nǎge guójiā."}, {"s": "李文", "zh": "你可以去中国学中文啊。比如可以去北京、上海这样的大城市，那里有很多好大学，也有很多留学生。", "id": "Kamu bisa ke Tiongkok belajar bahasa Mandarin. Misalnya ke kota besar seperti Beijing atau Shanghai, di sana banyak universitas bagus dan juga banyak mahasiswa asing.", "tr": "17-5", "py": "Nǐ kěyǐ qù Zhōngguó xué Zhōngwén a. Bǐrú kěyǐ qù Běijīng, Shànghǎi zhèyàng de dà chéngshì, nàlǐ yǒu hěn duō hǎo dàxué, yě yǒu hěn duō liúxuéshēng."}, {"s": "陈天中", "zh": "好，那我上网查一查。", "id": "Baik, kalau begitu aku cari informasinya di internet.", "tr": "17-5", "py": "Hǎo, nà wǒ shàngwǎng chá yì chá."}, {"s": "李文", "zh": "我给你介绍几个有用的网站。", "id": "Akan kuberi tahu beberapa situs web yang berguna.", "tr": "17-5", "py": "Wǒ gěi nǐ jièshào jǐ gè yǒuyòng de wǎngzhàn."}, {"s": "", "zh": "大学生活马上就要结束了，我最近经常被问到一个问题——\"你以后想做什么\"，这个问题真不容易回答。", "id": "Kehidupan kuliahku sebentar lagi berakhir; akhir-akhir ini aku sering ditanya satu pertanyaan, \"Nanti kamu mau jadi apa?\", pertanyaan ini sungguh tidak mudah dijawab.", "tr": "17-7", "py": "Dàxuéshēng huó mǎshàng jiù yào jiéshù le, wǒ zuìjìn jīngcháng bèi wèn dào yí gè wèntí —\" nǐ yǐhòu xiǎng zuò shénme\", zhège wèntí zhēn bù róngyì huídá."}, {"s": "", "zh": "我也问了几个同学，大家选择的方向都不同。", "id": "Aku juga bertanya kepada beberapa teman, arah yang mereka pilih semuanya berbeda.", "tr": "17-7", "py": "Wǒ yě wèn le jǐ gè tóngxué, dàjiā xuǎnzé de fāngxiàng dōu bùtóng."}, {"s": "", "zh": "有的想继续在学校学习，有的打算出国留学，还有的决定先找工作。", "id": "Ada yang ingin melanjutkan belajar di kampus, ada yang berencana kuliah di luar negeri, ada juga yang memutuskan mencari kerja dulu.", "tr": "17-7", "py": "Yǒude xiǎng jìxù zài xuéxiào xuéxí, yǒude dǎsuàn chūguó liúxué, hái yǒude juédìng xiān zhǎo gōngzuò."}, {"s": "", "zh": "我认为只有想清楚自己真正喜欢什么，才能做出最合适的选择。", "id": "Menurutku, hanya jika sudah benar-benar tahu apa yang sungguh kita sukai, barulah kita bisa membuat pilihan yang paling tepat.", "tr": "17-7", "py": "Wǒ rènwéi zhǐyǒu xiǎng qīngchu zìjǐ zhēnzhèng xǐhuan shénme, cái néng zuò chū zuì héshì de xuǎnzé."}, {"s": "", "zh": "对我来说，想清楚\"真正喜欢什么\"是个难题。", "id": "Bagiku, memikirkan dengan jelas \"apa yang sungguh kusukai\" adalah masalah yang sulit.", "tr": "17-7", "py": "Duì wǒ lái shuō, xiǎng qīngchu\" zhēnzhèng xǐhuan shénme\" shì gè nántí."}], "teks": [{"tr": "17-1", "nama": "课文1 · Takut bertemu Bu Li"}, {"tr": "17-3", "nama": "课文2 · Bertemu Chen Tianzhong di perpustakaan"}, {"tr": "17-5", "nama": "课文3 · Rencana kuliah di luar negeri"}, {"tr": "17-7", "nama": "课文4 · Catatan harian Chen Tianzhong"}]}, "18": {"judul": "我学会了包饺子", "arti": "Aku sudah bisa membuat jiaozi", "kata": [{"h": "怎样", "p": "zěnyàng", "k": "pron.", "a": "bagaimana"}, {"h": "过节", "p": "guòjié", "k": "v.", "a": "merayakan hari raya"}, {"h": "节", "p": "jié", "k": "n.", "a": "hari raya, festival"}, {"h": "节日", "p": "jiérì", "k": "n.", "a": "hari raya, hari besar"}, {"h": "联欢", "p": "liánhuān", "k": "v.", "a": "berkumpul bersuka ria"}, {"h": "大概", "p": "dàgài", "k": "adv./adj.", "a": "kira-kira, mungkin; garis besar"}, {"h": "春节", "p": "Chūnjié", "k": "专名", "a": "Festival Musim Semi (Tahun Baru Imlek)"}, {"h": "阿姨", "p": "āyí", "k": "n.", "a": "bibi, tante"}, {"h": "叔叔", "p": "shūshu", "k": "n.", "a": "paman, om"}, {"h": "收", "p": "shōu", "k": "v.", "a": "menerima"}, {"h": "总", "p": "zǒng", "k": "adv.", "a": "selalu"}, {"h": "起", "p": "qǐ", "k": "v.", "a": "dipakai setelah kata kerja untuk menunjuk orang/hal yang dibicarakan (说起 = membicarakan)"}, {"h": "见面", "p": "jiànmiàn", "k": "v.", "a": "bertemu"}, {"h": "矿泉水", "p": "kuàngquánshuǐ", "k": "n.", "a": "air mineral"}, {"h": "刚刚", "p": "gānggāng", "k": "adv.", "a": "baru saja"}, {"h": "出发", "p": "chūfā", "k": "v.", "a": "berangkat"}, {"h": "不久", "p": "bùjiǔ", "k": "adj.", "a": "tidak lama, sebentar"}, {"h": "发生", "p": "fāshēng", "k": "v.", "a": "terjadi"}, {"h": "刚", "p": "gāng", "k": "adv.", "a": "baru (saja)"}, {"h": "只要", "p": "zhǐyào", "k": "conj.", "a": "asalkan, asal saja"}, {"h": "学期", "p": "xuéqī", "k": "n.", "a": "semester"}, {"h": "毕业", "p": "bìyè", "k": "v.", "a": "lulus, tamat"}, {"h": "出生", "p": "chūshēng", "k": "v.", "a": "lahir"}, {"h": "过去", "p": "guòqù", "k": "n.", "a": "masa lalu"}, {"h": "懂得", "p": "dǒngde", "k": "v.", "a": "mengerti, memahami"}, {"h": "坚持", "p": "jiānchí", "k": "v.", "a": "bertekun, tetap berpegang pada"}, {"h": "完成", "p": "wánchéng", "k": "v.", "a": "menyelesaikan, mencapai"}, {"h": "目标", "p": "mùbiāo", "k": "n.", "a": "tujuan, sasaran"}, {"h": "发展", "p": "fāzhǎn", "k": "v.", "a": "berkembang"}], "dialog": [{"s": "白家月", "zh": "我要在中国过年，真开心。", "id": "Aku akan merayakan Tahun Baru di Tiongkok, senang sekali.", "tr": "18-1", "py": "Wǒ yào zài Zhōngguó guònián, zhēn kāixīn."}, {"s": "李文", "zh": "第一次请外国朋友来家里过春节，我也很高兴。", "id": "Pertama kali mengundang teman dari luar negeri merayakan Imlek di rumah, aku juga senang sekali.", "tr": "18-1", "py": "Dìyī cì qǐng wàiguó péngyou lái jiā li guò chūnjié, wǒ yě hěn gāoxìng."}, {"s": "白家月", "zh": "你们怎样过节？", "id": "Bagaimana kalian merayakannya?", "tr": "18-1", "py": "Nǐmen zěnyàng guòjié?"}, {"s": "李文", "zh": "春节是中国最重要的节日，我们一般会回家，跟家人一起过。", "id": "Imlek adalah hari raya terpenting di Tiongkok, biasanya kami pulang ke rumah dan merayakannya bersama keluarga.", "tr": "18-1", "py": "Chūnjié shì Zhōngguó zuì zhòngyào de jiérì, wǒmen yìbān huì huí jiā, gēn jiārén yìqǐ guò."}, {"s": "白家月", "zh": "那你跟家人会一起做什么？", "id": "Lalu apa yang kamu lakukan bersama keluarga?", "tr": "18-1", "py": "Nà nǐ gēn jiārén huì yìqǐ zuò shénme?"}, {"s": "李文", "zh": "我们家会一边包饺子，一边看春节联欢晚会，一直到十二点以后才睡觉。", "id": "Keluargaku membuat jiaozi sambil menonton Acara Gala Festival Musim Semi, baru tidur setelah lewat jam dua belas.", "tr": "18-1", "py": "Wǒmen jiā huì yìbiān bāo jiǎozi, yìbiān kàn chūnjié liánhuān wǎnhuì, yìzhí dào shí'èr diǎn yǐhòu cái shuìjiào."}, {"s": "白家月", "zh": "听起来很有意思。春节放几天假？", "id": "Kedengarannya seru. Libur Imlek berapa hari?", "tr": "18-1", "py": "Tīng qǐlái hěn yǒuyìsi. Chūnjié fàng jǐ tiān jiǎ?"}, {"s": "李文", "zh": "大概七八天。", "id": "Kira-kira tujuh atau delapan hari.", "tr": "18-1", "py": "Dàgài qībā tiān."}, {"s": "白家月", "zh": "张阿姨，李叔叔。过年好！这是我准备的礼物，请收下。", "id": "Tante Zhang, Om Li. Selamat Tahun Baru! Ini hadiah yang saya siapkan, mohon diterima.", "tr": "18-3", "py": "Zhāng āyí, Lǐ shūshu. Guònián hǎo! Zhè shì wǒ zhǔnbèi de lǐwù, qǐng shōu xià."}, {"s": "李叔叔", "zh": "谢谢家月，你太客气了！", "id": "Terima kasih, Jiayue, kamu repot-repot sekali!", "tr": "18-3", "py": "Xièxie Jiāyuè, nǐ tài kèqi le!"}, {"s": "张阿姨", "zh": "总听小文说起你，今天终于有机会见面了。", "id": "Kami selalu mendengar Xiaowen bercerita tentangmu, hari ini akhirnya ada kesempatan bertemu.", "tr": "18-3", "py": "Zǒng tīng xiǎo wén shuō qǐ nǐ, jīntiān zhōngyú yǒu jīhuì jiànmiàn le."}, {"s": "白家月", "zh": "谢谢您和叔叔请我来家里做客。", "id": "Terima kasih Tante dan Om sudah mengundang saya bertamu ke rumah.", "tr": "18-3", "py": "Xièxie nín hé shūshu qǐng wǒ lái jiā li zuòkè."}, {"s": "李叔叔", "zh": "桌子上有饮料，还有矿泉水，你想喝什么就自己拿。", "id": "Di meja ada minuman dan air mineral, mau minum apa ambil saja sendiri.", "tr": "18-3", "py": "Zhuōzi shàng yǒu yǐnliào, hái yǒu kuàngquánshuǐ, nǐ xiǎng hē shénme jiù zìjǐ ná."}, {"s": "张阿姨", "zh": "你先坐着看会儿电视，饺子很快就包好了。", "id": "Kamu duduk dulu nonton TV sebentar, jiaozinya sebentar lagi selesai dibuat.", "tr": "18-3", "py": "Nǐ xiān zuò zhe kàn huìr diànshì, jiǎozi hěn kuài jiù bāo hǎo le."}, {"s": "白家月", "zh": "我刚刚看视频学会了包饺子，我跟你们一起包吧。", "id": "Saya baru saja belajar membuat jiaozi dari video, biar saya ikut membuatnya bersama kalian.", "tr": "18-3", "py": "Wǒ gānggāng kàn shìpín xué huì le bāo jiǎozi, wǒ gēn nǐmen yìqǐ bāo ba."}, {"s": "白家月", "zh": "这张照片是李文出国前照的吗？", "id": "Foto ini diambil sebelum Li Wen ke luar negeri?", "tr": "18-5", "py": "Zhè Zhāng zhàopiàn shì Lǐ Wén chūguó qián zhào de ma?"}, {"s": "张阿姨", "zh": "对，这是他从北京出发时，我们全家在机场照的。", "id": "Betul, ini foto seluruh keluarga kami di bandara waktu dia berangkat dari Beijing.", "tr": "18-5", "py": "Duì, zhè shì tā cóng Běijīng chūfā shí, wǒmen quán jiā zài jīchǎng zhào de."}, {"s": "白家月", "zh": "那是三四年前吧？", "id": "Itu sekitar tiga atau empat tahun yang lalu, ya?", "tr": "18-5", "py": "Nà shì sānsì nián qián ba?"}, {"s": "张阿姨", "zh": "是啊，时间过得真快，好像是不久前发生的一样。", "id": "Iya, waktu berlalu cepat sekali, rasanya seperti baru terjadi belum lama ini.", "tr": "18-5", "py": "Shì a, shíjiān guò de zhēn kuài, hǎoxiàng shì bùjiǔ qián fāshēng de yíyàng."}, {"s": "白家月", "zh": "您一定特别想李文吧？", "id": "Tante pasti sangat merindukan Li Wen, ya?", "tr": "18-5", "py": "Nín yídìng tèbié xiǎng Lǐ Wén ba?"}, {"s": "张阿姨", "zh": "他刚离开家时，我很不习惯，只要几天不跟他视频，就很想他。", "id": "Waktu dia baru meninggalkan rumah, saya sangat tidak terbiasa; asal beberapa hari tidak video call dengannya, saya langsung rindu sekali.", "tr": "18-5", "py": "Tā gāng líkāi jiā shí, wǒ hěn bù xíguàn, zhǐyào jǐ tiān bù gēn tā shìpín, jiù hěn xiǎng tā."}, {"s": "白家月", "zh": "还有最后一个学期就要毕业了，他很快就会回来了。", "id": "Tinggal satu semester terakhir dia sudah lulus, sebentar lagi dia akan pulang.", "tr": "18-5", "py": "Hái yǒu zuìhòu yí gè xuéqī jiù yào bìyè le, tā hěn kuài jiù huì huílái le."}, {"s": "", "zh": "这次来中国，我最高兴的是认识了李文的父母。", "id": "Datang ke Tiongkok kali ini, yang paling membuatku senang adalah berkenalan dengan orang tua Li Wen.", "tr": "18-7", "py": "Zhè cì lái Zhōngguó, wǒ zuì gāoxìng de shì rènshi le Lǐ Wén de fù mǔ."}, {"s": "", "zh": "他们给我看了李文出生时的照片，还给我讲了很多他过去的故事。", "id": "Mereka menunjukkan foto Li Wen waktu lahir, dan juga menceritakan banyak kisah masa lalunya.", "tr": "18-7", "py": "Tāmen gěi wǒ kàn le Lǐ Wén chūshēng shí de zhàopiàn, huán gěi wǒ jiǎng le hěn duō tā guòqù de gùshi."}, {"s": "", "zh": "李文高中的时候想学医，从那时起就努力学习。", "id": "Waktu SMA Li Wen ingin belajar kedokteran, sejak saat itu dia belajar dengan giat.", "tr": "18-7", "py": "Lǐ Wén gāozhōng de shíhou xiǎng xué yī, cóng nà shí qǐ jiù nǔlì xuéxí."}, {"s": "", "zh": "高三的时候，因为成绩特别好，他得到了出国留学的机会。", "id": "Di kelas tiga SMA, karena nilainya sangat bagus, dia mendapat kesempatan kuliah di luar negeri.", "tr": "18-7", "py": "Gāo sān de shíhou, yīnwèi chéngjì tèbié hǎo, tā dédào le chūguó liúxué de jīhuì."}, {"s": "", "zh": "在他身上，我懂得了，只要一直坚持，就能完成自己的目标。", "id": "Dari dirinya aku belajar bahwa asalkan terus bertekun, kita pasti bisa mencapai tujuan kita.", "tr": "18-7", "py": "Zài tā shēn shàng, wǒ dǒngde le, zhǐyào yìzhí jiānchí, jiù néng wánchéng zìjǐ de mùbiāo."}, {"s": "", "zh": "我相信，他以后一定会发展得更好。", "id": "Aku percaya, ke depannya dia pasti akan berkembang lebih baik lagi.", "tr": "18-7", "py": "Wǒ xiāngxìn, tā yǐhòu yídìng huì fāzhǎn de gèng hǎo."}], "teks": [{"tr": "18-1", "nama": "课文1 · Merayakan Tahun Baru Imlek di Tiongkok"}, {"tr": "18-3", "nama": "课文2 · Bertamu ke rumah keluarga Li Wen"}, {"tr": "18-5", "nama": "课文3 · Melihat foto lama"}, {"tr": "18-7", "nama": "课文4 · Catatan harian Bai Jiayue"}]}}, "kata": [{"h": "阿姨", "p": "āyí", "a": "bibi; tante; ibu (sapaan untuk wanita dewasa)", "ex": "阿姨，请问去医院怎么走？", "exi": "Bu, permisi, ke rumah sakit lewat mana?", "exp": "Āyí, qǐngwèn qù yīyuàn zěnme zǒu?"}, {"h": "矮", "p": "ǎi", "a": "pendek (tinggi badan); rendah", "ex": "我比哥哥矮一点儿。", "exi": "Saya sedikit lebih pendek daripada kakak laki-laki saya.", "exp": "Wǒ bǐ gēge ǎi yìdiǎnr."}, {"h": "爱人", "p": "àiren", "a": "suami; istri; pasangan", "ex": "我爱人在一家公司工作。", "exi": "Istri saya bekerja di sebuah perusahaan.", "exp": "Wǒ àirén zài yì jiā gōngsī gōngzuò."}, {"h": "安静", "p": "ānjìng", "a": "tenang; sepi", "ex": "图书馆里很安静。", "exi": "Di dalam perpustakaan sangat tenang.", "exp": "Túshūguǎn lǐ hěn ānjìng."}, {"h": "安全", "p": "ānquán", "a": "aman", "ex": "晚上一个人回家不太安全。", "exi": "Pulang sendirian malam-malam kurang aman.", "exp": "Wǎnshang yí gè rén huí jiā bú tài ānquán."}, {"h": "把", "p": "bǎ", "a": "penggolong benda bergagang; kata depan 把 (memajukan objek)", "ex": "请把门关上。", "exi": "Tolong tutup pintunya.", "exp": "Qǐng bǎ mén guān shàng."}, {"h": "搬", "p": "bān", "a": "mengangkat; memindahkan", "ex": "你能帮我搬一下这张桌子吗？", "exi": "Bisakah kamu bantu saya memindahkan meja ini?", "exp": "Nǐ néng bāng wǒ bān yíxià zhè Zhāng zhuōzi ma?"}, {"h": "班级", "p": "bānjí", "a": "kelas (kelompok murid)", "ex": "我们班级一共有三十个学生。", "exi": "Kelas kami seluruhnya ada tiga puluh murid.", "exp": "Wǒmen bānjí yígòng yǒu sānshí gè xuéshēng."}, {"h": "搬家", "p": "bānjiā", "a": "pindah rumah", "ex": "我们下个月要搬家了。", "exi": "Bulan depan kami akan pindah rumah.", "exp": "Wǒmen xià gè yuè yào bānjiā le."}, {"h": "办", "p": "bàn", "a": "mengurus; mengerjakan", "ex": "这件事你去办吧。", "exi": "Urusan ini kamu yang urus saja.", "exp": "Zhè jiàn shì nǐ qù bàn ba."}, {"h": "办法", "p": "bànfǎ", "a": "cara; jalan keluar", "ex": "别着急，我们一起想办法。", "exi": "Jangan cemas, kita cari jalan keluar bersama.", "exp": "Bié zháojí, wǒmen yìqǐ xiǎng bànfǎ."}, {"h": "办公室", "p": "bàngōngshì", "a": "kantor; ruang kerja", "ex": "王老师在办公室里。", "exi" <script>(function(){

/* ---------- suara (Web Speech, hanya jika ada suara Mandarin) ---------- */
var zhVoice=null;

  document.body.classList.toggle('tts',!!zhVoice);
}

function say(t){if(!zhVoice)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.voice=zhVoice;u.lang=zhVoice.lang;u.rate=0.8;speechSynthesis.speak(u);}

function startQuiz(kind,arg){
  var list=[],judul='Latihan';
  if(kind==='topik'){var t=byId[arg];if(!t)return home();list=shuffle(t.latihan);judul=t.judul;}
  else if(kind==='pel'){var p=+arg;topicsOf(p).forEach(function(t){list=list.concat(t.latihan);});list=shuffle(list);judul='Uji '+pelName(p);}
  else if(kind==='mix'){var all=[];T.forEach(function(t){all=all.concat(t.latihan);});list=shuffle(all).slice(0,20);judul='Latihan campuran';}
  else if(kind==='salah'){list=shuffle(Object.keys(st.salah).map(function(k){return st.salah[k];}));judul='Ulangi soal yang salah';}
  else if(kind==='ulang'&&quiz){list=shuffle(quiz.wrong);judul=quiz.judul;}
  else if(kind.charAt(0)==='r'){var rq=readQuiz(kind,arg);list=rq.list;judul=rq.judul;}
  if(!list.length){main.innerHTML='<div class="empty">Belum ada soal di sini.<\/div>';return;}
  quiz={list:list,i:0,score:0,wrong:[],judul:judul,back:kind==='topik'?'#t/'+arg:(kind==='rp'||kind==='rd')?'#b/p/'+arg:kind==='rs'?'#b/s/'+arg:kind==='rmix'?'#b':''};

}
function hdr(){var q=quiz;return '<div class="qh"><span>Soal '+(q.i+1)+' / '+q.list.length+'<\/span><span>Benar: '+q.score+'<\/span><\/div><div class="bar"><i style="width:'+(q.i/q.list.length*100)+'%"><\/i><\/div>';}
function srcLink(q){var t=byId[q.tid];if(!t)return q.lbl?'<div class="why">'+esc(q.lbl)+'<\/div>':'';return '<div class="why">Topik: <a href="#t/'+t.id+'">'+esc(t.judul)+'<\/a><\/div>';}
function mark(q,ok){if(ok){quiz.score++;delete st.salah[q.k];}else{quiz.wrong.push(q);st.salah[q.k]=q;}}
function nextBtn(){return '<button class="btn" id="nx" style="margin-top:12px">'+(quiz.i+1<quiz.list.length?'Soal berikutnya':'Lihat hasil')+'<\/button>';}
function bindNext(){var b=document.getElementById('nx');b.onclick=function(){quiz.i++;if(quiz.i<quiz.list.length)renderQ();else result();};b.focus();}
function renderQ(){
  var q=quiz.list[quiz.i];ttl.textContent=quiz.judul;bk.hidden=false;

function qSU(q){

function qBS(q){

var BC=D.baca||{pel:{},kata:[]}, SETN=25;
var POOL=(function(){var m={},a=[];function add(w){if(w&&w.h&&w.p&&w.a&&!m[w.h]){m[w.h]=1;a.push(w);}}
  BC.kata.forEach(add);Object.keys(BC.pel).forEach(function(p){BC.pel[p].kata.forEach(add);});return a;})();
var SENT=(function(){var a=[];Object.keys(BC.pel).forEach(function(p){BC.pel[p].dialog.forEach(function(d){if(d.id)a.push({zh:d.zh,py:d.py,id:d.id,lbl:'Dialog pelajaran '+p});});});
  BC.kata.forEach(function(w){if(w.ex&&w.exi)a.push({zh:w.ex,py:w.exp,id:w.exi,lbl:'Contoh kata '+w.h});});return a;})();
function nSet(){return Math.ceil(BC.kata.length/SETN);}
function setWords(n){return BC.kata.slice(n*SETN,(n+1)*SETN);}
function revealCSS(){return '';}
var TONES={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù',ü:'ǖǘǚǜ'};
function toneVariants(p){
  var out=[];var chars=p.split('');
  chars.forEach(function(c,i){Object.keys(TONES).forEach(function(v){var k=TONES[v].indexOf(c);if(k>=0){for(var t=0;t<4;t++){if(t!==k){var cc=chars.slice();cc[i]=TONES[v][t];out.push(cc.join(''));}}}});});
  return shuffle(out);
}
function syl(p){return (p.match(/[aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]+/gi)||[]).length;}
function pick(arr,n,not,pref){var a=shuffle(arr.filter(function(x){return not.indexOf(x)<0;}));if(pref){var b=a.filter(pref),c=a.filter(function(x){return !pref(x);});a=b.concat(c);}var out=[];a.forEach(function(x){if(out.length<n&&out.indexOf(x)<0)out.push(x);});return out;}
function mk(q,o,ans,extra){var opts=[ans].concat(o).slice(0,4);var r={t:'pg',q:q,o:opts,a:0};for(var k in extra)r[k]=extra[k];return r;}
function wordQ(w,type,lbl){
  var x=w.a, base={x:x,lbl:lbl,k:'r:'+type+':'+w.h};
  if(type==='hp'){var tv=toneVariants(w.p).filter(function(v){return v!==w.p;}).slice(0,2);var oth=pick(POOL.map(function(z){return z.p;}),3,[w.p].concat(tv),function(p){return syl(p)===syl(w.p);});
    return mk(w.h,tv.concat(oth).slice(0,3),w.p,Object.assign(base,{qt:'Bagaimana cara membaca kata ini?',zq:true,f:w.h,fp:w.p}));}
  if(type==='ha'){return mk(w.h,pick(POOL.map(function(z){return z.a;}),3,[w.a]),w.a,Object.assign(base,{qt:'Apa arti kata ini?',zq:true,f:w.h,fp:w.p}));}
  if(type==='ah'){return mk(w.a,pick(POOL.map(function(z){return z.h;}),3,[w.h],function(h){return h.length===w.h.length;}),w.h,Object.assign(base,{qt:'Pilih hanzi untuk arti ini',zq:false,f:w.h,fp:w.p}));}
  return mk(w.p,pick(POOL.map(function(z){return z.h;}),3,[w.h],function(h){return h.length===w.h.length;}),w.h,Object.assign(base,{qt:'Pilih hanzi untuk pinyin ini',zq:false,f:w.h,fp:w.p}));
}
function sentQ(s,lbl){
  return mk(s.zh,pick(SENT.map(function(z){return z.id;}),3,[s.id]),s.id,{qt:'Baca kalimat ini. Apa artinya?',zq:true,f:s.zh,fp:s.py,x:s.id,lbl:lbl||s.lbl,k:'r:s:'+s.zh});
}
function wordQs(ws,lbl,n){var T4=['hp','ha','ah','ph'],a=[];ws.forEach(function(w){T4.forEach(function(t){a.push(wordQ(w,t,lbl));});});a=shuffle(a);return n?a.slice(0,n):a;}
function readQuiz(kind,arg){
  if(kind==='rp'){var P=BC.pel[arg];return {list:wordQs(P.kata.filter(function(w){return w.p&&w.a;}),'Kosakata pelajaran '+arg,30),judul:'Kosakata pelajaran '+arg};}

  if(kind==='rs'){var n=+arg;return {list:wordQs(setWords(n),'Kata resmi set '+(n+1),40),judul:'Kata resmi · set '+(n+1)};}

  var mix=shuffle(wordQs(shuffle(POOL).slice(0,15),'Kuis acak')).slice(0,15).concat(shuffle(SENT).slice(0,5).map(function(s){return sentQ(s);}));

  if(P.kata.length)h+='<div class="card"><h3>Kosakata ('+P.kata.length+')<\/h3>'+wordCards(P.kata)+'<button class="btn" style="margin-top:12px" data-go="#q/rp/'+p+'">Kuis kosakata pelajaran ini<\/button><\/div>';
  if(P.dialog.length){h+='<div class="card"><h3>Dialog buku<\/h3>';var lt='';
    P.dialog.forEach(function(d){if(d.tr&&d.tr!==lt){lt=d.tr;h+='<div class="trk"><a href="'+audUrl(d.tr)+'">🎧 '+d.tr+'<\/a><\/div>';}
      h+='<div class="ex rv"><div class="b">'+(d.s?'<span class="spk">'+esc(d.s)+'：<\/span>':'')+'<span class="zh">'+esc(d.zh)+'<\/span><div class="py">'+esc(d.py)+'<\/div><div class="id">'+esc(d.id)+'<\/div><\/div>'+sayBtn(d.zh)+'<\/div>';});
    h+='<button class="btn" style="margin-top:12px" data-go="#q/rd/'+p+'">Kuis membaca dialog<\/button><\/div>';}
  main.innerHTML=h;window.scrollTo(0,0);
}
function bacaSet(n){
  var ws=setWords(n);if(!ws.length)return bacaHome();
  ttl.textContent='Kata resmi · set '+(n+1);bk.hidden=false;
  var h='<div class="card"><span class="kode">Daftar resmi HSK '+D.level+' · set '+(n+1)+' dari '+nSet()+'<\/span><p class="aud">Ketuk kata atau kalimat untuk melihat pinyin dan artinya.<\/p>'+revealBar()+'<\/div>';
  h+='<div class="card"><h3>Kata<\/h3>'+wordCards(ws)+'<button class="btn" style="margin-top:12px" data-go="#q/rs/'+n+'">Kuis kata set ini<\/button><\/div>';
  var ex=ws.filter(function(w){return w.ex;});
  if(ex.length){h+='<div class="card"><h3>Kalimat contoh<\/h3>';ex.forEach(function(w){h+='<div class="ex rv"><div class="b"><span class="zh">'+esc(w.ex)+'<\/span><div class="py">'+esc(w.exp)+'<\/div><div class="id">'+esc(w.exi)+'<\/div><\/div>'+sayBtn(w.ex)+'<\/div>';});
    h+='<button class="btn" style="margin-top:12px" data-go="#q/rss/'+n+'">Kuis membaca kalimat<\/button><\/div>';}
  var nav='<div class="nav2">'+(n>0?'<button class="btn alt" data-go="#b/s/'+(n-1)+'">‹ Set '+n+'<\/button>':'')+(n+1<nSet()?'<button class="btn alt" data-go="#b/s/'+(n+1)+'">Set '+(n+2)+' ›<\/button>':'')+'<\/div>';
  main.innerHTML=h+nav;window.scrollTo(0,0);
}
main.addEventListener('click',function(e){
  var r=e.target.closest('[data-rv]');if(r){var on=r.getAttribute('data-rv')==='1';main.querySelectorAll('.rv').forEach(function(x){x.classList.toggle('open',on);});return;}
  if(e.target.closest('[data-say]')||e.target.closest('a'))return;
  var v=e.target.closest('.rv');if(v)v.classList.toggle('open');
});
window.__uji={q:function(){return quiz;},info:function(){return {pel:Object.keys(BC.pel),sets:nSet(),pool:POOL.length,sent:SENT.length};}};

/* ---------- rute ---------- */
function route(){
  var h=location.hash.replace(/^#/,'').split('/');
  if(h[0]==='t')topic(h[1]);
  else if(h[0]==='b'){if(h[1]==='p')bacaPel(h[2]);else if(h[1]==='s')bacaSet(+h[2]);else bacaHome();}
  else if(h[0]==='q')startQuiz(h[1],h[2]);
  else home();
}
window.addEventListener('hashchange',route);
applyTg();route();
})();
