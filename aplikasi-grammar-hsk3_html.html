"5-1.3", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["今天不热得很。", "今天热得很。", "这儿的东西贵得很。", "我觉得爬山累得很。"], "a": 0, "x": "得很 tidak dipakai dengan 不."}, {"k": "5-1.4", "t": "pg", "q": "这里的水果多得很。 = 这里的水果___。", "o": ["非常多", "一点儿多", "不多", "有点儿多"], "a": 0, "x": "得很 = sangat.", "f": "这里的水果多得很。 = 这里的水果非常多。", "fp": "Zhèlǐ de shuǐguǒ duō de hěn. = Zhèlǐ de shuǐguǒ fēicháng duō."}, {"k": "5-1.5", "t": "pg", "q": "Mana yang termasuk pola KS + 得很 (bukan pelengkap keadaan)?", "o": ["她漂亮得很。", "她跑得很快。", "她说得很好。", "她写得很慢。"], "a": 0, "x": "漂亮 adalah kata sifat, diikuti 得很 di akhir."}, {"k": "5-1.6", "t": "pg", "q": "这里的冬天___，你要多穿衣服。", "o": ["冷得很", "很冷得", "冷很得", "得很冷"], "a": 0, "x": "KS + 得很.", "f": "这里的冬天冷得很，你要多穿衣服。", "fp": "Zhèlǐ de dōngtiān lěng de hěn, nǐ yào duō chuān yīfu."}, {"k": "5-1.7", "t": "su", "w": ["现在", "天气", "好", "得", "很"], "s": "现在天气好得很。", "alt": ["天气现在好得很。"], "p": "Xiànzài tiānqì hǎo de hěn.", "x": "Sekarang cuacanya bagus sekali."}, {"k": "5-1.8", "t": "su", "w": ["房间", "里面", "热", "得", "很"], "s": "房间里面热得很。", "alt": [], "p": "Fángjiān lǐmiàn rè de hěn.", "x": "Di dalam kamar panas sekali."}, {"k": "5-1.9", "t": "su", "w": ["我", "觉得", "爬山", "累", "得", "很"], "s": "我觉得爬山累得很。", "alt": [], "p": "Wǒ juéde pá shān lèi de hěn.", "x": "Menurutku naik gunung capek sekali."}, {"k": "5-1.10", "t": "su", "w": ["这里", "的", "东西", "贵", "得", "很"], "s": "这里的东西贵得很。", "alt": [], "p": "Zhèlǐ de dōngxi guì de hěn.", "x": "Barang di sini mahal sekali."}, {"k": "5-1.11", "t": "su", "w": ["他", "最近", "忙", "得", "很"], "s": "他最近忙得很。", "alt": [], "p": "Tā zuìjìn máng de hěn.", "x": "Akhir-akhir ini dia sibuk sekali."}, {"k": "5-1.12", "t": "bs", "s": "她难过得很。", "sp": "Tā nánguò de hěn.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "5-1.13", "t": "bs", "s": "这个公园很漂亮得很。", "sp": "Zhège gōngyuán hěn piàoliang de hěn.", "n": "", "ok": false, "b": "这个公园漂亮得很。", "bp": "Zhège gōngyuán piàoliang de hěn.", "x": "Tanpa 很 di depan."}, {"k": "5-1.14", "t": "bs", "s": "超市里的水果多得很。", "sp": "Chāoshì lǐ de shuǐguǒ duō de hěn.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "5-1.15", "t": "bs", "s": "昨天冷得很了。", "sp": "Zuótiān lěng de hěn le.", "n": "", "ok": false, "b": "昨天冷得很。", "bp": "Zuótiān lěng de hěn.", "x": "Tidak memakai 了."}]}, {"id": "5-2", "pel": 5, "judul": "Pengulangan kata ukuran (量词重叠): 个个、张张、天天 = setiap …", "kode": "量词重叠", "rumus": ["(这些 + KB) + KU KU + 都 + …", "KU KU = 每 + KU (+ KB)", "天天 / 年年 / 人人 + 都 + …"], "jelas": ["Banyak kata ukuran dalam bahasa Mandarin bisa diulang (个个, 张张, 件件, 本本, 天天, 年年) untuk menekankan bahwa SETIAP anggota dalam suatu kelompok punya ciri yang sama. Artinya \"setiap …, semua tanpa kecuali\".", "Kata ukuran ulang hampir selalu diikuti 都: 这些苹果个个都很大 (= 每个苹果都很大). Biasanya kelompoknya disebutkan dulu (这些照片, 这些苹果), lalu kata ukuran ulang menjadi subjek kecil.", "Beberapa kata seperti 天, 年, 人, 家 juga bisa diulang dengan arti \"setiap\": 天天 = setiap hari, 年年 = setiap tahun, 人人 = setiap orang, 家家 = setiap keluarga.", "Kata ukuran ulang berada sebelum kata kerja (sebagai subjek atau keterangan), TIDAK sebagai objek. 我喜欢件件衣服 salah; katakan 这些衣服我件件都喜欢.", "Bagi pelajar Indonesia, pengulangan kata dalam bahasa Indonesia sering berarti jamak (\"buku-buku\"). Dalam bahasa Mandarin, kata ukuran ulang BUKAN sekadar jamak, melainkan \"setiap/semua tanpa kecuali\", dan kata bendanya sendiri tidak diulang (书书 salah).", "Pola ini biasanya untuk pernyataan positif atau umum. Untuk ingkar, pakai 都不: 这些菜个个都不辣 (setiap masakan tidak pedas) — boleh, tetapi lebih jarang."], "poin": ["KU KU = setiap ….", "Hampir selalu diikuti 都.", "Posisi: sebelum kata kerja, bukan objek.", "Kata benda tidak diulang; ulangi kata ukurannya."], "contoh": [{"zh": "这些照片张张都非常好看。", "py": "Zhèxiē zhàopiàn Zhāng Zhāng dōu fēicháng hǎokàn.", "id": "Foto-foto ini setiap lembarnya sangat bagus.", "b": true, "tr": null}, {"zh": "这些苹果个个都很大。", "py": "Zhèxiē píngguǒ gè gè dōu hěn dà.", "id": "Apel-apel ini setiap buahnya besar.", "b": true, "tr": null}, {"zh": "我想出去拍照，但是天天下雨。", "py": "Wǒ xiǎng chūqù pāizhào, dànshì tiān tiān xià yǔ.", "id": "Aku ingin keluar memotret, tetapi setiap hari hujan.", "b": true, "tr": null}, {"zh": "我看到了你给我照的照片，张张都很漂亮。", "py": "Wǒ kàn dào le nǐ gěi wǒ zhào de zhàopiàn, Zhāng Zhāng dōu hěn piàoliang.", "id": "Aku sudah melihat foto yang kamu ambil untukku, setiap lembarnya cantik.", "b": true, "tr": null}, {"zh": "这家饭馆的菜，我个个都喜欢。", "py": "Zhè jiā fànguǎn de cài, wǒ gè gè dōu xǐhuan.", "id": "Masakan restoran ini, setiap jenisnya aku suka.", "b": false, "tr": null}, {"zh": "这些衣服件件都很漂亮。", "py": "Zhèxiē yīfu jiàn jiàn dōu hěn piàoliang.", "id": "Baju-baju ini setiap potongnya cantik.", "b": false, "tr": null}, {"zh": "他年年都回北京过年。", "py": "Tā nián nián dōu huí Běijīng guònián.", "id": "Setiap tahun dia pulang ke Beijing untuk merayakan tahun baru.", "b": false, "tr": null}, {"zh": "我们班的同学个个都很努力。", "py": "Wǒmen bān de tóngxué gè gè dōu hěn nǔlì.", "id": "Teman-teman di kelas kami setiap orangnya rajin.", "b": false, "tr": null}, {"zh": "这几本书本本都很有意思。", "py": "Zhè jǐ běn shū běn běn dōu hěn yǒuyìsi.", "id": "Beberapa buku ini setiap bukunya menarik.", "b": false, "tr": null}, {"zh": "他天天早上跑步。", "py": "Tā tiān tiān zǎoshang pǎobù.", "id": "Setiap pagi dia lari.", "b": false, "tr": null}], "salah": [{"s": "这些书书都很好。", "sp": "Zhèxiē shū shū dōu hěn hǎo.", "n": "", "b": "这些书本本都很好。", "bp": "Zhèxiē shū běn běn dōu hěn hǎo.", "a": "Yang diulang kata ukurannya, bukan kata benda."}, {"s": "这些苹果个个很大。", "sp": "Zhèxiē píngguǒ gè gè hěn dà.", "n": "", "b": "这些苹果个个都很大。", "bp": "Zhèxiē píngguǒ gè gè dōu hěn dà.", "a": "Kata ukuran ulang biasanya diikuti 都."}, {"s": "我喜欢件件衣服。", "sp": "Wǒ xǐhuan jiàn jiàn yīfu.", "n": "", "b": "这些衣服我件件都喜欢。", "bp": "Zhèxiē yīfu wǒ jiàn jiàn dōu xǐhuan.", "a": "Kata ukuran ulang tidak dipakai sebagai objek."}], "latihan": [{"k": "5-2.0", "t": "pg", "q": "这些照片___都很好看。", "o": ["张张", "个个", "本本", "件件"], "a": 0, "x": "Kata ukuran foto: 张.", "f": "这些照片张张都很好看。", "fp": "Zhèxiē zhàopiàn Zhāng Zhāng dōu hěn hǎokàn."}, {"k": "5-2.1", "t": "pg", "q": "这些衣服___都很便宜。", "o": ["件件", "张张", "本本", "天天"], "a": 0, "x": "Kata ukuran baju: 件.", "f": "这些衣服件件都很便宜。", "fp": "Zhèxiē yīfu jiàn jiàn dōu hěn piányi."}, {"k": "5-2.2", "t": "pg", "q": "这个月___下雨，我不能出去玩。", "o": ["天天", "个个", "张张", "件件"], "a": 0, "x": "天天 = setiap hari.", "f": "这个月天天下雨，我不能出去玩。", "fp": "Zhège yuè tiān tiān xià yǔ, wǒ bù néng chūqù wán."}, {"k": "5-2.3", "t": "pg", "q": "这些苹果个个___很甜。", "o": ["都", "也", "还", "就"], "a": 0, "x": "KU KU + 都.", "f": "这些苹果个个都很甜。", "fp": "Zhèxiē píngguǒ gè gè dōu hěn tián."}, {"k": "5-2.4", "t": "pg", "q": "\"Setiap orang di kelas kami tinggi.\" =", "o": ["我们班的同学个个都很高。", "我们班的同学同学都很高。", "我们班的同学都个个很高。", "我们班的个个同学很高。"], "a": 0, "x": "Kelompok + 个个 + 都."}, {"k": "5-2.5", "t": "pg", "q": "这些书___都很有意思。", "o": ["本本", "张张", "件件", "天天"], "a": 0, "x": "Kata ukuran buku: 本.", "f": "这些书本本都很有意思。", "fp": "Zhèxiē shū běn běn dōu hěn yǒuyìsi."}, {"k": "5-2.6", "t": "pg", "q": "这些苹果个个都很大。 = …", "o": ["每个苹果都很大。", "有的苹果很大。", "一个苹果很大。", "苹果很多。"], "a": 0, "x": "个个 = 每个.", "qp": "Zhèxiē píngguǒ gè gè dōu hěn dà. =…"}, {"k": "5-2.7", "t": "su", "w": ["这些", "苹果", "个个", "都", "很", "大"], "s": "这些苹果个个都很大。", "alt": [], "p": "Zhèxiē píngguǒ gè gè dōu hěn dà.", "x": "Apel-apel ini setiap buahnya besar."}, {"k": "5-2.8", "t": "su", "w": ["这些", "照片", "张张", "都", "非常", "好看"], "s": "这些照片张张都非常好看。", "alt": [], "p": "Zhèxiē zhàopiàn Zhāng Zhāng dōu fēicháng hǎokàn.", "x": "Foto-foto ini setiap lembarnya sangat bagus."}, {"k": "5-2.9", "t": "su", "w": ["他", "天天", "都", "去", "图书馆"], "s": "他天天都去图书馆。", "alt": [], "p": "Tā tiān tiān dōu qù túshūguǎn.", "x": "Setiap hari dia pergi ke perpustakaan."}, {"k": "5-2.10", "t": "su", "w": ["这些", "衣服", "件件", "都", "很", "漂亮"], "s": "这些衣服件件都很漂亮。", "alt": [], "p": "Zhèxiē yīfu jiàn jiàn dōu hěn piàoliang.", "x": "Baju-baju ini setiap potongnya cantik."}, {"k": "5-2.11", "t": "su", "w": ["我们", "班", "的", "同学", "个个", "都", "很", "努力"], "s": "我们班的同学个个都很努力。", "alt": [], "p": "Wǒmen bān de tóngxué gè gè dōu hěn nǔlì.", "x": "Teman sekelas kami setiap orangnya rajin."}, {"k": "5-2.12", "t": "bs", "s": "这些照片张张都很漂亮。", "sp": "Zhèxiē zhàopiàn Zhāng Zhāng dōu hěn piàoliang.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "5-2.13", "t": "bs", "s": "这些书书都很好。", "sp": "Zhèxiē shū shū dōu hěn hǎo.", "n": "", "ok": false, "b": "这些书本本都很好。", "bp": "Zhèxiē shū běn běn dōu hěn hǎo.", "x": "Ulangi kata ukuran (本), bukan kata benda."}, {"k": "5-2.14", "t": "bs", "s": "他年年都回北京过年。", "sp": "Tā nián nián dōu huí Běijīng guònián.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "5-2.15", "t": "bs", "s": "我喜欢个个菜。", "sp": "Wǒ xǐhuan gè gè cài.", "n": "", "ok": false, "b": "这些菜我个个都喜欢。", "bp": "Zhèxiē cài wǒ gè gè dōu xǐhuan.", "x": "Kata ukuran ulang tidak menjadi objek; letakkan sebelum kata kerja dengan 都."}]}, {"id": "5-3", "pel": 5, "judul": "Kalimat keberadaan (3): Tempat + KK + pelengkap + Bil + orang/benda (muncul/hilang)", "kode": "存现句（3）", "rumus": ["Tempat + KK + 过来/过去/来/去… + 数量 + orang/benda", "Tempat + KK + 了 + 数量 + orang/benda", "后边走过去两个人 / 前面开过来很多车"], "jelas": ["Kalimat keberadaan (存现句) jenis ini dipakai untuk menceritakan bahwa di suatu tempat MUNCUL atau PERGI/HILANG orang atau benda. Susunannya terbalik dari kalimat biasa: tempat di depan, orang/benda di belakang kata kerja.", "Susunan menurut buku: Tempat + KK + pelengkap arah/hasil + (了) + frasa bilangan + orang/benda. Contoh: 后边走过去两个人 = dari belakang lewat dua orang (pergi menjauh). 前面开过来很多车 = dari depan datang banyak mobil.", "Orang/benda yang muncul biasanya BELUM DIKENAL (tidak tentu), sehingga memakai bilangan: 两个人, 一只鸟, 很多车, 几个人. Jika orangnya sudah dikenal, pakai kalimat biasa: 小王从楼上下来了, bukan 楼上下来了小王.", "Kata kerja yang sering dipakai: 走, 跑, 开, 飞, 来, 下, 进, 出 + pelengkap arah (过来, 过去, 下来, 进来, 出去) atau 了. 楼上下来了几个人 = dari lantai atas turun beberapa orang. 树上飞来了几只鸟 = ke pohon terbang datang beberapa burung.", "Di depan tempat TIDAK memakai 在 atau 从: 后边走过去两个人, bukan 在后边走过去两个人. Ini jebakan besar bagi pelajar Indonesia yang terbiasa \"Dari belakang lewat dua orang\" atau \"Di depan datang banyak mobil\".", "Bandingkan dengan 存现句 sebelumnya: 桌子上放着一本书 (sesuatu berada di tempat, dengan 着). Jenis ini menekankan kemunculan/kepergian."], "poin": ["Tempat + KK + arah/hasil + Bil + orang/benda.", "Orang/benda yang muncul tidak tentu (pakai bilangan).", "Tanpa 在/从 di depan tempat.", "Untuk muncul atau pergi/hilang."], "contoh": [{"zh": "后边走过去两个人。", "py": "Hòubian zǒu guòqù liǎng gè rén.", "id": "Dari belakang lewat dua orang.", "b": true, "tr": "05-5"}, {"zh": "挺好的。等一下，后边走过去两个人。", "py": "Tǐng hǎo de. Děng yíxià, hòubian zǒu guòqù liǎng gè rén.", "id": "Bagus. Tunggu sebentar, di belakang ada dua orang lewat.", "b": true, "tr": "05-5"}, {"zh": "前面开过来很多车。", "py": "Qiánmiàn kāi guòlái hěn duō chē.", "id": "Dari depan datang banyak mobil.", "b": true, "tr": null}, {"zh": "楼上下来了几个人。", "py": "Lóu shàng xiàlái le jǐ gè rén.", "id": "Dari lantai atas turun beberapa orang.", "b": true, "tr": null}, {"zh": "树上飞来了几只鸟，我就看它们吧。", "py": "Shù shàng fēi lái le jǐ zhī niǎo, wǒ jiù kàn tāmen ba.", "id": "Ke pohon terbang datang beberapa burung, aku lihat mereka saja.", "b": true, "tr": "05-5"}, {"zh": "教室里走进来一个老师。", "py": "Jiàoshì lǐ zǒu jìnlái yí gè lǎoshī.", "id": "Ke dalam kelas masuk seorang guru.", "b": false, "tr": null}, {"zh": "前边跑过来一只小狗。", "py": "Qiánbian pǎo guòlái yì zhī xiǎogǒu.", "id": "Dari depan berlari datang seekor anjing kecil.", "b": false, "tr": null}, {"zh": "外边进来了两位客人。", "py": "Wàibian jìnlái le liǎng wèi kèrén.", "id": "Dari luar masuk dua orang tamu.", "b": false, "tr": null}, {"zh": "天上飞过去一架飞机。", "py": "Tiān shàng fēi guòqù yí jià fēijī.", "id": "Di langit terbang lewat sebuah pesawat.", "b": false, "tr": null}, {"zh": "我们班新来了一个同学。", "py": "Wǒmen bān xīn lái le yí gè tóngxué.", "id": "Kelas kami kedatangan seorang teman baru.", "b": false, "tr": null}, {"zh": "对面走过来一个穿红衣服的女孩儿。", "py": "Duìmiàn zǒu guòlái yí gè chuān hóng yīfu de nǚháir.", "id": "Dari seberang berjalan datang seorang gadis berbaju merah.", "b": false, "tr": null}], "salah": [{"s": "在后边走过去两个人。", "sp": "Zài hòubian zǒu guòqù liǎng gè rén.", "n": "", "b": "后边走过去两个人。", "bp": "Hòubian zǒu guòqù liǎng gè rén.", "a": "Tempat di awal tanpa 在."}, {"s": "两个人后边走过去。", "sp": "Liǎng gè rén hòubian zǒu guòqù.", "n": "kalimat keberadaan", "b": "后边走过去两个人。", "bp": "Hòubian zǒu guòqù liǎng gè rén.", "a": "Orang/benda yang muncul diletakkan setelah kata kerja."}, {"s": "楼上下来了王老师。", "sp": "Lóu shàng xiàlái le Wáng lǎoshī.", "n": "", "b": "王老师从楼上下来了。", "bp": "Wáng lǎoshī cóng lóu shàng xiàlái le.", "a": "Orang yang sudah dikenal tidak dipakai dalam 存现句; gunakan kalimat biasa."}], "latihan": [{"k": "5-3.0", "t": "pg", "q": "前面开过来___。", "o": ["很多车", "车很多", "那辆车", "车"], "a": 0, "x": "Setelah KK: bilangan/kuantitas + benda.", "f": "前面开过来很多车。", "fp": "Qiánmiàn kāi guòlái hěn duō chē."}, {"k": "5-3.1", "t": "pg", "q": "Mana yang BENAR?", "o": ["后边走过去两个人。", "在后边走过去两个人。", "两个人走过去后边。", "后边两个人走过去了在。"], "a": 0, "x": "Tempat + KK + arah + Bil + orang."}, {"k": "5-3.2", "t": "pg", "q": "树上飞来了___鸟。", "o": ["几只", "几个", "几本", "几张"], "a": 0, "x": "Kata ukuran burung: 只.", "f": "树上飞来了几只鸟。", "fp": "Shù shàng fēi lái le jǐ zhī niǎo."}, {"k": "5-3.3", "t": "pg", "q": "\"Ke dalam kelas masuk seorang guru.\" =", "o": ["教室里走进来一个老师。", "一个老师教室里走进来。", "在教室里一个老师走进来。", "教室里一个老师走进来。"], "a": 0, "x": "Tempat + KK + 进来 + 一个老师."}, {"k": "5-3.4", "t": "pg", "q": "楼上___了几个人。", "o": ["下来", "下去来", "来下", "上下"], "a": 0, "x": "楼上下来了几个人 = dari atas turun beberapa orang.", "f": "楼上下来了几个人。", "fp": "Lóu shàng xiàlái le jǐ gè rén."}, {"k": "5-3.5", "t": "pg", "q": "Kalimat mana yang BUKAN 存现句 yang baik?", "o": ["楼上下来了王老师。", "楼上下来了几个人。", "前边跑过来一只狗。", "外边进来了两个人。"], "a": 0, "x": "Orang yang sudah dikenal (王老师) tidak cocok dalam 存现句."}, {"k": "5-3.6", "t": "pg", "q": "天上飞过去一___飞机。", "o": ["架", "只", "个人", "本"], "a": 0, "x": "Kata ukuran pesawat: 架.", "f": "天上飞过去一架飞机。", "fp": "Tiān shàng fēi guòqù yí jià fēijī."}, {"k": "5-3.7", "t": "su", "w": ["后边", "走", "过去", "两", "个", "人"], "s": "后边走过去两个人。", "alt": [], "p": "Hòubian zǒu guòqù liǎng gè rén.", "x": "Dari belakang lewat dua orang."}, {"k": "5-3.8", "t": "su", "w": ["前面", "开", "过来", "很", "多", "车"], "s": "前面开过来很多车。", "alt": [], "p": "Qiánmiàn kāi guòlái hěn duō chē.", "x": "Dari depan datang banyak mobil."}, {"k": "5-3.9", "t": "su", "w": ["楼上", "下来", "了", "几", "个", "人"], "s": "楼上下来了几个人。", "alt": [], "p": "Lóu shàng xiàlái le jǐ gè rén.", "x": "Dari lantai atas turun beberapa orang."}, {"k": "5-3.10", "t": "su", "w": ["教室", "里", "走", "进来", "一个", "老师"], "s": "教室里走进来一个老师。", "alt": [], "p": "Jiàoshì lǐ zǒu jìnlái yí gè lǎoshī.", "x": "Ke dalam kelas masuk seorang guru."}, {"k": "5-3.11", "t": "su", "w": ["前边", "跑", "过来", "一只", "小狗"], "s": "前边跑过来一只小狗。", "alt": [], "p": "Qiánbian pǎo guòlái yì zhī xiǎogǒu.", "x": "Dari depan berlari datang seekor anjing kecil."}, {"k": "5-3.12", "t": "bs", "s": "外边进来了两位客人。", "sp": "Wàibian jìnlái le liǎng wèi kèrén.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "5-3.13", "t": "bs", "s": "在前面开过来很多车。", "sp": "Zài qiánmiàn kāi guòlái hěn duō chē.", "n": "", "ok": false, "b": "前面开过来很多车。", "bp": "Qiánmiàn kāi guòlái hěn duō chē.", "x": "Tanpa 在 di depan tempat."}, {"k": "5-3.14", "t": "bs", "s": "树上飞来了几只鸟。", "sp": "Shù shàng fēi lái le jǐ zhī niǎo.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "5-3.15", "t": "bs", "s": "一个老师教室里走进来。", "sp": "Yí gè lǎoshī jiàoshì lǐ zǒu jìnlái.", "n": "", "ok": false, "b": "教室里走进来一个老师。", "bp": "Jiàoshì lǐ zǒu jìnlái yí gè lǎoshī.", "x": "Tempat di depan, orang setelah kata kerja."}]}, {"id": "5-4", "pel": 5, "judul": "Kalimat majemuk ringkas KK₁ + 了 + … + 就 + KK₂: begitu selesai …, langsung …", "kode": "紧缩复句“……了……就……”", "rumus": ["(S) + KK₁ + 了 + (O) + 就 + KK₂", "S + KK₁ + 了 + O + 就 + KK₂ + 了 (keduanya sudah terjadi)", "S + KK₁ + 完 + 了 + O + 就 + KK₂"], "jelas": ["Pola KK₁ + 了 + … + 就 + KK₂ menyatakan dua tindakan yang terjadi berurutan dengan cepat: setelah tindakan pertama selesai, tindakan kedua langsung dilakukan. Artinya \"setelah/begitu selesai …, langsung …\".", "了 setelah KK₁ menandai tindakan pertama sudah selesai; 就 sebelum KK₂ menunjukkan tindakan kedua segera menyusul. Contoh: 你听完了音乐会就来我家吃饭 = selesai menonton konser, langsung datang makan di rumahku.", "Jika tindakan kedua juga sudah terjadi (lampau), tambahkan 了 di akhir kalimat: 我吃了早饭就去学校了 = setelah sarapan aku langsung pergi ke sekolah. Untuk rencana/perintah (belum terjadi), tidak ada 了 di akhir.", "Pola ini disebut \"ringkas\" karena dua klausa digabung tanpa jeda koma dan tanpa kata penghubung lain. Subjeknya biasanya satu dan berada di depan. 就 tidak boleh diletakkan sebelum subjek.", "Jebakan pelajar Indonesia: menerjemahkan \"setelah\" dengan 以后 saja lalu lupa 就, atau menaruh 了 di tempat yang salah (我了吃早饭). Ingat: KK₁ + 了 + objek. Juga bisa dipakai dengan pelengkap hasil: 下了课, 听完了, 做好了.", "Bandingkan dengan 一……就…… (begitu … langsung …), yang lebih menekankan \"segera/otomatis\". Pola ……了……就…… menekankan urutan selesai-lalu-lanjut."], "poin": ["KK₁ + 了 + O + 就 + KK₂ = selesai …, langsung ….", "Lampau: tambah 了 di akhir.", "Rencana/perintah: tanpa 了 akhir.", "就 setelah subjek, sebelum KK₂."], "contoh": [{"zh": "你听完了音乐会就来我家吃饭。", "py": "Nǐ tīng wán le yīnyuè huì jiù lái wǒ jiā chīfàn.", "id": "Selesai menonton konser, langsung datang makan di rumahku.", "b": true, "tr": "05-7"}, {"zh": "我吃了早饭就去学校了。", "py": "Wǒ chī le zǎofàn jiù qù xuéxiào le.", "id": "Setelah sarapan aku langsung pergi ke sekolah.", "b": true, "tr": null}, {"zh": "昨天我们下了课就回家了。", "py": "Zuótiān wǒmen xià le kè jiù huí jiā le.", "id": "Kemarin setelah pulang kelas kami langsung pulang ke rumah.", "b": true, "tr": null}, {"zh": "坐累了就站一会儿，饿了就点外卖。", "py": "Zuò lèi le jiù zhàn yíhuìr, è le jiù diǎn wàimài.", "id": "Kalau capek duduk, berdiri sebentar; kalau lapar, pesan makanan antar.", "b": true, "tr": "06-7"}, {"zh": "爸爸每次上了飞机就睡觉。", "py": "Bàba měi cì shàng le fēijī jiù shuìjiào.", "id": "Setiap kali naik pesawat, ayah langsung tidur.", "b": false, "tr": null}, {"zh": "今天我没吃早饭，所以下了课就去吃饭了。", "py": "Jīntiān wǒ méi chī zǎofàn, suǒyǐ xià le kè jiù qù chīfàn le.", "id": "Hari ini aku tidak sarapan, jadi setelah kelas langsung pergi makan.", "b": false, "tr": null}, {"zh": "你做完了作业就可以看电视。", "py": "Nǐ zuò wán le zuòyè jiù kěyǐ kàn diànshì.", "id": "Setelah selesai mengerjakan PR, kamu boleh menonton TV.", "b": false, "tr": null}, {"zh": "他下了班就去超市买东西了。", "py": "Tā xià le bān jiù qù chāoshì mǎi dōngxi le.", "id": "Setelah pulang kerja dia langsung ke supermarket belanja.", "b": false, "tr": null}, {"zh": "我到了北京就给你打电话。", "py": "Wǒ dào le Běijīng jiù gěi nǐ dǎdiànhuà.", "id": "Begitu sampai di Beijing aku langsung meneleponmu.", "b": false, "tr": null}, {"zh": "她洗了澡就睡觉了。", "py": "Tā xǐ le zǎo jiù shuìjiào le.", "id": "Setelah mandi dia langsung tidur.", "b": false, "tr": null}], "salah": [{"s": "我了吃早饭就去学校。", "sp": "Wǒ le chī zǎofàn jiù qù xuéxiào.", "n": "", "b": "我吃了早饭就去学校。", "bp": "Wǒ chī le zǎofàn jiù qù xuéxiào.", "a": "了 setelah kata kerja."}, {"s": "我吃了早饭，就我去学校了。", "sp": "Wǒ chī le zǎofàn, jiù wǒ qù xuéxiào le.", "n": "", "b": "我吃了早饭就去学校了。", "bp": "Wǒ chī le zǎofàn jiù qù xuéxiào le.", "a": "就 tidak sebelum subjek; subjek cukup satu di depan."}, {"s": "我下了课回家了。", "sp": "Wǒ xià le kè huí jiā le.", "n": "langsung pulang", "b": "我下了课就回家了。", "bp": "Wǒ xià le kè jiù huí jiā le.", "a": "Untuk \"langsung\", perlu 就."}], "latihan": [{"k": "5-4.0", "t": "pg", "q": "我吃了早饭___去学校了。", "o": ["就", "才", "都", "还"], "a": 0, "x": "……了……就…….", "f": "我吃了早饭就去学校了。", "fp": "Wǒ chī le zǎofàn jiù qù xuéxiào le."}, {"k": "5-4.1", "t": "pg", "q": "你听完了音乐会就来我家___。", "o": ["吃饭", "吃饭了", "吃了饭了", "了吃饭"], "a": 0, "x": "Ajakan (belum terjadi): tanpa 了 akhir.", "f": "你听完了音乐会就来我家吃饭。", "fp": "Nǐ tīng wán le yīnyuè huì jiù lái wǒ jiā chīfàn."}, {"k": "5-4.2", "t": "pg", "q": "\"Kemarin setelah kelas kami langsung pulang.\" =", "o": ["昨天我们下了课就回家了。", "昨天我们下课了就回家。 : "我唱完了，该你了。", "sp": "Wǒ chàng wán le, gāi nǐ le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 该 + orang + 了 = giliran."}, {"k": "6-1.13", "t": "bs", "s": "已经很晚了，我该睡觉。", "sp": "Yǐjīng hěn wǎn le, wǒ gāi shuìjiào.", "n": "", "ok": false, "b": "已经很晚了，我该睡觉了。", "bp": "Yǐjīng hěn wǎn le, wǒ gāi shuìjiào le.", "x": "Perlu 了 di akhir."}, {"k": "6-1.14", "t": "bs", "s": "咱们该买去上海的票了。", "sp": "Zánmen gāi mǎi qù Shànghǎi de piào le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "6-1.15", "t": "bs", "s": "我们了该走。", "sp": "Wǒmen le gāi zǒu.", "n": "", "ok": false, "b": "我们该走了。", "bp": "Wǒmen gāi zǒu le.", "x": "了 di akhir kalimat."}]}, {"id": "6-2", "pel": 6, "judul": "Kalimat majemuk pengandaian 如果……，就……: jika …, maka …", "kode": "假设复句“如果……，就……”", "rumus": ["如果 + pengandaian，(S) + 就 + hasil", "如果 + S₁ + …，S₂ + 就 + …", "S + 如果 + …，就 + …"], "jelas": ["Dalam kalimat 如果……，就……, klausa setelah 如果 (rúguǒ) adalah PENGANDAIAN, sedangkan klausa setelah 就 adalah HASIL yang muncul jika pengandaian itu terjadi. Artinya \"jika …, maka …\".", "Hal penting menurut buku: subjek klausa kedua diletakkan SEBELUM 就: 如果有时间，我就去上海玩几天 (bukan 就我去). Ini sama dengan aturan 就 di pola lain: 就 adalah kata keterangan, jadi selalu setelah subjek.", "Subjek klausa pertama boleh sebelum atau sesudah 如果: 如果你需要帮忙 / 你如果需要帮忙. Jika subjek kedua sama dengan yang pertama dan jelas, boleh dihilangkan: 如果你需要帮忙，就给我打电话.", "Pola ini juga bisa untuk pengandaian yang berlawanan dengan kenyataan masa lalu: 如果没走错，二十分钟以前就到了 = kalau tidak salah jalan, dua puluh menit yang lalu sudah sampai (kenyataannya salah jalan).", "Jebakan pelajar Indonesia: menaruh 就 di awal klausa kedua seperti \"maka\" (如果下雨，就我们不去) — salah, harus 我们就不去. 就 boleh dihilangkan dalam bahasa lisan, tetapi pakailah untuk latihan.", "Bentuk ingkar diletakkan setelah 就: 如果明天下雨，我们就不去了. Bisa juga memakai 要是 dengan arti sama (lebih lisan)."], "poin": ["如果 + pengandaian, 就 + hasil.", "Subjek kedua sebelum 就.", "Ingkar: 就不/就没.", "Bisa untuk pengandaian berlawanan kenyataan."], "contoh": [{"zh": "如果没走错，二十分钟以前就到了。", "py": "Rúguǒ méi zǒu cuò, èrshí fēnzhōng yǐqián jiù dào le.", "id": "Kalau tidak salah jalan, dua puluh menit yang lalu sudah sampai.", "b": true, "tr": "06-3"}, {"zh": "如果你需要帮忙，就给我打电话。", "py": "Rúguǒ nǐ xūyào bāngmáng, jiù gěi wǒ dǎdiànhuà.", "id": "Jika kamu perlu bantuan, telepon saja aku.", "b": true, "tr": null}, {"zh": "如果有时间，我就去上海玩几天。", "py": "Rúguǒ yǒu shíjiān, wǒ jiù qù Shànghǎi wán jǐ tiān.", "id": "Jika ada waktu, aku akan pergi main ke Shanghai beberapa hari.", "b": true, "tr": null}, {"zh": "如果明天下雨，我们就不去爬山了。", "py": "Rúguǒ míngtiān xià yǔ, wǒmen jiù bú qù pá shān le.", "id": "Jika besok hujan, kita tidak jadi naik gunung.", "b": false, "tr": null}, {"zh": "如果我觉得太累了，就休息一会儿。", "py": "Rúguǒ wǒ juéde tài lèi le, jiù xiūxi yíhuìr.", "id": "Jika aku merasa terlalu capek, aku istirahat sebentar.", "b": false, "tr": null}, {"zh": "如果放假，我就跟朋友一起去旅游。", "py": "Rúguǒ fàngjià, wǒ jiù gēn péngyou yìqǐ qù lǚyóu.", "id": "Jika libur, aku akan pergi berwisata bersama teman.", "b": false, "tr": null}, {"zh": "如果你不喜欢这个颜色，我们就换一个。", "py": "Rúguǒ nǐ bù xǐhuan zhège yánsè, wǒmen jiù huàn yí gè.", "id": "Jika kamu tidak suka warna ini, kita ganti saja.", "b": false, "tr": null}, {"zh": "你如果有问题，就问老师。", "py": "Nǐ rúguǒ yǒu wèntí, jiù wèn lǎoshī.", "id": "Kalau kamu ada pertanyaan, tanyakan pada guru.", "b": false, "tr": null}, {"zh": "如果坐高铁，两个小时就能到。", "py": "Rúguǒ zuò gāotiě, liǎng gè xiǎoshí jiù néng dào.", "id": "Kalau naik kereta cepat, dua jam sudah bisa sampai.", "b": false, "tr": null}], "salah": [{"s": "如果有时间，就我去上海。", "sp": "Rúguǒ yǒu shíjiān, jiù wǒ qù Shànghǎi.", "n": "", "b": "如果有时间，我就去上海。", "bp": "Rúguǒ yǒu shíjiān, wǒ jiù qù Shànghǎi.", "a": "Subjek kedua sebelum 就."}, {"s": "如果明天下雨，我们不就去了。", "sp": "Rúguǒ míngtiān xià yǔ, wǒmen bú jiù qù le.", "n": "", "b": "如果明天下雨，我们就不去了。", "bp": "Rúguǒ míngtiān xià yǔ, wǒmen jiù bú qù le.", "a": "Ingkar setelah 就."}, {"s": "我就如果有时间去上海。", "sp": "Wǒ jiù rúguǒ yǒu shíjiān qù Shànghǎi.", "n": "", "b": "如果有时间，我就去上海。", "bp": "Rúguǒ yǒu shíjiān, wǒ jiù qù Shànghǎi.", "a": "如果 di klausa pengandaian, 就 di klausa hasil."}], "latihan": [{"k": "6-2.0", "t": "pg", "q": "如果明天下雨，我们___不去公园了。", "o": ["就", "才", "都", "也就"], "a": 0, "x": "如果……，就…….", "f": "如果明天下雨，我们就不去公园了。", "fp": "Rúguǒ míngtiān xià yǔ, wǒmen jiù bú qù gōngyuán le."}, {"k": "6-2.1", "t": "pg", "q": "Mana yang BENAR?", "o": ["如果你有时间，我们就一起去。", "如果你有时间，就我们一起去。", "如果你有时间，我们一起就去。", "就如果你有时间，我们一起去。"], "a": 0, "x": "Subjek kedua sebelum 就."}, {"k": "6-2.2", "t": "pg", "q": "___你需要帮忙，就给我打电话。", "o": ["如果", "因为", "但是", "所以"], "a": 0, "x": "Pengandaian: 如果.", "f": "如果你需要帮忙，就给我打电话。", "fp": "Rúguǒ nǐ xūyào bāngmáng, jiù gěi wǒ dǎdiànhuà."}, {"k": "6-2.3", "t": "pg", "q": "\"Jika aku capek, aku istirahat.\" =", "o": ["如果我累了，我就休息。", "如果我累了，就我休息。", "我就如果累了休息。", "如果我就累了，休息。"], "a": 0, "x": "如果……，S + 就……."}, {"k": "6-2.4", "t": "pg", "q": "如果没走错，二十分钟以前就到了。 Artinya …", "o": ["Mereka salah jalan, jadi terlambat.", "Mereka sudah sampai dua puluh menit lalu.", "Mereka tidak salah jalan.", "Mereka akan sampai dua puluh menit lagi."], "a": 0, "x": "Pengandaian berlawanan kenyataan."}, {"k": "6-2.5", "t": "pg", "q": "如果你不喜欢，我们就___。", "o": ["换一个", "换一个就", "就换一个了吗", "不就换"], "a": 0, "x": "Hasil setelah 就.", "f": "如果你不喜欢，我们就换一个。", "fp": "Rúguǒ nǐ bù xǐhuan, wǒmen jiù huàn yí gè."}, {"k": "6-2.6", "t": "pg", "q": "如果坐高铁，三个小时___能到。", "o": ["就", "才", "都", "还"], "a": 0, "x": "Hasil: 就能到.", "f": "如果坐高铁，三个小时就能到。", "fp": "Rúguǒ zuò gāotiě, sān gè xiǎoshí jiù néng dào."}, {"k": "6-2.7", "t": "su", "w": ["如果", "你", "需要", "帮忙，", "就", "给", "我", "打", "电话"], "s": "如果你需要帮忙，就给我打电话。", "alt": [], "p": "Rúguǒ nǐ xūyào bāngmáng, jiù gěi wǒ dǎdiànhuà.", "x": "Jika kamu perlu bantuan, telepon aku."}, {"k": "6-2.8", "t": "su", "w": ["如果", "有", "时间，", "我", "就", "去", "上海"], "s": "如果有时间，我就去上海。", "alt": [], "p": "Rúguǒ yǒu shíjiān, wǒ jiù qù Shànghǎi.", "x": "Jika ada waktu, aku akan pergi ke Shanghai."}, {"k": "6-2.9", "t": "su", "w": ["如果", "明天", "下雨，", "我们", "就", "不", "去", "了"], "s": "如果明天下雨，我们就不去了。", "alt": ["明天如果下雨，我们就不去了。"], "p": "Rúguǒ míngtiān xià yǔ, wǒmen jiù bú qù le.", "x": "Jika besok hujan, kita tidak jadi pergi."}, {"k": "6-2.10", "t": "su", "w": ["如果", "放假，", "我", "就", "去", "旅游"], "s": "如果放假，我就去旅游。", "alt": [], "p": "Rúguǒ fàngjià, wǒ jiù qù lǚyóu.", "x": "Jika libur, aku akan berwisata."}, {"k": "6-2.11", "t": "su", "w": ["如果", "你", "有", "问题，", "就", "问", "老师"], "s": "如果你有问题，就问老师。", "alt": [], "p": "Rúguǒ nǐ yǒu wèntí, jiù wèn lǎoshī.", "x": "Kalau kamu ada pertanyaan, tanyakan pada guru."}, {"k": "6-2.12", "t": "bs", "s": "如果没走错，二十分钟以前就到了。", "sp": "Rúguǒ méi zǒu cuò, èrshí fēnzhōng yǐqián jiù dào le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar (contoh buku)."}, {"k": "6-2.13", "t": "bs", "s": "如果下雨，就我们在家看电视。", "sp": "Rúguǒ xià yǔ, jiù wǒmen zài jiā kàn diànshì.", "n": "", "ok": false, "b": "如果下雨，我们就在家看电视。", "bp": "Rúguǒ xià yǔ, wǒmen jiù zài jiā kàn diànshì.", "x": "Subjek kedua sebelum 就."}, {"k": "6-2.14", "t": "bs", "s": "如果你不喜欢这个，我们就换一个。", "sp": "Rúguǒ nǐ bù xǐhuan zhège, wǒmen jiù huàn yí gè.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "6-2.15", "t": "bs", "s": "如果明天很冷，我不就出去了。", "sp": "Rúguǒ míngtiān hěn lěng, wǒ bú jiù chūqù le.", "n": "", "ok": false, "b": "如果明天很冷，我就不出去了。", "bp": "Rúguǒ míngtiān hěn lěng, wǒ jiù bù chūqù le.", "x": "Ingkar setelah 就."}]}, {"id": "6-3", "pel": 6, "judul": "Frasa tetap 越来越: makin lama makin …", "kode": "固定短语“越来越”", "rumus": ["Subjek + 越来越 + KS + (了)", "Subjek + 越来越 + KK perasaan + (O) + (了)", "…越来越多/少/好/冷"], "jelas": ["越来越 (yuè lái yuè) diikuti kata sifat atau kata kerja perasaan untuk menyatakan perubahan derajat seiring berjalannya waktu: \"makin lama makin …, semakin …\". 前面的人越来越多 = orang di depan makin lama makin banyak.", "Susunan: Subjek + 越来越 + KS/KK perasaan. Di akhir kalimat sering ditambah 了 untuk menegaskan perubahan: 她越来越漂亮了.", "Aturan penting dari buku: kata sifat atau kata kerja perasaan setelah 越来越 TIDAK BOLEH diberi kata keterangan derajat (很, 非常, 太, 比较, 挺). 越来越很冷 salah; cukup 越来越冷.", "Untuk kata kerja perasaan, objek boleh ikut: 我越来越喜欢这里的生活了. Untuk ingkar, letakkan 不 setelah 越来越: 他越来越不喜欢说话了 (dia makin tidak suka bicara).", "Jebakan pelajar Indonesia: \"semakin\" diterjemahkan 更 saja (天气更冷了) — tidak salah, tetapi 更 hanya membandingkan dua keadaan, sedangkan 越来越 menunjukkan perubahan terus-menerus. Juga jangan memakai 越来越 dengan kata kerja tindakan biasa (越来越跑 salah).", "Bisa dua kali berturut-turut: 她越来越高，也越来越漂亮了."], "poin": ["越来越 + KS = makin lama makin ….", "Tanpa 很/非常/太 setelah 越来越.", "Sering diakhiri 了.", "Ingkar: 越来越不 + …."], "contoh": [{"zh": "前面的人越来越多。", "py": "Qiánmiàn de rén yuè lái yuè duō.", "id": "Orang di depan makin lama makin banyak.", "b": true, "tr": "06-5"}, {"zh": "我越来越喜欢这里的生活了。", "py": "Wǒ yuè lái yuè xǐhuan zhèlǐ de shēnghuó le.", "id": "Aku makin suka kehidupan di sini.", "b": true, "tr": null}, {"zh": "她越来越高，也越来越漂亮了。", "py": "Tā yuè lái yuè gāo, yě yuè lái yuè piàoliang le.", "id": "Dia makin tinggi, juga makin cantik.", "b": true, "tr": null}, {"zh": "现在喜欢坐高铁的人越来越多。", "py": "Xiànzài xǐhuan zuò gāotiě de rén yuè lái yuè duō.", "id": "Sekarang orang yang suka naik kereta cepat makin banyak.", "b": true, "tr": "06-7"}, {"zh": "这些年的天气越来越热了。", "py": "Zhèxiē nián de tiānqì yuè lái yuè rè le.", "id": "Cuaca beberapa tahun ini makin panas.", "b": false, "tr": null}, {"zh": "他每天都运动，现在身体越来越好。", "py": "Tā měi tiān dōu yùndòng, xiànzài shēntǐ yuè lái yuè hǎo.", "id": "Dia berolahraga setiap hari, sekarang badannya makin sehat.", "b": false, "tr": null}, {"zh": "我的汉语越来越好了。", "py": "Wǒ de Hànyǔ yuè lái yuè hǎo le.", "id": "Bahasa Mandarinku makin bagus.", "b": false, "tr": null}, {"zh": "天越来越冷，你要多穿点儿衣服。", "py": "Tiān yuè lái yuè lěng, nǐ yào duō chuān diǎnr yīfu.", "id": "Cuaca makin dingin, kamu harus pakai baju lebih banyak.", "b": false, "tr": null}, {"zh": "他越来越不喜欢说话了。", "py": "Tā yuè lái yuè bù xǐhuan shuōhuà le.", "id": "Dia makin tidak suka bicara.", "b": false, "tr": null}, {"zh": "我们的城市越来越漂亮了。", "py": "Wǒmen de chéngshì yuè lái yuè piàoliang le.", "id": "Kota kami makin indah.", "b": false, "tr": null}], "salah": [{"s": "天气越来越很冷。", "sp": "Tiānqì yuè lái yuè hěn lěng.", "n": "", "b": "天气越来越冷。", "bp": "Tiānqì yuè lái yuè lěng.", "a": "Tidak boleh ada 很 setelah 越来越."}, {"s": "他越来越跑。", "sp": "Tā yuè lái yuè pǎo.", "n": "", "b": "他跑得越来越快。", "bp": "Tā pǎo de yuè lái yuè kuài.", "a": "越来越 diikuti KS/KK perasaan, bukan kata kerja tindakan."}, {"s": "他不越来越喜欢说话。", "sp": "Tā bú yuè lái yuè xǐhuan shuōhuà.", "n": "", "b": "他越来越不喜欢说话了。", "bp": "Tā yuè lái yuè bù xǐhuan shuōhuà le.", "a": "Ingkar diletakkan setelah 越来越."}], "latihan": [{"k": "6-3.0", "t": "pg", "q": "前面的人越来越___。", "o": ["多", "很多", "非常多", "太多"], "a": 0, "x": "Tanpa kata keterangan derajat.", "f": "前面的人越来越多。", "fp": "Qiánmiàn de rén yuè lái yuè duō."}, {"k": "6-3.1", "t": "pg", "q": "我___喜欢这里的生活了。", "o": ["越来越", "越越", "来越来", "越来"], "a": 0, "x": "Bentuk tetap: 越来越.", "f": "我越来越喜欢这里的生活了。", "fp": "Wǒ yuè lái yuè xǐhuan zhèlǐ de shēnghuó le."}, {"k": "6-3.2", "t": "pg", "q": "\"Cuaca makin dingin.\" =", "o": ["天气越来越冷了。", "天气越来越很冷了。", "天气冷越来越了。", "天气越冷越来了。"], "a": 0, "x": "越来越 + KS + 了."}, {"k": "6-3.3", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["他的汉语越来越非常好。", "他的汉语越来越好。", "她越来越漂亮了。", "天越来越热了。"], "a": 0, "x": "Tidak boleh 非常 setelah 越来越."}, {"k": "6-3.4", "t": "pg", "q": "他每天都运动，身体___。", "o": ["越来越好", "越来越很好", "越好来越", "很越来越好"], "a": 0, "x": "越来越 + KS.", "f": "他每天都运动，身体越来越好。", "fp": "Tā měi tiān dōu yùndòng, shēntǐ yuè lái yuè hǎo."}, {"k": "6-3.5", "t": "pg", "q": "他越来越___喜欢说话了。", "o": ["不", "没", "很", "非常"], "a": 0, "x": "Ingkar setelah 越来越.", "f": "他越来越不喜欢说话了。", "fp": "Tā yuè lái yuè bù xǐhuan shuōhuà le."}, {"k": "6-3.6", "t": "pg", "q": "\"Dia berlari makin cepat.\" =", "o": ["他跑得越来越快。", "他越来越跑快。", "他跑越来越得快。", "他越来越跑得。"], "a": 0, "x": "越来越 menjadi bagian pelengkap: 跑得越来越快."}, {"k": "6-3.7", "t": "su", "w": ["前面", "的", "人", "越来越", "多"], "s": "前面的人越来越多。", "alt": [], "p": "Qiánmiàn de rén yuè lái yuè duō.", "x": "Orang di depan makin banyak."}, {"k": "6-3.8", "t": "su", "w": ["我", "越来越", "喜欢", "这里", "的", "生活", "了"], "s": "我越来越喜欢这里的生活了。", "alt": [], "p": "Wǒ yuè lái yuè xǐhuan zhèlǐ de shēnghuó le.", "x": "Aku makin suka kehidupan di sini."}, {"k": "6-3.9", "t": "su", "w": ["天气", "越来越", "冷", "了"], "s": "天气越来越冷了。", "alt": [], "p": "Tiānqì yuè lái yuè lěng le.", "x": "Cuaca makin dingin."}, {"k": "6-3.10", "t": "su", "w": ["我", "的", "汉语", "越来越", "好", "了"], "s": "我的汉语越来越好了。", "alt": [], "p": "Wǒ de Hànyǔ yuè lái yuè hǎo le.", "x": "Bahasa Mandarinku makin bagus."}, {"k": "6-3.11", "t": "su", "w": ["喜欢", "坐", "高铁", "的", "人", "越来越", "多"], "s": "喜欢坐高铁的人越来越多。", "alt": [], "p": "Xǐhuan zuò gāotiě de rén yuè lái yuè duō.", "x": "Orang yang suka naik kereta cepat makin banyak."}, {"k": "6-3.12", "t": "bs", "s": "她越来越高，也越来越漂亮了。", "sp": "Tā yuè lái yuè gāo, yě yuè lái yuè piàoliang le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "6-3.13", "t": "bs", "s": "这个城市越来越很漂亮了。", "sp": "Zhège chéngshì yuè lái yuè hěn piàoliang le.", "n": "", "ok": false, "b": "这个城市越来越漂亮了。", "bp": "Zhège chéngshì yuè lái yuè piàoliang le.", "x": "Tanpa 很 setelah 越来越."}, {"k": "6-3.14", "t": "bs", "s": "他越来越不喜欢说话了。", "sp": "Tā yuè lái yuè bù xǐhuan shuōhuà le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: ingkar setelah 越来越."}, {"k": "6-3.15", "t": "bs", "s": "我不越来越喜欢他了。", "sp": "Wǒ bú yuè lái yuè xǐhuan tā le.", "n": "", "ok": false, "b": "我越来越不喜欢他了。", "bp": "Wǒ yuè lái yuè bù xǐhuan tā le.", "x": "不 diletakkan setelah 越来越."}]}, {"id": "7-1", "pel": 7, "judul": "Kalimat kata kerja berurutan (2): KK₁ + 着 + KK₂", "kode": "连动句（2）", "rumus": ["S + KK₁ + 着 + (O₁) + KK₂ + (O₂)", "走着去 / 坐着看 / 笑着说", "KK₁着 = cara atau keadaan saat melakukan KK₂"], "jelas": ["Dalam pola ini ada dua kata kerja berurutan. Partikel 着 (zhe) ditempel pada kata kerja PERTAMA. Kata kerja pertama + 着 menjelaskan CARA atau KEADAAN ketika kegiatan kedua dilakukan. Kegiatan utama adalah kata kerja kedua. 咱们可以走着去 = kita bisa pergi (kegiatan utama) dengan berjalan kaki (caranya).", "Susunannya: Subjek + KK₁ + 着 + (objek KK₁) + KK₂ + (objek KK₂). Contoh: 弟弟 + 吃着 + 苹果 + 写 + 作业 = adik + sambil makan + apel + mengerjakan + PR. Kata keterangan (也, 都, 常常) dan kata bantu kerja (可以, 想, 会) diletakkan sebelum KK₁: 他们都坐着看电视. 我想躺着休息一下.", "Untuk menyangkal, biasanya yang disangkal adalah caranya: 别站着吃饭 (jangan makan sambil berdiri), 他不是走着来的，是骑车来的 (dia datang bukan dengan jalan kaki, tetapi naik sepeda). Pertanyaan bisa memakai 吗 atau 怎么: 你们怎么去？——走着去。", "Bedakan dengan kalimat kata kerja berurutan (1) yang menyatakan TUJUAN: 我去商店买东西 = saya ke toko untuk membeli barang. Pada pola 着, kata kerja pertama bukan langkah sebelum tujuan, melainkan cara yang berlangsung bersamaan: 我走着去商店 = saya ke toko dengan berjalan kaki. Bedakan juga dengan 一边……一边…… (dua kegiatan setara): 他一边吃饭一边看电视. Dengan 着, kegiatan pertama hanya latar atau cara.", "Jebakan bagi pelajar Indonesia: dalam bahasa Indonesia kita bilang \"pergi jalan kaki\" atau \"menonton sambil duduk\", jadi cara diletakkan di belakang. Dalam bahasa Mandarin urutannya terbalik: caranya dulu, baru kegiatan utama. Jangan bilang 我去走着, tetapi 我走着去. Jangan bilang 他看电视坐着, tetapi 他坐着看电视.", "着 hanya ditempel sekali, pada kata kerja pertama. Kata kerja yang sering dipakai sebagai KK₁: 走、坐、站、躺、笑、听、拿、穿、看、吃. Pola ini sering dipakai untuk menggambarkan orang: 她笑着说\"没关系\" (dia berkata sambil tersenyum)."], "poin": ["着 ditempel pada kata kerja pertama.", "KK₁着 = cara/keadaan; KK₂ = kegiatan utama.", "Urutan: cara dulu, baru kegiatan (走着去, bukan 去走着).", "Keterangan dan kata bantu kerja sebelum KK₁."], "contoh": [{"zh": "咱们可以走着去。", "py": "Zánmen kěyǐ zǒu zhe qù.", "id": "Kita bisa pergi dengan berjalan kaki.", "b": true, "tr": "07-1"}, {"zh": "弟弟吃着苹果写作业。", "py": "Dìdi chī zhe píngguǒ xiě zuòyè.", "id": "Adik mengerjakan PR sambil makan apel.", "b": true, "tr": null}, {"zh": "他们坐着看电视。", "py": "Tāmen zuò zhe kàn diànshì.", "id": "Mereka menonton TV sambil duduk.", "b": true, "tr": null}, {"zh": "这几天我们在新家坐着看电视的时候，又发现了新问题。", "py": "Zhè jǐ tiān wǒmen zài xīn jiā zuò zhe kàn diànshì de shíhou, yòu fāxiàn le xīn wèntí.", "id": "Beberapa hari ini, waktu kami duduk menonton TV di rumah baru, kami menemukan masalah baru lagi.", "b": true, "tr": "07-7"}, {"zh": "她笑着说：\"没关系。\"", "py": "Tā xiào zhe shuō: \"Méiguānxi.\"", "id": "Dia berkata sambil tersenyum, \"Tidak apa-apa.\"", "b": false, "tr": null}, {"zh": "我喜欢听着音乐跑步。", "py": "Wǒ xǐhuan tīng zhe yīnyuè pǎobù.", "id": "Saya suka berlari sambil mendengarkan musik.", "b": false, "tr": null}, {"zh": "妈妈拿着一个大西瓜进来了。", "py": "Māma ná zhe yí gè dà xīguā jìnlái le.", "id": "Ibu masuk sambil membawa sebuah semangka besar.", "b": false, "tr": null}, {"zh": "别躺着看书，对眼睛不好。", "py": "Bié tǎng zhe kàn shū, duì yǎnjing bù hǎo.", "id": "Jangan membaca sambil berbaring, tidak baik untuk mata.", "b": false, "tr": null}, {"zh": "老师站着给我们上课。", "py": "Lǎoshī zhàn zhe gěi wǒmen shàngkè.", "id": "Guru mengajar kami sambil berdiri.", "b": false, "tr": null}, {"zh": "孩子们唱着歌回家了。", "py": "Háizimen chàng zhe gē huí jiā le.", "id": "Anak-anak pulang sambil bernyanyi.", "b": false, "tr": null}], "salah": [{"s": "我们去走着。", "sp": "Wǒmen qù zǒu zhe.", "n": "", "b": "我们走着去。", "bp": "Wǒmen zǒu zhe qù.", "a": "Cara (走着) harus di depan kegiatan utama (去)."}, {"s": "他看电视坐着。", "sp": "Tā kàn diànshì zuò zhe.", "n": "", "b": "他坐着看电视。", "bp": "Tā zuò zhe kàn diànshì.", "a": "Keadaan 坐着 diletakkan sebelum 看电视."}, {"s": "弟弟吃着苹果写着作业。", "sp": "Dìdi chī zhe píngguǒ xiě zhe zuòyè.", "n": "mengerjakan PR sambil makan apel", "b": "弟弟吃着苹果写作业。", "bp": "Dìdi chī zhe píngguǒ xiě zuòyè.", "a": "着 cukup pada kata kerja pertama."}, {"s": "我走去着学校。", "sp": "Wǒ zǒu qù zhe xuéxiào.", "n": "", "b": "我走着去学校。", "bp": "Wǒ zǒu zhe qù xuéxiào.", "a": "着 langsung sesudah kata kerja pertama, bukan sesudah 去."}], "latihan": [{"k": "7-1.0", "t": "pg", "q": "商场不远，咱们可以走___去。", "o": ["着", "了", "过", "得"], "a": 0, "x": "KK₁ + 着 + KK₂: 走着去 = pergi dengan jalan kaki.", "f": "商场不远，咱们可以走着去。", "fp": "Shāngchǎng bù yuǎn, zánmen kěyǐ zǒu zhe qù."}, {"k": "7-1.1", "t": "pg", "q": "\"Mereka menonton TV sambil duduk\" =", "o": ["他们坐着看电视。", "他们看电视坐着。", "他们看着电视坐。", "他们坐看着电视。"], "a": 0, "x": "Keadaan (坐着) dulu, lalu kegiatan utama (看电视)."}, {"k": "7-1.2", "t": "pg", "q": "Di mana posisi 着? 她 A 笑 B 说 C：\"谢谢。\"D", "o": ["A", "B", "C", "D"], "a": 1, "x": "着 langsung sesudah kata kerja pertama: 笑着说."}, {"k": "7-1.3", "t": "pg", "q": "你们怎么去学校？——___。", "o": ["骑着自行车去", "去骑着自行车", "骑自行车着去", "去着骑自行车"], "a": 0, "x": "Cara + 着 + 去.", "f": "你们怎么去学校？——骑着自行车去。", "fp": "Nǐmen zěnme qù xuéxiào? — Qí zhe zìxíngchē qù."}, {"k": "7-1.4", "t": "pg", "q": "Mana kalimat yang SALAH?", "o": ["我喜欢听着音乐写作业。", "妈妈拿着包出去了。", "他躺着看手机。", "我去学校走着。"], "a": 3, "x": "Seharusnya 我走着去学校。"}, {"k": "7-1.5", "t": "pg", "q": "别___吃饭，坐下来吃吧。", "o": ["站着", "站了", "站过", "站得"], "a": 0, "x": "别 + KK₁着 + KK₂: jangan makan sambil berdiri.", "f": "别站着吃饭，坐下来吃吧。", "fp": "Bié zhàn zhe chīfàn, zuò xiàlái chī ba."}, {"k": "7-1.6", "t": "su", "w": ["咱们", "可以", "走", "着", "去"], "s": "咱们可以走着去。", "alt": [], "p": "Zánmen kěyǐ zǒu zhe qù.", "x": "Kita bisa pergi dengan berjalan kaki."}, {"k": "7-1.7", "t": "su", "w": ["弟弟", "吃", "着", "苹果", "写", "作业"], "s": "弟弟吃着苹果写作业。", "alt": [], "p": "Dìdi chī zhe píngguǒ xiě zuòyè.", "x": "Adik mengerjakan PR sambil makan apel."}, {"k": "7-1.8", "t": "su", "w": ["老师", "站", "着", "给", "我们", "上课"], "s": "老师站着给我们上课。", "alt": [], "p": "Lǎoshī zhàn zhe gěi wǒmen shàngkè.", "x": "Guru mengajar kami sambil berdiri."}, {"k": "7-1.9", "t": "su", "w": ["妈妈", "拿", "着", "西瓜", "进来", "了"], "s": "妈妈拿着西瓜进来了。", "alt": [], "p": "Māma ná zhe xīguā jìnlái le.", "x": "Ibu masuk sambil membawa semangka."}, {"k": "7-1.10", "t": "su", "w": ["孩子们", "唱", "着", "歌", "回家", "了"], "s": "孩子们唱着歌回家了。", "alt": [], "p": "Háizimen chàng zhe gē huí jiā le.", "x": "Anak-anak pulang sambil bernyanyi."}, {"k": "7-1.11", "t": "bs", "s": "他们坐着看电视。", "sp": "Tāmen zuò zhe kàn diànshì.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: KK₁着 + KK₂."}, {"k": "7-1.12", "t": "bs", "s": "我们去商场走着吧。", "sp": "Wǒmen qù shāngchǎng zǒu zhe ba.", "n": "", "ok": false, "b": "我们走着去商场吧。", "bp": "Wǒmen zǒu zhe qù shāngchǎng ba.", "x": "Cara (走着) harus sebelum 去."}, {"k": "7-1.13", "t": "bs", "s": "妈妈拿着一个西瓜进来了。", "sp": "Māma ná zhe yí gè xīguā jìnlái le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 拿着 menjelaskan keadaan saat masuk."}, {"k": "7-1.14", "t": "bs", "s": "别躺看着书。", "sp": "Bié tǎng kàn zhe shū.", "n": "", "ok": false, "b": "别躺着看书。", "bp": "Bié tǎng zhe kàn shū.", "x": "着 ditempel pada kata kerja pertama (躺)."}, {"k": "7-1.15", "t": "bs", "s": "我喜欢听着音乐跑步。", "sp": "Wǒ xǐhuan tīng zhe yīnyuè pǎobù.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "7-2", "pel": 7, "judul": "Kalimat perbandingan (10): A + 不比 + B + KS", "kode": "比较句（10）", "rumus": ["A + 不比 + B + KS", "A + 不比 + B + KS + 多少", "A + 不比 + B + KK + 得 + KS"], "jelas": ["A不比B + kata sifat artinya \"A tidak lebih … daripada B\", dengan nuansa A dan B kurang lebih sama. 他的中文不比你好 = bahasa Mandarinnya tidak lebih baik daripada kamu (kemampuan kalian kira-kira sama).", "Pola ini sering dipakai untuk MEMBANTAH pendapat orang lain atau menekankan bahwa dua hal itu dekat. Misalnya ada yang bilang \"dia pasti lebih tinggi darimu\", kita jawab: 他不比我高 (dia tidak lebih tinggi dariku, kami sekitar sama).", "Sering ditambah 多少 di akhir: 裙子不比短裤贵多少 = roknya tidak jauh lebih mahal daripada celana pendek (selisihnya kecil). Untuk kata kerja dengan pelengkap keadaan: 他跑得不比我快多少 = larinya tidak jauh lebih cepat dariku.", "Hati-hati, 不比 TIDAK sama dengan 没有. A没有B高 = A tidak setinggi B (A jelas lebih pendek). A不比B高 = A tidak lebih tinggi dari B (biasanya sama saja). Jadi 我不比他高 bukan berarti 我比他矮.", "Jebakan bagi pelajar Indonesia: jangan menaruh 不 setelah 比 (他比我不高 salah). 不 selalu sebelum 比. Jangan pula memakai 很/非常 di depan kata sifat dalam kalimat 比, dan jangan menambahkan jumlah yang pasti (贵八十块) setelah 不比, karena 不比 menyatakan selisih yang tidak berarti.", "Ingat bentuk-bentuk 比 yang lain: A比B更/还 + KS (lebih … lagi), A比B + KS + 一点儿/多了 (sedikit/jauh lebih). Dalam dialog buku: 裙子比短裤贵一点儿 lalu dijawab 裙子不比短裤贵多少."], "poin": ["A不比B + KS = A tidak lebih … dari B (kira-kira sama).", "Sering untuk membantah.", "不比 ≠ 没有: 没有 berarti A kalah.", "不 di depan 比; tanpa 很; boleh + 多少."], "contoh": [{"zh": "裙子不比短裤贵多少。", "py": "Qúnzi bù bǐ duǎnkù guì duōshao.", "id": "Roknya tidak jauh lebih mahal daripada celana pendek.", "b": true, "tr": "07-3"}, {"zh": "他的中文不比你好。", "py": "Tā de Zhōngwén bù bǐ nǐ hǎo.", "id": "Bahasa Mandarinnya tidak lebih baik daripada kamu.", "b": true, "tr": null}, {"zh": "他跑得不比我快多少。", "py": "Tā pǎo de bù bǐ wǒ kuài duōshao.", "id": "Larinya tidak jauh lebih cepat dariku.", "b": true, "tr": null}, {"zh": "裙子不比短裤贵多少，还是买裙子吧，你穿裙子更好看。", "py": "Qúnzi bù bǐ duǎnkù guì duōshao, háishi mǎi qúnzi ba, nǐ chuān qúnzi gèng hǎokàn.", "id": "Roknya tidak jauh lebih mahal, lebih baik beli rok saja, kamu lebih cantik pakai rok.", "b": true, "tr": "07-3"}, {"zh": "今天不比昨天冷，你别穿那么多。", "py": "Jīntiān bù bǐ zuótiān lěng, nǐ bié chuān nàme duō.", "id": "Hari ini tidak lebih dingin daripada kemarin, jangan pakai baju sebanyak itu.", "b": false, "tr": null}, {"zh": "我妹妹不比我矮，我们差不多高。", "py": "Wǒ mèimei bù bǐ wǒ ǎi, wǒmen chàbuduō gāo.", "id": "Adik perempuanku tidak lebih pendek dariku, tinggi kami hampir sama.", "b": false, "tr": null}, {"zh": "坐高铁不比坐飞机慢多少。", "py": "Zuò gāotiě bù bǐ zuò fēijī màn duōshao.", "id": "Naik kereta cepat tidak jauh lebih lambat daripada naik pesawat.", "b": false, "tr": null}, {"zh": "这家饭店的菜不比那家贵。", "py": "Zhè jiā fàndiàn de cài bù bǐ nà jiā guì.", "id": "Masakan di restoran ini tidak lebih mahal daripada restoran itu.", "b": false, "tr": null}, {"zh": "你说他忙？他不比我忙。", "py": "Nǐ shuō tā máng? Tā bù bǐ wǒ máng.", "id": "Kamu bilang dia sibuk? Dia tidak lebih sibuk dariku.", "b": false, "tr": null}, {"zh": "网上的东西不比商店里的便宜多少。", "py": "Wǎngshang de dōngxi bù bǐ shāngdiàn lǐ de piányi duōshao.", "id": "Barang di internet tidak jauh lebih murah daripada di toko.", "b": false, "tr": null}], "salah": [{"s": "他比我不高。", "sp": "Tā bǐ wǒ bù gāo.", "n": "", "b": "他不比我高。", "bp": "Tā bù bǐ wǒ gāo.", "a": "不 diletakkan sebelum 比."}, {"s": "他不比我很高。", "sp": "Tā bù bǐ wǒ hěn gāo.", "n": "", "b": "他不比我高。", "bp": "Tā bù bǐ wǒ gāo.", "a": "Dalam kalimat 比 tidak memakai 很."}, {"s": "裙子不比短裤贵八十块。", "sp": "Qúnzi bù bǐ duǎnkù guì bāshí kuài.", "n": "", "b": "裙子比短裤贵八十块。", "bp": "Qúnzi bǐ duǎnkù guì bāshí kuài.", "a": "Jumlah selisih yang pasti dipakai dengan 比, bukan 不比."}, {"s": "我不比他高。", "sp": "Wǒ bù bǐ tā gāo.", "n": "saya lebih pendek dari dia", "b": "我没有他高。", "bp": "Wǒ méiyǒu tā gāo.", "a": "Untuk \"kalah\", pakai A没有B + KS."}], "latihan": [{"k": "7-2.0", "t": "pg", "q": "A：他一定比你高吧？ B：不，他___我高，我们差不多。", "o": ["不比", "没比", "比不", "不是"], "a": 0, "x": "Membantah, kira-kira sama: 不比."}, {"k": "7-2.1", "t": "pg", "q": "裙子不比短裤贵___。", "o": ["多少", "很多", "一点儿", "极了"], "a": 0, "x": "Pola tetap: 不比……多少 = tidak jauh lebih.", "f": "裙子不比短裤贵多少。", "fp": "Qúnzi bù bǐ duǎnkù guì duōshao."}, {"k": "7-2.2", "t": "pg", "q": "\"Saya tidak setinggi dia (dia lebih tinggi)\" =", "o": ["我没有他高。", "我不比他高。", "我比他不高。", "我不他比高。"], "a": 0, "x": "Kalah = 没有; 不比 berarti kira-kira sama."}, {"k": "7-2.3", "t": "pg", "q": "Arti 他的汉语不比我好 adalah …", "o": ["Bahasa Mandarinnya tidak lebih baik dariku (kira-kira sama).", "Bahasa Mandarinnya jauh lebih buruk dariku.", "Bahasa Mandarinnya lebih baik dariku.", "Dia tidak bisa berbahasa Mandarin."], "a": 0, "x": "不比 = tidak lebih; nuansanya sama saja."}, {"k": "7-2.4", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["他跑得不比我快多少。", "他跑得比我不快。", "他不跑得比我快。", "他跑不比得我快。"], "a": 0, "x": "KK + 得 + 不比 + B + KS."}, {"k": "7-2.5", "t": "pg", "q": "A：网上买东西比商店便宜多了吧？ B：___，差不多。", "o": ["不比商店便宜多少", "比商店便宜多了", "没有便宜", "便宜极了"], "a": 0, "x": "Membantah dengan 不比……多少."}, {"k": "7-2.6", "t": "su", "w": ["裙子", "不比", "短裤", "贵", "多少"], "s": "裙子不比短裤贵多少。", "alt": [], "p": "Qúnzi bù bǐ duǎnkù guì duōshao.", "x": "Roknya tidak jauh lebih mahal daripada celana pendek."}, {"k": "7-2.7", "t": "su", "w": ["他", "的", "中文", "不比", "你", "好"], "s": "他的中文不比你好。", "alt": [], "p": "Tā de Zhōngwén bù bǐ nǐ hǎo.", "x": "Bahasa Mandarinnya tidak lebih baik daripada kamu."}, {"k": "7-2.8", "t": "su", "w": ["今天", "不比", "昨天", "冷"], "s": "今天不比昨天冷。", "alt": ["不比今天昨天冷。"], "p": "Jīntiān bù bǐ zuótiān lěng.", "x": "Hari ini tidak lebih dingin daripada kemarin."}, {"k": "7-2.9", "t": "su", "w": ["他", "跑", "得", "不比", "我", "快", "多少"], "s": "他跑得不比我快多少。", "alt": [], "p": "Tā pǎo de bù bǐ wǒ kuài duōshao.", "x": "Larinya tidak jauh lebih cepat dariku."}, {"k": "7-2.10", "t": "su", "w": ["坐", "高铁", "不比", "坐", "飞机", "慢", "多少"], "s": "坐高铁不比坐飞机慢多少。", "alt": [], "p": "Zuò gāotiě bù bǐ zuò fēijī màn duōshao.", "x": "Naik kereta cepat tidak jauh lebih lambat daripada naik pesawat."}, {"k": "7-2.11", "t": "bs", "s": "这家饭店的菜不比那家贵。", "sp": "Zhè jiā fàndiàn de cài bù bǐ nà jiā guì.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "7-2.12", "t": "bs", "s": "我姐姐比我不高。", "sp": "Wǒ jiějie bǐ wǒ bù gāo.", "n": "", "ok": false, "b": "我姐姐不比我高。", "bp": "Wǒ jiějie bù bǐ wǒ gāo.", "x": "不 harus sebelum 比."}, {"k": "7-2.13", "t": "bs", "s": "这件衣服不比那件很贵。", "sp": "Zhè jiàn yīfu bù bǐ nà jiàn hěn guì.", "n": "", "ok": false, "b": "这件衣服不比那件贵。", "bp": "Zhè jiàn yīfu bù bǐ nà jiàn guì.", "x": "Tidak memakai 很 dalam kalimat 比."}, {"k": "7-2.14", "t": "bs", "s": "他跑得不比我快多少。", "sp": "Tā pǎo de bù bǐ wǒ kuài duōshao.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "7-2.15", "t": "bs", "s": "这本书不比那本难多少。", "sp": "Zhè běn shū bù bǐ nà běn nán duōshao.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "7-3", "pel": 7, "judul": "Pelengkap tingkat (3): KS + 极了", "kode": "程度补语（3）", "rumus": ["KS + 极了", "KK perasaan + 极了 (喜欢极了 / 高兴极了)", "KK + 得 + KS + 极了"], "jelas": ["极了 (jí le) diletakkan SESUDAH kata sifat atau kata kerja perasaan, artinya \"… sekali / … luar biasa\". Menyatakan sifat, keadaan, atau perasaan yang mencapai tingkat sangat tinggi: 这块冰西瓜甜极了 = semangka dingin ini manis sekali.", "Kata kerja perasaan yang bisa dipakai: 喜欢、爱、想、担心、着急 dsb. 这本书我喜欢极了 = aku suka sekali buku ini. Kata kerja biasa (跑, 吃, 说) tidak bisa langsung + 极了; harus memakai pelengkap keadaan dulu: 他跑得快极了.", "极了 sudah berarti \"sangat\", jadi JANGAN memakai 很/非常/太 lagi di depan kata sifatnya. 很好吃极了 salah; cukup 好吃极了. 极了 juga tidak dipakai dalam kalimat ingkar biasa (不好吃极了 tidak wajar) dan jarang dipakai dalam pertanyaan.", "Bandingkan dengan pelengkap tingkat lain: 坏了 (pelajaran 3: 累坏了, 饿坏了, biasanya untuk perasaan tidak enak), 多了 (dalam perbandingan: 好多了 = jauh lebih baik). 极了 netral, bisa untuk hal baik maupun buruk: 好极了, 热极了, 累极了.", "Jebakan bagi pelajar Indonesia: dalam bahasa Indonesia \"sekali\" ada di belakang (\"manis sekali\"), sama dengan Mandarin (甜极了). Tetapi \"sangat\" ada di depan; jangan menggabungkan keduanya seperti \"sangat manis sekali\" → 很甜极了. Pilih salah satu: 很甜 atau 甜极了.", "极了 terdengar ekspresif dan sering dipakai dalam percakapan untuk memuji: 你做的菜好吃极了！太好了→好极了！"], "poin": ["KS / KK perasaan + 极了 = … sekali.", "Tanpa 很/非常/太 di depannya.", "KK biasa: KK + 得 + KS + 极了.", "Bisa untuk hal baik atau buruk."], "contoh": [{"zh": "这块冰西瓜甜极了。", "py": "Zhè kuài bīng xīguā tián jí le.", "id": "Potongan semangka dingin ini manis sekali.", "b": true, "tr": "07-5"}, {"zh": "今年夏天热极了。", "py": "Jīnnián xiàtiān rè jí le.", "id": "Musim panas tahun ini panas sekali.", "b": true, "tr": null}, {"zh": "这本书我喜欢极了。", "py": "Zhè běn shū wǒ xǐhuan jí le.", "id": "Aku suka sekali buku ini.", "b": true, "tr": null}, {"zh": "来，您先尝尝这块冰西瓜，甜极了！", "py": "Lái, nín xiān cháng cháng zhè kuài bīng xīguā, tián jí le!", "id": "Silakan, cicipi dulu semangka dingin ini, manis sekali!", "b": true, "tr": "07-5"}, {"zh": "她做的中国菜好吃极了。", "py": "Tā zuò de Zhōngguó cài hǎochī jí le.", "id": "Masakan Tiongkok buatannya enak sekali.", "b": false, "tr": null}, {"zh": "听说你要来北京，我高兴极了。", "py": "Tīngshuō nǐ yào lái Běijīng, wǒ gāoxìng jí le.", "id": "Mendengar kamu akan datang ke Beijing, aku senang sekali.", "b": false, "tr": null}, {"zh": "昨天工作了十个小时，我累极了。", "py": "Zuótiān gōngzuò le shí gè xiǎoshí, wǒ lèi jí le.", "id": "Kemarin bekerja sepuluh jam, aku capek sekali.", "b": false, "tr": null}, {"zh": "公园里的花漂亮极了。", "py": "Gōngyuán lǐ de huā piàoliang jí le.", "id": "Bunga-bunga di taman indah sekali.", "b": false, "tr": null}, {"zh": "那次去上海玩得开心极了。", "py": "Nà cì qù Shànghǎi wán de kāixīn jí le.", "id": "Waktu itu ke Shanghai, mainnya senang sekali.", "b": false, "tr": null}, {"zh": "他汉语说得好极了。", "py": "Tā Hànyǔ shuō de hǎo jí le.", "id": "Bahasa Mandarinnya bagus sekali.", "b": false, "tr": null}], "salah": [{"s": "这个菜很好吃极了。", "sp": "Zhège cài hěn hǎochī jí le.", "n": "", "b": "这个菜好吃极了。", "bp": "Zhège cài hǎochī jí le.", "a": "极了 sudah berarti sangat; tidak perlu 很."}, {"s": "今天极了热。", "sp": "Jīntiān jí le rè.", "n": "", "b": "今天热极了。", "bp": "Jīntiān rè jí le.", "a": "极了 diletakkan sesudah kata sifat."}, {"s": "他跑极了。", "sp": "Tā pǎo jí le.", "n": "larinya cepat sekali", "b": "他跑得快极了。", "bp": "Tā pǎo de kuài jí le.", "a": "Kata kerja biasa perlu 得 + KS dulu."}, {"s": "我极了喜欢这本书。", "sp": "Wǒ jí le xǐhuan zhè běn shū.", "n": "", "b": "这本书我喜欢极了。", "bp": "Zhè běn shū wǒ xǐhuan jí le.", "a": "极了 di belakang kata kerja perasaan."}], "latihan": [{"k": "7-3.0", "t": "pg", "q": "您尝尝这块西瓜，甜___！", "o": ["极了", "很", "非常", "太"], "a": 0, "x": "KS + 极了 di belakang.", "f": "您尝尝这块西瓜，甜极了！", "fp": "Nín cháng cháng zhè kuài xīguā, tián jí le!"}, {"k": "7-3.1", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["今年夏天热极了。", "今年夏天很热极了。", "今年夏天极了热。", "今年夏天非常热极了。"], "a": 0, "x": "Tanpa 很/非常, 极了 di belakang."}, {"k": "7-3.2", "t": "pg", "q": "\"Larinya cepat sekali\" =", "o": ["他跑得快极了。", "他跑极了。", "他极了跑得快。", "他快跑极了。"], "a": 0, "x": "KK + 得 + KS + 极了."}, {"k": "7-3.3", "t": "pg", "q": "这本书我喜欢___。", "o": ["极了", "坏了", "多了", "得了"], "a": 0, "x": "Kata kerja perasaan + 极了.", "f": "这本书我喜欢极了。", "fp": "Zhè běn shū wǒ xǐhuan jí le."}, {"k": "7-3.4", "t": "pg", "q": "Mana yang TIDAK bisa diikuti 极了?", "o": ["好吃", "高兴", "喜欢", "吃饭"], "a": 3, "x": "吃饭 kata kerja biasa, bukan sifat/perasaan."}, {"k": "7-3.5", "t": "pg", "q": "A：考试怎么样？ B：考得好___！", "o": ["极了", "很", "太", "非常"], "a": 0, "x": "KK + 得 + KS + 极了."}, {"k": "7-3.6", "t": "su", "w": ["这", "块", "冰", "西瓜", "甜", "极了"], "s": "这块冰西瓜甜极了。", "alt": [], "p": "Zhè kuài bīng xīguā tián jí le.", "x": "Potongan semangka dingin ini manis sekali."}, {"k": "7-3.7", "t": "su", "w": ["今年", "夏天", "热", "极了"], "s": "今年夏天热极了。", "alt": ["夏天今年热极了。"], "p": "Jīnnián xiàtiān rè jí le.", "x": "Musim panas tahun ini panas sekali."}, {"k": "7-3.8", "t": "su", "w": ["这", "本", "书", "我", "喜欢", "极了"], "s": "这本书我喜欢极了。", "alt": [], "p": "Zhè běn shū wǒ xǐhuan jí le.", "x": "Aku suka sekali buku ini."}, {"k": "7-3.9", "t": "su", "w": ["她", "做", "的", "中国菜", "好吃", "极了"], "s": "她做的中国菜好吃极了。", "alt": [], "p": "Tā zuò de Zhōngguó cài hǎochī jí le.", "x": "Masakan Tiongkok buatannya enak sekali."}, {"k": "7-3.10", "t": "su", "w": ["他", "汉语", "说", "得", "好", "极了"], "s": "他汉语说得好极了。", "alt": [], "p": "Tā Hànyǔ shuō de hǎo jí le.", "x": "Bahasa Mandarinnya bagus sekali."}, {"k": "7-3.11", "t": "bs", "s": "公园里的花漂亮极了。", "sp": "Gōngyuán lǐ de huā piàoliang jí le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "7-3.12", "t": "bs", "s": "我今天很累极了。", "sp": "Wǒ jīntiān hěn lèi jí le.", "n": "", "ok": false, "b": "我今天累极了。", "bp": "Wǒ jīntiān lèi jí le.", "x": "Hilangkan 很."}, {"k": "7-3.13", "t": "bs", "s": "听说你要来，我高兴极了。", "sp": "Tīngshuō nǐ yào lái, wǒ gāoxìng jí le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: kata sifat perasaan + 极了."}, {"k": "7-3.14", "t": "bs", "s": "他写极了汉字。", "sp": "Tā xiě jí le Hànzì.", "n": "", "ok": false, "b": "他汉字写得好极了。", "bp": "Tā Hànzì xiě de hǎo jí le.", "x": "Kata kerja biasa: KK + 得 + KS + 极了."}, {"k": "7-3.15", "t": "bs", "s": "这次旅游我们玩得开心极了。", "sp": "Zhè cì lǚyóu wǒmen wán de kāixīn jí le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "7-4", "pel": 7, "judul": "Kalimat bertingkat: 不但……，而且……", "kode": "递进复句\"不但……，而且……\"", "rumus": ["S + 不但 + A，而且 + B (subjek sama)", "不但 + S₁ + A，而且 + S₂ + 也 + B (subjek beda)", "而且 sering diikuti 也/还"], "jelas": ["不但……，而且…… artinya \"tidak hanya …, tetapi juga …\". Kalimat kedua menambah informasi yang lebih jauh atau lebih kuat daripada kalimat pertama: 现在的电视不但便宜，而且用着非常方便.", "Posisi 不但 bergantung pada subjek. Jika KEDUA klausa subjeknya SAMA, 不但 diletakkan SESUDAH subjek: 家月不但喜欢唱歌，而且唱得很好听. Jika subjeknya BERBEDA, 不但 diletakkan SEBELUM subjek pertama: 不但家月会说汉语，而且天中也会说汉语.", "Pada klausa kedua, 而且 di awal, sering diperkuat dengan 也 atau 还 sebelum kata kerja: 他不但会说汉语，而且还会写汉字. Subjek yang sama tidak diulang di klausa kedua.", "Isi kedua klausa harus searah (sama-sama positif atau sama-sama negatif) dan klausa kedua biasanya \"lebih\": 冬天不但冷，而且风很大. Jangan memakai 但是 sebagai pasangan 不但; pasangannya 而且. Jangan memakai 所以 juga, karena ini bukan sebab-akibat.", "Jebakan bagi pelajar Indonesia: \"tidak hanya\" dalam bahasa Indonesia biasanya di awal kalimat (\"Tidak hanya Jiayue suka menyanyi, ...\"), sehingga pelajar cenderung selalu menaruh 不但 di awal. Ingat: kalau subjeknya sama, 不但 di belakang subjek.", "Bandingkan dengan 又……又…… (pelajaran 2): 西瓜又大又新鲜 hanya menggabungkan dua sifat setara. 不但……而且…… memberi kesan menambah dan menekankan bagian kedua, dan bisa menggabungkan kalimat yang panjang."], "poin": ["不但……，而且…… = tidak hanya …, tetapi juga ….", "Subjek sama: 不但 sesudah subjek.", "Subjek beda: 不但 sebelum subjek pertama.", "Pasangan 不但 adalah 而且 (+ 也/还), bukan 但是."], "contoh": [{"zh": "现在的电视不但便宜，而且用着非常方便。", "py": "Xiànzài de diànshì búdàn piányi, érqiě yòng zhe fēicháng fāngbiàn.", "id": "TV sekarang tidak hanya murah, tetapi juga sangat praktis dipakai.", "b": true, "tr": "07-7"}, {"zh": "家月不但喜欢唱歌，而且唱得很好听。", "py": "Jiāyuè búdàn xǐhuan chànggē, érqiě chàng de hěn hǎotīng.", "id": "Jiayue tidak hanya suka menyanyi, tetapi suaranya juga merdu.", "b": true, "tr": null}, {"zh": "不但家月会说汉语，而且天中也会说汉语。", "py": "Búdàn Jiāyuè huì shuō Hànyǔ, érqiě Tiānzhōng yě huì shuō Hànyǔ.", "id": "Tidak hanya Jiayue yang bisa berbahasa Mandarin, Tianzhong juga bisa.", "b": true, "tr": null}, {"zh": "冬天不但冷，而且风很大。", "py": "Dōngtiān búdàn lěng, érqiě fēng hěn dà.", "id": "Musim dingin tidak hanya dingin, tetapi anginnya juga kencang.", "b": true, "tr": "12-7"}, {"zh": "高铁不但快，而且很舒服。", "py": "Gāotiě búdàn kuài, érqiě hěn shūfu.", "id": "Kereta cepat tidak hanya cepat, tetapi juga nyaman.", "b": false, "tr": null}, {"zh": "他不但是我的老师，而且是我的好朋友。", "py": "Tā búdàn shì wǒ de lǎoshī, érqiě shì wǒ de hǎo péngyou.", "id": "Dia tidak hanya guruku, tetapi juga teman baikku.", "b": false, "tr": null}, {"zh": "不但我喜欢这家饭店，而且我爸妈也喜欢。", "py": "Búdàn wǒ xǐhuan zhè jiā fàndiàn, érqiě wǒ bà mā yě xǐhuan.", "id": "Tidak hanya aku yang suka restoran ini, ayah ibuku juga suka.", "b": false, "tr": null}, {"zh": "这件衣服不但好看，而且不贵。", "py": "Zhè jiàn yīfu búdàn hǎokàn, érqiě bú guì.", "id": "Baju ini tidak hanya bagus, tetapi juga tidak mahal.", "b": false, "tr": null}, {"zh": "她不但会做中国菜，而且做得很好吃。", "py": "Tā búdàn huì zuò Zhōngguó cài, érqiě zuò de hěn hǎochī.", "id": "Dia tidak hanya bisa memasak masakan Tiongkok, tetapi masakannya juga enak.", "b": false, "tr": null}, {"zh": "在网上买东西不但方便，而且还能送到家。", "py": "Zài wǎngshang mǎi dōngxi búdàn fāngbiàn, érqiě hái néng sòng dào jiā.", "id": "Belanja di internet tidak hanya praktis, tetapi juga bisa diantar ke rumah.", "b": false, "tr": null}], "salah": [{"s": "不但他喜欢唱歌，而且喜欢跳舞。", "sp": "Búdàn tā xǐhuan chànggē, érqiě xǐhuan tiàowǔ.", "n": "", "b": "他不但喜欢唱歌，而且喜欢跳舞。", "bp": "Tā búdàn xǐhuan chànggē, érqiě xǐhuan tiàowǔ.", "a": "Subjek sama → 不但 sesudah subjek."}, {"s": "家月不但会说汉语，而且天中也会说。", "sp": "Jiāyuè búdàn huì shuō Hànyǔ, érqiě Tiānzhōng yě huì shuō.", "n": "", "b": "不但家月会说汉语，而 ["Arti dasar 下去 adalah \"turun (menjauh dari pembicara)\". Dalam penggunaan kiasan, 下去 sesudah kata kerja atau kata sifat berarti tindakan atau keadaan yang SUDAH dimulai akan TERUS berlanjut ke depan: 后面的你读下去 = yang berikutnya kamu lanjutkan membacanya.", "Dengan kata sifat, 下去 menyatakan keadaan yang terus bertambah atau berlanjut, sering dalam kalimat yang menyatakan kekhawatiran: 不能再胖下去了 (tidak boleh terus bertambah gemuk), 如果再热下去就不能出门了 (kalau terus panas begini, tidak bisa keluar rumah).", "Pola yang sangat sering: 再 + KK/KS + 下去, dan 一直 + KK + 下去: 我想一直学下去 (aku ingin terus belajar). Bentuk ingkar: 不想……下去, 不能……下去: 我不想在这里住下去了.", "Objek biasanya TIDAK diletakkan sesudah 下去. Taruh objek di depan sebagai topik: 汉语我想学下去, atau pakai kata kerja tanpa objek jika sudah jelas: 这本书太有意思了，我想一直看下去.", "Bandingkan dengan 起来 (pelajaran 12: mulai) dan 下来 (pelajaran 12: berhasil diselesaikan dari dulu sampai sekarang). 下去 menghadap ke DEPAN (dari sekarang ke masa depan): 学下去 = terus belajar. 下来 menghadap ke masa lalu: 学下来了 = berhasil menyelesaikan belajarnya.", "Jebakan bagi pelajar Indonesia: kata \"terus\" atau \"lanjut\" dalam bahasa Indonesia biasanya di depan kata kerja (\"terus belajar\"). Dalam Mandarin cukup tambahkan 下去 di belakang kata kerja; 一直/再 di depan hanya penguat. Jangan bilang 我继续下去学."], "poin": ["KK/KS + 下去 = terus berlanjut ke depan.", "Sering: 再……下去 / 一直……下去.", "Objek ditaruh di depan, bukan sesudah 下去.", "下去 (ke depan) ≠ 下来 (selesai sampai sekarang)."], "contoh": [{"zh": "我今年胖了十多斤，不能再胖下去了。", "py": "Wǒ jīnnián pàng le shí duō jīn, bù néng zài pàng xiàqù le.", "id": "Tahun ini berat badanku naik lebih dari sepuluh jin, tidak boleh terus bertambah gemuk.", "b": true, "tr": "08-1"}, {"zh": "她读完了第一个问题，后面的你读下去。", "py": "Tā dú wán le dìyī gè wèntí, hòumiàn de nǐ dú xiàqù.", "id": "Dia sudah membaca soal pertama, yang berikutnya kamu lanjutkan membacanya.", "b": true, "tr": null}, {"zh": "这几天太热了，如果再热下去就不能出门了。", "py": "Zhè jǐ tiān tài rè le, rúguǒ zài rè xiàqù jiù bù néng chūmén le.", "id": "Beberapa hari ini panas sekali, kalau terus panas begini tidak bisa keluar rumah.", "b": true, "tr": null}, {"zh": "这本书太有意思了，我想一直看下去。", "py": "Zhè běn shū tài yǒuyìsi le, wǒ xiǎng yìzhí kàn xiàqù.", "id": "Buku ini menarik sekali, aku ingin terus membacanya.", "b": false, "tr": null}, {"zh": "现在她很喜欢汉语，还打算学下去。", "py": "Xiànzài tā hěn xǐhuan Hànyǔ, hái dǎsuàn xué xiàqù.", "id": "Sekarang dia sangat suka bahasa Mandarin, dan berencana terus mempelajarinya.", "b": false, "tr": null}, {"zh": "别停，你说下去。", "py": "Bié tíng, nǐ shuō xiàqù.", "id": "Jangan berhenti, lanjutkan bicaramu.", "b": false, "tr": null}, {"zh": "我不想在这里住下去了，下个星期就去找新房子。", "py": "Wǒ bù xiǎng zài zhèlǐ zhù xiàqù le, xià gè xīngqī jiù qù zhǎo xīn fángzi.", "id": "Aku tidak mau terus tinggal di sini, minggu depan langsung cari rumah baru.", "b": false, "tr": null}, {"zh": "雨再下下去，我们就不能去公园了。", "py": "Yǔ zài xià xiàqù, wǒmen jiù bù néng qù gōngyuán le.", "id": "Kalau hujan terus turun, kita tidak bisa ke taman.", "b": false, "tr": null}, {"zh": "如果你再这样忙下去，身体会不好的。", "py": "Rúguǒ nǐ zài zhèyàng máng xiàqù, shēntǐ huì bù hǎo de.", "id": "Kalau kamu terus sibuk begini, badanmu bisa sakit.", "b": false, "tr": null}, {"zh": "这个工作虽然很累，但是我会做下去。", "py": "Zhège gōngzuò suīrán hěn lèi, dànshì wǒ huì zuò xiàqù.", "id": "Pekerjaan ini memang melelahkan, tapi aku akan terus mengerjakannya.", "b": false, "tr": null}], "salah": [{"s": "我想学下去汉语。", "sp": "Wǒ xiǎng xué xiàqù Hànyǔ.", "n": "", "b": "汉语我想学下去。", "bp": "Hànyǔ wǒ xiǎng xué xiàqù.", "a": "Objek tidak diletakkan sesudah 下去; taruh di depan."}, {"s": "你说下来。", "sp": "Nǐ shuō xiàlái.", "n": "lanjutkan bicaramu", "b": "你说下去。", "bp": "Nǐ shuō xiàqù.", "a": "Melanjutkan ke depan = 下去."}, {"s": "我不能胖再下去了。", "sp": "Wǒ bù néng pàng zài xiàqù le.", "n": "", "b": "我不能再胖下去了。", "bp": "Wǒ bù néng zài pàng xiàqù le.", "a": "再 sebelum kata kerja/sifat: 再胖下去."}], "latihan": [{"k": "8-1.0", "t": "pg", "q": "我今年胖了十多斤，不能再胖___了。", "o": ["下去", "下来", "起来", "出来"], "a":
