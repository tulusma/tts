", "py": "Jīntiān shì wǒmen lǚyóu de dìyī tiān."}, {"s": "", "zh": "我们很早就起床去机场了，没想到飞机晚点了。", "id": "Kami bangun pagi-pagi sekali lalu berangkat ke bandara, tidak disangka pesawatnya terlambat.", "tr": "04-7", "py": "Wǒmen hěn zǎo jiù qǐchuáng qù jīchǎng le, méi xiǎng dào fēijī wǎndiǎn le."}, {"s": "", "zh": "我们到的时候，天已经黑了，但是司机小李一直在机场等我们，一点儿也没着急。", "id": "Saat kami tiba, hari sudah gelap, tetapi sopir kami, Xiao Li, terus menunggu kami di bandara dan sama sekali tidak gelisah.", "tr": "04-7", "py": "Wǒmen dào de shíhou, tiān yǐjīng hēi le, dànshì sījī Xiǎo Lǐ yìzhí zài jīchǎng děng wǒmen, yìdiǎnr yě méi zháojí."}, {"s": "", "zh": "他特别热情，路上给我们介绍了很多东西，还准备了水果。", "id": "Dia sangat ramah, di jalan dia memperkenalkan banyak hal kepada kami, dan juga menyiapkan buah.", "tr": "04-7", "py": "Tā tèbié rèqíng, lùshang gěi wǒmen jièshào le hěn duō dōngxi, hái zhǔnbèi le shuǐguǒ."}, {"s": "", "zh": "宾馆的房间跟我想的一样漂亮，又大又干净，我非常满意。", "id": "Kamar hotelnya seindah yang kubayangkan, luas dan bersih, aku sangat puas.", "tr": "04-7", "py": "Bīnguǎn de fángjiān gēn wǒ xiǎng de yíyàng piàoliang, yòu dà yòu gānjìng, wǒ fēicháng mǎnyì."}], "teks": [{"tr": "04-1", "nama": "课文1 · Liburan ke padang rumput"}, {"tr": "04-3", "nama": "课文2 · Hotel yang istimewa"}, {"tr": "04-5", "nama": "课文3 · Dijemput sopir"}, {"tr": "04-7", "nama": "课文4 · Hari pertama liburan"}]}, "5": {"judul": "这样的照片才好看", "arti": "Foto seperti inilah yang bagus", "kata": [{"h": "总是", "p": "zǒngshì", "k": "副", "a": "selalu"}, {"h": "终于", "p": "zhōngyú", "k": "副", "a": "akhirnya"}, {"h": "爬", "p": "pá", "k": "动", "a": "mendaki, memanjat"}, {"h": "山", "p": "shān", "k": "名", "a": "gunung, bukit"}, {"h": "锻炼", "p": "duànliàn", "k": "动", "a": "berolahraga, melatih (badan)"}, {"h": "照", "p": "zhào", "k": "动", "a": "memotret"}, {"h": "鞋", "p": "xié", "k": "名", "a": "sepatu"}, {"h": "大衣", "p": "dàyī", "k": "名", "a": "mantel"}, {"h": "拍照", "p": "pāizhào", "k": "动", "a": "memotret, berfoto"}, {"h": "感兴趣", "p": "gǎn xìngqù", "k": "动", "a": "tertarik (pada)"}, {"h": "照相", "p": "zhàoxiàng", "k": "动", "a": "memotret, berfoto"}, {"h": "难看", "p": "nánkàn", "k": "形", "a": "jelek (dilihat)"}, {"h": "比较", "p": "bǐjiào", "k": "动/副", "a": "membandingkan; relatif, cukup"}, {"h": "水平", "p": "shuǐpíng", "k": "名", "a": "tingkat, kemampuan"}, {"h": "太阳", "p": "tàiyáng", "k": "名", "a": "matahari"}, {"h": "树", "p": "shù", "k": "名", "a": "pohon"}, {"h": "干", "p": "gàn", "k": "动", "a": "melakukan, mengerjakan"}, {"h": "电", "p": "diàn", "k": "名", "a": "listrik; baterai (daya)"}, {"h": "收到", "p": "shōudào", "k": "动", "a": "menerima"}, {"h": "封", "p": "fēng", "k": "量", "a": "penggolong untuk surat/email"}, {"h": "邮件", "p": "yóujiàn", "k": "名", "a": "email, surat"}, {"h": "难过", "p": "nánguò", "k": "形", "a": "sedih"}, {"h": "哈哈", "p": "hāhā", "k": "-", "a": "haha (suara tertawa)"}, {"h": "音乐", "p": "yīnyuè", "k": "名", "a": "musik"}, {"h": "兴趣", "p": "xìngqù", "k": "名", "a": "minat"}, {"h": "会", "p": "huì", "k": "名", "a": "pertemuan, acara"}, {"h": "结束", "p": "jiéshù", "k": "动", "a": "selesai, berakhir"}], "dialog": [{"s": "白家月", "zh": "这个星期总是阴天，今天终于晴了。", "id": "Minggu ini selalu mendung, hari ini akhirnya cerah.", "tr": "05-1", "py": "Zhège xīngqī zǒngshì yīn tiān, jīntiān zhōngyú qíng le."}, {"s": "李文", "zh": "现在天气好得很！我们去爬山怎么样？", "id": "Cuacanya sekarang bagus sekali! Bagaimana kalau kita mendaki gunung?", "tr": "05-1", "py": "Xiànzài tiānqì hǎo de hěn! Wǒmen qù pá shān zěnmeyàng?"}, {"s": "白家月", "zh": "好啊！又能锻炼身体，又能照好看的照片。", "id": "Boleh! Bisa berolahraga sekaligus memotret foto yang bagus.", "tr": "05-1", "py": "Hǎo a! Yòu néng duànliàn shēntǐ, yòu néng zhào hǎokàn de zhàopiàn."}, {"s": "李文", "zh": "那我带点儿水和吃的，咱们现在就去？", "id": "Kalau begitu aku bawa sedikit air dan makanan, kita berangkat sekarang?", "tr": "05-1", "py": "Nà wǒ dài diǎnr shuǐ hé chī de, zánmen xiànzài jiù qù?"}, {"s": "白家月", "zh": "我回去穿上运动鞋，拿上大衣。要不要叫一雪姐一起去？", "id": "Aku pulang dulu memakai sepatu olahraga dan mengambil mantel. Perlu ajak Kak Yixue sekalian?", "tr": "05-1", "py": "Wǒ huíqù chuān shàng yùndòng xié, ná shàng dàyī. Yào bu yào jiào Yīxuě jiě yìqǐ qù?"}, {"s": "李文", "zh": "好主意。给她打个电话吧。", "id": "Ide bagus. Telepon dia saja.", "tr": "05-1", "py": "Hǎo zhǔyi. Gěi tā dǎ gè diànhuà ba."}, {"s": "白家月", "zh": "这些照片是谁给您照的？张张都非常好看。", "id": "Foto-foto ini siapa yang memotret Kakak? Setiap lembarnya bagus sekali.", "tr": "05-3", "py": "Zhèxiē zhàopiàn shì shéi gěi nín zhào de? Zhāng Zhāng dōu fēicháng hǎokàn."}, {"s": "王一雪", "zh": "一飞。她对拍照一直很感兴趣，经常给我照相。", "id": "Yifei. Dia sejak dulu tertarik memotret, sering memotret aku.", "tr": "05-3", "py": "Yīfēi. Tā duì pāizhào yìzhí hěn gǎnxìngqù, jīngcháng gěi wǒ zhàoxiàng."}, {"s": "白家月", "zh": "我喜欢您大笑的这张，看起来很漂亮。", "id": "Aku suka yang ini, waktu Kakak tertawa lebar, kelihatan cantik sekali.", "tr": "05-3", "py": "Wǒ xǐhuan nín dà xiào de zhè Zhāng, kàn qǐlái hěn piàoliang."}, {"s": "王一雪", "zh": "我觉得这张有点儿难看，那时候我不知道她在给我照相。", "id": "Menurutku yang ini agak jelek, waktu itu aku tidak tahu dia sedang memotretku.", "tr": "05-3", "py": "Wǒ juéde zhè Zhāng yǒudiǎnr nánkàn, nà shíhou wǒ bù zhīdào tā zài gěi wǒ zhàoxiàng."}, {"s": "白家月", "zh": "这样的照片才好看。我也喜欢拍照，爬山的时候我给您照几张照片吧。", "id": "Foto seperti inilah yang bagus. Aku juga suka memotret, nanti waktu mendaki aku foto Kakak beberapa kali, ya.", "tr": "05-3", "py": "Zhèyàng de zhàopiàn cái hǎokàn. Wǒ yě xǐhuan pāizhào, pá shān de shíhou wǒ gěi nín zhào jǐ Zhāng zhàopiàn ba."}, {"s": "王一雪", "zh": "好，我可以比较一下你们两个谁的水平高。", "id": "Baik, aku bisa membandingkan siapa di antara kalian berdua yang lebih jago.", "tr": "05-3", "py": "Hǎo, wǒ kěyǐ bǐjiào yíxià nǐmen liǎng gè shéi de shuǐpíng gāo."}, {"s": "王一雪", "zh": "家月，这里挺漂亮的，咱们在这里拍照吧。", "id": "Jiayue, di sini cukup indah, ayo kita berfoto di sini.", "tr": "05-5", "py": "Jiāyuè, zhèlǐ tǐng piàoliang de, zánmen zài zhèlǐ pāizhào ba."}, {"s": "白家月", "zh": "这边没有太阳，咱们去那边吧。", "id": "Di sebelah sini tidak ada sinar matahari, ayo ke sebelah sana.", "tr": "05-5", "py": "Zhèbiān méiyǒu tàiyáng, zánmen qù nàbiān ba."}, {"s": "王一雪", "zh": "好。你觉得我站在这些树中间怎么样？", "id": "Oke. Bagaimana kalau aku berdiri di tengah pohon-pohon ini?", "tr": "05-5", "py": "Hǎo. Nǐ juéde wǒ zhàn zài zhèxiē shù zhōngjiān zěnmeyàng?"}, {"s": "白家月", "zh": "挺好的。等一下，后边走过去两个人。", "id": "Bagus. Tunggu sebentar, di belakang ada dua orang lewat.", "tr": "05-5", "py": "Tǐng hǎo de. Děng yíxià, hòubian zǒu guòqù liǎng gè rén."}, {"s": "王一雪", "zh": "我准备好了，你照的时候告诉我。", "id": "Aku sudah siap, beri tahu aku waktu kamu memotret.", "tr": "05-5", "py": "Wǒ zhǔnbèi hǎo le, nǐ zhào de shíhou gàosu wǒ."}, {"s": "白家月", "zh": "你不用看着我，想干什么都可以。", "id": "Kamu tidak perlu melihat ke arahku, mau melakukan apa saja boleh.", "tr": "05-5", "py": "Nǐ búyòng kàn zhe wǒ, xiǎng gàn shénme dōu kěyǐ."}, {"s": "王一雪", "zh": "树上飞来了几只鸟，我就看它们吧。", "id": "Ada beberapa burung terbang ke pohon, aku lihat mereka saja.", "tr": "05-5", "py": "Shù shàng fēi lái le jǐ zhī niǎo, wǒ jiù kàn tāmen ba."}, {"s": "白家月", "zh": "啊，手机没电了。", "id": "Aduh, baterai ponselku habis.", "tr": "05-5", "py": "A, shǒujī méi diàn le."}, {"s": "", "zh": "家月，我收到了你的那封邮件，也看到了你给我照的照片，张张都很漂亮。", "id": "Jiayue, aku sudah menerima emailmu itu, juga sudah melihat foto yang kamu ambil untukku, setiap lembarnya cantik.", "tr": "05-7", "py": "Jiāyuè, wǒ shōudào le nǐ de nà fēng yóujiàn, yě kàn dào le nǐ gěi wǒ zhào de zhàopiàn, Zhāng Zhāng dōu hěn piàoliang."}, {"s": "", "zh": "我已经告诉了一飞，你的拍照水平比她高，她难过得很，哈哈。", "id": "Aku sudah bilang ke Yifei bahwa kemampuan memotretmu lebih tinggi daripada dia, dia sedih sekali, haha.", "tr": "05-7", "py": "Wǒ yǐjīng gàosu le Yīfēi, nǐ de pāizhào shuǐpíng bǐ tā gāo, tā nánguò de hěn, hāhā."}, {"s": "", "zh": "不知道你对中国的音乐有没有兴趣？", "id": "Entah kamu tertarik atau tidak pada musik Tiongkok?", "tr": "05-7", "py": "Bù zhīdào nǐ duì Zhōngguó de yīnyuè yǒu méiyǒu xìngqù?"}, {"s": "", "zh": "我送你一张明天下午音乐会的门票。", "id": "Aku berikan kamu satu tiket konser besok sore.", "tr": "05-7", "py": "Wǒ sòng nǐ yì Zhāng míngtiān xiàwǔ yīnyuè huì de ménpiào."}, {"s": "", "zh": "音乐会七点多结束，你听完了音乐会就来我家吃饭，尝尝我做的中国菜。", "id": "Konsernya selesai lewat pukul tujuh, setelah selesai menonton konser langsung saja datang makan di rumahku, cicipi masakan Tiongkok buatanku.", "tr": "05-7", "py": "Yīnyuè huì qī diǎn duō jiéshù, nǐ tīng wán le yīnyuè huì jiù lái wǒ jiā chīfàn, cháng cháng wǒ zuò de Zhōngguó cài."}, {"s": "", "zh": "你觉得怎么样？", "id": "Bagaimana menurutmu?", "tr": "05-7", "py": "Nǐ juéde zěnmeyàng?"}], "teks": [{"tr": "05-1", "nama": "课文1 · Ayo mendaki gunung"}, {"tr": "05-3", "nama": "课文2 · Siapa yang memotret?"}, {"tr": "05-5", "nama": "课文3 · Berfoto di gunung"}, {"tr": "05-7", "nama": "课文4 · Pesan untuk Jiayue"}]}, "6": {"judul": "高铁上还可以点外卖", "arti": "Di kereta cepat pun bisa pesan makanan antar", "kata": [{"h": "该", "p": "gāi", "k": "能愿", "a": "sudah waktunya, seharusnya"}, {"h": "打算", "p": "dǎsuàn", "k": "动/名", "a": "berencana; rencana"}, {"h": "高铁", "p": "gāotiě", "k": "名", "a": "kereta cepat"}, {"h": "行", "p": "xíng", "k": "动/形", "a": "boleh, oke; cakap, hebat"}, {"h": "路口", "p": "lùkǒu", "k": "名", "a": "persimpangan jalan"}, {"h": "小心", "p": "xiǎoxīn", "k": "动/形", "a": "berhati-hati; hati-hati"}, {"h": "迟到", "p": "chídào", "k": "动", "a": "terlambat (datang)"}, {"h": "红绿灯", "p": "hónglǜdēng", "k": "名", "a": "lampu lalu lintas"}, {"h": "后来", "p": "hòulái", "k": "名", "a": "kemudian, setelah itu"}, {"h": "急", "p": "jí", "k": "形/动", "a": "mendesak; cemas, panik"}, {"h": "如果", "p": "rúguǒ", "k": "连", "a": "jika, kalau"}, {"h": "以前", "p": "yǐqián", "k": "名", "a": "sebelum(nya), dulu"}, {"h": "耳机", "p": "ěrjī", "k": "名", "a": "earphone, headphone"}, {"h": "充电宝", "p": "chōngdiànbǎo", "k": "名", "a": "power bank"}, {"h": "常用", "p": "cháng yòng", "k": "-", "a": "sering dipakai"}, {"h": "越", "p": "yuè", "k": "副", "a": "makin (越……越……)"}, {"h": "分开", "p": "fēnkāi", "k": "动", "a": "berpisah, memisahkan"}, {"h": "检查", "p": "jiǎnchá", "k": "动", "a": "memeriksa"}, {"h": "刷", "p": "shuā", "k": "动", "a": "memindai, menggesek (kartu)"}, {"h": "检票", "p": "jiǎnpiào", "k": "动", "a": "memeriksa tiket"}, {"h": "电梯", "p": "diàntī", "k": "名", "a": "lift, eskalator"}, {"h": "放假", "p": "fàngjià", "k": "动", "a": "libur"}, {"h": "沙发", "p": "shāfā", "k": "名", "a": "sofa"}, {"h": "安静", "p": "ānjìng", "k": "形", "a": "tenang, sepi"}, {"h": "选择", "p": "xuǎnzé", "k": "动", "a": "memilih"}, {"h": "必须", "p": "bìxū", "k": "副", "a": "harus"}, {"h": "北京南站", "p": "Běijīng Nán Zhàn", "k": "专名", "a": "Stasiun Beijing Selatan"}], "dialog": [{"s": "李文", "zh": "家月，咱们该买去上海的票了。你打算怎么去上海？", "id": "Jiayue, sudah waktunya kita membeli tiket ke Shanghai. Kamu berencana ke Shanghai naik apa?", "tr": "06-1", "py": "Jiāyuè, zánmen gāi mǎi qù Shànghǎi de piào le. Nǐ dǎsuàn zěnme qù Shànghǎi?"}, {"s": "白家月", "zh": "我还没坐过高铁，咱们坐高铁去，怎么样？", "id": "Aku belum pernah naik kereta cepat, bagaimana kalau kita naik kereta cepat?", "tr": "06-1", "py": "Wǒ hái méi zuò guò gāotiě, zánmen zuò gāotiě qù, zěnmeyàng?"}, {"s": "李文", "zh": "没问题，从北京到上海的高铁很多，非常方便。", "id": "Boleh, kereta cepat dari Beijing ke Shanghai banyak, sangat praktis.", "tr": "06-1", "py": "Méi wèntí, cóng Běijīng dào Shànghǎi de gāotiě hěn duō, fēicháng fāngbiàn."}, {"s": "白家月", "zh": "行！怎么买高铁票？", "id": "Oke! Bagaimana cara membeli tiket kereta cepat?", "tr": "06-1", "py": "Xíng! Zěnme mǎi gāotiě piào?"}, {"s": "李文", "zh": "用手机App就能买。给我你的护照，我帮你买。", "id": "Bisa dibeli lewat aplikasi di ponsel. Berikan paspormu, aku belikan.", "tr": "06-1", "py": "Yòng shǒujī A p p jiù néng mǎi. Gěi wǒ nǐ de hùzhào, wǒ bāng nǐ mǎi."}, {"s": "白家月", "zh": "早就听说过高铁，终于可以坐上了。", "id": "Sudah lama aku mendengar tentang kereta cepat, akhirnya bisa naik juga.", "tr": "06-1", "py": "Zǎo jiù tīngshuō guò gāotiě, zhōngyú kěyǐ zuò shàng le."}, {"s": "李文", "zh": "高铁又快又舒服，你一定会喜欢的。", "id": "Kereta cepat itu cepat dan nyaman, kamu pasti akan suka.", "tr": "06-1", "py": "Gāotiě yòu kuài yòu shūfu, nǐ yídìng huì xǐhuan de."}, {"s": "刘明", "zh": "过了前面的路口就到高铁站了。", "id": "Lewat persimpangan di depan, sudah sampai di stasiun kereta cepat.", "tr": "06-3", "py": "Guò le qiánmiàn de lùkǒu jiù dào gāotiě zhàn le."}, {"s": "白家月", "zh": "我看见了。马上就到了，这条路车很多，您小心点儿。", "id": "Aku sudah lihat. Sebentar lagi sampai, jalan ini banyak mobilnya, hati-hati ya.", "tr": "06-3", "py": "Wǒ kànjiàn le. Mǎshàng jiù dào le, zhè tiáo lù chē hěn duō, nín xiǎoxīn diǎnr."}, {"s": "刘明", "zh": "好，你们还有一个小时，应该不会迟到的。", "id": "Baik, kalian masih punya satu jam, seharusnya tidak akan terlambat.", "tr": "06-3", "py": "Hǎo, nǐmen hái yǒu yí gè xiǎoshí, yīnggāi bú huì chídào de."}, {"s": "白家月", "zh": "我发现这条路车多，红绿灯也多。", "id": "Aku perhatikan jalan ini banyak mobil, lampu lalu lintasnya juga banyak.", "tr": "06-3", "py": "Wǒ fāxiàn zhè tiáo lù chē duō, hónglǜdēng yě duō."}, {"s": "刘明", "zh": "是啊，这条路我走过一次，后来再也不走了。", "id": "Iya, aku pernah lewat jalan ini sekali, setelah itu tidak pernah lewat lagi.", "tr": "06-3", "py": "Shì a, zhè tiáo lù wǒ zǒu guò yí cì, hòulái zài yě bù zǒu le."}, {"s": "白家月", "zh": "那您今天为什么走了这条路？", "id": "Lalu kenapa hari ini Anda lewat jalan ini?", "tr": "06-3", "py": "Nà nín jīntiān wèishénme zǒu le zhè tiáo lù?"}, {"s": "刘明", "zh": "我一急就走错了。如果没走错，二十分钟以前就到了。", "id": "Begitu panik aku jadi salah jalan. Kalau tidak salah jalan, dua puluh menit yang lalu sudah sampai.", "tr": "06-3", "py": "Wǒ yì jí jiù zǒu cuò le. Rúguǒ méi zǒu cuò, èrshí fēnzhōng yǐqián jiù dào le."}, {"s": "白家月", "zh": "李文，我的耳机没电了，你有充电宝吗？", "id": "Li Wen, baterai earphone-ku habis, kamu punya power bank?", "tr": "06-5", "py": "Lǐ Wén, wǒ de ěrjī méi diàn le, nǐ yǒu chōngdiànbǎo ma?"}, {"s": "李文", "zh": "有，这些常用的东西我都放在包里了，我给你拿。", "id": "Punya, barang-barang yang sering dipakai ini semua kutaruh di tas, aku ambilkan.", "tr": "06-5", "py": "Yǒu, zhèxiē chángyòng de dōngxi wǒ dōu fàng zài bāo lǐ le, wǒ gěi nǐ ná."}, {"s": "白家月", "zh": "前面的人越来越多。", "id": "Orang di depan makin lama makin banyak.", "tr": "06-5", "py": "Qiánmiàn de rén yuè lái yuè duō."}, {"s": "李文", "zh": "对，马上就进高铁站了。咱们一起走，别分开。", "id": "Ya, sebentar lagi masuk stasiun kereta cepat. Kita jalan bersama, jangan berpisah.", "tr": "06-5", "py": "Duì, mǎshàng jiù jìn gāotiě zhàn le. Zánmen yìqǐ zǒu, bié fēnkāi."}, {"s": "白家月", "zh": "好，你检查一下，高铁票都拿好了吗？", "id": "Oke, coba periksa, tiket kereta cepatnya sudah dibawa semua?", "tr": "06-5", "py": "Hǎo, nǐ jiǎnchá yíxià, gāotiě piào dōu ná hǎo le ma?"}, {"s": "李文", "zh": "不用拿票，刷护照就能检票进站。", "id": "Tidak perlu tiket, cukup pindai paspor untuk pemeriksaan tiket dan masuk stasiun.", "tr": "06-5", "py": "Búyòng ná piào, shuā hùzhào jiù néng jiǎnpiào jìn zhàn."}, {"s": "白家月", "zh": "去哪里检票？", "id": "Pemeriksaan tiketnya di mana?", "tr": "06-5", "py": "Qù nǎlǐ jiǎnpiào?"}, {"s": "李文", "zh": "检票口在二层，我们一会儿坐电梯上去。", "id": "Pintu pemeriksaan tiket ada di lantai dua, sebentar lagi kita naik eskalator ke atas.", "tr": "06-5", "py": "Jiǎnpiào kǒu zài èr céng, wǒmen yíhuìr zuò diàntī shàngqù."}, {"s": "", "zh": "这次放假，我去了北京，还去了上海。", "id": "Liburan kali ini aku pergi ke Beijing, juga ke Shanghai.", "tr": "06-7", "py": "Zhè cì fàngjià, wǒ qù le Běijīng, hái qù le Shànghǎi."}, {"s": "", "zh": "我是从北京南站坐高铁去的上海。", "id": "Aku pergi ke Shanghai naik kereta cepat dari Stasiun Beijing Selatan.", "tr": "06-7", "py": "Wǒ shì cóng běijīngnánzhàn zuò gāotiě qù de Shànghǎi."}, {"s": "", "zh": "我觉得坐在高铁上跟坐在家里的沙发上一样，又安静又舒服。", "id": "Menurutku duduk di kereta cepat sama seperti duduk di sofa di rumah, tenang dan nyaman.", "tr": "06-7", "py": "Wǒ juéde zuò zài gāotiě shàng gēn zuò zài jiā lǐ de shāfā shàng yíyàng, yòu ānjìng yòu shūfu."}, {"s": "", "zh": "坐累了就站一会儿，饿了就点外卖。", "id": "Kalau lelah duduk, berdiri sebentar; kalau lapar, pesan makanan antar.", "tr": "06-7", "py": "Zuò lèi le jiù zhàn yíhuìr, è le jiù diǎn wàimài."}, {"s": "", "zh": "对，你没听错，高铁上可以点外卖，只需要选择好车站和想吃的东西，到站时不用下车，服务员就会给你拿过来。", "id": "Ya, kamu tidak salah dengar, di kereta cepat bisa pesan makanan antar; cukup pilih stasiun dan makanan yang diinginkan, saat tiba di stasiun tidak perlu turun, petugas akan membawakannya kepadamu.", "tr": "06-7", "py": "Duì, nǐ méi tīng cuò, gāotiě shàng kěyǐ diǎn wàimài, zhī xūyào xuǎnzé hǎo chēzhàn hé xiǎng chī de dōngxi, dào zhàn shí búyòng xià chē, fúwùyuán jiù huì gěi nǐ ná guòlái."}, {"s": "", "zh": "现在喜欢坐高铁的人越来越多。", "id": "Sekarang orang yang suka naik kereta cepat makin lama makin banyak.", "tr": "06-7", "py": "Xiànzài xǐhuan zuò gāotiě de rén yuè lái yuè duō."}, {"s": "", "zh": "我爸妈来中国旅游的时候，必须带他们也坐一次高铁。", "id": "Kalau orang tuaku datang berwisata ke Tiongkok, aku harus mengajak mereka naik kereta cepat sekali.", "tr": "06-7", "py": "Wǒ bà mā lái Zhōngguó lǚyóu de shíhou, bìxū dài tāmen yě zuò yí cì gāotiě."}], "teks": [{"tr": "06-1", "nama": "课文1 · Naik kereta cepat ke Shanghai"}, {"tr": "06-3", "nama": "课文2 · Ke stasiun kereta cepat"}, {"tr": "06-5", "nama": "课文3 · Pemeriksaan tiket"}, {"tr": "06-7", "nama": "课文4 · Cerita naik kereta cepat"}]}, "7": {"judul": "那条裙子比短裤更好看", "arti": "Rok itu lebih bagus daripada celana pendek", "kata": [{"h": "辆", "p": "liàng", "k": "量", "a": "penggolong untuk kendaraan"}, {"h": "自行车", "p": "zìxíngchē", "k": "名", "a": "sepeda"}, {"h": "旧", "p": "jiù", "k": "形", "a": "lama, usang"}, {"h": "矮", "p": "ǎi", "k": "形", "a": "rendah; pendek (tubuh)"}, {"h": "试", "p": "shì", "k": "动", "a": "mencoba"}, {"h": "黄色", "p": "huángsè", "k": "名", "a": "warna kuning"}, {"h": "短裤", "p": "duǎnkù", "k": "名", "a": "celana pendek"}, {"h": "大小", "p": "dàxiǎo", "k": "名", "a": "ukuran"}, {"h": "合适", "p": "héshì", "k": "形", "a": "cocok, pas"}, {"h": "裙子", "p": "qúnzi", "k": "名", "a": "rok"}, {"h": "更", "p": "gèng", "k": "副", "a": "lebih, makin"}, {"h": "决定", "p": "juédìng", "k": "动/名", "a": "memutuskan; keputusan"}, {"h": "西瓜", "p": "xīguā", "k": "名", "a": "semangka"}, {"h": "新鲜", "p": "xīnxiān", "k": "形", "a": "segar"}, {"h": "甜", "p": "tián", "k": "形", "a": "manis"}, {"h": "公斤", "p": "gōngjīn", "k": "量", "a": "kilogram"}, {"h": "冰", "p": "bīng", "k": "动/名", "a": "mendinginkan; es"}, {"h": "极", "p": "jí", "k": "副", "a": "sangat, amat"}, {"h": "斤", "p": "jīn", "k": "量", "a": "jin (setengah kilogram)"}, {"h": "香蕉", "p": "xiāngjiāo", "k": "名", "a": "pisang"}, {"h": "一共", "p": "yígòng", "k": "副", "a": "semuanya, totalnya"}, {"h": "毛", "p": "máo", "k": "量", "a": "mao (sepersepuluh yuan)"}, {"h": "结婚", "p": "jiéhūn", "k": "动", "a": "menikah"}, {"h": "不但", "p": "búdàn", "k": "连", "a": "tidak hanya"}, {"h": "而且", "p": "érqiě", "k": "连", "a": "tetapi juga, lagi pula"}, {"h": "声", "p": "shēng", "k": "量/名", "a": "penggolong untuk bunyi; suara"}, {"h": "开机", "p": "kāijī", "k": "动", "a": "menyalakan (mesin/perangkat)"}], "dialog": [{"s": "王一雪", "zh": "这辆自行车是小雪八岁的时候买的，看起来有点儿旧了。", "id": "Sepeda ini dibeli waktu Xiaoxue berumur delapan tahun, kelihatannya sudah agak usang.", "tr": "07-1", "py": "Zhè liàng zìxíngchē shì Xiǎoxuě bā suì de shíhou mǎi de, kàn qǐlái yǒudiǎnr jiù le."}, {"s": "刘明", "zh": "是啊，她现在长高了，这辆车已经太矮了。", "id": "Iya, dia sekarang sudah tambah tinggi, sepeda ini sudah terlalu rendah.", "tr": "07-1", "py": "Shì a, tā xiànzài cháng gāo le, zhè liàng chē yǐjīng tài ǎi le."}, {"s": "王一雪", "zh": "商场里开了一家自行车店，咱们给她买辆新的吧。", "id": "Di mal ada toko sepeda baru, ayo kita belikan dia yang baru.", "tr": "07-1", "py": "Shāngchǎng lǐ kāi le yì jiā zìxíngchē diàn, zánmen gěi tā mǎi liàng xīn de ba."}, {"s": "刘明", "zh": "好，咱们带小雪一起去，让她试一下。", "id": "Oke, kita ajak Xiaoxue sekalian, biar dia mencobanya.", "tr": "07-1", "py": "Hǎo, zánmen dài Xiǎoxuě yìqǐ qù, ràng tā shì yíxià."}, {"s": "王一雪", "zh": "那今天就去吧！我也想再看看衣服。咱们怎么去？", "id": "Kalau begitu hari ini saja! Aku juga mau lihat-lihat baju lagi. Kita pergi naik apa?", "tr": "07-1", "py": "Nà jīntiān jiù qù ba! Wǒ yě xiǎng zài kànkan yīfu. Zánmen zěnme qù?"}, {"s": "刘明", "zh": "商场不远，咱们可以走着去。", "id": "Malnya tidak jauh, kita bisa jalan kaki ke sana.", "tr": "07-1", "py": "Shāngchǎng bù yuǎn, zánmen kěyǐ zǒu zhe qù."}, {"s": "王一雪", "zh": "你看我穿这条黄色的短裤好看吗？", "id": "Coba lihat, bagus tidak aku memakai celana pendek kuning ini?", "tr": "07-3", "py": "Nǐ kàn wǒ chuān zhè tiáo huángsè de duǎnkù hǎokàn ma?"}, {"s": "刘明", "zh": "大小合适，但我觉得那条裙子比短裤更好看。", "id": "Ukurannya pas, tapi menurutku rok itu lebih bagus daripada celana pendek.", "tr": "07-3", "py": "Dàxiǎo héshì, dàn wǒ juéde nà tiáo qúnzi bǐ duǎnkù gèng hǎokàn."}, {"s": "王一雪", "zh": "裙子比短裤贵一点儿。", "id": "Roknya sedikit lebih mahal daripada celana pendek.", "tr": "07-3", "py": "Qúnzi bǐ duǎnkù guì yìdiǎnr."}, {"s": "刘明", "zh": "贵多少？", "id": "Lebih mahal berapa?", "tr": "07-3", "py": "Guì duōshao?"}, {"s": "王一雪", "zh": "裙子480，短裤400。", "id": "Roknya 480, celana pendeknya 400.", "tr": "07-3", "py": "Qúnzi 4 8 0, duǎnkù 4 0 0."}, {"s": "刘明", "zh": "裙子不比短裤贵多少，还是买裙子吧，你穿裙子更好看。", "id": "Roknya tidak jauh lebih mahal daripada celana pendek, lebih baik beli rok saja, kamu lebih cantik pakai rok.", "tr": "07-3", "py": "Qúnzi bù bǐ duǎnkù guì duōshao, háishi mǎi qúnzi ba, nǐ chuān qúnzi gèng hǎokàn."}, {"s": "王一雪", "zh": "我多看看再决定。你看，那边有买二送一！", "id": "Aku lihat-lihat dulu baru memutuskan. Lihat, di sana ada promo beli dua gratis satu!", "tr": "07-3", "py": "Wǒ duō kànkan zài juédìng. Nǐ kàn, nàbiān yǒu mǎi èr sòng yī!"}, {"s": "店员", "zh": "西瓜又大又新鲜，不甜不要钱！", "id": "Semangkanya besar dan segar, kalau tidak manis, tidak usah bayar!", "tr": "07-5", "py": "Xīguā yòu dà yòu xīnxiān, bù tián búyào qián!"}, {"s": "王一雪", "zh": "西瓜看起来不错，怎么卖？", "id": "Semangkanya kelihatan bagus, harganya berapa?", "tr": "07-5", "py": "Xīguā kàn qǐlái búcuò, zěnme mài?"}, {"s": "店员", "zh": "五块钱一公斤。来，您先尝尝这块冰西瓜，甜极了！", "id": "Lima yuan sekilo. Silakan, cicipi dulu potongan semangka dingin ini, manis sekali!", "tr": "07-5", "py": "Wǔ kuài qián yì gōngjīn. Lái, nín xiān cháng cháng zhè kuài bīng xīguā, tián jí le!"}, {"s": "王一雪", "zh": "是挺甜的！帮我选个大点儿的，再来两斤香蕉。", "id": "Memang cukup manis! Tolong pilihkan yang agak besar, lalu tambah satu kilo (dua jin) pisang.", "tr": "07-5", "py": "Shì tǐng tián de! Bāng wǒ xuǎn gè dà diǎnr de, zài lái liǎng jīn xiāngjiāo."}, {"s": "店员", "zh": "一共五十八块五毛。", "id": "Semuanya lima puluh delapan yuan lima mao.", "tr": "07-5", "py": "Yígòng wǔshíbā kuài wǔ máo."}, {"s": "王一雪", "zh": "我买了这么多，便宜点儿吧。", "id": "Saya beli sebanyak ini, kurangi sedikit, ya.", "tr": "07-5", "py": "Wǒ mǎi le zhème duō, piányi diǎnr ba."}, {"s": "店员", "zh": "您给我五十五吧，不能再便宜了。", "id": "Bayar lima puluh lima saja, tidak bisa lebih murah lagi.", "tr": "07-5", "py": "Nín gěi wǒ wǔshíwǔ ba, bù néng zài piányi le."}, {"s": "", "zh": "这几天我们在新家坐着看电视的时候，又发现了新问题。", "id": "Beberapa hari ini, waktu kami duduk menonton TV di rumah baru, kami menemukan masalah baru lagi.", "tr": "07-7", "py": "Zhè jǐ tiān wǒmen zài xīn jiā zuò zhe kàn diànshì de shíhou, yòu fāxiàn le xīn wèntí."}, {"s": "", "zh": "房子大了，电视看起来就有点儿小。", "id": "Rumahnya jadi besar, TV-nya pun kelihatan agak kecil.", "tr": "07-7", "py": "Fángzi dà le, diànshì kàn qǐlái jiù yǒudiǎnr xiǎo."}, {"s": "", "zh": "这个电视是我们结婚时买的，是时候换个新电视了。", "id": "TV ini dibeli waktu kami menikah, sudah saatnya ganti TV baru.", "tr": "07-7", "py": "Zhège diànshì shì wǒmen jiéhūn shí mǎi de, shì shíhou huàn gè xīn diànshì le."}, {"s": "", "zh": "今天我一直在网上选电视，没想到，现在的电视不但便宜，而且用着非常方便，有的电视叫它一声就能开机。", "id": "Hari ini aku terus memilih TV di internet; tidak disangka, TV sekarang tidak hanya murah, tetapi juga sangat praktis dipakai, ada TV yang cukup dipanggil sekali langsung menyala.", "tr": "07-7", "py": "Jīntiān wǒ yìzhí zài wǎngshang xuǎn diànshì, méi xiǎng dào, xiànzài de diànshì búdàn piányi, érqiě yòng zhe fēicháng fāngbiàn, yǒude diànshì jiào tā yì shēng jiù néng kāijī."}, {"s": "", "zh": "我看了好几个，都很满意，晚上让一雪来决定吧。", "id": "Aku sudah melihat beberapa, semuanya memuaskan, nanti malam biar Yixue yang memutuskan.", "tr": "07-7", "py": "Wǒ kàn le hǎo jǐ gè, dōu hěn mǎnyì, wǎnshang ràng Yīxuě lái juédìng ba."}], "teks": [{"tr": "07-1", "nama": "课文1 · Sepeda baru untuk Xiaoxue"}, {"tr": "07-3", "nama": "课文2 · Rok atau celana pendek?"}, {"tr": "07-5", "nama": "课文3 · Membeli buah"}, {"tr": "07-7", "nama": "课文4 · Saatnya ganti TV"}]}, "8": {"judul": "今天我出院了", "arti": "Hari ini aku keluar dari rumah sakit", "kata": [{"h": "最近", "p": "zuìjìn", "k": "名", "a": "akhir-akhir ini"}, {"h": "常", "p": "cháng", "k": "副", "a": "sering"}, {"h": "体育馆", "p": "tǐyùguǎn", "k": "名", "a": "gedung olahraga, gimnasium"}, {"h": "习惯", "p": "xíguàn", "k": "名/动", "a": "kebiasaan; terbiasa"}, {"h": "胖", "p": "pàng", "k": "形", "a": "gemuk"}, {"h": "健康", "p": "jiànkāng", "k": "形", "a": "sehat"}, {"h": "以后", "p": "yǐhòu", "k": "名", "a": "sesudah, kelak"}, {"h": "羽毛球", "p": "yǔmáoqiú", "k": "名", "a": "bulu tangkis"}, {"h": "耳朵", "p": "ěrduo", "k": "名", "a": "telinga"}, {"h": "感冒", "p": "gǎnmào", "k": "动/名", "a": "masuk angin, flu"}, {"h": "发烧", "p": "fāshāo", "k": "动", "a": "demam"}, {"h": "低", "p": "dī", "k": "形", "a": "rendah"}, {"h": "关心", "p": "guānxīn", "k": "动", "a": "peduli, memperhatikan"}, {"h": "注意", "p": "zhùyì", "k": "动", "a": "memperhatikan, berhati-hati"}, {"h": "突然", "p": "tūrán", "k": "形", "a": "tiba-tiba, mendadak"}, {"h": "住院", "p": "zhùyuàn", "k": "动", "a": "dirawat inap di rumah sakit"}, {"h": "担心", "p": "dānxīn", "k": "动", "a": "khawatir"}, {"h": "腿", "p": "tuǐ", "k": "名", "a": "kaki (tungkai)"}, {"h": "病人", "p": "bìngrén", "k": "名", "a": "orang sakit, pasien"}, {"h": "差不多", "p": "chàbuduō", "k": "副/形", "a": "hampir; mirip"}, {"h": "得", "p": "děi", "k": "能愿", "a": "harus, perlu"}, {"h": "开心", "p": "kāixīn", "k": "形", "a": "senang, gembira"}, {"h": "出院", "p": "chūyuàn", "k": "动", "a": "keluar dari rumah sakit (pasien)"}, {"h": "开", "p": "kāi", "k": "动", "a": "meresepkan (obat)"}, {"h": "种", "p": "zhǒng", "k": "量", "a": "jenis, macam"}, {"h": "方法", "p": "fāngfǎ", "k": "名", "a": "cara, metode"}, {"h": "其他", "p": "qítā", "k": "代", "a": "yang lain"}, {"h": "心里", "p": "xīnli", "k": "名", "a": "dalam hati"}], "dialog": [{"s": "李文", "zh": "天中，最近常看见你来体育馆。", "id": "Tianzhong, akhir-akhir ini aku sering melihatmu datang ke gedung olahraga.", "tr": "08-1", "py": "Tiānzhōng, zuìjìn cháng kànjiàn nǐ lái tǐyùguǎn."}, {"s": "陈天中", "zh": "我每天下午都来跑一个小时步。", "id": "Setiap sore aku datang lari selama satu jam.", "tr": "08-1", "py": "Wǒ měi tiān xiàwǔ dōu lái pǎo yí gè xiǎoshí bù."}, {"s": "李文", "zh": "你的运动习惯真不错。", "id": "Kebiasaan olahragamu bagus sekali.", "tr": "08-1", "py": "Nǐ de yùndòng xíguàn zhēn búcuò."}, {"s": "陈天中", "zh": "因为我今年胖了十多斤，不能再胖下去了，有点儿不健康。", "id": "Karena tahun ini berat badanku naik lebih dari lima kilo (sepuluh jin lebih), tidak boleh terus bertambah gemuk, agak tidak sehat.", "tr": "08-1", "py": "Yīnwèi wǒ jīnnián pàng le shí duō jīn, bù néng zài pàng xiàqù le, yǒudiǎnr bú jiànkāng."}, {"s": "李文", "zh": "我下课以后常去打羽毛球，你也来玩吧。", "id": "Sesudah kuliah aku sering main bulu tangkis, kamu ikut main juga, yuk.", "tr": "08-1", "py": "Wǒ xiàkè yǐhòu cháng qù dǎ yǔmáoqiú, nǐ yě lái wán ba."}, {"s": "陈天中", "zh": "我知道，但是你们的水平太高了，我打得不怎么样。", "id": "Aku tahu, tapi kemampuan kalian terlalu tinggi, mainku biasa-biasa saja.", "tr": "08-1", "py": "Wǒ zhīdào, dànshì nǐmen de shuǐpíng tài gāo le, wǒ dǎ de bù zěnmeyàng."}, {"s": "李文", "zh": "没关系，我可以教你。", "id": "Tidak apa-apa, aku bisa mengajarimu.", "tr": "08-1", "py": "Méiguānxi, wǒ kěyǐ jiāo nǐ."}, {"s": "安妮", "zh": "你怎么了？看上去有点儿不舒服。", "id": "Kamu kenapa? Kelihatannya agak tidak enak badan.", "tr": "08-3", "py": "Nǐ zěnme le? Kàn shàngqù yǒudiǎnr bù shūfu."}, {"s": "陈天中", "zh": "昨天游完泳以后，耳朵一直有点儿疼。", "id": "Sejak selesai berenang kemarin, telingaku terus agak sakit.", "tr": "08-3", "py": "Zuótiān yóu wán yǒng yǐhòu, ěrduo yìzhí yǒudiǎnr téng."}, {"s": "安妮", "zh": "是不是感冒了？发烧吗？", "id": "Jangan-jangan kamu flu? Demam tidak?", "tr": "08-3", "py": "Shì bu shì gǎnmào le? Fāshāo ma?"}, {"s": "陈天中", "zh": "好像发低烧了。", "id": "Sepertinya demam ringan.", "tr": "08-3", "py": "Hǎoxiàng fā dī shāo le."}, {"s": "安妮", "zh": "我送你去医院，让医生检查一下吧。", "id": "Aku antar kamu ke rumah sakit, biar dokter memeriksamu.", "tr": "08-3", "py": "Wǒ sòng nǐ qù yīyuàn, ràng yīshēng jiǎnchá yíxià ba."}, {"s": "陈天中", "zh": "我先回去睡一觉，可能休息休息就好了。", "id": "Aku pulang tidur dulu, mungkin setelah istirahat sebentar akan sembuh.", "tr": "08-3", "py": "Wǒ xiān huíqù shuì yí jiào, kěnéng xiūxi xiūxi jiù hǎo le."}, {"s": "安妮", "zh": "好吧，如果下午还发烧，就一定要去看医生。", "id": "Baiklah, kalau sore nanti masih demam, kamu harus pergi ke dokter.", "tr": "08-3", "py": "Hǎo ba, rúguǒ xiàwǔ hái fāshāo, jiù yídìng yào qù kàn yīshēng."}, {"s": "陈天中", "zh": "谢谢关心，我会注意的。", "id": "Terima kasih atas perhatianmu, aku akan berhati-hati.", "tr": "08-3", "py": "Xièxie guānxīn, wǒ huì zhùyì de."}, {"s": "安妮", "zh": "你怎么突然住院了？大家都很担心你。", "id": "Kenapa kamu tiba-tiba dirawat di rumah sakit? Semua orang mengkhawatirkanmu.", "tr": "08-5", "py": "Nǐ zěnme tūrán zhùyuàn le? Dàjiā dōu hěn dānxīn nǐ."}, {"s": "陈天中", "zh": "我的腿疼了几个星期了，医生说需要住院做检查。", "id": "Kakiku sudah sakit beberapa minggu, dokter bilang perlu dirawat inap untuk diperiksa.", "tr": "08-5", "py": "Wǒ de tuǐ téng le jǐ gè xīngqī le, yīshēng shuō xūyào zhùyuàn zuò jiǎnchá."}, {"s": "安妮", "zh": "你看起来一点儿也不像病人。", "id": "Kamu sama sekali tidak kelihatan seperti orang sakit.", "tr": "08-5", "py": "Nǐ kàn qǐlái yìdiǎnr yě bú xiàng bìngrén."}, {"s": "陈天中", "zh": "是啊，我很少生病。我上次来医院已经过去差不多两年了。", "id": "Iya, aku jarang sakit. Terakhir kali aku ke rumah sakit sudah hampir dua tahun lalu.", "tr": "08-5", "py": "Shì a, wǒ hěn shǎo shēngbìng. Wǒ shàng cì lái yīyuàn yǐjīng guòqù chàbuduō liǎng nián le."}, {"s": "安妮", "zh": "你每天跑步，有时候还去游泳，是不是运动太多了？", "id": "Kamu setiap hari lari, kadang juga berenang, jangan-jangan olahragamu terlalu banyak?", "tr": "08-5", "py": "Nǐ měi tiān pǎobù, yǒushí hòu hái qù yóuyǒng, shì bu shì yùndòng tài duō le?"}, {"s": "陈天中", "zh": "医生也这么说，但是还得做完检查才能知道。", "id": "Dokter juga bilang begitu, tapi masih harus menunggu pemeriksaan selesai baru bisa tahu.", "tr": "08-5", "py": "Yīshēng yě zhème shuō, dànshì hái de zuò wán jiǎnchá cái néng zhīdào."}, {"s": "安妮", "zh": "别担心！听医生的话，好好休息，你的腿一定能好。", "id": "Jangan khawatir! Ikuti kata dokter, istirahat yang baik, kakimu pasti sembuh.", "tr": "08-5", "py": "Bié dānxīn! Tīng yīshēng dehuà, hǎo hǎo xiūxi, nǐ de tuǐ yídìng néng hǎo."}, {"s": "陈天中", "zh": "谢谢。有人来看我，我就开心多了。", "id": "Terima kasih. Ada yang datang menjenguk, aku jadi jauh lebih senang.", "tr": "08-5", "py": "Xièxie. Yǒu rén lái kàn wǒ, wǒ jiù kāixīn duō le."}, {"s": "", "zh": "今天我出院了。", "id": "Hari ini aku keluar dari rumah sakit.", "tr": "08-7", "py": "Jīntiān wǒ chūyuàn le."}, {"s": "", "zh": "出院前，医生给我开了几种药，而且告诉了我吃药的方法。", "id": "Sebelum keluar, dokter meresepkan beberapa jenis obat untukku, dan juga memberi tahu cara meminumnya.", "tr": "08-7", "py": "Chūyuàn qián, yīshēng gěi wǒ kāi le jǐ zhǒng yào, érqiě gàosu le wǒ chī yào de fāngfǎ."}, {"s": "", "zh": "有一种药需要每天睡前吃一次，其他几种每天吃三次，饭后吃。", "id": "Ada satu jenis obat yang harus diminum sekali setiap hari sebelum tidur, beberapa jenis yang lain diminum tiga kali sehari, sesudah makan.", "tr": "08-7", "py": "Yǒu yì zhǒng yào xūyào měi tiān shuì qián chī yí cì, qítā jǐ zhǒng měi tiān chī sān cì, fàn hòu chī."}, {"s": "", "zh": "除了吃药，医生还说最重要的是多休息。", "id": "Selain minum obat, dokter juga bilang yang paling penting adalah banyak istirahat.", "tr": "08-7", "py": "Chúle chī yào, yīshēng huán shuō zuì zhòngyào de shì duō xiūxi."}, {"s": "", "zh": "我都记在心里了，回家以后一定会多注意。", "id": "Semua sudah kuingat baik-baik, setelah pulang aku pasti akan lebih berhati-hati.", "tr": "08-7", "py": "Wǒ dōu jì zài xīnli le, huí jiā yǐhòu yídìng huì duō zhùyì."}, {"s": "", "zh": "希望我的腿能快一点儿好。", "id": "Semoga kakiku bisa cepat sembuh.", "tr": "08-7", "py": "Xīwàng wǒ de tuǐ néng kuài yìdiǎnr hǎo."}], "teks": [{"tr": "08-1", "nama": "课文1 · Kebiasaan olahraga"}, {"tr": "08-3", "nama": "课文2 · Tianzhong tidak enak badan"}, {"tr": "08-5", "nama": "课文3 · Menjenguk di rumah sakit"}, {"tr": "08-7", "nama": "课文4 · Keluar dari rumah sakit"}]}, "9": {"judul": "打不好没关系", "arti": "Tidak apa-apa kalau mainnya belum bagus", "kata": [{"h": "校园", "p": "xiàoyuán", "k": "名", "a": "kampus, lingkungan sekolah"}, {"h": "卡", "p": "kǎ", "k": "名", "a": "kartu"}, {"h": "球场", "p": "qiúchǎng", "k": "名", "a": "lapangan (bola)"}, {"h": "为了", "p": "wèile", "k": "介", "a": "demi, untuk"}, {"h": "运动会", "p": "yùndònghuì", "k": "名", "a": "pekan olahraga"}, {"h": "男生", "p": "nánshēng", "k": "名", "a": "siswa/mahasiswa laki-laki"}, {"h": "练", "p": "liàn", "k": "动", "a": "berlatih"}, {"h": "参加", "p": "cānjiā", "k": "动", "a": "ikut, mengikuti"}, {"h": "网球", "p": "wǎngqiú", "k": "名", "a": "tenis"}, {"h": "比赛", "p": "bǐsài", "k": "名/动", "a": "pertandingan; bertanding"}, {"h": "练习", "p": "liànxí", "k": "动/名", "a": "berlatih; latihan"}, {"h": "好多", "p": "hǎoduō", "k": "数", "a": "banyak sekali"}, {"h": "几乎", "p": "jīhū", "k": "副", "a": "hampir"}, {"h": "只是", "p": "zhǐshì", "k": "副/连", "a": "hanya, cuma; hanya saja"}, {"h": "啤酒", "p": "píjiǔ", "k": "名", "a": "bir"}, {"h": "回", "p": "huí", "k": "量", "a": "penggolong untuk kejadian/urusan"}, {"h": "紧张", "p": "jǐnzhāng", "k": "形", "a": "tegang, gugup"}, {"h": "主要", "p": "zhǔyào", "k": "形", "a": "utama"}, {"h": "受到", "p": "shòudào", "k": "动", "a": "mendapat, terkena (pengaruh dll.)"}, {"h": "影响", "p": "yǐngxiǎng", "k": "名/动", "a": "pengaruh; memengaruhi"}, {"h": "得分", "p": "défēn", "k": "动/名", "a": "mencetak angka; skor"}, {"h": "体育", "p": "tǐyù", "k": "名", "a": "olahraga"}, {"h": "世界", "p": "shìjiè", "k": "名", "a": "dunia"}, {"h": "运动员", "p": "yùndòngyuán", "k": "名", "a": "atlet"}, {"h": "得到", "p": "dédào", "k": "动", "a": "mendapat, memperoleh"}, {"h": "成绩", "p": "chéngjì", "k": "名", "a": "prestasi, hasil, nilai"}, {"h": "奥运会", "p": "Àoyùnhuì", "k": "专名", "a": "Olimpiade"}, {"h": "刘长春", "p": "Liú Chángchūn", "k": "专名", "a": "Liu Changchun (nama orang)"}], "dialog": [{"s": "李文", "zh": "家月，对不起，我昨天忘了还你校园卡了。", "id": "Jiayue, maaf, kemarin aku lupa mengembalikan kartu kampusmu.", "tr": "09-1", "py": "Jiāyuè, duìbuqǐ, wǒ zuótiān wàng le hái nǐ xiàoyuán kǎ le."}, {"s": "白家月", "zh": "没关系。你怎么这么快就过来了？", "id": "Tidak apa-apa. Kenapa kamu cepat sekali sampai ke sini?", "tr": "09-1", "py": "Méiguānxi. Nǐ zěnme zhème kuài jiù guòlái le?"}, {"s": "李文", "zh": "我正在球场打球呢，接了你的电话就跑过来了。", "id": "Aku sedang main bola di lapangan, begitu menerima teleponmu langsung lari ke sini.", "tr": "09-1", "py": "Wǒ zhèngzài qiúchǎng dǎ qiú ne, jiē le nǐ de diànhuà jiù pǎo guòlái le."}, {"s": "白家月", "zh": "听说为了准备运动会，你们几个男生每天都练球。", "id": "Kudengar untuk persiapan pekan olahraga, kalian beberapa cowok berlatih bola setiap hari.", "tr": "09-1", "py": "Tīngshuō wèile zhǔnbèi yùndònghuì, nǐmen jǐ gè nánshēng měi tiān dōu liàn qiú."}, {"s": "李文", "zh": "是啊！你打算参加运动会吗？", "id": "Iya! Kamu berencana ikut pekan olahraga?", "tr": "09-1", "py": "Shì a! Nǐ dǎsuàn cānjiā yùndònghuì ma?"}, {"s": "白家月", "zh": "我想参加网球比赛，最近一直在练习。", "id": "Aku mau ikut pertandingan tenis, akhir-akhir ini terus berlatih.", "tr": "09-1", "py": "Wǒ xiǎng cānjiā wǎngqiú bǐsài, zuìjìn yìzhí zài liànxí."}, {"s": "李文", "zh": "好，到时候我去看你的比赛。", "id": "Oke, nanti aku datang menonton pertandinganmu.", "tr": "09-1", "py": "Hǎo, dào shíhou wǒ qù kàn nǐ de bǐsài."}, {"s": "李文", "zh": "家月，你跟我们一起打羽毛球吧？", "id": "Jiayue, ayo main bulu tangkis bersama kami?", "tr": "09-3", "py": "Jiāyuè, nǐ gēn wǒmen yìqǐ dǎ yǔmáoqiú ba?"}, {"s": "白家月", "zh": "我好多年没打羽毛球了，几乎忘了怎么打了。", "id": "Sudah bertahun-tahun aku tidak main bulu tangkis, hampir lupa cara mainnya.", "tr": "09-3", "py": "Wǒ hǎoduō nián méi dǎ yǔmáoqiú le, jīhū wàng le zěnme dǎ le."}, {"s": "李文", "zh": "不是比赛，打不好没关系。", "id": "Ini bukan pertandingan, tidak apa-apa kalau mainnya belum bagus.", "tr": "09-3", "py": "Bú shì bǐsài, dǎ bù hǎo méiguānxi."}, {"s": "白家月", "zh": "这么多同学一起打，如果总是接不住球，就太不好意思了。", "id": "Main bersama teman sebanyak ini, kalau aku terus tidak bisa menerima kok, malu sekali.", "tr": "09-3", "py": "Zhème duō tóngxué yìqǐ dǎ, rúguǒ zǒngshì jiē bú zhù qiú, jiù tài bùhǎoyìsī le."}, {"s": "李文", "zh": "你想得太多了！大家打球只是为了锻炼身体。", "id": "Kamu terlalu banyak berpikir! Semua orang main hanya untuk berolahraga.", "tr": "09-3", "py": "Nǐ xiǎng de tài duō le! Dàjiā dǎ qiú zhǐshì wèile duànliàn shēntǐ."}, {"s": "白家月", "zh": "我先自己练练吧，下周再跟你们一起打。", "id": "Aku berlatih sendiri dulu saja, minggu depan baru main bersama kalian.", "tr": "09-3", "py": "Wǒ xiān zìjǐ liàn liàn ba, xià zhōu zài gēn nǐmen yìqǐ dǎ."}, {"s": "李文", "zh": "我在教天中打羽毛球，你可以过来跟我们一起练。", "id": "Aku sedang mengajari Tianzhong main bulu tangkis, kamu bisa datang berlatih bersama kami.", "tr": "09-3", "py": "Wǒ zài jiào Tiānzhōng dǎ yǔmáoqiú, nǐ kěyǐ guòlái gēn wǒmen yìqǐ liàn."}, {"s": "陈天中", "zh": "足球比赛已经开始了，快过来看吧！", "id": "Pertandingan sepak bolanya sudah mulai, cepat sini nonton!", "tr": "09-5", "py": "Zúqiú bǐsài yǐjīng kāishǐ le, kuài guòlái kàn ba!"}, {"s": "李文", "zh": "你们先看，冰箱里有啤酒和饮料，我去拿一下。", "id": "Kalian nonton duluan, di kulkas ada bir dan minuman, aku ambil dulu.", "tr": "09-5", "py": "Nǐmen xiān kàn, bīngxiāng lǐ yǒu píjiǔ hé yǐnliào, wǒ qù ná yíxià."}, {"s": "白家月", "zh": "今天怎么回事？总是踢不进去！", "id": "Hari ini kenapa sih? Selalu saja tidak bisa menendang bola masuk!", "tr": "09-5", "py": "Jīntiān zěnme huí shì? Zǒngshì tī bú jìnqù!"}, {"s": "陈天中", "zh": "几个老球员生病了，新球员第一次参加这么重要的比赛，太紧张了。", "id": "Beberapa pemain senior sakit, pemain baru pertama kali ikut pertandingan sepenting ini, jadi terlalu gugup.", "tr": "09-5", "py": "Jǐ gè lǎo qiú yuán shēngbìng le, xīn qiú yuán dìyī cì cānjiā zhème zhòngyào de bǐsài, tài jǐnzhāng le."}, {"s": "李文", "zh": "是啊，主要的球员没参加比赛，所以大家也都受到影响了。", "id": "Iya, pemain utamanya tidak ikut bertanding, jadi semua pemain ikut terpengaruh.", "tr": "09-5", "py": "Shì a, zhǔyào de qiú yuán méi cānjiā bǐsài, suǒyǐ dàjiā yě dōu shòudào yǐngxiǎng le."}, {"s": "白家月", "zh": "越看越着急。我不看了，你们告诉我得分吧。", "id": "Makin ditonton makin gelisah. Aku tidak nonton lagi, kalian beri tahu saja skornya.", "tr": "09-5", "py": "Yuè kàn yuè zháojí. Wǒ bú kàn le, nǐmen gàosu wǒ défēn ba."}, {"s": "", "zh": "我喜欢看体育比赛，最爱看的就是奥运会。", "id": "Aku suka menonton pertandingan olahraga, yang paling kusukai adalah Olimpiade.", "tr": "09-7", "py": "Wǒ xǐhuan kàn tǐyù bǐsài, zuì ài kàn de jiù shì àoyùnhuì."}, {"s": "", "zh": "奥运会是世界上影响最大的体育比赛。", "id": "Olimpiade adalah pertandingan olahraga yang paling berpengaruh di dunia.", "tr": "09-7", "py": "Àoyùnhuì shì shìjiè shàng yǐngxiǎng zuì dà de tǐyù bǐsài."}, {"s": "", "zh": "从1896年到2024年，每次奥运会都有非常多的运动员参加。", "id": "Dari tahun 1896 sampai 2024, setiap Olimpiade selalu diikuti sangat banyak atlet.", "tr": "09-7", "py": "Cóng 1 8 9 6 nián dào 2 0 2 4 nián, měi cì àoyùnhuì dōu yǒu fēicháng duō de yùndòngyuán cānjiā."}, {"s": "", "zh": "第一位参加奥运会的中国运动员是刘长春，他1932年参加了100米和200米短跑比赛。", "id": "Atlet Tiongkok pertama yang ikut Olimpiade adalah Liu Changchun; pada tahun 1932 dia ikut lomba lari cepat 100 meter dan 200 meter.", "tr": "09-7", "py": "Dìyī wèi cānjiā àoyùnhuì de Zhōngguó yùndòngyuán shì liúchángchūn, tā 1 9 3 2 nián cānjiā le 1 0 0 mǐ hé 2 0 0 mǐ duǎn pǎo bǐsài."}, {"s": "", "zh": "虽然他没有得到好成绩，但是他让世界认识了中国。", "id": "Meskipun dia tidak meraih prestasi yang baik, dia membuat dunia mengenal Tiongkok.", "tr": "09-7", "py": "Suīrán tā méiyǒu dédào hǎo chéngjì, dànshì tā ràng shìjiè rènshi le Zhōngguó."}], "teks": [{"tr": "09-1", "nama": "课文1 · Persiapan pekan olahraga"}, {"tr": "09-3", "nama": "课文2 · Main bulu tangkis bersama"}, {"tr": "09-5", "nama": "课文3 · Menonton sepak bola"}, {"tr": "09-7", "nama": "课文4 · Olimpiade"}]}, "10": {"judul": "你明天再把书还给我", "arti": "Besok saja kamu kembalikan bukunya kepadaku", "kata": [{"h": "数学", "p": "shùxué", "k": "n.", "a": "matematika"}, {"h": "认真", "p": "rènzhēn", "k": "adj.", "a": "sungguh-sungguh, tekun"}, {"h": "笔记", "p": "bǐjì", "k": "n.", "a": "catatan"}, {"h": "清楚", "p": "qīngchu", "k": "adj./v.", "a": "jelas; tahu dengan jelas"}, {"h": "黑板", "p": "hēibǎn", "k": "n.", "a": "papan tulis"}, {"h": "把", "p": "bǎ", "k": "prep.", "a": "kata depan untuk memajukan objek ke depan kata kerja"}, {"h": "作业", "p": "zuòyè", "k": "n.", "a": "pekerjaan rumah, PR"}, {"h": "遍", "p": "biàn", "k": "m.", "a": "kali (dari awal sampai akhir)"}, {"h": "提高", "p": "tígāo", "k": "v.", "a": "meningkatkan"}, {"h": "历史", "p": "lìshǐ", "k": "n.", "a": "sejarah"}, {"h": "难", "p": "nán", "k": "adj.", "a": "sulit, sukar"}, {"h": "要求", "p": "yāoqiú", "k": "n./v.", "a": "tuntutan, syarat; menuntut"}, {"h": "差", "p": "chà", "k": "adj./v.", "a": "buruk, jelek; kurang"}, {"h": "复习", "p": "fùxí", "k": "v.", "a": "mengulang pelajaran"}, {"h": "外语", "p": "wàiyǔ", "k": "n.", "a": "bahasa asing"}, {"h": "当然", "p": "dāngrán", "k": "adv.", "a": "tentu saja"}, {"h": "遇到", "p": "yùdào", "k": "v.", "a": "menemui, menjumpai"}, {"h": "办公室", "p": "bàngōngshì", "k": "n.", "a": "kantor, ruang kantor"}, {"h": "页", "p": "yè", "k": "m.", "a": "halaman"}, {"h": "对话", "p": "duìhuà", "k": "v.", "a": "bercakap-cakap"}, {"h": "明白", "p": "míngbai", "k": "v./adj.", "a": "mengerti; jelas"}, {"h": "讲", "p": "jiǎng", "k": "v.", "a": "menjelaskan"}, {"h": "句", "p": "jù", "k": "m.", "a": "kata penggolong untuk kalimat atau ucapan"}, {"h": "句子", "p": "jùzi", "k": "n.", "a": "kalimat"}, {"h": "年级", "p": "niánjí", "k": "n.", "a": "kelas, tingkat (di sekolah)"}, {"h": "后年", "p": "hòunián", "k": "n.", "a": "dua tahun lagi, tahun depannya lagi"}, {"h": "一般", "p": "yìbān", "k": "adj.", "a": "umum, biasa"}, {"h": "努力", "p": "nǔlì", "k": "adj./v.", "a": "rajin, giat; berusaha keras"}], "dialog": [{"s": "同学", "zh": "你的数学越来越好，能不能介绍一下学习方法？", "id": "Matematikamu makin lama makin bagus, bisa ceritakan cara belajarmu?", "tr": "10-1", "py": "Nǐ de shùxué yuè lái yuè hǎo, néng bu néng jièshào yíxià xuéxí fāngfǎ?"}, {"s": "刘小雪", "zh": "没有什么特别的方法，认真听课，认真记笔记。", "id": "Tidak ada cara yang istimewa, dengarkan pelajaran dengan sungguh-sungguh dan mencatat dengan rajin.", "tr": "10-1", "py": "Méiyǒu shénme tèbié de fāngfǎ, rènzhēn tīng kè, rènzhēn jì bǐjì."}, {"s": "同学", "zh": "我看过你的笔记，记得非常清楚。", "id": "Aku pernah melihat catatanmu, ditulis dengan sangat jelas.", "tr": "10-1", "py": "Wǒ kàn guò nǐ de bǐjì, jìde fēicháng qīngchu."}, {"s": "刘小雪", "zh": "老师写在黑板上的题都很重要，所以我会把这些题都记在本子上。", "id": "Soal-soal yang ditulis guru di papan tulis semuanya penting, jadi aku mencatat semua soal itu di buku tulis.", "tr": "10-1", "py": "Lǎoshī xiě zài hēibǎn shàng de tí dōu hěn zhòngyào, suǒyǐ wǒ huì bǎ zhèxiē tí dōu jì zài běnzi shàng."}, {"s": "同学", "zh": "你说得对。我没有记笔记的习惯。", "id": "Kamu benar. Aku tidak punya kebiasaan mencatat.", "tr": "10-1", "py": "Nǐ shuō de duì. Wǒ méiyǒu jì bǐjì de xíguàn."}, {"s": "刘小雪", "zh": "笔记挺重要的，我每天写作业以前，都要看一遍。", "id": "Catatan itu cukup penting, setiap hari sebelum mengerjakan PR aku selalu membacanya sekali.", "tr": "10-1", "py": "Bǐjì tǐng zhòngyào de, wǒ měi tiān xiě zuòyè yǐqián, dōu yào kàn yí biàn."}, {"s": "同学", "zh": "这个方法真好！我以后也试试，希望能提高成绩。", "id": "Cara ini bagus sekali! Nanti aku juga mau mencobanya, semoga bisa meningkatkan nilaiku.", "tr": "10-1", "py": "Zhège fāngfǎ zhēn hǎo! Wǒ yǐhòu yě shì shì, xīwàng néng tígāo chéngjì."}, {"s": "同学", "zh": "小雪，昨天的考试，你考得怎么样？", "id": "Xiaoxue, ujian kemarin, bagaimana hasilmu?", "tr": "10-3", "py": "Xiǎoxuě, zuótiān de kǎoshì, nǐ kǎo de zěnmeyàng?"}, {"s": "刘小雪", "zh": "我觉得历史有点儿难，你呢？", "id": "Menurutku sejarah agak sulit, kalau kamu?", "tr": "10-3", "py": "Wǒ juéde lìshǐ yǒudiǎnr nán, nǐ ne?"}, {"s": "同学", "zh": "数学考试我没看清楚要求，做错了好几个题，考得挺差的。", "id": "Di ujian matematika aku tidak membaca perintahnya dengan teliti, salah mengerjakan beberapa soal, hasilnya cukup jelek.", "tr": "10-3", "py": "Shùxué kǎoshì wǒ méi kàn qīngchu yāoqiú, zuò cuò le hǎo jǐ gè tí, kǎo de tǐng chà de."}, {"s": "刘小雪", "zh": "明天还有考试呢，别想那么多了，先复习外语吧。", "id": "Besok masih ada ujian, jangan terlalu dipikirkan, ulang dulu pelajaran bahasa asing.", "tr": "10-3", "py": "Míngtiān hái yǒu kǎoshì ne, bié xiǎng nàme duō le, xiān fùxí wàiyǔ ba."}, {"s": "同学", "zh": "外语作业里有几个问题，我可以问问你吗？", "id": "Ada beberapa soal di PR bahasa asing, boleh aku tanyakan padamu?", "tr": "10-3", "py": "Wàiyǔ zuòyè lǐ yǒu jǐ gè wèntí, wǒ kěyǐ wèn wèn nǐ ma?"}, {"s": "刘小雪", "zh": "当然可以。在学习上，遇到什么问题都可以问我。", "id": "Tentu saja boleh. Dalam hal belajar, ada masalah apa pun boleh tanya aku.", "tr": "10-3", "py": "Dāngrán kěyǐ. Zài xuéxí shàng, yùdào shénme wèntí dōu kěyǐ wèn wǒ."}, {"s": "刘小雪", "zh": "不好意思，这几个题我也不会。咱们还是一起去办公室问问李老师吧。", "id": "Maaf, soal-soal ini aku juga tidak bisa. Sebaiknya kita pergi bersama ke ruang guru untuk bertanya kepada Bu Li.", "tr": "10-3", "py": "Bùhǎoyìsī, zhè jǐ gè tí wǒ yě bú huì. Zánmen háishi yìqǐ qù bàngōngshì wèn wèn Lǐ lǎoshī ba."}, {"s": "同学", "zh": "李老师，书上有几个问题，我们想问问您。", "id": "Bu Li, ada beberapa soal di buku, kami ingin menanyakannya kepada Ibu.", "tr": "10-5", "py": "Lǐ lǎoshī, shū shàng yǒu jǐ gè wèntí, wǒmen xiǎng wèn wèn nín."}, {"s": "李老师", "zh": "好，坐下说吧，哪个题不会？", "id": "Baik, duduklah dan ceritakan, soal yang mana yang tidak bisa?", "tr": "10-5", "py": "Hǎo, zuò xià shuō ba, nǎge tí bú huì?"}, {"s": "同学", "zh": "书上第五页的这个对话我看不懂，小雪也不明白。", "id": "Percakapan di halaman lima buku ini tidak saya pahami, Xiaoxue juga tidak mengerti.", "tr": "10-5", "py": "Shū shàng dì wǔ yè de zhège duìhuà wǒ kàn bu dǒng, Xiǎoxuě yě bù míngbai."}, {"s": "李老师", "zh": "我课上讲过这几句话，再给你们讲一遍。", "id": "Kalimat-kalimat ini sudah saya jelaskan di kelas, saya jelaskan sekali lagi untuk kalian.", "tr": "10-5", "py": "Wǒ kè shàng jiǎng guò zhè jǐ jù huà, zài gěi nǐmen jiǎng yí biàn."}, {"s": "", "zh": "（李老师给学生讲题。）", "id": "(Bu Li menjelaskan soal kepada murid-murid.)", "tr": "10-5", "py": "(Lǐ lǎoshī gěi xuéshēng jiǎng tí.)"}, {"s": "同学", "zh": "我终于懂了。这些句子一点儿也不难。", "id": "Akhirnya saya mengerti. Kalimat-kalimat ini sama sekali tidak sulit.", "tr": "10-5", "py": "Wǒ zhōngyú dǒng le. Zhèxiē jùzi yìdiǎnr yě bù nán."}, {"s": "刘小雪", "zh": "我也明白了，谢谢您，李老师。", "id": "Saya juga sudah mengerti, terima kasih, Bu Li.", "tr": "10-5", "py": "Wǒ yě míngbai le, xièxie nín, Lǐ lǎoshī."}, {"s": "李老师", "zh": "我这本书上还有几个练习，你们回家也做一做，明天再把书还给我。", "id": "Di buku saya ini masih ada beberapa latihan, kerjakan juga di rumah, besok saja kembalikan bukunya kepada saya.", "tr": "10-5", "py": "Wǒ zhè běn shū shàng hái yǒu jǐ gè liànxí, nǐmen huí jiā yě zuò yí zuò, míngtiān zài bǎ shū huán gěi wǒ."}, {"s": "", "zh": "家月姐姐：", "id": "Kak Jiayue,", "tr": "10-7", "py": "Jiāyuè jiějie:"}, {"s": "", "zh": "你最近怎么样？忙不忙？", "id": "Bagaimana kabarmu akhir-akhir ini? Sibuk tidak?", "tr": "10-7", "py": "Nǐ zuìjìn zěnmeyàng? Máng bu máng?"}, {"s": "", "zh": "我现在上初中二年级，学习越来越忙，后年就要考高中了。", "id": "Sekarang aku kelas dua SMP, belajarku makin lama makin sibuk, dua tahun lagi aku sudah harus ujian masuk SMA.", "tr": "10-7", "py": "Wǒ xiànzài shàng chūzhōng èr niánjí, xuéxí yuè lái yuè máng, hòunián jiù yào kǎo gāozhōng le."}, {"s": "", "zh": "中国的学校一般是小学六年，初中三年，高中三年。", "id": "Sekolah di Tiongkok umumnya SD enam tahun, SMP tiga tahun, dan SMA tiga tahun.", "tr": "10-7", "py": "Zhōngguó de xuéxiào yìbān shì xiǎoxué liù nián, chūzhōng sān nián, gāozhōng sān nián."}, {"s": "", "zh": "妈妈说想考上好大学，就得上一个好高中；为了考上好高中，初中就得有一个不错的成绩，所以我现在非常努力。", "id": "Kata Mama, kalau mau diterima di universitas yang bagus, harus masuk SMA yang bagus; supaya diterima di SMA yang bagus, waktu SMP nilainya harus cukup baik, jadi sekarang aku belajar dengan sangat giat.", "tr": "10-7", "py": "Māma shuō xiǎng kǎo shàng hǎo dàxué, jiù de shàng yí gè hǎo gāozhōng; wèile kǎo shàng hǎo gāozhōng, chūzhōng jiù de yǒu yí gè búcuò de chéngjì, suǒyǐ wǒ xiànzài fēicháng nǔlì."}, {"s": "", "zh": "家月姐姐，你知道吗？在你的影响下，我也开始喜欢拍照了。", "id": "Kak Jiayue, tahukah kamu? Karena pengaruhmu, aku juga mulai suka memotret.", "tr": "10-7", "py": "Jiāyuè jiějie, nǐ zhīdào ma? Zài nǐ de yǐngxiǎng xià, wǒ yě kāishǐ xǐhuan pāizhào le."}, {"s": "", "zh": "下次你再来北京，我给你看看我照的照片。", "id": "Lain kali kalau kamu datang lagi ke Beijing, akan kutunjukkan foto-foto yang kuambil.", "tr": "10-7", "py": "Xià cì nǐ zài lái Běijīng, wǒ gěi nǐ kànkan wǒ zhào de zhàopiàn."}], "teks": [{"tr": "10-1", "nama": "课文1 · Cara belajar Liu Xiaoxue"}, {"tr": "10-3", "nama": "课文2 · Ujian kemarin"}, {"tr": "10-5", "nama": "课文3 · Bertanya kepada Bu Li"}, {"tr": "10-7", "nama": "课文4 · Surel untuk Kak Jiayue"}]}, "11": {"judul": "看来我没办法解决这个问题", "arti": "Sepertinya aku tidak bisa menyelesaikan masalah ini", "kata": [{"h": "会议", "p": "huìyì", "k": "n.", "a": "rapat, pertemuan"}, {"h": "经理", "p": "jīnglǐ", "k": "n.", "a": "manajer"}, {"h": "开会", "p": "kāihuì", "k": "v.", "a": "rapat, mengadakan rapat"}, {"h": "后天", "p": "hòutiān", "k": "n.", "a": "lusa"}, {"h": "地点", "p": "dìdiǎn", "k": "n.", "a": "tempat, lokasi"}, {"h": "室", "p": "shì", "k": "n.", "a": "ruang, kamar"}, {"h": "发", "p": "fā", "k": "v.", "a": "mengirim"}, {"h": "笔记本（电脑）", "p": "bǐjìběn (diànnǎo)", "k": "n.", "a": "laptop"}, {"h": "或者", "p": "huòzhě", "k": "conj.", "a": "atau"}, {"h": "声音", "p": "shēngyīn", "k": "n.", "a": "suara"}, {"h": "看来", "p": "kànlái", "k": "v.", "a": "sepertinya, kelihatannya"}, {"h": "办法", "p": "bànfǎ", "k": "n.", "a": "cara, jalan keluar"}, {"h": "解决", "p": "jiějué", "k": "v.", "a": "menyelesaikan, memecahkan"}, {"h": "只能", "p": "zhǐ néng", "k": "-", "a": "hanya bisa"}, {"h": "别人", "p": "biérén", "k": "pron.", "a": "orang lain"}, {"h": "请假", "p": "qǐngjià", "k": "v.", "a": "minta izin, minta cuti"}, {"h": "同事", "p": "tóngshì", "k": "n.", "a": "rekan kerja"}, {"h": "休假", "p": "xiūjià", "k": "v.", "a": "cuti, berlibur"}, {"h": "怕", "p": "pà", "k": "v.", "a": "takut, khawatir"}, {"h": "邮箱", "p": "yóuxiāng", "k": "n.", "a": "alamat surel, kotak surat"}, {"h": "老张", "p": "Lǎo Zhāng", "k": "专名", "a": "Lao Zhang (Pak Zhang)"}, {"h": "愿意", "p": "yuànyì", "k": "mod.", "a": "mau, bersedia"}, {"h": "城市", "p": "chéngshì", "k": "n.", "a": "kota"}, {"h": "离开", "p": "líkāi", "k": "v.", "a": "meninggalkan, pergi dari"}, {"h": "机会", "p": "jīhuì", "k": "n.", "a": "kesempatan"}, {"h": "生活", "p": "shēnghuó", "k": "n./v.", "a": "kehidupan; hidup"}, {"h": "为", "p": "wèi", "k": "prep.", "a": "untuk, demi"}, {"h": "或", "p": "huò", "k": "conj.", "a": "atau"}], "dialog": [{"s": "王一雪", "zh": "会议下午几点开始？", "id": "Rapatnya mulai jam berapa sore ini?", "tr": "11-1", "py": "Huìyì xiàwǔ jǐ diǎn kāishǐ?"}, {"s": "杨同乐", "zh": "今天下午经理不在，不开会了。", "id": "Sore ini manajer tidak ada, rapatnya batal.", "tr": "11-1", "py": "Jīntiān xiàwǔ jīnglǐ bú zài, bù kāihuì le."}, {"s": "王一雪", "zh": "那什么时候开会？", "id": "Lalu kapan rapatnya?", "tr": "11-1", "py": "Nà shénme shíhou kāihuì?"}, {"s": "杨同乐", "zh": "后天上午十点，会议地点换到第一会议室。我正要给大家发邮件。", "id": "Lusa jam sepuluh pagi, tempat rapat pindah ke ruang rapat satu. Aku baru mau mengirim surel ke semua orang.", "tr": "11-1", "py": "Hòutiān shàngwǔ shí diǎn, huìyì dìdiǎn huàn dào dìyī huìyì shì. Wǒ zhèng yào gěi dàjiā fā yóujiàn."}, {"s": "王一雪", "zh": "开会的时候，我们用会议室的电脑还是自己的笔记本电脑？", "id": "Waktu rapat, kita pakai komputer ruang rapat atau laptop sendiri?", "tr": "11-1", "py": "Kāihuì de shíhou, wǒmen yòng huìyì shì de diànnǎo háishi zìjǐ de bǐjìběn diànnǎo?"}, {"s": "杨同乐", "zh": "会议室的电脑或者自己的电脑都可以。", "id": "Komputer ruang rapat atau komputer sendiri, dua-duanya boleh.", "tr": "11-1", "py": "Huìyì shì de diànnǎo huòzhě zìjǐ de diànnǎo dōu kěyǐ."}, {"s": "王一雪", "zh": "那到时候咱们早点儿过去，你帮我把电脑接好吧。", "id": "Kalau begitu nanti kita datang lebih awal, tolong pasangkan komputerku ya. (接 di sini berarti \"menyambungkan/memasang\")", "tr": "11-1", "py": "Nà dào shíhou zánmen zǎo diǎnr guòqù, nǐ bāng wǒ bǎ diànnǎo jiē hǎo ba."}, {"s": "王一雪", "zh": "电脑接好了吗？", "id": "Komputernya sudah terpasang?", "tr": "11-3", "py": "Diànnǎo jiē hǎo le ma?"}, {"s": "杨同乐", "zh": "已经接好了，您开机看看有没有问题。", "id": "Sudah terpasang, coba Anda nyalakan dan lihat apakah ada masalah.", "tr": "11-3", "py": "Yǐjīng jiē hǎo le, nín kāijī kànkan yǒu méiyǒu wèntí."}, {"s": "王一雪", "zh": "现在什么都看不见。", "id": "Sekarang tidak ada apa-apa yang kelihatan.", "tr": "11-3", "py": "Xiànzài shénme dōu kàn bújiàn."}, {"s": "杨同乐", "zh": "我检查一下哪里出问题了……您再试一下。", "id": "Saya periksa dulu di mana masalahnya… Coba Anda nyalakan lagi.", "tr": "11-3", "py": "Wǒ jiǎnchá yíxià nǎlǐ chū wèntí le…… nín zài shì yíxià."}, {"s": "王一雪", "zh": "看见了，但是听不见声音。", "id": "Sudah kelihatan, tetapi suaranya tidak terdengar.", "tr": "11-3", "py": "Kànjiàn le, dànshì tīng bújiàn shēngyīn."}, {"s": "杨同乐", "zh": "现在呢？", "id": "Kalau sekarang?", "tr": "11-3", "py": "Xiànzài ne?"}, {"s": "王一雪", "zh": "听得见声音，但是声音有点儿小，听不清楚。", "id": "Suaranya terdengar, tetapi agak kecil, tidak terdengar jelas.", "tr": "11-3", "py": "Tīng de jiàn shēngyīn, dànshì shēngyīn yǒudiǎnr xiǎo, tīng bù qīngchu."}, {"s": "杨同乐", "zh": "看来我没办法解决这个问题，只能找别人来帮帮忙了。", "id": "Sepertinya saya tidak bisa menyelesaikan masalah ini, terpaksa minta bantuan orang lain.", "tr": "11-3", "py": "Kànlái wǒ méi bànfǎ jiějué zhège wèntí, zhǐnéng zhǎo biérén lái bāng bāngmáng le."}, {"s": "王一雪", "zh": "同乐，你看见老张了吗？", "id": "Tongle, kamu lihat Lao Zhang?", "tr": "11-5", "py": "Tónglè, nǐ kànjiàn lǎozhāng le ma?"}, {"s": "杨同乐", "zh": "老张没来。他说家里有点儿事，所以请假了。", "id": "Lao Zhang tidak datang. Katanya ada sedikit urusan keluarga, jadi dia minta izin.", "tr": "11-5", "py": "Lǎozhāng méi lái. Tā shuō jiā li yǒudiǎnr shì, suǒyǐ qǐngjià le."}, {"s": "王一雪", "zh": "好几个同事都休假了，开会前这么多工作我怕干不完。", "id": "Beberapa rekan kerja sedang cuti, aku khawatir pekerjaan sebanyak ini tidak selesai sebelum rapat.", "tr": "11-5", "py": "Hǎo jǐ gè tóngshì dōu xiūjià le, kāihuì qián zhème duō gōngzuò wǒ pà gàn bù wán."}, {"s": "杨同乐", "zh": "十二点多了，咱们先去吃饭吧。吃完饭，我跟您一起把这些工作做完。", "id": "Sudah lewat jam dua belas, ayo kita makan dulu. Sesudah makan, saya bantu Anda menyelesaikan pekerjaan ini bersama-sama.", "tr": "11-5", "py": "Shí'èr diǎn duō le, zánmen xiān qù chīfàn ba. Chī wán fàn, wǒ gēn nín yìqǐ bǎ zhèxiē gōngzuò zuò wán."}, {"s": "王一雪", "zh": "你先去吃，我想再干一会儿。明天开会前要发到公司的邮箱里。", "id": "Kamu makan duluan, aku mau bekerja sebentar lagi. Ini harus dikirim ke surel kantor sebelum rapat besok.", "tr": "11-5", "py": "Nǐ xiān qù chī, wǒ xiǎng zài gàn yíhuìr. Míngtiān kāihuì qián yào fā dào gōngsī de yóuxiāng lǐ."}, {"s": "杨同乐", "zh": "您没看到邮件吗？经理还没回来呢，下周才能开会。", "id": "Anda belum lihat surelnya? Manajer belum kembali, rapatnya baru bisa minggu depan.", "tr": "11-5", "py": "Nín méi kàn dào yóujiàn ma? Jīnglǐ hái méi huílái ne, xià zhōu cái néng kāihuì."}, {"s": "王一雪", "zh": "那不着急了。走，吃饭去。", "id": "Kalau begitu tidak perlu buru-buru. Ayo, kita makan.", "tr": "11-5", "py": "Nà bù zháojí le. Zǒu, chīfàn qù."}, {"s": "", "zh": "前几天，上海的同事来北京了。", "id": "Beberapa hari yang lalu, rekan kerja dari Shanghai datang ke Beijing.", "tr": "11-7", "py": "Qián jǐ tiān, Shànghǎi de tóngshì lái Běijīng le."}, {"s": "", "zh": "一起吃饭时，他们跟我说最近有不少同事去上海工作了，问我愿意不愿意也去上海。", "id": "Waktu makan bersama, mereka bilang akhir-akhir ini banyak rekan kerja yang pindah kerja ke Shanghai, dan bertanya apakah aku mau ke Shanghai juga.", "tr": "11-7", "py": "Yìqǐ chīfàn shí, tāmen gēn wǒ shuō zuìjìn yǒu bù shǎo tóngshì qù Shànghǎi gōngzuò le, wèn wǒ yuànyì bú yuànyì yě qù Shànghǎi."}, {"s": "", "zh": "我是这样想的：现在丈夫和孩子都在北京，刘明的工作很忙，小雪和小明也还小，我去别的城市工作就要离开他们。", "id": "Begini pikiranku: sekarang suami dan anak-anak semuanya di Beijing, pekerjaan Liu Ming sangat sibuk, Xiaoxue dan Xiaoming juga masih kecil; kalau aku bekerja di kota lain, aku harus meninggalkan mereka.", "tr": "11-7", "py": "Wǒ shì zhèyàng xiǎng de: xiànzài zhàngfu hé háizi dōu zài Běijīng, Liú Míng de gōngzuò hěn máng, Xiǎoxuě hé Xiǎomíng yě hái xiǎo, wǒ qù biéde chéngshì gōngzuò jiù yào líkāi tāmen."}, {"s": "", "zh": "虽然去上海可能会有更好的机会，但是对我来说，生活也很重要，我不愿意为工作或学习离开家人。", "id": "Meskipun di Shanghai mungkin ada kesempatan yang lebih baik, bagiku kehidupan juga sangat penting; aku tidak mau meninggalkan keluarga demi pekerjaan atau belajar.", "tr": "11-7", "py": "Suīrán qù Shànghǎi kěnéng huì yǒu gèng hǎo de jīhuì, dànshì duì wǒ lái shuō, shēnghuó yě hěn zhòngyào, wǒ bú yuànyì wèi gōngzuò huò xuéxí líkāi jiārén."}], "teks": [{"tr": "11-1", "nama": "课文1 · Rapat diundur"}, {"tr": "11-3", "nama": "课文2 · Masalah komputer"}, {"tr": "11-5", "nama": "课文3 · Banyak rekan kerja yang cuti"}, {"tr": "11-7", "nama": "课文4 · Catatan harian Wang Yixue"}]}, "12": {"judul": "这个季节天气变化很快", "arti": "Pada musim ini cuaca cepat berubah", "kata": [{"h": "街", "p": "jiē", "k": "n.", "a": "jalan, jalan raya"}, {"h": "开花", "p": "kāihuā", "k": "v.", "a": "berbunga, mekar"}, {"h": "公园", "p": "gōngyuán", "k": "n.", "a": "taman"}, {"h": "船", "p": "chuán", "k": "n.", "a": "perahu, kapal"}, {"h": "工作日", "p": "gōngzuòrì", "k": "n.", "a": "hari kerja"}, {"h": "地方", "p": "dìfang", "k": "n.", "a": "tempat"}, {"h": "刚才", "p": "gāngcái", "k": "n.", "a": "tadi, barusan"}, {"h": "刮", "p": "guā", "k": "v.", "a": "bertiup (angin)"}, {"h": "风", "p": "fēng", "k": "n.", "a": "angin"}, {"h": "新闻", "p": "xīnwén", "k": "n.", "a": "berita"}, {"h": "伞", "p": "sǎn", "k": "n.", "a": "payung"}, {"h": "借", "p": "jiè", "k": "v.", "a": "meminjamkan; meminjam"}, {"h": "把", "p": "bǎ", "k": "m.", "a": "kata penggolong untuk benda bergagang (payung, kursi, dll.)"}, {"h": "雨衣", "p": "yǔyī", "k": "n.", "a": "jas hujan"}, {"h": "变", "p": "biàn", "k": "v.", "a": "berubah"}, {"h": "季节", "p": "jìjié", "k": "n.", "a": "musim"}, {"h": "变化", "p": "biànhuà", "k": "v./n.", "a": "berubah; perubahan"}, {"h": "冬天", "p": "dōngtiān", "k": "n.", "a": "musim dingin"}, {"h": "常常", "p": "chángcháng", "k": "adv.", "a": "sering"}, {"h": "关注", "p": "guānzhù", "k": "v.", "a": "memperhatikan, mengikuti (berita, dll.)"}, {"h": "四季", "p": "sìjì", "k": "n.", "a": "empat musim"}, {"h": "春天", "p": "chūntiān", "k": "n.", "a": "musim semi"}, {"h": "夏天", "p": "xiàtiān", "k": "n.", "a": "musim panas"}, {"h": "凉快", "p": "liángkuai", "k": "adj.", "a": "sejuk"}, {"h": "秋天", "p": "qiūtiān", "k": "n.", "a": "musim gugur"}, {"h": "叶子", "p": "yèzi", "k": "n.", "a": "daun"}, {"h": "变成", "p": "biànchéng", "k": "v.", "a": "berubah menjadi"}], "dialog": [{"s": "白家月", "zh": "王老师，您看，这条街上的树都开花了。", "id": "Bu Wang, lihat, pohon-pohon di jalan ini sudah berbunga semua.", "tr": "12-1", "py": "Wáng lǎoshī, nín kàn, zhè tiáo jiē shàng de shù dōu kāihuā le."}, {"s": "王一飞", "zh": "上周我去公园坐船了，公园里的花也开了。", "id": "Minggu lalu saya naik perahu di taman, bunga-bunga di taman juga sudah mekar.", "tr": "12-1", "py": "Shàng zhōu wǒ qù gōngyuán zuò chuán le, gōngyuán lǐ de huā yě kāi le."}, {"s": "白家月", "zh": "天气这么好，下午我也想去公园坐船。", "id": "Cuacanya bagus sekali, sore ini saya juga ingin naik perahu di taman.", "tr": "12-1", "py": "Tiānqì zhème hǎo, xiàwǔ wǒ yě xiǎng qù gōngyuán zuò chuán."}, {"s": "王一飞", "zh": "去吧！今天是工作日，人应该不多。", "id": "Pergilah! Hari ini hari kerja, seharusnya tidak banyak orang.", "tr": "12-1", "py": "Qù ba! Jīntiān shì gōngzuòrì, rén yīnggāi bù duō."}, {"s": "白家月", "zh": "您有时间吗？我想跟您一起去。", "id": "Ibu ada waktu? Saya ingin pergi bersama Ibu.", "tr": "12-1", "py": "Nín yǒu shíjiān ma? Wǒ xiǎng gēn nín yìqǐ qù."}, {"s": "王一飞", "zh": "我今天下午有课，不能去太远的地方。", "id": "Sore ini saya ada kelas, tidak bisa pergi ke tempat yang terlalu jauh.", "tr": "12-1", "py": "Wǒ jīntiān xiàwǔ yǒu kè, bù néng qù tài yuǎn de dìfang."}, {"s": "白家月", "zh": "那咱们换一天去？", "id": "Kalau begitu kita pergi di hari lain?", "tr": "12-1", "py": "Nà zánmen huàn yì tiān qù?"}, {"s": "王一飞", "zh": "行。或者明天去，或者后天去，我给你打电话。", "id": "Boleh. Besok atau lusa, nanti saya telepon kamu.", "tr": "12-1", "py": "Xíng. Huòzhě míngtiān qù, huòzhě hòutiān qù, wǒ gěi nǐ dǎdiànhuà."}, {"s": "白家月", "zh": "刚才还是大晴天呢，怎么突然就刮起风来了？", "id": "Tadi masih cerah sekali, kenapa tiba-tiba berangin?", "tr": "12-3", "py": "Gāngcái háishi dà qíng tiān ne, zěnme tūrán jiù guā qǐ fēng lái le?"}, {"s": "王一飞", "zh": "好像新闻里说今天有雨。", "id": "Sepertinya di berita dibilang hari ini akan hujan.", "tr": "12-3", "py": "Hǎoxiàng xīnwén lǐ shuō jīntiān yǒu yǔ."}, {"s": "白家月", "zh": "啊？我每天书包里都放着雨伞，就今天没带。", "id": "Hah? Setiap hari aku selalu menaruh payung di tas, cuma hari ini tidak kubawa.", "tr": "12-3", "py": "A? Wǒ měi tiān shūbāo lǐ dōu fàng zhe yǔ sǎn, jiù jīntiān méi dài."}, {"s": "王一飞", "zh": "我可以借给你，我车里有一把伞和一件雨衣。", "id": "Aku bisa meminjamkannya padamu, di mobilku ada sebuah payung dan sebuah jas hujan.", "tr": "12-3", "py": "Wǒ kěyǐ jiè gěi nǐ, wǒ chē lǐ yǒu yì bǎ sǎn hé yí jiàn yǔyī."}, {"s": "白家月", "zh": "谢谢，希望下午天气能变好。", "id": "Terima kasih, semoga sore nanti cuacanya membaik.", "tr": "12-3", "py": "Xièxie, xīwàng xiàwǔ tiānqì néng biàn hǎo."}, {"s": "王一飞", "zh": "这个季节天气变化很快。", "id": "Pada musim ini cuaca cepat berubah.", "tr": "12-3", "py": "Zhège jìjié tiānqì biànhuà hěn kuài."}, {"s": "白家月", "zh": "雨已经下起来了，咱们快点儿走吧。", "id": "Hujan sudah mulai turun, ayo kita jalan lebih cepat.", "tr": "12-3", "py": "Yǔ yǐjīng xià qǐlái le, zánmen kuài diǎnr zǒu ba."}, {"s": "白家月", "zh": "您来这里已经一年多了，习惯了吧？", "id": "Ibu sudah lebih dari setahun di sini, sudah terbiasa, kan?", "tr": "12-5", "py": "Nín lái zhèlǐ yǐjīng yì nián duō le, xíguàn le ba?"}, {"s": "王一飞", "zh": "别的早就习惯了，就是天气我还不太习惯。", "id": "Hal lain sudah lama terbiasa, hanya cuacanya yang saya belum terlalu terbiasa.", "tr": "12-5", "py": "Biéde zǎo jiù xíguàn le, jiù shì tiānqì wǒ hái bú tài xíguàn."}, {"s": "白家月", "zh": "为什么？您不喜欢这里的天气吗？", "id": "Kenapa? Ibu tidak suka cuaca di sini?", "tr": "12-5", "py": "Wèishénme? Nín bù xǐhuan zhèlǐ de tiānqì ma?"}, {"s": "王一飞", "zh": "我觉得冬天太冷了。", "id": "Menurut saya musim dinginnya terlalu dingin.", "tr": "12-5", "py": "Wǒ juéde dōngtiān tài lěng le."}, {"s": "白家月", "zh": "冬天虽然冷，但是下雪的时候特别漂亮。", "id": "Meskipun musim dingin itu dingin, tetapi waktu turun salju indah sekali.", "tr": "12-5", "py": "Dōngtiān suīrán lěng, dànshì xià xuě de shíhou tèbié piàoliang."}, {"s": "王一飞", "zh": "我也喜欢雪。北京常常下雪，但听说今年就下了一次。", "id": "Saya juga suka salju. Di Beijing sering turun salju, tetapi katanya tahun ini baru turun sekali saja.", "tr": "12-5", "py": "Wǒ yě xǐhuan xuě. Běijīng chángcháng xià xuě, dàn tīngshuō jīnnián jiù xià le yí cì."}, {"s": "白家月", "zh": "我没关注过北京的天气，但是新闻里说过，今年冬天很多地方雪下得都少了。", "id": "Saya tidak pernah mengikuti cuaca Beijing, tetapi di berita pernah dikatakan bahwa musim dingin tahun ini di banyak tempat salju yang turun lebih sedikit.", "tr": "12-5", "py": "Wǒ méi guānzhù guò Běijīng de tiānqì, dànshì xīnwén lǐ shuō guò, jīnnián dōngtiān hěn duō dìfang xuě xià de dōu shǎo le."}, {"s": "", "zh": "我离开北京到这里工作一年多了。", "id": "Sudah lebih dari setahun aku meninggalkan Beijing dan bekerja di sini.", "tr": "12-7", "py": "Wǒ líkāi Běijīng dào zhèlǐ gōngzuò yì nián duō le."}, {"s": "", "zh": "这一年多住下来，我还是更喜欢北京的四季。", "id": "Setelah tinggal di sini lebih dari setahun, aku tetap lebih suka empat musim di Beijing.", "tr": "12-7", "py": "Zhè yì nián duō zhù xiàlái, wǒ háishi gèng xǐhuan Běijīng de sìjì."}, {"s": "", "zh": "北京的春天最舒服，天气不冷不热。", "id": "Musim semi di Beijing paling nyaman, cuacanya tidak dingin dan tidak panas.", "tr": "12-7", "py": "Běijīng de chūntiān zuì shūfu, tiānqì bù lěng bú rè."}, {"s": "", "zh": "夏天白天很热，但是晚上比较凉快。", "id": "Pada musim panas siang hari sangat panas, tetapi malam hari cukup sejuk.", "tr": "12-7", "py": "Xiàtiān báitiān hěn rè, dànshì wǎnshang bǐjiào liángkuai."}, {"s": "", "zh": "秋天树上的叶子都变成了红色、黄色，非常漂亮。", "id": "Pada musim gugur daun-daun di pohon berubah menjadi merah dan kuning, indah sekali.", "tr": "12-7", "py": "Qiūtiān shù shàng de yèzi dōu biànchéng le hóngsè, huángsè, fēicháng piàoliang."}, {"s": "", "zh": "冬天不但冷，而且风很大，我最不喜欢冬天。", "id": "Musim dingin bukan hanya dingin, anginnya juga kencang; aku paling tidak suka musim dingin.", "tr": "12-7", "py": "Dōngtiān búdàn lěng, érqiě fēng hěn dà, wǒ zuì bù xǐhuan dōngtiān."}, {"s": "", "zh": "每个人都有自己最喜欢的季节，你最喜欢哪个季节呢？", "id": "Setiap orang punya musim favoritnya sendiri, kamu paling suka musim apa?", "tr": "12-7", "py": "Měi gè rén dōu yǒu zìjǐ zuì xǐhuan de jìjié, nǐ zuì xǐhuan nǎge jìjié ne?"}], "teks": [{"tr": "12-1", "nama": "课文1 · Pohon-pohon sedang berbunga"}, {"tr": "12-3", "nama": "课文2 · Tiba-tiba berangin dan hujan"}, {"tr": "12-5", "nama": "课文3 · Salju di Beijing"}, {"tr": "12-7", "nama": "课文4 · Empat musim di Beijing"}]}, "13": {"judul": "我的新邻居来自英国", "arti": "Tetangga baruku berasal dari Inggris", "kata": [{"h": "请客", "p": "qǐngkè", "k": "v.", "a": "mentraktir"}, {"h": "南方", "p": "nánfāng", "k": "n.", "a": "selatan, daerah selatan"}, {"h": "北方", "p": "běifāng", "k": "n.", "a": "utara, daerah utara"}, {"h": "做法", "p": "zuòfǎ", "k": "n.", "a": "cara membuat, cara mengerjakan"}, {"h": "不同", "p": "bù tóng", "k": "-", "a": "berbeda"}, {"h": "加", "p": "jiā", "k": "v.", "a": "menambah"}, {"h": "的话", "p": "dehuà", "k": "part.", "a": "partikel di akhir anak kalimat pengandaian (\"kalau …\")"}, {"h": "做客", "p": "zuòkè", "k": "v.", "a": "bertamu"}, {"h": "邻居", "p": "línjū", "k": "n.", "a": "tetangga"}, {"h": "放心", "p": "fàngxīn", "k": "v.", "a": "tenang, tidak khawatir"}, {"h": "酒", "p": "jiǔ", "k": "n.", "a": "minuman beralkohol"}, {"h": "放", "p": "fàng", "k": "v.", "a": "menaruh, meletakkan"}, {"h": "客人", "p": "kèrén", "k": "n.", "a": "tamu"}, {"h": "晚会", "p": "wǎnhuì", "k": "n.", "a": "pesta malam, acara malam"}, {"h": "礼物", "p": "lǐwù", "k": "n.", "a": "hadiah"}, {"h": "画家", "p": "huàjiā", "k": "n.", "a": "pelukis"}, {"h": "盘子", "p": "pánzi", "k": "n.", "a": "piring"}, {"h": "一边", "p": "yìbiān", "k": "adv.", "a": "sambil, sekaligus"}, {"h": "聊天儿", "p": "liáotiānr", "k": "v.", "a": "mengobrol"}, {"h": "来自", "p": "láizì", "k": "v.", "a": "berasal dari"}, {"h": "夫妻", "p": "fūqī", "k": "n.", "a": "suami istri"}, {"h": "直到", "p": "zhídào", "k": "v.", "a": "sampai, hingga"}, {"h": "地图", "p": "dìtú", "k": "n.", "a": "peta"}, {"h": "点", "p": "diǎn", "k": "n.", "a": "titik"}, {"h": "感到", "p": "gǎndào", "k": "v.", "a": "merasa"}, {"h": "东方", "p": "dōngfāng", "k": "n.", "a": "Timur, dunia Timur"}, {"h": "文化", "p": "wénhuà", "k": "n.", "a": "budaya"}, {"h": "英国", "p": "Yīngguó", "k": "专名", "a": "Inggris (Britania Raya)"}], "dialog": [{"s": "杨同乐", "zh": "今天我请客，你们想吃什么就点什么！", "id": "Hari ini aku yang traktir, kalian mau makan apa, pesan saja!", "tr": "13-1", "py": "Jīntiān wǒ qǐngkè, nǐmen xiǎng chī shénme jiù diǎn shénme!"}, {"s": "王一雪", "zh": "那我就不客气了。听说这家饭馆的鱼做得很特别？", "id": "Kalau begitu aku tidak sungkan. Katanya ikan di restoran ini dimasak dengan cara yang istimewa?", "tr": "13-1", "py": "Nà wǒ jiù búkèqi le. Tīngshuō zhè jiā fànguǎn de yú zuò de hěn tèbié?"}, {"s": "杨同乐", "zh": "对，南方菜跟你们北方菜的做法不同。除了鱼，你们还想吃什么？", "id": "Betul, cara memasak masakan selatan berbeda dengan masakan utara kalian. Selain ikan, kalian mau makan apa lagi?", "tr": "13-1", "py": "Duì, nánfāng cài gēn nǐmen běifāng cài de zuòfǎ bùtóng. Chúle yú, nǐmen hái xiǎng chī shénme?"}, {"s": "同事", "zh": "我不常吃南方菜，还是你决定吧。", "id": "Aku jarang makan masakan selatan, kamu saja yang memutuskan.", "tr": "13-1", "py": "Wǒ bù cháng chī nánfāng cài, háishi nǐ juédìng ba."}, {"s": "杨同乐", "zh": "好，那再加一个鸡肉，一个……", "id": "Baik, kalau begitu tambah satu daging ayam, satu lagi…", "tr": "13-1", "py": "Hǎo, nà zài jiā yí gè jī ròu, yí gè……"}, {"s": "王一雪", "zh": "咱们就三个人，别点那么多。", "id": "Kita cuma bertiga, jangan pesan sebanyak itu.", "tr": "13-1", "py": "Zánmen jiù sān gè rén, bié diǎn nàme duō."}, {"s": "杨同乐", "zh": "好，那先来这几个菜。", "id": "Baik, kalau begitu pesan beberapa masakan ini dulu.", "tr": "13-1", "py": "Hǎo, nà xiān lái zhè jǐ gè cài."}, {"s": "王一雪", "zh": "对了，下周我儿子过生日，你们有时间的话，就来我家做客，我给你们做北京菜。", "id": "Oh ya, minggu depan anakku berulang tahun; kalau kalian ada waktu, datanglah bertamu ke rumahku, akan kumasakkan masakan Beijing.", "tr": "13-1", "py": "Duì le, xià zhōu wǒ érzi guò shēngrì, nǐmen yǒu shíjiān dehuà, jiù lái wǒ jiā zuòkè, wǒ gěi nǐmen zuò Běijīng cài."}, {"s": "王一雪", "zh": "第一次请新邻居来做客，总是担心有什么没准备好。", "id": "Pertama kali mengundang tetangga baru bertamu, aku terus khawatir ada yang belum siap.", "tr": "13-3", "py": "Dìyī cì qǐng xīn línjū lái zuòkè, zǒngshì dānxīn yǒu shénme méi zhǔnbèi hǎo."}, {"s": "刘明", "zh": "放心吧，我帮你看了，都已经准备好了。", "id": "Tenang saja, sudah kuperiksa, semuanya sudah siap.", "tr": "13-3", "py": "Fàngxīn ba, wǒ bāng nǐ kàn le, dōu yǐjīng zhǔnbèi hǎo le."}, {"s": "王一雪", "zh": "我记得刚才已经把饮料拿出来了，怎么不见了？", "id": "Seingatku tadi minumannya sudah kukeluarkan, kenapa tidak ada?", "tr": "13-3", "py": "Wǒ jìde gāngcái yǐjīng bǎ yǐnliào ná chūlái le, zěnme bújiàn le?"}, {"s": "刘明", "zh": "我把饮料和酒都放进冰箱里了，客人来了再拿出来。", "id": "Minuman dan arak sudah kumasukkan ke kulkas, nanti kalau tamu datang baru dikeluarkan.", "tr": "13-3", "py": "Wǒ bǎ yǐnliào hé jiǔ dōu fàng jìn bīngxiāng lǐ le, kèrén lái le zài ná chūlái."}, {"s": "王一雪", "zh": "音乐的声音合适吗？", "id": "Volume musiknya sudah pas?", "tr": "13-3", "py": "Yīnyuè de shēngyīn héshì ma?"}, {"s": "刘明", "zh": "你把声音开得太大了，我去关小一点儿。", "id": "Suaranya kamu setel terlalu keras, biar kukecilkan sedikit.", "tr": "13-3", "py": "Nǐ bǎ shēngyīn kāi de tài dà le, wǒ qù guān xiǎo yìdiǎnr."}, {"s": "王一雪", "zh": "好，那我们就等客人来吧。", "id": "Baik, kalau begitu kita tunggu tamunya datang.", "tr": "13-3", "py": "Hǎo, nà wǒmen jiù děng kèrén lái ba."}, {"s": "王一雪", "zh": "谢谢你们来参加我儿子的生日晚会，希望大家今晚玩得开心。", "id": "Terima kasih sudah datang ke pesta ulang tahun anakku, semoga semuanya bersenang-senang malam ini.", "tr": "13-5", "py": "Xièxie nǐmen lái cānjiā wǒ érzi de shēngrì wǎnhuì, xīwàng dàjiā jīn wǎn wán de kāixīn."}, {"s": "杨同乐", "zh": "小明，生日快乐！我准备了一个小礼物，希望你喜欢！", "id": "Xiaoming, selamat ulang tahun! Aku menyiapkan hadiah kecil, semoga kamu suka!", "tr": "13-5", "py": "Xiǎomíng, shēngrì kuàilè! Wǒ zhǔnbèi le yí gè xiǎo lǐwù, xīwàng nǐ xǐhuan!"}, {"s": "刘小明", "zh": "谢谢您，我可以打开吗？", "id": "Terima kasih, boleh saya buka?", "tr": "13-5", "py": "Xièxie nín, wǒ kěyǐ dǎkāi ma?"}, {"s": "杨同乐", "zh": "当然可以，你妈妈说你跟姐姐一样，都喜欢画画，对吗？", "id": "Tentu boleh. Kata ibumu kamu sama seperti kakakmu, sama-sama suka menggambar, benar?", "tr": "13-5", "py": "Dāngrán kěyǐ, nǐ māma shuō nǐ gēn jiějie yíyàng, dōu xǐhuan huà huà, duì ma?"}, {"s": "刘小明", "zh": "对，我想做一名画家。啊！画板和画笔，这正是我需要的。我太喜欢了。", "id": "Benar, saya ingin menjadi pelukis. Wah! Papan lukis dan kuas, ini persis yang saya perlukan. Saya suka sekali.", "tr": "13-5", "py": "Duì, wǒ xiǎng zuò yì míng huàjiā. A! Huà bǎn hé huàbǐ, zhè zhèng shì wǒ xūyào de. Wǒ tài xǐhuan le."}, {"s": "王一雪", "zh": "我去把盘子拿过来，咱们一边吃蛋糕，一边聊天儿吧。", "id": "Aku ambil piring dulu, ayo kita makan kue sambil mengobrol.", "tr": "13-5", "py": "Wǒ qù bǎ pánzi ná guòlái, zánmen yìbiān chī dàngāo, yìbiān liáotiānr ba."}, {"s": "", "zh": "我的新邻居是来自英国的夫妻。", "id": "Tetangga baruku adalah sepasang suami istri dari Inggris.", "tr": "13-7", "py": "Wǒ de xīn línjū shì láizì yīngguó de fūqī."}, {"s": "", "zh": "上周我去他们家做客了。", "id": "Minggu lalu aku bertamu ke rumah mereka.", "tr": "13-7", "py": "Shàng zhōu wǒ qù tāmen jiā zuòkè le."}, {"s": "", "zh": "他们做了很多好吃的，还准备了英国的红茶。", "id": "Mereka memasak banyak makanan enak, dan juga menyiapkan teh hitam Inggris.", "tr": "13-7", "py": "Tāmen zuò le hěn duō hǎochī de, hái zhǔnbèi le yīngguó de hóngchá."}, {"s": "", "zh": "那天我跟他们一边喝红茶，一边聊天儿，直到十二点多才回家。", "id": "Hari itu aku minum teh hitam sambil mengobrol dengan mereka, sampai lewat jam dua belas baru pulang.", "tr": "13-7", "py": "Nà tiān wǒ gēn tāmen yìbiān hē hóngchá, yìbiān liáotiānr, zhídào shí'èr diǎn duō cái huí jiā."}, {"s": "", "zh": "他们年轻的时候喜欢旅游，他家有一张世界地图，上面每一个红点都是他们去过的地方。", "id": "Waktu muda mereka suka bepergian; di rumah mereka ada sebuah peta dunia, setiap titik merah di atasnya adalah tempat yang pernah mereka kunjungi.", "tr": "13-7", "py": "Tāmen niánqīng de shíhou xǐhuan lǚyóu, tā jiā yǒu yì Zhāng shìjiè dìtú, shàngmiàn měi yí gè hóng diǎn dōu shì tāmen qù guò de dìfang."}, {"s": "", "zh": "后来，他们感到东方的文化很特别，就开始学习中文。", "id": "Kemudian mereka merasa budaya Timur sangat istimewa, lalu mulai belajar bahasa Mandarin.", "tr": "13-7", "py": "Hòulái, tāmen gǎndào dōngfāng de wénhuà hěn tèbié, jiù kāishǐ xuéxí Zhōngwén."}, {"s": "", "zh": "今天是小明的生日，我请他们到我家玩，来看看中国人的家，也尝尝中国菜。", "id": "Hari ini ulang tahun Xiaoming, aku mengundang mereka main ke rumahku, melihat rumah orang Tiongkok sekaligus mencicipi masakan Tiongkok.", "tr": "13-7", "py": "Jīntiān shì Xiǎomíng de shēngrì, wǒ qǐng tāmen dào wǒ jiā wán, lái kànkan Zhōngguó rén de jiā, yě cháng cháng Zhōngguó cài."}], "teks": [{"tr": "13-1", "nama": "课文1 · Ditraktir makan di restoran"}, {"tr": "13-3", "nama": "课文2 · Bersiap menyambut tamu"}, {"tr": "13-5", "nama": "课文3 · Pesta ulang tahun Xiaoming"}, {"tr": "13-7", "nama": "课文4 · Tetangga dari Inggris"}]}, "14": {"judul": "这本书被别人借走了", "arti": "Buku ini sudah dipinjam orang lain", "kata": [{"h": "词典", "p": "cídiǎn", "k": "n.", "a": "kamus"}, {"h": "最好", "p": "zuìhǎo", "k": "adv.", "a": "sebaiknya"}, {"h": "节", "p": "jié", "k": "m.", "a": "kata penggolong untuk jam pelajaran"}, {"h": "图书馆", "p": "túshūguǎn", "k": "n.", "a": "perpustakaan"}, {"h": "被", "p": "bèi", "k": "prep.", "a": "oleh (penanda kalimat pasif)"}, {"h": "名人", "p": "míngrén", "k": "n.", "a": "orang terkenal, tokoh"}, {"h": "故事", "p": "gùshi", "k": "n.", "a": "cerita, kisah"}, {"h": "然后", "p": "ránhòu", "k": "conj.", "a": "kemudian, lalu"}, {"h": "报纸", "p": "bàozhǐ", "k": "n.", "a": "koran"}, {"h": "忘记", "p": "wàngjì", "k": "v.", "a": "lupa"}, {"h": "电子书", "p": "diànzǐshū", "k": "n.", "a": "buku elektronik (e-book)"}, {"h": "女生", "p": "nǚshēng", "k": "n.", "a": "siswi, mahasiswi"}, {"h": "表演", "p": "biǎoyǎn", "k": "v.", "a": "tampil, mempertunjukkan"}, {"h": "节目", "p": "jiémù", "k": "n.", "a": "acara, pertunjukan"}, {"h": "怎么办", "p": "zěnme bàn", "k": "-", "a": "bagaimana ini, harus bagaimana"}, {"h": "校长", "p": "xiàozhǎng", "k": "n.", "a": "kepala sekolah, rektor"}, {"h": "面前", "p": "miànqián", "k": "n.", "a": "di hadapan"}, {"h": "有些", "p": "yǒuxiē", "k": "adv.", "a": "agak, sedikit"}, {"h": "相信", "p": "xiāngxìn", "k": "v.", "a": "percaya"}, {"h": "新年", "p": "xīnnián", "k": "n.", "a": "Tahun Baru"}, {"h": "班级", "p": "bānjí", "k": "n.", "a": "kelas (di sekolah)"}, {"h": "跳", "p": "tiào", "k": "v.", "a": "melompat; menari"}, {"h": "留学生", "p": "liúxuéshēng", "k": "n.", "a": "mahasiswa asing"}, {"h": "最后", "p": "zuìhòu", "k": "n.", "a": "terakhir; akhirnya"}, {"h": "一块儿", "p": "yíkuàir", "k": "adv./n.", "a": "bersama-sama; tempat yang sama"}, {"h": "网站", "p": "wǎngzhàn", "k": "n.", "a": "situs web"}, {"h": "视频", "p": "shìpín", "k": "n.", "a": "video"}], "dialog": [{"s": "李文", "zh": "我借的这本词典最好今天还，但是我没时间去。", "id": "Kamus yang kupinjam ini sebaiknya dikembalikan hari ini, tetapi aku tidak sempat pergi.", "tr": "14-1", "py": "Wǒ jiè de zhè běn cídiǎn zuìhǎo jīntiān hái, dànshì wǒ méi shíjiān qù."}, {"s": "白家月", "zh": "下午我只有两节课，可以帮你去图书馆还书。", "id": "Sore ini aku hanya ada dua jam pelajaran, aku bisa membantumu mengembalikan buku ke perpustakaan.", "tr": "14-1", "py": "Xiàwǔ wǒ zhǐyǒu liǎng jié kè, kěyǐ bāng nǐ qù túshūguǎn huán shū."}, {"s": "李文", "zh": "那太谢谢了。你能再帮我借本书吗？", "id": "Terima kasih banyak. Bisakah kamu sekalian membantuku meminjam sebuah buku?", "tr": "14-1", "py": "Nà tài xièxie le. Nǐ néng zài bāng wǒ jiè běn shū ma?"}, {"s": "白家月", "zh": "行，你告诉我书名。", "id": "Boleh, beri tahu aku judul bukunya.", "tr": "14-1", "py": "Xíng, nǐ gàosu wǒ shū míng."}, {"s": "李文", "zh": "我把名字写在纸上吧。我去了好几次图书馆，这本书都被别人借走了。", "id": "Kutulis judulnya di kertas saja. Aku sudah beberapa kali ke perpustakaan, buku ini selalu sudah dipinjam orang lain.", "tr": "14-1", "py": "Wǒ bǎ míngzi xiě zài zhǐ shàng ba. Wǒ qù le hǎo jǐ cì túshūguǎn, zhè běn shū dōu bèi biérén jiè zǒu le."}, {"s": "白家月", "zh": "《名人的故事》？我有这本书。明天我借给你吧。", "id": "\"Kisah Orang-Orang Terkenal\"? Aku punya buku ini. Besok kupinjamkan padamu.", "tr": "14-1", "py": "《 Míngrén de gùshi 》? Wǒ yǒu zhè běn shū. Míngtiān wǒ jiè gěi nǐ ba."}, {"s": "安妮", "zh": "今天下课早，你一会儿做什么？", "id": "Hari ini pelajaran selesai lebih awal, sebentar lagi kamu mau apa?", "tr": "14-3", "py": "Jīntiān xiàkè zǎo, nǐ yíhuìr zuò shénme?"}, {"s": "白家月", "zh": "我今天忙得很，要先去图书馆借书，然后去游泳。", "id": "Hari ini aku sibuk sekali, mau ke perpustakaan pinjam buku dulu, lalu berenang.", "tr": "14-3", "py": "Wǒ jīntiān máng de hěn, yào xiān qù túshūguǎn jiè shū, ránhòu qù yóuyǒng."}, {"s": "安妮", "zh": "咱们一起走吧，我想去图书馆看看中文报纸。", "id": "Ayo kita pergi bersama, aku ingin membaca koran berbahasa Mandarin di perpustakaan.", "tr": "14-3", "py": "Zánmen yìqǐ zǒu ba, wǒ xiǎng qù túshūguǎn kànkan Zhōngwén bàozhǐ."}, {"s": "白家月", "zh": "等等，我的校园卡不见了，没有卡进不去图书馆。", "id": "Tunggu, kartu kampusku hilang, tanpa kartu tidak bisa masuk perpustakaan.", "tr": "14-3", "py": "Děng děng, wǒ de xiàoyuán kǎ bújiàn le, méiyǒu kǎ jìn bú qù túshūguǎn."}, {"s": "安妮", "zh": "你想想上一次用是什么时候？", "id": "Coba ingat, kapan terakhir kali kamu memakainya?", "tr": "14-3", "py": "Nǐ xiǎngxiǎng shàng yí cì yòng shì shénme shíhou?"}, {"s": "白家月", "zh": "我忘记了，可能被我放在家里了。", "id": "Aku lupa, mungkin tertinggal di rumah.", "tr": "14-3", "py": "Wǒ wàngjì le, kěnéng bèi wǒ fàng zài jiā lǐ le."}, {"s": "安妮", "zh": "进不去图书馆也没关系，上网看看有没有电子书。", "id": "Tidak bisa masuk perpustakaan juga tidak apa-apa, cari di internet apakah ada buku elektroniknya.", "tr": "14-3", "py": "Jìn bú qù túshūguǎn yě méiguānxi, shàngwǎng kànkan yǒu méiyǒu diànzǐshū."}, {"s": "白家月", "zh": "不行，我必须去，我还得帮李文还书呢。", "id": "Tidak bisa, aku harus pergi, aku masih harus mengembalikan buku Li Wen.", "tr": "14-3", "py": "Bùxíng, wǒ bìxū qù, wǒ hái de bāng Lǐ Wén huán shū ne."}, {"s": "李文", "zh": "下周学校有晚会，你知道吗？", "id": "Minggu depan ada acara malam di kampus, kamu tahu?", "tr": "14-5", "py": "Xià zhōu xuéxiào yǒu wǎnhuì, nǐ zhīdào ma?"}, {"s": "白家月", "zh": "知道，我和几个女生要表演一个节目。你也参加吗？", "id": "Tahu, aku dan beberapa mahasiswi akan menampilkan satu pertunjukan. Kamu ikut juga?", "tr": "14-5", "py": "Zhīdào, wǒ hé jǐ gè nǚshēng yào biǎoyǎn yí gè jiémù. Nǐ yě cānjiā ma?"}, {"s": "李文", "zh": "我想唱中文歌，但是还没找到人一起表演，不知道怎么办。", "id": "Aku ingin menyanyikan lagu Mandarin, tetapi belum menemukan orang untuk tampil bersama, tidak tahu harus bagaimana.", "tr": "14-5", "py": "Wǒ xiǎng chàng Zhōngwén gē, dànshì hái méi zhǎo dào rén yìqǐ biǎoyǎn, bù zhīdào zěnmebàn."}, {"s": "白家月", "zh": "找不到人，你就一个人唱吧。", "id": "Kalau tidak menemukan orang, kamu menyanyi sendiri saja.", "tr": "14-5", "py": "Zhǎo bú dào rén, nǐ jiù yí gè rén chàng ba."}, {"s": "李文", "zh": "一想到要在校长、老师和那么多同学面前表演，我就有些紧张。", "id": "Begitu terpikir harus tampil di depan rektor, para dosen, dan teman-teman sebanyak itu, aku jadi agak gugup.", "tr": "14-5", "py": "Yì xiǎng dào yào zài xiàozhǎng, lǎoshī hé nàme duō tóngxué miànqián biǎoyǎn, wǒ jiù yǒuxiē jǐnzhāng."}, {"s": "白家月", "zh": "紧张什么啊，我们都喜欢听你唱歌，你要相信自己。", "id": "Kenapa gugup, kami semua suka mendengarmu menyanyi, kamu harus percaya pada dirimu sendiri.", "tr": "14-5", "py": "Jǐnzhāng shénme a, wǒmen dōu xǐhuan tīng nǐ chànggē, nǐ yào xiāngxìn zìjǐ."}, {"s": "", "zh": "昨天是我们学校的新年晚会，每个班级的同学都表演节目了。", "id": "Kemarin ada acara malam Tahun Baru di kampus kami, mahasiswa dari setiap kelas menampilkan pertunjukan.", "tr": "14-7", "py": "Zuótiān shì wǒmen xuéxiào de xīnnián wǎnhuì, měi gè bānjí de tóngxué dōu biǎoyǎn jiémù le."}, {"s": "", "zh": "晚会是八点开始的，差不多十二点才结束。", "id": "Acaranya mulai jam delapan, dan baru selesai sekitar jam dua belas.", "tr": "14-7", "py": "Wǎnhuì shì bā diǎn kāishǐ de, chàbuduō shí'èr diǎn cái jiéshù."}, {"s": "", "zh": "我一个晚上跟大家一起又唱又跳，开心极了，也累坏了。", "id": "Semalaman aku bernyanyi dan menari bersama semua orang, senang sekali, tetapi juga capek sekali.", "tr": "14-7", "py": "Wǒ yí gè wǎnshang gēn dàjiā yìqǐ yòu chàng yòu tiào, kāixīn jí le, yě lèi huài le."}, {"s": "", "zh": "我最喜欢的节目是留学生们跳舞，最后老师和校长也被叫起来一块儿跳，特别有意思。", "id": "Pertunjukan yang paling kusukai adalah tarian para mahasiswa asing; pada akhirnya para dosen dan rektor juga diajak berdiri untuk menari bersama, seru sekali.", "tr": "14-7", "py": "Wǒ zuì xǐhuan de jiémù shì liúxuéshēngmen tiàowǔ, zuìhòu lǎoshī hé xiàozhǎng yě bèi jiào qǐlái yíkuàir tiào, tèbié yǒuyìsi."}, {"s": "", "zh": "过几天学校的网站上会有晚会的视频，我打算再看一遍。", "id": "Beberapa hari lagi akan ada video acara malam itu di situs kampus, aku berencana menontonnya sekali lagi.", "tr": "14-7", "py": "Guò jǐ tiān xuéxiào de wǎngzhàn shàng huì yǒu wǎnhuì de shìpín, wǒ dǎsuàn zài kàn yí biàn."}], "teks": [{"tr": "14-1", "nama": "课文1 · Meminjam buku di perpustakaan"}, {"tr": "14-3", "nama": "课文2 · Kartu kampus hilang"}, {"tr": "14-5", "nama": "课文3 · Tampil di acara malam sekolah"}, {"tr": "14-7", "nama": "课文4 · Acara malam Tahun Baru"}]}, "15": {"judul": "我是半个南京人", "arti": "Aku bisa dibilang setengah orang Nanjing", "kata": [{"h": "蓝", "p": "lán", "k": "adj.", "a": "biru"}, {"h": "段", "p": "duàn", "k": "m.", "a": "kata penggolong untuk bagian/jangka (waktu, jarak)"}, {"h": "附近", "p": "fùjìn", "k": "n.", "a": "sekitar, dekat"}, {"h": "马路", "p": "mǎlù", "k": "n.", "a": "jalan raya"}, {"h": "平时", "p": "píngshí", "k": "n.", "a": "biasanya, sehari-hari"}, {"h": "放学", "p": "f
