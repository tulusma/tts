<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b8322a">
<title>Grammar HSK 3</title>
<style>:root{--bg:#faf7f2;--card:#fff;--ink:#1f1b16;--mut:#6b6258;--line:#e6dfd4;--acc:#b8322a;--acc2:#f6e3e0;--ok:#1e7a46;--okb:#e2f3e8;--bad:#b3261e;--badb:#fbe5e3;--box:#f3efe7;--zh:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#211e1b;--ink:#ece6dd;--mut:#a39a8f;--line:#38322c;--acc:#e0675d;--acc2:#3a2321;--ok:#5cc58a;--okb:#1c3326;--bad:#f08178;--badb:#3d2220;--box:#2a2622}}
:root[data-theme="dark"]{--bg:#171513;--card:#211e1b;--ink:#ece6dd;--mut:#a39a8f;--line:#38322c;--acc:#e0675d;--acc2:#3a2321;--ok:#5cc58a;--okb:#1c3326;--bad:#f08178;--badb:#3d2220;--box:#2a2622}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--acc);color:#fff}
.top h1{flex:1;margin:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:rgba(255,255,255,.18);border:0;border-radius:8px;width:36px;height:34px;font-size:22px;line-height:1;color:#fff}
.tg{display:flex;gap:6px}
.tg button{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:999px;padding:3px 10px;font-size:13px}
.tg button[aria-pressed="true"]{background:#fff;color:var(--acc)}
main{max-width:760px;margin:0 auto;padding:16px 16px 80px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.hero p{margin:4px 0;color:var(--mut)}
.stat{display:flex;gap:10px;margin:12px 0 4px;flex-wrap:wrap}
.stat div{background:var(--box);border-radius:10px;padding:8px 12px;font-size:14px}
.stat b{font-size:18px;display:block}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 0}
.btn{display:block;width:100%;text-align:center;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:11px 12px;font-weight:600}
.btn.alt{background:transparent;color:var(--acc)}
.btn[disabled]{opacity:.45;cursor:default}
h2.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:22px 0 8px}
.les{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.les-h{display:flex;align-items:baseline;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.les-h .n{font-weight:700;color:var(--acc);min-width:28px}
.les-h .z{font-family:var(--zh);font-size:17px;flex:1}
.les-h .q{font-size:13px;color:var(--acc);background:none;border:0;padding:0;text-decoration:underline}
.tp{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px}
.tp:first-of-type{border-top:0}
.tp .t{flex:1}
.tp .c{font-size:12px;color:var(--mut);white-space:nowrap}
.tp:hover{background:var(--box)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--acc)}
.kode{display:inline-block;font-size:12px;color:var(--mut);background:var(--box);border-radius:6px;padding:2px 8px;margin-bottom:8px}
.ttl2{font-size:21px;line-height:1.3;margin:0 0 6px}
.rumus{font-family:var(--zh);background:var(--acc2);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:16px}
.jelas p{margin:0 0 10px}
.poin{margin:0;padding-left:20px}.poin li{margin:4px 0}
.ex{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:8px;align-items:flex-start}
.ex:first-of-type{border-top:0;padding-top:0}
.ex .b{flex:1;min-width:0}
.zh{font-family:var(--zh);font-size:19px;line-height:1.5}
.py{color:var(--mut);font-size:14px}
.id{font-size:14px}
.tag{display:inline-block;font-size:11px;background:var(--box);color:var(--mut);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.tag.bk{background:var(--acc2);color:var(--acc)}
.say{border:1px solid var(--line);background:var(--box);border-radius:8px;width:34px;height:34px;flex:none;font-size:15px}
.err{border-top:1px solid var(--line);padding:10px 0}
.err:first-of-type{border-top:0;padding-top:0}
.x{color:var(--bad)}.v{color:var(--ok)}
.x .zh{text-decoration:line-through;text-decoration-thickness:1px}
.why{font-size:14px;color:var(--mut);margin-top:2px}
.nav2{display:flex;gap:10px;margin-top:6px}
.nav2 .btn{flex:1}
.aud{font-size:14px;color:var(--mut)}
.aud a{color:var(--acc)}
.hide-py .py{display:none}.hide-id .id{display:none}
/* kuis */
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:2px 0 14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.qh{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:4px}
.qt{font-size:13px;color:var(--mut);margin:0 0 6px}
.qq{font-size:18px;margin:0 0 4px}
.qq.zhq{font-family:var(--zh);font-size:22px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-family:var(--zh);font-size:17px}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.no{border-color:var(--bad);background:var(--badb)}
.opt[disabled]{cursor:default}
.ansline{min-height:56px;border:1.5px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tile{font-family:var(--zh);font-size:18px;background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:6px 11px;min-width:40px}
.tile.used{visibility:hidden}
.ansline .tile{background:var(--acc2);border-color:var(--acc)}
.fb{border-radius:10px;padding:12px;margin-top:12px;font-size:15px}
.fb.ok{background:var(--okb)}.fb.no{background:var(--badb)}
.fb b{display:block;margin-bottom:4px}
.bsrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.res{text-align:center;padding:10px 0}
.res .big{font-size:46px;font-weight:700;color:var(--acc);line-height:1.1}
.wl{margin-top:8px}
.wl .err .t{font-size:12px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:30px 0}
@media (max-width:420px){.acts{grid-template-columns:1fr}.zh{font-size:18px}}
.say{display:none}
body.tts .say{display:inline-block}
.fb .say{margin-left:8px;vertical-align:middle}
[hidden]{display:none!important}
main a{color:var(--acc)}
.tabs{display:flex;gap:6px;background:var(--box);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.zhs{font-family:var(--zh)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.wc{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 6px;min-height:96px;text-align:center}
.wc .wh{font-family:var(--zh);font-size:26px;line-height:1.3}
.wc .py{font-size:14px}.wc .id{font-size:13px;line-height:1.3}
.rv{cursor:pointer}
.rv:not(.open) .py,.rv:not(.open) .id{visibility:hidden}
.wc.open{border-color:var(--acc)}
.rvbar{display:flex;gap:8px;margin-top:10px}.rvbar .btn{flex:1;padding:8px}
.trk{margin:14px 0 4px;font-size:14px;font-weight:600}.trk:first-of-type{margin-top:4px}
.spk{font-family:var(--zh);color:var(--mut);font-size:16px}
.ex.rv .zh{display:inline}
</style></head>

<script type="application/json" id="DATA">{"topik": [{"id": "1-1", "pel": 1, "judul": "Frasa tetap 看上去 / 看起来: kelihatannya", "kode": "固定短语“看上去/看起来”", "rumus": ["Subjek + 看上去 + (很/有点儿) + KS", "Subjek + 看起来 + (很/有点儿) + KS", "Subjek + 看上去/看起来 + 像 + …"], "jelas": ["看上去 (kàn shàngqu) dan 看起来 (kàn qǐlai) artinya \"kelihatannya, tampaknya\". Dipakai untuk menggambarkan penampilan atau keadaan orang atau benda berdasarkan apa yang terlihat oleh mata: 他看上去很年轻 (dia kelihatan muda).", "Letaknya setelah subjek dan sebelum keterangan sifat. Biasanya diikuti kata sifat yang diberi 很, 有点儿, 不太, 非常, atau diikuti 像 (mirip): 他们看上去有点儿像 (mereka kelihatannya agak mirip).", "Bentuk ingkar diletakkan pada kata sifatnya, bukan pada 看上去: 他看起来不太高兴 (dia kelihatan kurang senang). Jangan katakan 他不看起来高兴. Untuk bertanya: 我看上去怎么样？ (aku kelihatan bagaimana?) atau 他看起来累吗？", "Dalam pemakaian sehari-hari 看上去 dan 看起来 hampir selalu bisa saling menggantikan. 看起来 sedikit lebih luas: bisa juga dipakai untuk kesan secara umum (看起来今天要下雨 = sepertinya hari ini akan hujan), sedangkan 看上去 lebih fokus pada penampilan luar.", "Jebakan bagi pelajar Indonesia: \"kelihatan\" dalam bahasa Indonesia bisa langsung diikuti kata sifat tanpa kata lain (\"dia kelihatan capek\"). Dalam bahasa Mandarin, kata sifat satu suku kata setelah 看上去 terdengar janggal tanpa 很/有点儿 dsb.: lebih baik 他看上去很累, bukan 他看上去累.", "Jangan tertukar dengan 看见 (melihat) atau 好像 (sepertinya). 看上去 menilai dari penampilan; 好像 bisa menilai dari apa saja (dengar, pikir, ingat)."], "poin": ["看上去/看起来 = kelihatannya (dari penampilan).", "Posisi: Subjek + 看上去 + 很/有点儿 + KS.", "Ingkar pada kata sifat: 看起来不太好.", "Bisa diikuti 像: 看上去像学生."], "contoh": [{"zh": "他们看上去有点儿像。", "py": "Tāmen kàn shàngqù yǒudiǎnr xiàng.", "id": "Mereka kelihatannya agak mirip.", "b": true, "tr": "01-1"}, {"zh": "这些菜看起来都很好吃。", "py": "Zhèxiē cài kàn qǐlái dōu hěn hǎochī.", "id": "Masakan-masakan ini semuanya kelihatan enak.", "b": true, "tr": null}, {"zh": "那个新来的老师看上去很年轻。", "py": "Nàge xīn lái de lǎoshī kàn shàngqù hěn niánqīng.", "id": "Guru yang baru datang itu kelihatan sangat muda.", "b": true, "tr": null}, {"zh": "走出机场的时候，我们看见了王老师的姐姐，她看起来比照片上年轻。", "py": "Zǒu chū jīchǎng de shíhou, wǒmen kànjiàn le Wáng lǎoshī de jiějie, tā kàn qǐlái bǐ zhàopiàn shàng niánqīng.", "id": "Saat keluar dari bandara, kami melihat kakak perempuan Guru Wang; dia kelihatan lebih muda daripada di foto.", "b": true, "tr": null}, {"zh": "我喜欢您大笑的这张，看起来很漂亮。", "py": "Wǒ xǐhuan nín dà xiào de zhè Zhāng, kàn qǐlái hěn piàoliang.", "id": "Aku suka foto Anda yang tertawa lebar ini, kelihatan cantik.", "b": true, "tr": "05-3"}, {"zh": "你怎么了？看上去有点儿累。", "py": "Nǐ zěnme le? Kàn shàngqù yǒudiǎnr lèi.", "id": "Kamu kenapa? Kelihatannya agak capek.", "b": false, "tr": null}, {"zh": "这件衣服看起来不太贵。", "py": "Zhè jiàn yīfu kàn qǐlái bú tài guì.", "id": "Baju ini kelihatannya tidak terlalu mahal.", "b": false, "tr": null}, {"zh": "她看上去像一个学生。", "py": "Tā kàn shàngqù xiàng yí gè xuéshēng.", "id": "Dia kelihatan seperti seorang pelajar.", "b": false, "tr": null}, {"zh": "今天王一飞看起来特别高兴。", "py": "Jīntiān Wáng Yīfēi kàn qǐlái tèbié gāoxìng.", "id": "Hari ini Wang Yifei kelihatan sangat senang.", "b": false, "tr": null}, {"zh": "这个房间看上去很干净。", "py": "Zhège fángjiān kàn shàngqù hěn gānjìng.", "id": "Kamar ini kelihatan bersih.", "b": false, "tr": null}, {"zh": "我穿这件衣服看起来怎么样？", "py": "Wǒ chuān zhè jiàn yīfu kàn qǐlái zěnmeyàng?", "id": "Aku memakai baju ini kelihatan bagaimana?", "b": false, "tr": null}], "salah": [{"s": "他不看上去高兴。", "sp": "Tā bú kàn shàngqù gāoxìng.", "n": "", "b": "他看上去不高兴。", "bp": "Tā kàn shàngqù bù gāoxìng.", "a": "Kata ingkar diletakkan sebelum kata sifat, bukan sebelum 看上去."}, {"s": "他看上去累。", "sp": "Tā kàn shàngqù lèi.", "n": "", "b": "他看上去很累。", "bp": "Tā kàn shàngqù hěn lèi.", "a": "Kata sifat satu suku kata setelah 看上去 biasanya diberi 很/有点儿."}, {"s": "他今天看见很累。", "sp": "Tā jīntiān kànjiàn hěn lèi.", "n": "", "b": "他今天看上去很累。", "bp": "Tā jīntiān kàn shàngqù hěn lèi.", "a": "看见 = melihat; untuk \"kelihatan\" pakai 看上去/看起来."}], "latihan": [{"k": "1-1.0", "t": "pg", "q": "你今天___很累，早点儿休息吧。", "o": ["看上去", "看见", "看完", "看到"], "a": 0, "x": "看上去 = kelihatannya, untuk menilai keadaan dari penampilan.", "f": "你今天看上去很累，早点儿休息吧。", "fp": "Nǐ jīntiān kàn shàngqù hěn lèi, zǎo diǎnr xiūxi ba."}, {"k": "1-1.1", "t": "pg", "q": "这些菜看起来___。", "o": ["很好吃", "好吃很", "吃很好", "好很吃"], "a": 0, "x": "看起来 + 很 + KS.", "f": "这些菜看起来很好吃。", "fp": "Zhèxiē cài kàn qǐlái hěn hǎochī."}, {"k": "1-1.2", "t": "pg", "q": "\"Dia kelihatan tidak senang.\" yang benar =", "o": ["他不看起来高兴。", "他看起来不高兴。", "他看起来高兴不。", "不他看起来高兴。"], "a": 1, "x": "Ingkar pada kata sifat: 看起来不高兴."}, {"k": "1-1.3", "t": "pg", "q": "她看上去___一个老师。", "o": ["像", "是像", "很是", "有"], "a": 0, "x": "看上去 + 像 + kata benda = kelihatan seperti ….", "f": "她看上去像一个老师。", "fp": "Tā kàn shàngqù xiàng yí gè lǎoshī."}, {"k": "1-1.4", "t": "pg", "q": "Mana kalimat yang BENAR?", "o": ["那个人看上去很年轻。", "那个人很看上去年轻。", "那个人年轻看上去。", "看上去那个人年轻很。"], "a": 0, "x": "Subjek + 看上去 + 很 + KS."}, {"k": "1-1.5", "t": "pg", "q": "A: 你看我穿这件衣服___？ B: 挺好看的。", "o": ["看起来怎么样", "怎么样看起来", "看起来什么", "看起来哪儿"], "a": 0, "x": "Bertanya penampilan: 看起来怎么样？"}, {"k": "1-1.6", "t": "pg", "q": "\"Rumah ini kelihatannya sudah tua.\" =", "o": ["这个房子看上去很旧。", "这个房子看见很旧。", "这个房子看完很旧。", "这个房子旧看上去。"], "a": 0, "x": "看上去 menilai dari penampilan; 看见/看完 berarti melihat/selesai melihat."}, {"k": "1-1.7", "t": "su", "w": ["他们", "看上去", "有点儿", "像"], "s": "他们看上去有点儿像。", "alt": [], "p": "Tāmen kàn shàngqù yǒudiǎnr xiàng.", "x": "Mereka kelihatannya agak mirip."}, {"k": "1-1.8", "t": "su", "w": ["这个", "西瓜", "看起来", "很", "甜"], "s": "这个西瓜看起来很甜。", "alt": [], "p": "Zhège xīguā kàn qǐlái hěn tián.", "x": "Semangka ini kelihatannya manis."}, {"k": "1-1.9", "t": "su", "w": ["你", "妹妹", "看上去", "很", "年轻"], "s": "你妹妹看上去很年轻。", "alt": [], "p": "Nǐ mèimei kàn shàngqù hěn niánqīng.", "x": "Adik perempuanmu kelihatan muda."}, {"k": "1-1.10", "t": "su", "w": ["他", "看起来", "不太", "舒服"], "s": "他看起来不太舒服。", "alt": [], "p": "Tā kàn qǐlái bú tài shūfu.", "x": "Dia kelihatannya kurang enak badan."}, {"k": "1-1.11", "t": "su", "w": ["我", "看上去", "怎么样"], "s": "我看上去怎么样？", "alt": [], "p": "Wǒ kàn shàngqù zěnmeyàng?", "x": "Aku kelihatan bagaimana?"}, {"k": "1-1.12", "t": "bs", "s": "这家饭馆的菜看起来都很好吃。", "sp": "Zhè jiā fànguǎn de cài kàn qǐlái dōu hěn hǎochī.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 看起来 + 都很 + KS."}, {"k": "1-1.13", "t": "bs", "s": "她不看上去累。", "sp": "Tā bú kàn shàngqù lèi.", "n": "", "ok": false, "b": "她看上去不累。", "bp": "Tā kàn shàngqù bú lèi.", "x": "不 diletakkan sebelum kata sifat."}, {"k": "1-1.14", "t": "bs", "s": "这个孩子看上去像他爸爸。", "sp": "Zhège háizi kàn shàngqù xiàng tā bàba.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 看上去 + 像 + orang."}, {"k": "1-1.15", "t": "bs", "s": "那个老师年轻看起来。", "sp": "Nàge lǎoshī niánqīng kàn qǐlái.", "n": "", "ok": false, "b": "那个老师看起来很年轻。", "bp": "Nàge lǎoshī kàn qǐlái hěn niánqīng.", "x": "看起来 berada sebelum kata sifat."}]}, {"id": "1-2", "pel": 1, "judul": "Kata tanya tanpa makna tanya (1): 哪儿/什么/谁/哪 = suatu …", "kode": "疑问代词的非疑问用法（1）", "rumus": ["…在哪儿 + KK… (di suatu tempat)", "KK + (点儿) + 什么 (sesuatu)", "哪 + 天/个… (suatu hari / salah satu)", "谁 (seseorang)"], "jelas": ["Kata tanya seperti 哪儿, 什么, 谁, 哪 tidak selalu dipakai untuk bertanya. Dalam kalimat pernyataan (bukan pertanyaan), kata-kata ini bisa menunjuk tempat, benda, atau orang yang tidak diketahui atau tidak perlu disebutkan: 哪儿 = di suatu tempat, 什么 = sesuatu, 谁 = seseorang, 哪天 = suatu hari.", "Contoh: 我好像在哪儿看到过这个箱子 = sepertinya aku pernah melihat koper ini di suatu tempat. Pembicara tidak bertanya \"di mana?\", tetapi mengatakan dia tidak ingat tempatnya.", "Susunan katanya sama seperti kalimat tanya biasa; yang membedakan hanya konteks dan intonasi. Kalimat ini tidak berakhir dengan tanda tanya dan biasanya memakai kata seperti 好像, 吧, 点儿, 一起.", "Kalimat dengan 吗 bisa memakai makna ini juga: 你想吃点儿什么吗？= kamu mau makan sesuatu? Di sini yang ditanyakan adalah \"ya atau tidak\", sedangkan 什么 berarti \"sesuatu\". Bandingkan dengan 你想吃什么？= kamu mau makan apa?", "Bagi pelajar Indonesia, ini mirip pemakaian \"apa-apa\" atau \"mana\" dalam bahasa lisan: \"Kapan-kapan kita main bola ya\" = 我们哪天一起去踢足球吧. Bahasa Indonesia memakai kata \"suatu, sesuatu, seseorang\", sedangkan bahasa Mandarin cukup memakai kata tanya.", "Perhatikan bahwa topik ini berbeda dengan makna \"apa saja / siapa saja\" (pelajaran 2), yang biasanya diikuti 都."], "poin": ["Dalam kalimat pernyataan, kata tanya = suatu/sesuatu/seseorang.", "哪儿 = suatu tempat, 什么 = sesuatu, 谁 = seseorang, 哪天 = suatu hari.", "Sering bersama 好像, 吧, 点儿.", "…吗 + kata tanya = tanya ya/tidak, kata tanya = \"sesuatu\"."], "contoh": [{"zh": "我好像在哪儿看到过这个箱子。", "py": "Wǒ hǎoxiàng zài nǎr kàn dào guò zhège xiāngzi.", "id": "Sepertinya aku pernah melihat koper ini di suatu tempat.", "b": true, "tr": "01-3"}, {"zh": "你吃点儿什么再走吧。", "py": "Nǐ chī diǎnr shénme zài zǒu ba.", "id": "Makanlah sesuatu dulu baru pergi.", "b": true, "tr": null}, {"zh": "我们哪天一起去踢足球吧。", "py": "Wǒmen nǎ tiān yìqǐ qù tī zúqiú ba.", "id": "Kapan-kapan kita main sepak bola bersama, yuk.", "b": true, "tr": null}, {"zh": "你可以拿走这张菜单，看看下次还吃点儿什么。", "py": "Nǐ kěyǐ ná zǒu zhè Zhāng càidān, kànkan xià cì hái chī diǎnr shénme.", "id": "Kamu boleh bawa menu ini, lihat lagi lain kali mau makan apa.", "b": true, "tr": "02-5"}, {"zh": "我好像在哪儿见过这个人。", "py": "Wǒ hǎoxiàng zài nǎr jiàn guò zhège rén.", "id": "Sepertinya aku pernah bertemu orang ini di suatu tempat.", "b": false, "tr": null}, {"zh": "外边好像有谁在叫你。", "py": "Wàibian hǎoxiàng yǒu shéi zài jiào nǐ.", "id": "Di luar sepertinya ada seseorang yang memanggilmu.", "b": false, "tr": null}, {"zh": "家月、李文，你们看看菜单，想吃点儿什么？", "py": "Jiāyuè, Lǐ Wén, nǐmen kànkan càidān, xiǎng chī diǎnr shénme?", "id": "Jiayue, Li Wen, lihat menunya, mau makan apa?", "b": true, "tr": "02-1"}, {"zh": "你想喝点儿什么吗？", "py": "Nǐ xiǎng hē diǎnr shénme ma?", "id": "Kamu mau minum sesuatu?", "b": false, "tr": null}, {"zh": "周末我想去哪儿玩玩。", "py": "Zhōumò wǒ xiǎng qù nǎr wán wán.", "id": "Akhir pekan aku ingin pergi main ke suatu tempat.", "b": false, "tr": null}, {"zh": "我们哪天去看看王老师吧。", "py": "Wǒmen nǎ tiān qù kànkan Wáng lǎoshī ba.", "id": "Kapan-kapan kita jenguk Guru Wang, yuk.", "b": false, "tr": null}, {"zh": "我饿了，想吃点儿什么。", "py": "Wǒ è le, xiǎng chī diǎnr shénme.", "id": "Aku lapar, ingin makan sesuatu.", "b": false, "tr": null}], "salah": [{"s": "我好像在哪儿看到过这个箱子？", "sp": "Wǒ hǎoxiàng zài nǎr kàn dào guò zhège xiāngzi?", "n": "", "b": "我好像在哪儿看到过这个箱子。", "bp": "Wǒ hǎoxiàng zài nǎr kàn dào guò zhège xiāngzi.", "a": "Ini kalimat pernyataan, bukan pertanyaan; akhiri dengan 。"}, {"s": "你想喝什么吗？", "sp": "Nǐ xiǎng hē shénme ma?", "n": "kamu mau minum apa?", "b": "你想喝什么？", "bp": "Nǐ xiǎng hē shénme?", "a": "Kalau benar-benar bertanya \"apa\", jangan pakai 吗."}, {"s": "我想吃一点儿东西什么。", "sp": "Wǒ xiǎng chī yìdiǎnr dōngxi shénme.", "n": "", "b": "我想吃点儿什么。", "bp": "Wǒ xiǎng chī diǎnr shénme.", "a": "什么 langsung menggantikan \"sesuatu\", tanpa 东西."}], "latihan": [{"k": "1-2.0", "t": "pg", "q": "我好像在___见过他，可是想不起来了。", "o": ["哪儿", "什么", "谁", "怎么"], "a": 0, "x": "哪儿 = di suatu tempat.", "f": "我好像在哪儿见过他，可是想不起来了。", "fp": "Wǒ hǎoxiàng zài nǎr jiàn guò tā, kěshì xiǎng bù qǐlái le."}, {"k": "1-2.1", "t": "pg", "q": "你饿不饿？吃点儿___吧。", "o": ["什么", "哪儿", "谁", "几"], "a": 0, "x": "什么 = sesuatu.", "f": "你饿不饿？吃点儿什么吧。", "fp": "Nǐ è bu è? Chī diǎnr shénme ba."}, {"k": "1-2.2", "t": "pg", "q": "我们___天一起去看电影吧。", "o": ["哪", "什么", "几", "谁"], "a": 0, "x": "哪天 = suatu hari, kapan-kapan.", "f": "我们哪天一起去看电影吧。", "fp": "Wǒmen nǎ tiān yìqǐ qù kàn diànyǐng ba."}, {"k": "1-2.3", "t": "pg", "q": "门外好像有___在说话。", "o": ["谁", "哪儿", "什么", "怎么"], "a": 0, "x": "谁 = seseorang.", "f": "门外好像有谁在说话。", "fp": "Mén wài hǎoxiàng yǒu shéi zài shuōhuà."}, {"k": "1-2.4", "t": "pg", "q": "Kalimat mana yang merupakan PERTANYAAN sungguhan \"apa\"?", "o": ["你想喝什么？", "你喝点儿什么吧。", "我想喝点儿什么。", "我好像喝过什么。"], "a": 0, "x": "Hanya 你想喝什么？ yang menanyakan \"apa\"."}, {"k": "1-2.5", "t": "pg", "q": "\"Kamu mau makan sesuatu?\" yang benar =", "o": ["你想吃点儿什么吗？", "你想吃什么？", "你吃什么了？", "你想吃什么东西呢？"], "a": 0, "x": "吗 + 什么 = sesuatu; tanya ya/tidak."}, {"k": "1-2.6", "t": "pg", "q": "我好像在哪儿看到过这本书。 Arti 哪儿 di sini adalah …", "o": ["di suatu tempat", "di mana?", "di mana-mana", "tidak di mana pun"], "a": 0, "x": "Kalimat pernyataan: 哪儿 = di suatu tempat."}, {"k": "1-2.7", "t": "su", "w": ["你", "喝", "点儿", "什么", "吧"], "s": "你喝点儿什么吧。", "alt": [], "p": "Nǐ hē diǎnr shénme ba.", "x": "Minumlah sesuatu."}, {"k": "1-2.8", "t": "su", "w": ["我", "好像", "在", "哪儿", "见过", "她"], "s": "我好像在哪儿见过她。", "alt": [], "p": "Wǒ hǎoxiàng zài nǎr jiàn guò tā.", "x": "Sepertinya aku pernah bertemu dia di suatu tempat."}, {"k": "1-2.9", "t": "su", "w": ["我们", "哪天", "一起", "去", "爬山", "吧"], "s": "我们哪天一起去爬山吧。", "alt": [], "p": "Wǒmen nǎ tiān yìqǐ qù pá shān ba.", "x": "Kapan-kapan kita naik gunung bersama, yuk."}, {"k": "1-2.10", "t": "su", "w": ["你", "想", "买", "点儿", "什么", "吗"], "s": "你想买点儿什么吗？", "alt": [], "p": "Nǐ xiǎng mǎi diǎnr shénme ma?", "x": "Kamu mau membeli sesuatu?"}, {"k": "1-2.11", "t": "su", "w": ["外边", "好像", "有", "谁", "在", "叫", "你"], "s": "外边好像有谁在叫你。", "alt": [], "p": "Wàibian hǎoxiàng yǒu shéi zài jiào nǐ.", "x": "Di luar sepertinya ada seseorang yang memanggilmu."}, {"k": "1-2.12", "t": "bs", "s": "你吃点儿什么再走吧。", "sp": "Nǐ chī diǎnr shénme zài zǒu ba.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 什么 = sesuatu."}, {"k": "1-2.13", "t": "bs", "s": "我好像在哪儿见过这个人？", "sp": "Wǒ hǎoxiàng zài nǎr jiàn guò zhège rén?", "n": "", "ok": false, "b": "我好像在哪儿见过这个人。", "bp": "Wǒ hǎoxiàng zài nǎr jiàn guò zhège rén.", "x": "Kalimat pernyataan, akhiri dengan 。"}, {"k": "1-2.14", "t": "bs", "s": "我们哪天一起去踢足球吧。", "sp": "Wǒmen nǎ tiān yìqǐ qù tī zúqiú ba.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 哪天 = kapan-kapan."}, {"k": "1-2.15", "t": "bs", "s": "我渴了，想喝点儿东西什么。", "sp": "Wǒ kě le, xiǎng hē diǎnr dōngxi shénme.", "n": "", "ok": false, "b": "我渴了，想喝点儿什么。", "bp": "Wǒ kě le, xiǎng hē diǎnr shénme.", "x": "什么 sudah berarti \"sesuatu\", tidak perlu 东西."}]}, {"id": "1-3", "pel": 1, "judul": "Atribut bertingkat (多项定语): urutan beberapa penjelas", "kode": "多项定语", "rumus": ["Waktu/Tempat + (这/那 + Bil + KB ukuran) + Tindakan/Keadaan + 的 + Ciri + KB", "那个 + 穿着黑衣服的 + 短头发的 + 年轻人", "我 + 那件 + 新买的 + 白色的 + 衣服"], "jelas": ["Satu kata benda bisa punya beberapa penjelas (定语) sekaligus. Dalam bahasa Mandarin SEMUA penjelas ada di depan kata benda, sedangkan dalam bahasa Indonesia penjelas umumnya di belakang (\"baju putih yang baru saya beli\"). Jadi urutannya harus dibalik.", "Urutan umum menurut buku: (1) waktu/tempat atau pemilik, (2) tindakan/keadaan (biasanya frasa kata kerja + 的), (3) ciri (warna, bentuk, sifat, bahan). Contoh: 昨天和家月一起看电影的两个人 = dua orang yang kemarin menonton film bersama Jiayue.", "Frasa bilangan atau penunjuk + kata ukuran (两个, 那件, 这本) posisinya cukup bebas: boleh sebelum atau sesudah penjelas tindakan/keadaan. 那个穿着黑衣服的人 dan 穿着黑衣服的那个人 sama-sama benar. Tetapi biasanya berada sebelum penjelas ciri: 一件白色的衣服, bukan 白色的一件衣服.", "Penjelas yang paling erat (ciri pokok seperti 中国, 汉语, 白, 新 satu suku kata) menempel paling dekat dengan kata benda dan sering tanpa 的: 一位年轻的汉语老师. Penjelas panjang seperti 新买的, 穿着黑衣服的 memakai 的.", "Jebakan pelajar Indonesia: menerjemahkan kata demi kata sehingga penjelas ditaruh di belakang: \"orang yang memakai baju hitam itu\" jadi 人穿着黑衣服那个. Ingat: di bahasa Mandarin, kata benda pokok selalu di PALING BELAKANG.", "Supaya tidak terlalu banyak 的, penjelas dekat kata benda boleh tanpa 的 jika pendek: 我那件新买的白衣服. Dua atau tiga 的 dalam satu frasa masih wajar."], "poin": ["Semua penjelas di depan kata benda; kata benda paling belakang.", "Urutan: waktu/tempat/pemilik → tindakan/keadaan → ciri.", "这/那/Bil + kata ukuran: sebelum atau sesudah penjelas tindakan.", "Penjelas ciri pendek paling dekat dengan kata benda."], "contoh": [{"zh": "李文是那个穿着黑衣服的短头发的年轻人吗？", "py": "Lǐ Wén shì nàge chuān zhe hēi yīfu de duǎn tóufa de niánqīng rén ma?", "id": "Apakah Li Wen itu anak muda berambut pendek yang memakai baju hitam itu?", "b": true, "tr": null}, {"zh": "昨天和家月一起看电影的两个人是我的朋友。", "py": "Zuótiān hé Jiāyuè yìqǐ kàn diànyǐng de liǎng gè rén shì wǒ de péngyou.", "id": "Dua orang yang kemarin menonton film bersama Jiayue adalah temanku.", "b": true, "tr": null}, {"zh": "我那件新买的白色的衣服在哪儿？", "py": "Wǒ nà jiàn xīn mǎi de báisè de yīfu zài nǎr?", "id": "Baju putihku yang baru dibeli itu di mana?", "b": true, "tr": null}, {"zh": "那本放在桌子上的红色的书是我的。", "py": "Nà běn fàng zài zhuōzi shàng de hóngsè de shū shì wǒ de.", "id": "Buku merah yang ditaruh di atas meja itu milikku.", "b": false, "tr": null}, {"zh": "我们学校新来的那位汉语老师很漂亮。", "py": "Wǒmen xuéxiào xīn lái de nà wèi Hànyǔ lǎoshī hěn piàoliang.", "id": "Guru bahasa Mandarin yang baru datang di sekolah kami itu cantik.", "b": false, "tr": null}, {"zh": "站在门口的那个高个子男孩儿是我弟弟。", "py": "Zhàn zài ménkǒu de nàge gāo gèzi nánháir shì wǒ dìdi.", "id": "Anak laki-laki tinggi yang berdiri di depan pintu itu adikku.", "b": false, "tr": null}, {"zh": "这是我上个月在北京买的蓝色的帽子。", "py": "Zhè shì wǒ shàng gè yuè zài Běijīng mǎi de lán sè de mào zi.", "id": "Ini topi biru yang kubeli di Beijing bulan lalu.", "b": false, "tr": null}, {"zh": "楼下那家新开的小饭馆很便宜。", "py": "Lóu xià nà jiā xīn kāi de xiǎo fànguǎn hěn piányi.", "id": "Restoran kecil yang baru buka di bawah itu murah.", "b": false, "tr": null}, {"zh": "我喜欢那条长长的安静的小路。", "py": "Wǒ xǐhuan nà tiáo cháng cháng de ānjìng de xiǎo lù.", "id": "Aku suka jalan kecil yang panjang dan sepi itu.", "b": false, "tr": null}], "salah": [{"s": "那个人穿着黑衣服是李文。", "sp": "Nàge rén chuān zhe hēi yīfu shì Lǐ Wén.", "n": "", "b": "那个穿着黑衣服的人是李文。", "bp": "Nàge chuān zhe hēi yīfu de rén shì Lǐ Wén.", "a": "Penjelas \"memakai baju hitam\" harus di depan kata benda dengan 的."}, {"s": "我的白色的那件新买的衣服", "sp": "Wǒ de báisè de nà jiàn xīn mǎi de yīfu", "n": "", "b": "我那件新买的白色的衣服", "bp": "Wǒ nà jiàn xīn mǎi de báisè de yīfu", "a": "Penjelas ciri (白色) paling dekat dengan kata benda; 那件 sebelum penjelas tindakan."}, {"s": "一位汉语年轻的老师", "sp": "Yí wèi Hànyǔ niánqīng de lǎoshī", "n": "", "b": "一位年轻的汉语老师", "bp": "Yí wèi niánqīng de Hànyǔ lǎoshī", "a": "Ciri pokok (汉语) paling dekat dengan 老师."}], "latihan": [{"k": "1-3.0", "t": "pg", "q": "\"buku merah yang saya beli kemarin\" yang benar =", "o": ["我昨天买的那本红色的书", "红色的书我昨天买的", "那本红色的我昨天买的书", "书红色的我昨天买的"], "a": 0, "x": "Waktu/pemilik → tindakan → kata ukuran → ciri → kata benda."}, {"k": "1-3.1", "t": "pg", "q": "Mana urutan yang BENAR?", "o": ["一位年轻的汉语老师", "一位汉语的年轻老师", "汉语一位年轻老师", "年轻汉语一位老师"], "a": 0, "x": "Ciri pokok 汉语 paling dekat dengan 老师."}, {"k": "1-3.2", "t": "pg", "q": "那个___的人是我哥哥。", "o": ["穿着白衬衫", "白衬衫穿着", "穿白衬衫着", "着穿白衬衫"], "a": 0, "x": "Penjelas tindakan: 穿着白衬衫的人.", "f": "那个穿着白衬衫的人是我哥哥。", "fp": "Nàge chuān zhe bái chènshān de rén shì wǒ gēge."}, {"k": "1-3.3", "t": "pg", "q": "\"dua orang yang duduk di sana\" =", "o": ["坐在那儿的两个人", "两个人坐在那儿的", "人坐在那儿两个", "坐在两个那儿的人"], "a": 0, "x": "Penjelas tindakan + 的 + bilangan + kata ukuran + kata benda (atau 那两个坐在那儿的人)."}, {"k": "1-3.4", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["那件衣服新买的白色的是我的。", "那件新买的白色的衣服是我的。", "新买的那件白衣服是我的。", "那件新买的白衣服是我的。"], "a": 0, "x": "Semua penjelas harus di depan 衣服."}, {"k": "1-3.5", "t": "pg", "q": "我的___手机找不到了。", "o": ["那个新买的", "新买那个的", "那个的新买", "买新的那个的"], "a": 0, "x": "那个 + 新买的 + 手机.", "f": "我的那个新买的手机找不到了。", "fp": "Wǒ de nàge xīn mǎi de shǒujī zhǎo bú dào le."}, {"k": "1-3.6", "t": "pg", "q": "\"guru baru yang mengajar kami bahasa Mandarin\" =", "o": ["教我们汉语的新老师", "新老师教我们汉语的", "老师新的教我们汉语", "教我们新老师的汉语"], "a": 0, "x": "Penjelas tindakan + 的 + 新 + 老师."}, {"k": "1-3.7", "t": "su", "w": ["这", "是", "一本", "很", "有意思", "的", "汉语", "书"], "s": "这是一本很有意思的汉语书。", "alt": [], "p": "Zhè shì yì běn hěn yǒuyìsi de Hànyǔ shū.", "x": "Ini buku bahasa Mandarin yang sangat menarik."}, {"k": "1-3.8", "t": "su", "w": ["这", "是", "我", "新", "买", "的", "手机"], "s": "这是我新买的手机。", "alt": [], "p": "Zhè shì wǒ xīn mǎi de shǒujī.", "x": "Ini HP-ku yang baru dibeli."}, {"k": "1-3.9", "t": "su", "w": ["我", "喜欢", "那件", "红色", "的", "衣服"], "s": "我喜欢那件红色的衣服。", "alt": [], "p": "Wǒ xǐhuan nà jiàn hóngsè de yīfu.", "x": "Aku suka baju merah itu."}, {"k": "1-3.10", "t": "su", "w": ["他", "有", "一个", "很", "漂亮", "的", "中国", "女朋友"], "s": "他有一个很漂亮的中国女朋友。", "alt": [], "p": "Tā yǒu yí gè hěn piàoliang de Zhōngguó nǚpéngyou.", "x": "Dia punya pacar orang Tiongkok yang sangat cantik."}, {"k": "1-3.11", "t": "su", "w": ["她", "是", "一位", "很", "年轻", "的", "汉语", "老师"], "s": "她是一位很年轻的汉语老师。", "alt": [], "p": "Tā shì yí wèi hěn niánqīng de Hànyǔ lǎoshī.", "x": "Dia seorang guru bahasa Mandarin yang sangat muda."}, {"k": "1-3.12", "t": "bs", "s": "站在门口的那个女孩儿是我妹妹。", "sp": "Zhàn zài ménkǒu de nàge nǚháir shì wǒ mèimei.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: penjelas tindakan + 那个 + 女孩儿."}, {"k": "1-3.13", "t": "bs", "s": "那个人穿着红衣服是谁？", "sp": "Nàge rén chuān zhe hóng yīfu shì shéi?", "n": "", "ok": false, "b": "那个穿着红衣服的人是谁？", "bp": "Nàge chuān zhe hóng yīfu de rén shì shéi?", "x": "Penjelas harus di depan kata benda dengan 的."}, {"k": "1-3.14", "t": "bs", "s": "我那件新买的白色的衣服在哪儿？", "sp": "Wǒ nà jiàn xīn mǎi de báisè de yīfu zài nǎr?", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar (contoh buku)."}, {"k": "1-3.15", "t": "bs", "s": "我喜欢那条裙子红色的。", "sp": "Wǒ xǐhuan nà tiáo qúnzi hóngsè de.", "n": "", "ok": false, "b": "我喜欢那条红色的裙子。", "bp": "Wǒ xǐhuan nà tiáo hóngsè de qúnzi.", "x": "Penjelas warna harus di depan kata benda."}]}, {"id": "2-1", "pel": 2, "judul": "Kalimat majemuk setara 又……又……: sudah … juga …", "kode": "并列复句“又……又……”", "rumus": ["Subjek + 又 + KS₁ + 又 + KS₂", "又 + KK₁ + 又 + KK₂ (dua tindakan sekaligus)"], "jelas": ["又……又…… (yòu…yòu…) menyatakan bahwa seseorang atau sesuatu memiliki dua sifat sekaligus. Artinya \"sudah … juga …, … dan …\": 那个女孩儿又高又漂亮 = gadis itu tinggi dan cantik.", "Susunan dasar menurut buku: 又 + KS₁ + 又 + KS₂. Kedua kata sifat langsung mengikuti 又, TANPA 很: 又饿又渴, bukan 又很饿又很渴.", "Kedua sifat harus searah: sama-sama positif (又便宜又好吃) atau sama-sama negatif (又累又饿). Jangan menggabungkan positif dan negatif seperti 又便宜又难吃 kecuali memang ingin bilang dua hal buruk/baik dari sudut pandang pembicara.", "又……又…… juga bisa dipakai dengan kata kerja untuk dua tindakan yang terjadi bersamaan: 孩子们又唱又跳 = anak-anak bernyanyi dan menari. Untuk ingkar, biasanya dipakai 又不 + KS + 又不 + KS: 这个菜又不好看又不好吃.", "Jebakan pelajar Indonesia: menerjemahkan \"dan\" dengan 和 di antara kata sifat (他很高和很帅). 和 umumnya menghubungkan kata benda, bukan kata sifat. Pakailah 又……又…… atau 很高，也很帅.", "Bedakan dengan 一边……一边…… (sambil), yang menekankan dua tindakan dalam waktu yang sama dan hanya untuk kata kerja."], "poin": ["又 + KS + 又 + KS = … dan … sekaligus.", "Tanpa 很 setelah 又.", "Dua sifat searah (sama-sama baik atau buruk).", "Jangan pakai 和 untuk menghubungkan kata sifat."], "contoh": [{"zh": "我现在还真是又饿又渴。", "py": "Wǒ xiànzài hái zhēn shì yòu è yòu kě.", "id": "Sekarang aku benar-benar lapar dan haus.", "b": true, "tr": null}, {"zh": "那个女孩儿又高又漂亮。", "py": "Nàge nǚháir yòu gāo yòu piàoliang.", "id": "Gadis itu tinggi dan cantik.", "b": true, "tr": null}, {"zh": "这个饭馆的菜又便宜又好吃。", "py": "Zhège fànguǎn de cài yòu piányi yòu hǎochī.", "id": "Masakan restoran ini murah dan enak.", "b": true, "tr": null}, {"zh": "坐在高铁上跟坐在家里的沙发上一样，又安静又舒服。", "py": "Zuò zài gāotiě shàng gēn zuò zài jiā lǐ de shāfā shàng yíyàng, yòu ānjìng yòu shūfu.", "id": "Duduk di kereta cepat sama seperti duduk di sofa di rumah, tenang dan nyaman.", "b": true, "tr": "06-7"}, {"zh": "高铁又快又舒服，你一定会喜欢的。", "py": "Gāotiě yòu kuài yòu shūfu, nǐ yídìng huì xǐhuan de.", "id": "Kereta cepat itu cepat dan nyaman, kamu pasti suka.", "b": true, "tr": "06-1"}, {"zh": "这里的饭菜又便宜又好吃，我们经常来。", "py": "Zhèlǐ de fàn cài yòu piányi yòu hǎochī, wǒmen jīngcháng lái.", "id": "Makanan di sini murah dan enak, kami sering datang.", "b": true, "tr": "02-3"}, {"zh": "快要考试的时候又忙又累。", "py": "Kuàiyào kǎoshì de shíhou yòu máng yòu lèi.", "id": "Saat ujian sudah dekat, sibuk dan capek.", "b": true, "tr": "02-7"}, {"zh": "又能锻炼身体，又能照好看的照片。", "py": "Yòu néng duànliàn shēntǐ, yòu néng zhào hǎokàn de zhàopiàn.", "id": "Bisa berolahraga, juga bisa memotret foto yang bagus.", "b": true, "tr": "05-1"}, {"zh": "他的新家又大又干净。", "py": "Tā de xīn jiā yòu dà yòu gānjìng.", "id": "Rumah barunya besar dan bersih.", "b": false, "tr": null}, {"zh": "今天又冷又刮风，别出去了。", "py": "Jīntiān yòu lěng yòu guā fēng, bié chūqù le.", "id": "Hari ini dingin dan berangin, jangan keluar.", "b": false, "tr": null}, {"zh": "她写的汉字又快又好。", "py": "Tā xiě de Hànzì yòu kuài yòu hǎo.", "id": "Hanzi yang dia tulis cepat dan bagus.", "b": false, "tr": null}, {"zh": "孩子们又唱又跳，非常高兴。", "py": "Háizimen yòu chàng yòu tiào, fēicháng gāoxìng.", "id": "Anak-anak bernyanyi dan menari, sangat gembira.", "b": false, "tr": null}, {"zh": "这件衣服又不好看又不便宜。", "py": "Zhè jiàn yīfu yòu bù hǎokàn yòu bú piányi.", "id": "Baju ini sudah tidak bagus, tidak murah pula.", "b": false, "tr": null}], "salah": [{"s": "他又很高又很帅。", "sp": "Tā yòu hěn gāo yòu hěn shuài.", "n": "", "b": "他又高又帅。", "bp": "Tā yòu gāo yòu shuài.", "a": "Setelah 又 tidak perlu 很."}, {"s": "这个房间大和干净。", "sp": "Zhège fángjiān dà hé gānjìng.", "n": "", "b": "这个房间又大又干净。", "bp": "Zhège fángjiān yòu dà yòu gānjìng.", "a": "和 tidak dipakai untuk menghubungkan kata sifat."}, {"s": "这家饭馆的菜又便宜又贵。", "sp": "Zhè jiā fànguǎn de cài yòu piányi yòu guì.", "n": "", "b": "这家饭馆的菜又便宜又好吃。", "bp": "Zhè jiā fànguǎn de cài yòu piányi yòu hǎochī.", "a": "Dua sifat harus searah dan tidak bertentangan."}], "latihan": [{"k": "2-1.0", "t": "pg", "q": "这个苹果___。", "o": ["又大又甜", "又很大又很甜", "大和甜", "又大和甜"], "a": 0, "x": "又 + KS + 又 + KS, tanpa 很 dan tanpa 和.", "f": "这个苹果又大又甜。", "fp": "Zhège píngguǒ yòu dà yòu tián."}, {"k": "2-1.1", "t": "pg", "q": "走了一天，我又累又___。", "o": ["饿", "好", "高兴", "舒服"], "a": 0, "x": "Dua sifat searah: 累 dan 饿 sama-sama keadaan tidak enak.", "f": "走了一天，我又累又饿。", "fp": "Zǒu le yì tiān, wǒ yòu lèi yòu è."}, {"k": "2-1.2", "t": "pg", "q": "\"Ka 不…/哪儿都没… = sama sekali tidak.", "都 boleh diganti 也, terutama dalam kalimat ingkar."], "contoh": [{"zh": "哪个菜都好吃。", "py": "Nǎge cài dōu hǎochī.", "id": "Masakan mana pun enak.", "b": true, "tr": "02-3"}, {"zh": "这次旅游，我去哪儿都可以。", "py": "Zhè cì lǚyóu, wǒ qù nǎr dōu kěyǐ.", "id": "Perjalanan kali ini, aku pergi ke mana saja boleh.", "b": true, "tr": null}, {"zh": "我下午有时间，你想什么时候来都没问题。", "py": "Wǒ xiàwǔ yǒu shíjiān, nǐ xiǎng shénme shíhou lái dōu méi wèntí.", "id": "Sore ini aku ada waktu, kamu mau datang kapan saja tidak masalah.", "b": true, "tr": null}, {"zh": "家里又什么吃的都没有。", "py": "Jiā li yòu shénme chī de dōu méiyǒu.", "id": "Di rumah juga tidak ada makanan apa pun.", "b": true, "tr": "02-7"}, {"zh": "什么都没有妈妈做的饭好吃。", "py": "Shénme dōu méiyǒu māma zuò de fàn hǎochī.", "id": "Tidak ada apa pun yang seenak masakan ibu.", "b": true, "tr": "02-7"}, {"zh": "什么都不用带。", "py": "Shénme dōu búyòng dài.", "id": "Tidak perlu membawa apa-apa.", "b": false, "tr": null}, {"zh": "你不用看着我，想干什么都可以。", "py": "Nǐ búyòng kàn zhe wǒ, xiǎng gàn shénme dōu kěyǐ.", "id": "Kamu tidak perlu melihatku, mau melakukan apa saja boleh.", "b": true, "tr": "05-5"}, {"zh": "小李做的饭谁都喜欢吃。", "py": "Xiǎo Lǐ zuò de fàn shéi dōu xǐhuan chī.", "id": "Masakan Xiao Li, siapa pun suka.", "b": false, "tr": null}, {"zh": "我什么都吃，中国菜、外国菜都喜欢。", "py": "Wǒ shénme dōu chī, Zhōngguó cài, wàiguó cài dōu xǐhuan.", "id": "Aku makan apa saja, masakan Tiongkok maupun asing aku suka.", "b": false, "tr": null}, {"zh": "饭馆不太远，怎么去都可以。", "py": "Fànguǎn bú tài yuǎn, zěnme qù dōu kěyǐ.", "id": "Restorannya tidak terlalu jauh, pergi dengan cara apa pun bisa.", "b": false, "tr": null}, {"zh": "昨天我不舒服，哪儿都没去。", "py": "Zuótiān wǒ bù shūfu, nǎr dōu méi qù.", "id": "Kemarin aku tidak enak badan, tidak pergi ke mana pun.", "b": false, "tr": null}, {"zh": "这件事谁也不知道。", "py": "Zhè jiàn shì shéi yě bù zhīdào.", "id": "Hal ini tidak ada seorang pun yang tahu.", "b": false, "tr": null}], "salah": [{"s": "我吃什么都。", "sp": "Wǒ chī shénme dōu.", "n": "", "b  derajat 挺: 挺 + KS + 的 (cukup/lumayan sangat)", "kode": "程度副词“挺”", "rumus": ["Subjek + 挺 + KS + 的", "Subjek + 挺 + KK perasaan + (objek) + 的", "Subjek + 挺 + 不错/好 + 的"], "jelas": ["挺 (tǐng) adalah kata keterangan derajat yang artinya \"cukup, lumayan, sangat\". Dipakai di depan kata sifat atau kata kerja perasaan (喜欢, 想, 担心) untuk menunjukkan derajat yang cukup tinggi. Sangat sering dipakai dalam bahasa lisan.", "Susunan dasar menurut buku: 挺 + KS / KK perasaan + 的. Kata 的 di akhir sering muncul dan membuat kalimat terdengar alami: 这个小区环境挺好的. 的 boleh dihilangkan, tetapi bentuk dengan 的 lebih umum.", "Derajatnya kira-kira antara 很 dan 非常, dengan nada santai dan positif. 挺 jarang dipakai dalam tulisan resmi; untuk tulisan lebih baik 很/非常.", "Bentuk ingkar: 挺不 + KS + 的 (挺不容易的 = cukup tidak mudah) atau ingkar dengan 不太 tanpa 挺: 不太好. Jangan katakan 不挺好. Untuk bertanya biasanya tidak memakai 挺; tanyakan dengan 怎么样 lalu jawab dengan 挺……的.", "Untuk kata kerja perasaan, objek diletakkan sebelum 的: 我挺喜欢这个颜色的. Jebakan pelajar Indonesia: \"lumayan\" kadang diterjemahkan 一点儿 (他一点儿好) — salah. Pakai 挺好的.", "挺 tidak dipakai bersama 很/非常 sekaligus: 挺很好 salah. Juga tidak dipakai dalam kalimat perbandingan dengan 比: 他比我挺高 salah."], "poin": ["挺 + KS/KK perasaan + 的 = cukup/sangat ….", "Bahasa lisan, nada santai.", "Objek kata kerja perasaan sebelum 的.", "Tidak bersama 很/非常 dan tidak dalam kalimat 比."], "contoh": [{"zh": "这个小区环境挺好的。", "py": "Zhège xiǎoqū huánjìng tǐng hǎo de.", "id": "Lingkungan kompleks perumahan ini cukup bagus.", "b": true, "tr": null}, {"zh": "这家饭馆的菜挺好吃的。", "py": "Zhè jiā fànguǎn de cài tǐng hǎochī de.", "id": "Masakan restoran ini lumayan enak.", "b": true, "tr": null}, {"zh": "买这个吧，我挺喜欢这个颜色的。", "py": "Mǎi zhège ba, wǒ tǐng xǐhuan zhège yánsè de.", "id": "Beli yang ini saja, aku cukup suka warna ini.", "b": true, "tr": null}, {"zh": "环境挺好的，离地铁站还不远。", "py": "Huánjìng tǐng hǎo de, lí dìtiě zhàn hái bù yuǎn.", "id": "Lingkungannya cukup bagus, dari stasiun kereta bawah {"k": "3-1.14", "t": "bs", "s": "我挺爱游泳的。", "sp": "Wǒ tǐng ài yóuyǒng de.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 挺 + KK perasaan + 的."}, {"k": "3-1.15", "t": "bs", "s": "我挺喜欢的他。", "sp": "Wǒ tǐng xǐhuan de tā.", "n": "", "ok": false, "b": "我挺喜欢他的。", "bp": "Wǒ tǐng xǐhuan tā de.", "x": "Objek sebelum 的."}]}, {"id": "3-2", "pel": 3, "judul": "Pelengkap derajat (1): KS + 坏了 (… sekali, sampai …)", "kode": "程度补语（1）", "rumus": ["Subjek + KS + 坏了", "Subjek + KK perasaan + 坏了 (急坏了, 气坏了)", "…+ 一定 + KS + 坏了 + 吧"], "jelas": ["坏了 (huài le) diletakkan setelah kata sifat untuk menyatakan derajat yang SANGAT tinggi, dengan nada melebih-lebihkan. Artinya mirip \"… sekali, … banget, sampai mau mati rasanya\": 我渴坏了 = aku haus sekali.", "Menurut buku, 坏了 biasanya dipakai untuk keadaan NEGATIF atau tidak enak: 累坏了 (capek sekali), 饿坏了 (lapar sekali), 渴坏了, 忙坏了, 急坏了 (cemas sekali), 气坏了 (marah sekali). Ada juga beberapa yang positif dalam bahasa lisan: 高兴坏了, 乐坏了.", "Susunannya: KS + 坏了, langsung tanpa 得. 了 di akhir wajib: 累坏了, bukan 累坏. Sebelum kata sifat tidak boleh ada 很/非常/太: 很累坏了 salah. Tetapi keterangan lain boleh di awal kalimat: 这几天非常忙，大家都累坏了.", "Pola ini tidak dipakai dalam bentuk ingkar (不累坏了 salah). Untuk ingkar kembali ke 不太累. Untuk bertanya biasanya memakai 吧 untuk menebak: 你们一定累坏了吧？", "Jebakan: 坏 sendiri artinya \"rusak/jahat\". Dalam pola ini 坏了 tidak berarti rusak, hanya menguatkan derajat. 手机坏了 = HP-nya rusak (bukan pola ini) — konteks yang menentukan.", "Bandingkan dengan pelengkap derajat lain: KS + 得很 (pelajaran 5), KS + 极了 / 死了. 坏了 paling sering dipakai untuk keadaan fisik dan emosi yang tidak enak."], "poin": ["KS + 坏了 = … sekali (dilebih-lebihkan).", "Umumnya untuk keadaan negatif: 累/饿/渴/忙/急/气.", "Tanpa 很/太 dan tanpa bentuk ingkar.", "了 wajib di akhir."], "contoh": [{"zh": "我这几天忙坏了。", "py": "Wǒ zhè jǐ tiān máng huài le.", "id": "Beberapa hari ini aku sibuk sekali.", "b": true, "tr": "03-3"}, {"zh": "这几天非常忙，大家都累坏了。", "py": "Zhè jǐ tiān fēicháng máng, dàjiā dōu lèi huài le.", "id": "Beberapa hari ini sangat sibuk, semua orang capek sekali.", "b": true, "tr": null}, {"zh": "我渴坏了，哪里能买水？", "py": "Wǒ kě huài le, nǎlǐ néng mǎi shuǐ?", "id": "Aku haus sekali, di mana bisa beli air?", "b": true, "tr": null}, {"zh": "我这几天忙坏了，可能走的时候忘关了。", "py": "Wǒ zhè jǐ tiān máng huài le, kěnéng zǒu de shíhou wàng guān le.", "id": "Beberapa hari ini aku sibuk sekali, mungkin lupa mematikannya waktu pergi.", "b": true, "tr": "03-3"}, {"zh": "你们一定累坏了吧。", "py": "Nǐmen yídìng lèi huài le ba.", "id": "Kalian pasti capek sekali, ya.", "b": false, "tr": null}, {"zh": "今天没吃午饭和晚饭，我饿坏了。", "py": "Jīntiān méi chī wǔfàn hé wǎnfàn, wǒ è huài le.", "id": "Hari ini tidak makan siang dan makan malam, aku lapar sekali.", "b": false, "tr": null}, {"zh": "孩子找不到了，妈妈急坏了。", "py": "Háizi zhǎo bú dào le, māma jí huài le.", "id": "Anaknya tidak ketemu, ibunya cemas sekali.", "b": false, "tr": null}, {"zh": "听到这个消息，他气坏了。", "py": "Tīng dào zhège xiāo xī, tā qì huài le.", "id": "Mendengar kabar ini, dia marah sekali.", "b": false, "tr": null}, {"zh": "今天搬家，我和刘明都累坏了。", "py": "Jīntiān bānjiā, wǒ hé Liú Míng dōu lèi huài le.", "id": "Hari ini pindah rumah, aku dan Liu Ming capek sekali.", "b": false, "tr": null}, {"zh": "外边太热了，我热坏了。", "py": "Wàibian tài rè le, wǒ rè huài le.", "id": "Di luar panas sekali, aku kepanasan sekali.", "b": false, "tr": null}, {"zh": "收到礼物，小明高兴坏了。", "py": "Shōudào lǐwù, Xiǎomíng gāoxìng huài le.", "id": "Menerima hadiah, Xiao Ming senang sekali.", "b": false, "tr": null}], "salah": [{"s": "我很累坏了。", "sp": "Wǒ hěn lèi huài le.", "n": "", "b": "我累坏了。", "bp": "Wǒ lèi huài le.", "a": "Sebelum KS + 坏了 tidak perlu 很."}, {"s": "我饿坏。", "sp": "Wǒ è huài.", "n": "", "b": "我饿坏了。", "bp": "Wǒ è huài le.", "a": "了 wajib."}, {"s": "我饿得坏了。", "sp": "Wǒ è de huài le.", "n": "", "b": "我饿坏了。", "bp": "Wǒ è huài le.", "a": "坏了 langsung setelah KS, tanpa 得."}], "latihan": [{"k": "3-2.0", "t": "pg", "q": "走了一天的路，我___。", "o": ["累坏了", "很累坏了", "累得坏了", "坏累了"], "a": 0, "x": "KS + 坏了.", "f": "走了一天的路，我累坏了。", "fp": "Zǒu le yì tiān de lù, wǒ lèi huài le."}, {"k": "3-2.1", "t": "pg", "q": "我一天没喝水，___坏了。", "o": ["渴", "好", "高", "便宜"], "a": 0, "x": "渴坏了 = haus sekali.", "f": "我一天没喝水，渴坏了。", "fp": "Wǒ yì tiān méi hē shuǐ, kě huài le."}, {"k": "3-2.2", "t": "pg", "q": "\"Kalian pasti lapar sekali, ya.\" =", "o": ["你们一定饿坏了吧。", "你们一定很饿坏吧。", "你们一定坏饿了吧。", "你们一定饿得坏吧。"], "a": 0, "x": "Menebak dengan 一定……坏了吧."}, {"k": "3-2.3", "t": "pg", "q": "Kalimat mana yang SALAH?", "o": ["我非常忙坏了。", "我忙坏了。", "这几天大家都忙坏了。", "这几天非常忙，我忙坏了。"], "a": 0, "x": "Tidak boleh 非常 tepat sebelum KS + 坏了."}, {"k": "3-2.4", "t": "pg", "q": "孩子不见了，妈妈___坏了。", "o": ["急", "快", "好", "远"], "a": 0, "x": "急坏了 = cemas sekali.", "f": "孩子不见了，妈妈急坏了。", "fp": "Háizi bújiàn le, māma jí huài le."}, {"k": "3-2.5", "t": "pg", "q": "坏了 dalam 我累坏了 artinya …", "o": ["sangat, sekali", "rusak", "jahat", "sudah selesai"], "a": 0, "x": "Pelengkap derajat: menguatkan derajat."}, {"k": "3-2.6", "t": "pg", "q": "这几天非常忙，大家都___。", "o": ["累坏了", "不累坏了", "累坏", "很累坏"], "a": 0, "x": "KS + 坏了, tanpa ingkar dan 很.", "f": "这几天非常忙，大家都累坏了。", "fp": "Zhè jǐ tiān fēicháng máng, dàjiā dōu lèi huài le."}, {"k": "3-2.7", "t": "su", "w": ["我", "这", "几", "天", "忙", "坏", "了"], "s": "我这几天忙坏了。", "alt": [], "p": "Wǒ zhè jǐ tiān máng huài le.", "x": "Beberapa hari ini aku sibuk sekali."}, {"k": "3-2.8", "t": "su", "w": ["我", "渴", "坏", "了，", "哪里", "能", "买", "水"], "s": "我渴坏了，哪里能买水？", "alt": [], "p": "Wǒ kě huài le, nǎlǐ néng mǎi shuǐ?", "x": "Aku haus sekali, di mana bisa beli air?"}, {"k": "3-2.9", "t": "su", "w": ["你们", "一定", "累", "坏", "了", "吧"], "s": "你们一定累坏了吧？", "alt": [], "p": "Nǐmen yídìng lèi huài le ba?", "x": "Kalian pasti capek sekali, ya?"}, {"k": "3-2.10", "t": "su", "w": ["妈妈", "听", "了", "以后", "气", "坏", "了"], "s": "妈妈听了以后气坏了。", "alt": [], "p": "Māma tīng le yǐhòu qì huài le.", "x": "Setelah mendengarnya, ibu marah sekali."}, {"k": "3-2.11", "t": "su", "w": ["大家", "都", "饿", "坏", "了"], "s": "大家都饿坏了。", "alt": [], "p": "Dàjiā dōu è huài le.", "x": "Semua orang lapar sekali."}, {"k": "3-2.12", "t": "bs", "s": "今天搬家，我们都累坏了。", "sp": "Jīntiān bānjiā, wǒmen dōu lèi huài le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "3-2.13", "t": "bs", "s": "我太饿坏了。", "sp": "Wǒ tài è huài le.", "n": "", "ok": false, "b": "我饿坏了。", "bp": "Wǒ è huài le.", "x": "Tanpa 太."}, {"k": "3-2.14", "t": "bs", "s": "孩子找不到了，妈妈急坏了。", "sp": "Háizi zhǎo bú dào le, māma jí huài le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "3-2.15", "t": "bs", "s": "我今天不忙坏了。", "sp": "Wǒ jīntiān bù máng huài le.", "n": "", "ok": false, "b": "我今天不太忙。", "bp": "Wǒ jīntiān bú tài máng.", "x": "坏了 tidak punya bentuk ingkar."}]}, {"id": "3-3", "pel": 3, "judul": "Perbandingan 就 dan 才: cepat/awal vs lambat/terlambat", "kode": "“就”和“才”", "rumus": ["Waktu/Jumlah + 就 + KK + (了) (lebih awal/cepat dari dugaan)", "Waktu/Jumlah + 才 + KK (lebih lambat/terlambat dari dugaan, tanpa 了)", "…就能到 / …才能到"], "jelas": ["就 (jiù) dan 才 (cái) diletakkan sebelum kata kerja sebagai keterangan. 就 menunjukkan bahwa menurut pembicara tindakan terjadi lebih AWAL, CEPAT, atau LANCAR dari dugaan. 才 menunjukkan tindakan terjadi lebih LAMBAT, TERLAMBAT, atau TIDAK LANCAR.", "Bandingkan: 我早上五点就起床了 (jam lima pagi aku sudah bangun — awal sekali) vs 我十点才起床 (jam sepuluh aku baru bangun — terlambat). Kata waktu atau jumlah selalu SEBELUM 就/才.", "Kalimat dengan 就 untuk kejadian lampau biasanya diakhiri 了: 他八点就来了. Kalimat dengan 才 TIDAK memakai 了: 他十点才来 (bukan 他十点才来了).", "就 dan 才 juga bisa bersama kata kerja bantu 能: 走路几分钟就能到 (beberapa menit jalan kaki sudah bisa sampai — dekat/cepat) vs 坐火车五个小时才能到 (naik kereta lima jam baru bisa sampai — lama).", "Dalam bahasa Indonesia, kira-kira 就 = \"sudah\", 才 = \"baru\". Pelajar sering memakai 已经 untuk \"sudah\" dalam konteks ini; 已经 tidak salah, tetapi 就 lebih menunjukkan \"lebih cepat dari dugaan\". Hati-hati: 才 + 了 adalah kesalahan paling sering.", "Dalam pertanyaan keluhan, 怎么这么晚才…？ = kenapa baru … selarut ini? Ini sangat umum dalam percakapan."], "poin": ["就 = sudah (awal/cepat/lancar).", "才 = baru (lambat/terlambat/sulit).", "Waktu/jumlah sebelum 就/才.", "就……了, tetapi 才 tanpa 了."], "contoh": [{"zh": "中国银行很近，走路几分钟就能到。", "py": "Zhōngguó yínháng hěn jìn, zǒulù jǐ fēnzhōng jiù néng dào.", "id": "Bank of China dekat, jalan kaki beberapa menit sudah bisa sampai.", "b": true, "tr": "03-5"}, {"zh": "我下午要去医院，很晚才能回来。", "py": "Wǒ xiàwǔ yào qù yīyuàn, hěn wǎn cái néng huílái.", "id": "Sore ini aku harus ke rumah sakit, baru bisa pulang larut.", "b": true, "tr": "03-5"}, {"zh": "我早上五点就起床了。", "py": "Wǒ zǎoshang wǔ diǎn jiù qǐchuáng le.", "id": "Jam lima pagi aku sudah bangun.", "b": true, "tr": null}, {"zh": "坐火车去北京，五个小时才能到。", "py": "Zuò huǒchē qù Běijīng, wǔ gè xiǎoshí cái néng dào.", "id": "Naik kereta ke Beijing, lima jam baru bisa sampai.", "b": true, "tr": null}, {"zh": "我觉得下个月才能搬家。", "py": "Wǒ juéde xià gè yuè cái néng bānjiā.", "id": "Menurutku bulan depan baru bisa pindah rumah.", "b": true, "tr": "03-7"}, {"zh": "这么多事情最少需要两个星期才能做完。", "py": "Zhème duō shìqing zuì shǎo xūyào liǎng gè xīngqī cái néng zuò wán.", "id": "Urusan sebanyak ini paling sedikit butuh dua minggu baru bisa selesai.", "b": true, "tr": "03-7"}, {"zh": "飞机早就到了，你看见白家月他们了吗？", "py": "Fēijī zǎo jiù dào le, nǐ kànjiàn Bái Jiāyuè tāmen le ma?", "id": "Pesawatnya sudah lama tiba, kamu sudah lihat Bai Jiayue dan yang lain?", "b": true, "tr": "01-5"}, {"zh": "你们怎么这么晚才到宾馆？", "py": "Nǐmen zěnme zhème wǎn cái dào bīnguǎn?", "id": "Kenapa kalian baru sampai di hotel selarut ini?", "b": false, "tr": null}, {"zh": "你去哪儿了？怎么这么晚才回来？", "py": "Nǐ qù nǎr le? Zěnme zhème wǎn cái huílái?", "id": "Kamu ke mana? Kenapa baru pulang selarut ini?", "b": false, "tr": null}, {"zh": "电影七点开始，他六点半就到了。", "py": "Diànyǐng qī diǎn kāishǐ, tā liù diǎn bàn jiù dào le.", "id": "Film mulai jam tujuh, dia sudah tiba jam setengah tujuh.", "b": false, "tr": null}, {"zh": "昨天我十二点才睡觉。", "py": "Zuótiān wǒ shí'èr diǎn cái shuìjiào.", "id": "Kemarin aku baru tidur jam dua belas.", "b": false, "tr": null}, {"zh": "这本书我两天就看完了。", "py": "Zhè běn shū wǒ liǎng tiān jiù kàn wán le.", "id": "Buku ini sudah selesai kubaca dalam dua hari.", "b": false, "tr": null}, {"zh": "他学了三年才学会开车。", "py": "Tā xué le sān nián cái xué huì kāichē.", "id": "Dia belajar tiga tahun baru bisa menyetir.", "b": false, "tr": null}], "salah": [{"s": "他十点才起床了。", "sp": "Tā shí diǎn cái qǐchuáng le.", "n": "", "b": "他十点才起床。", "bp": "Tā shí diǎn cái qǐchuáng.", "a": "才 tidak dipakai bersama 了 di akhir."}, {"s": "我就五点起床了。", "sp": "Wǒ jiù wǔ diǎn qǐchuáng le.", "n": "", "b": "我五点就起床了。", "bp": "Wǒ wǔ diǎn jiù qǐchuáng le.", "a": "Kata waktu sebelum 就."}, {"s": "他六点就来。", "sp": "Tā liù diǎn jiù lái.", "n": "kejadian kemarin", "b": "他六点就来了。", "bp": "Tā liù diǎn jiù lái le.", "a": "Kejadian lampau dengan 就 biasanya diakhiri 了."}], "latihan": [{"k": "3-3.0", "t": "pg", "q": "电影八点开始，我七点___到了。", "o": ["就", "才", "都", "也"], "a": 0, "x": "Lebih awal dari dugaan: 就.", "f": "电影八点开始，我七点就到了。", "fp": "Diànyǐng bā diǎn kāishǐ, wǒ qī diǎn jiù dào le."}, {"k": "3-3.1", "t": "pg", "q": "路上堵车，我九点___到公司。", "o": ["才", "就", "都", "了"], "a": 0, "x": "Terlambat: 才.", "f": "路上堵车，我九点才到公司。", "fp": "Lùshang dǔ chē, wǒ jiǔ diǎn cái dào gōngsī."}, {"k": "3-3.2", "t": "pg", "q": "Mana yang BENAR?", "o": ["他十一点才睡觉。", "他十一点才睡觉了。", "他才十一点睡觉了。", "他十一点就睡觉。"], "a": 0, "x": "才 tanpa 了."}, {"k": "3-3.3", "t": "pg", "q": "银行很近，走路五分钟___能到。", "o": ["就", "才", "还", "再"], "a": 0, "x": "Dekat/cepat: 就.", "f": "银行很近，走路五分钟就能到。", "fp": "Yínháng hěn jìn, zǒulù wǔ fēnzhōng jiù néng dào."}, {"k": "3-3.4", "t": "pg", "q": "坐火车去那儿要十个小时，太远了，十个小时___能到。", "o": ["才", "就", "都", "又"], "a": 0, "x": "Lama: 才.", "f": "坐火车去那儿要十个小时，太远了，十个小时才能到。", "fp": "Zuò huǒchē qù nàr yào shí gè xiǎoshí, tài yuǎn le, shí gè xiǎoshí cái néng dào."}, {"k": "3-3.5", "t": "pg", "q": "\"Kenapa baru datang sekarang?\" =", "o": ["你怎么现在才来？", "你怎么现在就来了？", "你怎么才现在来？", "你怎么现在来才？"], "a": 0, "x": "Waktu + 才 + KK."}, {"k": "3-3.6", "t": "pg", "q": "这本书很容易，我一天___看完了。", "o": ["就", "才", "再", "还"], "a": 0, "x": "Cepat: 就 … 了.", "f": "这本书很容易，我一天就看完了。", "fp": "Zhè běn shū hěn róngyì, wǒ yì tiān jiù kàn wán le."}, {"k": "3-3.7", "t": "su", "w": ["我", "早上", "五点", "就", "起床", "了"], "s": "我早上五点就起床了。", "alt": ["早上我五点就起床了。"], "p": "Wǒ zǎoshang wǔ diǎn jiù qǐchuáng le.", "x": "Jam lima pagi aku sudah bangun."}, {"k": "3-3.8", "t": "su", "w": ["他", "十二点", "才", "回家"], "s": "他十二点才回家。", "alt": [], "p": "Tā shí'èr diǎn cái huí jiā.", "x": "Dia baru pulang jam dua belas."}, {"k": "3-3.9", "t": "su", "w": ["走路", "几", "分钟", "就", "能", "到"], "s": "走路几分钟就能到。", "alt": [], "p": "Zǒulù jǐ fēnzhōng jiù néng dào.", "x": "Jalan kaki beberapa menit sudah bisa sampai."}, {"k": "3-3.10", "t": "su", "w": ["你", "怎么", "这么", "晚", "才", "来"], "s": "你怎么这么晚才来？", "alt": [], "p": "Nǐ zěnme zhème wǎn cái lái?", "x": "Kenapa kamu baru datang selarut ini?"}, {"k": "3-3.11", "t": "su", "w": ["这本", "书", "我", "两", "天", "就", "看完", "了"], "s": "这本书我两天就看完了。", "alt": [], "p": "Zhè běn shū wǒ liǎng tiān jiù kàn wán le.", "x": "Buku ini sudah selesai kubaca dalam dua hari."}, {"k": "3-3.12", "t": "bs", "s": "坐火车去北京，五个小时才能到。", "sp": "Zuò huǒchē qù Běijīng, wǔ gè xiǎoshí cái néng dào.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "3-3.13", "t": "bs", "s": "我昨天十点才起床了。", "sp": "Wǒ zuótiān shí diǎn cái qǐchuáng le.", "n": "", "ok": false, "b": "我昨天十点才起床。", "bp": "Wǒ zuótiān shí diǎn cái qǐchuáng.", "x": "才 tanpa 了."}, {"k": "3-3.14", "t": "bs", "s": "他学了半年就会说汉语了。", "sp": "Tā xué le bàn nián jiù huì shuō Hànyǔ le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: cepat → 就……了."}, {"k": "3-3.15", "t": "bs", "s": "我就六点起床了。", "sp": "Wǒ jiù liù diǎn qǐchuáng le.", "n": "", "ok": false, "b": "我六点就起床了。", "bp": "Wǒ liù diǎn jiù qǐchuáng le.", "x": "Kata waktu sebelum 就."}]}, {"id": "4-1", "pel": 4, "judul": "Pola tetap 一……也/都 + 不/没……: sama sekali tidak", "kode": "固定格式“一……也/都+不/没……”", "rumus": ["一 + KU + KB + 也/都 + 不/没 + KK", "一点儿 + KB + 也/都 + 不/没 + KK", "一点儿 + 也/都 + 不/没 + KS"], "jelas": ["Pola 一……也/都 + 不/没…… menyatakan ingkar total: \"sama sekali tidak, satu pun tidak\". 她一件衣服都不想买 = dia tidak mau membeli satu baju pun.", "Bagian 一 + kata ukuran + kata benda (objek) dipindah ke DEPAN kata kerja, lalu diikuti 也 atau 都, lalu 不/没 + KK. Arti 也 dan 都 di sini sama.", "Pakai 不 untuk tidak mau/tidak akan/kebiasaan (不想买, 不认识), dan 没 untuk tidak pernah/belum terjadi (没看过, 没吃). 我一个中国电影也没看过 = aku belum pernah menonton satu film Tiongkok pun.", "Bagian 一 + KU dapat diganti 一点儿 untuk benda yang tidak bisa dihitung atau hal abstrak: 我一点儿东西也不想吃, 他对打球一点儿兴趣都没有.", "Jika predikatnya kata sifat, pakai 一点儿 + 也/都 + 不/没 + KS: 草原一点儿也不冷 (padang rumput sama sekali tidak dingin). JANGAN memakai 有点儿 di sini: 有点儿也不冷 salah. Juga jangan taruh 一点儿 setelah kata sifat (不冷一点儿) — itu kesalahan umum pelajar Indonesia yang terbawa \"tidak dingin sedikit pun\".", "Bahasa Indonesia meletakkan \"satu pun/sedikit pun\" di belakang (\"saya tidak kenal satu orang pun\"). Bahasa Mandarin wajib memindahkannya ke depan: 我一个人也不认识."], "poin": ["Ingkar total: 一 + KU + KB + 也/都 + 不/没 + KK.", "Objek pindah ke depan kata kerja.", "一点儿 untuk benda tak terhitung atau KS.", "不 untuk keinginan/kebiasaan, 没 untuk kejadian/pengalaman."], "contoh": [{"zh": "她一件衣服都不想买。", "py": "Tā yí jiàn yīfu dōu bù xiǎng mǎi.", "id": "Dia tidak mau membeli satu baju pun.", "b": true, "tr": null}, {"zh": "我一个中国电影也没看过。", "py": "Wǒ yí gè Zhōngguó diànyǐng yě méi kàn guò.", "id": "Aku belum pernah menonton satu film Tiongkok pun.", "b": true, "tr": null}, {"zh": "我一点儿东西也不想吃。", "py": "Wǒ yìdiǎnr dōngxi yě bù xiǎng chī.", "id": "Aku sama sekali tidak ingin makan apa pun.", "b": true, "tr": null}, {"zh": "他对打球一点儿兴趣都没有。", "py": "Tā duì dǎ qiú yìdiǎnr xìngqù dōu méiyǒu.", "id": "Dia sama sekali tidak tertarik bermain bola.", "b": true, "tr": null}, {"zh": "草原一点儿也不冷。", "py": "Cǎoyuán yìdiǎnr yě bù lěng.", "id": "Padang rumput sama sekali tidak dingin.", "b": true, "tr": "04-1"}, {"zh": "他们一点儿也没着急。", "py": "Tāmen yìdiǎnr yě méi zháojí.", "id": "Mereka sama sekali tidak cemas.", "b": true, "tr": null}, {"zh": "天已经黑了，但是司机小李一直在机场等我们，一点儿也没着急。", "py": "Tiān yǐjīng hēi le, dànshì sījī Xiǎo Lǐ yìzhí zài jīchǎng děng wǒmen, yìdiǎnr yě méi zháojí.", "id": "Hari sudah gelap, tetapi sopir Xiao Li terus menunggu kami di bandara, sama sekali tidak gelisah.", "b": true, "tr": "04-7"}, {"zh": "我刚来这儿，一个朋友也没有。", "py": "Wǒ gāng lái zhèr, yí gè péngyou yě méiyǒu.", "id": "Aku baru datang ke sini, tidak punya satu teman pun.", "b": false, "tr": null}, {"zh": "这个星期我太忙了，一天也没休息。", "py": "Zhège xīngqī wǒ tài máng le, yì tiān yě méi xiūxi.", "id": "Minggu ini aku terlalu sibuk, tidak istirahat sehari pun.", "b": false, "tr": null}, {"zh": "昨天的作业我一个字都没写。", "py": "Zuótiān de zuòyè wǒ yí gè zì dōu méi xiě.", "id": "PR kemarin tidak kutulis satu huruf pun.", "b": false, "tr": null}, {"zh": "这件衣服一点儿也不贵。", "py": "Zhè jiàn yīfu yìdiǎnr yě bú guì.", "id": "Baju ini sama sekali tidak mahal.", "b": false, "tr": null}], "salah": [{"s": "我不认识一个人。", "sp": "Wǒ bú rènshi yí gè rén.", "n": "aku tidak kenal satu orang pun", "b": "我一个人也不认识。", "bp": "Wǒ yí gè rén yě bú rènshi.", "a": "\"Satu pun\" dipindah ke depan kata kerja dengan 也/都."}, {"s": "这儿不冷一点儿。", "sp": "Zhèr bù lěng yìdiǎnr.", "n": "", "b": "这儿一点儿也不冷。", "bp": "Zhèr yìdiǎnr yě bù lěng.", "a": "一点儿也/都 diletakkan sebelum 不 + KS."}, {"s": "他有点儿也不累。", "sp": "Tā yǒudiǎnr yě bú lèi.", "n": "", "b": "他一点儿也不累。", "bp": "Tā yìdiǎnr yě bú lèi.", "a": "Gunakan 一点儿, bukan 有点儿."}, {"s": "我一个电影都不看过。", "sp": "Wǒ yí gè diànyǐng dōu bú kàn guò.", "n": "", "b": "我一个电影都没看过。", "bp": "Wǒ yí gè diànyǐng dōu méi kàn guò.", "a": "Pengalaman (过) diingkari dengan 没."}], "latihan": [{"k": "4-1.0", "t": "pg", "q": "我太累了，___也不想走。", "o": ["一步", "一点儿步", "有点儿", "一下"], "a": 0, "x": "一 + KU (步) + 也不 + KK.", "f": "我太累了，一步也不想走。", "fp": "Wǒ tài lèi le, yí bù yě bù xiǎng zǒu."}, {"k": "4-1.1", "t": "pg", "q": "这里的冬天一点儿也不___。", "o": ["冷", "冷一点儿", "很冷", "冷了一点儿"], "a": 0, "x": "一点儿也不 + KS.", "f": "这里的冬天一点儿也不冷。", "fp": "Zhèlǐ de dōngtiān yìdiǎnr yě bù lěng."}, {"k": "4-1.2", "t": "pg", "q": "\"Aku tidak punya satu teman pun.\" =", "o": ["我一个朋友也没有。", "我没有一个朋友也。", "我也一个朋友没有。", "我一个朋友也不有。"], "a": 0, "x": "一个朋友 + 也 + 没有 (有 diingkari dengan 没)."}, {"k": "4-1.3", "t": "pg", "q": "我一个中国电影都___看过。", "o": ["没", "不", "别", "很"], "a": 0, "x": "Pengalaman 过 → 没.", "f": "我一个中国电影都没看过。", "fp": "Wǒ yí gè Zhōngguó diànyǐng dōu méi kàn guò."}, {"k": "4-1.4", "t": "pg", "q": "Kalimat mana yang BENAR?", "o": ["他一点儿也不着急。", "他有点儿也不着急。", "他不着急一点儿。", "他一点儿不也着急。"], "a": 0, "x": "一点儿 + 也 + 不 + KS."}, {"k": "4-1.5", "t": "pg", "q": "这个星期我太忙了，___也没休息。", "o": ["一天", "一点儿天", "有点儿", "天天"], "a": 0, "x": "一天也没休息 = tidak istirahat sehari pun.", "f": "这个星期我太忙了，一天也没休息。", "fp": "Zhège xīngqī wǒ tài máng le, yì tiān yě méi xiūxi."}, {"k": "4-1.6", "t": "pg", "q": "他对音乐___兴趣都没有。", "o": ["一点儿", "有点儿", "一些", "一下"], "a": 0, "x": "Kata abstrak (兴趣) memakai 一点儿.", "f": "他对音乐一点儿兴趣都没有。", "fp": "Tā duì yīnyuè yìdiǎnr xìngqù dōu méiyǒu."}, {"k": "4-1.7", "t": "su", "w": ["她", "一件", "衣服", "都", "不", "想", "买"], "s": "她一件衣服都不想买。", "alt": [], "p": "Tā yí jiàn yīfu dōu bù xiǎng mǎi.", "x": "Dia tidak mau membeli satu baju pun."}, {"k": "4-1.8", "t": "su", "w": ["我", "一点儿", "东西", "也", "不", "想", "吃"], "s": "我一点儿东西也不想吃。", "alt": [], "p": "Wǒ yìdiǎnr dōngxi yě bù xiǎng chī.", "x": "Aku sama sekali tidak ingin makan apa pun."}, {"k": "4-1.9", "t": "su", "w": ["草原", "一点儿", "也", "不", "冷"], "s": "草原一点儿也不冷。", "alt": [], "p": "Cǎoyuán yìdiǎnr yě bù lěng.", "x": "Padang rumput sama sekali tidak dingin."}, {"k": "4-1.10", "t": "su", "w": ["我", "一个", "人", "也", "不", "认识"], "s": "我一个人也不认识。", "alt": [], "p": "Wǒ yí gè rén yě bú rènshi.", "x": "Aku tidak kenal satu orang pun."}, {"k": "4-1.11", "t": "su", "w": ["昨天", "我", "一", "分", "钱", "都", "没", "花"], "s": "昨天我一分钱都没花。", "alt": ["我昨天一分钱都没花。"], "p": "Zuótiān wǒ yì fēn qián dōu méi huā.", "x": "Kemarin aku tidak menghabiskan satu sen pun."}, {"k": "4-1.12", "t": "bs", "s": "他们一点儿也没着急。", "sp": "Tāmen yìdiǎnr yě méi zháojí.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "4-1.13", "t": "bs", "s": "这个菜不辣一点儿。", "sp": "Zhège cài bú là yìdiǎnr.", "n": "", "ok": false, "b": "这个菜一点儿也不辣。", "bp": "Zhège cài yìdiǎnr yě bú là.", "x": "一点儿也 + 不 + KS."}, {"k": "4-1.14", "t": "bs", "s": "我一个汉字都没写错。", "sp": "Wǒ yí gè Hànzì dōu méi xiě cuò.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "4-1.15", "t": "bs", "s": "我一本书也不看过。", "sp": "Wǒ yì běn shū yě bú kàn guò.", "n": "", "ok": false, "b": "我一本书也没看过。", "bp": "Wǒ yì běn shū yě méi kàn guò.", "x": "Pengalaman (过) diingkari dengan 没."}]}, {"id": "4-2", "pel": 4, "judul": "Kalimat perbandingan (9): A 跟 B 一样 (+ KS)", "kode": "比较句（9）", "rumus": ["A + 跟 + B + 一样", "A + 跟 + B + 一样 + KS", "A + 跟 + B + 不一样 (/ 都不一样)", "A + 跟 + B + 一样 + KS + 吗？"], "jelas": ["Pola A 跟 B 一样 menyatakan bahwa setelah dibandingkan, A dan B SAMA. 他买的新手机跟我的一样 = HP baru yang dia beli sama dengan punyaku.", "Setelah 一样 boleh ditambah kata sifat untuk menunjukkan aspek yang dibandingkan: 这个房间跟那个房间一样大 = kamar ini sama besarnya dengan kamar itu. Kata sifat langsung setelah 一样, tanpa 很.", "Bentuk ingkar: tambahkan 不 sebelum 一样: A 跟 B 不一样. 这家宾馆跟别的都不一样 = hotel ini berbeda dari yang lain. Perhatikan 不 di depan 一样, BUKAN di depan 跟 (不跟 kurang tepat dalam arti ini) dan bukan di depan kata sifat (一样不大 salah).", "Bertanya: A 跟 B 一样吗？ / A 跟 B 一样不一样？ / A 跟 B 一样 KS 吗？ 跟 boleh diganti 和 dengan arti yang sama: 我和你一样高.", "Jebakan pelajar Indonesia: \"A sama tinggi dengan B\" sering diterjemahkan 一样高跟B atau A一样高B. Ingat urutan: A + 跟 + B + 一样 + KS. Juga jangan pakai 很 sebelum 一样 dengan kata sifat (很一样高 salah).", "Bandingkan dengan 比: A 比 B 高 = A lebih tinggi dari B (berbeda). A 跟 B 一样高 = sama tinggi."], "poin": ["A 跟 B 一样 = A sama dengan B.", "Aspek: A 跟 B 一样 + KS (tanpa 很).", "Ingkar: A 跟 B 不一样.", "跟 bisa diganti 和."], "contoh": [{"zh": "这家宾馆跟别的都不一样。", "py": "Zhè jiā bīnguǎn gēn biéde dōu bù yíyàng.", "id" an 除了小王，我们还请了小李 = Xiao Wang dan Xiao Li sama-sama diundang. Perhatikan kata 都 vs 还/也.", "Jebakan pelajar Indonesia: \"selain\" dalam bahasa Indonesia bisa bermakna keduanya, sehingga pelajar lupa memakai 都 atau 还/也 di klausa kedua. Dalam bahasa Mandarin, kata pasangan itu wajib dan menentukan arti.", "Kata 都/还/也 harus sebelum kata kerja, setelah subjek: 除了这个汉字，别的汉字我都会写 (bukan 都我会写)."], "poin": ["除了…(以外) = selain/kecuali.", "…都… = mengecualikan A.", "…还/也… = menambahkan selain A.", "以外 boleh dihilangkan; 都/还/也 sebelum kata kerja."], "contoh": [{"zh": "除了我以外，大家都在玩手机。", "py": "Chúle wǒ yǐwài, dàjiā dōu zài wán shǒujī.", "id": "Kecuali aku, semua orang sedang main HP.", "b": true, "tr": null}, {"zh": "除了这个汉字，别的汉字我都会写。", "py": "Chúle zhège Hànzì, biéde Hànzì wǒ dōu huì xiě.", "id": "Kecuali hanzi ini, hanzi yang lain aku bisa menulis semuanya.", "b": true, "tr": null}, {"zh": "除了这个行李箱以外，还有别的东西吗？", "py": "Chúle zhège xíngli xiāng yǐwài, hái yǒu biéde dōngxi ma?", "id": "Selain koper ini, masih ada barang lain?", "b": true, "tr": "04-5"}, {"zh": "除了唱歌以外，他也喜欢跳舞。", "py": "Chúle chànggē yǐwài, tā yě xǐhuan tiàowǔ.", "id": "Selain menyanyi, dia juga suka menari.", "b": true, "tr": null}, {"zh": "妈妈除了喝咖啡，也喜欢喝茶。", "py": "Māma chúle hē kāfēi, yě xǐhuan hē chá.", "id": "Selain minum kopi, ibu juga suka minum teh.", "b": false, "tr": null}, {"zh": "除了星期天，我每天都上班。", "py": "Chúle xīngqītiān, wǒ měi tiān dōu shàngbān.", "id": "Kecuali hari Minggu, aku masuk kerja setiap hari.", "b": false, "tr": null}, {"zh": "这几个月累坏了，每天除了工作，还要照顾孩子。", "py": "Zhè jǐ gè yuè lèi huài le, měi tiān chúle gōngzuò, hái yào zhàogù háizi.", "id": "Beberapa bulan ini capek sekali, setiap hari selain bekerja masih harus mengurus anak.", "b": false, "tr": null}, {"zh": "除了小王以外，我们班的同学都去了。", "py": "Chúle xiǎo Wáng yǐwài, wǒmen bān de tóngxué dōu qù le.", "id": "Kecuali Xiao Wang, teman sekelas kami semua pergi.", "b": false, "tr": null}, {"zh": "除了要买几个纸箱，还要买什么？", "py": "Chúle yào mǎi jǐ gè zhǐ xiāng, hái yào mǎi shé xí lìshǐ.", "n": "", "ok": false, "b": "除了数学，他还学习历史。", "bp": "Chúle shùxué, tā hái xuéxí lìshǐ.", "x": "Subjek sebelum 还."}]}, {"id": "5-1", "pel": 5, "judul": "Pelengkap derajat (2): KS + 得很 (… sekali)", "kode": "程度补语（2）", "rumus": ["Subjek + KS + 得很", "Subjek + KK perasaan + 得很", "…，KS + 得很"], "jelas": ["得很 (de hěn) diletakkan SETELAH kata sifat untuk menyatakan derajat yang tinggi: 现在天气好得很 = sekarang cuacanya bagus sekali. Pola ini umum dalam bahasa lisan.", "Susunan: KS + 得 + 很. Tidak ada kata lain di antara KS dan 得. Kata 很 di sini berada di BELAKANG (berbeda dengan 很好 biasa yang 很-nya di depan). Kalimat tidak memakai 了 di akhir.", "Derajat 好得很 lebih kuat dari 很好. Bisa untuk hal positif (好得很, 漂亮得很) maupun negatif (热得很, 累得很, 难过得很). Ini berbeda dengan 坏了 yang umumnya negatif.", "Pola ini tidak dipakai dalam bentuk ingkar (不好得很 salah) dan tidak dipakai dengan 很/非常 di depan (很好得很 salah). Untuk bertanya, tanyakan dengan 怎么样, lalu jawab dengan KS + 得很.", "Jebakan: jangan tertukar dengan pelengkap keadaan KK + 得 + 很 + KS (他跑得很快 = dia larinya cepat). Pada 得很, yang di depan 得 adalah KATA SIFAT dan 很 berada di akhir; pada pelengkap keadaan, yang di depan 得 adalah KATA KERJA dan ada kata sifat setelah 很.", "Bandingkan beberapa pelengkap derajat: KS + 坏了 (dilebih-lebihkan, negatif), KS + 极了 (… sekali, sangat umum), KS + 得很 (… sekali, lisan)."], "poin": ["KS + 得很 = … sekali.", "很 di akhir, setelah 得.", "Untuk positif maupun negatif.", "Tanpa ingkar, tanpa 很 di depan, tanpa 了."], "contoh": [{"zh": "现在天气好得很。", "py": "Xiànzài tiānqì hǎo de hěn.", "id": "Sekarang cuacanya bagus sekali.", "b": true, "tr": "05-1"}, {"zh": "房间里面热得很。", "py": "Fángjiān lǐmiàn rè de hěn.", "id": "Di dalam kamar panas sekali.", "b": true, "tr": null}, {"zh": "我觉得爬山累得很。", "py": "Wǒ juéde pá shān lèi de hěn.", "id": "Menurutku naik gunung capek sekali.", "b": true, "tr": null}, {"zh": "她难过得很，哈哈。", "py": "Tā nánguò de hěn, hāhā.", "id": "Dia sedih sekali, haha.", "b": true, "tr": "05-7"}, {"zh": "现在天气好得很
