: "我们应该向他学习。", "bp": "Wǒmen yīnggāi xiàng tā xuéxí.", "x": "\"Belajar dari\" = 向……学习."}, {"k": "17-1.13", "t": "bs", "s": "他一下车就向商店跑去。", "sp": "Tā yíxià chē jiù xiàng shāngdiàn pǎo qù.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "17-1.14", "t": "bs", "s": "你要请假向经理。", "sp": "Nǐ yào qǐngjià xiàng jīnglǐ.", "n": "", "ok": false, "b": "你要向经理请假。", "bp": "Nǐ yào xiàng jīnglǐ qǐngjià.", "x": "向 + orang sebelum kata kerja."}, {"k": "17-1.15", "t": "bs", "s": "以后我要多向认真的人学习。", "sp": "Yǐhòu wǒ yào duō xiàng rènzhēn de rén xuéxí.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "17-2", "pel": 17, "judul": "Pertanyaan retoris: 不是……吗？ (bukankah …?)", "kode": "反问句\"不是……吗？\"", "rumus": ["S + 不是 + KK/KS/… + 吗？", "S + 不是 + KB + 吗？", "不是……吗？+ kalimat lanjutan"], "jelas": ["不是……吗？ adalah pertanyaan retoris: bentuknya ingkar, tetapi artinya MENEGASKAN (positif). 你不是喜欢玩电脑吗？= bukankah kamu suka main komputer? → artinya: kamu memang suka main komputer. Pembicara tidak benar-benar bertanya.", "Fungsinya: (1) menyatakan heran atau tidak mengerti (你不是说今天有事吗？为什么来了？), (2) menyatakan tidak puas, (3) mengingatkan atau memastikan sesuatu yang sudah diketahui (考试不是下个月吗？). Biasanya diikuti kalimat lanjutan yang menunjukkan maksud pembicara.", "Susunan: 不是 diletakkan setelah subjek, sebelum bagian yang ditegaskan: 你不是喜欢……吗, 你不是说……吗, 考试不是下个月吗. 吗 selalu di akhir.", "Bahasa Indonesia punya padanan yang sangat mirip: \"bukankah …?\" atau \"bukannya …?\". Jadi cara berpikirnya sama. Bedanya, dalam bahasa Mandarin 不是 berada setelah subjek: \"Bukankah kamu suka …\" = 你不是喜欢……吗, bukan *不是你喜欢……吗 (bentuk itu ada tetapi lebih jarang dan nuansanya berbeda).", "Bedakan dengan pertanyaan biasa 是不是: 你是不是喜欢电脑？ = apakah kamu suka komputer? (benar-benar bertanya, jawabannya belum diketahui). 不是……吗 = pembicara sudah yakin jawabannya \"ya\".", "Jawaban terhadap 不是……吗 biasanya mengakui atau menjelaskan: A：你不是不喜欢吃辣的吗？ B：是啊，所以我点了不辣的菜."], "poin": ["Bentuk ingkar, arti positif (menegaskan).", "Untuk heran, tidak puas, mengingatkan.", "不是 setelah subjek, 吗 di akhir.", "Padanan Indonesia: \"bukankah …?\"", "Beda dengan pertanyaan biasa 是不是."], "contoh": [{"zh": "你不是喜欢玩电脑吗？你可以去看看跟电脑有关系的书。", "py": "Nǐ bú shì xǐhuan wán diànnǎo ma? Nǐ kěyǐ qù kànkan gēn diànnǎo yǒuguān xì de shū.", "id": "Bukankah kamu suka main komputer? Kamu bisa lihat-lihat buku yang berhubungan dengan komputer.", "b": true, "tr": "17-3"}, {"zh": "你不是说今天有事吗？为什么来了？", "py": "Nǐ bú shì shuō jīntiān yǒu shì ma? Wèishénme lái le?", "id": "Bukankah kamu bilang hari ini ada urusan? Kenapa datang?", "b": true, "tr": null}, {"zh": "考试不是下个月吗？你怎么今天就开始复习了？", "py": "Kǎoshì bú shì xià gè yuè ma? Nǐ zěnme jīntiān jiù kāishǐ fùxí le?", "id": "Bukankah ujiannya bulan depan? Kenapa hari ini kamu sudah mulai mengulang pelajaran?", "b": true, "tr": null}, {"zh": "你不是去过南京吗？怎么还想去？", "py": "Nǐ bú shì qù guò nánjīng ma? Zěnme hái xiǎng qù?", "id": "Bukankah kamu sudah pernah ke Nanjing? Kenapa masih mau pergi?", "b": false, "tr": null}, {"zh": "你不是不喜欢喝咖啡吗？今天怎么喝了？", "py": "Nǐ bú shì bù xǐhuan hē kāfēi ma? Jīntiān zěnme hē le?", "id": "Bukankah kamu tidak suka minum kopi? Kenapa hari ini minum?", "b": false, "tr": null}, {"zh": "他不是你的同学吗？你怎么不认识他？", "py": "Tā bú shì nǐ de tóngxué ma? Nǐ zěnme bú rènshi tā?", "id": "Bukankah dia teman sekelasmu? Kenapa kamu tidak mengenalnya?", "b": false, "tr": null}, {"zh": "今天不是星期六吗？你怎么还去上班？", "py": "Jīntiān bú shì xīngqīliù ma? Nǐ zěnme hái qù shàngbān?", "id": "Bukankah hari ini Sabtu? Kenapa kamu masih berangkat kerja?", "b": false, "tr": null}, {"zh": "你不是想学中文吗？我们一起去报名吧。", "py": "Nǐ bú shì xiǎng xué Zhōngwén ma? Wǒmen yìqǐ qù bào míng ba.", "id": "Bukankah kamu ingin belajar bahasa Mandarin? Ayo kita daftar bersama.", "b": false, "tr": null}, {"zh": "这本书不是你借的吗？快还给图书馆吧。", "py": "Zhè běn shū bú shì nǐ jiè de ma? Kuài huán gěi túshūguǎn ba.", "id": "Bukankah buku ini yang kamu pinjam? Cepat kembalikan ke perpustakaan.", "b": false, "tr": null}, {"zh": "你不是很累吗？早点儿睡觉吧。", "py": "Nǐ bú shì hěn lèi ma? Zǎo diǎnr shuìjiào ba.", "id": "Bukankah kamu capek? Tidurlah lebih awal.", "b": false, "tr": null}], "salah": [{"s": "你不是喜欢玩电脑？", "sp": "Nǐ bú shì xǐhuan wán diànnǎo?", "n": "", "b": "你不是喜欢玩电脑吗？", "bp": "Nǐ bú shì xǐhuan wán diànnǎo ma?", "a": "Pola retoris ini perlu 吗 di akhir."}, {"s": "你是不是说今天有事吗？为什么来了？", "sp": "Nǐ shì bu shì shuō jīntiān yǒu shì ma? Wèishénme lái le?", "n": "", "b": "你不是说今天有事吗？为什么来了？", "bp": "Nǐ bú shì shuō jīntiān yǒu shì ma? Wèishénme lái le?", "a": "是不是 tidak dipakai bersama 吗; untuk retoris pakai 不是……吗."}, {"s": "你没是去过北京吗？", "sp": "Nǐ méi shì qù guò Běijīng ma?", "n": "", "b": "你不是去过北京吗？", "bp": "Nǐ bú shì qù guò Běijīng ma?", "a": "Polanya selalu 不是, bukan 没是."}], "latihan": [{"k": "17-2.0", "t": "pg", "q": "你___喜欢玩电脑吗？你可以看看跟电脑有关系的书。", "o": ["不是", "是不是", "没", "没有"], "a": 0, "x": "Retoris: 不是……吗？", "f": "你不是喜欢玩电脑吗？你可以看看跟电脑有关系的书。", "fp": "Nǐ bú shì xǐhuan wán diànnǎo ma? Nǐ kěyǐ kànkan gēn diànnǎo yǒuguān xì de shū."}, {"k": "17-2.1", "t": "pg", "q": "\"你不是说今天有事吗？\" artinya pembicara …", "o": ["heran karena orang itu bilang ada urusan tetapi datang", "tidak tahu apakah orang itu ada urusan", "yakin orang itu tidak ada urusan", "mengajak orang itu pergi"], "a": 0, "x": "不是……吗 menegaskan: kamu MEMANG bilang ada urusan."}, {"k": "17-2.2", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["考试不是下个月吗？", "考试不是下个月？", "考试是不是下个月吗？", "不是考试下个月吗了？"], "a": 0, "x": "Pola lengkap 不是……吗？"}, {"k": "17-2.3", "t": "pg", "q": "\"Bukankah kamu sudah pernah ke Nanjing?\" =", "o": ["你不是去过南京吗？", "你没去过南京吗是？", "你是去过南京不吗？", "你不去过南京是吗？"], "a": 0, "x": "S + 不是 + KK + 吗？"}, {"k": "17-2.4", "t": "pg", "q": "Pertanyaan mana yang BENAR-BENAR bertanya (bukan retoris)?", "o": ["你是不是喜欢电脑？", "你不是喜欢电脑吗？", "你不是说过你喜欢电脑吗？", "他不是你的同学吗？"], "a": 0, "x": "是不是 = pertanyaan biasa."}, {"k": "17-2.5", "t": "pg", "q": "A：今年放假我还想去南京。 B：___", "o": ["你不是去过南京吗？", "你是不是去过南京吗？", "你不去过南京吗？", "你没是去过南京吗？"], "a": 0, "x": "Mengingatkan: 不是……吗？"}, {"k": "17-2.6", "t": "su", "w": ["你", "不是", "喜欢", "玩", "电脑", "吗"], "s": "你不是喜欢玩电脑吗？", "alt": [], "p": "Nǐ bú shì xǐhuan wán diànnǎo ma?", "x": "Bukankah kamu suka main komputer?"}, {"k": "17-2.7", "t": "su", "w": ["考试", "不是", "下", "个", "月", "吗"], "s": "考试不是下个月吗？", "alt": [], "p": "Kǎoshì bú shì xià gè yuè ma?", "x": "Bukankah ujiannya bulan depan?"}, {"k": "17-2.8", "t": "su", "w": ["你", "不是", "说", "今天", "有", "事", "吗"], "s": "你不是说今天有事吗？", "alt": [], "p": "Nǐ bú shì shuō jīntiān yǒu shì ma?", "x": "Bukankah kamu bilang hari ini ada urusan?"}, {"k": "17-2.9", "t": "su", "w": ["他", "不是", "你", "的", "同学", "吗"], "s": "他不是你的同学吗？", "alt": [], "p": "Tā bú shì nǐ de tóngxué ma?", "x": "Bukankah dia teman sekelasmu?"}, {"k": "17-2.10", "t": "su", "w": ["你", "不是", "不", "喜欢", "喝", "咖啡", "吗"], "s": "你不是不喜欢喝咖啡吗？", "alt": [], "p": "Nǐ bú shì bù xǐhuan hē kāfēi ma?", "x": "Bukankah kamu tidak suka minum kopi?"}, {"k": "17-2.11", "t": "bs", "s": "今天不是星期六吗？你怎么还去上班？", "sp": "Jīntiān bú shì xīngqīliù ma? Nǐ zěnme hái qù shàngbān?", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "17-2.12", "t": "bs", "s": "你不是很累？早点儿睡吧。", "sp": "Nǐ bú shì hěn lèi? Zǎo diǎnr shuì ba.", "n": "", "ok": false, "b": "你不是很累吗？早点儿睡吧。", "bp": "Nǐ bú shì hěn lèi ma? Zǎo diǎnr shuì ba.", "x": "Perlu 吗 di akhir."}, {"k": "17-2.13", "t": "bs", "s": "你不是想学中文吗？我们一起去报名吧。", "sp": "Nǐ bú shì xiǎng xué Zhōngwén ma? Wǒmen yìqǐ qù bào míng ba.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "17-2.14", "t": "bs", "s": "你是不是去过北京吗？", "sp": "Nǐ shì bu shì qù guò Běijīng ma?", "n": "", "ok": false, "b": "你不是去过北京吗？", "bp": "Nǐ bú shì qù guò Běijīng ma?", "x": "Retoris memakai 不是……吗, bukan 是不是……吗."}, {"k": "17-2.15", "t": "bs", "s": "这本书不是你借的吗？", "sp": "Zhè běn shū bú shì nǐ jiè de ma?", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "17-3", "pel": 17, "judul": "Kalimat bertingkat: ……，更…… (apalagi, terlebih lagi)", "kode": "递进复句\"……，更……\"", "rumus": ["Klausa 1，更 + KK/KK bantu …", "Klausa 1，更 + 没/不 + KK …", "Klausa 1，(S) + 更 + 要/需要/了解 …"], "jelas": ["Dalam pola ……，更……, anak kalimat kedua menyatakan tingkat yang LEBIH DALAM atau lebih penting daripada yang pertama: \"…, terlebih lagi …\", \"…, apalagi …\". 我还没想好学什么，更没想好去哪个国家 = aku belum memutuskan mau belajar apa, apalagi mau ke negara mana.", "更 adalah kata keterangan, jadi diletakkan setelah subjek (kalau ada) dan sebelum kata kerja, kata kerja bantu, atau kata ingkar: 更没想好, 更要多说多练, 更需要自己的努力, 更了解了中国文化.", "Dengan bentuk ingkar (更没/更不), artinya \"apalagi tidak …\": 他不会说中文，更不会写汉字 (dia tidak bisa bicara Mandarin, apalagi menulis hanzi).", "Bedakan dengan 更 dalam perbandingan (他比我更高 / 我更喜欢北京): di sana 更 berarti \"lebih\" dan membandingkan dua hal. Dalam pola bertingkat ini, 更 menghubungkan dua anak kalimat dan menekankan bahwa bagian kedua lebih penting atau lebih jauh.", "Bahasa Indonesia sering memakai \"apalagi\" atau \"terlebih lagi\" di awal anak kalimat kedua. Dalam bahasa Mandarin, 更 tidak diletakkan di depan subjek: 我学会了中文，更了解了中国文化 — jika ada subjek baru, tulis S + 更."], "poin": ["……，更…… = …, terlebih lagi/apalagi ….", "更 sebelum KK, KK bantu (要/需要), atau 没/不.", "更没/更不 = apalagi tidak.", "Beda dengan 更 perbandingan (比……更)."], "contoh": [{"zh": "我还没想好学什么，更没想好去哪个国家。", "py": "Wǒ hái méi xiǎng hào xué shénme, gèng méi xiǎng hǎo qù nǎge guójiā.", "id": "Aku belum memutuskan mau belajar apa, apalagi mau pergi ke negara mana.", "b": true, "tr": "17-5"}, {"zh": "想提高中文水平要多听多看，更要多说多练。", "py": "Xiǎng tígāo Zhōngwén shuǐpíng yào duō tīng duō kàn, gèng yào duō shuō duō liàn.", "id": "Kalau ingin meningkatkan kemampuan bahasa Mandarin harus banyak mendengar dan membaca, terlebih lagi harus banyak bicara dan berlatih.", "b": true, "tr": null}, {"zh": "来中国学习，我学会了中文，更了解了中国文化。", "py": "Lái Zhōngguó xuéxí, wǒ xué huì le Zhōngwén, gèng liǎojiě le Zhōngguó wénhuà.", "id": "Belajar di Tiongkok, aku jadi bisa bahasa Mandarin, terlebih lagi jadi lebih memahami budaya Tiongkok.", "b": true, "tr": null}, {"zh": "找工作的时候需要别人的帮助，更需要自己的努力。", "py": "Zhǎo gōngzuò de shíhou xūyào biérén de bāngzhù, gèng xūyào zìjǐ de nǔlì.", "id": "Saat mencari kerja kita butuh bantuan orang lain, terlebih lagi butuh usaha sendiri.", "b": false, "tr": null}, {"zh": "要想身体健康，应该多运动，更应该早睡早起。", "py": "Yào xiǎng shēntǐ jiànkāng, yīnggāi duō yùndòng, gèng yīnggāi zǎo shuì zǎo qǐ.", "id": "Kalau ingin sehat, harus banyak olahraga, terlebih lagi harus tidur dan bangun lebih awal.", "b": false, "tr": null}, {"zh": "明天参加重要的比赛，今天要好好儿练习，更要早点儿休息。", "py": "Míngtiān cānjiā zhòngyào de bǐsài, jīntiān yào hǎo hǎor liànxí, gèng yào zǎo diǎnr xiūxi.", "id": "Besok ikut pertandingan penting, hari ini harus berlatih baik-baik, terlebih lagi harus istirahat lebih awal.", "b": false, "tr": null}, {"zh": "他不会说中文，更不会写汉字。", "py": "Tā bú huì shuō Zhōngwén, gèng bú huì xiě Hànzì.", "id": "Dia tidak bisa berbicara bahasa Mandarin, apalagi menulis hanzi.", "b": false, "tr": null}, {"zh": "我没去过北京，更没去过上海。", "py": "Wǒ méi qù guò Běijīng, gèng méi qù guò Shànghǎi.", "id": "Aku belum pernah ke Beijing, apalagi ke Shanghai.", "b": false, "tr": null}, {"zh": "学习不只是为了考试，更是为了自己的将来。", "py": "Xuéxí bù zhǐshì wèile kǎoshì, gèng shì wèile zìjǐ de jiāng lái.", "id": "Belajar bukan hanya untuk ujian, terlebih lagi untuk masa depan sendiri.", "b": false, "tr": null}, {"zh": "这次旅游让我认识了很多朋友，更让我学到了很多东西。", "py": "Zhè cì lǚyóu ràng wǒ rènshi le hěn duō péngyou, gèng ràng wǒ xué dào le hěn duō dōngxi.", "id": "Perjalanan ini membuatku mengenal banyak teman, terlebih lagi membuatku belajar banyak hal.", "b": false, "tr": null}], "salah": [{"s": "我还没想好学什么，没更想好去哪儿。", "sp": "Wǒ hái méi xiǎng hào xué shénme, méi gèng xiǎng hǎo qù nǎr.", "n": "", "b": "我还没想好学什么，更没想好去哪儿。", "bp": "Wǒ hái méi xiǎng hào xué shénme, gèng méi xiǎng hǎo qù nǎr.", "a": "更 diletakkan sebelum 没."}, {"s": "他不会说中文，更他不会写汉字。", "sp": "Tā bú huì shuō Zhōngwén, gèng tā bú huì xiě Hànzì.", "n": "", "b": "他不会说中文，更不会写汉字。", "bp": "Tā bú huì shuō Zhōngwén, gèng bú huì xiě Hànzì.", "a": "更 tidak diletakkan di depan subjek."}, {"s": "想学好中文要多听，要更多说。", "sp": "Xiǎng xué hǎo Zhōngwén yào duō tīng, yào gèng duō shuō.", "n": "terlebih lagi harus banyak bicara", "b": "想学好中文要多听，更要多说。", "bp": "Xiǎng xué hǎo Zhōngwén yào duō tīng, gèng yào duō shuō.", "a": "Dalam pola bertingkat, 更 diletakkan sebelum 要."}], "latihan": [{"k": "17-3.0", "t": "pg", "q": "我还没想好学什么，___没想好去哪个国家。", "o": ["更", "最", "很", "都"], "a": 0, "x": "Tingkat lebih jauh: ……，更…….", "f": "我还没想好学什么，更没想好去哪个国家。", "fp": "Wǒ hái méi xiǎng hào xué shénme, gèng méi xiǎng hǎo qù nǎge guójiā."}, {"k": "17-3.1", "t": "pg", "q": "想提高中文水平要多听多看，___多说多练。", "o": ["更要", "要更", "更多要", "要多更"], "a": 0, "x": "更 sebelum kata kerja bantu 要.", "f": "想提高中文水平要多听多看，更要多说多练。", "fp": "Xiǎng tígāo Zhōngwén shuǐpíng yào duō tīng duō kàn, gèng yào duō shuō duō liàn."}, {"k": "17-3.2", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["他不会说中文，更不会写汉字。", "他不会说中文，不更会写汉字。", "他不会说中文，更他不会写汉字。", "他更不会说中文，写汉字。"], "a": 0, "x": "更 + 不 + KK."}, {"k": "17-3.3", "t": "pg", "q": "\"Aku belum pernah ke Beijing, apalagi ke Shanghai\" =", "o": ["我没去过北京，更没去过上海。", "我没去过北京，没更去过上海。", "我没去过北京，更去过上海。", "我更没去过北京，没去过上海。"], "a": 0, "x": "Apalagi tidak = 更没."}, {"k": "17-3.4", "t": "pg", "q": "找工作需要别人的帮助，___自己的努力。", "o": ["更需要", "需要更", "最需要了", "更需要的"], "a": 0, "x": "更 + 需要 + objek.", "f": "找工作需要别人的帮助，更需要自己的努力。", "fp": "Zhǎo gōngzuò xūyào biérén de bāngzhù, gèng xūyào zìjǐ de nǔlì."}, {"k": "17-3.5", "t": "pg", "q": "Kalimat mana yang memakai 更 sebagai pola bertingkat (bukan perbandingan)?", "o": ["我学会了中文，更了解了中国文化。", "他比我更高。", "我更喜欢北京。", "今天比昨天更冷。"], "a": 0, "x": "Dua anak kalimat, yang kedua lebih dalam."}, {"k": "17-3.6", "t": "su", "w": ["他", "不会", "说", "中文，", "更", "不会", "写", "汉字"], "s": "他不会说中文，更不会写汉字。", "alt": [], "p": "Tā bú huì shuō Zhōngwén, gèng bú huì xiě Hànzì.", "x": "Dia tidak bisa bicara Mandarin, apalagi menulis hanzi."}, {"k": "17-3.7", "t": "su", "w": ["我", "没", "去过", "北京，", "更", "没", "去过", "上海"], "s": "我没去过北京，更没去过上海。", "alt": [], "p": "Wǒ méi qù guò Běijīng, gèng méi qù guò Shànghǎi.", "x": "Aku belum pernah ke Beijing, apalagi Shanghai."}, {"k": "17-3.8", "t": "su", "w": ["要", "多听多看，", "更", "要", "多说多练"], "s": "要多听多看，更要多说多练。", "alt": [], "p": "Yào duō tīng duō kàn, gèng yào duō shuō duō liàn.", "x": "Harus banyak mendengar dan membaca, terlebih lagi banyak bicara dan berlatih."}, {"k": "17-3.9", "t": "su", "w": ["我", "学会", "了", "中文，", "更", "了解", "了", "中国", "文化"], "s": "我学会了中文，更了解了中国文化。", "alt": [], "p": "Wǒ xué huì le Zhōngwén, gèng liǎojiě le Zhōngguó wénhuà.", "x": "Aku bisa bahasa Mandarin, terlebih lagi lebih memahami budaya Tiongkok."}, {"k": "17-3.10", "t": "su", "w": ["需要", "别人", "的", "帮助，", "更", "需要", "自己", "的", "努力"], "s": "需要别人的帮助，更需要自己的努力。", "alt": [], "p": "Xūyào biérén de bāngzhù, gèng xūyào zìjǐ de nǔlì.", "x": "Butuh bantuan orang lain, terlebih lagi butuh usaha sendiri."}, {"k": "17-3.11", "t": "bs", "s": "我还没想好学什么，更没想好去哪个国家。", "sp": "Wǒ hái méi xiǎng hào xué shénme, gèng méi xiǎng hǎo qù nǎge guójiā.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "17-3.12", "t": "bs", "s": "他不喜欢运动，不更喜欢跑步。", "sp": "Tā bù xǐhuan yùndòng, bú gèng xǐhuan pǎobù.", "n": "", "ok": false, "b": "他不喜欢运动，更不喜欢跑步。", "bp": "Tā bù xǐhuan yùndòng, gèng bù xǐhuan pǎobù.", "x": "更 sebelum 不."}, {"k": "17-3.13", "t": "bs", "s": "要想身体健康，应该多运动，更应该早睡早起。", "sp": "Yào xiǎng shēntǐ jiànkāng, yīnggāi duō yùndòng, gèng yīnggāi zǎo shuì zǎo qǐ.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "17-3.14", "t": "bs", "s": "我学会了中文，更我了解了中国文化。", "sp": "Wǒ xué huì le Zhōngwén, gèng wǒ liǎojiě le Zhōngguó wénhuà.", "n": "", "ok": false, "b": "我学会了中文，更了解了中国文化。", "bp": "Wǒ xué huì le Zhōngwén, gèng liǎojiě le Zhōngguó wénhuà.", "x": "更 tidak di depan subjek."}, {"k": "17-3.15", "t": "bs", "s": "明天有比赛，今天要好好儿练习，更要早点儿休息。", "sp": "Míngtiān yǒu bǐsài, jīntiān yào hǎo hǎor liànxí, gèng yào zǎo diǎnr xiūxi.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "17-4", "pel": 17, "judul": "Kalimat syarat: 只有……，才…… (hanya jika …, barulah …)", "kode": "条件复句\"只有……，才……\"", "rumus": ["只有 + syarat，(S) + 才 + (能/会) + hasil", "S + 只有 + syarat，才 + 能/会 + hasil"], "jelas": ["Pola 只有……，才…… menyatakan SYARAT SATU-SATUNYA: hasil di bagian 才 hanya bisa terjadi kalau syarat setelah 只有 terpenuhi; tanpa syarat itu, hasilnya tidak akan terjadi. 只有每天锻炼身体，才会越来越健康 = hanya dengan berolahraga setiap hari, barulah tubuh makin sehat.", "才 adalah kata keterangan: diletakkan setelah subjek anak kalimat kedua dan sebelum kata kerja. Sangat sering diikuti 能 atau 会: 才能, 才会. 只有多听、多说、多看，你的中文水平才能提高 — subjek kedua (你的中文水平) di depan 才.", "只有 biasanya di awal kalimat. Pasangannya HARUS 才, bukan 就. Ini kesalahan yang sangat umum.", "Bandingkan dengan 只要……，就…… (pelajaran 18): 只要 = \"asalkan\" (syarat yang cukup, cukup itu saja sudah bisa); 只有 = \"hanya jika\" (syarat yang wajib, tidak ada jalan lain). 只要努力，就能学好 (asal berusaha, pasti bisa) vs 只有努力，才能学好 (hanya kalau berusaha, barulah bisa — tanpa usaha tidak bisa).", "Bahasa Indonesia: \"Hanya jika …, barulah …\" atau \"Harus … dulu, baru bisa …\". Pelajar Indonesia sering lupa 才 atau menaruhnya sebelum subjek (*才你能…). Ingat: subjek + 才 + 能/会 + kata kerja."], "poin": ["只有 = hanya jika (syarat wajib satu-satunya).", "Pasangannya selalu 才 (sering 才能/才会).", "才 setelah subjek kedua, sebelum KK.", "Beda dengan 只要……就…… (asalkan)."], "contoh": [{"zh": "只有想清楚自己真正喜欢什么，才能做出最合适的选择。", "py": "Zhǐyǒu xiǎng qīngchu zìjǐ zhēnzhèng xǐhuan shénme, cái néng zuò chū zuì héshì de xuǎnzé.", "id": "Hanya jika sudah memikirkan dengan jelas apa yang benar-benar kamu sukai, barulah kamu bisa membuat pilihan yang paling tepat.", "b": true, "tr": "17-7"}, {"zh": "只有每天锻炼身体，才会越来越健康。", "py": "Zhǐyǒu měi tiān duànliàn shēntǐ, cái huì yuè lái yuè jiànkāng.", "id": "Hanya dengan berolahraga setiap hari, barulah tubuh akan makin sehat.", "b": true, "tr": null}, {"zh": "只有多听、多说、多看，你的中文水平才能提高。", "py": "Zhǐyǒu duō tīng, duō shuō, duō kàn, nǐ de Zhōngwén shuǐpíng cái néng tígāo.", "id": "Hanya dengan banyak mendengar, berbicara, dan membaca, barulah kemampuan bahasa Mandarinmu bisa meningkat.", "b": true, "tr": null}, {"zh": "只有每天练习，才能打好篮球。", "py": "Zhǐyǒu měi tiān liànxí, cái néng dǎ hǎo lánqiú.", "id": "Hanya dengan berlatih setiap hari, barulah bisa bermain basket dengan baik.", "b": false, "tr": null}, {"zh": "只有努力学习，才能通过考试。", "py": "Zhǐyǒu nǔlì xuéxí, cái néng tōng guò kǎoshì.", "id": "Hanya dengan belajar keras, barulah bisa lulus ujian.", "b": false, "tr": null}, {"zh": "只有你去请他，他才会来。", "py": "Zhǐyǒu nǐ qù qǐng tā, tā cái huì lái.", "id": "Hanya kalau kamu yang mengundangnya, barulah dia mau datang.", "b": false, "tr": null}, {"zh": "只有在周末，我才有时间去看电影。", "py": "Zhǐyǒu zài zhōumò, wǒ cái yǒu shíjiān qù kàn diànyǐng.", "id": "Hanya pada akhir pekan, barulah aku punya waktu untuk nonton film.", "b": false, "tr": null}, {"zh": "只有多问老师，问题才能解决。", "py": "Zhǐyǒu duō wèn lǎoshī, wèntí cái néng jiějué.", "id": "Hanya dengan sering bertanya pada guru, barulah masalahnya bisa terpecahkan.", "b": false, "tr": null}, {"zh": "只有买了票，才能进去。", "py": "Zhǐyǒu mǎi le piào, cái néng jìnqù.", "id": "Hanya kalau sudah membeli tiket, barulah bisa masuk.", "b": false, "tr": null}, {"zh": "这种花只有在春天才开。", "py": "Zhè zhòng huā zhǐyǒu zài chūntiān cái kāi.", "id": "Bunga jenis ini hanya mekar pada musim semi.", "b": false, "tr": null}], "salah": [{"s": "只有每天练习，就能打好篮球。", "sp": "Zhǐyǒu měi tiān liànxí, jiù néng dǎ hǎo lánqiú.", "n": "", "b": "只有每天练习，才能打好篮球。", "bp": "Zhǐyǒu měi tiān liànxí, cái néng dǎ hǎo lánqiú.", "a": "只有 berpasangan dengan 才, bukan 就."}, {"s": "只有多说，才你能说得好。", "sp": "Zhǐyǒu duō shuō, cái nǐ néng shuō de hǎo.", "n": "", "b": "只有多说，你才能说得好。", "bp": "Zhǐyǒu duō shuō, nǐ cái néng shuō de hǎo.", "a": "才 setelah subjek 你."}, {"s": "只有努力，能成功。", "sp": "Zhǐyǒu nǔlì, néng chéng gōng.", "n": "", "b": "只有努力，才能成功。", "bp": "Zhǐyǒu nǔlì, cái néng chéng gōng.", "a": "Jangan lupa 才."}], "latihan": [{"k": "17-4.0", "t": "pg", "q": "只有每天锻炼身体，___会越来越健康。", "o": ["才", "就", "都", "也"], "a": 0, "x": "只有 berpasangan dengan 才.", "f": "只有每天锻炼身体，才会越来越健康。", "fp": "Zhǐyǒu měi tiān duànliàn shēntǐ, cái huì yuè lái yuè jiànkāng."}, {"k": "17-4.1", "t": "pg", "q": "___多听、多说、多看，你的中文水平才能提高。", "o": ["只有", "只要", "因为", "虽然"], "a": 0, "x": "Pasangan 才 adalah 只有.", "f": "只有多听、多说、多看，你的中文水平才能提高。", "fp": "Zhǐyǒu duō tīng, duō shuō, duō kàn, nǐ de Zhōngwén shuǐpíng cái néng tígāo."}, {"k": "17-4.2", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["只有你去请他，他才会来。", "只有你去请他，才他会来。", "只有你去请他，他就会来。", "只有你去请他，他会才来。"], "a": 0, "x": "S + 才 + 会 + KK."}, {"k": "17-4.3", "t": "pg", "q": "\"Hanya kalau sudah beli tiket, baru bisa masuk\" =", "o": ["只有买了票，才能进去。", "只要买了票，才能进去。", "只有买了票，就能进去。", "买了票只有，才能进去。"], "a": 0, "x": "只有……，才……."}, {"k": "17-4.4", "t": "pg", "q": "\"只有努力，才能学好\" artinya …", "o": ["Tanpa usaha, tidak bisa belajar dengan baik.", "Asal berusaha sedikit saja langsung bisa.", "Berusaha itu tidak penting.", "Hanya orang pintar yang bisa belajar."], "a": 0, "x": "只有 menyatakan syarat wajib."}, {"k": "17-4.5", "t": "pg", "q": "A：你每天都去球场练习吗？ B：对，___", "o": ["只有每天练习，才能打好球。", "只有每天练习，就能打好球。", "只每天练习，才打好球能。", "每天练习只有，才能打好球。"], "a": 0, "x": "只有……，才能……."}, {"k": "17-4.6", "t": "su", "w": ["只有", "每天", "锻炼，", "才", "会", "越来越", "健康"], "s": "只有每天锻炼，才会越来越健康。", "alt": [], "p": "Zhǐyǒu měi tiān duànliàn, cái huì yuè lái yuè jiànkāng.", "x": "Hanya dengan berolahraga tiap hari, barulah makin sehat."}, {"k": "17-4.7", "t": "su", "w": ["只有", "努力", "学习，", "才", "能", "通过", "考试"], "s": "只有努力学习，才能通过考试。", "alt": [], "p": "Zhǐyǒu nǔlì xuéxí, cái néng tōng guò kǎoshì.", "x": "Hanya dengan belajar keras, barulah bisa lulus ujian."}, {"k": "17-4.8", "t": "su", "w": ["只有", "买", "了", "票，", "才", "能", "进去"], "s": "只有买了票，才能进去。", "alt": [], "p": "Zhǐyǒu mǎi le piào, cái néng jìnqù.", "x": "Hanya kalau sudah beli tiket, barulah bisa masuk."}, {"k": "17-4.9", "t": "su", "w": ["只有", "你", "去", "请", "他，", "他", "才", "会", "来"], "s": "只有你去请他，他才会来。", "alt": [], "p": "Zhǐyǒu nǐ qù qǐng tā, tā cái huì lái.", "x": "Hanya kalau kamu yang mengundang, barulah dia datang."}, {"k": "17-4.10", "t": "su", "w": ["这", "种", "花", "只有", "在", "春天", "才", "开"], "s": "这种花只有在春天才开。", "alt": [], "p": "Zhè zhòng huā zhǐyǒu zài chūntiān cái kāi.", "x": "Bunga ini hanya mekar pada musim semi."}, {"k": "17-4.11", "t": "bs", "s": "只有多练习，才能说得好。", "sp": "Zhǐyǒu duō liànxí, cái néng shuō de hǎo.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "17-4.12", "t": "bs", "s": "只有你同意，我们就去。", "sp": "Zhǐyǒu nǐ tóngyì, wǒmen jiù qù.", "n": "", "ok": false, "b": "只有你同意，我们才去。", "bp": "Zhǐyǒu nǐ tóngyì, wǒmen cái qù.", "x": "只有 berpasangan dengan 才."}, {"k": "17-4.13", "t": "bs", "s": "只有在周末，我才有时间。", "sp": "Zhǐyǒu zài zhōumò, wǒ cái yǒu shíjiān.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "17-4.14", "t": "bs", "s": "只有多问老师，才问题能解决。", "sp": "Zhǐyǒu duō wèn lǎoshī, cái wèntí néng jiějué.", "n": "", "ok": false, "b": "只有多问老师，问题才能解决。", "bp": "Zhǐyǒu duō wèn lǎoshī, wèntí cái néng jiějué.", "x": "才 setelah subjek 问题."}, {"k": "17-4.15", "t": "bs", "s": "只有想清楚自己喜欢什么，才能做出合适的选择。", "sp": "Zhǐyǒu xiǎng qīngchu zìjǐ xǐhuan shénme, cái néng zuò chū héshì de xuǎnzé.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "18-1", "pel": 18, "judul": "Menyatakan bilangan perkiraan: dua angka berurutan (七八天, 三四年)", "kode": "概数表达法", "rumus": ["angka kecil + angka besar (berurutan) + KSat + KB", "一两 / 两三 / 三四 … 八九 + KSat", "十几 / 二三十 / 几十 (puluhan)"], "jelas": ["Dalam bahasa Mandarin, dua angka yang BERURUTAN dipakai bersama untuk menyatakan jumlah yang tidak pasti (perkiraan): 七八天 = tujuh atau delapan hari, 五六个学生 = lima atau enam siswa, 三四年前 = tiga atau empat tahun lalu.", "Aturannya: angka yang lebih kecil di depan, langsung diikuti angka yang lebih besar, lalu kata satuan: 两三个人, 三四天, 五六本书. Untuk \"satu atau dua\" pakai 一两 (一两天), dan untuk \"dua atau tiga\" pakai 两三 (两三个), bukan 二三个.", "Untuk puluhan: 二三十 (dua puluh sampai tiga puluh), 三四十个人 (tiga puluh sampai empat puluh orang); untuk belasan: 十一二岁 (sebelas atau dua belas tahun). Jangan menggabungkan 九 dan 十 (*九十 artinya sembilan puluh, bukan \"sembilan atau sepuluh\").", "Cara perkiraan lain yang sudah dipelajari: 大概 (kira-kira) di depan, 左右 (sekitar) di belakang jumlah (三十分钟左右), 几 (beberapa: 几天, 十几个), dan 多 (lebih: 二十多岁). 大概 boleh dipakai bersama angka berurutan: 春节大概放七八天假. Tetapi jangan memakai 左右 atau 多 bersama dua angka berurutan (*七八天左右 dianggap berlebihan).", "Bahasa Indonesia biasanya memakai \"dua tiga hari\", \"lima enam orang\" — mirip sekali! Jadi pelajar Indonesia mudah memahami polanya. Yang perlu diingat hanya: ada kata satuan setelah angka (五六个学生, bukan *五六学生) dan \"dua\" di depan memakai 两."], "poin": ["Dua angka berurutan = perkiraan: 七八天.", "Angka kecil di depan, lalu kata satuan.", "一两, 两三 (bukan 二三).", "Puluhan: 二三十; belasan: 十一二.", "Boleh + 大概, jangan + 左右/多."], "contoh": [{"zh": "春节大概放七八天假。", "py": "Chūnjié dàgài fàng qībā tiān jiǎ.", "id": "Imlek kira-kira libur tujuh delapan hari.", "b": true, "tr": null}, {"zh": "教室里来了五六个学生。", "py": "Jiàoshì lǐ lái le wǔliù gè xuéshēng.", "id": "Ke dalam kelas datang lima enam orang siswa.", "b": true, "tr": null}, {"zh": "这些照片是三四年前照的吧？", "py": "Zhèxiē zhàopiàn shì sānsì nián qián zhào de ba?", "id": "Foto-foto ini diambil tiga empat tahun lalu, ya?", "b": true, "tr": null}, {"zh": "我回家住三四天，然后出去旅游。", "py": "Wǒ huí jiā zhù sānsì tiān, ránhòu chūqù lǚyóu.", "id": "Aku pulang ke rumah tinggal tiga empat hari, lalu pergi jalan-jalan.", "b": true, "tr": null}, {"zh": "我每天都锻炼二三十分钟。", "py": "Wǒ měi tiān dōu duànliàn èrsānshí fēnzhōng.", "id": "Setiap hari aku berolahraga dua puluh sampai tiga puluh menit.", "b": true, "tr": null}, {"zh": "我一般晚上十一二点睡觉。", "py": "Wǒ yìbān wǎnshang shíyī'èr diǎn shuìjiào.", "id": "Biasanya aku tidur jam sebelas atau dua belas malam.", "b": false, "tr": null}, {"zh": "我每天学习一两个小时汉语。", "py": "Wǒ měi tiān xuéxí yìliǎng gè xiǎoshí Hànyǔ.", "id": "Setiap hari aku belajar bahasa Mandarin satu dua jam.", "b": false, "tr": null}, {"zh": "他看起来三十四五岁。", "py": "Tā kàn qǐlái sānshísìwǔ suì.", "id": "Dia kelihatannya berumur tiga puluh empat atau tiga puluh lima tahun.", "b": false, "tr": null}, {"zh": "我们国家新年一般放两三天假。", "py": "Wǒmen guójiā xīnnián yìbān fàng liǎngsān tiān jiǎ.", "id": "Di negara kami tahun baru biasanya libur dua tiga hari.", "b": false, "tr": null}, {"zh": "会议室里坐着三四十个人。", "py": "Huìyì shì lǐ zuò zhe sānsìshí gè rén.", "id": "Di ruang rapat duduk tiga puluh sampai empat puluh orang.", "b": false, "tr": null}], "salah": [{"s": "教室里来了五六学生。", "sp": "Jiàoshì lǐ lái le wǔliù xuéshēng.", "n": "", "b": "教室里来了五六个学生。", "bp": "Jiàoshì lǐ lái le wǔliù gè xuéshēng.", "a": "Setelah angka perlu kata satuan (个)."}, {"s": "我等了他二三个小时。", "sp": "Wǒ děng le tā èrsān gè xiǎoshí.", "n": "", "b": "我等了他两三个小时。", "bp": "Wǒ děng le tā liǎngsān gè xiǎoshí.", "a": "\"Dua atau tiga\" + kata satuan memakai 两三."}, {"s": "春节放八七天假。", "sp": "Chūnjié fàng bāqī tiān jiǎ.", "n": "", "b": "春节放七八天假。", "bp": "Chūnjié fàng qībā tiān jiǎ.", "a": "Angka yang lebih kecil di depan."}, {"s": "我们走了七八公里左右。", "sp": "Wǒmen zǒu le qībā gōng lǐ zuǒyòu.", "n": "", "b": "我们走了七八公里。", "bp": "Wǒmen zǒu le qībā gōng lǐ.", "a": "Dua angka berurutan sudah berarti perkiraan; tidak perlu 左右."}], "latihan": [{"k": "18-1.0", "t": "pg", "q": "春节大概放___天假。", "o": ["七八", "八七", "七或八个", "七个八"], "a": 0, "x": "Angka kecil di depan: 七八天.", "f": "春节大概放七八天假。", "fp": "Chūnjié dàgài fàng qībā tiān jiǎ."}, {"k": "18-1.1", "t": "pg", "q": "教室里来了五六___学生。", "o": ["个", "位个", "本", "只"], "a": 0, "x": "Perlu kata satuan untuk orang: 个.", "f": "教室里来了五六个学生。", "fp": "Jiàoshì lǐ lái le wǔliù gè xuéshēng."}, {"k": "18-1.2", "t": "pg", "q": "\"dua tiga orang\" =", "o": ["两三个人", "二三个人", "三两个人", "二三人个"], "a": 0, "x": "\"Dua atau tiga\" memakai 两三."}, {"k": "18-1.3", "t": "pg", "q": "Mana yang BUKAN ungkapan perkiraan \"sembilan atau sepuluh\"?", "o": ["九十个", "九个或者十个", "大概十个", "十个左右"], "a": 0, "x": "九十 = sembilan puluh, bukan perkiraan."}, {"k": "18-1.4", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["我每天学习一两个小时。", "我每天学习两一个小时。", "我每天学习一二个小时左右。", "我每天学习一两小时个。"], "a": 0, "x": "一两 + kata satuan."}, {"k": "18-1.5", "t": "pg", "q": "\"dua puluh sampai tiga puluh menit\" =", "o": ["二三十分钟", "两三十分钟", "二十三分钟", "三二十分钟"], "a": 0, "x": "Puluhan berurutan: 二三十."}, {"k": "18-1.6", "t": "pg", "q": "A：你一般晚上几点睡觉？ B：___", "o": ["十一二点。", "十二一点。", "十一十二点左右了。", "十一两点。"], "a": 0, "x": "Belasan: 十一二点."}, {"k": "18-1.7", "t": "su", "w": ["春节", "大概", "放", "七八", "天", "假"], "s": "春节大概放七八天假。", "alt": [], "p": "Chūnjié dàgài fàng qībā tiān jiǎ.", "x": "Imlek kira-kira libur tujuh delapan hari."}, {"k": "18-1.8", "t": "su", "w": ["教室", "里", "来", "了", "五六", "个", "学生"], "s": "教室里来了五六个学生。", "alt": [], "p": "Jiàoshì lǐ lái le wǔliù gè xuéshēng.", "x": "Ke kelas datang lima enam siswa."}, {"k": "18-1.9", "t": "su", "w": ["这些", "照片", "是", "三四", "年", "前", "照", "的"], "s": "这些照片是三四年前照的。", "alt": [], "p": "Zhèxiē zhàopiàn shì sānsì nián qián zhào de.", "x": "Foto-foto ini diambil tiga empat tahun lalu."}, {"k": "18-1.10", "t": "su", "w": ["我", "每天", "锻炼", "二三十", "分钟"], "s": "我每天锻炼二三十分钟。", "alt": [], "p": "Wǒ měi tiān duànliàn èrsānshí fēnzhōng.", "x": "Setiap hari aku berolahraga dua puluh sampai tiga puluh menit."}, {"k": "18-1.11", "t": "su", "w": ["我", "回家", "住", "三四", "天"], "s": "我回家住三四天。", "alt": [], "p": "Wǒ huí jiā zhù sānsì tiān.", "x": "Aku pulang tinggal tiga empat hari."}, {"k": "18-1.12", "t": "bs", "s": "我每天学习一两个小时汉语。", "sp": "Wǒ měi tiān xuéxí yìliǎng gè xiǎoshí Hànyǔ.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "18-1.13", "t": "bs", "s": "我们等了二三个小时。", "sp": "Wǒmen děng le èrsān gè xiǎoshí.", "n": "", "ok": false, "b": "我们等了两三个小时。", "bp": "Wǒmen děng le liǎngsān gè xiǎoshí.", "x": "\"Dua atau tiga\" memakai 两三."}, {"k": "18-1.14", "t": "bs", "s": "会议室里坐着三四十个人。", "sp": "Huìyì shì lǐ zuò zhe sānsìshí gè rén.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "18-1.15", "t": "bs", "s": "他买了四三本书。", "sp": "Tā mǎi le sìsān běn shū.", "n": "", "ok": false, "b": "他买了三四本书。", "bp": "Tā mǎi le sānsì běn shū.", "x": "Angka kecil di depan."}, {"k": "18-1.16", "t": "bs", "s": "教室里有五六学生。", "sp": "Jiàoshì lǐ yǒu wǔliù xuéshēng.", "n": "", "ok": false, "b": "教室里有五六个学生。", "bp": "Jiàoshì lǐ yǒu wǔliù gè xuéshēng.", "x": "Perlu kata satuan 个."}]}, {"id": "18-2", "pel": 18, "judul": "Perbedaan 刚才 dan 刚刚", "kode": "\"刚才\"和\"刚刚\"", "rumus": ["刚才 + S + KK / S + 刚才 + KK (beberapa menit lalu)", "S + 刚刚 + KK (+ lama waktu) (baru saja)", "刚才的 + KB"], "jelas": ["刚才 adalah KATA BENDA WAKTU yang berarti \"tadi\", yaitu waktu yang sangat dekat dengan sekarang, biasanya beberapa menit yang lalu. Karena kata benda waktu, 刚才 boleh di AWAL kalimat atau setelah subjek: 刚才我看过一遍 / 我刚才看过一遍. 刚才 juga bisa menjadi penjelas kata benda dengan 的: 刚才的电话 (telepon tadi).", "刚刚 adalah KATA KETERANGAN yang berarti \"baru saja\", menurut perasaan pembicara. Waktunya bisa beberapa menit, beberapa hari, bahkan beberapa bulan: 他刚刚来北京两个月 (dia baru dua bulan datang ke Beijing). Karena kata keterangan, 刚刚 HARUS setelah subjek dan sebelum kata kerja; tidak boleh di awal kalimat dan tidak bisa + 的 + kata benda.", "Perbedaan penting: (1) 刚才 hanya untuk beberapa menit lalu; 刚刚 bisa untuk waktu yang lebih panjang. (2) 刚刚 bisa diikuti lama waktu di belakang (刚刚来两个月); 刚才 tidak. (3) 刚才 bisa diikuti bentuk ingkar (我刚才没听清楚); 刚刚 jarang. (4) 刚才的 + KB boleh; *刚刚的 + KB tidak wajar.", "Dalam banyak kalimat yang terjadi beberapa menit lalu, keduanya bisa dipakai: 我刚刚吃完饭 / 我刚才吃完饭 (artinya sedikit berbeda: \"baru saja selesai makan\" vs \"tadi selesai makan\"). 刚刚 bisa dipendekkan menjadi 刚.", "Bagi pelajar Indonesia: 刚才 ≈ \"tadi\", 刚刚 ≈ \"baru saja / baru\". \"Tadi\" bisa di awal kalimat dalam bahasa Indonesia, begitu juga 刚才. \"Baru saja\" selalu menempel pada kata kerja, begitu juga 刚刚."], "poin": ["刚才 = tadi (KB waktu), beberapa menit lalu.", "刚刚 = baru saja (KKet), bisa menit, hari, bulan.", "刚才 boleh di awal kalimat dan + 的 + KB.", "刚刚 setelah subjek; boleh + lama waktu di belakang."], "contoh": [{"zh": "刚才的电话是我妈妈打来的。", "py": "Gāngcái de diànhuà shì wǒ māma dǎ lái de.", "id": "Telepon tadi dari ibuku.", "b": true, "tr": null}, {"zh": "我刚才看过一遍，不想再看了。", "py": "Wǒ gāngcái kàn guò yí biàn, bù xiǎng zài kàn le.", "id": "Tadi aku sudah melihatnya sekali, tidak mau lihat lagi.", "b": true, "tr": null}, {"zh": "我刚刚看视频学会了包饺子。", "py": "Wǒ gānggāng kàn shìpín xué huì le bāo jiǎozi.", "id": "Aku baru saja belajar membuat pangsit dari video.", "b": true, "tr": "18-3"}, {"zh": "他刚刚来北京两个月。", "py": "Tā gānggāng lái Běijīng liǎng gè yuè.", "id": "Dia baru dua bulan datang ke Beijing.", "b": true, "tr": null}, {"zh": "马上就要过春节了，我刚刚买好车票，要和家人一起过。", "py": "Mǎshàng jiù yào guò chūnjié le, wǒ gānggāng mǎi hǎo chē piào, yào hé jiārén yìqǐ guò.", "id": "Imlek sudah dekat, aku baru saja membeli tiket kereta, mau merayakannya bersama keluarga.", "b": false, "tr": null}, {"zh": "刚才你说什么？我没听清楚。", "py": "Gāngcái nǐ shuō shénme? Wǒ méi tīng qīngchu.", "id": "Tadi kamu bilang apa? Aku tidak mendengar dengan jelas.", "b": false, "tr": null}, {"zh": "我刚才没看见他。", "py": "Wǒ gāngcái méi kànjiàn tā.", "id": "Tadi aku tidak melihat dia.", "b": false, "tr": null}, {"zh": "它们刚才已经吃了半天了，应该吃饱了吧？", "py": "Tāmen gāngcái yǐjīng chī le bàntiān le, yīnggāi chī bǎo le ba?", "id": "Tadi mereka sudah makan lama sekali, seharusnya sudah kenyang kan?", "b": true, "tr": null}, {"zh": "我们刚刚认识一个星期。", "py": "Wǒmen gānggāng rènshi yí gè xīngqī.", "id": "Kami baru kenal satu minggu.", "b": false, "tr": null}, {"zh": "请你把刚才的话再说一遍。", "py": "Qǐng nǐ bǎ gāngcái dehuà zài shuō yí biàn.", "id": "Tolong ulangi lagi kata-katamu tadi.", "b": false, "tr": null}], "salah": [{"s": "刚刚我吃了饭。", "sp": "Gānggāng wǒ chī le fàn.", "n": "", "b": "我刚刚吃了饭。", "bp": "Wǒ gānggāng chī le fàn.", "a": "刚刚 adalah kata keterangan, tidak boleh di awal kalimat."}, {"s": "刚刚的电话是谁打来的？", "sp": "Gānggāng de diànhuà shì shéi dǎ lái de?", "n": "", "b": "刚才的电话是谁打来的？", "bp": "Gāngcái de diànhuà shì shéi dǎ lái de?", "a": "Hany aru dua bulan datang ke Beijing."}, {"k": "18-2.9", "t": "su", "w": ["我", "刚才", "没", "看见", "他"], "s": "我刚才没看见他。", "alt": [], "p": "Wǒ gāngcái méi kànjiàn tā.", "x": "Tadi aku tidak melihat dia."}, {"k": "18-2.10", "t": "su", "w": ["我们", "刚刚", "认识", "一", "个", "星期"], "s": "我们刚刚认识一个星期。", "alt": [], "p": "Wǒmen gānggāng rènshi yí gè xīngqī.", "x": "Kami baru kenal satu minggu."}, {"k": "18-2.11", "t": "su", "w": ["请", "你", "把", "刚才", "的", "话", "再", "说", "一遍"], "s": "请你把刚才的话再说一遍。", "alt": [], "p": "Qǐng nǐ bǎ gāngcái dehuà zài shuō yí biàn.", "x": "Tolong ulangi kata-katamu tadi."}, {"k": "18-2.12", "t": "bs", "s": "刚才的电影很有意思。", "sp": "Gāngcái de diànyǐng hěn yǒuyìsi.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "18-2.13", "t": "bs", "s": "刚刚我到家。", "sp": "Gānggāng wǒ dào jiā.", "n": "", "ok": false, "b": "我刚刚到家。", "bp": "Wǒ gānggāng dào jiā.", "x": "刚刚 setelah subjek."}, {"k": "18-2.14", "t": "bs", "s": "我刚刚学会包饺子。", "sp": "Wǒ gānggāng xué huì bāo jiǎozi.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "18-2.15", "t": "bs", "s": "她刚才来中国半年。", "sp": "Tā gāngcái lái Zhōngguó bàn nián.", "n": "", "ok": false, "b": "她刚刚来中国半年。", "bp": "Tā gānggāng lái Zhōngguó bàn nián.", "x": "Waktu panjang + lama waktu → 刚刚."}, {"k": "18-2.16", "t": "bs", "s": "我刚才没听清楚。", "sp": "Wǒ gāngcái méi tīng qīngchu.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "18-3", "pel": 18, "judul": "Kalimat syarat: 只要……，就…… (asalkan …, maka …)", "kode": "条件复句\"只要……，就……\"", "rumus": ["只要 + syarat，(S) + 就 + hasil", "S + 只要 + syarat，就 + hasil", "只要 + S1 + syarat，S2 + 就 + hasil"], "jelas": ["Pola 只要……，就…… menyatakan SYARAT YANG CUKUP: asalkan syarat setelah 只要 terpenuhi, hasil setelah 就 pasti terjadi. 只要你同意，我们就这么决定了 = asalkan kamu setuju, kita putuskan begini saja.", "Subjek boleh diletakkan sebelum atau sesudah 只要: 我只要几天不跟他视频，就很想他 / 只要你坚持……. Kalau kedua anak kalimat punya subjek yang berbeda, subjek kedua harus diletakkan SEBELUM 就: 只要你坚持每天早睡，身体就一定会好起来.", "就 adalah kata keterangan: setelah subjek, sebelum kata kerja (sering 就能, 就会, 就可以). Pasangan 只要 adalah 就, bukan 才.", "Bandingkan dengan 只有……，才……: 只要 = \"asalkan\" (syarat cukup; mudah, cukup itu saja); 只有 = \"hanya jika\" (syarat wajib; tanpa itu tidak bisa). 只要有时间，我就去 (asal ada waktu, aku pergi) vs 只有周末，我才有时间 (hanya akhir pekan aku punya waktu).", "Bahasa Indonesia: \"Asalkan …, (pasti) …\" atau \"Selama …, …\". Kesalahan khas: memasangkan 只要 dengan 才, atau menaruh 就 sebelum subjek (*就身体会好)."], "poin": ["只要 = asalkan (syarat cukup).", "Pasangannya 就 (sering 就能/就会).", "Subjek kedua harus sebelum 就.", "Beda dengan 只有……才…… (hanya jika)."], "contoh": [{"zh": "我只要几天不跟他视频，就很想他。", "py": "Wǒ zhǐyào jǐ tiān bù gēn tā shìpín, jiù hěn xiǎng tā.", "id": "Asal beberapa hari saja tidak video call dengannya, aku langsung sangat merindukannya.", "b": true, "tr": null}, {"zh": "只要你同意，我们就这么决定了。", "py": "Zhǐyào nǐ tóngyì, wǒmen jiù zhème juédìng le.", "id": "Asalkan kamu setuju, kita putuskan begini saja.", "b": true, "tr": null}, {"zh": "只要你坚持每天早睡，身体就一定会好起来。", "py": "Zhǐyào nǐ jiānchí měi tiān zǎo shuì, shēntǐ jiù yídìng huì hǎo qǐlái.", "id": "Asalkan kamu terus tidur lebih awal setiap hari, tubuhmu pasti akan membaik.", "b": true, "tr": null}, {"zh": "只要有时间，我就去爬山。", "py": "Zhǐyào yǒu shíjiān, wǒ jiù qù pá shān.", "id": "Asalkan ada waktu, aku pergi mendaki gunung.", "b": false, "tr": null}, {"zh": "只要多练习，你就能说好中文。", "py": "Zhǐyào duō liànxí, nǐ jiù néng shuō hǎo Zhōngwén.", "id": "Asalkan banyak berlatih, kamu pasti bisa berbicara bahasa Mandarin dengan baik.", "b": false, "tr": null}, {"zh": "只要努力学习，就能找到好工作。", "py": "Zhǐyào nǔlì xuéxí, jiù néng zhǎo dào hǎo gōngzuò.", "id": "Asalkan belajar dengan giat, pasti bisa mendapat pekerjaan yang bagus.", "b": false, "tr": null}, {"zh": "只要明天不下雨，我们就去公园。", "py": "Zhǐyào míngtiān bú xià yǔ, wǒmen jiù qù gōngyuán.", "id": "Asalkan besok tidak hujan, kita pergi ke taman.", "b": false, "tr": null}, {"zh": "别难过，你只要想家，就跟我视频。", "py": "Bié nánguò, nǐ zhǐyào xiǎng jiā, jiù gēn wǒ shìpín.", "id": "Jangan sedih, kapan pun kamu rindu rumah, video call saja denganku.", "b": false, "tr": null}, {"zh": "只要你喜欢，我就送给你。", "py": "Zhǐyào nǐ xǐhuan, wǒ jiù sòng gěi nǐ.", "id": "Asalkan kamu suka, kuberikan padamu.", "b": false, "tr": null}, {"zh": "他只要一看书，就想睡觉。", "py": "Tā zhǐyào yí kàn shū, jiù xiǎng shuìjiào.", "id": "Asal dia mulai membaca buku, langsung ingin tidur.", "b": false, "tr": null}], "salah": [{"s": "只要多练习，才能说好中文。", "sp": "Zhǐyào duō liànxí, cái néng shuō hǎo Zhōngwén.", "n": "", "b": "只要多练习，就能说好中文。", "bp": "Zhǐyào duō liànxí, jiù néng shuō hǎo Zhōngwén.", "a": "只要 berpasangan dengan 就."}, {"s": "只要你坚持，就身体会好起来。", "sp": "Zhǐyào nǐ jiānchí, jiù shēntǐ huì hǎo qǐlái.", "n": "", "b": "只要你坚持，身体就会好起来。", "bp": "Zhǐyào nǐ jiānchí, shēntǐ jiù huì hǎo qǐlái.", "a": "Subjek kedua (身体) harus sebelum 就."}, {"s": "只要有时间，我去就爬山。", "sp": "Zhǐyào yǒu shíjiān, wǒ qù jiù pá shān.", "n": "", "b": "只要有时间，我就去爬山。", "bp": "Zhǐyào yǒu shíjiān, wǒ jiù qù pá shān.", "a": "就 sebelum kata kerja."}], "latihan": [{"k": "18-3.0", "t": "pg", "q": "只要你同意，我们___这么决定了。", "o": ["就", "才", "都", "再"], "a": 0, "x": "只要 berpasangan dengan 就.", "f": "只要你同意，我们就这么决定了。", "fp": "Zhǐyào nǐ tóngyì, wǒmen jiù zhème juédìng le."}, {"k": "18-3.1", "t": "pg", "q": "___多练习，你就能说好中文。", "o": ["只要", "只有", "虽然", "因为"], "a": 0, "x": "Pasangan 就 adalah 只要.", "f": "只要多练习，你就能说好中文。", "fp": "Zhǐyào duō liànxí, nǐ jiù néng shuō hǎo Zhōngwén."}, {"k": "18-3.2", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["只要你坚持早睡，身体就会好起来。", "只要你坚持早睡，就身体会好起来。", "只要你坚持早睡，身体才会好起来。", "只要你坚持早睡，身体会就好起来。"], "a": 0, "x": "Subjek kedua + 就 + KK."}, {"k": "18-3.3", "t": "pg", "q": "\"Asalkan besok tidak hujan, kita ke taman\" =", "o": ["只要明天不下雨，我们就去公园。", "只有明天不下雨，我们就去公园。", "只要明天不下雨，就我们去公园。", "明天只要不下雨，我们才去公园。"], "a": 0, "x": "只要……，S + 就……."}, {"k": "18-3.4", "t": "pg", "q": "Pilih yang tepat: ___周末，我___有时间。(hanya akhir pekan)", "o": ["只有 / 才", "只要 / 就", "只要 / 才", "只有 / 就"], "a": 0, "x": "Syarat wajib satu-satunya → 只有……才……."}, {"k": "18-3.5", "t": "pg", "q": "Pilih yang tepat: ___有时间，我___去看你。(asal ada waktu)", "o": ["只要 / 就", "只有 / 就", "只要 / 才", "因为 / 才"], "a": 0, "x": "Syarat cukup → 只要……就……."}, {"k": "18-3.6", "t": "pg", "q": "A：你对大家都这么好吗？ B：是啊，___", "o": ["只要是我的朋友，我就会帮助他。", "只要是我的朋友，就我会帮助他。", "只有是我的朋友，我就会帮助他。", "只要是我的朋友，我才会帮助他。"], "a": 0, "x": "只要……，S + 就……."}, {"k": "18-3.7", "t": "su", "w": ["只要", "有", "时间，", "我", "就", "去", "爬山"], "s": "只要有时间，我就去爬山。", "alt": [], "p": "Zhǐyào yǒu shíjiān, wǒ jiù qù pá shān.", "x": "Asalkan ada waktu, aku pergi mendaki."}, {"k": "18-3.8", "t": "su", "w": ["只要你同意，", "我们", "就", "这么", "决定"], "s": "只要你同意，我们就这么决定。", "alt": [], "p": "Zhǐyào nǐ tóngyì, wǒmen jiù zhème juédìng.", "x": "Asalkan kamu setuju, kita putuskan begini."}, {"k": "18-3.9", "t": "su", "w": ["只要", "多", "练习，", "就", "能", "说", "好", "中文"], "s": "只要多练习，就能说好中文。", "alt": [], "p": "Zhǐyào duō liànxí, jiù néng shuō hǎo Zhōngwén.", "x": "Asalkan banyak berlatih, pasti bisa bicara Mandarin dengan baik."}, {"k": "18-3.10", "t": "su", "w": ["只要你喜欢，", "我", "就", "送给", "你"], "s": "只要你喜欢，我就送给你。", "alt": [], "p": "Zhǐyào nǐ xǐhuan, wǒ jiù sòng gěi nǐ.", "x": "Asalkan kamu suka, kuberikan padamu."}, {"k": "18-3.11", "t": "su", "w": ["只要", "努力，", "就", "能", "找到", "好", "工作"], "s": "只要努力，就能找到好工作。", "alt": [], "p": "Zhǐyào nǔlì, jiù néng zhǎo dào hǎo gōngzuò.", "x": "Asalkan berusaha, pasti dapat pekerjaan bagus."}, {"k": "18-3.12", "t": "bs", "s": "只要你喜欢，我就买给你。", "sp": "Zhǐyào nǐ xǐhuan, wǒ jiù mǎi gěi nǐ.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "18-3.13", "t": "bs", "s": "只要多锻炼，身体才会好。", "sp": "Zhǐyào duō duànliàn, shēntǐ cái huì hǎo.", "n": "", "ok": false, "b": "只要多锻炼，身体就会好。", "bp": "Zhǐyào duō duànliàn, shēntǐ jiù huì hǎo.", "x": "只要 berpasangan dengan 就."}, {"k": "18-3.14", "t": "bs", "s": "我只要几天不跟他视频，就很想他。", "sp": "Wǒ zhǐyào jǐ tiān bù gēn tā shìpín, jiù hěn xiǎng tā.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "18-3.15", "t": "bs", "s": "只要你来，就我们开始。", "sp": "Zhǐyào nǐ lái, jiù wǒmen kāishǐ.", "n": "", "ok": false, "b": "只要你来，我们就开始。", "bp": "Zhǐyào nǐ lái, wǒmen jiù kāishǐ.", "x": "Subjek kedua sebelum 就."}, {"k": "18-3.16", "t": "bs", "s": "只要明天不下雨，我们就去公园。", "sp": "Zhǐyào míngtiān bú xià yǔ, wǒmen jiù qù gōngyuán.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "18-4", "pel": 18, "judul": "Pola tetap 从……起 (sejak / mulai …)", "kode": "固定格式\"从……起\"", "rumus": ["从 + waktu/kejadian + 起，S + (就) + KK", "S + 从 + waktu + 起 + (就) + KK", "从 + 明天/下个月 + 起 (mulai … ke depan)"], "jelas": ["从……起 berarti sama dengan 从……开始: \"sejak …\" atau \"mulai …\". Biasanya menunjukkan titik awal WAKTU. 从那天起，我们就变成了好朋友 = sejak hari itu, kami menjadi sahabat.", "Di antara 从 dan 起 diisi kata waktu (那时, 那天, 明天, 下个月, 小时候) atau kejadian (搬到北京, 那次旅游, 认识她). Frasa ini biasanya di AWAL kalimat sebagai keterangan, atau setelah subjek: 他从那时起就努力学习.", "Untuk masa lampau, sering diikuti 就 …… 了 atau perubahan keadaan: 从那次旅游起，我对中国文化更有兴趣了. Untuk masa depan, artinya \"mulai …\": 从明天起，我每天都锻炼 (mulai besok, aku olahraga setiap hari).", "Jangan lupa 起 (atau 开始). *从那天，我们变成了好朋友 kurang lengkap. Jangan juga menaruh 起 di akhir kalimat: *从那天我们就变成了好朋友起.", "Bahasa Indonesia \"sejak … \" dan \"mulai …\" hanya memakai satu kata di depan. Bahasa Mandarin memakai bingkai dua bagian: 从 di depan, 起 di belakang kata waktu. Bedakan juga dengan 以后 (setelah): 从那天起 menekankan titik awal yang terus berlanjut sampai sekarang."], "poin": ["从……起 = sejak/mulai … (= 从……开始).", "Diisi kata waktu atau kejadian.", "Biasanya di awal kalimat, sering + 就.", "Untuk lampau (sejak) dan masa depan (mulai)."], "contoh": [{"zh": "他从那时起就努力学习。", "py": "Tā cóng nà shí qǐ jiù nǔlì xuéxí.", "id": "Sejak saat itu dia belajar dengan giat.", "b": true, "tr": null}, {"zh": "从那天起，我们就变成了好朋友。", "py": "Cóng nà tiān qǐ, wǒmen jiù biànchéng le hǎo péngyou.", "id": "Sejak hari itu, kami menjadi sahabat.", "b": true, "tr": null}, {"zh": "从那次旅游起，我对中国文化更有兴趣了。", "py": "Cóng nà cì lǚyóu qǐ, wǒ duì Zhōngguó wénhuà gèng yǒu xìngqù le.", "id": "Sejak perjalanan itu, aku makin tertarik pada budaya Tiongkok.", "b": true, "tr": null}, {"zh": "他想学医，从那时起就努力学习。", "py": "Tā xiǎng xué yī, cóng nà shí qǐ jiù nǔlì xuéxí.", "id": "Dia ingin belajar kedokteran, sejak saat itu dia belajar dengan giat.", "b": true, "tr": null}, {"zh": "从搬到北京起，我就开始学习中文了。", "py": "Cóng bān dào Běijīng qǐ, wǒ jiù kāishǐ xuéxí Zhōngwén le.", "id": "Sejak pindah ke Beijing, aku mulai belajar bahasa Mandarin.", "b": false, "tr": null}, {"zh": "从明天起，我每天都锻炼二三十分钟。", "py": "Cóng míngtiān qǐ, wǒ měi tiān dōu duànliàn èrsānshí fēnzhōng.", "id": "Mulai besok, aku berolahraga dua puluh sampai tiga puluh menit setiap hari.", "b": false, "tr": null}, {"zh": "从下个月起，我们公司九点上班。", "py": "Cóng xià gè yuè qǐ, wǒmen gōngsī jiǔ diǎn shàngbān.", "id": "Mulai bulan depan, perusahaan kami masuk kerja jam sembilan.", "b": false, "tr": null}, {"zh": "从小时候起，她就喜欢画画。", "py": "Cóngxiǎo shíhou qǐ, tā jiù xǐhuan huà huà.", "id": "Sejak kecil, dia sudah suka melukis.", "b": false, "tr": null}, {"zh": "从认识她起，我就觉得她是个好人。", "py": "Cóng rènshi tā qǐ, wǒ jiù juéde tā shì gè hǎo rén.", "id": "Sejak mengenalnya, aku sudah merasa dia orang baik.", "b": false, "tr": null}, {"zh": "从今天起，我要学会照顾自己。", "py": "Cóng jīntiān qǐ, wǒ yào xué huì zhàogù zìjǐ.", "id": "Mulai hari ini, aku harus belajar mengurus diri sendiri.", "b": false, "tr": null}], "salah": [{"s": "从那天，我们就变成了好朋友。", "sp": "Cóng nà tiān, wǒmen jiù biànchéng le hǎo péngyou.", "n": "", "b": "从那天起，我们就变成了好朋友。", "bp": "Cóng nà tiān qǐ, wǒmen jiù biànchéng le hǎo péngyou.", "a": "Jangan lupa 起 setelah kata waktu."}, {"s": "从明天我起每天跑步。", "sp": "Cóng míngtiān wǒ qǐ měi tiān pǎobù.", "n": "", "b": "从明天起，我每天跑步。", "bp": "Cóng míngtiān qǐ, wǒ měi tiān pǎobù.", "a": "起 langsung setelah kata waktu."}, {"s": "起从明天，我要早睡。", "sp": "Qǐ cóng míngtiān, wǒ yào zǎo shuì.", "n": "", "b": "从明天起，我要早睡。", "bp": "Cóng míngtiān qǐ, wǒ yào zǎo shuì.", "a": "Urutannya 从 + waktu + 起."}], "la , "alt": ["今天从起，我要学会照顾自己。"], "p": "Cóng jīntiān qǐ, wǒ yào xué huì zhàogù zìjǐ.", "x": "Mulai hari ini aku harus belajar mengurus diri sendiri."}, {"k": "18-4.11", "t": "bs", "s": "从下个月起，我们九点上班。", "sp": "Cóng xià gè yuè qǐ, wǒmen jiǔ diǎn shàngbān.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "18-4.12", "t": "bs", "s": "从那天，我开始学中文了。", "sp": "Cóng nà tiān, wǒ kāishǐ xué Zhōngwén le.", "n": "", "ok": false, "b": "从那天起，我开始学中文了。", "bp": "Cóng nà tiān qǐ, wǒ kāishǐ xué Zhōngwén le.", "x": "Perlu 起."}, {"k": "18-4.13", "t": "bs", "s": "从那次旅游起，我对中国文化更有兴趣了。", "sp": "Cóng nà cì lǚyóu qǐ, wǒ duì Zhōngguó wénhuà gèng yǒu xìngqù le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "18-4.14", "t": "bs", "s": "起从明天，我要早点儿睡觉。", "sp": "Qǐ cóng míngtiān, wǒ yào zǎo diǎnr shuìjiào.", "n": "", "ok": false, "b": "从明天起，我要早点儿睡觉。", "bp": "Cóng míngtiān qǐ, wǒ yào zǎo diǎnr shuìjiào.", "x": "Urutan 从 + waktu + 起."}, {"k": "18-4.15", "t": "bs", "s": "从搬到北京起，我就开始学中文了。", "sp": "Cóng bān dào Běijīng qǐ, wǒ jiù kāishǐ xué Zhōngwén le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}], "rekaman": {"1": [{"id": "01-1", "j": "dialog", "awal": "这是杨同乐吗？他怎么跟白家月在一起？"}, {"id": "01-3", "j": "dialog", "awal": "我的行李怎么还没出来？是不是丢了？"}, {"id": "01-5", "j": "dialog", "awal": "飞机早就到了，你看见白家月他们了吗？"}, {"id": "01-7", "j": "dialog", "awal": "昨天我到北京了。"}], "2": [{"id": "02-1", "j": "dialog", "awal": "家月、李文，你们看看菜单，想吃点儿什么？"}, {"id": "02-3", "j": "dialog", "awal": "服务员，再给我们拿一双筷子、一个勺子和一个碗。"}, {"id": "02-5", "j": "dialog", "awal": "这个鸡肉饭太好吃了，我要再来吃一次。"}, {"id": "02-7", "j": "dialog", "awal": "这些年在国外，我很少自己做饭。"}], "3": [{"id": "03-1", "j": "dialog", "awal": "小雪的初中离家有点儿远，咱们换一个近点儿的房子吧。"}, {"id": "03-3", "j": "dialog", "awal": "我今天早上来的时候，灯还开着。"}, {"id": "03-5", "j": "dialog", "awal": "这个月花了不少钱。"}, {"id": "03-7", "j": "dialog", "awal": "我觉得这个星期就能搬家。我明天去买一些纸箱，很快就能准备好。搬家那天，我想请几位朋友来帮忙，最多一天就能搬完。"}], "4": [{"id": "04-1", "j": "dialog", "awal": "这个假期咱们去哪儿玩玩吧。"}, {"id": "04-3", "j": "dialog", "awal": "出去玩的机票买好了吗？"}, {"id": "04-5", "j": "dialog", "awal": "欢迎你们！我是你们的司机，我姓李，叫我小李就可以。"}, {"id": "04-7", "j": "dialog", "awal": "今天是我们旅游的第一天。"}], "5": [{"id": "05-1", "j": "dialog", "awal": "这个星期总是阴天，今天终于晴了。"}, {"id": "05-3", "j": "dialog", "awal": "这些照片是谁给您照的？张张都非常好看。"}, {"id": "05-5", "j": "dialog", "awal": "家月，这里挺漂亮的，咱们在这里拍照吧。"}, {"id": "05-7", "j": "dialog", "awal": "家月，我收到了你的那封邮件，也看到了你给我照的照片，张张都很漂亮。"}], "6": [{"id": "06-1", "j": "dialog", "awal": "家月，咱们该买去上海的票了。你打算怎么去上海？"}, {"id": "06-3", "j": "dialog", "awal": "过了前面的路口就到高铁站了。"}, {"id": "06-5", "j": "dialog", "awal": "李文，我的耳机没电了，你有充电宝吗？"}, {"id": "06-7", "j": "dialog", "awal": "这次放假，我去了北京，还去了上海。"}], "7": [{"id": "07-1", "j": "dialog", "awal": "这辆自行车是小雪八岁的时候买的，看起来有点儿旧了。"}, {"id": "07-3", "j": "dialog", "awal": "你看我穿这条黄色的短裤好看吗？"}, {"id": "07-5", "j": "dialog", "awal": "西瓜又大又新鲜，不甜不要钱！"}, {"id": "07-7", "j": "dialog", "awal": "这几天我们在新家坐着看电视的时候，又发现了新问题。"}], "8": [{"id": "08-1", "j": "dialog", "awal": "天中，最近常看见你来体育馆。"}, {"id": "08-3", "j": "dialog", "awal": "你怎么了？看上去有点儿不舒服。"}, {"id": "08-5", "j": "dialog", "awal": "你怎么突然住院了？大家都很担心你。"}, {"id": "08-7", "j": "dialog", "awal": "今天我出院了。"}], "9": [{"id": "09-1", "j": "dialog", "awal": "家月，对不起，我昨天忘了还你校园卡了。"}, {"id": "09-3", "j": "dialog", "awal": "家月，你跟我们一起打羽毛球吧？"}, {"id": "09-5", "j": "dialog", "awal": "足球比赛已经开始了，快过来看吧！"}, {"id": "09-7", "j": "dialog", "awal": "我喜欢看体育比赛，最爱看的就是奥运会。"}], "10": [{"id": "10-1", "j": "dialog", "awal": "你的数学越来越好，能不能介绍一下学习方法？"}, {"id": "10-3", "j": "dialog", "awal": "小雪，昨天的考试，你考得怎么样？"}, {"id": "10-5", "j": "dialog", "awal": "李老师，书上有几个问题，我们想问问您。"}, {"id": "10-7", "j": "dialog", "awal": "家月姐姐："}], "11": [{"id": "11-1", "j": "dialog", "awal": "会议下午几点开始？"}, {"id": "11-3", "j": "dialog", "awal": "电脑接好了吗？"}, {"id": "11-5", "j": "dialog", "awal": "同乐，你看见老张了吗？"}, {"id": "11-7", "j": "dialog", "awal": "前几天，上海的同事来北京了。"}], "12": [{"id": "12-1", "j": "dialog", "awal": "王老师，您看，这条街上的树都开花了。"}, {"id": "12-3", "j": "dialog", "awal": "刚才还是大晴天呢，怎么突然就刮起风来了？"}, {"id": "12-5", "j": "dialog", "awal": "您来这里已经一年多了，习惯了吧？"}, {"id": "12-7", "j": "dialog", "awal": "我离开北京到这里工作一年多了。"}], "13": [{"id": "13-1", "j": "dialog", "awal": "今天我请客，你们想吃什么就点什么！"}, {"id": "13-3", "j": "dialog", "awal": "第一次请新邻居来做客，总是担心有什么没准备好。"}, {"id": "13-5", "j": "dialog", "awal": "谢谢你们来参加我儿子的生日晚会，希望大家今晚玩得开心。"}, {"id": "13-7", "j": "dialog", "awal": "我的新邻居是来自英国的夫妻。"}], "14": [{"id": "14-1", "j": "dialog", "awal": "我借的这本词典最好今天还，但是我没时间去。"}, {"id": "14-3", "j": "dialog", "awal": "今天下课早，你一会儿做什么？"}, {"id": "14-5", "j": "dialog", "awal": "下周学校有晚会，你知道吗？"}, {"id": "14-7", "j": "dialog", "awal": "昨天是我们学校的新年晚会，每个班级的同学都表演节目了。"}], "15": [{"id": "15-1", "j": "dialog", "awal": "您搬到蓝天小区一段时间了，觉得怎么样？"}, {"id": "15-3", "j": "dialog", "awal": "假期我想去南京旅游，但是我不太了解那里。"}, {"id": "15-5", "j": "dialog", "awal": "小明，中国有一条大河，它的名字跟颜色有关系，你知道是什么河吗？"}, {"id": "15-7", "j": "dialog", "awal": "我小时候住在北京的西北边，有一条非常有名的河经过那里。"}], "16": [{"id": "16-1", "j": "dialog", "awal": "这只小猫你们养了多久了？"}, {"id": "16-3", "j": "dialog", "awal": "妈妈，大熊猫这个名字很奇怪，它们跟猫有什么关系？"}, {"id": "16-5", "j": "dialog", "awal": "这只大熊猫一会儿爬上去，一会儿跳下来，可爱极了！"}, {"id": "16-7", "j": "dialog", "awal": "今天我带小雪和小明去动物园玩了。"}], "17": [{"id": "17-1", "j": "dialog", "awal": "别再向前走了，李老师的办公室已经到了。"}, {"id": "17-3", "j": "dialog", "awal": "太阳从西边出来了？这几天怎么总是在图书馆看见你？"}, {"id": "17-5", "j": "dialog", "awal": "天中，你的手机怎么关机了？"}, {"id": "17-7", "j": "dialog", "awal": "大学生活马上就要结束了，我最近经常被问到一个问题——\"你以后想做什么\"，这个问题真不容易回答。"}], "18": [{"id": "18-1", "j": "dialog", "awal": "我要在中国过年，真开心。"}, {"id": "18-3", "j": "dialog", "awal": "张阿姨，李叔叔。过年好！这是我准备的礼物，请收下。"}, {"id": "18-5", "j": "dialog", "awal": "这张照片是李文出国前照的吗？"}, {"id": "18-7", "j": "dialog", "awal": "这次来中国，我最高兴的是认识了李文的父母。"}]}, "judul": {"1": "我们去机场接你们", "2": "你们想吃什么就点什么", "3": "这个小区挺好的", "4": "这家宾馆跟别的都不一样", "5": "这样的照片才好看", "6": "高铁上还可以点外卖", "7": "那条裙子比短裤更好看", "8": "今天我出院了", "9": "打不好没关系", "10": "你明天再把书还给我", "11": "看来我没办法解决这个问题", "12": "这个季节天气变化很快", "13": "我的新邻居来自英国", "14": "这本书被别人借走了", "15": "我是半个南京人", "16": "我听说有的熊猫出国了", "17": "我要多向认真的人学习", "18": "我学会了包饺子"}, "audio": {"1": "audio-hsk3-bagian1.html", "2": "audio-hsk3-bagian1.html", "3": "audio-hsk3-bagian1.html", "4": "audio-hsk3-bagian1.html", "5": "audio-hsk3-bagian1.html", "6": "audio-hsk3-bagian1.html", "7": "audio-hsk3-bagian1.html", "8": "audio-hsk3-bagian1.html", "9": "audio-hsk3-bagian1.html", "10": "audio-hsk3-bagian2.html", "11": "audio-hsk3-bagian2.html", "12": "audio-hsk3-bagian2.html", "13": "audio-hsk3-bagian2.html", "14": "audio-hsk3-bagian2.html", "15": "audio-hsk3-bagian2.html", "16": "audio-hsk3-bagian2.html", "17": "audio-hsk3-bagian2.html", "18": "audio-hsk3-bagian2.html"}, "level": 3, "buku": "新HSK教程 3 · HSK 3.0", "intro": "Semua grammar di bagian 小语讲堂 buku HSK 3 Anda (pelajaran 1–18), lengkap dengan contoh dari buku dan soal latihan.", "baca": {"pel": {"1": {"judul": "我们去机场接你们", "arti": "Kami akan menjemput kalian di bandara", "kata": [{"h": "以为", "p": "yǐwéi", "k": "动", "a": "mengira, menyangka"}, {"h": "像", "p": "xiàng", "k": "动", "a": "mirip, seperti"}, {"h": "长", "p": "zhǎng", "k": "动", "a": "tumbuh; (rupa) tampak"}, {"h": "身高", "p": "shēngāo", "k": "名", "a": "tinggi badan"}, {"h": "米", "p": "mǐ", "k": "量", "a": "meter"}, {"h": "瘦", "p": "shòu", "k": "形", "a": "kurus"}, {"h": "接", "p": "jiē", "k": "动", "a": "menjemput"}, {"h": "行李", "p": "xíngli", "k": "名", "a": "bagasi, barang bawaan"}, {"h": "丢", "p": "diū", "k": "动", "a": "hilang, kehilangan"}, {"h": "箱子", "p": "xiāngzi", "k": "名", "a": "koper, kotak"}, {"h": "号码", "p": "hàomǎ", "k": "名", "a": "nomor"}, {"h": "好像", "p": "hǎoxiàng", "k": "副", "a": "sepertinya"}, {"h": "重要", "p": "zhòngyào", "k": "形", "a": "penting"}, {"h": "着急", "p": "zháojí", "k": "形", "a": "cemas, gelisah"}, {"h": "护照", "p": "hùzhào", "k": "名", "a": "paspor"}, {"h": "服务台", "p": "fúwùtái", "k": "名", "a": "meja layanan"}, {"h": "应该", "p": "yīnggāi", "k": "能愿", "a": "seharusnya, semestinya"}, {"h": "站", "p": "zhàn", "k": "动", "a": "berdiri"}, {"h": "中间", "p": "zhōngjiān", "k": "名", "a": "tengah"}, {"h": "短", "p": "duǎn", "k": "形", "a": "pendek (ukuran panjang)"}, {"h": "头发", "p": "tóufa", "k": "名", "a": "rambut"}, {"h": "年轻", "p": "niánqīng", "k": "形", "a": "muda"}, {"h": "发现", "p": "fāxiàn", "k": "动", "a": "menemukan, mendapati"}, {"h": "不见", "p": "bújiàn", "k": "动", "a": "hilang, tidak ada"}, {"h": "带", "p": "dài", "k": "动", "a": "membawa, mengantar"}, {"h": "帮助", "p": "bāngzhù", "k": "动", "a": "membantu"}, {"h": "照片", "p": "zhàopiàn", "k": "名", "a": "foto"}], "dialog": [{"s": "刘明", "zh": "这是杨同乐吗？他怎么跟白家月在一起？", "id": "Ini Yang Tongle? Kenapa dia bersama Bai Jiayue?", "tr": "01-1", "py": "Zhè shì Yáng Tónglè ma? Tā zěnme gēn Bái Jiāyuè zài yìqǐ?"}, {"s": "王一雪", "zh": "他不是杨同乐，他叫李文，是白家月的好朋友。", "id": "Dia bukan Yang Tongle, namanya Li Wen, sahabat Bai Jiayue.", "tr": "01-1", "py": "Tā bú shì Yáng Tónglè, tā jiào Lǐ Wén, shì Bái Jiāyuè de hǎo péngyou."}, {"s": "刘明", "zh": "我还以为是同乐呢，他们看上去有点儿像。", "id": "Aku kira itu Tongle, mereka kelihatannya agak mirip.", "tr": "01-1", "py": "Wǒ hái yǐwéi shì Tónglè ne, tāmen kàn shàngqù yǒudiǎnr xiàng."}, {"s": "王一雪", "zh": "是长得有点儿像，但是他比同乐高，身高有一米八。", "id": "Memang wajahnya agak mirip, tetapi dia lebih tinggi daripada Tongle, tingginya 1,8 meter.", "tr": "01-1", "py": "Shì cháng de yǒudiǎnr xiàng, dànshì tā bǐ Tónglè gāo, shēngāo yǒu yì mǐ bā."}, {"s": "刘明", "zh": "看起来也比同乐瘦一点儿。", "id": "Kelihatannya juga sedikit lebih kurus daripada Tongle.", "tr": "01-1", "py": "Kàn qǐlái yě bǐ Tónglè shòu yìdiǎnr."}, {"s": "王一雪", "zh": "下个星期家月和李文要来北京，我去机场接他们。", "id": "Minggu depan Jiayue dan Li Wen akan datang ke Beijing, aku akan menjemput mereka di bandara.", "tr": "01-1", "py": "Xià gè xīngqī Jiāyuè hé Lǐ Wén yào lái Běijīng, wǒ qù jīchǎng jiē tāmen."}, {"s": "刘明", "zh": "他们哪天到北京？我跟你一起去机场接他们吧。", "id": "Hari apa mereka sampai di Beijing? Aku ikut kamu menjemput mereka di bandara, ya.", "tr": "01-1", "py": "Tāmen nǎ tiān dào Běijīng? Wǒ gēn nǐ yìqǐ qù jīchǎng jiē tāmen ba."}, {"s": "白家月", "zh": "我的行李怎么还没出来？是不是丢了？", "id": "Kenapa bagasiku belum keluar juga? Jangan-jangan hilang?", "tr": "01-3", "py": "Wǒ de xíngli zěnme hái méi chūlái? Shì bu shì diū le?"}, {"s": "李文", "zh": "你的行李箱是什么样的？", "id": "Kopermu seperti apa?", "tr": "01-3", "py": "Nǐ de xíngli xiāng shì shénme yàng de?"}, {"s": "白家月", "zh": "是一个黑色的箱子，上面写着我的名字和电话号码。", "id": "Koper hitam, di atasnya tertulis nama dan nomor teleponku.", "tr": "01-3", "py": "Shì yí gè hēisè de xiāngzi, shàngmiàn xiě zhe wǒ de míngzi hé diànhuà hàomǎ."}, {"s": "李文", "zh": "我好像在哪儿看到过这个箱子，是不是有人拿错了？", "id": "Sepertinya aku pernah melihat koper ini di suatu tempat, jangan-jangan ada orang yang salah ambil?", "tr": "01-3", "py": "Wǒ hǎoxiàng zài nǎr kàn dào guò zhège xiāngzi, shì bu shì yǒu rén ná cuò le?"}, {"s": "白家月", "zh": "我们快找谁问一下吧，箱子里有不少重要的东西。", "id": "Ayo cepat tanya seseorang, di dalam koper ada banyak barang penting.", "tr": "01-3", "py": "Wǒmen kuài zhǎo shéi wèn yíxià ba, xiāngzi lǐ yǒu bù shǎo zhòngyào de dōngxi."}, {"s": "李文", "zh": "别着急，我们拿着护照和机票，去服务台问问吧。", "id": "Jangan cemas, kita bawa paspor dan tiket pesawat, lalu bertanya ke meja layanan.", "tr": "01-3", "py": "Bié zháojí, wǒmen ná zhe hùzhào hé jīpiào, qù fúwùtái wèn wèn ba."}, {"s": "刘明", "zh": "飞机早就到了，你看见白家月他们了吗？", "id": "Pesawatnya sudah lama sampai, kamu sudah melihat Bai Jiayue dan temannya?", "tr": "01-5", "py": "Fēijī zǎo jiù dào le, nǐ kànjiàn Bái Jiāyuè tāmen le ma?"}, {"s": "王一雪", "zh": "没有，他们应该快出来了。", "id": "Belum, mereka seharusnya sebentar lagi keluar.", "tr": "01-5", "py": "Méiyǒu, tāmen yīnggāi kuài chūlái le."}, {"s": "刘明", "zh": "我们站到中间去吧，这样他们好找一些。", "id": "Ayo kita berdiri di tengah, supaya mereka lebih mudah menemukan kita.", "tr": "01-5", "py": "Wǒmen zhàn dào zhōngjiān qù ba, zhèyàng tāmen hǎo zhǎo yìxiē."}, {"s": "王一雪", "zh": "你看那个高个子的人是李文吗？", "id": "Coba lihat, orang yang tinggi itu Li Wen bukan?", "tr": "01-5", "py": "Nǐ kàn nàge gāo gèzi de rén shì Lǐ Wén ma?"}, {"s": "刘明", "zh": "你说的是哪个？那个穿着黑衣服的短头发的年轻人？", "id": "Yang mana maksudmu? Anak muda berambut pendek yang memakai baju hitam itu?", "tr": "01-5", "py": "Nǐ shuō de shì nǎge? Nàge chuān zhe hēi yīfu de duǎn tóufa de niánqīng rén?"}, {"s": "王一雪", "zh": "对，那个人就是李文！你看，家月在他后面呢。", "id": "Ya, orang itu Li Wen! Lihat, Jiayue ada di belakangnya.", "tr": "01-5", "py": "Duì, nàge rén jiù shì Lǐ Wén! Nǐ kàn, Jiāyuè zài tā hòumiàn ne."}, {"s": "", "zh": "昨天我到北京了。", "id": "Kemarin aku sampai di Beijing.", "tr": "01-7", "py": "Zuótiān wǒ dào Běijīng le."}, {"s": "", "zh": "虽然路上花了十几个小时，但是跟家月坐在一起，我觉得时间过得很快。", "id": "Meskipun perjalanan memakan waktu belasan jam, karena duduk bersama Jiayue, aku merasa waktu berlalu cepat.", "tr": "01-7", "py": "Suīrán lùshang huā le shí jǐ gè xiǎoshí, dànshì gēn Jiāyuè zuò zài yìqǐ, wǒ juéde shíjiān guò de hěn kuài."}, {"s": "", "zh": "到机场的时候，家月发现行李箱不见了，我带她去服务台，帮助她找到了行李箱。", "id": "Saat tiba di bandara, Jiayue mendapati kopernya hilang; aku mengantarnya ke meja layanan dan membantunya menemukan koper itu.", "tr": "01-7", "py": "Dào jīchǎng de shíhou, Jiāyuè fāxiàn xíngli xiāng bújiàn le, wǒ dài tā qù fúwùtái, bāngzhù tā zhǎo dào le xíngli xiāng."}, {"s": "", "zh": "走出机场的时候，已经八点多了，我们一出来就看见了王老师的姐姐，她看起来比照片上年轻。", "id": "Saat keluar dari bandara, sudah lewat pukul delapan; begitu keluar kami langsung melihat kakak Bu Guru Wang, dia terlihat lebih muda daripada di foto.", "tr": "01-7", "py": "Zǒu chū jīchǎng de shíhou, yǐjīng bā diǎn duō le, wǒmen yì chūlái jiù kànjiàn le Wáng lǎoshī de jiějie, tā kàn qǐlái bǐ zhàopiàn shàng niánqīng."}, {"s": "", "zh": "晚上，一雪姐带我们去吃了一家很好吃的中国菜。", "id": "Malamnya, Kak Yixue mengajak kami makan di sebuah restoran Tionghoa yang enak sekali.", "tr": "01-7", "py": "Wǎnshang, Yīxuě jiě dài wǒmen qù chī le yì jiā hěn hǎochī de Zhōngguó cài."}], "teks": [{"tr": "01-1", "nama": "课文1 · Mirip Yang Tongle?"}, {"tr": "01-3", "nama": "课文2 · Koper hilang"}, {"tr": "01-5", "nama": "课文3 · Menunggu di aula kedatangan"}, {"tr": "01-7", "nama": "课文4 · Catatan harian Li Wen"}]}, "2": {"judul": "你们想吃什么就点什么", "arti": "Kalian mau makan apa, pesan saja", "kata": [{"h": "菜单", "p": "càidān", "k": "名", "a": "menu"}, {"h": "又", "p": "yòu", "k": "副", "a": "juga, dan (又……又……)"}, {"h": "饿", "p": "è", "k": "形", "a": "lapar"}, {"h": "渴", "p": "kě", "k": "形", "a": "haus"}, {"h": "客气", "p": "kèqi", "k": "动/形", "a": "sungkan; sopan"}, {"h": "饮料", "p": "yǐnliào", "k": "名", "a": "minuman"}, {"h": "好久", "p": "hǎojiǔ", "k": "形", "a": "lama sekali"}, {"h": "服务", "p": "fúwù", "k": "动", "a": "melayani"}, {"h": "员", "p": "yuán", "k": "后缀", "a": "akhiran untuk orang (pelaku/anggota)"}, {"h": "双", "p": "shuāng", "k": "量", "a": "pasang"}, {"h": "筷子", "p": "kuàizi", "k": "名", "a": "sumpit"}, {"h": "勺子", "p": "sháozi", "k": "名", "a": "sendok"}, {"h": "碗", "p": "wǎn", "k": "名", "a": "mangkuk"}, {"h": "马上", "p": "mǎshàng", "k": "副", "a": "segera"}, {"h": "热情", "p": "rèqíng", "k": "形", "a": "ramah, hangat"}, {"h": "尝", "p": "cháng", "k": "动", "a": "mencicipi"}, {"h": "记", "p": "jì", "k": "动", "a": "mengingat"}, {"h": "用", "p": "yòng", "k": "动", "a": "memakai; (sopan) makan, minum"}, {"h": "鸡", "p": "jī", "k": "名", "a": "ayam"}, {"h": "张", "p": "zhāng", "k": "量", "a": "lembar (untuk kertas, lukisan, dll.)"}, {"h": "不用", "p": "búyòng", "k": "副", "a": "tidak perlu"}, {"h": "选", "p": "xuǎn", "k": "动", "a": "memilih"}, {"h": "外卖", "p": "wàimài", "k": "名/动", "a": "makanan pesan antar; mengantar pesanan"}, {"h": "方便", "p": "fāngbiàn", "k": "形", "a": "praktis, mudah"}, {"h": "蛋糕", "p": "dàngāo", "k": "名", "a": "kue (bolu)"}, {"h": "只", "p": "zhǐ", "k": "副", "a": "hanya"}, {"h": "方便面", "p": "fāngbiànmiàn", "k": "名", "a": "mi instan"}, {"h": "简单", "p": "jiǎndān", "k": "形", "a": "sederhana, mudah"}], "dialog": [{"s": "王一雪", "zh": "家月、李文，你们看看菜单，想吃点儿什么？", "id": "Jiayue, Li Wen, coba lihat menunya, mau makan apa?", "tr": "02-1", "py": "Jiāyuè, Lǐ Wén, nǐmen kànkan càidān, xiǎng chī diǎnr shénme?"}, {"s": "李文", "zh": "谢谢一雪姐，我都可以，你们点吧。", "id": "Terima kasih, Kak Yixue, saya apa saja boleh, kalian saja yang pesan.", "tr": "02-1", "py": "Xièxie Yīxuě jiě, wǒ dōu kěyǐ, nǐmen diǎn ba."}, {"s": "白家月", "zh": "飞了这么远，现在还真是又饿又渴。", "id": "Terbang sejauh ini, sekarang aku benar-benar lapar dan haus.", "tr": "02-1", "py": "Fēi le zhème yuǎn, xiànzài hái zhēn shì yòu è yòu kě."}, {"s": "王一雪", "zh": "那多点点儿，别客气。你们喝什么饮料？", "id": "Kalau begitu pesan lebih banyak, jangan sungkan. Kalian mau minum apa?", "tr": "02-1", "py": "Nà duō diǎn diǎnr, bié kèqi. Nǐmen hē shénme yǐnliào?"}, {"s": "白家月", "zh": "好久没喝中国茶，也好久没吃饺子了。我想喝绿茶、吃饺子，可以吗？", "id": "Sudah lama aku tidak minum teh Tiongkok dan tidak makan jiaozi. Aku mau minum teh hijau dan makan jiaozi, boleh?", "tr": "02-1", "py": "Hǎojiǔ méi hē Zhōngguó chá, yě hǎojiǔ méi chī jiǎozi le. Wǒ xiǎng hē lǜchá, chī jiǎozi, kěyǐ ma?"}, {"s": "王一雪", "zh": "没问题。你们看看还想吃什么。", "id": "Tentu boleh. Coba lihat lagi kalian masih mau makan apa.", "tr": "02-1", "py": "Méi wèntí. Nǐmen kànkan hái xiǎng chī shénme."}, {"s": "王一雪", "zh": "服务员，再给我们拿一双筷子、一个勺子和一个碗。", "id": "Mas/Mbak, tolong ambilkan kami sepasang sumpit, satu sendok, dan satu mangkuk lagi.", "tr": "02-3", "py": "Fúwùyuán, zài gěi wǒmen ná yì shuāng kuàizi, yí gè sháozi hé yí gè wǎn."}, {"s": "服务员", "zh": "好的，请等一下，我马上去拿。", "id": "Baik, mohon tunggu sebentar, saya segera ambilkan.", "tr": "02-3", "py": "Hǎo de, qǐng děng yíxià, wǒ mǎshàng qù ná."}, {"s": "王一雪", "zh": "这家饭馆的服务很热情，菜也都做得很好吃。你们尝尝，看喜不喜欢这些菜。", "id": "Pelayanan di restoran ini sangat ramah, masakannya juga enak semua. Coba kalian cicipi, suka atau tidak masakan-masakan ini.", "tr": "02-3", "py": "Zhè jiā fànguǎn de fúwù hěn rèqíng, cài yě dōu zuò de hěn hǎochī. Nǐmen cháng cháng, kàn xǐ bu xǐhuan zhèxiē cài."}, {"s": "白家月", "zh": "哪个菜都好吃。您点的这些菜真不错。", "id": "Masakan mana pun enak. Masakan yang Kakak pesan ini benar-benar enak.", "tr": "02-3", "py": "Nǎge cài dōu hǎochī. Nín diǎn de zhèxiē cài zhēn búcuò."}, {"s": "王一雪", "zh": "这里的饭菜又便宜又好吃，我们经常来，服务员都记住我们爱吃的菜了。", "id": "Makanan di sini murah dan enak, kami sering datang, sampai para pelayan ingat masakan kesukaan kami.", "tr": "02-3", "py": "Zhèlǐ de fàn cài yòu piányi yòu hǎochī, wǒmen jīngcháng lái, fúwùyuán dōu jì zhù wǒmen ài chī de cài le."}, {"s": "服务员", "zh": "王姐，您经常来吃饭，今天送您一些水果，请慢用。", "id": "Kak Wang, Kakak sering makan di sini, hari ini kami beri sedikit buah gratis, silakan dinikmati.", "tr": "02-3", "py": "Wáng jiě, nín jīngcháng lái chīfàn, jīntiān sòng nín yìxiē shuǐguǒ, qǐng màn yòng."}, {"s": "白家月", "zh": "这个鸡肉饭太好吃了，我要再来吃一次。", "id": "Nasi ayam ini enak sekali, aku mau datang makan lagi.", "tr": "02-5", "py": "Zhège jī ròu fàn tài hǎochī le, wǒ yào zài lái chī yí cì."}, {"s": "李文", "zh": "你可以拿走这张菜单，看看下次还吃点儿什么。", "id": "Kamu bisa bawa pulang menu ini, lihat lain kali mau makan apa lagi.", "tr": "02-5", "py": "Nǐ kěyǐ ná zǒu zhè Zhāng càidān, kànkan xià cì hái chī diǎnr shénme."}, {"s": "王一雪", "zh": "不用拿菜单，在手机上就能看到，也可以选好了让他们给你送。", "id": "Tidak perlu bawa menu, di ponsel juga bisa dilihat, bisa juga pilih lalu minta mereka mengantarnya untukmu.", "tr": "02-5", "py": "Búyòng ná càidān, zài shǒujī shàng jiù néng kàn dào, yě kěyǐ xuǎn hǎo le ràng tāmen gěi nǐ sòng."}, {"s": "白家月", "zh": "他们家还能送外卖？", "id": "Restoran mereka juga bisa antar pesanan?", "tr": "02-5", "py": "Tāmen jiā hái néng sòng wàimài?"}, {"s": "王一雪", "zh": "对，现在很多饭馆都能送外卖，想吃什么就点什么。", "id": "Ya, sekarang banyak restoran bisa antar pesanan, mau makan apa, pesan saja.", "tr": "02-5", "py": "Duì, xiànzài hěn duō fànguǎn dōu néng sòng wàimài, xiǎng chī shénme jiù diǎn shénme."}, {"s": "白家月", "zh": "那真是太方便了！", "id": "Wah, praktis sekali!", "tr": "02-5", "py": "Nà zhēn shì tài fāngbiàn le!"}, {"s": "", "zh": "这些年在国外，我很少自己做饭。", "id": "Selama beberapa tahun di luar negeri, aku jarang memasak sendiri.", "tr": "02-7", "py": "Zhèxiē nián zài guó wài, wǒ hěn shǎo zìjǐ zuòfàn."}, {"s": "", "zh": "早饭我吃一个面包，有时候吃一块蛋糕，再喝一杯咖啡。", "id": "Sarapanku sepotong roti, kadang sepotong kue, lalu minum secangkir kopi.", "tr": "02-7", "py": "Zǎofàn wǒ chī yí gè miànbāo, yǒushí hòu chī yí kuài dàngāo, zài hē yì bēi kāfēi."}, {"s": "", "zh": "午饭和晚饭也都在外面吃。", "id": "Makan siang dan makan malam juga di luar.", "tr": "02-7", "py": "Wǔfàn hé wǎnfàn yě dōu zài wàimiàn chī."}, {"s": "", "zh": "快要考试的时候又忙又累，没时间出去吃饭，家里又什么吃的都没有，我可能好几天只吃方便面。", "id": "Menjelang ujian aku sibuk dan lelah, tidak ada waktu keluar makan, di rumah pun tidak ada makanan apa-apa, jadi mungkin berhari-hari aku hanya makan mi instan.", "tr": "02-7", "py": "Kuàiyào kǎoshì de shíhou yòu máng yòu lèi, méi shíjiān chūqù chīfàn, jiā li yòu shénme chī de dōu méiyǒu, wǒ kěnéng hǎo jǐ tiān zhī chī fāngbiànmiàn."}, {"s": "", "zh": "现在回到中国了，每天能吃到妈妈做的饭，我真是太高兴了！", "id": "Sekarang sudah kembali ke Tiongkok, setiap hari bisa makan masakan Ibu, aku senang sekali!", "tr": "02-7", "py": "Xiànzài huí dào Zhōngguó le, měi tiān néng chī dào māma zuò de fàn, wǒ zhēn shì tài gāoxìng le!"}, {"s": "", "zh": "有时候妈妈只做几个简单的菜，我也非常爱吃，因为什么都没有妈妈做的饭好吃。", "id": "Kadang Ibu hanya memasak beberapa lauk sederhana, aku tetap sangat suka, karena tidak ada yang lebih enak daripada masakan Ibu.", "tr": "02-7", "py": "Yǒushí hòu māma zhī zuò jǐ gè jiǎndān de cài, wǒ yě fēicháng ài chī, yīnwèi shénme dōu méiyǒu māma zuò de fàn hǎochī."}], "teks": [{"tr": "02-1", "nama": "课文1 · Memesan makanan"}, {"tr": "02-3", "nama": "课文2 · Pelayanan yang ramah"}, {"tr": "02-5", "nama": "课文3 · Pesan antar"}, {"tr": "02-7", "nama": "课文4 · Masakan Ibu paling enak"}]}, "3": {"judul": "这个小区挺好的", "arti": "Kompleks perumahan ini cukup bagus", "kata": [{"h": "初中", "p": "chūzhōng", "k": "名", "a": "SMP"}, {"h": "咱们", "p": "zánmen", "k": "代", "a": "kita"}, {"h": "换", "p": "huàn", "k": "动", "a": "mengganti, menukar"}, {"h": "房子", "p": "fángzi", "k": "名", "a": "rumah"}, {"h": "小区", "p": "xiǎoqū", "k": "名", "a": "kompleks perumahan"}, {"h": "环境", "p": "huánjìng", "k": "名", "a": "lingkungan"}, {"h": "挺", "p": "tǐng", "k": "副", "a": "cukup, sangat"}, {"h": "空调", "p": "kōngtiáo", "k": "名", "a": "AC, pendingin ruangan"}, {"h": "洗衣机", "p": "xǐyījī", "k": "名", "a": "mesin cuci"}, {"h": "层", "p": "céng", "k": "量", "a": "lantai, tingkat"}, {"h": "花园", "p": "huāyuán", "k": "名", "a": "taman"}, {"h": "灯", "p": "dēng", "k": "名", "a": "lampu"}, {"h": "关", "p": "guān", "k": "动", "a": "mematikan, menutup"}, {"h": "冰箱", "p": "bīngxiāng", "k": "名", "a": "kulkas"}, {"h": "卫生间", "p": "wèishēngjiān", "k": "名", "a": "kamar mandi, toilet"}, {"h": "打扫", "p": "dǎsǎo", "k": "动", "a": "membersihkan"}, {"h": "搬家", "p": "bānjiā", "k": "动", "a": "pindah rumah"}, {"h": "办", "p": "bàn", "k": "动", "a": "mengurus, membuat (dokumen, kartu)"}, {"h": "信用卡", "p": "xìnyòngkǎ", "k": "名", "a": "kartu kredit"}, {"h": "还", "p": "huán", "k": "动", "a": "mengembalikan, membayar kembali"}, {"h": "听说", "p": "tīngshuō", "k": "动", "a": "dengar-dengar, kabarnya"}, {"h": "银行", "p": "yínháng", "k": "名", "a": "bank"}, {"h": "才", "p": "cái", "k": "副", "a": "baru (terlambat/lambat)"}, {"h": "纸", "p": "zhǐ", "k": "名", "a": "kertas"}, {"h": "搬", "p": "bān", "k": "动", "a": "mengangkut, memindahkan"}, {"h": "需要", "p": "xūyào", "k": "动/名", "a": "perlu; kebutuhan"}], "dialog": [{"s": "王一雪", "zh": "小雪的初中离家有点儿远，咱们换一个近点儿的房子吧。", "id": "SMP Xiaoxue agak jauh dari rumah, ayo kita pindah ke rumah yang lebih dekat.", "tr": "03-1", "py": "Xiǎoxuě de chūzhōng lí jiā yǒudiǎnr yuǎn, zánmen huàn yí gè jìn diǎnr de fángzi ba."}, {"s": "刘明", "zh": "好啊，我上网看看。你觉得这个小区怎么样？", "id": "Boleh, aku lihat di internet. Menurutmu kompleks ini bagaimana?", "tr": "03-1", "py": "Hǎo a, wǒ shàngwǎng kànkan. Nǐ juéde zhège xiǎoqū zěnmeyàng?"}, {"s": "王一雪", "zh": "环境挺好的，离地铁站还不远。", "id": "Lingkungannya cukup bagus, dan tidak jauh dari stasiun kereta bawah tanah.", "tr": "03-1", "py": "Huánjìng tǐng hǎo de, lí dìtiě zhàn hái bù yuǎn."}, {"s": "刘明", "zh": "房子里面也不错，空调和洗衣机都是新的。", "id": "Bagian dalam rumahnya juga bagus, AC dan mesin cucinya baru semua.", "tr": "03-1", "py": "Fángzi lǐmiàn yě búcuò, kōngtiáo hé xǐyījī dōu shì xīn de."}, {"s": "王一雪", "zh": "是不错，但是我不喜欢住一层。", "id": "Memang bagus, tapi aku tidak suka tinggal di lantai satu.", "tr": "03-1", "py": "Shì búcuò, dànshì wǒ bù xǐhuan zhù yī céng."}, {"s": "刘明", "zh": "这个一层带一个小花园，我觉得咱们可以去看看。", "id": "Lantai satu ini ada taman kecilnya, menurutku kita bisa pergi melihatnya.", "tr": "03-1", "py": "Zhège yī céng dài yí gè xiǎo huāyuán, wǒ juéde zánmen kěyǐ qù kànkan."}, {"s": "王一雪", "zh": "我今天早上来的时候，灯还开着。", "id": "Waktu aku datang tadi pagi, lampunya masih menyala.", "tr": "03-3", "py": "Wǒ jīntiān zǎoshang lái de shíhou, dēng hái kāi zhe."}, {"s": "刘明", "zh": "我这几天忙坏了，可能走的时候忘关了。", "id": "Beberapa hari ini aku sibuk sekali, mungkin lupa mematikannya waktu pergi.", "tr": "03-3", "py": "Wǒ zhè jǐ tiān máng huài le, kěnéng zǒu de shíhou wàng guān le."}, {"s": "王一雪", "zh": "冰箱不能用，这些吃的东西放在哪儿？", "id": "Kulkasnya tidak bisa dipakai, makanan-makanan ini ditaruh di mana?", "tr": "03-3", "py": "Bīngxiāng bù néng yòng, zhèxiē chī de dōngxi fàng zài nǎr?"}, {"s": "刘明", "zh": "不可能吧？冰箱是新买的，我来看看。", "id": "Masa sih? Kulkasnya baru dibeli, biar aku lihat.", "tr": "03-3", "py": "Bù kěnéng ba? Bīngxiāng shì xīn mǎi de, wǒ lái kànkan."}, {"s": "王一雪", "zh": "洗衣机也坏了吗？", "id": "Mesin cucinya juga rusak?", "tr": "03-3", "py": "Xǐyījī yě huài le ma?"}, {"s": "刘明", "zh": "没坏，但是卫生间没打扫好，还不能洗衣服。", "id": "Tidak rusak, tapi kamar mandinya belum selesai dibersihkan, jadi belum bisa mencuci baju.", "tr": "03-3", "py": "Méi huài, dànshì wèishēngjiān méi dǎsǎo hǎo, hái bù néng xǐ yīfu."}, {"s": "王一雪", "zh": "星期天我们真的能搬家吗？", "id": "Apa hari Minggu kita benar-benar bisa pindah rumah?", "tr": "03-3", "py": "Xīngqītiān wǒmen zhēn de néng bānjiā ma?"}, {"s": "王一雪", "zh": "这个月花了不少钱。", "id": "Bulan ini kita menghabiskan banyak uang.", "tr": "03-5", "py": "Zhège yuè huā le bù shǎo qián."}, {"s": "刘明", "zh": "是的，我们买了很多搬家时要用的东西。", "id": "Ya, kita membeli banyak barang yang diperlukan untuk pindah rumah.", "tr": "03-5", "py": "Shì de, wǒmen mǎi le hěn duō bānjiā shí yào yòng de dōngxi."}, {"s": "王一雪", "zh": "咱们办张信用卡吧，花的钱可以慢慢还。听说中国银行的服务不错，办了信用卡买东西还能便宜。", "id": "Ayo kita buat kartu kredit, uang yang dipakai bisa dicicil pelan-pelan. Kabarnya layanan Bank of China bagus, kalau punya kartu kredit belanja juga bisa lebih murah.", "tr": "03-5", "py": "Zánmen bàn Zhāng xìnyòngkǎ ba, huā de qián kěyǐ màn màn hái. Tīngshuō Zhōngguó yínháng de fúwù búcuò, bàn le xìnyòngkǎ mǎi dōngxi hái néng piányi."}, {"s": "刘明", "zh": "好啊！中国银行很近，走路几分钟就能到。咱们什么时候去？", "id": "Boleh! Bank of China dekat, jalan kaki beberapa menit saja sudah sampai. Kapan kita pergi?", "tr": "03-5", "py": "Hǎo a! Zhōngguó yínháng hěn jìn, zǒulù jǐ fēnzhōng jiù néng dào. Zánmen shénme shíhou qù?"}, {"s": "王一雪", "zh": "今天下午？", "id": "Sore ini?", "tr": "03-5", "py": "Jīntiān xiàwǔ?"}, {"s": "刘明", "zh": "我下午要去医院，很晚才能回来。", "id": "Sore ini aku harus ke rumah sakit, baru bisa pulang larut.", "tr": "03-5", "py": "Wǒ xiàwǔ yào qù yīyuàn, hěn wǎn cái néng huílái."}, {"s": "王一雪", "zh": "那我下午自己去吧。", "id": "Kalau begitu sore ini aku pergi sendiri saja.", "tr": "03-5", "py": "Nà wǒ xiàwǔ zìjǐ qù ba."}, {"s": "刘明", "zh": "我觉得这个星期就能搬家。我明天去买一些纸箱，很快就能准备好。搬家那天，我想请几位朋友来帮忙，最多一天就能搬完。", "id": "Menurutku minggu ini pun sudah bisa pindah. Besok aku beli beberapa kardus, sebentar saja sudah siap. Pada hari pindahan, aku mau minta beberapa teman datang membantu, paling lama sehari sudah selesai.", "tr": "03-7", "py": "Wǒ juéde zhège xīngqī jiù néng bānjiā. Wǒ míngtiān qù mǎi yìxiē zhǐ xiāng, hěn kuài jiù néng zhǔnbèi hǎo. Bānjiā nà tiān, wǒ xiǎng qǐng jǐ wèi péngyou lái bāngmáng, zuì duō yì tiān jiù néng bān wán."}, {"s": "王一雪", "zh": "我觉得下个月才能搬家。这周开始准备，下周去打扫新家，这么多事情最少需要两个星期才能做完。搬家那天，我们应该找一家搬家公司。", "id": "Menurutku baru bulan depan bisa pindah. Minggu ini mulai bersiap, minggu depan membersihkan rumah baru; urusan sebanyak ini paling sedikit perlu dua minggu baru selesai. Pada hari pindahan, kita sebaiknya memakai jasa perusahaan pindahan.", "tr": "03-7", "py": "Wǒ juéde xià gè yuè cái néng bānjiā. Zhè zhōu kāishǐ zhǔnbèi, xià zhōu qù dǎsǎo xīn jiā, zhème duō shìqing zuì shǎo xūyào liǎng gè xīngqī cái néng zuò wán. Bānjiā nà tiān, wǒmen yīnggāi zhǎo yì jiā bānjiā gōngsī."}], "teks": [{"tr": "03-1", "nama": "课文1 · Mencari rumah baru"}, {"tr": "03-3", "nama": "课文2 · Di rumah baru"}, {"tr": "03-5", "nama": "课文3 · Membuat kartu kredit"}, {"tr": "03-7", "nama": "课文4 · Rencana pindahan"}]}, "4": {"judul": "这家宾馆跟别的都不一样", "arti": "Hotel ini berbeda dari yang lain", "kata": [{"h": "假期", "p": "jiàqī", "k": "名", "a": "masa liburan"}, {"h": "海", "p": "hǎi", "k": "名", "a": "laut"}, {"h": "草原", "p": "cǎoyuán", "k": "名", "a": "padang rumput"}, {"h": "主意", "p": "zhǔyi", "k": "名", "a": "ide, gagasan"}, {"h": "骑", "p": "qí", "k": "动", "a": "menunggang, naik (kuda, sepeda)"}, {"h": "马", "p": "mǎ", "k": "名", "a": "kuda"}, {"h": "羊", "p": "yáng", "k": "名", "a": "domba, kambing"}, {"h": "月亮", "p": "yuèliang", "k": "名", "a": "bulan (di langit)"}, {"h": "一定", "p": "yídìng", "k": "副", "a": "pasti"}, {"h": "刻", "p": "kè", "k": "量", "a": "seperempat jam"}, {"h": "起飞", "p": "qǐfēi", "k": "动", "a": "lepas landas"}, {"h": "宾馆", "p": "bīnguǎn", "k": "名", "a": "hotel"}, {"h": "特别", "p": "tèbié", "k": "形/副", "a": "istimewa; terutama, sangat"}, {"h": "别的", "p": "biéde", "k": "代", "a": "yang lain"}, {"h": "一样", "p": "yíyàng", "k": "形", "a": "sama"}, {"h": "牛", "p": "niú", "k": "名", "a": "sapi"}, {"h": "相机", "p": "xiàngjī", "k": "名", "a": "kamera"}, {"h": "欢迎", "p": "huānyíng", "k": "动", "a": "menyambut, selamat datang"}, {"h": "司机", "p": "sījī", "k": "名", "a": "sopir"}, {"h": "晚点", "p": "wǎndiǎn", "k": "动", "a": "terlambat (kereta, pesawat, kapal)"}, {"h": "久", "p": "jiǔ", "k": "形", "a": "lama"}, {"h": "除了", "p": "chúle", "k": "介", "a": "selain, kecuali"}, {"h": "以外", "p": "yǐwài", "k": "名", "a": "di luar, selain"}, {"h": "先", "p": "xiān", "k": "副", "a": "dulu, terlebih dahulu"}, {"h": "一直", "p": "yìzhí", "k": "副", "a": "terus-menerus, selalu"}, {"h": "干净", "p": "gānjìng", "k": "形", "a": "bersih"}, {"h": "满意", "p": "mǎnyì", "k": "动", "a": "puas"}], "dialog": [{"s": "杨同乐", "zh": "这个假期咱们去哪儿玩玩吧。", "id": "Liburan ini ayo kita jalan-jalan ke suatu tempat.", "tr": "04-1", "py": "Zhège jiàqī zánmen qù nǎr wán wán ba."}, {"s": "王一飞", "zh": "好啊，你想去哪儿，咱们就去哪儿。", "id": "Boleh, kamu mau ke mana, kita ke sana.", "tr": "04-1", "py": "Hǎo a, nǐ xiǎng qù nǎr, zánmen jiù qù nǎr."}, {"s": "杨同乐", "zh": "你喜欢海，找个海边住几天，怎么样？", "id": "Kamu suka laut, bagaimana kalau kita menginap beberapa hari di tepi laut?", "tr": "04-1", "py": "Nǐ xǐhuan hǎi, zhǎo gè hǎi biān zhù jǐ tiān, zěnmeyàng?"}, {"s": "王一飞", "zh": "现在去海边有点儿冷。", "id": "Sekarang ke tepi laut agak dingin.", "tr": "04-1", "py": "Xiànzài qù hǎi biān yǒudiǎnr lěng."}, {"s": "杨同乐", "zh": "那去草原吧？草原一点儿也不冷。", "id": "Kalau begitu ke padang rumput? Padang rumput sama sekali tidak dingin.", "tr": "04-1", "py": "Nà qù cǎoyuán ba? Cǎoyuán yìdiǎnr yě bù lěng."}, {"s": "王一飞", "zh": "这个主意好！我好久没骑马了。", "id": "Ide bagus! Sudah lama aku tidak naik kuda.", "tr": "04-1", "py": "Zhège zhǔyi hǎo! Wǒ hǎojiǔ méi qí mǎ le."}, {"s": "杨同乐", "zh": "对，在草原上骑马、吃羊肉、看月亮，一定很有意思。", "id": "Betul, naik kuda, makan daging domba, dan melihat bulan di padang rumput pasti sangat menyenangkan.", "tr": "04-1", "py": "Duì, zài cǎoyuán shàng qí mǎ, chī yáng ròu, kàn yuèliang, yídìng hěn yǒuyìsi."}, {"s": "杨同乐", "zh": "出去玩的机票买好了吗？", "id": "Tiket pesawat untuk liburan sudah dibeli?", "tr": "04-3", "py": "Chūqù wán de jīpiào mǎi hǎo le ma?"}, {"s": "王一飞", "zh": "买好了。星期六上午十点一刻起飞。", "id": "Sudah. Berangkat hari Sabtu pukul sepuluh lewat seperempat pagi.", "tr": "04-3", "py": "Mǎi hǎo le. Xīngqīliù shàngwǔ shí diǎn yí kè qǐfēi."}, {"s": "杨同乐", "zh": "宾馆也选好了吗？", "id": "Hotelnya juga sudah dipilih?", "tr": "04-3", "py": "Bīnguǎn yě xuǎn hǎo le ma?"}, {"s": "王一飞", "zh": "是的，这家宾馆很特别，跟别的都不一样，一出门就能看见牛和羊！", "id": "Sudah, hotel ini istimewa, berbeda dari yang lain, begitu keluar pintu langsung bisa melihat sapi dan domba!", "tr": "04-3", "py": "Shì de, zhè jiā bīnguǎn hěn tèbié, gēn biéde dōu bù yíyàng, yì chūmén jiù néng kànjiàn niú hé yáng!"}, {"s": "杨同乐", "zh": "太好了！你看看要带什么东西？", "id": "Bagus sekali! Coba lihat, barang apa saja yang perlu dibawa?", "tr": "04-3", "py": "Tài hǎo le! Nǐ kànkan yào dài shénme dōngxi?"}, {"s": "王一飞", "zh": "我们不用带太多东西，别忘了拿上新买的相机。", "id": "Kita tidak perlu membawa terlalu banyak barang, jangan lupa bawa kamera yang baru dibeli.", "tr": "04-3", "py": "Wǒmen búyòng dài tài duō dōngxi, bié wàng le ná shàng xīn mǎi de xiàngjī."}, {"s": "杨同乐", "zh": "一定不会忘带的。我现在就去准备行李。", "id": "Pasti tidak akan lupa. Aku siapkan barang bawaan sekarang juga.", "tr": "04-3", "py": "Yídìng bú huì wàng dài de. Wǒ xiànzài jiù qù zhǔnbèi xíngli."}, {"s": "小李", "zh": "欢迎你们！我是你们的司机，我姓李，叫我小李就可以。", "id": "Selamat datang! Saya sopir Anda, nama keluarga saya Li, panggil saja Xiao Li.", "tr": "04-5", "py": "Huānyíng nǐmen! Wǒ shì nǐmen de sījī, wǒ xìng Lǐ, jiào wǒ Xiǎo Lǐ jiù kěyǐ."}, {"s": "杨同乐", "zh": "您好！不好意思，飞机晚点了，让您久等了。", "id": "Halo! Maaf, pesawatnya terlambat, membuat Anda menunggu lama.", "tr": "04-5", "py": "Nín hǎo! Bùhǎoyìsī, fēijī wǎndiǎn le, ràng nín jiǔ děng le."}, {"s": "小李", "zh": "没关系。除了这个行李箱以外，还有别的东西吗？", "id": "Tidak apa-apa. Selain koper ini, masih ada barang lain?", "tr": "04-5", "py": "Méiguānxi. Chúle zhège xíngli xiāng yǐwài, hái yǒu biéde dōngxi ma?"}, {"s": "杨同乐", "zh": "还有一个包，我自己拿就可以。", "id": "Masih ada satu tas, saya bawa sendiri saja.", "tr": "04-5", "py": "Hái yǒu yí gè bāo, wǒ zìjǐ ná jiù kěyǐ."}, {"s": "小李", "zh": "车在一层，请跟我来。", "id": "Mobilnya di lantai satu, silakan ikut saya.", "tr": "04-5", "py": "Chē zài yī céng, qǐng gēn wǒ lái."}, {"s": "杨同乐", "zh": "我们住的宾馆离机场远吗？", "id": "Hotel tempat kami menginap jauh dari bandara?", "tr": "04-5", "py": "Wǒmen zhù de bīnguǎn lí jīchǎng yuǎn ma?"}, {"s": "小李", "zh": "不远，三十分钟就能到。两位到了可以先休息休息，晚饭的时候我叫你们。", "id": "Tidak jauh, tiga puluh menit sudah sampai. Setelah sampai, Anda berdua bisa istirahat dulu, waktu makan malam nanti saya panggil.", "tr": "04-5", "py": "Bù yuǎn, sānshí fēnzhōng jiù néng dào. Liǎng wèi dào le kěyǐ xiān xiūxi xiūxi, wǎnfàn de shíhou wǒ jiào nǐmen."}, {"s": "", "zh": "今天是我们旅游的第一天。", "id": "Hari ini hari pertama perjalanan kami.", "tr": "04-7
