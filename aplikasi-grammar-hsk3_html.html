 "o": ["发", "发了", "看", "放"], "a": 0, "x": "发给 = mengirimkan kepada.", "f": "请把照片发给我。", "fp": "Qǐng bǎ zhàopiàn fā gěi wǒ."}, {"k": "10-3.5", "t": "pg", "q": "Di mana posisi 把? 我 A 想 B 这些花 C 送给 D 妈妈。", "o": ["A", "B", "C", "D"], "a": 1, "x": "Kata bantu kerja (想) sebelum 把: 我想把这些花送给妈妈."}, {"k": "10-3.6", "t": "su", "w": ["你", "明天", "再", "把", "书", "还", "给", "我"], "s": "你明天再把书还给我。", "alt": ["明天你再把书还给我。"], "p": "Nǐ míngtiān zài bǎ shū huán gěi wǒ.", "x": "Besok kembalikan buku itu kepadaku."}, {"k": "10-3.7", "t": "su", "w": ["我", "把", "礼物", "送", "给", "她", "了"], "s": "我把礼物送给她了。", "alt": [], "p": "Wǒ bǎ lǐwù sòng gěi tā le.", "x": "Hadiahnya sudah kuberikan kepadanya."}, {"k": "10-3.8", "t": "su", "w": ["请", "你", "把", "这", "本", "书", "带", "给", "老师"], "s": "请你把这本书带给老师。", "alt": [], "p": "Qǐng nǐ bǎ zhè běn shū dài gěi lǎoshī.", "x": "Tolong bawakan buku ini kepada guru."}, {"k": "10-3.9", "t": "su", "w": ["我", "想", "把", "这些", "花", "送", "给", "妈妈"], "s": "我想把这些花送给妈妈。", "alt": [], "p": "Wǒ xiǎng bǎ zhèxiē huā sòng gěi māma.", "x": "Aku ingin memberikan bunga-bunga ini kepada ibu."}, {"k": "10-3.10", "t": "su", "w": ["他", "还", "没", "把", "钱", "还", "给", "我"], "s": "他还没把钱还给我。", "alt": [], "p": "Tā hái méi bǎ qián huán gěi wǒ.", "x": "Dia belum mengembalikan uang itu kepadaku."}, {"k": "10-3.11", "t": "bs", "s": "请把照片发给我。", "sp": "Qǐng bǎ zhàopiàn fā gěi wǒ.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "10-3.12", "t": "bs", "s": "我还给他把书了。", "sp": "Wǒ huán gěi tā bǎ shū le.", "n": "", "ok": false, "b": "我把书还给他了。", "bp": "Wǒ bǎ shū huán gěi tā le.", "x": "把 + benda sebelum kata kerja."}, {"k": "10-3.13", "t": "bs", "s": "我把今天的笔记借给他了。", "sp": "Wǒ bǎ jīntiān de bǐjì jiè gěi tā le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "10-3.14", "t": "bs", "s": "我把这些吃的不送给他。", "sp": "Wǒ bǎ zhèxiē chī de bú sòng gěi tā.", "n": "", "ok": false, "b": "我不把这些吃的送给他。", "bp": "Wǒ bù bǎ zhèxiē chī de sòng gěi tā.", "x": "不 sebelum 把."}, {"k": "10-3.15", "t": "bs", "s": "下课以后，请大家把作业交给我。", "sp": "Xiàkè yǐhòu, qǐng dàjiā bǎ zuòyè jiāo gěi wǒ.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "11-1", "pel": 11, "judul": "Perbedaan 还是 dan 或者 (atau)", "kode": "\"还是\"和\"或者\"", "rumus": ["Tanya: A + 还是 + B？ (pilih salah satu)", "Pernyataan: A + 或者 + B (+ 都可以)", "我不知道/没想好 + A 还是 B"], "jelas": ["Bahasa Indonesia hanya punya satu kata \"atau\", tetapi bahasa Mandarin punya dua: 还是 dan 或者. Perbedaannya terletak pada jenis kalimatnya.", "还是 (háishi) dipakai dalam KALIMAT TANYA untuk memberikan dua pilihan atau lebih dan meminta lawan bicara memilih: 我们用会议室的电脑还是自己的笔记本电脑？ Kalimat 还是 sudah merupakan pertanyaan, jadi TIDAK memakai 吗 di akhir.", "或者 (huòzhě) dipakai dalam KALIMAT PERNYATAAN (bukan pertanyaan), berarti \"boleh A, boleh B\": 会议室的电脑或者自己的电脑都可以. 你可以坐地铁或者打车去学校. Sering diikuti 都可以/都行.", "Pengecualian: 还是 juga bisa muncul dalam pernyataan yang berisi pertanyaan tidak langsung, setelah 不知道, 没想好, 不清楚: 我不知道他今天来还是明天来 (aku tidak tahu dia datang hari ini atau besok). Di sini tetap ada pilihan yang belum dijawab.", "Jebakan bagi pelajar Indonesia: karena \"atau\" hanya satu kata, pelajar sering memakai 或者 dalam pertanyaan (你喝茶或者咖啡？). Ingat: ada tanda tanya dan meminta memilih → 还是. Tidak ada pertanyaan → 或者.", "Catatan: 还是 juga punya arti lain, yaitu \"lebih baik\" (咱们还是一起去办公室问问李老师吧) dan \"masih\" (他还是很忙). Bedakan dari konteksnya."], "poin": ["Tanya pilihan → 还是 (tanpa 吗).", "Pernyataan → 或者 (sering + 都可以).", "不知道/没想好 + A还是B.", "还是 juga bisa berarti \"lebih baik\"."], "contoh": [{"zh": "开会的时候，我们用会议室的电脑还是自己的笔记本电脑？", "py": "Kāihuì de shíhou, wǒmen yòng huìyì shì de diànnǎo háishi zìjǐ de bǐjìběn diànnǎo?", "id": "Waktu rapat, kita pakai komputer ruang rapat atau laptop sendiri?", "b": true, "tr": "11-1"}, {"zh": "我们今天去、明天去还是后天去？", "py": "Wǒmen jīntiān qù, míngtiān qù háishi hòutiān qù?", "id": "Kita pergi hari ini, besok, atau lusa?", "b": true, "tr": null}, {"zh": "会议室的电脑或者自己的电脑都可以。", "py": "Huìyì shì de diànnǎo huòzhě zìjǐ de diànnǎo dōu kěyǐ.", "id": "Komputer ruang rapat atau komputer sendiri, dua-duanya boleh.", "b": true, "tr": "11-1"}, {"zh": "你可以坐地铁或者打车去学校。", "py": "Nǐ kěyǐ zuò dìtiě huòzhě dǎchē qù xuéxiào.", "id": "Kamu bisa ke sekolah naik kereta bawah tanah atau naik taksi.", "b": true, "tr": null}, {"zh": "你喝茶还是喝咖啡？", "py": "Nǐ hē chá háishi hē kāfēi?", "id": "Kamu minum teh atau kopi?", "b": false, "tr": null}, {"zh": "你是中国人还是日本人？", "py": "Nǐ shì Zhōngguó rén háishi Rìběn rén?", "id": "Kamu orang Tiongkok atau orang Jepang?", "b": false, "tr": null}, {"zh": "周末我想去看电影或者去公园。", "py": "Zhōumò wǒ xiǎng qù kàn diànyǐng huòzhě qù gōngyuán.", "id": "Akhir pekan aku ingin menonton film atau ke taman.", "b": false, "tr": null}, {"zh": "明天或者后天我都有时间。", "py": "Míngtiān huòzhě hòutiān wǒ dōu yǒu shíjiān.", "id": "Besok atau lusa aku ada waktu.", "b": false, "tr": null}, {"zh": "我不知道他今天来还是明天来。", "py": "Wǒ bù zhīdào tā jīntiān lái háishi míngtiān lái.", "id": "Aku tidak tahu dia datang hari ini atau besok.", "b": false, "tr": null}, {"zh": "今天的晚饭吃米饭或者面条都行。", "py": "Jīntiān de wǎnfàn chī mǐfàn huòzhě miàn tiáo dōu xíng.", "id": "Makan malam hari ini nasi atau mi, dua-duanya boleh.", "b": false, "tr": null}], "salah": [{"s": "你喝茶或者咖啡？", "sp": "Nǐ hē chá huòzhě kāfēi?", "n": "", "b": "你喝茶还是咖啡？", "bp": "Nǐ hē chá háishi kāfēi?", "a": "Pertanyaan pilihan memakai 还是."}, {"s": "茶还是咖啡都可以。", "sp": "Chá háishi kāfēi dōu kěyǐ.", "n": "", "b": "茶或者咖啡都可以。", "bp": "Chá huòzhě kāfēi dōu kěyǐ.", "a": "Pernyataan memakai 或者."}, {"s": "你去还是不去吗？", "sp": "Nǐ qù háishi bú qù ma?", "n": "", "b": "你去还是不去？", "bp": "Nǐ qù háishi bú qù?", "a": "Kalimat 还是 tidak memakai 吗."}], "latihan": [{"k": "11-1.0", "t": "pg", "q": "我们用会议室的电脑___自己的电脑？", "o": ["还是", "或者", "和", "也"], "a": 0, "x": "Pertanyaan pilihan = 还是.", "f": "我们用会议室的电脑还是自己的电脑？", "fp": "Wǒmen yòng huìyì shì de diànnǎo háishi zìjǐ de diànnǎo?"}, {"k": "11-1.1", "t": "pg", "q": "会议室的电脑___自己的电脑都可以。", "o": ["或者", "还是", "吗", "跟着"], "a": 0, "x": "Pernyataan = 或者.", "f": "会议室的电脑或者自己的电脑都可以。", "fp": "Huìyì shì de diànnǎo huòzhě zìjǐ de diànnǎo dōu kěyǐ."}, {"k": "11-1.2", "t": "pg", "q": "你可以坐地铁___打车去学校。", "o": ["或者", "还是", "但是", "而且"], "a": 0, "x": "Pernyataan, bukan pertanyaan.", "f": "你可以坐地铁或者打车去学校。", "fp": "Nǐ kěyǐ zuò dìtiě huòzhě dǎchē qù xuéxiào."}, {"k": "11-1.3", "t": "pg", "q": "\"Kamu orang Tiongkok atau orang Jepang?\" =", "o": ["你是中国人还是日本人？", "你是中国人或者日本人？", "你是中国人还是日本人吗？", "你是中国人或者日本人吗？"], "a": 0, "x": "还是, tanpa 吗."}, {"k": "11-1.4", "t": "pg", "q": "我还没想好明天去___后天去。", "o": ["还是", "或者", "和", "就"], "a": 0, "x": "Setelah 没想好 (pertanyaan tidak langsung) memakai 还是.", "f": "我还没想好明天去还是后天去。", "fp": "Wǒ hái méi xiǎng hǎo míngtiān qù háishi hòutiān qù."}, {"k": "11-1.5", "t": "pg", "q": "A：你想吃中国菜还是日本菜？ B：___都可以。", "o": ["中国菜或者日本菜", "中国菜还是日本菜", "中国菜还是日本菜吗", "或者中国菜还是日本菜"], "a": 0, "x": "Jawaban berupa pernyataan → 或者."}, {"k": "11-1.6", "t": "su", "w": ["你", "喝", "茶", "还是", "喝", "咖啡"], "s": "你喝茶还是喝咖啡？", "alt": [], "p": "Nǐ hē chá háishi hē kāfēi?", "x": "Kamu minum teh atau kopi?"}, {"k": "11-1.7", "t": "su", "w": ["我们", "用", "会议室", "的", "电脑", "还是", "自己", "的", "电脑"], "s": "我们用会议室的电脑还是自己的电脑？", "alt": [], "p": "Wǒmen yòng huìyì shì de diànnǎo háishi zìjǐ de diànnǎo?", "x": "Kita pakai komputer ruang rapat atau komputer sendiri?"}, {"k": "11-1.8", "t": "su", "w": ["会议室", "的", "电脑", "或者", "自己", "的", "电脑", "都", "可以"], "s": "会议室的电脑或者自己的电脑都可以。", "alt": [], "p": "Huìyì shì de diànnǎo huòzhě zìjǐ de diànnǎo dōu kěyǐ.", "x": "Komputer ruang rapat atau komputer sendiri, dua-duanya boleh."}, {"k": "11-1.9", "t": "su", "w": ["你", "可以", "坐", "地铁", "或者", "打车", "去", "学校"], "s": "你可以坐地铁或者打车去学校。", "alt": [], "p": "Nǐ kěyǐ zuò dìtiě huòzhě dǎchē qù xuéxiào.", "x": "Kamu bisa ke sekolah naik kereta bawah tanah atau taksi."}, {"k": "11-1.10", "t": "su", "w": ["我", "不", "知道", "他", "今天", "来", "还是", "明天", "来"], "s": "我不知道他今天来还是明天来。", "alt": [], "p": "Wǒ bù zhīdào tā jīntiān lái háishi míngtiān lái.", "x": "Aku tidak tahu dia datang hari ini atau besok."}, {"k": "11-1.11", "t": "bs", "s": "你是老师还是学生？", "sp": "Nǐ shì lǎoshī háishi xuéshēng?", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "11-1.12", "t": "bs", "s": "你想去北京或者上海？", "sp": "Nǐ xiǎng qù Běijīng huòzhě Shànghǎi?", "n": "", "ok": false, "b": "你想去北京还是上海？", "bp": "Nǐ xiǎng qù Běijīng háishi Shànghǎi?", "x": "Pertanyaan pilihan → 还是."}, {"k": "11-1.13", "t": "bs", "s": "周末我想去看电影或者去公园。", "sp": "Zhōumò wǒ xiǎng qù kàn diànyǐng huòzhě qù gōngyuán.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "11-1.14", "t": "bs", "s": "明天还是后天我都有时间。", "sp": "Míngtiān háishi hòutiān wǒ dōu yǒu shíjiān.", "n": "", "ok": false, "b": "明天或者后天我都有时间。", "bp": "Míngtiān huòzhě hòutiān wǒ dōu yǒu shíjiān.", "x": "Pernyataan → 或者."}, {"k": "11-1.15", "t": "bs", "s": "你喝茶还是咖啡吗？", "sp": "Nǐ hē chá háishi kāfēi ma?", "n": "", "ok": false, "b": "你喝茶还是咖啡？", "bp": "Nǐ hē chá háishi kāfēi?", "x": "Kalimat 还是 tidak memakai 吗."}]}, {"id": "11-2", "pel": 11, "judul": "Frasa tetap 看来 (kelihatannya / rupanya)", "kode": "固定短语\"看来\"", "rumus": ["(Bukti/keadaan)，看来 + kesimpulan", "看来 + S + ……", "S + 看来 + ……"], "jelas": ["看来 (kànlái) diikuti sebuah KESIMPULAN. Pembicara menarik kesimpulan atau dugaan setelah melihat atau memikirkan keadaan sekarang: 这么晚了，看来他今天不会来了 = sudah selarut ini, kelihatannya dia tidak akan datang hari ini.", "Biasanya ada BUKTI dulu, lalu 看来 + kesimpulan: 电梯坏了，看来咱们只能走下去了 (lift rusak → kita hanya bisa turun lewat tangga). Kadang buktinya sudah jelas dari situasi, jadi 看来 langsung di awal: 看来我没办法解决这个问题.", "看来 biasanya di awal klausa (sebelum subjek), tetapi juga bisa sesudah subjek: 他看来不会来了. Kesimpulannya sering memakai 会, 要……了, 只能, 应该: 天阴了，看来要下雨了.", "Bedakan 看来 dengan 看起来/看上去 (pelajaran 1): 看起来 berarti \"kelihatannya\" berdasarkan penampilan yang terlihat mata: 他看起来很年轻 (dia tampak muda). 看来 adalah kesimpulan dari bukti: 他一直没接电话，看来很忙 (dia terus tidak mengangkat telepon, rupanya sibuk).", "Jebakan bagi pelajar Indonesia: kata \"kelihatannya\" dipakai untuk keduanya. Tanyakan: apakah saya menilai PENAMPILAN (pakai 看起来) atau MENYIMPULKAN dari kejadian (pakai 看来)? Selain itu, kesimpulan dengan 看来 adalah pernyataan, jadi tidak diakhiri 吗.", "Bedakan juga dengan 我看 (menurutku): 我看你应该休息一下 = menurutku kamu perlu istirahat. 看来 tidak membutuhkan subjek 我."], "poin": ["看来 + kesimpulan dari bukti.", "Pola umum: bukti，看来 + kesimpulan.", "看来 (menyimpulkan) ≠ 看起来 (penampilan).", "Kalimat pernyataan, tanpa 吗."], "contoh": [{"zh": "看来我没办法解决这个问题。", "py": "Kànlái wǒ méi bànfǎ jiějué zhège wèntí.", "id": "Rupanya aku tidak bisa menyelesaikan masalah ini.", "b": true, "tr": "11-3"}, {"zh": "这么晚了，看来他今天不会来了。", "py": "Zhème wǎn le, kànlái tā jīntiān bú huì lái le.", "id": "Sudah selarut ini, kelihatannya dia tidak akan datang hari ini.", "b": true, "tr": null}, {"zh": "电梯坏了，看来咱们只能走下去了。", "py": "Diàntī huài le, kànlái zánmen zhǐnéng zǒu xiàqù le.", "id": "Liftnya rusak, kelihatannya kita hanya bisa turun jalan kaki.", "b": true, "tr": null}, {"zh": "看来我没办法解决这个问题，只能找别人来帮帮忙了。", "py": "Kànlái wǒ méi bànfǎ jiějué zhège wèntí, zhǐnéng zhǎo biérén lái bāng bāngmáng le.", "id": "Rupanya aku tidak bisa menyelesaikan masalah ini, hanya bisa minta orang lain membantu.", "b": true, "tr": "11-3"}, {"zh": "现在外面天阴得很，看来要下雨了。", "py": "Xiànzài wàimiàn tiān yīn de hěn, kànlái yào xià yǔ le.", "id": "Sekarang di luar mendung sekali, kelihatannya akan hujan.", "b": false, "tr": null}, {"zh": "他最近工作太忙了，看来没有时间去旅游了。", "py": "Tā zuìjìn gōngzuò tài máng le, kànlái méiyǒu shíjiān qù lǚyóu le.", "id": "Akhir-akhir ini dia terlalu sibuk bekerja, kelihatannya tidak ada waktu untuk berwisata.", "b": false, "tr": null}, {"zh": "他一直没接电话，看来他在开会。", "py": "Tā yìzhí méi jiē diànhuà, kànlái tā zài kāihuì.", "id": "Dia terus tidak mengangkat telepon, rupanya dia sedang rapat.", "b": false, "tr": null}, {"zh": "你吃了这么多，看来你很喜欢这个菜。", "py": "Nǐ chī le zhème duō, kànlái nǐ hěn xǐhuan zhège cài.", "id": "Kamu makan sebanyak ini, rupanya kamu sangat suka masakan ini.", "b": false, "tr": null}, {"zh": "大家都笑了，看来他的话很有意思。", "py": "Dàjiā dōu xiào le, kànlái tā dehuà hěn yǒuyìsi.", "id": "Semua orang tertawa, rupanya perkataannya lucu.", "b": false, "tr": null}, {"zh": "他又迟到了，看来明天我们得早点儿叫他。", "py": "Tā yòu chídào le, kànlái míngtiān wǒmen de zǎo diǎnr jiào tā.", "id": "Dia terlambat lagi, kelihatannya besok kita harus membangunkannya lebih awal.", "b": false, "tr": null}], "salah": [{"s": "他看来很年轻。", "sp": "Tā kànlái hěn niánqīng.", "n": "wajahnya tampak muda", "b": "他看起来很年轻。", "bp": "Tā kàn qǐlái hěn niánqīng.", "a": "Menilai penampilan = 看起来."}, {"s": "这么晚了，看来他不会来了吗？", "sp": "Zhème wǎn le, kànlái tā bú huì lái le ma?", "n": "", "b": "这么晚了，看来他不会来了。", "bp": "Zhème wǎn le, kànlái tā bú huì lái le.", "a": "Kesimpulan dengan 看来 adalah pernyataan."}, {"s": "我看来你应该休息一下。", "sp": "Wǒ kànlái nǐ yīnggāi xiūxi yíxià.", "n": "menurutku", "b": "我看你应该休息一下。", "bp": "Wǒ kàn nǐ yīnggāi xiūxi yíxià.", "a": "\"Menurutku\" = 我看; 看来 tidak memakai subjek 我."}], "latihan": [{"k": "11-2.0", "t": "pg", "q": "这么晚了，___他今天不会来了。", "o": ["看来", "看起来很", "看看", "看过"], "a": 0, "x": "Kesimpulan dari bukti (sudah larut) = 看来.", "f": "这么晚了，看来他今天不会来了。", "fp": "Zhème wǎn le, kànlái tā jīntiān bú huì lái le."}, {"k": "11-2.1", "t": "pg", "q": "他___很年轻，可是已经五十岁了。", "o": ["看起来", "看来", "看见", "看完"], "a": 0, "x": "Penampilan = 看起来.", "f": "他看起来很年轻，可是已经五十岁了。", "fp": "Tā kàn qǐlái hěn niánqīng, kěshì yǐjīng wǔshí suì le."}, {"k": "11-2.2", "t": "pg", "q": "电梯坏了，看来咱们只能___了。", "o": ["走下去", "坐电梯", "不用走", "很高兴"], "a": 0, "x": "Kesimpulan yang logis dari lift rusak.", "f": "电梯坏了，看来咱们只能走下去了。", "fp": "Diàntī huài le, kànlái zánmen zhǐnéng zǒu xiàqù le."}, {"k": "11-2.3", "t": "pg", "q": "\"Dia terus tidak mengangkat telepon, rupanya dia sibuk\" =", "o": ["他一直没接电话，看来他很忙。", "他一直没接电话，看起来他很忙吗？", "看来他一直没接电话，他很忙吗？", "他看来一直很忙接电话。"], "a": 0, "x": "Bukti，看来 + kesimpulan."}, {"k": "11-2.4", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["天阴了，看来要下雨了。", "天阴了，看来要下雨了吗？", "看来天阴了要下雨吗？", "天阴了，看来下雨了要。"], "a": 0, "x": "Pernyataan, tanpa 吗."}, {"k": "11-2.5", "t": "pg", "q": "大家都笑了，___。", "o": ["看来他的话很有意思", "看来他很漂亮吗", "看起来电话", "看来我不知道吗"], "a": 0, "x": "Kesimpulan logis dari semua orang tertawa.", "f": "大家都笑了，看来他的话很有意思。", "fp": "Dàjiā dōu xiào le, kànlái tā dehuà hěn yǒuyìsi."}, {"k": "11-2.6", "t": "su", "w": ["看来", "我", "没", "办法", "解决", "这个", "问题"], "s": "看来我没办法解决这个问题。", "alt": [], "p": "Kànlái wǒ méi bànfǎ jiějué zhège wèntí.", "x": "Rupanya aku tidak bisa menyelesaikan masalah ini."}, {"k": "11-2.7", "t": "su", "w": ["这么", "晚", "了，", "看来", "他", "不", "会", "来", "了"], "s": "这么晚了，看来他不会来了。", "alt": [], "p": "Zhème wǎn le, kànlái tā bú huì lái le.", "x": "Sudah selarut ini, kelihatannya dia tidak akan datang."}, {"k": "11-2.8", "t": "su", "w": ["电梯", "坏", "了，", "看来", "咱们", "只能", "走", "下去", "了"], "s": "电梯坏了，看来咱们只能走下去了。", "alt": [], "p": "Diàntī huài le, kànlái zánmen zhǐnéng zǒu xiàqù le.", "x": "Liftnya rusak, kelihatannya kita hanya bisa turun jalan kaki."}, {"k": "11-2.9", "t": "su", "w": ["天", "阴", "了，", "看来", "要", "下雨", "了"], "s": "天阴了，看来要下雨了。", "alt": [], "p": "Tiān yīn le, kànlái yào xià yǔ le.", "x": "Langit mendung, kelihatannya akan hujan."}, {"k": "11-2.10", "t": "su", "w": ["他", "一直", "没", "接", "电话，", "看来", "很", "忙"], "s": "他一直没接电话，看来很忙。", "alt": [], "p": "Tā yìzhí méi jiē diànhuà, kànlái hěn máng.", "x": "Dia terus tidak mengangkat telepon, rupanya sibuk."}, {"k": "11-2.11", "t": "bs", "s": "你吃了这么多，看来你很喜欢这个菜。", "sp": "Nǐ chī le zhème duō, kànlái nǐ hěn xǐhuan zhège cài.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "11-2.12", "t": "bs", "s": "这件衣服看来很漂亮。", "sp": "Zhè jiàn yīfu kànlái hěn piàoliang.", "n": "", "ok": false, "b": "这件衣服看起来很漂亮。", "bp": "Zhè jiàn yīfu kàn qǐlái hěn piàoliang.", "x": "Penampilan = 看起来."}, {"k": "11-2.13", "t": "bs", "s": "这么晚了，看来他今天不会来了。", "sp": "Zhème wǎn le, kànlái tā jīntiān bú huì lái le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "11-2.14", "t": "bs", "s": "电梯坏了，看来咱们只能走下去了吗？", "sp": "Diàntī huài le, kànlái zánmen zhǐnéng zǒu xiàqù le ma?", "n": "", "ok": false, "b": "电梯坏了，看来咱们只能走下去了。", "bp": "Diàntī huài le, kànlái zánmen zhǐnéng zǒu xiàqù le.", "x": "Kesimpulan 看来 berupa pernyataan."}, {"k": "11-2.15", "t": "bs", "s": "他又没来上课，看来他生病了。", "sp": "Tā yòu méi lái shàngkè, kànlái tā shēngbìng le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "11-3", "pel": 11, "judul": "Kalimat 把 (3): S + 把 + O + KK + pelengkap hasil", "kode": "\"把\"字句（3）", "rumus": ["S + 把 + O + KK + pelengkap hasil (+ 了)", "完 / 好 / 干净 / 清楚 / 错 / 坏 sebagai pelengkap", "S + 没/还没 + 把 + O + KK + pelengkap (+ 呢)"], "jelas": ["Pola 把 (3) menyatakan bahwa tindakan terhadap benda/orang tertentu menghasilkan suatu HASIL. Hasilnya ditunjukkan oleh pelengkap hasil sesudah kata kerja: 妈妈把衣服洗干净了 = ibu mencuci baju sampai bersih.", "Susunannya: Subjek + 把 + objek + kata kerja + pelengkap hasil. Pelengkap yang sering dipakai: 完 (selesai), 好 (beres/baik), 干净 (bersih), 清楚 (jelas), 错 (salah), 坏 (rusak), 懂 (paham). Contoh: 我跟您一起把这些工作做完. 你帮我把电脑接好吧.", "Aturan umum kalimat 把 tetap berlaku: objek harus tertentu; 不/没/能/要 diletakkan sebelum 把: 他还没把笔记本电脑接好呢. Kata kerja tidak boleh berdiri sendiri: 我把作业写 salah, harus 我把作业写完了.", "Pelengkap KEMUNGKINAN (做得完/做不完, pelajaran 9) tidak boleh dipakai dengan 把. Untuk menyatakan \"bisa menyelesaikan\", pakai 能 sebelum 把: 我今天能把作业做完. Untuk \"tidak bisa\", pakai 不能把…… atau kalimat tanpa 把: 作业我今天做不完.", "Jebakan bagi pelajar Indonesia: bahasa Indonesia berkata \"aku sudah menyelesaikan PR\" atau \"aku mengerjakan PR sampai selesai\". Dalam Mandarin bisa 我写完作业了 atau 我把作业写完了. Kalimat 把 menekankan \"PR itu\" (yang sudah diketahui) dan hasilnya. Jangan menaruh 没 sesudah 把.", "Pola ini sering untuk permintaan: 请把门关好 (tolong tutup pintu baik-baik), 你把这个句子读清楚."], "poin": ["把 + O + KK + pelengkap hasil.", "Pelengkap: 完/好/干净/清楚/错/懂.", "没/还没 sebelum 把.", "Tidak memakai pelengkap kemungkinan (做不完) dengan 把."], "contoh": [{"zh": "我跟您一起把这些工作做完。", "py": "Wǒ gēn nín yìqǐ bǎ zhèxiē gōngzuò zuò wán.", "id": "Aku bersama Anda akan menyelesaikan pekerjaan-pekerjaan ini.", "b": true, "tr": "11-5"}, {"zh": "妈妈把衣服洗干净了。", "py": "Māma bǎ yīfu xǐ gānjìng le.", "id": "Ibu mencuci baju sampai bersih.", "b": true, "tr": null}, {"zh": "他还没把笔记本电脑接好呢。", "py": "Tā hái méi bǎ bǐjìběn diànnǎo jiē hǎo ne.", "id": "Dia belum selesai memasang laptopnya.", "b": true, "tr": null}, {"zh": "那到时候咱们早点儿过去，你帮我把电脑接好吧。", "py": "Nà dào shíhou zánmen zǎo diǎnr guòqù, nǐ bāng wǒ bǎ diànnǎo jiē hǎo ba.", "id": "Kalau begitu nanti kita ke sana lebih awal, tolong bantu aku memasang komputernya.", "b": true, "tr": "11-1"}, {"zh": "吃完饭，我跟您一起把这些工作做完。", "py": "Chī wán fàn, wǒ gēn nín yìqǐ bǎ zhèxiē gōngzuò zuò wán.", "id": "Setelah makan, aku bersama Anda menyelesaikan pekerjaan ini.", "b": true, "tr": "11-5"}, {"zh": "我已经把作业写完了。", "py": "Wǒ yǐjīng bǎ zuòyè xiě wán le.", "id": "Aku sudah menyelesaikan PR.", "b": false, "tr": null}, {"zh": "请把门关好。", "py": "Qǐng bǎ mén guān hǎo.", "id": "Tolong tutup pintunya baik-baik.", "b": false, "tr": null}, {"zh": "你把这个句子读清楚。", "py": "Nǐ bǎ zhège jùzi dú qīngchu.", "id": "Bacalah kalimat ini dengan jelas.", "b": false, "tr": null}, {"zh": "弟弟把蛋糕吃完了。", "py": "Dìdi bǎ dàngāo chī wán le.", "id": "Adik menghabiskan kuenya.", "b": false, "tr": null}, {"zh": "对不起，我把你的名字写错了。", "py": "Duìbuqǐ, wǒ bǎ nǐ de míngzi xiě cuò le.", "id": "Maaf, aku salah menulis namamu.", "b": false, "tr": null}], "salah": [{"s": "我把作业写。", "sp": "Wǒ bǎ zuòyè xiě.", "n": "", "b": "我把作业写完了。", "bp": "Wǒ bǎ zuòyè xiě wán le.", "a": "Kata kerja 把 perlu pelengkap."}, {"s": "我把作业没写完。", "sp": "Wǒ bǎ zuòyè méi xiě wán.", "n": "", "b": "我没把作业写完。", "bp": "Wǒ méi bǎ zuòyè xiě wán.", "a": "没 sebelum 把."}, {"s": "我把这些工作做不完。", "sp": "Wǒ bǎ zhèxiē gōngzuò zuò bù wán.", "n": "", "b": "这些工作我做不完。", "bp": "Zhèxiē gōngzuò wǒ zuò bù wán.", "a": "Pelengkap kemungkinan tidak dipakai dengan 把."}, {"s": "请把一个门关好。", "sp": "Qǐng bǎ yí gè mén guān hǎo.", "n": "", "b": "请把门关好。", "bp": "Qǐng bǎ mén guān hǎo.", "a": "Objek 把 harus tertentu, tanpa 一个."}], "latihan": [{"k": "11-3.0", "t": "pg", "q": "妈妈把衣服洗___了。", "o": ["干净", "得干净", "很干净", "干净得"], "a": 0, "x": "KK + pelengkap hasil.", "f": "妈妈把衣服洗干净了。", "fp": "Māma bǎ yīfu xǐ gānjìng le."}, {"k": "11-3.1", "t": "pg", "q": "他还没把电脑接___呢。", "o": ["好", "得好", "不好", "着"], "a": 0, "x": "接好 = terpasang dengan beres.", "f": "他还没把电脑接好呢。", "fp": "Tā hái méi bǎ diànnǎo jiē hǎo ne."}, {"k": "11-3.2", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["我没把作业写完。", "我把作业没写完。", "我把没作业写完。", "我把作业写没完。"], "a": 0, "x": "没 sebelum 把."}, {"k": "11-3.3", "t": "pg", "q": "\"Aku sudah menghabiskan kue itu\" =", "o": ["我已经把蛋糕吃完了。", "我已经把蛋糕吃了完。", "我把已经蛋糕吃完了。", "我已经吃把蛋糕完了。"], "a": 0, "x": "把 + O + KK + 完."}, {"k": "11-3.4", "t": "pg", "q": "Mana yang SALAH?", "o": ["我把这些工作做不完。", "我能把这些工作做完。", "这些工作我做不完。", "我把这些工作做完了。"], "a": 0, "x": "把 tidak dipakai dengan pelengkap kemungkinan."}, {"k": "11-3.5", "t": "pg", "q": "对不起，我把你的名字写___了。", "o": ["错", "坏", "干净", "懂"], "a": 0, "x": "写错 = salah tulis.", "f": "对不起，我把你的名字写错了。", "fp": "Duìbuqǐ, wǒ bǎ nǐ de míngzi xiě cuò le."}, {"k": "11-3.6", "t": "su", "w": ["我", "跟", "您", "一起", "把", "这些", "工作", "做", "完"], "s": "我跟您一起把这些工作做完。", "alt": [], "p": "Wǒ gēn nín yìqǐ bǎ zhèxiē gōngzuò zuò wán.", "x": "Aku bersama Anda menyelesaikan pekerjaan-pekerjaan ini."}, {"k": "11-3.7", "t": "su", "w": ["妈妈", "把", "衣服", "洗", "干净", "了"], "s": "妈妈把衣服洗干净了。", "alt": [], "p": "Māma bǎ yīfu xǐ gānjìng le.", "x": "Ibu mencuci baju sampai bersih."}, {"k": "11-3.8", "t": "su", "w": ["他", "还", "没", "把", "电脑", "接", "好", "呢"], "s": "他还没把电脑接好呢。", "alt": [], "p": "Tā hái méi bǎ diànnǎo jiē hǎo ne.", "x": "Dia belum selesai memasang komputernya."}, {"k": "11-3.9", "t": "su", "w": ["请", "把", "门", "关", "好"], "s": "请把门关好。", "alt": [], "p": "Qǐng bǎ mén guān hǎo.", "x": "Tolong tutup pintunya baik-baik."}, {"k": "11-3.10", "t": "su", "w": ["我", "已经", "把", "作业", "写", "完", "了"], "s": "我已经把作业写完了。", "alt": [], "p": "Wǒ yǐjīng bǎ zuòyè xiě wán le.", "x": "Aku sudah menyelesaikan PR."}, {"k": "11-3.11", "t": "bs", "s": "弟弟把蛋糕吃完了。", "sp": "Dìdi bǎ dàngāo chī wán le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "11-3.12", "t": "bs", "s": "我把衣服洗。", "sp": "Wǒ bǎ yīfu xǐ.", "n": "", "ok": false, "b": "我把衣服洗干净了。", "bp": "Wǒ bǎ yīfu xǐ gānjìng le.", "x": "Perlu pelengkap hasil."}, {"k": "11-3.13", "t": "bs", "s": "你帮我把电脑接好吧。", "sp": "Nǐ bāng wǒ bǎ diànnǎo jiē hǎo ba.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "11-3.14", "t": "bs", "s": "我把作业还没写完。", "sp": "Wǒ bǎ zuòyè hái méi xiě wán.", "n": "", "ok": false, "b": "我还没把作业写完。", "bp": "Wǒ hái méi bǎ zuòyè xiě wán.", "x": "还没 sebelum 把."}, {"k": "11-3.15", "t": "bs", "s": "请你把这个句子读清楚。", "sp": "Qǐng nǐ bǎ zhège jùzi dú qīngchu.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "11-4", "pel": 11, "judul": "Pola tetap: 对……来说 (bagi …)", "kode": "固定格式\"对……来说\"", "rumus": ["对 + orang/kelompok + 来说，+ pendapat/keadaan", "S + 对 + orang + 来说 + …… (jarang)", "Bukan: 对 + orang + KS (他对我很好 = terhadap)"], "jelas": ["对……来说 artinya \"bagi … / menurut sudut pandang …\". Pola ini menunjukkan untuk SIAPA sebuah pendapat, perasaan, atau keadaan berlaku: 对她来说，学习汉语很有意思 = bagi dia, belajar bahasa Mandarin sangat menarik.", "Biasanya diletakkan di AWAL kalimat, lalu koma: 对 + orang/kelompok + 来说，+ isi kalimat. Orangnya bisa kata ganti (我, 她), kata benda (孩子, 年轻人, 学生), atau frasa (很多人).", "Isi kalimat sesudahnya biasanya penilaian: 很重要, 很难, 很有意思, 比……更……, 是一种……: 对孩子来说，玩也是一种学习. 对我来说，生活也很重要.", "Bedakan dengan 对 biasa (terhadap/kepada): 他对我很好 = dia baik terhadapku; 老师对学生很热情. Di sini tidak ada 来说. 对我来说，他很好 artinya lain: \"bagiku, dia (orang yang) baik\".", "Jebakan bagi pelajar Indonesia: \"bagi saya\" sering diterjemahkan menjadi 为我 atau 给我. Yang tepat untuk sudut pandang adalah 对我来说. Jangan lupa 来说 di belakang dan jangan menukar urutannya (对来说我 salah).", "Karena 对我来说 sudah berarti \"bagiku\", tidak perlu ditambah 我觉得 lagi; cukup salah satu."], "poin": ["对 + orang + 来说 = bagi ….", "Di awal kalimat, lalu koma.", "Diikuti penilaian/pendapat.", "Beda dengan 对 = terhadap (他对我很好)."], "contoh": [{"zh": "对我来说，生活也很重要，我不愿意为工作或学习离开家人。", "py": "Duì wǒ lái shuō, shēnghuó yě hěn zhòngyào, wǒ bú yuànyì wèi gōngzuò huò xuéxí líkāi jiārén.", "id": "Bagiku, kehidupan (keluarga) juga penting, aku tidak mau meninggalkan keluarga demi pekerjaan atau belajar.", "b": true, "tr": "11-7"}, {"zh": "对她来说，学习汉语很有意思。", "py": "Duì tā lái shuō, xuéxí Hànyǔ hěn yǒuyìsi.", "id": "Bagi dia, belajar bahasa Mandarin sangat menarik.", "b": true, "tr": null}, {"zh": "对孩子来说，玩也是一种学习。", "py": "Duì háizi lái shuō, wán yě shì yì zhǒng xuéxí.", "id": "Bagi anak-anak, bermain juga salah satu cara belajar.", "b": true, "tr": null}, {"zh": "对很多人来说，如果身体不舒服就会去找他。", "py": "Duì hěn duō rén lái shuō, rúguǒ shēntǐ bù shūfu jiù huì qù zhǎo tā.", "id": "Bagi banyak orang, kalau badan tidak enak, mereka akan mencarinya.", "b": true, "tr": null}, {"zh": "对年轻人来说，找工作的时候机会最重要。", "py": "Duì niánqīng rén lái shuō, zhǎo gōngzuò de shíhou jīhuì zuì zhòngyào.", "id": "Bagi anak muda, saat mencari kerja, kesempatan paling penting.", "b": false, "tr": null}, {"zh": "对我来说，汉字比语法难。", "py": "Duì wǒ lái shuō, Hànzì bǐ yǔ fǎ nán.", "id": "Bagiku, hanzi lebih sulit daripada tata bahasa.", "b": false, "tr": null}, {"zh": "对老人来说，北京的冬天太冷了。", "py": "Duì lǎorén lái shuō, Běijīng de dōngtiān tài lěng le.", "id": "Bagi orang tua, musim dingin di Beijing terlalu dingin.", "b": false, "tr": null}, {"zh": "对学生来说，这次考试很重要。", "py": "Duì xuéshēng lái shuō, zhè cì kǎoshì hěn zhòngyào.", "id": "Bagi para siswa, ujian kali ini sangat penting.", "b": false, "tr": null}, {"zh": "对你来说，什么样的工作比较合适？", "py": "Duì nǐ lái shuō, shénme yàng de gōngzuò bǐjiào héshì?", "id": "Bagimu, pekerjaan seperti apa yang cocok?", "b": false, "tr": null}, {"zh": "对我们来说，什么办法都比没办法好。", "py": "Duì wǒmen lái shuō, shénme bànfǎ dōu bǐ méi bànfǎ hǎo.", "id": "Bagi kita, cara apa pun lebih baik daripada tidak ada cara.", "b": false, "tr": null}], "salah": [{"s": "为我来说，家人最重要。", "sp": "Wèi wǒ lái shuō, jiārén zuì zhòngyào.", "n": "", "b": "对我来说，家人最重要。", "bp": "Duì wǒ lái shuō, jiārén zuì zhòngyào.", "a": "Sudut pandang = 对……来说."}, {"s": "对来说我，汉字很难。", "sp": "Duì lái shuō wǒ, Hànzì hěn nán.", "n": "", "b": "对我来说，汉字很难。", "bp": "Duì wǒ lái shuō, Hànzì hěn nán.", "a": "Orangnya di antara 对 dan 来说."}, {"s": "对我，学习汉语很有意思。", "sp": "Duì wǒ, xuéxí Hànyǔ hěn yǒuyìsi.", "n": "bagiku", "b": "对我来说，学习汉语很有意思。", "bp": "Duì wǒ lái shuō, xuéxí Hànyǔ hěn yǒuyìsi.", "a": "Jangan lupa 来说."}], "latihan": [{"k": "11-4.0", "t": "pg", "q": "___我来说，生活也很重要。", "o": ["对", "为", "给", "跟"], "a": 0, "x": "对……来说.", "f": "对我来说，生活也很重要。", "fp": "Duì wǒ lái shuō, shēnghuó yě hěn zhòngyào."}, {"k": "11-4.1", "t": "pg", "q": "对孩子___，玩也是一种学习。", "o": ["来说", "说来", "来讲说", "的说"], "a": 0, "x": "对 + orang + 来说.", "f": "对孩子来说，玩也是一种学习。", "fp": "Duì háizi lái shuō, wán yě shì yì zhǒng xuéxí."}, {"k": "11-4.2", "t": "pg", "q": "\"Bagi dia, belajar bahasa Mandarin sangat menarik\" =", "o": ["对她来说，学习汉语很有意思。", "为她来说，学习汉语很有意思。", "她对来说，学习汉语很有意思。", "对她说，学习汉语很有意思。"], "a": 0, "x": "对她来说."}, {"k": "11-4.3", "t": "pg", "q": "Mana yang artinya \"dia baik terhadapku\"?", "o": ["他对我很好。", "对我来说，他很好。", "他对我来说很好。", "他给我来说很好。"], "a": 0, "x": "对 = terhadap, tanpa 来说."}, {"k": "11-4.4", "t": "pg", "q": "对年轻人来说，___。", "o": ["找工作的时候机会最重要", "他们很年轻吗", "来说很好", "我对他很好"], "a": 0, "x": "Sesudah 对……来说 ada penilaian.", "f": "对年轻人来说，找工作的时候机会最重要。", "fp": "Duì niánqīng rén lái shuō, zhǎo gōngzuò de shíhou jīhuì zuì zhòngyào."}, {"k": "11-4.5", "t": "pg", "q": "A：对你来说，什么最重要？ B：___。", "o": ["对我来说，家人最重要", "我对家人来说", "对家人重要我", "我来说对家人"], "a": 0, "x": "Jawaban mengulang pola 对我来说."}, {"k": "11-4.6", "t": "su", "w": ["对", "我", "来说，", "生活", "也", "很", "重要"], "s": "对我来说，生活也很重要。", "alt": [], "p": "Duì wǒ lái shuō, shēnghuó yě hěn zhòngyào.", "x": "Bagiku, kehidupan juga penting."}, {"k": "11-4.7", "t": "su", "w": ["对", "她", "来说，", "学习", "汉语", "很", "有", "意思"], "s": "对她来说，学习汉语很有意思。", "alt": [], "p": "Duì tā lái shuō, xuéxí Hànyǔ hěn yǒuyìsi.", "x": "Bagi dia, belajar bahasa Mandarin sangat menarik."}, {"k": "11-4.8", "t": "su", "w": ["对", "孩子", "来说，", "玩", "也", "是", "一", "种", "学习"], "s": "对孩子来说，玩也是一种学习。", "alt": [], "p": "Duì háizi lái shuō, wán yě shì yì zhǒng xuéxí.", "x": "Bagi anak-anak, bermain juga salah satu cara belajar."}, {"k": "11-4.9", "t": "su", "w": ["对", "我", "来说，", "汉字", "比", "语法", "难"], "s": "对我来说，汉字比语法难。", "alt": [], "p": "Duì wǒ lái shuō, Hànzì bǐ yǔ fǎ nán.", "x": "Bagiku, hanzi lebih sulit daripada tata bahasa."}, {"k": "11-4.10", "t": "su", "w": ["对", "你", "来说，", "什么", "样", "的", "工作", "比较", "合适"], "s": "对你来说，什么样的工作比较合适？", "alt": [], "p": "Duì nǐ lái shuō, shénme yàng de gōngzuò bǐjiào héshì?", "x": "Bagimu, pekerjaan seperti apa yang cocok?"}, {"k": "11-4.11", "t": "bs", "s": "对学生来说，这次考试很重要。", "sp": "Duì xuéshēng lái shuō, zhè cì kǎoshì hěn zhòngyào.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "11-4.12", "t": "bs", "s": "给我来说，汉字很难。", "sp": "Gěi wǒ lái shuō, Hànzì hěn nán.", "n": "", "ok": false, "b": "对我来说，汉字很难。", "bp": "Duì wǒ lái shuō, Hànzì hěn nán.", "x": "Sudut pandang = 对……来说."}, {"k": "11-4.13", "t": "bs", "s": "对老人来说，北京的冬天太冷了。", "sp": "Duì lǎorén lái shuō, Běijīng de dōngtiān tài lěng le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "11-4.14", "t": "bs", "s": "对我，家人最重要。", "sp": "Duì wǒ, jiārén zuì zhòngyào.", "n": "", "ok": false, "b": "对我来说，家人最重要。", "bp": "Duì wǒ lái shuō, jiārén zuì zhòngyào.", "x": "Tambahkan 来说."}, {"k": "11-4.15", "t": "bs", "s": "老师对我们很热情。", "sp": "Lǎoshī duì wǒmen hěn rèqíng.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 对 = terhadap."}]}, {"id": "12-1", "pel": 12, "judul": "Kalimat pilihan: 或者……，或者…… (bisa … bisa juga …)", "kode": "选择复句\"或者……，或者……\"", "rumus": ["或者 + A，或者 + B (，……)", "S + 或者 + A，或者 + B", "或者 A，或者 B，或者 C"], "jelas": ["或者……，或者…… menyatakan memilih SATU dari dua kemungkinan atau lebih: \"bisa A, bisa juga B\". Banyak dipakai dalam bahasa lisan: 或者明天去，或者后天去，我给你打电话 = entah besok atau lusa, nanti aku telepon.", "Setiap pilihan diawali 或者 dan dipisah dengan koma. Jika ada subjek yang sama, subjek diletakkan sekali di depan: 我们或者今天去电影院看电影，或者明天在家看电影. Pilihan bisa lebih dari dua: 或者吃中国菜，或者吃日本菜，或者吃泰国菜.", "Pola ini adalah PERNYATAAN, bukan pertanyaan. Untuk menanyakan pilihan, gunakan 还是 (pelajaran 11): 你今天去还是明天去？ Jawabannya bisa memakai 或者……或者……: 或者今天，或者明天，都可以.", "Bedakan dengan 或者 tunggal (pelajaran 11): 坐地铁或者打车 menghubungkan dua kata/frasa pendek. 或者……，或者…… menghubungkan dua klausa yang lebih panjang dan memberi kesan \"ada beberapa kemungkinan, salah satunya akan dipilih\".", "Jebakan bagi pelajar Indonesia: bahasa Indonesia \"atau … atau …\" jarang dipakai dan lebih alami \"bisa … bisa juga …\" atau \"entah … entah …\". Dalam Mandarin pola ini wajar. Jangan mencampur 或者 dengan 还是 dalam satu pernyataan (或者……还是……).", "Kalimat sesudah pilihan-pilihan sering menjelaskan keputusan: ……，都可以 / ……，我给你打电话 / ……，你自己选."], "poin": ["或者A，或者B = bisa A, bisa juga B.", "Pernyataan; pertanyaan pakai 还是.", "Subjek sama ditulis sekali di depan.", "Bisa tiga pilihan atau lebih."], "contoh": [{"zh": "或者明天去，或者后天去，我给你打电话。", "py": "Huòzhě míngtiān qù, huòzhě hòutiān qù, wǒ gěi nǐ dǎdiànhuà.", "id": "Entah besok atau lusa, nanti aku telepon kamu.", "b": true, "tr": "12-1"}, {"zh": "我们或者今天去电影院看电影，或者明天在家看电影。", "py": "Wǒmen huòzhě jīntiān qù diànyǐngyuàn kàn diànyǐng, huòzhě míngtiān zài jiā kàn diànyǐng.", "id": "Kita bisa hari ini menonton film di bioskop, atau besok menonton film di rumah.", "b": true, "tr": null}, {"zh": "晚饭你自己选，或者吃中国菜，或者吃日本菜，或者吃泰国菜。", "py": "Wǎnfàn nǐ zìjǐ xuǎn, huòzhě chī Zhōngguó cài, huòzhě chī Rìběn cài, huòzhě chī Tàiguó cài.", "id": "Makan malam kamu pilih sendiri, bisa masakan Tiongkok, masakan Jepang, atau masakan Thailand.", "b": true, "tr": null}, {"zh": "行。或者明天去，或者后天去，我给你打电话。", "py": "Xíng. Huòzhě míngtiān qù, huòzhě hòutiān qù, wǒ gěi nǐ dǎdiànhuà.", "id": "Oke. Entah besok atau lusa, nanti aku telepon kamu.", "b": true, "tr": "12-1"}, {"zh": "周末我或者在家看书，或者去公园跑步。", "py": "Zhōumò wǒ huòzhě zài jiā kàn shū, huòzhě qù gōngyuán pǎobù.", "id": "Akhir pekan aku bisa membaca di rumah, bisa juga lari di taman.", "b": false, "tr": null}, {"zh": "下课以后，我或者去图书馆，或者回家休息。", "py": "Xiàkè yǐhòu, wǒ huòzhě qù túshūguǎn, huòzhě huí jiā xiūxi.", "id": "Sesudah kelas, aku ke perpustakaan atau pulang beristirahat.", "b": false, "tr": null}, {"zh": "这个问题你或者问老师，或者问同学。", "py": "Zhège wèntí nǐ huòzhě wèn lǎoshī, huòzhě wèn tóngxué.", "id": "Masalah ini bisa kamu tanyakan ke guru, atau ke teman sekelas.", "b": false, "tr": null}, {"zh": "明天天气不错，我们或者去爬山，或者去公园坐船。", "py": "Míngtiān tiānqì búcuò, wǒmen huòzhě qù pá shān, huòzhě qù gōngyuán zuò chuán.", "id": "Besok cuacanya bagus, kita bisa mendaki gunung atau naik perahu di taman.", "b": false, "tr": null}, {"zh": "考完试以后，我或者去旅游，或者回家看看爸妈。", "py": "Kǎo wán shì yǐhòu, wǒ huòzhě qù lǚyóu, huòzhě huí jiā kànkan bà mā.", "id": "Setelah ujian, aku akan berwisata atau pulang menjenguk orang tua.", "b": false, "tr": null}, {"zh": "去机场你或者坐地铁，或者打车，都很方便。", "py": "Qù jīchǎng nǐ huòzhě zuò dìtiě, huòzhě dǎchē, dōu hěn fāngbiàn.", "id": "Ke bandara kamu bisa naik kereta bawah tanah atau taksi, sama-sama praktis.", "b": false, "tr": null}], "salah": [{"s": "你或者喝茶，或者喝咖啡？", "sp": "Nǐ huòzhě hē chá, huòzhě hē kāfēi?", "n": "", "b": "你喝茶还是喝咖啡？", "bp": "Nǐ hē chá háishi hē kāfēi?", "a": "Pertanyaan pilihan memakai 还是."}, {"s": "我或者去图书馆，还是回家。", "sp": "Wǒ huòzhě qù túshūguǎn, háishi huí jiā.", "n": "", "b": "我或者去图书馆，或者回家。", "bp": "Wǒ huòzhě qù túshūguǎn, huòzhě huí jiā.", "a": "Pasangan 或者 adalah 或者."}], "latihan": [{"k": "12-1.0", "t": "pg", "q": "___明天去，或者后天去，我给你打电话。", "o": ["或者", "还是", "不但", "因为"], "a": 0, "x": "Pasangan: 或者……，或者…….", "f": "或者明天去，或者后天去，我给你打电话。", "fp": "Huòzhě míngtiān qù, huòzhě hòutiān qù, wǒ gěi nǐ dǎdiànhuà."}, {"k": "12-1.1", "t": "pg", "q": "周末我或者在家看书，___去公园跑步。", "o": ["或者", "还是", "而且", "所以"], "a": 0, "x": "或者……，或者 mendaki gunung atau naik perahu."}, {"k": "12-1.11", "t": "bs", "s": "下课以后，我或者去图书馆，或者回家。", "sp": "Xiàkè yǐhòu, wǒ huòzhě qù túshūguǎn, huòzhě huí jiā.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "12-1.12", "t": "bs", "s": "你或者坐地铁，或者打车？", "sp": "Nǐ huòzhě zuò dìtiě, huòzhě dǎchē?", "n": "", "ok": false, "b": "你坐地铁还是打车？", "bp": "Nǐ zuò dìtiě háishi dǎchē?", "x": "Pertanyaan memakai 还是."}, {"k": "12-1.13", "t": "bs", "s": "我们或者今天去，还是明天去。", "sp": "Wǒmen huòzhě jīntiān qù, háishi míngtiān qù.", "n": "", "ok": false, "b": "我们或者今天去，或者明天去。", "bp": "Wǒmen huòzhě jīntiān qù, huòzhě míngtiān qù.", "x": "Pasangan 或者 adalah 或者."}, {"k": "12-1.14", "t": "bs", "s": "晚饭或者吃中国菜，或者吃日本菜，你自己选。", "sp": "Wǎnfàn huòzhě chī Zhōngguó cài, huòzhě chī Rìběn cài, nǐ zìjǐ xuǎn.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "12-1.15", "t": "bs", "s": "去机场你或者坐地铁，或者打车，都很方便。", "sp": "Qù jīchǎng nǐ huòzhě zuò dìtiě, huòzhě dǎchē, dōu hěn fāngbiàn.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "12-2", "pel": 12, "judul": "Penggunaan kiasan pelengkap arah (2): KK/KS + 起来 (mulai)", "kode": "趋向补语的引申用法（2）", "rumus": ["KK + 起来 (mulai melakukan)", "KS + 起来 (mulai masuk keadaan baru)", "KK + 起 + objek + 来 (下起雨来, 刮起风来)"], "jelas": ["Arti dasar 起来 adalah \"bangun/naik\". Dalam penggunaan kiasan, 起来 sesudah kata kerja berarti tindakan MULAI terjadi: 雨已经下起来了 = hujan sudah mulai turun. Sesudah kata sifat berarti mulai MASUK ke keadaan baru: 最近天气热起来了 = akhir-akhir ini cuaca mulai panas.", "Jika kata kerjanya punya OBJEK, objek diletakkan DI ANTARA 起 dan 来: 刮起风来 (angin mulai bertiup), 下起雨来 (hujan mulai turun), 唱起歌来 (mulai menyanyi). Jangan bilang 刮风起来 atau 下起来雨.", "起来 dengan kata sifat biasanya untuk perubahan yang sedang berlangsung, sering dengan 了: 天气冷起来了, 他的身体好起来了, 大家都高兴起来了. Sering ada kata 突然 (tiba-tiba) atau 慢慢 (perlahan-lahan) di depannya.", "Bedakan dengan 下去 (pelajaran 8): 下去 = terus berlanjut (sudah mulai, akan terus), 起来 = baru mulai. 热起来了 = mulai panas; 再热下去 = kalau terus panas. Bedakan juga dengan 看起来 (pelajaran 1, \"kelihatannya\") yang merupakan makna lain.", "Jebakan bagi pelajar Indonesia: bahasa Indonesia berkata \"MULAI hujan\", \"mulai panas\" dengan kata \"mulai\" di depan. Dalam Mandarin bisa 开始下雨了, tetapi bentuk yang lebih hidup dan alami adalah KK/KS + 起来: 下起雨来了, 热起来了. Perhatikan posisi objek.", "Kata sifat yang sering dipakai: 热、冷、好、多、忙、高兴、紧张. Kata kerja: 下(雨)、刮(风)、笑、哭、唱(歌)、聊(天)、玩."], "poin": ["KK + 起来 = mulai melakukan.", "KS + 起来 = mulai masuk keadaan baru.", "Objek di tengah: 下起雨来.", "起来 (mulai) ≠ 下去 (terus berlanjut)."], "contoh": [{"zh": "雨已经下起来了。", "py": "Yǔ yǐjīng xià qǐlái le.", "id": "Hujan sudah mulai turun.", "b": true, "tr": "12-3"}, {"zh": "最近天气热起来了。", "py": "Zuìjìn tiānqì rè qǐlái le.", "id": "Akhir-akhir ini cuaca mulai panas.", "b": true, "tr": null}, {"zh": "怎么突然刮起风来了？", "py": "Zěnme tūrán guā qǐ fēng lái le?", "id": "Kenapa tiba-tiba angin mulai bertiup?", "b": true, "tr": null}, {"zh": "刚才还是大晴天呢，怎么突然就刮起风来了？", "py": "Gāngcái háishi dà qíng tiān ne, zěnme tūrán jiù guā qǐ fēng lái le?", "id": "Tadi masih cerah sekali, kenapa tiba-tiba angin bertiup?", "b": true, "tr": "12-3"}, {"zh": "雨已经下起来了，咱们快点儿走吧。", "py": "Yǔ yǐjīng xià qǐlái le, zánmen kuài diǎnr zǒu ba.", "id": "Hujan sudah mulai turun, ayo kita jalan lebih cepat.", "b": true, "tr": "12-3"}, {"zh": "看到那张照片，大家都笑起来了。", "py": "Kàn dào nà Zhāng zhàopiàn, dàjiā dōu xiào qǐlái le.", "id": "Melihat foto itu, semua orang mulai tertawa.", "b": false, "tr": null}, {"zh": "吃了药以后，他的身体好起来了。", "py": "Chī le yào yǐhòu, tā de shēntǐ hǎo qǐlái le.", "id": "Setelah minum obat, kesehatannya mulai membaik.", "b": false, "tr": null}, {"zh": "他写完作业就玩起游戏来了。", "py": "Tā xiě wán zuòyè jiù wán qǐ yóuxì lái le.", "id": "Begitu selesai mengerjakan PR, dia langsung mulai main game.", "b": false, "tr": null}, {"zh": "听到这首歌，孩子们唱起歌来了。", "py": "Tīng dào zhè shǒu gē, háizimen chàng qǐ gē lái le.", "id": "Mendengar lagu ini, anak-anak mulai bernyany sertai bilangan + kata satuan, menunjukkan bahwa pembicara menganggap jumlahnya sedikit, tingkatnya rendah, atau waktunya singkat: 今年就下了一次 (雪) = tahun ini hanya turun (salju) sekali.", "Pola pertama: S + 就 + KK + 了 + jumlah + (O): 他昨天就看了十分钟书 = kemarin dia hanya membaca selama sepuluh menit. 我就去过一次上海 = aku baru sekali ke Shanghai.", "Pola kedua: 就 diletakkan SEBELUM kata benda atau subjek, menyatakan PENGECUALIAN, \"hanya … yang tidak\". Biasanya kalimat sebelumnya memakai 都: 我每天书包里都放着雨伞，就今天没带 = setiap hari aku selalu membawa payung, hanya hari ini tidak. 你们点的菜都挺好吃的，就我点的这个菜不太好吃. Bentuk 就是 juga dipakai: 别的早就习惯了，就是天气我还不太习惯.", "Bedakan dengan 只 (hanya): artinya mirip; 只 lebih netral dan lebih tertulis, 就 lebih lisan: 我只去过一次 / 我就去过一次. Bedakan juga dengan 才 + jumlah (baru …, terasa sedikit/terlambat): 他才看了十分钟. Dan hati-hati: 就 + KK tanpa jumlah biasanya berarti \"langsung\": 我吃完饭就去.", "Jebakan bagi pelajar Indonesia: \"hanya hari ini tidak bawa\" sering diterjemahkan 今天就没带, yang bisa terdengar \"hari ini langsung tidak bawa\". Untuk pengecualian, 就 diletakkan SEBELUM kata yang dikecualikan: 就今天没带, 就小明没来. Untuk jumlah, 就 diletakkan sebelum KATA KERJA, bukan sebelum bilangan setelah kata kerja (他看就了十分钟 salah).", "Pola ini sering dipakai untuk mengeluh atau menekankan bahwa sesuatu \"cuma segitu\": 我昨天就睡了四个小时 (kemarin aku cuma tidur empat jam)."], "poin": ["就 + KK + jumlah = hanya (dianggap sedikit).", "就 + KB = pengecualian (hanya … yang tidak).", "Sering didahului 都 di kalimat sebelumnya.", "Tanpa jumlah, 就 + KK biasanya = langsung."], "contoh": [{"zh": "北京常常下雪，但听说今年就下了一次。", "py": "Běijīng chángcháng xià xuě, dàn tīngshuō jīnnián jiù xià le yí cì.", "id": "Beijing sering turun salju, tapi katanya tahun ini hanya turun sekali.", "b": true, "tr": "12-5"}, {"zh": "他昨天就看了十分钟书。", "py": "Tā zuótiān jiù kàn le shí fēnzhōng shū.", "id": "Kemarin dia hanya membaca selama sepuluh menit.", "b": true, "tr": null}, {"zh": "我每天书包里都放着雨伞，就今天没带。", "py": "Wǒ měi tiān shūbāo lǐ dōu fàng zhe Beijing). 这半年练下来，他画画的水平提高了不少.", "Pola lain: S + KK + 下来 + 了, menekankan berhasil menyelesaikan sesuatu yang sulit: 这本书很难，我用了一个月终于看下来了. Sering bersama 终于 (akhirnya) atau 没想到 (tak disangka).", "Bedakan dengan 下去 (pelajaran 8). 下去 melihat ke DEPAN (dari sekarang ke masa depan): 我会学下去 = aku akan terus belajar. 下来 melihat dari masa lalu SAMPAI SEKARANG dan sudah selesai: 一年学下来，我的汉语提高了很多 = setelah belajar setahun, bahasa Mandarinku banyak meningkat.", "Jebakan bagi pelajar Indonesia: kata \"berhasil menyelesaikan\" dalam bahasa Indonesia panjang, sehingga pelajar memakai 完 saja (跑完了). 跑完了 hanya berarti \"selesai lari\"; 跑下来了 menekankan bahwa larinya berat dan berhasil ditempuh. Jangan juga memakai 下来 untuk rencana ke depan (你一定要学下来 → 学下去).", "Catatan: 下来 juga punya makna lain seperti \"mencatat menetap\" (写下来, 记下来) dan \"berhenti\" (停下来). Di pelajaran ini fokusnya pada makna \"berhasil dijalani\"."], "poin": ["KK + 下来 = kegiatan berat berhasil dijalani.", "Pola: jangka waktu + KK下来，hasil.", "Sering dengan 终于 / 没想到.", "下来 (sampai sekarang, selesai) ≠ 下去 (terus ke depan)."], "contoh": [{"zh": "这一年多住下来，我还是更喜欢北京的四季。", "py": "Zhè yì nián duō zhù xiàlái, wǒ háishi gèng xǐhuan Běijīng de sìjì.", "id": "Setelah tinggal lebih dari setahun, aku tetap lebih suka empat musim di Beijing.", "b": true, "tr": "12-7"}, {"zh": "这半年练下来，他画画的水平提高了不少。", "py": "Zhè bàn nián liàn xiàlái, tā huà huà de shuǐpíng tígāo le bù shǎo.", "id": "Setelah berlatih setengah tahun, kemampuan melukisnya banyak meningkat.", "b": true, "tr": null}, {"zh": "五千米的长跑比赛，没想到我跑下来了。", "py": "Wǔqiān mǐ de cháng pǎo bǐsài, méi xiǎng dào wǒ pǎo xiàlái le.", "id": "Lomba lari jarak jauh lima ribu meter, tak disangka aku berhasil menyelesaikannya.", "b": true, "tr": null}, {"zh": "我离开北京到这里工作一年多了。这一年多住下来，我还是更喜欢北京的四季。", "py": "Wǒ líkāi Běijīng dào zhèlǐ gōngzuò yì nián duō le. Zhè yì nián duō zhù xiàlái, wǒ háishi gèng xǐhuan Běijīng de sìjì.", "id": "Aku meninggalkan Beijing dan bekerja di sini sudah lebih dari setahun. Sete rumahku.", "Perhatikan urutannya: 的话 diletakkan di AKHIR bagian pengandaian, bukan di awal. Jadi \"kalau besok cerah\" = 明天天气好的话, bukan 的话明天天气好. Ini terbalik dari bahasa Indonesia, di mana kata \"kalau\" ada di depan.", "就 adalah kata keterangan, jadi harus berada SETELAH subjek anak kalimat kedua dan SEBELUM kata kerja: 明天天气好的话，我就去爬山. Jangan menulis 就我去爬山. Kalau anak kalimat kedua tidak punya subjek baru, 就 langsung di depan kata kerja: 你喜欢的话，就买吧.", "的话 boleh digabung dengan 如果 atau 要是 di depan: 如果明天下雨的话，我们就不去了. Artinya sama, hanya lebih jelas. Dalam bahasa lisan, 就 kadang dihilangkan, tetapi untuk pelajar sebaiknya selalu dipakai agar kalimat jelas.", "Bentuk ingkar diletakkan di dalam anak kalimat masing-masing seperti biasa: 你不忙的话，就来帮帮我 (kalau tidak sibuk …); 下雨的话，我就不去了 (kalau hujan, aku tidak jadi pergi).", "Jebakan pelajar Indonesia: menerjemahkan \"kalau\" kata per kata lalu menaruh 的话 di depan, atau lupa 就 sehingga kalimat terasa terputus. Ingat rumus singkatnya: [kalau-apa] + 的话，[siapa] + 就 + [lakukan apa]."], "poin": ["的话 di akhir bagian pengandaian.", "就 setelah subjek kedua, sebelum kata kerja.", "Boleh ditambah 如果/要是 di depan: 如果……的话.", "Banyak dipakai dalam bahasa lisan."], "contoh": [{"zh": "你们有时间的话，就来我家做客。", "py": "Nǐmen yǒu shíjiān dehuà, jiù lái wǒ jiā zuòkè.", "id": "Kalau kalian punya waktu, datanglah bertamu ke rumahku.", "b": true, "tr": "13-1"}, {"zh": "你觉得满意的话，咱们就买。", "py": "Nǐ juéde mǎnyì dehuà, zánmen jiù mǎi.", "id": "Kalau kamu merasa puas, kita beli saja.", "b": true, "tr": null}, {"zh": "明天天气好的话，我就去爬山。", "py": "Míngtiān tiānqì hǎo dehuà, wǒ jiù qù pá shān.", "id": "Kalau besok cuacanya bagus, aku akan pergi mendaki gunung.", "b": true, "tr": null}, {"zh": "你喜欢的话，就送给你吧。", "py": "Nǐ xǐhuan dehuà, jiù sòng gěi nǐ ba.", "id": "Kalau kamu suka, kuberikan saja padamu.", "b": false, "tr": null}, {"zh": "明天下雨的话，我们就不去公园了。", "py": "Míngtiān xià yǔ dehuà, wǒmen jiù bú qù gōngyuán le.", "id": "Kalau besok hujan, kami tidak jadi pergi ke taman.", "b
