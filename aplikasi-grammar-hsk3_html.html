 "13-1.12", "t": "su", "w": ["你", "不", "会", "的话，", "就", "问", "老师"], "s": "你不会的话，就问老师。", "alt": [], "p": "Nǐ bú huì dehuà, jiù wèn lǎoshī.", "x": "Kalau kamu tidak bisa, tanya guru."}, {"k": "13-1.13", "t": "bs", "s": "明天天气好的话，我就去爬山。", "sp": "Míngtiān tiānqì hǎo dehuà, wǒ jiù qù pá shān.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 的话 di akhir pengandaian, 就 setelah subjek."}, {"k": "13-1.14", "t": "bs", "s": "的话你想去，我们就一起去。", "sp": "Dehuà nǐ xiǎng qù, wǒmen jiù yìqǐ qù.", "n": "", "ok": false, "b": "你想去的话，我们就一起去。", "bp": "Nǐ xiǎng qù dehuà, wǒmen jiù yìqǐ qù.", "x": "的话 harus di akhir bagian pengandaian."}, {"k": "13-1.15", "t": "bs", "s": "你不忙的话，就我们去喝咖啡吧。", "sp": "Nǐ bù máng dehuà, jiù wǒmen qù hē kāfēi ba.", "n": "", "ok": false, "b": "你不忙的话，我们就去喝咖啡吧。", "bp": "Nǐ bù máng dehuà, wǒmen jiù qù hē kāfēi ba.", "x": "就 setelah subjek 我们."}, {"k": "13-1.16", "t": "bs", "s": "如果你喜欢的话，就多吃一点儿。", "sp": "Rúguǒ nǐ xǐhuan dehuà, jiù duō chī yìdiǎnr.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 如果……的话，就……."}, {"k": "13-1.17", "t": "bs", "s": "你有问题的话，就给我发电子邮件。", "sp": "Nǐ yǒu wèntí dehuà, jiù gěi wǒ fā diàn zi yóujiàn.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "13-2", "pel": 13, "judul": "Kalimat 把 (4): 把 + O + KK + pelengkap arah / keadaan", "kode": "\"把\"字句（4）", "rumus": ["S + 把 + O + KK + pelengkap arah (进去/出来/过来 …)", "S + 把 + O + KK + 得 + pelengkap keadaan", "S + 没/不 + 把 + O + KK + pelengkap"], "jelas": ["Kalimat 把 dipakai untuk menunjukkan bahwa suatu tindakan membuat benda/orang tertentu berubah TEMPAT atau berubah KEADAAN. Di pelajaran ini, setelah kata kerja dipakai pelengkap arah (拿出来, 放进去, 踢进去) atau pelengkap keadaan dengan 得 (开得太大, 写得太小).", "Susunannya: Subjek + 把 + Objek + Kata kerja + Pelengkap. Contoh: 他把球踢进去了 (dia menendang bola itu masuk) — bola berpindah tempat. 你把声音开得太大了 (kamu menyalakan suaranya terlalu keras) — suara berubah keadaan.", "Objek setelah 把 harus benda yang SUDAH JELAS/TERTENTU (yang diketahui pembicara dan pendengar): 把饮料拿出来 = keluarkan minuman ITU. Kata kerja tidak boleh berdiri sendiri; harus ada sesuatu setelahnya (pelengkap, 了, dsb.). 我把书拿 saja tidak lengkap; harus 我把书拿出来了.", "Bentuk ingkar: 没 atau 不 diletakkan SEBELUM 把, bukan sebelum kata kerja: 他没把作业带来. Kata keterangan dan kata kerja bantu (要, 应该, 可以, 已经, 都) juga diletakkan sebelum 把: 你应该把这些东西放进冰箱里.", "Dengan pelengkap keadaan, kalimat 把 sering dipakai untuk mengeluh atau mengomentari hasil: 你把字写得太小了 (tulisanmu terlalu kecil). Bandingkan dengan kalimat biasa 你写字写得太小了 — artinya mirip, tetapi kalimat 把 lebih menekankan apa yang terjadi pada objek (字).", "Jebakan pelajar Indonesia: bahasa Indonesia cukup bilang \"masukkan minuman ke kulkas\". Dalam bahasa Mandarin harus 把饮料放进冰箱里, tidak bisa *放进饮料冰箱里. Pikirkan urutannya: 把 + barang + cara memindahkan + ke mana."], "poin": ["把 + objek tertentu + KK + pelengkap.", "Pelengkap arah = perubahan tempat; 得 + KS = perubahan keadaan.", "没/不, 要, 应该, 已经 diletakkan sebelum 把.", "Kata kerja tidak boleh berdiri sendiri."], "contoh": [{"zh": "你把声音开得太大了。", "py": "Nǐ bǎ shēngyīn kāi de tài dà le.", "id": "Kamu menyalakan suaranya terlalu keras.", "b": true, "tr": "13-3"}, {"zh": "他把球踢进去了吗？", "py": "Tā bǎ qiú tī jìnqù le ma?", "id": "Apakah dia menendang bolanya masuk?", "b": true, "tr": null}, {"zh": "你把字写得太小了，我看不清楚。", "py": "Nǐ bǎ zì xiě de tài xiǎo le, wǒ kàn bù qīngchu.", "id": "Tulisanmu terlalu kecil, aku tidak bisa melihatnya dengan jelas.", "b": true, "tr": null}, {"zh": "我记得刚才已经把饮料拿出来了，怎么不见了？", "py": "Wǒ jìde gāngcái yǐjīng bǎ yǐnliào ná chūlái le, zěnme bújiàn le?", "id": "Aku ingat tadi sudah mengeluarkan minumannya, kok hilang?", "b": true, "tr": "13-3"}, {"zh": "我把饮料和酒都放进冰箱里了，客人来了再拿出来。", "py": "Wǒ bǎ yǐnliào hé jiǔ dōu fàng jìn bīngxiāng lǐ le, kèrén lái le zài ná chūlái.", "id": "Minuman dan araknya sudah kumasukkan ke kulkas, nanti dikeluarkan lagi kalau tamu datang.", "b": true, "tr": "13-3"}, {"zh": "妈妈把房间打扫得非常干净。", "py": "Māma bǎ fángjiān dǎsǎo de fēicháng gānjìng.", "id": "Ibu membersihkan kamar sampai sangat bersih.", "b": false, "tr": null}, {"zh": "请你把椅子搬过来。", "py": "Qǐng nǐ bǎ yǐzi bān guòlái.", "id": "Tolong pindahkan kursi itu ke sini.", "b": false, "tr": null}, {"zh": "天气太冷了，你去把大衣拿过来吧。", "py": "Tiānqì tài lěng le, nǐ qù bǎ dàyī ná guòlái ba.", "id": "Cuaca terlalu dingin, ambillah mantelmu ke sini.", "b": false, "tr": null}, {"zh": "他没把作业带来。", "py": "Tā méi bǎ zuòyè dài lái.", "id": "Dia tidak membawa PR-nya.", "b": false, "tr": null}, {"zh": "孩子们把房间弄得很乱。", "py": "Háizimen bǎ fángjiān nòng de hěn luàn.", "id": "Anak-anak membuat kamar jadi sangat berantakan.", "b": false, "tr": null}], "salah": [{"s": "我把书拿。", "sp": "Wǒ bǎ shū ná.", "n": "", "b": "我把书拿出来了。", "bp": "Wǒ bǎ shū ná chūlái le.", "a": "Kata kerja dalam kalimat 把 tidak boleh berdiri sendiri; perlu pelengkap."}, {"s": "我把作业没带来。", "sp": "Wǒ bǎ zuòyè méi dài lái.", "n": "", "b": "我没把作业带来。", "bp": "Wǒ méi bǎ zuòyè dài lái.", "a": "没 diletakkan sebelum 把."}, {"s": "请你放进去这些水果冰箱里。", "sp": "Qǐng nǐ fàng jìnqù zhèxiē shuǐguǒ bīngxiāng lǐ.", "n": "", "b": "请你把这些水果放进冰箱里。", "bp": "Qǐng nǐ bǎ zhèxiē shuǐguǒ fàng jìn bīngxiāng lǐ.", "a": "Benda yang dipindahkan dibawa ke depan dengan 把."}, {"s": "我把一本书放在桌子上了。", "sp": "Wǒ bǎ yì běn shū fàng zài zhuōzi shàng le.", "n": "buku tertentu", "b": "我把那本书放在桌子上了。", "bp": "Wǒ bǎ nà běn shū fàng zài zhuōzi shàng le.", "a": "Objek 把 harus tertentu; pakai 那本书/这本书."}], "latihan": [{"k": "13-2.0", "t": "pg", "q": "你___声音开得太大了。", "o": ["把", "被", "给", "对"], "a": 0, "x": "Perubahan keadaan objek 声音 → kalimat 把.", "f": "你把声音开得太大了。", "fp": "Nǐ bǎ shēngyīn kāi de tài dà le."}, {"k": "13-2.1", "t": "pg", "q": "他把球踢___了。", "o": ["进去", "进", "去进", "进来去"], "a": 0, "x": "Pelengkap arah majemuk: 踢进去.", "f": "他把球踢进去了。", "fp": "Tā bǎ qiú tī jìnqù le."}, {"k": "13-2.2", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["我没把钥匙带出来。", "我把钥匙没带出来。", "我把没钥匙带出来。", "我把钥匙带没出来。"], "a": 0, "x": "没 diletakkan sebelum 把."}, {"k": "13-2.3", "t": "pg", "q": "妈妈把房间打扫___很干净。", "o": ["得", "的", "地", "了"], "a": 0, "x": "Pelengkap keadaan memakai 得.", "f": "妈妈把房间打扫得很干净。", "fp": "Māma bǎ fángjiān dǎsǎo de hěn gānjìng."}, {"k": "13-2.4", "t": "pg", "q": "\"Tolong bawa kursi itu ke sini\" =", "o": ["请你把那把椅子拿过来。", "请你拿过来把那把椅子。", "请你把拿过来那把椅子。", "请你那把椅子把拿过来。"], "a": 0, "x": "把 + objek + KK + pelengkap arah."}, {"k": "13-2.5", "t": "pg", "q": "Di mana posisi 应该? 你 A 把这些东西 B 放 C 进冰箱里 D。", "o": ["A", "B", "C", "D"], "a": 0, "x": "Kata kerja bantu 应该 sebelum 把."}, {"k": "13-2.6", "t": "pg", "q": "A：饮料呢？ B：___", "o": ["我把饮料放进冰箱里了。", "我放饮料进冰箱里了。", "我把饮料放了。", "饮料把我放进冰箱里了。"], "a": 0, "x": "Benda yang dipindahkan dengan 把 + KK + pelengkap arah."}, {"k": "13-2.7", "t": "su", "w": ["你", "把", "声音", "开", "得", "太", "大", "了"], "s": "你把声音开得太大了。", "alt": [], "p": "Nǐ bǎ shēngyīn kāi de tài dà le.", "x": "Kamu menyalakan suaranya terlalu keras."}, {"k": "13-2.8", "t": "su", "w": ["他", "把", "球", "踢", "进去", "了"], "s": "他把球踢进去了。", "alt": [], "p": "Tā bǎ qiú tī jìnqù le.", "x": "Dia menendang bolanya masuk."}, {"k": "13-2.9", "t": "su", "w": ["请", "你", "把", "大衣", "拿", "过来"], "s": "请你把大衣拿过来。", "alt": [], "p": "Qǐng nǐ bǎ dàyī ná guòlái.", "x": "Tolong ambilkan mantel ke sini."}, {"k": "13-2.10", "t": "su", "w": ["我", "没", "把", "词典", "带", "来"], "s": "我没把词典带来。", "alt": [], "p": "Wǒ méi bǎ cídiǎn dài lái.", "x": "Aku tidak membawa kamusnya."}, {"k": "13-2.11", "t": "su", "w": ["妈妈", "把", "房间", "打扫", "得", "很", "干净"], "s": "妈妈把房间打扫得很干净。", "alt": [], "p": "Māma bǎ fángjiān dǎsǎo de hěn gānjìng.", "x": "Ibu membersihkan kamar sampai bersih."}, {"k": "13-2.12", "t": "su", "w": ["你", "把", "字", "写", "得", "太", "小", "了"], "s": "你把字写得太小了。", "alt": [], "p": "Nǐ bǎ zì xiě de tài xiǎo le.", "x": "Tulisanmu terlalu kecil."}, {"k": "13-2.13", "t": "bs", "s": "他把书放进书包里了。", "sp": "Tā bǎ shū fàng jìn shūbāo lǐ le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 把 + O + KK + pelengkap arah + tempat."}, {"k": "13-2.14", "t": "bs", "s": "我把衣服没洗干净。", "sp": "Wǒ bǎ yīfu méi xǐ gānjìng.", "n": "", "ok": false, "b": "我没把衣服洗干净。", "bp": "Wǒ méi bǎ yīfu xǐ gānjìng.", "x": "没 sebelum 把."}, {"k": "13-2.15", "t": "bs", "s": "你把那杯咖啡喝。", "sp": "Nǐ bǎ nà bēi kāfēi hē.", "n": "", "ok": false, "b": "你把那杯咖啡喝了。", "bp": "Nǐ bǎ nà bēi kāfēi hē le.", "x": "Kata kerja tidak boleh berdiri sendiri; tambahkan 了 atau pelengkap."}, {"k": "13-2.16", "t": "bs", "s": "孩子们把房间弄得很乱。", "sp": "Háizimen bǎ fángjiān nòng de hěn luàn.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: pelengkap keadaan dengan 得."}, {"k": "13-2.17", "t": "bs", "s": "请你把椅子搬出去。", "sp": "Qǐng nǐ bǎ yǐzi bān chūqù.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "13-3", "pel": 13, "judul": "Kalimat setara: 一边……，一边…… (sambil)", "kode": "并列复句\"一边……，一边……\"", "rumus": ["S + 一边 + KK1，一边 + KK2", "S + 边 + KK1 + 边 + KK2 (bentuk singkat)"], "jelas": ["一边……，一边…… berarti dua tindakan dilakukan BERSAMAAN oleh orang yang sama, seperti \"sambil\" dalam bahasa Indonesia. 咱们一边吃蛋糕，一边聊天儿 = kita makan kue sambil mengobrol.", "Subjek biasanya disebut sekali di depan, lalu 一边 diletakkan langsung sebelum setiap kata kerja: 我一边跑步，一边听音乐. Jangan menaruh 一边 sebelum subjek.", "Bentuk singkatnya 边……边…… (tanpa 一), biasanya tanpa koma dan dipakai untuk kata kerja pendek: 你不应该边开车边打电话. Arti dan fungsinya sama.", "Kedua tindakan harus bisa dilakukan bersamaan dan biasanya berlangsung agak lama (makan, minum, mengobrol, mendengarkan, berjalan). Tindakan sekejap seperti 到 (tiba) atau 开始 tidak cocok. Untuk tindakan yang bergantian dalam waktu singkat (sebentar begini, sebentar begitu) pakai 一会儿……一会儿…… (pelajaran 16).", "Bahasa Indonesia cukup pakai satu kata \"sambil\" di tengah: \"makan sambil nonton TV\". Bahasa Mandarin memerlukan 一边 DUA kali: 一边吃饭，一边看电视. Kesalahan khas pelajar Indonesia adalah hanya menulis satu 一边.", "Bentuk ingkar biasanya untuk melarang atau menasihati: 不要一边吃饭一边看手机 (jangan makan sambil main HP). 不要/别/不应该 diletakkan sebelum 一边 yang pertama."], "poin": ["Dua tindakan bersamaan oleh satu subjek.", "一边 dipakai dua kali, langsung sebelum tiap KK.", "Bentuk singkat: 边……边…….", "Larangan: 别/不要 + 一边……一边……."], "contoh": [{"zh": "咱们一边吃蛋糕，一边聊天儿吧。", "py": "Zánmen yìbiān chī dàngāo, yìbiān liáotiānr ba.", "id": "Ayo kita makan kue sambil mengobrol.", "b": true, "tr": "13-5"}, {"zh": "我喜欢一边跑步，一边听音乐。", "py": "Wǒ xǐhuan yìbiān pǎobù, yìbiān tīng yīnyuè.", "id": "Aku suka berlari sambil mendengarkan musik.", "b": true, "tr": null}, {"zh": "你不应该边开车边打电话。", "py": "Nǐ bù yīnggāi biān kāichē biān dǎdiànhuà.", "id": "Kamu tidak seharusnya menyetir sambil menelepon.", "b": true, "tr": null}, {"zh": "那天我跟他们一边喝红茶，一边聊天儿，直到十二点多才回家。", "py": "Nà tiān wǒ gēn tāmen yìbiān hē hóngchá, yìbiān liáotiānr, zhídào shí'èr diǎn duō cái huí jiā.", "id": "Hari itu aku minum teh merah sambil mengobrol dengan mereka, sampai lewat jam dua belas baru pulang.", "b": true, "tr": "13-7"}, {"zh": "他一边走路，一边打电话。", "py": "Tā yìbiān zǒulù, yìbiān dǎdiànhuà.", "id": "Dia berjalan sambil menelepon.", "b": false, "tr": null}, {"zh": "妈妈一边做饭，一边唱歌。", "py": "Māma yìbiān zuòfàn, yìbiān chànggē.", "id": "Ibu memasak sambil bernyanyi.", "b": false, "tr": null}, {"zh": "不要一边吃饭，一边看手机。", "py": "Búyào yìbiān chīfàn, yìbiān kàn shǒujī.", "id": "Jangan makan sambil melihat HP.", "b": false, "tr": null}, {"zh": "我们一边爬山，一边看风景。", "py": "Wǒmen yìbiān pá shān, yìbiān kàn fēng jǐng.", "id": "Kami mendaki gunung sambil menikmati pemandangan.", "b": false, "tr": null}, {"zh": "他边听边写，写得很快。", "py": "Tā biān tīng biān xiě, xiě de hěn kuài.", "id": "Dia mendengarkan sambil menulis, menulisnya cepat sekali.", "b": false, "tr": null}, {"zh": "休息的时候，我常常一边喝咖啡，一边看书。", "py": "Xiūxi de shíhou, wǒ chángcháng yìbiān hē kāfēi, yìbiān kàn shū.", "id": "Saat istirahat, aku sering minum kopi sambil membaca buku.", "b": false, "tr": null}], "salah": [{"s": "我吃饭一边看电视。", "sp": "Wǒ chīfàn yìbiān kàn diànshì.", "n": "", "b": "我一边吃饭，一边看电视。", "bp": "Wǒ yìbiān chīfàn, yìbiān kàn diànshì.", "a": "一边 harus dipakai dua kali."}, {"s": "一边他喝茶，一边他看报纸。", "sp": "Yìbiān tā hē chá, yìbiān tā kàn bàozhǐ.", "n": "", "b": "他一边喝茶，一边看报纸。", "bp": "Tā yìbiān hē chá, yìbiān kàn bàozhǐ.", "a": "Subjek disebut sekali di depan; 一边 setelah subjek."}, {"s": "他一边到学校，一边吃早饭。", "sp": "Tā yìbiān dào xuéxiào, yìbiān chī zǎofàn.", "n": "", "b": "他一边走路去学校，一边吃早饭。", "bp": "Tā yìbiān zǒulù qù xuéxiào, yìbiān chī zǎofàn.", "a": "到 adalah tindakan sekejap, tidak bisa dilakukan \"sambil\"."}], "latihan": [{"k": "13-3.0", "t": "pg", "q": "我喜欢一边跑步，___听音乐。", "o": ["一边", "一会儿", "也", "还"], "a": 0, "x": "Pasangan pola: 一边……，一边…….", "f": "我喜欢一边跑步，一边听音乐。", "fp": "Wǒ xǐhuan yìbiān pǎobù, yìbiān tīng yīnyuè."}, {"k": "13-3.1", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["他一边走路，一边唱歌。", "一边他走路，一边他唱歌。", "他走路一边，唱歌一边。", "他一边走路，唱歌。"], "a": 0, "x": "Subjek di depan, 一边 sebelum tiap kata kerja."}, {"k": "13-3.2", "t": "pg", "q": "\"Jangan menyetir sambil menelepon\" =", "o": ["别一边开车，一边打电话。", "别开车一边打电话。", "一边别开车，一边打电话。", "别一边开车，打电话一边。"], "a": 0, "x": "别 sebelum 一边 pertama; 一边 dua kali."}, {"k": "13-3.3", "t": "pg", "q": "Pasangan kata kerja mana yang TIDAK cocok dengan 一边……一边……?", "o": ["到北京 / 开始上课", "吃饭 / 聊天儿", "喝茶 / 看书", "走路 / 听音乐"], "a": 0, "x": "到 dan 开始 adalah tindakan sekejap."}, {"k": "13-3.4", "t": "pg", "q": "你不应该___开车___打电话。", "o": ["边 / 边", "一 / 一", "又 / 也", "先 / 再"], "a": 0, "x": "Bentuk singkat 边……边……."}, {"k": "13-3.5", "t": "pg", "q": "A：休息的时候你喜欢做什么？ B：___", "o": ["我常常一边喝咖啡，一边看书。", "我常常一边喝咖啡，看书。", "一边我喝咖啡，一边我看书。", "我常常喝咖啡一边看书一边。"], "a": 0, "x": "Pola lengkap 一边 + KK1，一边 + KK2."}, {"k": "13-3.6", "t": "su", "w": ["咱们", "一边", "吃", "蛋糕，", "一边", "聊天儿", "吧"], "s": "咱们一边吃蛋糕，一边聊天儿吧。", "alt": [], "p": "Zánmen yìbiān chī dàngāo, yìbiān liáotiānr ba.", "x": "Ayo kita makan kue sambil mengobrol."}, {"k": "13-3.7", "t": "su", "w": ["妈妈", "一边", "做饭，", "一边", "唱歌"], "s": "妈妈一边做饭，一边唱歌。", "alt": [], "p": "Māma yìbiān zuòfàn, yìbiān chànggē.", "x": "Ibu memasak sambil bernyanyi."}, {"k": "13-3.8", "t": "su", "w": ["我", "喜欢", "一边", "跑步，", "一边", "听", "音乐"], "s": "我喜欢一边跑步，一边听音乐。", "alt": [], "p": "Wǒ xǐhuan yìbiān pǎobù, yìbiān tīng yīnyuè.", "x": "Aku suka berlari sambil mendengarkan musik."}, {"k": "13-3.9", "t": "su", "w": ["不要", "一边", "吃饭，", "一边", "看", "手机"], "s": "不要一边吃饭，一边看手机。", "alt": [], "p": "Búyào yìbiān chīfàn, yìbiān kàn shǒujī.", "x": "Jangan makan sambil melihat HP."}, {"k": "13-3.10", "t": "su", "w": ["他们", "一边", "喝", "红茶，", "一边", "聊天儿"], "s": "他们一边喝红茶，一边聊天儿。", "alt": [], "p": "Tāmen yìbiān hē hóngchá, yìbiān liáotiānr.", "x": "Mereka minum teh merah sambil mengobrol."}, {"k": "13-3.11", "t": "bs", "s": "我一边写作业，一边听音乐。", "sp": "Wǒ yìbiān xiě zuòyè, yìbiān tīng yīnyuè.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "13-3.12", "t": "bs", "s": "他看电视一边吃饭。", "sp": "Tā kàn diànshì yìbiān chīfàn.", "n": "", "ok": false, "b": "他一边看电视，一边吃饭。", "bp": "Tā yìbiān kàn diànshì, yìbiān chīfàn.", "x": "一边 harus dipakai dua kali, sebelum tiap kata kerja."}, {"k": "13-3.13", "t": "bs", "s": "一边我们走，一边我们说。", "sp": "Yìbiān wǒmen zǒu, yìbiān wǒmen shuō.", "n": "", "ok": false, "b": "我们一边走，一边说。", "bp": "Wǒmen yìbiān zǒu, yìbiān shuō.", "x": "Subjek disebut di depan, sebelum 一边 pertama."}, {"k": "13-3.14", "t": "bs", "s": "你不应该边开车边打电话。", "sp": "Nǐ bù yīnggāi biān kāichē biān dǎdiànhuà.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: bentuk singkat 边……边……."}, {"k": "13-3.15", "t": "bs", "s": "我们一边爬山，一边看风景。", "sp": "Wǒmen yìbiān pá shān, yìbiān kàn fēng jǐng.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "14-1", "pel": 14, "judul": "Kalimat pasif (1): S + 被 + (pelaku) + KK + unsur lain", "kode": "被动句（1）", "rumus": ["S + 被 + pelaku + KK + unsur lain (了/pelengkap)", "S + 被 + KK + unsur lain (pelaku tidak disebut)", "S + 没/可能/已经 + 被 + pelaku + KK + unsur lain"], "jelas": ["Kalimat 被 adalah kalimat pasif: subjeknya adalah benda/orang yang TERKENA tindakan. 这本书被别人借走了 = buku ini dipinjam (dibawa pergi) orang lain. Kalimat 被 sering bernada negatif, tidak menyenangkan, atau \"apa boleh buat\" (hilang, rusak, dimarahi, salah dipanggil).", "Susunannya: Subjek (yang terkena) + 被 + pelaku + kata kerja + unsur lain. Pelaku boleh tidak disebut kalau tidak penting atau tidak diketahui: 我的自行车被偷了 (sepedaku dicuri). Sama seperti kalimat 把, kata kerja tidak boleh berdiri sendiri; biasanya diikuti 了, pelengkap hasil (错, 坏, 完) atau pelengkap arah (走, 出去).", "Kata keterangan (已经, 都, 经常) dan kata kerja bantu (可能, 会, 要) serta kata ingkar 没 diletakkan SEBELUM 被: 水果可能被弟弟吃了; 我的钱包没被拿走. Untuk kejadian yang sudah lewat, ingkarnya memakai 没, bukan 不.", "Bandingkan dengan kalimat 把: 弟弟把水果吃了 (adik memakan buahnya) — fokus pada pelaku; 水果被弟弟吃了 (buahnya dimakan adik) — fokus pada benda yang terkena. Isi beritanya sama, hanya sudut pandangnya berbeda.", "Jebakan pelajar Indonesia: bahasa Indonesia sangat sering memakai bentuk di- (\"makanannya sudah dimasak\", \"suratnya sudah dikirim\"). Bahasa Mandarin TIDAK memakai 被 untuk semua itu; cukup 饭做好了, 信寄出去了. 被 terutama dipakai untuk kejadian yang tidak diinginkan atau untuk menekankan bahwa subjek \"terkena\" sesuatu.", "Subjek kalimat 被 harus sesuatu yang tertentu (这本书, 我的自行车, 我们俩), bukan benda sembarang."], "poin": ["被 = di-/ter-, terutama untuk hal yang tidak menyenangkan.", "Pelaku setelah 被 boleh dihilangkan.", "KK harus diikuti unsur lain (了, pelengkap).", "没/可能/已经 diletakkan sebelum 被.", "Jangan menerjemahkan setiap \"di-\" dengan 被."], "contoh": [{"zh": "这本书被别人借走了。", "py": "Zhè běn shū bèi biérén jiè zǒu le.", "id": "Buku ini sudah dipinjam orang lain.", "b": true, "tr": null}, {"zh": "水果可能被弟弟吃了。", "py": "Shuǐguǒ kěnéng bèi dìdi chī le.", "id": "Buahnya mungkin dimakan adik.", "b": true, "tr": null}, {"zh": "我们俩经常被叫错名字。", "py": "Wǒmen liǎ jīngcháng bèi jiào cuò míngzi.", "id": "Kami berdua sering salah dipanggil namanya.", "b": true, "tr": null}, {"zh": "我的自行车被偷了。", "py": "Wǒ de zìxíngchē bèi tōu le.", "id": "Sepedaku dicuri.", "b": false, "tr": null}, {"zh": "我刚买的咖啡被妹妹喝了。", "py": "Wǒ gāng mǎi de kāfēi bèi mèimei hē le.", "id": "Kopi yang baru kubeli diminum adik perempuanku.", "b": false, "tr": null}, {"zh": "他昨天被老师批评了。", "py": "Tā zuótiān bèi lǎoshī pī píng le.", "id": "Kemarin dia ditegur guru.", "b": false, "tr": null}, {"zh": "我的照相机被朋友借走了。", "py": "Wǒ de zhàoxiàng jī bèi péngyou jiè zǒu le.", "id": "Kameraku dipinjam teman.", "b": false, "tr": null}, {"zh": "窗户被风吹开了。", "py": "Chuāng hù bèi fēng chuī kāi le.", "id": "Jendela terbuka tertiup angin.", "b": false, "tr": null}, {"zh": "我的钱包没被拿走，还在包里。", "py": "Wǒ de qián bāo méi bèi ná zǒu, hái zài bāo lǐ.", "id": "Dompetku tidak diambil, masih ada di tas.", "b": false, "tr": null}, {"zh": "蛋糕已经被孩子们吃完了。", "py": "Dàngāo yǐjīng bèi háizimen chī wán le.", "id": "Kuenya sudah dihabiskan anak-anak.", "b": false, "tr": null}], "salah": [{"s": "我的手机被弟弟用。", "sp": "Wǒ de shǒujī bèi dìdi yòng.", "n": "", "b": "我的手机被弟弟用坏了。", "bp": "Wǒ de shǒujī bèi dìdi yòng huài le.", "a": "Kata kerja dalam kalimat 被 perlu unsur lain (pelengkap/了)."}, {"s": "我的书被没借走。", "sp": "Wǒ de shū bèi méi jiè zǒu.", "n": "", "b": "我的书没被借走。", "bp": "Wǒ de shū méi bèi jiè zǒu.", "a": "没 diletakkan sebelum 被."}, {"s": "饭已经被妈妈做好了。", "sp": "Fàn yǐjīng bèi māma zuò hǎo le.", "n": "kalimat netral \"makanan sudah dimasak\"", "b": "饭已经做好了。", "bp": "Fàn yǐjīng zuò hǎo le.", "a": "Untuk hal netral yang menyenangkan, bahasa Mandarin biasanya tidak memakai 被."}], "latihan": [{"k": "14-1.0", "t": "pg", "q": "这本书___别人借走了。", "o": ["被", "把", "给", "让我"], "a": 0, "x": "Subjek 这本书 terkena tindakan → 被.", "f": "这本书被别人借走了。", "fp": "Zhè běn shū bèi biérén jiè zǒu le."}, {"k": "14-1.1", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["水果可能被弟弟吃了。", "水果被可能弟弟吃了。", "水果被弟弟可能吃了。", "可能被水果弟弟吃了。"], "a": 0, "x": "可能 sebelum 被."}, {"k": "14-1.2", "t": "pg", "q": "我的自行车___被偷，你放心吧。", "o": ["没", "不", "没有了", "别"], "a": 0, "x": "Ingkar untuk kejadian lampau: 没 + 被.", "f": "我的自行车没被偷，你放心吧。", "fp": "Wǒ de zìxíngchē méi bèi tōu, nǐ fàngxīn ba."}, {"k": "14-1.3", "t": "pg", "q": "\"Kameraku dipinjam teman\" =", "o": ["我的照相机被朋友借走了。", "我的照相机把朋友借走了。", "朋友被我的照相机借走了。", "我的照相机被朋友借。"], "a": 0, "x": "S + 被 + pelaku + KK + pelengkap."}, {"k": "14-1.4", "t": "pg", "q": "Mana yang paling wajar untuk \"Suratnya sudah dikirim\" (netral)?", "o": ["信已经寄出去了。", "信已经被寄出去了被。", "被信已经寄出去了。", "信被已经寄出去了。"], "a": 0, "x": "Hal netral biasanya tanpa 被; cukup 信已经寄出去了."}, {"k": "14-1.5", "t": "pg", "q": "A：你的咖啡呢？ B：___", "o": ["被妹妹喝了。", "把妹妹喝了。", "妹妹被喝了。", "被喝妹妹了。"], "a": 0, "x": "Subjek (咖啡) dihilangkan; 被 + pelaku + KK + 了."}, {"k": "14-1.6", "t": "pg", "q": "弟弟把水果吃了。= 水果___。", "o": ["被弟弟吃了", "把弟弟吃了", "被吃弟弟了", "弟弟被吃了"], "a": 0, "x": "Ubah kalimat 把 menjadi 被: O + 被 + pelaku + KK.", "f": "弟弟把水果吃了。= 水果被弟弟吃了。", "fp": "Dìdi bǎ shuǐguǒ chī le. = Shuǐguǒ bèi dìdi chī le."}, {"k": "14-1.7", "t": "su", "w": ["这", "本", "书", "被", "别人", "借", "走", "了"], "s": "这本书被别人借走了。", "alt": [], "p": "Zhè běn shū bèi biérén jiè zǒu le.", "x": "Buku ini dipinjam orang lain."}, {"k": "14-1.8", "t": "su", "w": ["我", "的", "自行车", "被", "偷", "了"], "s": "我的自行车被偷了。", "alt": [], "p": "Wǒ de zìxíngchē bèi tōu le.", "x": "Sepedaku dicuri."}, {"k": "14-1.9", "t": "su", "w": ["他", "昨天", "被", "老师", "批评", "了"], "s": "他昨天被老师批评了。", "alt": ["昨天他被老师批评了。"], "p": "Tā zuótiān bèi lǎoshī pī píng le.", "x": "Kemarin dia ditegur guru."}, {"k": "14-1.10", "t": "su", "w": ["我们", "经常", "被", "叫", "错", "名字"], "s": "我们经常被叫错名字。", "alt": [], "p": "Wǒmen jīngcháng bèi jiào cuò míngzi.", "x": "Kami sering salah dipanggil namanya."}, {"k": "14-1.11", "t": "su", "w": ["蛋糕", "已经", "被", "孩子们", "吃", "完", "了"], "s": "蛋糕已经被孩子们吃完了。", "alt": [], "p": "Dàngāo yǐjīng bèi háizimen chī wán le.", "x": "Kuenya sudah dihabiskan anak-anak."}, {"k": "14-1.12", "t": "bs", "s": "我的钱包被小偷拿走了。", "sp": "Wǒ de qián bāo bèi xiǎo tōu ná zǒu le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "14-1.13", "t": "bs", "s": "我的手机被他用。", "sp": "Wǒ de shǒujī bèi tā yòng.", "n": "", "ok": false, "b": "我的手机被他用坏了。", "bp": "Wǒ de shǒujī bèi tā yòng huài le.", "x": "KK perlu unsur lain setelahnya."}, {"k": "14-1.14", "t": "bs", "s": "我的电脑被没弟弟用过。", "sp": "Wǒ de diànnǎo bèi méi dìdi yòng guò.", "n": "", "ok": false, "b": "我的电脑没被弟弟用过。", "bp": "Wǒ de diànnǎo méi bèi dìdi yòng guò.", "x": "没 sebelum 被."}, {"k": "14-1.15", "t": "bs", "s": "窗户被风吹开了。", "sp": "Chuāng hù bèi fēng chuī kāi le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "14-1.16", "t": "bs", "s": "我们俩经常被叫错名字。", "sp": "Wǒmen liǎ jīngcháng bèi jiào cuò míngzi.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: pelaku boleh tidak disebut."}]}, {"id": "14-2", "pel": 14, "judul": "Urutan tindakan: 先……，再/然后……", "kode": "承接复句\"先……，再/然后……\"", "rumus": ["S + 先 + KK1，再 + KK2", "S + 先 + KK1，然后 + (S) + KK2", "S + 先 + KK1，然后再 + KK2"], "jelas": ["Pola 先……，再/然后…… menyatakan urutan dua tindakan: yang pertama dilakukan dulu (先 = dulu, lebih dulu), lalu yang kedua (再 / 然后 = kemudian, baru). 我要先去图书馆借书，然后去游泳 = aku mau ke perpustakaan pinjam buku dulu, kemudian berenang.", "先 dan 再 adalah kata keterangan, jadi letaknya SETELAH subjek dan SEBELUM kata kerja: 你先去买门票，再来这里找我. Jangan menulis 先你去买.", "然后 adalah kata sambung, letaknya di AWAL anak kalimat kedua dan boleh diikuti subjek baru: 我们先吃饭，然后你送我回家. Kalau anak kalimat kedua punya subjek, 再 harus setelah subjek itu: 你先走，我再走.", "然后 dan 再 sering digabung menjadi 然后再: 你们先回房间休息一会儿，然后再出来吃晚饭. Untuk tiga langkah atau lebih bisa dipakai 先……，然后……，最后……", "Di sini 再 tidak berarti \"lagi\" (mengulang), tetapi \"baru/kemudian\" untuk tindakan yang akan dilakukan. Untuk masa lampau, langkah kedua biasanya memakai 然后 atau 就: 他先洗了澡，然后睡觉了.", "Bahasa Indonesia sering cukup \"dulu\": \"makan dulu, baru pergi\". Ingat bahwa dalam bahasa Mandarin \"dulu\" (先) diletakkan SEBELUM kata kerja, bukan di akhir: 先吃饭，再走, bukan *吃饭先."], "poin": ["先 = dulu; 再/然后 = kemudian/baru.", "先 dan 再 setelah subjek, sebelum KK.", "然后 di awal anak kalimat kedua, boleh diikuti subjek.", "Bisa digabung: 然后再."], "contoh": [{"zh": "我要先去图书馆借书，然后去游泳。", "py": "Wǒ yào xiān qù túshūguǎn jiè shū, ránhòu qù yóuyǒng.", "id": "Aku mau ke perpustakaan pinjam buku dulu, kemudian berenang.", "b": true, "tr": null}, {"zh": "你先去买门票，再来这里找我。", "py": "Nǐ xiān qù mǎi ménpiào, zài lái zhèlǐ zhǎo wǒ.", "id": "Kamu beli tiket masuk dulu, baru datang ke sini mencariku.", "b": true, "tr": null}, {"zh": "你们先回房间休息一会儿，然后再出来吃晚饭。", "py": "Nǐmen xiān huí fángjiān xiūxi yíhuìr, ránhòu zài chūlái chī wǎnfàn.", "id": "Kalian kembali ke kamar istirahat sebentar dulu, kemudian keluar untuk makan malam.", "b": true, "tr": null}, {"zh": "我今天忙得很，要先去图书馆借书，然后去游泳。", "py": "Wǒ jīntiān máng de hěn, yào xiān qù túshūguǎn jiè shū, ránhòu qù yóuyǒng.", "id": "Hari ini aku sibuk sekali, mau ke perpustakaan pinjam buku dulu, lalu berenang.", "b": true, "tr": "14-3"}, {"zh": "我们先吃饭，再去看电影吧。", "py": "Wǒmen xiān chīfàn, zài qù kàn diànyǐng ba.", "id": "Kita makan dulu, baru nonton film ya.", "b": false, "tr": null}, {"zh": "你先洗手，然后吃水果。", "py": "Nǐ xiān xǐ shǒu, ránhòu chī shuǐguǒ.", "id": "Cuci tangan dulu, kemudian makan buah.", "b": false, "tr": null}, {"zh": "他每天先跑步，然后吃早饭。", "py": "Tā měi tiān xiān pǎobù, ránhòu chī zǎofàn.", "id": "Setiap hari dia lari dulu, kemudian sarapan.", "b": false, "tr": null}, {"zh": "你先走，我再走。", "py": "Nǐ xiān zǒu, wǒ zài zǒu.", "id": "Kamu pergi duluan, aku belakangan.", "b": false, "tr": null}, {"zh": "我们先坐地铁，然后换公共汽车。", "py": "Wǒmen xiān zuò dìtiě, ránhòu huàn gōng gòng qìchē.", "id": "Kita naik kereta bawah tanah dulu, kemudian ganti bus.", "b": false, "tr": null}, {"zh": "昨天我先做完作业，然后跟朋友去打篮球了。", "py": "Zuótiān wǒ xiān zuò wán zuòyè, ránhòu gēn péngyou qù dǎ lánqiú le.", "id": "Kemarin aku menyelesaikan PR dulu, kemudian main basket dengan teman.", "b": false, "tr": null}], "salah": [{"s": "先你去买票，再来找我。", "sp": "Xiān nǐ qù mǎi piào, zài lái zhǎo wǒ.", "n": "", "b": "你先去买票，再来找我。", "bp": "Nǐ xiān qù mǎi piào, zài lái zhǎo wǒ.", "a": "先 adalah kata keterangan, setelah subjek."}, {"s": "我们吃饭先，然后去看电影。", "sp": "Wǒmen chīfàn xiān, ránhòu qù kàn diànyǐng.", "n": "", "b": "我们先吃饭，然后去看电影。", "bp": "Wǒmen xiān chīfàn, ránhòu qù kàn diànyǐng.", "a": "先 sebelum kata kerja, bukan di belakang."}, {"s": "你先走，再我走。", "sp": "Nǐ xiān zǒu, zài wǒ zǒu.", "n": "", "b": "你先走，我再走。", "bp": "Nǐ xiān zǒu, wǒ zài zǒu.", "a": "再 harus setelah subjek anak kalimat kedua."}], "latihan": [{"k": "14-2.0", "t": "pg", "q": "我要___去图书馆借书，然后去游泳。", "o": ["先", "再", "还", "就"], "a": 0, "x": "Langkah pertama memakai 先.", "f": "我要先去图书馆借书，然后去游泳。", "fp": "Wǒ yào xiān qù túshūguǎn jiè shū, ránhòu qù yóuyǒng."}, {"k": "14-2.1", "t": "pg", "q": "你先去买门票，___来这里找我。", "o": ["再", "先", "又", "也"], "a": 0, "x": "Langkah kedua memakai 再.", "f": "你先去买门票，再来这里找我。", "fp": "Nǐ xiān qù mǎi ménpiào, zài lái zhèlǐ zhǎo wǒ."}, {"k": "14-2.2", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["你先走，我再走。", "你先走，再我走。", "先你走，我再走。", "你走先，我再走。"], "a": 0, "x": "先/再 setelah subjek masing-masing."}, {"k": "14-2.3", "t": "pg", "q": "\"Kita makan dulu, baru nonton film\" =", "o": ["我们先吃饭，再去看电影。", "我们吃饭先，再去看电影。", "我们再吃饭，先去看电影。", "先我们吃饭，再我们去看电影。"], "a": 0, "x": "先 + KK1，再 + KK2."}, {"k": "14-2.4", "t": "pg", "q": "你们先休息一会儿，___再出来吃晚饭。", "o": ["然后", "但是", "因为", "所以"], "a": 0, "x": "然后再 = kemudian.", "f": "你们先休息一会儿，然后再出来吃晚饭。", "fp": "Nǐmen xiān xiūxi yíhuìr, ránhòu zài chūlái chī wǎnfàn."}, {"k": "14-2.5", "t": "pg", "q": "A：下课以后你做什么？ B：___", "o": ["我先去吃饭，然后去图书馆。", "我去吃饭先，然后去图书馆。", "我然后去吃饭，先去图书馆。", "我先去吃饭，去图书馆再然后。"], "a": 0, "x": "先……，然后……."}, {"k": "14-2.6", "t": "su", "w": ["你", "先", "去", "买", "门票，", "再", "来", "找", "我"], "s": "你先去买门票，再来找我。", "alt": [], "p": "Nǐ xiān qù mǎi ménpiào, zài lái zhǎo wǒ.", "x": "Kamu beli tiket dulu, baru datang mencariku."}, {"k": "14-2.7", "t": "su", "w": ["我们", "先", "吃饭，", "然后", "去", "看", "电影"], "s": "我们先吃饭，然后去看电影。", "alt": [], "p": "Wǒmen xiān chīfàn, ránhòu qù kàn diànyǐng.", "x": "Kita makan dulu, kemudian nonton film."}, {"k": "14-2.8", "t": "su", "w": ["你", "先", "洗手，", "然后", "再", "吃", "水果"], "s": "你先洗手，然后再吃水果。", "alt": [], "p": "Nǐ xiān xǐ shǒu, ránhòu zài chī shuǐguǒ.", "x": "Cuci tangan dulu, kemudian makan buah."}, {"k": "14-2.9", "t": "su", "w": ["他", "每天", "先", "跑步，", "然后", "吃", "早饭"], "s": "他每天先跑步，然后吃早饭。", "alt": [], "p": "Tā měi tiān xiān pǎobù, ránhòu chī zǎofàn.", "x": "Setiap hari dia lari dulu, kemudian sarapan."}, {"k": "14-2.10", "t": "su", "w": ["你", "先", "走，", "我", "再", "走"], "s": "你先走，我再走。", "alt": [], "p": "Nǐ xiān zǒu, wǒ zài zǒu.", "x": "Kamu pergi duluan, aku belakangan."}, {"k": "14-2.11", "t": "bs", "s": "我先做作业，然后看电视。", "sp": "Wǒ xiān zuò zuòyè, ránhòu kàn diànshì.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "14-2.12", "t": "bs", "s": "先我们去超市，再回家。", "sp": "Xiān wǒmen qù chāoshì, zài huí jiā.", "n": "", "ok": false, "b": "我们先去超市，再回家。", "bp": "Wǒmen xiān qù chāoshì, zài huí jiā.", "x": "先 setelah subjek."}, {"k": "14-2.13", "t": "bs", "s": "你先说，再我说。", "sp": "Nǐ xiān shuō, zài wǒ shuō.", "n": "", "ok": false, "b": "你先说，我再说。", "bp": "Nǐ xiān shuō, wǒ zài shuō.", "x": "再 setelah subjek 我."}, {"k": "14-2.14", "t": "bs", "s": "我们先坐地铁，然后换公共汽车。", "sp": "Wǒmen xiān zuò dìtiě, ránhòu huàn gōng gòng qìchē.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "14-2.15", "t": "bs", "s": "你吃药先，然后睡觉。", "sp": "Nǐ chī yào xiān, ránhòu shuìjiào.", "n": "", "ok": false, "b": "你先吃药，然后睡觉。", "bp": "Nǐ xiān chī yào, ránhòu shuìjiào.", "x": "先 sebelum kata kerja."}]}, {"id": "14-3", "pel": 14, "judul": "Pola tetap: X + 什么(啊) (membantah / menenangkan)", "kode": "固定格式\"×什么（啊）\"", "rumus": ["KS/KK + 什么(啊)", "A: …X… → B: X什么啊，+ alasan"], "jelas": ["Pola X什么(啊) dipakai untuk MEMBANTAH atau MENOLAK kekhawatiran, keraguan, atau pendapat lawan bicara, sekaligus menenangkan dia. X biasanya kata sifat atau kata kerja yang baru saja diucapkan lawan bicara. 胖什么啊 ≈ \"gemuk apanya!\" / \"nggak gemuk kok!\".", "Walaupun ada 什么, kalimat ini BUKAN pertanyaan. Artinya justru \"tidak perlu X\" atau \"sama sekali tidak X\". 急什么啊 = tidak usah buru-buru; 紧张什么啊 = tidak usah gugup.", "Biasanya diikuti alasan atau penjelasan: 急什么啊，马上就到了 (buru-buru apa, sebentar lagi sampai). 胖什么啊，你看起来不胖也不瘦. Tanpa alasan, kalimat bisa terdengar ketus.", "啊 boleh dihilangkan (紧张什么), dan karena bunyi sebelumnya, 啊 sering berubah menjadi 呀 atau 哪 dalam ucapan. Kata kerja + objek juga bisa: 哭什么, 谢什么 (= 不用谢, tidak usah berterima kasih).", "Bahasa Indonesia punya pola yang mirip: \"Gemuk apanya!\", \"Takut apa sih!\". Jadi pelajar Indonesia mudah memahaminya. Perhatikan nada: pola ini bersifat lisan dan akrab, cocok dengan teman atau keluarga; kepada orang yang lebih tua atau atasan bisa terdengar kurang sopan."], "poin": ["X什么(啊) = \"X apanya!\" → membantah/menenangkan.", "Bukan pertanyaan.", "X diambil dari ucapan lawan bicara.", "Biasanya diikuti alasan.", "Gaya lisan dan akrab."], "contoh": [{"zh": "紧张什么啊，我们都喜欢听你唱歌，你要相信自己。", "py": "Jǐnzhāng shénme a, wǒmen dōu xǐhuan tīng nǐ chànggē, nǐ yào xiāngxìn zìjǐ.", "id": "Gugup apanya, kami semua suka mendengarmu bernyanyi, kamu harus percaya diri.", "b": true, "tr": "14-5"}, {"zh": "胖什么啊，你看起来不胖也不瘦。", "py": "Pàng shénme a, nǐ kàn qǐlái bú pàng yě bú shòu.", "id": "Gemuk apanya, kamu kelihatan tidak gemuk juga tidak kurus.", "b": true, "tr": null}, {"zh": "急什么啊，马上就到了。", "py": "Jí shénme a, mǎshàng jiù dào le.", "id": "Buru-buru apa sih, sebentar lagi sampai.", "b": true, "tr": null}, {"zh": "远什么啊，走路十几分钟就到了。", "py": "Yuǎn shénme a, zǒulù shí jǐ fēnzhōng jiù dào le.", "id": "Jauh apanya, jalan kaki belasan menit saja sudah sampai.", "b": false, "tr": null}, {"zh": "贵什么啊，这件衣服才一百块。", "py": "Guì shénme a, zhè jiàn yīfu cái yìbǎi kuài.", "id": "Mahal apanya, baju ini cuma seratus yuan.", "b": false, "tr": null}, {"zh": "难什么啊，你多练习几次就会了。", "py": "Nán shénme a, nǐ duō liànxí jǐ cì jiù huì le.", "id": "Susah apanya, latihan beberapa kali lagi kamu pasti bisa.", "b": false, "tr": null}, {"zh": "谢什么啊，我们是好朋友。", "py": "Xiè shénme a, wǒmen shì hǎo péngyou.", "id": "Terima kasih apa, kita kan sahabat.", "b": false, "tr": null}, {"zh": "怕什么啊，我跟你一起去。", "py": "Pà shénme a, wǒ gēn nǐ yìqǐ qù.", "id": "Takut apa, aku pergi bersamamu.", "b": false, "tr": null}, {"zh": "哭什么啊，明天再买一个就行了。", "py": "Kū shénme a, míngtiān zài mǎi yí gè jiù xíng le.", "id": "Kenapa menangis, besok beli satu lagi saja.", "b": false, "tr": null}, {"zh": "累什么啊，我们才走了半个小时。", "py": "Lèi shénme a, wǒmen cái zǒu le bàn gè xiǎoshí.", "id": "Capek apanya, kita baru jalan setengah jam.", "b": false, "tr": null}], "salah": [{"s": "什么贵啊，这件衣服才一百块。", "sp": "Shénme guì a, zhè jiàn yīfu cái yìbǎi kuài.", "n": "", "b": "贵什么啊，这件衣服才一百块。", "bp": "Guì shénme a, zhè jiàn yīfu cái yìbǎi kuài.", "a": "Dalam pola ini 什么 diletakkan SETELAH X."}, {"s": "A：这个菜很好吃。B：好吃什么啊，你多吃点儿。", "sp": "A: Zhège cài hěn hǎochī. B: Hǎochī shénme a, nǐ duō chī diǎnr.", "n": "", "b": "A：这个菜太辣了。B：辣什么啊，一点儿也不辣。", "bp": "A: Zhège cài tài là le. B: Là shénme a, yìdiǎnr yě bú là.", "a": "Pola ini membantah; X diambil dari ucapan yang mau dibantah, bukan untuk menyetujui."}, {"s": "（kepada kepala sekolah）校长，您急什么啊！", "sp": "(k e p a d a k e p a l a s e k o l a h) Xiàozhǎng, nín jí shénme a!", "n": "", "b": "校长，您别着急，马上就到了。", "bp": "Xiàozhǎng, nín bié zháojí, mǎshàng jiù dào le.", "a": "Pola ini akrab; kepada orang yang dihormati lebih baik pakai kalimat sopan."}], "latihan": [{"k": "14-3.0", "t": "pg", "q": "A：我最近胖了很多。 B：___，你看起来不胖也不瘦。", "o": ["胖什么啊", "什么胖啊", "胖不胖啊", "很胖啊"], "a": 0, "x": "Membantah: X + 什么啊."}, {"k": "14-3.1", "t": "pg", "q": "\"急什么啊，马上就到了\" artinya …", "o": ["Tidak usah buru-buru, sebentar lagi sampai.", "Kenapa kamu cepat-cepat? Jawab!", "Buru-buru apa yang kamu mau?", "Ayo cepat, kita terlambat."], "a": 0, "x": "X什么啊 menolak kekhawatiran, bukan bertanya."}, {"k": "14-3.2", "t": "pg", "q": "A：这个地方太远了。 B：___", "o": ["远什么啊，走路十分钟就到了。", "什么远啊，走路十分钟就到了。", "远啊什么，走路十分钟就到了。", "远什么，太远了。"], "a": 0, "x": "X = 远, lalu alasan yang membantah."}, {"k": "14-3.3", "t": "pg", "q": "A：谢谢你帮我。 B：___，我们是朋友。", "o": ["谢什么啊", "什么谢啊", "谢谢什么", "不谢什么啊"], "a": 0, "x": "谢什么啊 = tidak usah berterima kasih."}, {"k": "14-3.4", "t": "pg", "q": "Pola X什么(啊) biasanya dipakai untuk …", "o": ["membantah atau menenangkan lawan bicara", "menanyakan benda apa", "memuji lawan bicara", "membuat perbandingan"], "a": 0, "x": "Fungsinya membantah kekhawatiran/keraguan."}, {"k": "14-3.5", "t": "pg", "q": "A：明天考试，我很紧张。 B：___，你准备得很好。", "o": ["紧张什么啊", "什么紧张", "紧张了吗", "很紧张啊"], "a": 0, "x": "Membantah kekhawatiran: 紧张什么啊."}, {"k": "14-3.6", "t": "su", "w": ["胖", "什么", "啊，", "你", "一点儿", "也", "不", "胖"], "s": "胖什么啊，你一点儿也不胖。", "alt": [], "p": "Pàng shénme a, nǐ yìdiǎnr yě bú pàng.", "x": "Gemuk apanya, kamu sama sekali tidak gemuk."}, {"k": "14-3.7", "t": "su", "w": ["急", "什么", "啊，", "马上", "就", "到", "了"], "s": "急什么啊，马上就到了。", "alt": [], "p": "Jí shénme a, mǎshàng jiù dào le.", "x": "Buru-buru apa, sebentar lagi sampai."}, {"k": "14-3.8", "t": "su", "w": ["贵", "什么", "啊，", "才", "五十", "块", "钱"], "s": "贵什么啊，才五十块钱。", "alt": [], "p": "Guì shénme a, cái wǔshí kuài qián.", "x": "Mahal apanya, cuma lima puluh yuan."}, {"k": "14-3.9", "t": "su", "w": ["怕", "什么", "啊，", "我", "跟", "你", "一起", "去"], "s": "怕什么啊，我跟你一起去。", "alt": [], "p": "Pà shénme a, wǒ gēn nǐ yìqǐ qù.", "x": "Takut apa, aku pergi bersamamu."}, {"k": "14-3.10", "t": "su", "w": ["难", "什么", "啊，", "多", "练习", "就", "会", "了"], "s": "难什么啊，多练习就会了。", "alt": [], "p": "Nán shénme a, duō liànxí jiù huì le.", "x": "Susah apanya, latihan saja nanti bisa."}, {"k": "14-3.11", "t": "bs", "s": "A：这件衣服太贵了。B：贵什么啊，才一百块。", "sp": "A: Zhè jiàn yīfu tài guì le. B: Guì shénme a, cái yìbǎi kuài.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "14-3.12", "t": "bs", "s": "A：太远了。B：什么远啊，十分钟就到了。", "sp": "A: Tài yuǎn le. B: Shénme yuǎn a, shí fēnzhōng jiù dào le.", "n": "", "ok": false, "b": "A：太远了。B：远什么啊，十分钟就到了。", "bp": "A: Tài yuǎn le. B: Yuǎn shénme a, shí fēnzhōng jiù dào le.", "x": "什么 setelah X."}, {"k": "14-3.13", "t": "bs", "s": "A：我怕考不好。B：怕什么啊，你学得很好。", "sp": "A: Wǒ pà kǎo bù hǎo. B: Pà shénme a, nǐ xué de hěn hǎo.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "14-3.14", "t": "bs", "s": "A：我有点儿累。B：累什么啊，我们才走了十分钟。", "sp": "A: Wǒ yǒudiǎnr lèi. B: Lèi shénme a, wǒmen cái zǒu le shí fēnzhōng.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "14-3.15", "t": "bs", "s": "A：这道题很难。B：难啊什么，我教你。", "sp": "A: Zhè dào tí hěn nán. B: Nán a shénme, wǒ jiāo nǐ.", "n": "", "ok": false, "b": "A：这道题很难。B：难什么啊，我教你。", "bp": "A: Zhè dào tí hěn nán. B: Nán shénme a, wǒ jiāo nǐ.", "x": "Urutan: X + 什么 + 啊."}]}, {"id": "15-1", "pel": 15, "judul": "Kata depan 根据 (berdasarkan)", "kode": "介词\"根据\"", "rumus": ["根据 + KB，S + KK …", "S + 根据 + KB + KK …"], "jelas": ["根据 berarti \"berdasarkan / sesuai dengan\". Kata ini memperkenalkan DASAR atau ALASAN suatu tindakan: 老师根据每个学生的兴趣，选择了不一样的书 = guru memilih buku yang berbeda berdasarkan minat tiap siswa.", "Setelah 根据 harus ada kata benda atau frasa benda: 根据要求, 根据他们的需要, 根据天气, 根据你的情况. Tidak bisa langsung kata kerja tunggal.", "Frasa 根据…… bisa diletakkan di awal kalimat (diikuti koma) atau setelah subjek, sebelum kata kerja: 根据要求，我们必须参加明天的会议 / 小区根据他们的需要，有了很多变化.", "Jebakan pelajar Indonesia: \"menurut saya\" JANGAN diterjemahkan 根据我. 根据 dipakai untuk dasar yang objektif (aturan, data, kebutuhan, keadaan), bukan pendapat pribadi. Untuk pendapat pakai 在我看来 (pelajaran ini juga) atau 我觉得.", "根据 juga bisa menjadi kata benda \"dasar/bukti\": 你这么说有根据吗？(apakah ada dasarnya kamu bilang begitu?). Tetapi di tingkat ini, fokusnya pada pemakaian sebagai kata depan."], "poin": ["根据 = berdasarkan.", "根据 + kata benda/frasa benda.", "Posisi: awal kalimat atau setelah subjek.", "\"Menurut saya\" ≠ 根据我 → pakai 在我看来/我觉得."], "contoh": [{"zh": "这几年小区根据他们的需要，有了很多变化。", "py": "Zhè jǐ nián xiǎoqū gēnjù tāmen de xūyào, yǒu le hěn duō biànhuà.", "id": "Beberapa tahun ini kompleks perumahan itu banyak berubah sesuai kebutuhan mereka.", "b": true, "tr": "15-1"}, {"zh": "根据要求，我们必须参加明天的会议。", "py": "Gēnjù yāoqiú, wǒmen bìxū cānjiā míngtiān de huìyì.", "id": "Berdasarkan ketentuan, kita harus menghadiri rapat besok.", "b": true, "tr": null}, {"zh": "老师根据每个学生的兴趣，选择了不一样的书。", "py": "Lǎoshī gēnjù měi gè xuéshēng de xìngqù, xuǎnzé le bù yíyàng de shū.", "id": "Guru memilih buku yang berbeda berdasarkan minat setiap siswa.", "b": true, "tr": null}, {"zh": "我们会根据天气决定什么时候去爬山。", "py": "Wǒmen huì gēnjù tiānqì juédìng shénme shíhou qù pá shān.", "id": "Kami akan memutuskan kapan mendaki gunung berdasarkan cuaca.", "b": false, "tr": null}, {"zh": "你应该根据天气选择合适的衣服。", "py": "Nǐ yīnggāi gēnjù tiānqì xuǎnzé héshì de yīfu.", "id": "Kamu harus memilih baju yang cocok sesuai cuaca.", "b": false, "tr": null}, {"zh": "根据你的情况，我觉得你应该多休息。", "py": "Gēnjù nǐ de qíngkuàng, wǒ juéde nǐ yīnggāi duō xiūxi.", "id": "Berdasarkan kondisimu, menurutku kamu harus banyak istirahat.", "b": false, "tr": null}, {"zh": "老师会根据每个学生的水平，给他们不同的作业。", "py": "Lǎoshī huì gēnjù měi gè xuéshēng de shuǐpíng, gěi tāmen bùtóng de zuòyè.", "id": "Guru akan memberi PR yang berbeda sesuai tingkat kemampuan tiap siswa.", "b": false, "tr": null}, {"zh": "我们根据价格决定买哪个。", "py": "Wǒmen gēnjù jià gé juédìng mǎi nǎge.", "id": "Kami memutuskan membeli yang mana berdasarkan harganya.", "b": false, "tr": null}, {"zh": "根据地图，前边就是火车站。", "py": "Gēnjù dìtú, qiánbian jiù shì huǒchē zhàn.", "id": "Menurut peta, di depan itu stasiun kereta.", "b": false, "tr": null}, {"zh": "这个电影是根据一个真实的故事拍的。", "py": "Zhège diànyǐng shì gēnjù yí gè zhēn shí de gùshi pāi de.", "id": "Film ini dibuat berdasarkan kisah nyata.", "b": false, "tr": null}], "salah": [{"s": "根据我，这个电影很好看。", "sp": "Gēnjù wǒ, zhège diànyǐng hěn hǎokàn.", "n": "", "b": "在我看来，这个电影很好看。", "bp": "Zài wǒ kànlái, zhège diànyǐng hěn hǎokàn.", "a": "Pendapat pribadi tidak memakai 根据; pakai 在我看来/我觉得."}, {"s": "我们决定根据天气什么时候去。", "sp": "Wǒmen juédìng gēnjù tiānqì shénme shíhou qù.", "n": "", "b": "我们根据天气决定什么时候去。", "bp": "Wǒmen gēnjù tiānqì juédìng shénme shíhou qù.", "a": "Frasa 根据…… diletakkan sebelum kata kerja utama."}, {"s": "老师根据选择了书。", "sp": "Lǎoshī gēnjù xuǎnzé le shū.", "n": "", "b": "老师根据学生的兴趣选择了书。", "bp": "L , "x": "Kami memutuskan membeli yang mana berdasarkan harga."}, {"k": "15-1.10", "t": "su", "w": ["这个", "电影", "是", "根据", "真实", "的", "故事", "拍", "的"], "s": "这个电影是根据真实的故事拍的。", "alt": [], "p": "Zhège diànyǐng shì gēnjù zhēn shí de gùshi pāi de.", "x": "Film ini dibuat berdasarkan kisah nyata."}, {"k": "15-1.11", "t": "bs", "s": "根据你的情况，你应该多休息。", "sp": "Gēnjù nǐ de qíngkuàng, nǐ yīnggāi duō xiūxi.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "15-1.12", "t": "bs", "s": "根据我，汉语不太难。", "sp": "Gēnjù wǒ, Hànyǔ bú tài nán.", "n": "", "ok": false, "b": "在我看来，汉语不太难。", "bp": "Zài wǒ kànlái, Hànyǔ bú tài nán.", "x": "Pendapat pribadi: 在我看来/我觉得."}, {"k": "15-1.13", "t": "bs", "s": "我们会根据天气决定去不去。", "sp": "Wǒmen huì gēnjù tiānqì juédìng qù bu qù.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "15-1.14", "t": "bs", "s": "老师会给作业根据学生的水平。", "sp": "Lǎoshī huì gěi zuòyè gēnjù xuéshēng de shuǐpíng.", "n": "", "ok": false, "b": "老师会根据学生的水平给作业。", "bp": "Lǎoshī huì gēnjù xuéshēng de shuǐpíng gěi zuòyè.", "x": "根据…… sebelum kata kerja."}, {"k": "15-1.15", "t": "bs", "s": "这几年小区根据大家的需要，有了很多变化。", "sp": "Zhè jǐ nián xiǎoqū gēnjù dàjiā de xūyào, yǒu le hěn duō biànhuà.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "15-2", "pel": 15, "judul": "Pengulangan bilangan-kata satuan: 一 + KS + 一 + KS (一个一个, 一天一天)", "kode": "数量重叠\"数词+量词+数词+量词\"", "rumus": ["一 + KSat + 一 + KSat + (地) + KK", "两 + KSat + 两 + KSat + 地 + KK (dua-dua)"], "jelas": ["Frasa bilangan + kata satuan bisa diulang: 一个一个, 一天一天, 一点儿一点儿, 两个两个. Hasil pengulangan ini diletakkan SEBELUM kata kerja dan menjelaskan CARA tindakan dilakukan: satu per satu, hari demi hari, sedikit demi sedikit, dua-dua. Pola ini membuat kalimat lebih hidup dan terbayang.", "Susunan: bilangan + kata satuan + bilangan + kata satuan + (地) + kata kerja. 地 boleh dipakai atau tidak: 学生们的汉语水平一天一天地提高了; 我得一点儿一点儿给您讲.", "Arti yang umum: 一个一个(地) = satu per satu; 一天一天(地) = hari demi hari (perlahan-lahan berubah); 一点儿一点儿 = sedikit demi sedikit; 一年一年 = tahun demi tahun; 一本一本 = buku demi buku; 两个两个 = dua-dua (berpasangan).", "Kata satuannya harus sesuai dengan bendanya: buku → 一本一本, foto → 一张一张, kata/huruf → 一个一个, langkah → 一步一步. Jangan selalu memakai 个.", "Bandingkan dengan bahasa Indonesia \"satu per satu\", \"hari demi hari\", \"sedikit demi sedikit\". Polanya mirip, hanya saja bahasa Mandarin mengulang bilangan + kata satuan secara lengkap, dan letaknya sebelum kata kerja, bukan di akhir kalimat. \"Mereka masuk satu per satu\" = 他们一个一个地走进去, bukan *他们走进去一个一个."], "poin": ["Pengulangan 一 + KSat menyatakan cara: satu per satu, sedikit demi sedikit.", "Letak: sebelum kata kerja, boleh + 地.", "Kata satuan sesuai benda (本, 张, 步, 天).", "两个两个 = dua-dua."], "contoh": [{"zh": "我得一点儿一点儿给您讲。", "py": "Wǒ de yìdiǎnr yìdiǎnr gěi nín jiǎng.", "id": "Saya harus menjelaskannya pada Anda sedikit demi sedikit.", "b": true, "tr": "15-3"}, {"zh": "学生们的汉语水平一天一天地提高了。", "py": "Xuéshēngmen de Hànyǔ shuǐpíng yì tiān yì tiān dì tígāo le.", "id": "Kemampuan bahasa Mandarin para siswa meningkat hari demi hari.", "b": true, "tr": null}, {"zh": "他们两个两个地走进去了。", "py": "Tāmen liǎng gè liǎng gè dì zǒu jìnqù le.", "id": "Mereka masuk dua-dua.", "b": true, "tr": null}, {"zh": "她一本一本地看，已经看完十多本了。", "py": "Tā yì běn yì běn dì kàn, yǐjīng kàn wán shí duō běn le.", "id": "Dia membacanya buku demi buku, sudah selesai lebih dari sepuluh buku.", "b": false, "tr": null}, {"zh": "请大家一个一个地进来。", "py": "Qǐng dàjiā yí gè yí gè dì jìnlái.", "id": "Silakan semua masuk satu per satu.", "b": false, "tr": null}, {"zh": "孩子一天一天地长大了。", "py": "Háizi yì tiān yì tiān dì zhǎng dà le.", "id": "Anak itu tumbuh besar hari demi hari.", "b": false, "tr": null}, {"zh": "他把照片一张一张地看了一遍。", "py": "Tā bǎ zhàopiàn yì Zhāng yì Zhāng dì kàn le yí biàn.", "id": "Dia melihat foto-foto itu satu per satu.", "b": false, "tr": null}, {"zh": "学汉字要一个一个地记。", "py": "Xué Hànzì yào yí gè yí gè dì jì.", "id": "Belajar hanzi harus menghafalnya satu per satu.", "b": fa dul": "Frasa tetap 在……看来 (menurut pandangan …)", "kode": "固定短语\"在……看来\"", "rumus": ["在 + orang/kelompok + 看来，+ pendapat", "在我看来 / 在他们看来 / 在中国人看来"], "jelas": ["在……看来 dipakai untuk menyatakan PENDAPAT atau sudut pandang seseorang atau suatu kelompok: \"menurut pandangan …\", \"bagi …\". 在我看来，每天读书是一种很好的习惯 = menurut saya, membaca setiap hari adalah kebiasaan yang sangat baik.", "Di antara 在 dan 看来 diisi orang atau kelompok: 在我看来, 在同事们看来, 在我们中国人看来, 在很多人看来. Frasa ini biasanya di AWAL kalimat lalu diikuti koma.", "Jangan menambahkan 的: bukan *在我的看来. Juga jangan menghilangkan 在 di kalimat formal; tetapi 我看 (tanpa 在 dan 来) adalah bentuk lisan lain yang artinya mirip: 我看你应该去.", "Bedakan dengan 看起来 (kelihatannya, berdasarkan penampilan): 他看起来很累 (dia kelihatan capek). 在……看来 adalah pendapat/penilaian, bukan penampilan. Bedakan juga dengan 根据 (berdasarkan fakta/aturan).", "Jebakan pelajar Indonesia: \"menurut saya\" sering diterjemahkan *根据我 atau *对我来说 untuk semua situasi. Untuk pendapat, yang tepat adalah 在我看来 atau 我觉得. (对我来说 = \"bagi saya\", untuk sesuatu yang berpengaruh pada diri saya, mis. 对我来说，汉字很难.)"], "poin": ["在 + orang + 看来 = menurut pandangan orang itu.", "Biasanya di awal kalimat + koma.", "Tanpa 的: 在我看来.", "Beda dengan 看起来 (kelihatannya)."], "contoh": [{"zh": "在我们中国人看来，黄河像妈妈一样，养了我们几千年。", "py": "Zài wǒmen Zhōngguó rén kànlái, huánghé xiàng māma yíyàng, yǎng le wǒmen jǐ qiān nián.", "id": "Bagi kami orang Tiongkok, Sungai Kuning seperti ibu, telah menghidupi kami selama ribuan tahun.", "b": true, "tr": "15-5"}, {"zh": "在同事们看来，她工作非常认真。", "py": "Zài tóngshìmen kànlái, tā gōngzuò fēicháng rènzhēn.", "id": "Menurut rekan-rekan kerjanya, dia bekerja sangat sungguh-sungguh.", "b": true, "tr": null}, {"zh": "在我看来，每天读书是一种很好的习惯。", "py": "Zài wǒ kànlái, měi tiān dúshū shì yì zhǒng hěn hǎo de xíguàn.", "id": "Menurut saya, membaca setiap hari adalah kebiasaan yang sangat baik.", "b": true, "tr": null}, {"zh": "在我看来，时间比钱更重要。", "py": "Zài wǒ kànlái, shíjiān bǐ qián gèng zhòngyào.", "id": "Menurut saya, waktu lebih penting daripada uang.", "b": false, "tr": null}, {"zh": "在医生看来，每天运动对身体很好。", "py": "Zài yīshēng kànlái, měi tiān yùndòng duì shēntǐ hěn hǎo.", "id": "Menurut dokter, berolahraga setiap hari sangat baik untuk tubuh.", "b": false, "tr": null}, {"zh": "在很多人看来，这个城市的环境非常好。", "py": "Zài hěn duō rén kànlái, zhège chéngshì de huánjìng fēicháng hǎo.", "id": "Menurut banyak orang, lingkungan kota ini sangat bagus.", "b": false, "tr": null}, {"zh": "在老师看来，小明是一个很聪明的学生。", "py": "Zài lǎoshī kànlái, Xiǎomíng shì yí gè hěn cōngmíng de xuéshēng.", "id": "Menurut guru, Xiaoming adalah murid yang sangat pintar.", "b": false, "tr": null}, {"zh": "在孩子们看来，过年是最快乐的事。", "py": "Zài háizimen kànlái, guònián shì zuì kuàilè de shì.", "id": "Bagi anak-anak, merayakan tahun baru adalah hal yang paling menyenangkan.", "b": false, "tr": null}, {"zh": "在他看来，学汉语不太难。", "py": "Zài tā kànlái, xué Hànyǔ bú tài nán.", "id": "Menurut dia, belajar bahasa Mandarin tidak terlalu sulit.", "b": false, "tr": null}, {"zh": "在爸爸妈妈看来，我永远是个孩子。", "py": "Zài bàba māma kànlái, wǒ yǒng yuǎn shì gè háizi.", "id": "Di mata ayah dan ibu, aku selamanya anak kecil.", "b": false, "tr": null}], "salah": [{"s": "在我的看来，这本书很有意思。", "sp": "Zài wǒ de kànlái, zhè běn shū hěn yǒuyìsi.", "n": "", "b": "在我看来，这本书很有意思。", "bp": "Zài wǒ kànlái, zhè běn shū hěn yǒuyìsi.", "a": "Tidak memakai 的 di antara orang dan 看来."}, {"s": "根据我，时间比钱更重要。", "sp": "Gēnjù wǒ, shíjiān bǐ qián gèng zhòngyào.", "n": "", "b": "在我看来，时间比钱更重要。", "bp": "Zài wǒ kànlái, shíjiān bǐ qián gèng zhòngyào.", "a": "Pendapat pribadi: 在我看来, bukan 根据我."}, {"s": "在我看起来，他是个好人。", "sp": "Zài wǒ kàn qǐlái, tā shì gè hǎo rén.", "n": "", "b": "在我看来，他是个好人。", "bp": "Zài wǒ kànlái, tā shì gè hǎo rén.", "a": "Frasa tetapnya 在……看来; 看起来 artinya \"kelihatannya\"."}], "latihan": [{"k": "15-3.0", "t": "pg", "q": "___我看来，每天读书是很好的习惯。", "o": ["在", "根据", "关于", "向"], "a": 0, "x": "Frasa tetap 在……看来.", "f": "在我看来，每天读书是很好的习惯。", "fp": "Zài wǒ kànlái, měi tiān dúshū shì hěn hǎo de xíguàn."}, {"k": "15-3.1", "t": "pg", "q": "在同事们___，她工作非常认真。", "o": ["看来", "看起来", "看见", "看到"], "a": 0, "x": "Pasangan 在 adalah 看来.", "f": "在同事们看来，她工作非常认真。", "fp": "Zài tóngshìmen kànlái, tā gōngzuò fēicháng rènzhēn."}, {"k": "15-3.2", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["在我看来，汉语很有意思。", "在我的看来，汉语很有意思。", "在看来我，汉语很有意思。", "我在看来，汉语很有意思。"], "a": 0, "x": "在 + orang + 看来, tanpa 的."}, {"k": "15-3.3", "t": "pg", "q": "\"Dia kelihatan capek\" =", "o": ["他看起来很累。", "在他看来很累。", "在他看起来很累。", "他在看来很累。"], "a": 0, "x": "Penampilan → 看起来, bukan 在……看来."}, {"k": "15-3.4", "t": "pg", "q": "\"Menurut banyak orang, kota ini indah\" =", "o": ["在很多人看来，这个城市很漂亮。", "根据很多人，这个城市很漂亮。", "在很多人的看来，这个城市很漂亮。", "很多人在看来，这个城市很漂亮。"], "a": 0, "x": "Pendapat kelompok: 在很多人看来."}, {"k": "15-3.5", "t": "pg", "q": "A：你觉得钱重要还是时间重要？ B：___", "o": ["在我看来，时间比钱更重要。", "根据我，时间比钱更重要。", "在我看起来，时间比钱更重要。", "我看来在，时间比钱更重要。"], "a": 0, "x": "Menyatakan pendapat: 在我看来."}, {"k": "15-3.6", "t": "su", "w": ["在", "我", "看来，", "时间", "比", "钱", "更", "重要"], "s": "在我看来，时间比钱更重要。", "alt": [], "p": "Zài wǒ kànlái, shíjiān bǐ qián gèng zhòngyào.", "x": "Menurut saya, waktu lebih penting daripada uang."}, {"k": "15-3.7", "t": "su", "w": ["在", "同事们", "看来，", "她", "工作", "非常", "认真"], "s": "在同事们看来，她工作非常认真。", "alt": [], "p": "Zài tóngshìmen kànlái, tā gōngzuò fēicháng rènzhēn.", "x": "Menurut rekan kerja, dia bekerja sangat serius."}, {"k": "15-3.8", "t": "su", "w": ["在", "医生", "看来，", "每天", "运动", "对", "身体", "很", "好"], "s": "在医生看来，每天运动对身体很好。", "alt": [], "p": "Zài yīshēng kànlái, měi tiān yùndòng duì shēntǐ hěn hǎo.", "x": "Menurut dokter, olahraga setiap hari baik untuk tubuh."}, {"k": "15-3.9", "t": "su", "w": ["在", "他", "看来，", "学", "汉语", "不", "太", "难"], "s": "在他看来，学汉语不太难。", "alt": [], "p": "Zài tā kànlái, xué Hànyǔ bú tài nán.", "x": "Menurut dia, belajar Mandarin tidak terlalu sulit."}, {"k": "15-3.10", "t": "su", "w": ["在", "孩子们", "看来，", "过年", "最", "快乐"], "s": "在孩子们看来，过年最快乐。", "alt": [], "p": "Zài háizimen kànlái, guònián zuì kuàilè.", "x": "Bagi anak-anak, tahun baru paling menyenangkan."}, {"k": "15-3.11", "t": "bs", "s": "在我看来，这个办法很好。", "sp": "Zài wǒ kànlái, zhège bànfǎ hěn hǎo.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "15-3.12", "t": "bs", "s": "在我的看来，他说得对。", "sp": "Zài wǒ de kànlái, tā shuō de duì.", "n": "", "ok": false, "b": "在我看来，他说得对。", "bp": "Zài wǒ kànlái, tā shuō de duì.", "x": "Tanpa 的."}, {"k": "15-3.13", "t": "bs", "s": "在中国人看来，黄河像妈妈一样。", "sp": "Zài Zhōngguó rén kànlái, huánghé xiàng māma yíyàng.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "15-3.14", "t": "bs", "s": "在老师看起来，他很聪明。", "sp": "Zài lǎoshī kàn qǐlái, tā hěn cōngmíng.", "n": "", "ok": false, "b": "在老师看来，他很聪明。", "bp": "Zài lǎoshī kànlái, tā hěn cōngmíng.", "x": "Frasa tetapnya 在……看来."}, {"k": "15-3.15", "t": "bs", "s": "在很多人看来，这个城市的环境非常好。", "sp": "Zài hěn duō rén kànlái, zhège chéngshì de huánjìng fēicháng hǎo.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "15-4", "pel": 15, "judul": "Frasa tetap 不一会儿 (tak lama kemudian)", "kode": "固定短语\"不一会儿\"", "rumus": ["不一会儿，S + 就 + KK + 了", "S + 不一会儿 + 就 + KK + 了"], "jelas": ["不一会儿 berarti \"tidak lama kemudian / sebentar saja\". Frasa ini menunjukkan bahwa sesuatu terjadi dalam waktu yang sangat singkat. 不一会儿，张校长就来了 = tidak lama kemudian, Kepala Sekolah Zhang datang.", "不一会儿 berfungsi sebagai keterangan waktu: bisa di awal kalimat (diikuti koma) atau setelah subjek, sebelum kata kerja. Hampir selalu dipasangkan dengan 就 dan diakhiri 了: 难过的事情不一会儿就忘了.", "Karena menceritakan sesuatu yang sudah terjadi dengan cepat, 不一会儿 paling sering dipakai untuk kejadian lampau atau dalam cerita. Pola ini bergaya lisan.", "Bedakan dengan 一会儿 (tanpa 不): 一会儿 = sebentar / nanti. 等一会儿 = tunggu sebentar; 一会儿见 = sampai nanti; 休息一会儿 = istirahat sebentar. 不一会儿 TIDAK bisa dipakai untuk \"tunggu sebentar\" atau setelah kata kerja.", "Walaupun ada 不, 不一会儿 tidak bermakna ingkar. Pelajar Indonesia kadang mengira artinya \"bukan sebentar\" (lama). Justru sebaliknya: artinya \"tidak sampai sebentar\" = sangat cepat."], "poin": ["不一会儿 = tak lama kemudian (cepat).", "Di awal kalimat atau setelah subjek.", "Biasanya + 就 …… 了.", "一会儿 = sebentar/nanti; berbeda dengan 不一会儿."], "contoh": [{"zh": "难过的事情不一会儿就忘了。", "py": "Nánguò de shìqing bù yíhuìr jiù wàng le.", "id": "Hal yang menyedihkan sebentar saja sudah terlupa.", "b": true, "tr": "15-7"}, {"zh": "不一会儿，张校长就来了。", "py": "Bù yíhuìr, Zhāng xiàozhǎng jiù lái le.", "id": "Tidak lama kemudian, Kepala Sekolah Zhang datang.", "b": true, "tr": null}, {"zh": "两个小时看起来长，但是不一会儿就过去了。", "py": "Liǎng gè xiǎoshí kàn qǐlái cháng, dànshì bù yíhuìr jiù guòqù le.", "id": "Dua jam kelihatannya lama, tetapi sebentar saja sudah lewat.", "b": true, "tr": null}, {"zh": "我只想看半个小时电视，可是不一会儿一个小时就过去了。", "py": "Wǒ zhī xiǎng kàn bàn gè xiǎoshí diànshì, kěshì bù yíhuìr yí gè xiǎoshí jiù guòqù le.", "id": "Aku cuma mau nonton TV setengah jam, tapi tahu-tahu satu jam sudah lewat.", "b": false, "tr": null}, {"zh": "他们在门口站着，不一会儿，出租车就来了。", "py": "Tāmen zài ménkǒu zhàn zhe, bù yíhuìr, chūzūchē jiù lái le.", "id": "Mereka berdiri di depan pintu, tidak lama kemudian taksinya datang.", "b": false, "tr": null}, {"zh": "孩子太累了，不一会儿就睡着了。", "py": "Háizi tài lèi le, bù yíhuìr jiù shuì zháo le.", "id": "Anak itu terlalu capek, sebentar saja sudah tertidur.", "b": false, "tr": null}, {"zh": "刚开始下雨，不一会儿，路上就没有人了。", "py": "Gāng kāishǐ xià yǔ, bù yíhuìr, lùshang jiù méiyǒu rén le.", "id": "Baru mulai hujan, tidak lama kemudian jalanan sudah sepi.", "b": false, "tr": null}, {"zh": "他饿极了，不一会儿就把饭吃完了。", "py": "Tā è jí le, bù yíhuìr jiù bǎ fàn chī wán le.", "id": "Dia lapar sekali, sebentar saja makanannya sudah habis.", "b": false, "tr": null}, {"zh": "我们坐在会议室里，不一会儿，经理就进来了。", "py": "Wǒmen zuò zài huìyì shì lǐ, bù yíhuìr, jīnglǐ jiù jìnlái le.", "id": "Kami duduk di ruang rapat, tidak lama kemudian manajernya masuk.", "b": false, "tr": null}, {"zh": "天黑了，不一会儿，月亮就出来了。", "py": "Tiān hēi le, bù yíhuìr, yuèliang jiù chūlái le.", "id": "Hari sudah gelap, tidak lama kemudian bulan muncul.", "b": false, "tr": null}], "salah": [{"s": "请你等不一会儿。", "sp": "Qǐng nǐ děng bù yíhuìr.", "n": "", "b": "请你等一会儿。", "bp": "Qǐng nǐ děng yíhuìr.", "a": "\"Tunggu sebentar\" memakai 一会儿, bukan 不一会儿."}, {"s": "不一会儿，他来了就。", "sp": "Bù yíhuìr, tā lái le jiù.", "n": "", "b": "不一会儿，他就来了。", "bp": "Bù yíhuìr, tā jiù lái le.", "a": "就 diletakkan sebelum kata kerja."}, {"s": "我休息了不一会儿。", "sp": "Wǒ xiūxi le bù yíhuìr.", "n": "", "b": "我休息了一会儿。", "bp": "Wǒ xiūxi le yíhuìr.", "a": "Durasi setelah kata kerja memakai 一会儿."}], "latihan": [{"k": "15-4.0", "t": "pg", "q": "孩子太累了，___就睡着了。", "o": ["不一会儿", "一会儿以后吗", "不会儿", "一下儿不"], "a": 0, "x": "Tak lama kemudian: 不一会儿 + 就.", "f": "孩子太累了，不一会儿就睡着了。", "fp": "Háizi tài lèi le, bù yíhuìr jiù shuì zháo le."}, {"k": "15-4.1", "t": "pg", "q": "请你等___，他马上就来。", "o": ["一会儿", "不一会儿", "不会", "一下子不"], "a": 0, "x": "\"Tunggu sebentar\" = 等一会儿.", "f": "请你等一会儿，他马上就来。", "fp": "Qǐng nǐ děng yíhuìr, tā mǎshàng jiù lái."}, {"k": "15-4.2", "t": "pg", "q": "不一会儿，张校长___来了。", "o": ["就", "才", "再", "还"], "a": 0, "x": "不一会儿 biasanya dipasangkan dengan 就.", "f": "不一会儿，张校长就来了。", "fp": "Bù yíhuìr, Zhāng xiàozhǎng jiù lái le."}, {"k": "15-4.3", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["他饿极了，不一会儿就吃完了。", "他饿极了，吃完了不一会儿。", "他饿极了，就不一会儿吃完了。", "他饿极了，不一会儿吃完就了。"], "a": 0, "x": "不一会儿 + 就 + KK + 了."}, {"k": "15-4.4", "t": "pg", "q": "\"不一会儿就过去了\" artinya …", "o": ["sebentar saja sudah lewat", "tidak lewat sama sekali", "lewatnya lama sekali", "tidak akan lewat"], "a": 0, "x": "不一会儿 = waktu yang sangat singkat."}, {"k": "15-4.5", "t": "pg", "q": "A：出租车什么时候来的？ B：___", "o": ["我们在门口站着，不一会儿就来了。", "我们在门口站着，一会儿不来了。", "我们在门口站着，来了不一会儿就。", "我们在门口站着，不一会儿来就了。"], "a": 0, "x": "不一会儿就来了."}, {"k": "15-4.6", "t": "su", "w": ["不一会儿，", "张", "校长", "就", "来", "了"], "s": "不一会儿，张校长就来了。", "alt": [], "p": "Bù yíhuìr, Zhāng xiàozhǎng jiù lái le.", "x": "Tidak lama kemudian Kepala Sekolah Zhang datang."}, {"k": "15-4.7", "t": "su", "w": ["孩子", "不一会儿", "就", "睡着", "了"], "s": "孩子不一会儿就睡着了。", "alt": [], "p": "Háizi bù yíhuìr jiù shuì zháo le.", "x": "Anak itu sebentar saja sudah tertidur."}, {"k": "15-4.8", "t": "su", "w": ["难过", "的", "事情", "不一会儿", "就", "忘", "了"], "s": "难过的事情不一会儿就忘了。", "alt": [], "p": "Nánguò de shìqing bù yíhuìr jiù wàng le.", "x": "Hal yang menyedihkan sebentar saja sudah terlupa."}, {"k": "15-4.9", "t": "su", "w": ["他", "不一会儿", "就", "把", "饭", "吃", "完", "了"], "s": "他不一会儿就把饭吃完了。", "alt": [], "p": "Tā bù yíhuìr jiù bǎ fàn chī wán le.", "x": "Sebentar saja dia sudah menghabiskan makanannya."}, {"k": "15-4.10", "t": "su", "w": ["不一会儿，", "出租车", "就", "来", "了"], "s": "不一会儿，出租车就来了。", "alt": [], "p": "Bù yíhuìr, chūzūchē jiù lái le.", "x": "Tidak lama kemudian taksinya datang."}, {"k": "15-4.11", "t": "bs", "s": "不一会儿，雨就停了。", "sp": "Bù yíhuìr, yǔ jiù tíng le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "15-4.12", "t": "bs", "s": "请你等不一会儿。", "sp": "Qǐng nǐ děng bù yíhuìr.", "n": "", "ok": false, "b": "请你等一会儿。", "bp": "Qǐng nǐ děng yíhuìr.", "x": "\"Tunggu sebentar\" memakai 一会儿."}, {"k": "15-4.13", "t": "bs", "s": "两个小时不一会儿就过去了。", "sp": "Liǎng gè xiǎoshí bù yíhuìr jiù guòqù le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "15-4.14", "t": "bs", "s": "不一会儿，他来就了。", "sp": "Bù yíhuìr, tā lái jiù le.", "n": "", "ok": false, "b": "不一会儿，他就来了。", "bp": "Bù yíhuìr, tā jiù lái le.", "x": "就 sebelum kata kerja."}, {"k": "15-4.15", "t": "bs", "s": "我们坐了不一会儿。", "sp": "Wǒmen zuò le bù yíhuìr.", "n": "", "ok": false, "b": "我们坐了一会儿。", "bp": "Wǒmen zuò le yíhuìr.", "x": "Durasi setelah kata kerja memakai 一会儿."}]}, {"id": "16-1", "pel": 16, "judul": "Kalimat setara: 一会儿……，一会儿…… (sebentar …, sebentar …)", "kode": "并列复句\"一会儿……，一会儿……\"", "rumus": ["S + 一会儿 + KK1，一会儿 + KK2", "S + 一会儿 + KS1，一会儿 + KS2"], "jelas": ["一会儿……，一会儿…… menyatakan dua tindakan atau keadaan yang BERGANTIAN dalam waktu singkat: sebentar begini, sebentar begitu. 他一会儿进来，一会儿出去 = sebentar dia masuk, sebentar keluar. Pola ini juga dipakai untuk keadaan yang berlawanan dan cepat berubah: 一会儿冷，一会儿热 (sebentar dingin, sebentar panas).", "Susunannya: subjek disebut sekali di depan, lalu 一会儿 sebelum setiap kata kerja atau kata sifat. Setelah 一会儿 boleh langsung kata sifat tanpa 很: 一会儿冷，一会儿热.", "Beda penting dengan 一边……，一边……: 一边 = dua tindakan BERSAMAAN (makan sambil mengobrol); 一会儿 = dua tindakan BERGANTIAN, tidak bersamaan (sebentar tidur, sebentar memanjat). Kucing tidak bisa tidur sambil memanjat, jadi kalimat buku memakai 一会儿.", "Pola ini sering bernada \"tidak tetap/plin-plan\" atau menggambarkan kesibukan: 她的想法总是变，一会儿说想学画画，一会儿说想学跳舞.", "Dalam bahasa Indonesia kita bilang \"sebentar-sebentar …\" atau \"kadang … kadang …\". Ingat bahwa 一会儿 juga punya arti lain: \"sebentar\" (等一会儿) dan \"nanti\" (一会儿见). Dalam pola ini, 一会儿 selalu muncul dua kali."], "poin": ["Dua tindakan/keadaan bergantian dalam waktu singkat.", "一会儿 dipakai dua kali, sebelum tiap KK/KS.", "Beda dengan 一边……一边…… (bersamaan).", "KS boleh langsung setelah 一会儿: 一会儿冷，一会儿热."], "contoh": [{"zh": "它一会儿在你脚边睡觉，一会儿在你身上爬。", "py": "Tā yíhuìr zài nǐ jiǎo biān shuìjiào, yíhuìr zài nǐ shēn shàng pá.", "id": "Sebentar ia tidur di dekat kakimu, sebentar ia merayap di badanmu.", "b": true, "tr": null}, {"zh": "他一会儿进来，一会儿出去，忙得很。", "py": "Tā yíhuìr jìnlái, yíhuìr chūqù, máng de hěn.", "id": "Sebentar dia masuk, sebentar keluar, sibuk sekali.", "b": true, "tr": null}, {"zh": "最近天气变化很快，一会儿冷，一会儿热。", "py": "Zuìjìn tiānqì biànhuà hěn kuài, yíhuìr lěng, yíhuìr rè.", "id": "Belakangan ini cuaca cepat berubah, sebentar dingin, sebentar panas.", "b": true, "tr": null}, {"zh": "她的想法总是变，一会儿说想学画画，一会儿说想学跳舞。", "py": "Tā de xiǎng fǎ zǒngshì biàn, yíhuìr shuō xiǎng xué huà huà, yíhuìr shuō xiǎng xué tiàowǔ.", "id": "Pikirannya selalu berubah, sebentar bilang mau belajar melukis, sebentar bilang mau belajar menari.", "b": false, "tr": null}, {"zh": "运动会上，他一会儿参加跑步比赛，一会儿参加游泳比赛。", "py": "Yùndònghuì shàng, tā yíhuìr cānjiā pǎobù bǐsài, yíhuìr cānjiā yóuyǒng bǐsài.", "id": "Di pekan olahraga, sebentar dia ikut lomba lari, sebentar ikut lomba renang.", "b": false, "tr": null}, {"zh": "这只猫很可爱，一会儿躺在沙发上睡觉，一会儿跑到门口看看。", "py": "Zhè zhī māo hěn kě'ài, yíhuìr tǎng zài shāfā shàng shuìjiào, yíhuìr pǎo dào ménkǒu kànkan.", "id": "Kucing ini lucu sekali, sebentar berbaring tidur di sofa, sebentar lari ke pintu melihat-lihat.", "b": false, "tr": null}, {"zh": "孩子一会儿哭，一会儿笑。", "py": "Háizi yíhuìr kū, yíhuìr xiào.", "id": "Anak itu sebentar menangis, sebentar tertawa.", "b": false, "tr": null}, {"zh": "他一会儿看看手机，一会儿看看手表，好像在等人。", "py": "Tā yíhuìr kànkan shǒujī, yíhuìr kànkan shǒubiǎo, hǎoxiàng zài děng rén.", "id": "Sebentar dia melihat HP, sebentar melihat jam tangan, sepertinya sedang menunggu seseorang.", "b": false, "tr": null}, {"zh": "今天的天气一会儿晴，一会儿阴。", "py": "Jīntiān de tiānqì yíhuìr qíng, yíhuìr yīn.", "id": "Cuaca hari ini sebentar cerah, sebentar mendung.", "b": false, "tr": null}, {"zh": "弟弟一会儿要喝水，一会儿要吃东西。", "py": "Dìdi yíhuìr yào hē shuǐ, yíhuìr yào chī dōngxi.", "id": "Adik sebentar minta minum, sebentar minta makan.", "b": false, "tr": null}], "salah": [{"s": "他一会儿吃饭，一会儿看电视。", "sp": "Tā yíhuìr chīfàn, yíhuìr kàn diànshì.", "n": "makan sambil nonton TV", "b": "他一边吃饭，一边看电视。", "bp": "Tā yìbiān chīfàn, yìbiān kàn diànshì.", "a": "Tindakan bersamaan memakai 一边……一边……"}, {"s": "天气一会儿很冷。", "sp": "Tiānqì yíhuìr hěn lěng.", "n": "", "b": "天气一会儿冷，一会儿热。", "bp": "Tiānqì yíhuìr lěng, yíhuìr rè.", "a": "一会儿 harus dipakai dua kali."}, {"s": "一会儿他进来，一会儿他出去。", "sp": "Yíhuìr tā jìnlái, yíhuìr tā chūqù.", "n": "", "b": "他一会儿进来，一会儿出去。", "bp": "Tā yíhuìr jìnlái, yíhuìr chūqù.", "a": "Subjek disebut sekali di depan, sebelum 一会儿 pertama."}], "latihan": [{"k": "16-1.0", "t": "pg", "q": "最近天气变化很快，一会儿冷，___热。", "o": ["一会儿", "一边", "也", "又是"], "a": 0, "x": "Pasangan pola: 一会儿……，一会儿…….", "f": "最近天气变化很快，一会儿冷，一会儿热。", "fp": "Zuìjìn tiānqì biànhuà hěn kuài, yíhuìr lěng, yíhuìr rè."}, {"k": "16-1.1", "t": "pg", "q": "Pilih yang tepat: 他___吃饭，___看电视。(bersamaan)", "o": ["一边 / 一边", "一会儿 / 一会儿", "先 / 一会儿", "不一会儿 / 就"], "a": 0, "x": "Dua tindakan bersamaan → 一边……一边……."}, {"k": "16-1.2", "t": "pg", "q": "Pilih yang tepat: 孩子___哭，___笑。(bergantian)", "o": ["一会儿 / 一会儿", "一边 / 一边", "先 / 再", "又 / 不"], "a": 0, "x": "Bergantian dalam waktu singkat → 一会儿."}, {"k": "16-1.3", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["他一会儿进来，一会儿出去。", "一会儿他进来，一会儿他出去。", "他进来一会儿，出去一会儿。", "他一会儿进来，出去。"], "a": 0, "x": "Subjek di depan, 一会儿 sebelum tiap KK."}, {"k": "16-1.4", "t": "pg", "q": "\"Cuaca sebentar cerah, sebentar mendung\" =", "o": ["天气一会儿晴，一会儿阴。", "天气一边晴，一边阴。", "天气晴一会儿，阴一会儿。", "天气不一会儿晴，不一会儿阴。"], "a": 0, "x": "Keadaan bergantian: 一会儿 + KS."}, {"k": "16-1.5", "t": "pg", "q": "A：你妹妹想学什么？ B：她的想法总是变，___", "o": ["一会儿说想学画画，一会儿说想学跳舞。", "一边说想学画画，一边说想学跳舞。", "说想学画画一会儿，说想学跳舞一会儿。", "不一会儿说想学画画。"], "a": 0, "x": "Pikiran berganti-ganti → 一会儿……一会儿……."}, {"k": "16-1.6", "t": "su", "w": ["孩子", "一会儿", "哭，", "一会儿", "笑"], "s": "孩子一会儿哭，一会儿笑。", "alt": [], "p": "Háizi yíhuìr kū, yíhuìr xiào.", "x": "Anak itu sebentar menangis, sebentar tertawa."}, {"k": "16-1.7", "t": "su", "w": ["天气", "一会儿", "冷，", "一会儿", "热"], "s": "天气一会儿冷，一会儿热。", "alt": [], "p": "Tiānqì yíhuìr lěng, yíhuìr rè.", "x": "Cuaca sebentar dingin, sebentar panas."}, {"k": "16-1.8", "t": "su", "w": ["他", "一会儿", "进来，", "一会儿", "出去"], "s": "他一会儿进来，一会儿出去。", "alt": [], "p": "Tā yíhuìr jìnlái, yíhuìr chūqù.", "x": "Sebentar dia masuk, sebentar keluar."}, {"k": "16-1.9", "t": "su", "w": ["弟弟", "一会儿", "要", "喝水，", "一会儿", "要", "吃", "东西"], "s": "弟弟一会儿要喝水，一会儿要吃东西。", "alt": [], "p": "Dìdi yíhuìr yào hē shuǐ, yíhuìr yào chī dōngxi.", "x": "Adik sebentar minta minum, sebentar minta makan."}, {"k": "16-1.10", "t": "su", "w": ["今天", "一会儿", "晴，", "一会儿", "阴"], "s": "今天一会儿晴，一会儿阴。", "alt": ["一会儿今天晴，一会儿阴。"], "p": "Jīntiān yíhuìr qíng, yíhuìr yīn.", "x": "Hari ini sebentar cerah, sebentar mendung."}, {"k": "16-1.11", "t": "bs", "s": "它一会儿在沙发上睡觉，一会儿在地上跑。", "sp": "Tā yíhuìr zài shāfā shàng shuìjiào, yíhuìr zài dì shàng pǎo.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "16-1.12", "t": "bs", "s": "我一会儿吃饭，一会儿听音乐。", "sp": "Wǒ yíhuìr chīfàn, yíhuìr tīng yīnyuè.", "n": "makan sambil mendengarkan musik", "ok": false, "b": "我一边吃饭，一边听音乐。", "bp": "Wǒ yìbiān chīfàn, yìbiān tīng yīnyuè.", "x": "Bersamaan → 一边……一边……."}, {"k": "16-1.13", "t": "bs", "s": "最近天气一会儿冷，一会儿热。", "sp": "Zuìjìn tiānqì yíhuìr lěng, yíhuìr rè.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "16-1.14", "t": "bs", "s": "一会儿他看书，一会儿他写字。", "sp": "Yíhuìr tā kàn shū, yíhuìr tā xiě zì.", "n": "", "ok": false, "b": "他一会儿看书，一会儿写字。", "bp": "Tā yíhuìr kàn shū, yíhuìr xiě zì.", "x": "Subjek di depan."}, {"k": "16-1.15", "t": "bs", "s": "他一会儿看看手机，一会儿看看手表。", "sp": "Tā yíhuìr kànkan shǒujī, yíhuìr kànkan shǒubiǎo.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "16-2", "pel": 16, "judul": "Kata depan 关于 (tentang, mengenai)", "kode": "介词\"关于\"", "rumus": ["关于 + KB，S + KK …", "关于 + KB + 的 + KB (书/问题/文章)"], "jelas": ["关于 berarti \"tentang / mengenai\". Setelahnya ada kata benda atau frasa benda yang menjadi TOPIK pembicaraan: 关于这个问题, 关于他的要求, 关于比赛的时间.", "Sebagai keterangan, frasa 关于…… biasanya diletakkan di AWAL kalimat, SEBELUM subjek, lalu diikuti koma: 关于这个问题，我得慢慢给你讲. Tidak wajar menaruhnya setelah subjek: *我关于这个问题有意见 kurang tepat.", "Frasa 关于…… juga bisa menjadi penjelas kata benda dengan 的: 一本关于中国历史的书 (buku tentang sejarah Tiongkok), 关于熊猫的文章 (artikel tentang panda). Ingat penjelas selalu di depan kata benda.", "Bandingkan dengan 对: 对 menunjukkan sasaran sikap (\"terhadap\"), dan bisa setelah subjek: 他对中国文化很有兴趣. 关于 hanya menunjukkan topik. 关于这件事，我们明天再说 (mengenai hal ini …) vs 我对这件事很满意 (saya puas terhadap hal ini).", "Jebakan pelajar Indonesia: \"buku tentang Tiongkok\" diterjemahkan berurutan menjadi *书关于中国. Yang benar 关于中国的书 — frasa 关于 + 的 diletakkan di depan 书."], "poin": ["关于 + KB = tentang/mengenai.", "Sebagai keterangan: di awal kalimat, sebelum subjek.", "Sebagai penjelas: 关于……的 + KB.", "Beda dengan 对 (terhadap)."], "contoh": [{"zh": "关于这个问题，我得慢慢给你讲。", "py": "Guānyú zhège wèntí, wǒ de màn màn gěi nǐ jiǎng.", "id": "Tentang masalah ini, aku harus menjelaskannya padamu pelan-pelan.", "b": true, "tr": "16-3"}, {"zh": "关于他的要求，我们还要开会以后再决定。", "py": "Guānyú tā de yāoqiú, wǒmen hái yào kāihuì yǐhòu zài juédìng.", "id": "Mengenai permintaannya, kami masih harus rapat dulu baru memutuskan.", "b": true, "tr": null}, {"zh": "关于比赛的时间，我明天一定告诉大家。", "py": "Guānyú bǐsài de shíjiān, wǒ míngtiān yídìng gàosu dàjiā.", "id": "Mengenai waktu pertandingan, besok pasti saya beri tahu semuanya.", "b": true, "tr": null}, {"zh": "老师让我们写一篇关于熊猫的文章。", "py": "Lǎoshī ràng wǒmen xiě yì piān guānyú xióngmāo de wénzhāng.", "id": "Guru menyuruh kami menulis sebuah artikel tentang panda.", "b": false, "tr": null}, {"zh": "关于这次旅游，我还有一些问题想问你。", "py": "Guānyú zhè cì lǚyóu, wǒ hái yǒu yìxiē wèntí xiǎng wèn nǐ.", "id": "Tentang perjalanan kali ini, aku masih punya beberapa pertanyaan untukmu.", "b": false, "tr": null}, {"zh": "经理要跟你谈一谈关于工作的事情。", "py": "Jīnglǐ yào gēn nǐ tán yì tán guānyú gōngzuò de shìqing.", "id": "Manajer mau berbicara denganmu tentang urusan pekerjaan.", "b": false, "tr": null}, {"zh": "我买了一本关于中国历史的书。", "py": "Wǒ mǎi le yì běn guānyú Zhōngguó lìshǐ de shū.", "id": "Aku membeli sebuah buku tentang sejarah Tiongkok.", "b": false, "tr": null}, {"zh": "你去找李老师吧，他可以告诉你一些关于考试的情况。", "py": "Nǐ qù zhǎo Lǐ lǎoshī ba, tā kěyǐ gàosu nǐ yìxiē guānyú kǎoshì de qíngkuàng.", "id": "Temui Guru Li saja, dia bisa memberitahumu beberapa hal tentang ujian.", "b": false, "tr": null}, {"zh": "关于这件事，我们明天再说吧。", "py": "Guānyú zhè jiàn shì, wǒmen míngtiān zài shuō ba.", "id": "Mengenai hal ini, kita bicarakan besok saja.", "b": false, "tr": null}, {"zh": "他很喜欢看关于动物的节目。", "py": "Tā hěn xǐhuan kàn guānyú dòngwù de jiémù.", "id": "Dia sangat suka menonton acara tentang hewan.", "b": false, "tr": null}], "salah": [{"s": "我买了一本书关于中国。", "sp": "Wǒ mǎi le yì běn shū guānyú Zhōng ian besar keadaan. 一般来说，熊猫每天要睡很多次觉 = umumnya panda tidur berkali-kali setiap hari.", "Frasa ini paling sering diletakkan di AWAL kalimat dan diikuti koma. Isi kalimatnya biasanya kebiasaan, kenyataan umum, atau aturan umum, sehingga sering memakai 要, 会, 都, 常常, 比较.", "Bedakan dengan 一般 saja (tanpa 来说): 一般 bisa diletakkan setelah subjek sebelum kata kerja (我一般七点起床) atau menjadi kata sifat \"biasa saja\" (这个菜很一般). 一般来说 adalah frasa tetap yang memberi \"pengantar\", biasanya di awal kalimat.", "Karena berbicara tentang hal umum, 一般来说 tidak cocok untuk kejadian satu kali yang spesifik: *一般来说，我昨天七点起床 salah; yang benar 我昨天七点起床 atau 一般来说，我七点起床.", "Dalam bahasa Indonesia: \"Pada umumnya, …\" — posisinya juga di awal kalimat, jadi mudah ditiru. Jangan menulis *一般说来来 atau *一般的来说."], "poin": ["一般来说 = pada umumnya.", "Biasanya di awal kalimat + koma.", "Untuk kebiasaan/kenyataan umum, bukan kejadian satu kali.", "一般 (tanpa 来说) bisa setelah subjek."], "contoh": [{"zh": "一般来说，熊猫每天要睡很多次觉。", "py": "Yìbān lái shuō, xióngmāo měi tiān yào shuì hěn duō cì jiào.", "id": "Pada umumnya, panda tidur berkali-kali setiap hari.", "b": true, "tr": "16-5"}, {"zh": "一般来说，这种树每年开一次花。", "py": "Yìbān lái shuō, zhè zhòng shù měi nián kāi yí cì huā.", "id": "Biasanya, pohon jenis ini berbunga sekali setahun.", "b": true, "tr": null}, {"zh": "一般来说，学习外语需要多练习。", "py": "Yìbān lái shuō, xuéxí wàiyǔ xūyào duō liànxí.", "id": "Pada umumnya, belajar bahasa asing perlu banyak latihan.", "b": true, "tr": null}, {"zh": "一般来说，我喜欢早上锻炼，因为我起床起得很早。", "py": "Yìbān lái shuō, wǒ xǐhuan zǎoshang duànliàn, yīnwèi wǒ qǐchuáng qǐ de hěn zǎo.", "id": "Biasanya aku suka berolahraga pagi, karena aku bangun sangat pagi.", "b": false, "tr": null}, {"zh": "一般来说，下班的时候坐地铁比坐出租车快。", "py": "Yìbān lái shuō, xiàbān de shíhou zuò dìtiě bǐ zuò chūzūchē kuài.", "id": "Pada umumnya, waktu pulang kerja naik kereta bawah tanah lebih cepat daripada naik taksi.", "b": false, "tr": null}, {"zh": "一般来说，北方的冬天比南方冷。", "py": "Yìbān lái shuō, běifāng d mlah selisih setelah kata kerja (+ objek).", "了 setelah kata kerja untuk kejadian lampau.", "Tidak memakai 很/非常."], "contoh": [{"zh": "冬天比夏天早关门一个小时。", "py": "Dōngtiān bǐ xiàtiān zǎo guān mén yí gè xiǎoshí.", "id": "Di musim dingin tutupnya satu jam lebih awal daripada musim panas.", "b": true, "tr": null}, {"zh": "哥哥比弟弟多吃了三个饺子。", "py": "Gēge bǐ dìdi duō chī le sān gè jiǎozi.", "id": "Kakak makan tiga pangsit lebih banyak daripada adik.", "b": true, "tr": null}, {"zh": "我比他晚到了十分钟。", "py": "Wǒ bǐ tā wǎn dào le shí fēnzhōng.", "id": "Aku tiba sepuluh menit lebih lambat daripada dia.", "b": true, "tr": null}, {"zh": "我坐地铁来的，所以比你早到了二十分钟。", "py": "Wǒ zuò dìtiě lái de, suǒyǐ bǐ nǐ zǎo dào le èrshí fēnzhōng.", "id": "Aku datang naik kereta bawah tanah, jadi tiba dua puluh menit lebih awal daripada kamu.", "b": false, "tr": null}, {"zh": "明天不上课，我想比平时晚睡一个小时。", "py": "Míngtiān bú shàngkè, wǒ xiǎng bǐ píngshí wǎn shuì yí gè xiǎoshí.", "id": "Besok tidak ada kelas, aku mau tidur satu jam lebih lambat dari biasanya.", "b": false, "tr": null}, {"zh": "这个月我比上个月少花了五百块钱。", "py": "Zhège yuè wǒ bǐ shàng gè yuè shǎo huā le wǔbǎi kuài qián.", "id": "Bulan ini aku menghabiskan lima ratus yuan lebih sedikit daripada bulan lalu.", "b": false, "tr": null}, {"zh": "妹妹比我多买了两件衣服。", "py": "Mèimei bǐ wǒ duō mǎi le liǎng jiàn yīfu.", "id": "Adik perempuan membeli dua baju lebih banyak daripada aku.", "b": false, "tr": null}, {"zh": "爸爸每天比妈妈早起床半个小时。", "py": "Bàba měi tiān bǐ māma zǎo qǐchuáng bàn gè xiǎoshí.", "id": "Ayah setiap hari bangun setengah jam lebih awal daripada ibu.", "b": false, "tr": null}, {"zh": "今天我比昨天多喝了两杯水。", "py": "Jīntiān wǒ bǐ zuótiān duō hē le liǎng bēi shuǐ.", "id": "Hari ini aku minum dua gelas air lebih banyak daripada kemarin.", "b": false, "tr": null}, {"zh": "他比我们晚出发了一天。", "py": "Tā bǐ wǒmen wǎn chūfā le yì tiān.", "id": "Dia berangkat satu hari lebih lambat daripada kami.", "b": false, "tr": null}], "salah": [{"s": "我比他到晚了十分钟。", "sp": "Wǒ bǐ tā dào wǎn le shí fēnzhōng. id": "17-1", "pel": 17, "judul": "Kata depan 向 (ke arah, kepada)", "kode": "介词\"向\"", "rumus": ["向 + arah/tempat + KK (向前走)", "S + 向 + orang + KK (向他学习)", "S + 向 + orang + KK + pelengkap arah (向她跑过去)"], "jelas": ["向 adalah kata depan yang menunjukkan ARAH gerakan (\"ke arah, menuju\") atau SASARAN tindakan (\"kepada\"). Setelah 向 ada kata ganti, kata benda, atau frasa benda, lalu kata kerja.", "Arah: 向前走 (berjalan ke depan), 向左拐 (belok ke kiri), 向东看 (melihat ke timur), 别再向前走了 (jangan jalan ke depan lagi). Sasaran: 向认真的人学习 (belajar dari/kepada orang yang tekun), 向老师请假 (minta izin kepada guru), 向大家介绍 (memperkenalkan kepada semua orang), 向她跑过去 (berlari ke arahnya).", "Frasa 向…… diletakkan SEBELUM kata kerja. Kata keterangan dan kata kerja bantu (要, 应该, 多, 别) diletakkan sebelum 向: 以后我要多向认真的人学习.", "Bandingkan: 往 juga menunjukkan arah (往前走), tetapi tidak bisa untuk sasaran orang dalam arti \"belajar dari\": *往他学习 salah. 对 dipakai untuk sikap/berbicara kepada (对他说). 跟 juga bisa: 跟他学习. Di tingkat ini cukup diingat: 向 + orang + 学习/请假/介绍/问好.", "Jebakan pelajar Indonesia: \"belajar DARI dia\" sering diterjemahkan dengan 从 (*从他学习). Dalam bahasa Mandarin yang benar 向他学习 atau 跟他学习. Juga jangan menaruh 向…… di akhir kalimat seperti dalam bahasa Indonesia (\"berjalan ke depan\"): bukan *走向前 untuk perintah biasa, tetapi 向前走."], "poin": ["向 = ke arah (arah) / kepada (sasaran).", "向 + KB diletakkan sebelum kata kerja.", "向……学习 = belajar dari …", "要/多/别 sebelum 向."], "contoh": [{"zh": "别再向前走了。", "py": "Bié zài xiàng qián zǒu le.", "id": "Jangan berjalan ke depan lagi.", "b": true, "tr": "17-1"}, {"zh": "以后我要多向认真的人学习。", "py": "Yǐhòu wǒ yào duō xiàng rènzhēn de rén xuéxí.", "id": "Mulai sekarang aku harus banyak belajar dari orang yang tekun.", "b": true, "tr": "17-1"}, {"zh": "孩子一看见妈妈，就向她跑过去了。", "py": "Háizi yí kànjiàn māma, jiù xiàng tā pǎo guòqù le.", "id": "Begitu melihat ibunya, anak itu langsung berlari ke arahnya.", "b": true, "tr": null}, {"zh": "别再向前走了，李老师的办公室已经到了。", "py": "Bié zài xiàng qián zǒu le, Lǐ lǎoshī de bàngōngshì yǐjīng dào le.", "id": "Jangan jalan ke depan lagi, kantor Guru Li sudah sampai.", "b": true, "tr": "17-1"}, {"zh": "如果有事不能上课，你就应该向老师请假。", "py": "Rúguǒ yǒu shì bù néng shàngkè, nǐ jiù yīnggāi xiàng lǎoshī qǐngjià.", "id": "Kalau ada urusan sehingga tidak bisa masuk kelas, kamu harus minta izin kepada guru.", "b": false, "tr": null}, {"zh": "我是新来的，不懂的东西我会多向大家学习。", "py": "Wǒ shì xīn lái de, bù dǒng de dōngxi wǒ huì duō xiàng dàjiā xuéxí.", "id": "Saya orang baru, hal yang tidak saya pahami akan banyak saya pelajari dari semua orang.", "b": false, "tr": null}, {"zh": "突然下雨了，他一下车就向商店跑去。", "py": "Tūrán xià yǔ le, tā yíxià chē jiù xiàng shāngdiàn pǎo qù.", "id": "Tiba-tiba hujan, begitu turun dari mobil dia langsung berlari ke arah toko.", "b": false, "tr": null}, {"zh": "一名代表向全班介绍。", "py": "Yì míng dài biǎo xiàng quán bān jièshào.", "id": "Seorang perwakilan memperkenalkan (hasilnya) kepada seluruh kelas.", "b": true, "tr": null}, {"zh": "请你向左拐，银行就在前边。", "py": "Qǐng nǐ xiàng zuǒ guǎi, yínháng jiù zài qiánbian.", "id": "Silakan belok ke kiri, banknya ada di depan.", "b": false, "tr": null}, {"zh": "她笑着向我们走过来。", "py": "Tā xiào zhe xiàng wǒmen zǒu guòlái.", "id": "Dia berjalan ke arah kami sambil tersenyum.", "b": false, "tr": null}], "salah": [{"s": "我要多从他学习。", "sp": "Wǒ yào duō cóng tā xuéxí.", "n": "", "b": "我要多向他学习。", "bp": "Wǒ yào duō xiàng tā xuéxí.", "a": "\"Belajar dari seseorang\" = 向/跟 + orang + 学习."}, {"s": "你应该往老师请假。", "sp": "Nǐ yīnggāi wǎng lǎoshī qǐngjià.", "n": "", "b": "你应该向老师请假。", "bp": "Nǐ yīnggāi xiàng lǎoshī qǐngjià.", "a": "往 hanya untuk arah tempat; sasaran orang (minta izin kepada guru) memakai 向."}, {"s": "你应该请假向老师。", "sp": "Nǐ yīnggāi qǐngjià xiàng lǎoshī.", "n": "", "b": "你应该向老师请假。", "bp": "Nǐ yīnggāi xiàng lǎoshī qǐngjià.", "a": "向 + orang diletakkan sebelum kata kerja."}], "latihan": [{"k": "17-1.0", "t": "pg", "q": "以后我要多___认真的人学习。", "o": ["向", "从", "往前", "在"], "a": 0, "x": "向 + orang + 学习.", "f": "以
