kan bicaramu."}, {"k": "8-1.11", "t": "bs", "s": "别停，你说下去。", "sp": "Bié tíng, nǐ shuō xiàqù.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "8-1.12", "t": "bs", "s": "我想看下去这本书。", "sp": "Wǒ xiǎng kàn xiàqù zhè běn shū.", "n": "", "ok": false, "b": "这本书我想看下去。", "bp": "Zhè běn shū wǒ xiǎng kàn xiàqù.", "x": "Objek tidak di belakang 下去."}, {"k": "8-1.13", "t": "bs", "s": "这几天太热了，如果再热下去就不能出门了。", "sp": "Zhè jǐ tiān tài rè le, rúguǒ zài rè xiàqù jiù bù néng chūmén le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "8-1.14", "t": "bs", "s": "我不想在这里住下来了，想搬家。", "sp": "Wǒ bù xiǎng zài zhèlǐ zhù xiàlái le, xiǎng bānjiā.", "n": "", "ok": false, "b": "我不想在这里住下去了，想搬家。", "bp": "Wǒ bù xiǎng zài zhèlǐ zhù xiàqù le, xiǎng bānjiā.", "x": "Tidak mau terus tinggal (ke depan) = 住下去."}, {"k": "8-1.15", "t": "bs", "s": "现在她很喜欢汉语，还打算学下去。", "sp": "Xiànzài tā hěn xǐhuan Hànyǔ, hái dǎsuàn xué xiàqù.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "8-2", "pel": 8, "judul": "Kata kerja terpisah (2): pelengkap di tengah, objek orang dengan 跟/给", "kode": "离合词（2）", "rumus": ["KK-bagian1 + pelengkap/了/kali/waktu + bagian2 (游完泳, 下了两次雨, 跑一个小时步)", "跟/给 + orang + 离合词 (跟她结婚, 跟他见面)", "Bukan: 离合词 + objek (×结婚她)"], "jelas": ["Kata kerja terpisah (离合词) adalah kata kerja yang sebenarnya gabungan kata kerja + objek: 游泳 (berenang), 下雨 (hujan), 结婚 (menikah), 见面 (bertemu), 睡觉 (tidur), 跑步 (berlari), 洗澡 (mandi), 考试 (ujian), 放假 (libur), 聊天 (mengobrol), 唱歌 (menyanyi), 生病 (sakit). Karena sudah berisi objek, kata ini umumnya TIDAK bisa diberi objek lagi.", "Jika ada pelengkap (hasil seperti 完, partikel 了/过, jumlah kali, lama waktu), pelengkap itu diletakkan DI TENGAH: 游完泳 (selesai berenang), 下了两次雨 (turun hujan dua kali), 跑一个小时步 (berlari satu jam), 睡一觉 (tidur sebentar), 见过一次面 (pernah bertemu sekali).", "Jika ada orang yang terlibat, orang itu dimasukkan dengan kata depan 跟 atau 给 SEBELUM kata kerja: 跟女朋友结婚 (menikah dengan pacar), 跟他见面 (bertemu dengan dia), 给我帮个忙. Jangan bilang 结婚她 atau 见面他.", "Bentuk ingkar dan tanya memakai kata kerja utuh: 我没游泳, 你结婚了吗？ Lama waktu \"sudah berlalu sejak\" (pelajaran 8-3) diletakkan di belakang: 他们结婚两年了 (sudah dua tahun menikah).", "Jebakan bagi pelajar Indonesia: dalam bahasa Indonesia \"menikah\", \"bertemu\", \"berenang\" adalah satu kata utuh, jadi rasanya aneh dipisah. Ingat bahwa 游泳 = \"berenang (renang)\", 睡觉 = \"tidur (tidur)\": bagian kedua sebenarnya objek, jadi pelengkap masuk di antara kata kerja dan objeknya, seperti 吃完饭.", "Tidak semua kata dua suku kata bisa dipisah. 学习, 工作, 休息, 检查 bukan kata kerja terpisah dan boleh memakai objek: 学习汉语, 检查身体."], "poin": ["离合词 tidak bisa langsung diberi objek.", "Pelengkap/了/kali/waktu masuk di tengah.", "Orang: 跟/给 + orang + 离合词.", "Hafalkan: 游泳, 下雨, 结婚, 见面, 睡觉, 跑步, 洗澡, 考试, 放假, 聊天."], "contoh": [{"zh": "昨天游完泳以后，我的耳朵一直有点儿疼。", "py": "Zuótiān yóu wán yǒng yǐhòu, wǒ de ěrduo yìzhí yǒudiǎnr téng.", "id": "Sejak selesai berenang kemarin, telingaku terus agak sakit.", "b": true, "tr": null}, {"zh": "今年夏天只下了两次雨。", "py": "Jīnnián xiàtiān zhī xià le liǎng cì yǔ.", "id": "Musim panas tahun ini hanya turun hujan dua kali.", "b": true, "tr": null}, {"zh": "小张下个月跟他女朋友结婚。", "py": "Xiǎo Zhāng xià gè yuè gēn tā nǚpéngyou jiéhūn.", "id": "Xiao Zhang akan menikah dengan pacarnya bulan depan.", "b": true, "tr": null}, {"zh": "我每天下午都来跑一个小时步。", "py": "Wǒ měi tiān xiàwǔ dōu lái pǎo yí gè xiǎoshí bù.", "id": "Setiap sore aku datang berlari selama satu jam.", "b": true, "tr": "08-1"}, {"zh": "我先回去睡一觉，可能休息休息就好了。", "py": "Wǒ xiān huíqù shuì yí jiào, kěnéng xiūxi xiūxi jiù hǎo le.", "id": "Aku pulang tidur dulu, mungkin setelah istirahat akan sembuh.", "b": true, "tr": "08-3"}, {"zh": "我跟他只见过一次面。", "py": "Wǒ gēn tā zhǐ jiàn guò yí cì miàn.", "id": "Aku baru sekali bertemu dengan dia.", "b": false, "tr": null}, {"zh": "天气太热了，我想先洗个澡，再去吃饭。", "py": "Tiānqì tài rè le, wǒ xiǎng xiān xǐ gè zǎo, zài qù chīfàn.", "id": "Cuacanya panas sekali, aku mau mandi dulu, baru makan.", "b": false, "tr": null}, {"zh": "我们考完试就去旅游。", "py": "Wǒmen kǎo wán shì jiù qù lǚyóu.", "id": "Kami akan berwisata begitu selesai ujian.", "b": false, "tr": null}, {"zh": "昨天晚上我跟妈妈聊了一会儿天。", "py": "Zuótiān wǎnshang wǒ gēn māma liáo le yíhuìr tiān.", "id": "Tadi malam aku mengobrol sebentar dengan ibu.", "b": false, "tr": null}, {"zh": "学校放了一个星期假，大家都很高兴。", "py": "Xuéxiào fàng le yí gè xīngqī jiǎ, dàjiā dōu hěn gāoxìng.", "id": "Sekolah libur seminggu, semua orang senang.", "b": false, "tr": null}], "salah": [{"s": "我想结婚她。", "sp": "Wǒ xiǎng jiéhūn tā.", "n": "", "b": "我想跟她结婚。", "bp": "Wǒ xiǎng gēn tā jiéhūn.", "a": "离合词 tidak bisa diberi objek; pakai 跟 + orang."}, {"s": "我游泳完了。", "sp": "Wǒ yóuyǒng wán le.", "n": "", "b": "我游完泳了。", "bp": "Wǒ yóu wán yǒng le.", "a": "Pelengkap 完 masuk di tengah."}, {"s": "我们见面了两次。", "sp": "Wǒmen jiànmiàn le liǎng cì.", "n": "", "b": "我们见了两次面。", "bp": "Wǒmen jiàn le liǎng cì miàn.", "a": "Jumlah kali masuk di tengah: 见了两次面."}, {"s": "我昨天睡觉了八个小时。", "sp": "Wǒ zuótiān shuìjiào le bā gè xiǎoshí.", "n": "", "b": "我昨天睡了八个小时觉。", "bp": "Wǒ zuótiān shuì le bā gè xiǎoshí jiào.", "a": "Lama tidur masuk di tengah 睡……觉."}], "latihan": [{"k": "8-2.0", "t": "pg", "q": "昨天游___以后，我的耳朵一直有点儿疼。", "o": ["完泳", "泳完", "游完", "完游"], "a": 0, "x": "游 + 完 + 泳.", "f": "昨天游完泳以后，我的耳朵一直有点儿疼。", "fp": "Zuótiān yóu wán yǒng yǐhòu, wǒ de ěrduo yìzhí yǒudiǎnr téng."}, {"k": "8-2.1", "t": "pg", "q": "\"Xiao Zhang menikah dengan pacarnya bulan depan\" =", "o": ["小张下个月跟他女朋友结婚。", "小张下个月结婚他女朋友。", "小张下个月结他女朋友婚。", "小张下个月结婚跟他女朋友。"], "a": 0, "x": "跟 + orang + 结婚."}, {"k": "8-2.2", "t": "pg", "q": "今年夏天只下了两次___。", "o": ["雨", "下雨", "雨了", "了雨"], "a": 0, "x": "下 + 了两次 + 雨.", "f": "今年夏天只下了两次雨。", "fp": "Jīnnián xiàtiān zhī xià le liǎng cì yǔ."}, {"k": "8-2.3", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["我每天跑一个小时步。", "我每天跑步一个小时步。", "我每天一个小时跑步了步。", "我每天跑步了一个小时步。"], "a": 0, "x": "Lama waktu di tengah: 跑一个小时步."}, {"k": "8-2.4", "t": "pg", "q": "Mana yang BUKAN kata kerja terpisah (bisa langsung diberi objek)?", "o": ["学习", "游泳", "见面", "结婚"], "a": 0, "x": "学习 bisa: 学习汉语."}, {"k": "8-2.5", "t": "pg", "q": "我跟他见过一次___。", "o": ["面", "见面", "面了", "次面"], "a": 0, "x": "见 + 过一次 + 面.", "f": "我跟他见过一次面。", "fp": "Wǒ gēn tā jiàn guò yí cì miàn."}, {"k": "8-2.6", "t": "su", "w": ["小张", "下", "个", "月", "跟", "他", "女朋友", "结婚"], "s": "小张下个月跟他女朋友结婚。", "alt": [], "p": "Xiǎo Zhāng xià gè yuè gēn tā nǚpéngyou jiéhūn.", "x": "Xiao Zhang akan menikah dengan pacarnya bulan depan."}, {"k": "8-2.7", "t": "su", "w": ["今年", "夏天", "只", "下", "了", "两", "次", "雨"], "s": "今年夏天只下了两次雨。", "alt": ["夏天今年只下了两次雨。"], "p": "Jīnnián xiàtiān zhī xià le liǎng cì yǔ.", "x": "Musim panas tahun ini hanya turun hujan dua kali."}, {"k": "8-2.8", "t": "su", "w": ["我", "每天", "下午", "都", "跑", "一", "个", "小时", "步"], "s": "我每天下午都跑一个小时步。", "alt": [], "p": "Wǒ měi tiān xiàwǔ dōu pǎo yí gè xiǎoshí bù.", "x": "Setiap sore aku berlari satu jam."}, {"k": "8-2.9", "t": "su", "w": ["我", "先", "回去", "睡", "一", "觉"], "s": "我先回去睡一觉。", "alt": [], "p": "Wǒ xiān huíqù shuì yí jiào.", "x": "Aku pulang tidur dulu."}, {"k": "8-2.10", "t": "su", "w": ["我", "跟", "他", "只", "见", "过", "一", "次", "面"], "s": "我跟他只见过一次面。", "alt": [], "p": "Wǒ gēn tā zhǐ jiàn guò yí cì miàn.", "x": "Aku baru sekali bertemu dengan dia."}, {"k": "8-2.11", "t": "bs", "s": "我们考完试就去旅游。", "sp": "Wǒmen kǎo wán shì jiù qù lǚyóu.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 考 + 完 + 试."}, {"k": "8-2.12", "t": "bs", "s": "我明天要见面我的老师。", "sp": "Wǒ míngtiān yào jiànmiàn wǒ de lǎoshī.", "n": "", "ok": false, "b": "我明天要跟我的老师见面。", "bp": "Wǒ míngtiān yào gēn wǒ de lǎoshī jiànmiàn.", "x": "见面 tidak bisa diberi objek; pakai 跟."}, {"k": "8-2.13", "t": "bs", "s": "他洗澡完了就睡觉了。", "sp": "Tā xǐzǎo wán le jiù shuìjiào le.", "n": "", "ok": false, "b": "他洗完澡就睡觉了。", "bp": "Tā xǐ wán zǎo jiù shuìjiào le.", "x": "完 masuk di tengah 洗……澡."}, {"k": "8-2.14", "t": "bs", "s": "昨天晚上我跟妈妈聊了一会儿天。", "sp": "Zuótiān wǎnshang wǒ gēn māma liáo le yíhuìr tiān.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "8-2.15", "t": "bs", "s": "学校放假了一个星期。", "sp": "Xuéxiào fàngjià le yí gè xīngqī.", "n": "", "ok": false, "b": "学校放了一个星期假。", "bp": "Xuéxiào fàng le yí gè xīngqī jiǎ.", "x": "Lama waktu masuk di tengah 放……假."}]}, {"id": "8-3", "pel": 8, "judul": "Pelengkap lama waktu (2): KK (+O) + lama waktu + 了 (sudah berlalu sejak …)", "kode": "时量补语（2）", "rumus": ["KK tak-berlangsung (+ O) + lama waktu + 了 (她回家两个月了)", "KK berlangsung + 了 + lama waktu + (的) + O (我学了两年汉语)", "KK + O + KK + 了 + lama waktu + 了 (masih berlanjut)", "Ingkar: lama waktu + 没 + KK + 了"], "jelas": ["Pelengkap lama waktu (时量补语) biasanya menyatakan berapa lama sebuah kegiatan berlangsung: 我学了两年汉语 (aku belajar bahasa Mandarin selama dua tahun). Kegiatan seperti 学, 等, 住, 工作 bisa berlangsung lama.", "Ada kata kerja yang terjadi sekejap dan TIDAK bisa berlangsung lama, misalnya 来, 去, 回, 到, 结婚, 开学, 出院, 离开, 下课. Untuk kata kerja ini, lama waktu menyatakan BERAPA LAMA SUDAH BERLALU sejak kejadian itu sampai sekarang: 她回家两个月了 = dia sudah pulang (dan sudah) dua bulan berlalu; 开学已经三个多星期了 = sekolah sudah mulai lebih dari tiga minggu.", "Untuk kata kerja sekejap, OBJEK diletakkan langsung sesudah kata kerja, lalu lama waktu, lalu 了: 我来中国一年了 (bukan 我来了一年中国). Kata kerja terpisah pun sama: 他们结婚五年了. Sering ditambah 已经 di depan.", "了 di akhir kalimat berarti \"sampai sekarang\". Untuk kegiatan yang berlangsung dan masih berlanjut, pakai pola 了……了 atau ulangi kata kerjanya: 我学汉语学了两年了 = aku sudah belajar dua tahun (dan masih belajar). Bandingkan: 我学了两年汉语 (dulu belajar dua tahun, mungkin sudah berhenti).", "Bentuk ingkar: lama waktu diletakkan SEBELUM 没: 我两年没回家了 = sudah dua tahun aku tidak pulang. 我好多年没打羽毛球了 (dialog pelajaran 9). Bentuk tanya: ……多长时间了？ 你来中国多长时间了？", "Jebakan bagi pelajar Indonesia: bahasa Indonesia memakai \"sudah … (lamanya)\" dengan susunan bebas (\"Dia sudah dua bulan pulang\"). Dalam Mandarin lama waktu harus di BELAKANG kata kerja (dan objeknya), tidak di depan, kecuali dalam kalimat ingkar."], "poin": ["KK sekejap + (O) + waktu + 了 = sudah berlalu sejak ….", "Objek langsung setelah KK sekejap: 来中国一年了.", "了……了 = masih berlanjut sampai sekarang.", "Ingkar: waktu + 没 + KK + 了."], "contoh": [{"zh": "我上次来医院已经过去差不多两年了。", "py": "Wǒ shàng cì lái yīyuàn yǐjīng guòqù chàbuduō liǎng nián le.", "id": "Terakhir kali aku ke rumah sakit sudah hampir dua tahun lalu.", "b": true, "tr": "08-5"}, {"zh": "她回家两个月了。", "py": "Tā huí jiā liǎng gè yuè le.", "id": "Dia sudah pulang (ke rumahnya) dua bulan.", "b": true, "tr": null}, {"zh": "开学已经三个多星期了。", "py": "Kāixué yǐjīng sān gè duō xīngqī le.", "id": "Sekolah sudah dimulai lebih dari tiga minggu.", "b": true, "tr": null}, {"zh": "我的腿疼了几个星期了。", "py": "Wǒ de tuǐ téng le jǐ gè xīngqī le.", "id": "Kakiku sudah sakit beberapa minggu.", "b": true, "tr": "08-5"}, {"zh": "我好多年没打羽毛球了。", "py": "Wǒ hǎoduō nián méi dǎ yǔmáoqiú le.", "id": "Sudah bertahun-tahun aku tidak main bulu tangkis.", "b": true, "tr": "09-3"}, {"zh": "我来中国一年多了。", "py": "Wǒ lái Zhōngguó yì nián duō le.", "id": "Aku sudah lebih dari setahun di Tiongkok.", "b": false, "tr": null}, {"zh": "他们结婚五年了。", "py": "Tāmen jiéhūn wǔ nián le.", "id": "Mereka sudah menikah lima tahun.", "b": false, "tr": null}, {"zh": "电影已经开始十分钟了。", "py": "Diànyǐng yǐjīng kāishǐ shí fēnzhōng le.", "id": "Filmnya sudah mulai sepuluh menit.", "b": false, "tr": null}, {"zh": "他出院一个星期了，现在身体很好。", "py": "Tā chūyuàn yí gè xīngqī le, xiànzài shēntǐ hěn hǎo.", "id": "Dia sudah keluar dari rumah sakit seminggu, sekarang badannya sehat.", "b": false, "tr": null}, {"zh": "我学汉语学了两年了。", "py": "Wǒ xué Hànyǔ xué le liǎng nián le.", "id": "Aku sudah belajar bahasa Mandarin dua tahun (dan masih belajar).", "b": false, "tr": null}], "salah": [{"s": "我来了一年中国。", "sp": "Wǒ lái le yì nián Zhōngguó.", "n": "", "b": "我来中国一年了。", "bp": "Wǒ lái Zhōngguó yì nián le.", "a": "Kata kerja sekejap: objek dulu, lalu lama waktu + 了."}, {"s": "我没回家两年了。", "sp": "Wǒ méi huí jiā liǎng nián le.", "n": "", "b": "我两年没回家了。", "bp": "Wǒ liǎng nián méi huí jiā le.", "a": "Dalam kalimat ingkar, lama waktu sebelum 没."}, {"s": "他们结了五年婚了。", "sp": "Tāmen jié le wǔ nián hūn le.", "n": "sudah lima tahun menikah", "b": "他们结婚五年了。", "bp": "Tāmen jiéhūn wǔ nián le.", "a": "Menikah adalah kejadian sekejap; lama waktu di belakang 结婚."}, {"s": "她两个月回家了。", "sp": "Tā liǎng gè yuè huí jiā le.", "n": "", "b": "她回家两个月了。", "bp": "Tā huí jiā liǎng gè yuè le.", "a": "Lama waktu di belakang kata kerja dan objek."}], "latihan": [{"k": "8-3.0", "t": "pg", "q": "A：你来中国多长时间了？ B：我来中国___。", "o": ["一年多了", "了一年多", "一年多来", "多一年了"], "a": 0, "x": "KK + O + waktu + 了."}, {"k": "8-3.1", "t": "pg", "q": "\"Dia sudah pulang dua bulan\" =", "o": ["她回家两个月了。", "她回了两个月家。", "她两个月回家了。", "她回家了两个月家。"], "a": 0, "x": "Kata kerja sekejap: 回家 + 两个月 + 了."}, {"k": "8-3.2", "t": "pg", "q": "\"Sudah dua tahun aku tidak pulang\" =", "o": ["我两年没回家了。", "我没回家两年了。", "我没两年回家了。", "我回家没两年了。"], "a": 0, "x": "Ingkar: waktu + 没 + KK."}, {"k": "8-3.3", "t": "pg", "q": "他们结婚___了。", "o": ["三年", "三年的", "了三年", "三次"], "a": 0, "x": "结婚 + lama waktu + 了.", "f": "他们结婚三年了。", "fp": "Tāmen jiéhūn sān nián le."}, {"k": "8-3.4", "t": "pg", "q": "Mana kalimat yang artinya \"masih belajar sampai sekarang\"?", "o": ["我学汉语学了两年了。", "我学了两年汉语。", "我两年学了汉语。", "我学汉语两年。"], "a": 0, "x": "了……了 = berlanjut sampai sekarang."}, {"k": "8-3.5", "t": "pg", "q": "开学已经三个多星期___。", "o": ["了", "过", "着", "的"], "a": 0, "x": "了 di akhir: sampai sekarang.", "f": "开学已经三个多星期了。", "fp": "Kāixué yǐjīng sān gè duō xīngqī le."}, {"k": "8-3.6", "t": "su", "w": ["她", "回家", "两", "个", "月", "了"], "s": "她回家两个月了。", "alt": [], "p": "Tā huí jiā liǎng gè yuè le.", "x": "Dia sudah pulang dua bulan."}, {"k": "8-3.7", "t": "su", "w": ["开学", "已经", "三", "个", "多", "星期", "了"], "s": "开学已经三个多星期了。", "alt": [], "p": "Kāixué yǐjīng sān gè duō xīngqī le.", "x": "Sekolah sudah dimulai lebih dari tiga minggu."}, {"k": "8-3.8", "t": "su", "w": ["我", "来", "中国", "一", "年", "多", "了"], "s": "我来中国一年多了。", "alt": [], "p": "Wǒ lái Zhōngguó yì nián duō le.", "x": "Aku sudah lebih dari setahun di Tiongkok."}, {"k": "8-3.9", "t": "su", "w": ["我", "好", "多", "年", "没", "打", "羽毛球", "了"], "s": "我好多年没打羽毛球了。", "alt": [], "p": "Wǒ hǎoduō nián méi dǎ yǔmáoqiú le.", "x": "Sudah bertahun-tahun aku tidak main bulu tangkis."}, {"k": "8-3.10", "t": "su", "w": ["他们", "结婚", "五", "年", "了"], "s": "他们结婚五年了。", "alt": [], "p": "Tāmen jiéhūn wǔ nián le.", "x": "Mereka sudah menikah lima tahun."}, {"k": "8-3.11", "t": "bs", "s": "电影已经开始十分钟了。", "sp": "Diànyǐng yǐjīng kāishǐ shí fēnzhōng le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "8-3.12", "t": "bs", "s": "我来了三个月北京。", "sp": "Wǒ lái le sān gè yuè Běijīng.", "n": "", "ok": false, "b": "我来北京三个月了。", "bp": "Wǒ lái Běijīng sān gè yuè le.", "x": "Objek dulu, baru lama waktu + 了."}, {"k": "8-3.13", "t": "bs", "s": "他出院一个星期了。", "sp": "Tā chūyuàn yí gè xīngqī le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "8-3.14", "t": "bs", "s": "我没见他三年了。", "sp": "Wǒ méi jiàn tā sān nián le.", "n": "", "ok": false, "b": "我三年没见他了。", "bp": "Wǒ sān nián méi jiàn tā le.", "x": "Ingkar: lama waktu sebelum 没."}, {"k": "8-3.15", "t": "bs", "s": "我的腿疼了几个星期了。", "sp": "Wǒ de tuǐ téng le jǐ gè xīngqī le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar: 疼 bisa berlangsung, 了……了 berarti masih sakit."}]}, {"id": "8-4", "pel": 8, "judul": "Pola tetap: waktu/kejadian + 以前/以后/前/后", "kode": "固定格式\"……以前/以后/前/后\"", "rumus": ["Waktu/kejadian + 以前/前 = sebelum …", "Waktu/kejadian + 以后/后 = sesudah …", "Jumlah waktu + 以前/前/以后/后 (三天前 = tiga hari lalu)"], "jelas": ["以前/前 artinya \"sebelum\", 以后/后 artinya \"sesudah\". Dalam bahasa Mandarin kata ini diletakkan di BELAKANG waktu atau kejadian: 睡前 = sebelum tidur, 下班后 = sesudah pulang kerja, 考完试以后 = sesudah ujian selesai.", "Seluruh frasa \"… 以前/以后\" berfungsi sebagai keterangan waktu, jadi diletakkan di awal kalimat atau setelah subjek, sebelum kata kerja utama: 这种药需要每天睡前吃一次. 我们决定下班后一起去看个电影.", "前 dan 后 (satu suku kata) lebih singkat dan sering menempel pada kata pendek: 睡前, 饭后, 出院前, 下班后. 以前 dan 以后 lebih umum dan bisa dipakai dengan frasa yang panjang: 考完试以后, 来中国以前.", "Dengan jumlah waktu, artinya \"… yang lalu / … kemudian\": 两年前 = dua tahun lalu, 三天以后 = tiga hari kemudian. Tanpa kata di depannya, 以前 berarti \"dulu\" dan 以后 berarti \"nanti / ke depannya\": 我以前住在上海, 以后我会多注意.", "Jebakan bagi pelajar Indonesia: bahasa Indonesia berkata \"SEBELUM tidur\", \"SETELAH makan\" (kata penghubung di depan). Mandarin kebalikannya: 睡觉以前, 吃饭以后. Jangan bilang 以前睡觉 atau 以后吃饭 (itu berarti \"dulu tidur\" / \"nanti makan\").", "Bedakan dengan ……的时候 (ketika …): 吃饭的时候 = sewaktu makan; 吃饭以前 = sebelum makan; 吃饭以后 = sesudah makan."], "poin": ["以前/前 = sebelum; 以后/后 = sesudah.", "Diletakkan di BELAKANG kejadian: 睡前, 下班后.", "Frasa waktu ini sebelum kata kerja utama.", "Jumlah waktu + 前 = … yang lalu."], "contoh": [{"zh": "这种药需要每天睡前吃一次。", "py": "Zhè zhǒng yào xūyào měi tiān shuì qián chī yí cì.", "id": "Obat ini harus diminum sekali setiap hari sebelum tidur.", "b": true, "tr": null}, {"zh": "我们决定下班后一起去看个电影。", "py": "Wǒmen juédìng xiàbān hòu yìqǐ qù kàn gè diànyǐng.", "id": "Kami memutuskan menonton film bersama sepulang kerja.", "b": true, "tr": null}, {"zh": "考完试以后，咱们一起去旅游吧。", "py": "Kǎo wán shì yǐhòu, zánmen yìqǐ qù lǚyóu ba.", "id": "Setelah ujian selesai, ayo kita berwisata bersama.", "b": true, "tr": null}, {"zh": "出院前，医生给我开了几种药。", "py": "Chūyuàn qián, yīshēng gěi wǒ kāi le jǐ zhǒng yào.", "id": "Sebelum keluar dari rumah sakit, dokter meresepkan beberapa jenis obat untukku.", "b": true, "tr": "08-7"}, {"zh": "其他几种每天吃三次，饭后吃。", "py": "Qítā jǐ zhǒng měi tiān chī sān cì, fàn hòu chī.", "id": "Beberapa jenis lainnya diminum tiga kali sehari, sesudah makan.", "b": true, "tr": "08-7"}, {"zh": "我下课以后常去打羽毛球。", "py": "Wǒ xiàkè yǐhòu cháng qù dǎ yǔmáoqiú.", "id": "Sesudah kuliah aku sering main bulu tangkis.", "b": true, "tr": "08-1"}, {"zh": "回家以后一定会多注意。", "py": "Huí jiā yǐhòu yídìng huì duō zhùyì.", "id": "Setelah pulang aku pasti akan lebih berhati-hati.", "b": true, "tr": "08-7"}, {"zh": "来中国以前，我没吃过北京菜。", "py": "Lái Zhōngguó yǐqián, wǒ méi chī guò Běijīng cài.", "id": "Sebelum datang ke Tiongkok, aku belum pernah makan masakan Beijing.", "b": false, "tr": null}, {"zh": "三天前我去了上海。", "py": "Sān tiān qián wǒ qù le Shànghǎi.", "id": "Tiga hari lalu aku pergi ke Shanghai.", "b": false, "tr": null}, {"zh": "一个星期以后，他就出院了。", "py": "Yí gè xīngqī yǐhòu, tā jiù chūyuàn le.", "id": "Seminggu kemudian, dia keluar dari rumah sakit.", "b": false, "tr": null}], "salah": [{"s": "以前睡觉，你要吃药。", "sp": "Yǐqián shuìjiào, nǐ yào chī yào.", "n": "sebelum tidur", "b": "睡觉以前，你要吃药。", "bp": "Shuìjiào yǐqián, nǐ yào chī yào.", "a": "以前 di belakang kejadian."}, {"s": "以后吃饭，我们去散步吧。", "sp": "Yǐhòu chīfàn, wǒmen qù sàn bù ba.", "n": "sesudah makan", "b": "吃饭以后，我们去散步吧。", "bp": "Chīfàn yǐhòu, wǒmen qù sàn bù ba.", "a": "以后 di belakang kejadian."}, {"s": "前三天我去了上海。", "sp": "Qián sān tiān wǒ qù le Shànghǎi.", "n": "tiga hari lalu", "b": "三天前我去了上海。", "bp": "Sān tiān qián wǒ qù le Shànghǎi.", "a": "Jumlah waktu + 前."}, {"s": "我吃药睡前。", "sp": "Wǒ chī yào shuì qián.", "n": "", "b": "我睡前吃药。", "bp": "Wǒ shuì qián chī yào.", "a": "Keterangan waktu sebelum kata kerja utama."}], "latihan": [{"k": "8-4.0", "t": "pg", "q": "这种药需要每天睡___吃一次。", "o": ["前", "以", "时", "在"], "a": 0, "x": "睡前 = sebelum tidur.", "f": "这种药需要每天睡前吃一次。", "fp": "Zhè zhǒng yào xūyào měi tiān shuì qián chī yí cì."}, {"k": "8-4.1", "t": "pg", "q": "\"Setelah ujian selesai, ayo kita berwisata\" =", "o": ["考完试以后，咱们去旅游吧。", "以后考完试，咱们去旅游吧。", "咱们去旅游考完试以后吧。", "考完试前，咱们去旅游吧。"], "a": 0, "x": "Kejadian + 以后, di awal kalimat."}, {"k": "8-4.2", "t": "pg", "q": "\"Dua tahun lalu\" =", "o": ["两年前", "前两年", "以前两年", "两年以后"], "a": 0, "x": "Jumlah waktu + 前."}, {"k": "8-4.3", "t": "pg", "q": "我们决定下班___一起去看电影。", "o": ["后", "以", "中", "的时候后"], "a": 0, "x": "下班后 = sepulang kerja.", "f": "我们决定下班后一起去看电影。", "fp": "Wǒmen juédìng xiàbān hòu yìqǐ qù kàn diànyǐng."}, {"k": "8-4.4", "t": "pg", "q": "Mana yang artinya \"dulu saya tinggal di Shanghai\"?", "o": ["我以前住在上海。", "我住在上海以前。", "以后我住在上海。", "我前住在上海。"], "a": 0, "x": "以前 tanpa kejadian di depannya = dulu."}, {"k": "8-4.5", "t": "pg", "q": "___，别忘了检查一下自己的行李。", "o": ["下车以前", "以前下车", "前下车", "下车了以前"], "a": 0, "x": "Kejadian + 以前.", "f": "下车以前，别忘了检查一下自己的行李。", "fp": "Xià chē yǐqián, bié wàng le jiǎnchá yíxià zìjǐ de xíngli."}, {"k": "8-4.6", "t": "su", "w": ["这", "种", "药", "每天", "睡", "前", "吃", "一", "次"], "s": "这种药每天睡前吃一次。", "alt": [], "p": "Zhè zhǒng yào měi tiān shuì qián chī yí cì.", "x": "Obat ini diminum sekali setiap hari sebelum tidur."}, {"k": "8-4.7", "t": "su", "w": ["我们", "下班", "后", "一起", "去", "看", "电影"], "s": "我们下班后一起去看电影。", "alt": [], "p": "Wǒmen xiàbān hòu yìqǐ qù kàn diànyǐng.", "x": "Sepulang kerja kami menonton film bersama."}, {"k": "8-4.8", "t": "su", "w": ["考", "完", "试", "以后，", "咱们", "去", "旅游", "吧"], "s": "考完试以后，咱们去旅游吧。", "alt": [], "p": "Kǎo wán shì yǐhòu, zánmen qù lǚyóu ba.", "x": "Setelah ujian selesai, ayo kita berwisata."}, {"k": "8-4.9", "t": "su", "w": ["出院", "前，", "医生", "给", "我", "开", "了", "药"], "s": "出院前，医生给我开了药。", "alt": [], "p": "Chūyuàn qián, yīshēng gěi wǒ kāi le yào.", "x": "Sebelum keluar rumah sakit, dokter meresepkan obat untukku."}, {"k": "8-4.10", "t": "su", "w": ["来", "中国", "以前，", "我", "不", "会", "说", "汉语"], "s": "来中国以前，我不会说汉语。", "alt": [], "p": "Lái Zhōngguó yǐqián, wǒ bú huì shuō Hànyǔ.", "x": "Sebelum datang ke Tiongkok, aku tidak bisa berbahasa Mandarin."}, {"k": "8-4.11", "t": "bs", "s": "我下课以后常去打羽毛球。", "sp": "Wǒ xiàkè yǐhòu cháng qù dǎ yǔmáoqiú.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "8-4.12", "t": "bs", "s": "以后吃饭，我们一起去公园吧。", "sp": "Yǐhòu chīfàn, wǒmen yìqǐ qù gōngyuán ba.", "n": "", "ok": false, "b": "吃饭以后，我们一起去公园吧。", "bp": "Chīfàn yǐhòu, wǒmen yìqǐ qù gōngyuán ba.", "x": "以后 di belakang kejadian."}, {"k": "8-4.13", "t": "bs", "s": "三天前我去了医院。", "sp": "Sān tiān qián wǒ qù le yīyuàn.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "8-4.14", "t": "bs", "s": "我吃药饭后。", "sp": "Wǒ chī yào fàn hòu.", "n": "", "ok": false, "b": "我饭后吃药。", "bp": "Wǒ fàn hòu chī yào.", "x": "Keterangan waktu sebelum kata kerja."}, {"k": "8-4.15", "t": "bs", "s": "回家以后，我先洗了个澡。", "sp": "Huí jiā yǐhòu, wǒ xiān xǐ le gè zǎo.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "9-1", "pel": 9, "judul": "Kalimat tujuan: 为了……，……", "kode": "目的复句\"为了……，……\"", "rumus": ["为了 + tujuan，(S) + tindakan", "S + 为了 + tujuan + tindakan", "S + tindakan，是为了 + tujuan"], "jelas": ["为了 (wèile) artinya \"untuk / demi / supaya\". Bagian sesudah 为了 menyatakan TUJUAN, bagian lainnya menyatakan TINDAKAN yang dilakukan untuk mencapai tujuan itu: 为了考上大学，她每天努力学习 = supaya bisa masuk universitas, dia belajar keras setiap hari.", "Biasanya klausa 为了 diletakkan di DEPAN, dipisah dengan koma, lalu subjek dan tindakannya: 为了早点儿到家，我打算坐飞机回去. Bisa juga 为了 sesudah subjek tanpa koma bila pendek: 他为了学汉语来中国了.", "Jika tujuan ingin disebut di belakang, pakai 是为了: 大家打球只是为了锻炼身体 (dialog pelajaran 9) = semua orang main bola hanya untuk berolahraga. Jangan langsung menaruh 为了 + tujuan di akhir tanpa 是.", "Bedakan 为了 (tujuan, sesuatu yang ingin dicapai) dengan 因为 (sebab, sesuatu yang sudah terjadi). 因为下雨，我没去 = karena hujan, aku tidak pergi. 为了不迟到，我六点就起床了 = supaya tidak terlambat, aku bangun jam enam. Kalimat 为了 tidak memakai 所以.", "Jebakan bagi pelajar Indonesia: kata \"untuk\" dalam bahasa Indonesia sangat luas (\"buku untuk adik\", \"pergi untuk belajar\"). 为了 hanya untuk tujuan yang ingin dicapai. \"Hadiah untuk ibu\" memakai 给: 给妈妈的礼物. \"Pergi ke toko untuk membeli\" cukup kalimat kata kerja berurutan: 去商店买东西.", "Dalam pelajaran 11 ada kata depan 为 (demi/untuk seseorang/sesuatu): 我不愿意为工作或学习离开家人. 为 lebih singkat dan sering diikuti kata benda."], "poin": ["为了 + tujuan, tindakan.", "Tujuan di belakang: ……是为了…….", "为了 (tujuan) ≠ 因为 (sebab).", "Tidak dipasangkan dengan 所以."], "contoh": [{"zh": "听说为了准备运动会，你们几个男生每天都练球。", "py": "Tīngshuō wèile zhǔnbèi yùndònghuì, nǐmen jǐ gè nánshēng měi tiān dōu liàn qiú.", "id": "Kudengar untuk persiapan pekan olahraga, kalian beberapa cowok berlatih bola setiap hari.", "b": true, "tr": "09-1"}, {"zh": "为了考上大学，她每天努力学习。", "py": "Wèile kǎo shàng dàxué, tā měi tiān nǔlì xuéxí.", "id": "Supaya bisa masuk universitas, dia belajar keras setiap hari.", "b": true, "tr": null}, {"zh": "为了早点儿到家，我打算坐飞机回去。", "py": "Wèile zǎo diǎnr dào jiā, wǒ dǎsuàn zuò fēijī huíqù.", "id": "Supaya sampai di rumah lebih cepat, aku berencana pulang naik pesawat.", "b": true, "tr": null}, {"zh": "大家打球只是为了锻炼身体。", "py": "Dàjiā dǎ qiú zhǐshì wèile duànliàn shēntǐ.", "id": "Semua orang main hanya untuk berolahraga.", "b": true, "tr": "09-3"}, {"zh": "为了考上好高中，初中就得有一个不错的成绩。", "py": "Wèile kǎo shàng hǎo gāozhōng, chūzhōng jiù de yǒu yí gè búcuò de chéngjì.", "id": "Untuk bisa masuk SMA yang bagus, waktu SMP harus punya nilai yang lumayan.", "b": true, "tr": "10-7"}, {"zh": "为了身体健康，我每天跑步。", "py": "Wèile shēntǐ jiànkāng, wǒ měi tiān pǎobù.", "id": "Demi kesehatan, aku lari setiap hari.", "b": false, "tr": null}, {"zh": "为了学好汉语，他来中国了。", "py": "Wèile xué hǎo Hànyǔ, tā lái Zhōngguó le.", "id": "Untuk menguasai bahasa Mandarin dengan baik, dia datang ke Tiongkok.", "b": false, "tr": null}, {"zh": "为了不迟到，我六点就起床了。", "py": "Wèile bù chídào, wǒ liù diǎn jiù qǐchuáng le.", "id": "Supaya tidak terlambat, aku sudah bangun jam enam.", "b": false, "tr": null}, {"zh": "为了给妈妈过生日，我们准备了很多菜。", "py": "Wèile gěi māma guò shēngrì, wǒmen zhǔnbèi le hěn duō cài.", "id": "Untuk merayakan ulang tahun ibu, kami menyiapkan banyak masakan.", "b": false, "tr": null}, {"zh": "我们搬家是为了离学校近一点儿。", "py": "Wǒmen bānjiā shì wèile lí xuéxiào jìn yìdiǎnr.", "id": "Kami pindah rumah supaya lebih dekat ke sekolah.", "b": false, "tr": null}], "salah": [{"s": "因为学好汉语，我每天练习。", "sp": "Yīnwèi xué hǎo Hànyǔ, wǒ měi tiān liànxí.", "n": "supaya", "b": "为了学好汉语，我每天练习。", "bp": "Wèile xué hǎo Hànyǔ, wǒ měi tiān liànxí.", "a": "Tujuan memakai 为了, bukan 因为."}, {"s": "为了早点儿到家，所以我坐飞机回去。", "sp": "Wèile zǎo diǎnr dào jiā, suǒyǐ wǒ zuò fēijī huíqù.", "n": "", "b": "为了早点儿到家，我坐飞机回去。", "bp": "Wèile zǎo diǎnr dào jiā, wǒ zuò fēijī huíqù.", "a": "为了 tidak dipasangkan dengan 所以."}, {"s": "我每天跑步为了身体健康。", "sp": "Wǒ měi tiān pǎobù wèile shēntǐ jiànkāng.", "n": "", "b": "我每天跑步是为了身体健康。", "bp": "Wǒ měi tiān pǎobù shì wèile shēntǐ jiànkāng.", "a": "Tujuan di belakang memakai 是为了."}], "latihan": [{"k": "9-1.0", "t": "pg", "q": "___考上大学，她每天努力学习。", "o": ["为了", "因为", "所以", "但是"], "a": 0, "x": "Tujuan = 为了.", "f": "为了考上大学，她每天努力学习。", "fp": "Wèile kǎo shàng dàxué, tā měi tiān nǔlì xuéxí."}, {"k": "9-1.1", "t": "pg", "q": "___下雨，我们没去公园。", "o": ["因为", "为了", "而且", "或者"], "a": 0, "x": "Sebab yang sudah terjadi = 因为.", "f": "因为下雨，我们没去公园。", "fp": "Yīnwèi xià yǔ, wǒmen méi qù gōngyuán."}, {"k": "9-1.2", "t": "pg", "q": "大家打球只___为了锻炼身体。", "o": ["是", "有", "在", "要"], "a": 0, "x": "Tujuan di belakang: 是为了.", "f": "大家打球只是为了锻炼身体。", "fp": "Dàjiā dǎ qiú zhǐshì wèile duànliàn shēntǐ."}, {"k": "9-1.3", "t": "pg", "q": "\"Supaya tidak terlambat, aku bangun jam enam\" =", "o": ["为了不迟到，我六点就起床了。", "因为不迟到，我六点就起床了。", "我六点就起床了为了不迟到。", "为了不迟到，所以我六点起床了。"], "a": 0, "x": "为了 + tujuan di depan, tanpa 所以."}, {"k": "9-1.4", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["为了准备考试，他每天都去图书馆。", "为了他每天都去图书馆，准备考试。", "他每天都去图书馆为了准备考试。", "因为准备考试，所以为了去图书馆。"], "a": 0, "x": "为了 + tujuan, tindakan."}, {"k": "9-1.5", "t": "pg", "q": "为了早点儿到上海，___。", "o": ["我们打算坐高铁去", "我们很高兴", "上海很漂亮", "我们没有钱"], "a": 0, "x": "Klausa kedua = tindakan untuk mencapai tujuan.", "f": "为了早点儿到上海，我们打算坐高铁去。", "fp": "Wèile zǎo diǎnr dào Shànghǎi, wǒmen dǎsuàn zuò gāotiě qù."}, {"k": "9-1.6", "t": "su", "w": ["为了", "考上", "大学，", "她", "每天", "努力", "学习"], "s": "为了考上大学，她每天努力学习。", "alt": [], "p": "Wèile kǎo shàng dàxué, tā měi tiān nǔlì xuéxí.", "x": "Supaya bisa masuk universitas, dia belajar keras setiap hari."}, {"k": "9-1.7", "t": "su", "w": ["为了", "早点儿", "到家，", "我", "打算", "坐", "飞机", "回去"], "s": "为了早点儿到家，我打算坐飞机回去。", "alt": [], "p": "Wèile zǎo diǎnr dào jiā, wǒ dǎsuàn zuò fēijī huíqù.", "x": "Supaya sampai rumah lebih cepat, aku berencana pulang naik pesawat."}, {"k": "9-1.8", "t": "su", "w": ["为了", "身体", "健康，", "我", "每天", "跑步"], "s": "为了身体健康，我每天跑步。", "alt": [], "p": "Wèile shēntǐ jiànkāng, wǒ měi tiān pǎobù.", "x": "Demi kesehatan, aku lari setiap hari."}, {"k": "9-1.9", "t": "su", "w": ["大家", "打球", "只", "是", "为了", "锻炼", "身体"], "s": "大家打球只是为了锻炼身体。", "alt": [], "p": "Dàjiā dǎ qiú zhǐshì wèile duànliàn shēntǐ.", "x": "Semua orang main bola hanya untuk berolahraga."}, {"k": "9-1.10", "t": "su", "w": ["为了", "学好", "汉语，", "他", "来", "中国", "了"], "s": "为了学好汉语，他来中国了。", "alt": [], "p": "Wèile xué hǎo Hànyǔ, tā lái Zhōngguó le.", "x": "Untuk menguasai bahasa Mandarin, dia datang ke Tiongkok."}, {"k": "9-1.11", "t": "bs", "s": "为了准备运动会，他们每天都练球。", "sp": "Wèile zhǔnbèi yùndònghuì, tāmen měi tiān dōu liàn qiú.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "9-1.12", "t": "bs", "s": "因为考上好大学，她每天努力学习。", "sp": "Yīnwèi kǎo shàng hǎo dàxué, tā měi tiān nǔlì xuéxí.", "n": "", "ok": false, "b": "为了考上好大学，她每天努力学习。", "bp": "Wèile kǎo shàng hǎo dàxué, tā měi tiān nǔlì xuéxí.", "x": "Tujuan = 为了."}, {"k": "9-1.13", "t": "bs", "s": "为了不迟到，所以我打车去学校。", "sp": "Wèile bù chídào, suǒyǐ wǒ dǎchē qù xuéxiào.", "n": "", "ok": false, "b": "为了不迟到，我打车去学校。", "bp": "Wèile bù chídào, wǒ dǎchē qù xuéxiào.", "x": "Hilangkan 所以."}, {"k": "9-1.14", "t": "bs", "s": "我们搬家是为了离学校近一点儿。", "sp": "Wǒmen bānjiā shì wèile lí xuéxiào jìn yìdiǎnr.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "9-1.15", "t": "bs", "s": "为了给妈妈过生日，我们准备了很多菜。", "sp": "Wèile gěi māma guò shēngrì, wǒmen zhǔnbèi le hěn duō cài.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "9-2", "pel": 9, "judul": "Pelengkap kemungkinan: KK + 得/不 + pelengkap hasil/arah", "kode": "可能补语", "rumus": ["KK + 得 + pelengkap (看得懂 = bisa paham)", "KK + 不 + pelengkap (看不懂 = tidak bisa paham)", "KK得C + KK不C？ / KK得C + 吗？"], "jelas": ["Pelengkap kemungkinan dibentuk dengan menyisipkan 得 atau 不 di antara kata kerja dan pelengkap hasil (懂, 完, 好, 见, 清楚, 会, 住) atau pelengkap arah (进去, 过来, 回来). Artinya apakah keadaan MEMUNGKINKAN hasil itu tercapai: 看得懂 = bisa (membaca dan) paham, 看不懂 = tidak bisa paham.", "Bentuk positif: KK + 得 + pelengkap (听得见 = bisa mendengar). Bentuk ingkar: KK + 不 + pelengkap (听不见 = tidak bisa mendengar). Bentuk tanya: 这本书你看得懂看不懂？ atau 你只有一个星期的时间，学得会游泳吗？", "Bentuk INGKAR jauh lebih sering dipakai daripada bentuk positif: 打不好没关系, 总是踢不进去, 现在什么都看不见, 听不清楚, 我怕干不完. Bentuk positif biasanya muncul dalam pertanyaan dan jawabannya: 听得见吗？——听得见。", "Bedakan dengan 没 + KK + pelengkap (fakta hasilnya tidak tercapai): 我没听懂 = (tadi) aku tidak paham. 我听不懂 = aku tidak mampu paham (misalnya terlalu sulit). Bedakan juga dengan 不能: 不能 lebih ke \"tidak boleh/tidak bisa karena kondisi umum\", sedangkan 看不懂 menekankan hasil yang tidak bisa dicapai. Jangan bilang 我不能看懂.", "Objek bisa diletakkan sesudah pelengkap (我听不懂他的话) atau di depan sebagai topik (他的话我听不懂). Pelengkap kemungkinan TIDAK bisa dipakai dalam kalimat 把: bukan 我把作业做不完, tetapi 作业我做不完.", "Jebakan bagi pelajar Indonesia: bahasa Indonesia memakai \"tidak bisa\" di depan kata kerja (\"tidak bisa mendengar\"), sehingga pelajar sering bilang 我不听见 atau 我不能听见. Dalam Mandarin, 不 masuk ke tengah: 听不见."], "poin": ["KK得C = bisa mencapai hasil; KK不C = tidak bisa.", "Tanya: KK得C KK不C？ / KK得C吗？", "Bentuk ingkar paling sering dipakai.", "Tidak dipakai dengan 把; jangan 不能看懂."], "contoh": [{"zh": "打不好没关系。", "py": "Dǎ bù hǎo méiguānxi.", "id": "Tidak apa-apa kalau mainnya belum bagus.", "b": true, "tr": "09-3"}, {"zh": "这本书你看得懂看不懂？", "py": "Zhè běn shū nǐ kàn de dǒng kàn bu dǒng?", "id": "Buku ini bisa kamu pahami atau tidak?", "b": true, "tr": null}, {"zh": "你只有一个星期的时间，学得会游泳吗？", "py": "Nǐ zhǐyǒu yí gè xīngqī de shíjiān, xué de huì yóuyǒng ma?", "id": "Kamu hanya punya waktu seminggu, bisakah belajar sampai bisa berenang?", "b": true, "tr": null}, {"zh": "今天怎么回事？总是踢不进去！", "py": "Jīntiān zěnme huí shì? Zǒngshì tī bú jìnqù!", "id": "Hari ini kenapa sih? Selalu tidak bisa menendang bola masuk!", "b": true, "tr": "09-5"}, {"zh": "如果总是接不住球，就太不好意思了。", "py": "Rúguǒ zǒngshì jiē bú zhù qiú, jiù tài bùhǎoyìsī le.", "id": "Kalau terus tidak bisa menerima kok, malu sekali.", "b": true, "tr": "09-3"}, {"zh": "现在什么都看不见。", "py": "Xiànzài shénme dōu kàn bújiàn.", "id": "Sekarang tidak bisa melihat apa-apa.", "b": true, "tr": "11-3"}, {"zh": "听得见声音，但是声音有点儿小，听不清楚。", "py": "Tīng de jiàn shēngyīn, dànshì shēngyīn yǒudiǎnr xiǎo, tīng bù qīngchu.", "id": "Suaranya terdengar, tapi agak kecil, tidak bisa mendengar dengan jelas.", "b": true, "tr": "11-3"}, {"zh": "开会前这么多工作我怕干不完。", "py": "Kāihuì qián zhème duō gōngzuò wǒ pà gàn bù wán.", "id": "Pekerjaan sebanyak ini sebelum rapat, aku takut tidak bisa selesai.", "b": true, "tr": "11-5"}, {"zh": "黑板上的字太小了，我看不清楚。", "py": "Hēibǎn shàng de zì tài xiǎo le, wǒ kàn bù qīngchu.", "id": "Tulisan di papan tulis terlalu kecil, aku tidak bisa melihat dengan jelas.", "b": false, "tr": null}, {"zh": "这么多菜，我们两个人吃得完吗？", "py": "Zhème duō cài, wǒmen liǎng gè rén chī de wán ma?", "id": "Masakan sebanyak ini, apakah kita berdua bisa menghabiskannya?", "b": false, "tr": null}], "salah": [{"s": "我不听懂老师的话。", "sp": "Wǒ bù tīng dǒng lǎoshī dehuà.", "n": "", "b": "我听不懂老师的话。", "bp": "Wǒ tīng bu dǒng lǎoshī dehuà.", "a": "不 masuk di antara kata kerja dan pelengkap."}, {"s": "这本书太难了，我不能看懂。", "sp": "Zhè běn shū tài nán le, wǒ bù néng kàn dǒng.", "n": "", "b": "这本书太难了，我看不懂。", "bp": "Zhè běn shū tài nán le, wǒ kàn bu dǒng.", "a": "Tidak mampu mencapai hasil = 看不懂."}, {"s": "你看得懂吗不懂？", "sp": "Nǐ kàn de dǒng ma bù dǒng?", "n": "", "b": "你看得懂看不懂？", "bp": "Nǐ kàn de dǒng kàn bu dǒng?", "a": "Tanya: KK得C + KK不C, atau KK得C + 吗."}, {"s": "我把作业做不完。", "sp": "Wǒ bǎ zuòyè zuò bù wán.", "n": "", "b": "作业我做不完。", "bp": "Zuòyè wǒ zuò bù wán.", "a": "Pelengkap kemungkinan tidak dipakai dalam kalimat 把."}], "latihan": [{"k": "9-2.0", "t": "pg", "q": "这本书你看得懂看___？", "o": ["不懂", "没懂", "得懂", "懂不"], "a": 0, "x": "Tanya: 看得懂看不懂.", "f": "这本书你看得懂看不懂？", "fp": "Zhè běn shū nǐ kàn de dǒng kàn bu dǒng?"}, {"k": "9-2.1", "t": "pg", "q": "A：喂，你听得见吗？ B：___，请你大声一点儿。", "o": ["听不见", "不听见", "没能听", "听得不见"], "a": 0, "x": "Tidak bisa mendengar = 听不见."}, {"k": "9-2.2", "t": "pg", "q": "这么多工作，今天我做___。", "o": ["不完", "没完", "得不完", "完不"], "a": 0, "x": "Tidak bisa selesai = 做不完.", "f": "这么多工作，今天我做不完。", "fp": "Zhème duō gōngzuò, jīntiān wǒ zuò bù wán."}, {"k": "9-2.3", "t": "pg", "q": "\"Saya tidak paham perkataan guru (terlalu cepat)\" =", "o": ["老师说得太快，我听不懂。", "老师说得太快，我不听懂。", "老师说得太快，我不能听懂。", "老师说得太快，我听懂不。"], "a": 0, "x": "KK + 不 + 懂."}, {"k": "9-2.4", "t": "pg", "q": "Mana yang artinya \"tadi saya tidak paham\" (fakta)?", "o": ["我没听懂。", "我听不懂。", "我听得懂。", "我不听懂。"], "a": 0, "x": "没 + KK + pelengkap = fakta hasil tidak tercapai."}, {"k": "9-2.5", "t": "pg", "q": "门太小，车开不___。", "o": ["进去", "进得去", "去进", "得进去"], "a": 0, "x": "KK + 不 + pelengkap arah: 开不进去.", "f": "门太小，车开不进去。", "fp": "Mén tài xiǎo, chē kāi bú jìnqù."}, {"k": "9-2.6", "t": "su", "w": ["这", "本", "书", "你", "看", "得", "懂", "看", "不", "懂"], "s": "这本书你看得懂看不懂？", "alt": [], "p": "Zhè běn shū nǐ kàn de dǒng kàn bu dǒng?", "x": "Buku ini bisa kamu pahami atau tidak?"}, {"k": "9-2.7", "t": "su", "w": ["你", "一", "个", "星期", "学", "得", "会", "游泳", "吗"], "s": "你一个星期学得会游泳吗？", "alt": [], "p": "Nǐ yí gè xīngqī xué de huì yóuyǒng ma?", "x": "Dalam seminggu bisakah kamu belajar sampai bisa berenang?"}, {"k": "9-2.8", "t": "su", "w": ["字", "太", "小，", "我", "看", "不", "清楚"], "s": "字太小，我看不清楚。", "alt": [], "p": "Zì tài xiǎo, wǒ kàn bù qīngchu.", "x": "Tulisannya terlalu kecil, aku tidak bisa melihat dengan jelas."}, {"k": "9-2.9", "t": "su", "w": ["菜", "太", "多", "了，", "我们", "吃", "不", "完"], "s": "菜太多了，我们吃不完。", "alt": [], "p": "Cài tài duō le, wǒmen chī bù wán.", "x": "Masakannya terlalu banyak, kami tidak bisa menghabiskannya."}, {"k": "9-2.10", "t": "su", "w": ["我", "怕", "今天", "干", "不", "完"], "s": "我怕今天干不完。", "alt": [], "p": "Wǒ pà jīntiān gān bù wán.", "x": "Aku takut hari ini tidak bisa selesai."}, {"k": "9-2.11", "t": "bs", "s": "打不好没关系。", "sp": "Dǎ bù hǎo méiguānxi.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "9-2.12", "t": "bs", "s": "声音太小了，我不听见。", "sp": "Shēngyīn tài xiǎo le, wǒ bù tīngjiàn.", "n": "", "ok": false, "b": "声音太小了，我听不见。", "bp": "Shēngyīn tài xiǎo le, wǒ tīng bújiàn.", "x": "不 masuk ke tengah: 听不见."}, {"k": "9-2.13", "t": "bs", "s": "我把这些菜吃不完。", "sp": "Wǒ bǎ zhèxiē cài chī bù wán.", "n": "", "ok": false, "b": "这些菜我吃不完。", "bp": "Zhèxiē cài wǒ chī bù wán.", "x": "Tidak memakai 把 dengan pelengkap kemungkinan."}, {"k": "9-2.14", "t": "bs", "s": "你说话我听得见。", "sp": "Nǐ shuōhuà wǒ tīng de jiàn.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "9-2.15", "t": "bs", "s": "今天怎么总是踢不进去？", "sp": "Jīntiān zěnme zǒngshì tī bú jìnqù?", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "9-3", "pel": 9, "judul": "Pola tetap: 越A越B (makin A makin B)", "kode": "固定格式\"越A越B\"", "rumus": ["S + 越 + A + 越 + B (越看越着急)", "S₁ + 越 + A，S₂ + 越 + B (妈妈越说，他越不高兴)", "越 + KS + 越好 (越多越好)"], "jelas": ["越A越B artinya \"makin A, makin B\": B berubah mengikuti perubahan A. A dan B bisa berupa kata kerja atau kata sifat: 越看越着急 (makin ditonton makin gelisah), 越跑越快 (makin lari makin cepat), 越多越好 (makin banyak makin baik).", "Jika subjeknya SATU, subjek diletakkan sekali di depan: 雨越下越大. Jika ada DUA subjek, masing-masing subjek diletakkan SEBELUM 越: 妈妈越说，他越不高兴 = makin ibu bicara, makin dia tidak senang. Jangan bilang 越妈妈说.", "B sering berupa kata sifat atau kata kerja perasaan, dan TIDAK memakai 很/非常/太: 越看越喜欢, bukan 越看越很喜欢. B juga bisa ingkar: 越说越不高兴, 越着急越做不好.", "Bandingkan dengan 越来越 (pelajaran 6): 越来越 berarti \"makin lama makin …\" (berubah karena waktu): 天气越来越冷. 越A越B menyebut penyebab perubahan secara jelas: 越往北走越冷 (makin ke utara makin dingin).", "Jebakan bagi pelajar Indonesia: bahasa Indonesia \"makin … makin …\" sangat mirip, jadi mudah dipahami. Kesalahan yang sering terjadi adalah menaruh subjek setelah 越, menambah 很, atau mencampur dengan 越来越 (雨越来越下大). Cukup: 雨越下越大.", "Ungkapan yang sering dipakai: 越快越好 (makin cepat makin baik), 越多越好, 越早越好, 越看越喜欢, 越想越生气."], "poin": ["越A越B = makin A makin B.", "Dua subjek: S₁越A，S₂越B.", "B tanpa 很/非常/太.", "越来越 = makin lama makin (karena waktu)."], "contoh": [{"zh": "今天的足球比赛我越看越着急。", "py": "Jīntiān de zúqiú bǐsài wǒ yuè kàn yuè zháojí.", "id": "Pertandingan sepak bola hari ini makin kutonton makin membuatku gelisah.", "b": true, "tr": null}, {"zh": "妈妈越说，他越不高兴。", "py": "Māma yuè shuō, tā yuè bù gāoxìng.", "id": "Makin ibu bicara, makin dia tidak senang.", "b": true, "tr": null}, {"zh": "我想认识中国朋友，越多越好。", "py": "Wǒ xiǎng rènshi Zhōngguó péngyou, yuè duō yuè hǎo.", "id": "Aku ingin berkenalan dengan teman Tiongkok, makin banyak makin baik.", "b": true, "tr": null}, {"zh": "越看越着急。我不看了，你们告诉我得分吧。", "py": "Yuè kàn yuè zháojí. Wǒ bú kàn le, nǐmen gàosu wǒ défēn ba.", "id": "Makin ditonton makin gelisah. Aku tidak nonton lagi, kalian beri tahu saja skornya.", "b": true, "tr": "09-5"}, {"zh": "雨越下越大，一会儿可能更大。", "py": "Yǔ yuè xià yuè dà, yíhuìr kěnéng gèng dà.", "id": "Hujan makin lama makin deras, sebentar lagi mungkin lebih deras.", "b": false, "tr": null}, {"zh": "他越跑越快，最后得了第一。", "py": "Tā yuè pǎo yuè kuài, zuìhòu de le dìyī.", "id": "Dia makin lari makin cepat, akhirnya juara satu.", "b": false, "tr": null}, {"zh": "汉语越学越有意思。", "py": "Hànyǔ yuè xué yuè yǒuyìsi.", "id": "Bahasa Mandarin makin dipelajari makin menarik.", "b": false, "tr": null}, {"zh": "这件衣服我越看越喜欢。", "py": "Zhè jiàn yīfu wǒ yuè kàn yuè xǐhuan.", "id": "Baju ini makin kulihat makin kusuka.", "b": false, "tr": null}, {"zh": "你越着急，越做不好。", "py": "Nǐ yuè zháojí, yuè zuò bù hǎo.", "id": "Makin kamu terburu-buru, makin tidak bisa mengerjakannya dengan baik.", "b": false, "tr": null}, {"zh": "这个电影越看越没意思。", "py": "Zhège diànyǐng yuè kàn yuè méiyìsi.", "id": "Film ini makin ditonton makin membosankan.", "b": false, "tr": null}], "salah": [{"s": "他越跑越很快。", "sp": "Tā yuè pǎo yuè hěn kuài.", "n": "", "b": "他越跑越快。", "bp": "Tā yuè pǎo yuè kuài.", "a": "B tidak memakai 很."}, {"s": "越妈妈说，他越不高兴。", "sp": "Yuè māma shuō, tā yuè bù gāoxìng.", "n": "", "b": "妈妈越说，他越不高兴。", "bp": "Māma yuè shuō, tā yuè bù gāoxìng.", "a": "Subjek diletakkan sebelum 越."}, {"s": "雨越来越下大了。", "sp": "Yǔ yuè lái yuè xià dà le.", "n": "", "b": "雨越下越大了。", "bp": "Yǔ yuè xià yuè dà le.", "a": "Untuk \"makin turun makin deras\" pakai 越下越大."}], "latihan": [{"k": "9-3.0", "t": "pg", "q": "今天的足球比赛我越看越___。", "o": ["着急", "很着急", "非常着急", "着急了很"], "a": 0, "x": "B tanpa 很/非常.", "f": "今天的足球比赛我越看越着急。", "fp": "Jīntiān de zúqiú bǐsài wǒ yuè kàn yuè zháojí."}, {"k": "9-3.1", "t": "pg", "q": "\"Makin ibu bicara, makin dia tidak senang\" =", "o": ["妈妈越说，他越不高兴。", "越妈妈说，越他不高兴。", "妈妈说越，他不高兴越。", "妈妈越说，越他不高兴。"], "a": 0, "x": "S₁ 越 A，S₂ 越 B."}, {"k": "9-3.2", "t": "pg", "q": "我想认识中国朋友，越多___。", "o": ["越好", "越来越好", "很好", "好了"], "a": 0, "x": "越多越好 = makin banyak makin baik.", "f": "我想认识中国朋友，越多越好。", "fp": "Wǒ xiǎng rènshi Zhōngguó péngyou, yuè duō yuè hǎo."}, {"k": "9-3.3", "t": "pg", "q": "雨越下越___。", "o": ["大", "很大", "大大", "太大"], "a": 0, "x": "越下越大.", "f": "雨越下越大。", "fp": "Yǔ yuè xià yuè dà."}, {"k": "9-3.4", "t": "pg", "q": "Mana yang menyebut perubahan karena waktu saja (makin lama makin)?", "o": ["天气越来越冷。", "越往北走越冷。", "越跑越快。", "越看越喜欢。"], "a": 0, "x": "越来越 = makin lama makin."}, {"k": "9-3.5", "t": "pg", "q": "这件衣服我越___越喜欢，买了吧。", "o": ["看", "看了", "看着", "看过"], "a": 0, "x": "越 + KK + 越 + KS.", "f": "这件衣服我越看越喜欢，买了吧。", "fp": "Zhè jiàn yīfu wǒ yuè kàn yuè xǐhuan, mǎi le ba."}, {"k": "9-3.6", "t": "su", "w": ["今天", "的", "比赛", "我", "越", "看", "越", "着急"], "s": "今天的比赛我越看越着急。", "alt": ["的今天比赛我越看越着急。"], "p": "Jīntiān de bǐsài wǒ yuè kàn yuè zháojí.", "x": "Pertandingan hari ini makin kutonton makin gelisah."}, {"k": "9-3.7", "t": "su", "w": ["妈妈", "越", "说，", "他", "越", "不", "高兴"], "s": "妈妈越说，他越不高兴。", "alt": [], "p": "Māma yuè shuō, tā yuè bù gāoxìng.", "x": "Makin ibu bicara, makin dia tidak senang."}, {"k": "9-3.8", "t": "su", "w": ["雨", "越", "下", "越", "大"], "s": "雨越下越大。", "alt": [], "p": "Yǔ yuè xià yuè dà.", "x": "Hujan makin lama makin deras."}, {"k": "9-3.9", "t": "su", "w": ["汉语", "越", "学", "越", "有", "意思"], "s": "汉语越学越有意思。", "alt": [], "p": "Hànyǔ yuè xué yuè yǒuyìsi.", "x": "Bahasa Mandarin makin dipelajari makin menarik."}, {"k": "9-3.10", "t": "su", "w": ["他", "越", "跑", "越", "快"], "s": "他越跑越快。", "alt": [], "p": "Tā yuè pǎo yuè kuài.", "x": "Dia makin lari makin cepat."}, {"k": "9-3.11", "t": "bs", "s": "这件衣服我越看越喜欢。", "sp": "Zhè jiàn yīfu wǒ yuè kàn yuè xǐhuan.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "9-3.12", "t": "bs", "s": "汉语越学越很有意思。", "sp": "Hànyǔ yuè xué yuè hěn yǒuyìsi.", "n": "", "ok": false, "b": "汉语越学越有意思。", "bp": "Hànyǔ yuè xué yuè yǒuyìsi.", "x": "B tanpa 很."}, {"k": "9-3.13", "t": "bs", "s": "越老师说，我越明白。", "sp": "Yuè lǎoshī shuō, wǒ yuè míngbai.", "n": "", "ok": false, "b": "老师越说，我越明白。", "bp": "Lǎoshī yuè shuō, wǒ yuè míngbai.", "x": "Subjek sebelum 越."}, {"k": "9-3.14", "t": "bs", "s": "你越着急，越做不好。", "sp": "Nǐ yuè zháojí, yuè zuò bù hǎo.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "9-3.15", "t": "bs", "s": "我想认识中国朋友，越多越好。", "sp": "Wǒ xiǎng rènshi Zhōngguó péngyou, yuè duō yuè hǎo.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "10-1", "pel": 10, "judul": "Kalimat 把 (1): S + 把 + O + KK + 在/到 + tempat", "kode": "\"把\"字句（1）", "rumus": ["S + 把 + O + KK + 在/到 + tempat", "S + 不/没/能/会/要 + 把 + O + KK + 在/到 + tempat", "Perintah: (请) + 把 + O + KK + 在/到 + tempat"], "jelas": ["Kalimat 把 dipakai ketika kita melakukan sesuatu terhadap benda/orang TERTENTU sehingga benda itu berubah. Pada pola (1) ini perubahannya adalah PERPINDAHAN TEMPAT: 老师把作业本放到桌子上了 = guru menaruh buku PR ke atas meja (buku PR berpindah ke meja).", "Susunannya: Subjek + 把 + objek + kata kerja + 在/到 + tempat. 把 membawa objek ke DEPAN kata kerja. Kata kerja yang sering dipakai: 放, 写, 记, 停, 送, 搬, 带, 忘.", "Kata ingkar (不/没) dan kata bantu kerja (能, 会, 要, 想, 应该) diletakkan SEBELUM 把, bukan sebelum kata kerja: 你不能把名字写在这里. 我没把护照放在包里. 我会把这些题都记在本子上.", "Objek kalimat 把 harus sesuatu yang TERTENTU (sudah diketahui), biasanya dengan 这/那/我的 dsb.: 把这本书, 把我的手机. Jangan memakai objek tak tentu seperti 一本书. Kata kerja juga tidak boleh berdiri sendiri; harus ada bagian sesudahnya (di sini 在/到 + tempat).", "Jebakan bagi pelajar Indonesia: bahasa Indonesia berkata \"taruh buku DI meja\" dengan susunan KK + O + tempat. Dalam Mandarin, kalau ada objek dan tempat tujuan sesudah kata kerja, objeknya wajib dipindah dengan 把: 我把书放在桌子上 (bukan 我放书在桌子上).", "Kata keterangan seperti 都 diletakkan setelah objek bila merujuk objek: 我把这些题都记在本子上. Kalimat 把 sangat sering dipakai untuk perintah: 请把手机放在这里."], "poin": ["把 + O tertentu + KK + 在/到 + tempat.", "不/没/能/会 sebelum 把.", "Objek harus tertentu (这/那/milik).", "KK + O + tempat → wajib pakai 把."], "contoh": [{"zh": "我会把这些题都记在本子上。", "py": "Wǒ huì bǎ zhèxiē tí dōu jì zài běnzi shàng.", "id": "Aku akan mencatat semua soal ini di buku catatan.", "b": true, "tr": "10-1"}, {"zh": "老师把作业本放到桌子上了。", "py": "Lǎoshī bǎ zuòyè běn fàng dào zhuōzi shàng le.", "id": "Guru menaruh buku PR ke atas meja.", "b": true, "tr": null}, {"zh": "你不能把名字写在这里。", "py": "Nǐ bù néng bǎ míngzi xiě zài zhèlǐ.", "id": "Kamu tidak boleh menulis nama di sini.", "b": true, "tr": null}, {"zh": "请把你的书放在桌子上。", "py": "Qǐng bǎ nǐ de shū fàng zài zhuōzi shàng.", "id": "Silakan taruh bukumu di atas meja.", "b": false, "tr": null}, {"zh": "我把车停在学校门口了。", "py": "Wǒ bǎ chē tíng zài xuéxiào ménkǒu le.", "id": "Aku memarkir mobil di depan gerbang sekolah.", "b": false, "tr": null}, {"zh": "检票的时候我才发现，没把护照放在包里。", "py": "Jiǎnpiào de shíhou wǒ cái fāxiàn, méi bǎ hùzhào fàng zài bāo lǐ.", "id": "Waktu pemeriksaan tiket aku baru sadar, aku tidak memasukkan paspor ke tas.", "b": false, "tr": null}, {"zh": "妈妈把水果放到冰箱里了。", "py": "Māma bǎ shuǐguǒ fàng dào bīngxiāng lǐ le.", "id": "Ibu memasukkan buah ke dalam kulkas.", "b": false, "tr": null}, {"zh": "司机把我们的行李送到了宾馆。", "py": "Sījī bǎ wǒmen de xíngli sòng dào le bīnguǎn.", "id": "Sopir mengantar koper kami sampai ke hotel.", "b": false, "tr": null}, {"zh": "我好像把校园卡忘在教室里了。", "py": "Wǒ hǎoxiàng bǎ xiàoyuán kǎ wàng zài jiàoshì lǐ le.", "id": "Sepertinya aku ketinggalan kartu kampus di kelas.", "b": false, "tr": null}, {"zh": "别把手机放在床上。", "py": "Bié bǎ shǒujī fàng zài chuáng shàng.", "id": "Jangan taruh HP di atas ranjang.", "b": false, "tr": null}], "salah": [{"s": "我放书在桌子上。", "sp": "Wǒ fàng shū zài zhuōzi shàng.", "n": "", "b": "我把书放在桌子上。", "bp": "Wǒ bǎ shū fàng zài zhuōzi shàng.", "a": "KK + O + tempat → pakai 把."}, {"s": "我把护照没放在包里。", "sp": "Wǒ bǎ hùzhào méi fàng zài bāo lǐ.", "n": "", "b": "我没把护照放在包里。", "bp": "Wǒ méi bǎ hùzhào fàng zài bāo lǐ.", "a": "没 sebelum 把."}, {"s": "请把一本书放在这儿。", "sp": "Qǐng bǎ yì běn shū fàng zài zhèr.", "n": "", "b": "请把这本书放在这儿。", "bp": "Qǐng bǎ zhè běn shū fàng zài zhèr.", "a": "Objek 把 harus tertentu."}, {"s": "老师把作业本放。", "sp": "Lǎoshī bǎ zuòyè běn fàng.", "n": "", "b": "老师把作业本放到桌子上了。", "bp": "Lǎoshī bǎ zuòyè běn fàng dào zhuōzi shàng le.", "a": "Kata kerja dalam kalimat 把 tidak boleh berdiri sendiri."}], "latihan": [{"k": "10-1.0", "t": "pg", "q": "我会___这些题都记在本子上。", "o": ["把", "被", "给", "对"], "a": 0, "x": "把 + objek + KK + 在 + tempat.", "f": "我会把这些题都记在本子上。", "fp": "Wǒ huì bǎ zhèxiē tí dōu jì zài běnzi shàng."}, {"k": "10-1.1", "t": "pg", "q": "Mana kalimat yang benar?", "o": ["你不能把名字写在这里。", "你把名字不能写在这里。", "你把名字写不能在这里。", "你不能写名字把在这里。"], "a": 0, "x": "Kata bantu kerja sebelum 把."}, {"k": "10-1.2", "t": "pg", "q": "老师把作业本放___桌子上了。", "o": ["到", "给", "得", "着"], "a": 0, "x": "KK + 到 + tempat.", "f": "老师把作业本放到桌子上了。", "fp": "Lǎoshī bǎ zuòyè běn fàng dào zhuōzi shàng le."}, {"k": "10-1.3", "t": "pg", "q": "\"Aku tidak memasukkan paspor ke tas\" =", "o": ["我没把护照放在包里。", "我把护照没放在包里。", "我没放护照在包里把。", "我把没护照放在包里。"], "a": 0, "x": "没 sebelum 把."}, {"k": "10-1.4" ǎoxiàng bǎ xiàoyuán kǎ wàng zài jiàoshì lǐ le.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}, {"k": "10-1.15", "t": "bs", "s": "司机把我们的行李送到了宾馆。", "sp": "Sījī bǎ wǒmen de xíngli sòng dào le bīnguǎn.", "n": "", "ok": true, "b": null, "bp": "", "x": "Benar."}]}, {"id": "10-2", "pel": 10, "judul": "Pola tetap: 在……上/中/下 (dalam hal / dalam / di bawah …)", "kode": "固定格式\"在……上/中/下\"", "rumus": ["在 + KB + 上 = dalam hal / bidang … (在学习上)", "在 + KB/KK + 中 = dalam (keadaan/waktu) … (在比赛中)", "在 + ……的 + KK dua suku kata + 下 = dengan (bantuan/pengaruh) … (在老师的帮助下)"], "jelas": ["Pola 在……上/中/下 di sini TIDAK menunjuk tempat fisik (seperti 在桌子上 = di atas meja), tetapi makna kiasan: bidang, keadaan/waktu, dan syarat.", "在 + kata benda + 上 menyatakan BIDANG atau HAL: 在学习上 (dalam hal belajar), 在工作上 (dalam pekerjaan), 在生活上 (dalam kehidupan sehari-hari). Contoh: 在学习上，遇到什么问题都可以问我.", "在……中 menyatakan LINGKUNGAN atau WAKTU saat sesuatu terjadi: 在比赛中 (dalam pertandingan), 在假期中 (selama liburan), 在这次考试中 (dalam ujian kali ini). Contoh: 在比赛中，他得分最高.", "在 + (keterangan) + 的 + kata kerja dua suku kata + 下 menyatakan SYARAT atau sebab: 在老师的帮助下 (dengan bantuan guru), 在她的影响下 (karena pengaruhnya). Biasanya kata kerjanya 帮助 atau 影响, dan harus ada keterangan di depannya (老师的, 她的, 大家的).", "Frasa ini biasanya di AWAL kalimat lalu koma, atau setelah subjek. Jebakan bagi pelajar Indonesia: \"dengan bantuan guru\" sering diterjemahkan 用老师的帮助 atau 在老师帮助下面. Yang benar 在老师的帮助下. \"Dalam hal belajar\" = 在学习上, bukan 在学习里.", "Ingat pasangan yang tetap: 学习/工作/生活 + 上; 比赛/假期/考试/生活 + 中; 帮助/影响 + 下."], "poin": ["在……上 = dalam hal/bidang.", "在……中 = dalam keadaan/waktu.", "在……的帮助/影响下 = dengan bantuan/karena pengaruh.", "Bukan tempat fisik; biasanya di awal kalimat."], "contoh": [{"zh": "在学习上，遇到什么问题都可以问我。", "py": "Zài xuéxí shàng, yùdào shénme wèntí dōu kěyǐ wèn wǒ.", "id": "Dalam hal belajar, masalah apa pun bisa kamu tanyakan padaku.", "b": true, "tr": "10-3"}, {"zh": "在工作上，他总是能给我很多帮助。", "py": "Zài gōngzuò shàng, balikan), 送 (memberi/menghadiahkan), 带 (membawakan), 借 (meminjamkan), 交 (menyerahkan), 发 (mengirim), 拿 (mengambilkan).", "Aturan kalimat 把 tetap berlaku: bendanya harus TERTENTU (这本书, 这些花, 今天的笔记), ingkar dan kata bantu kerja diletakkan SEBELUM 把: 他还没把钱还给我. 我要把这些花送给妈妈.", "Tanpa 把, kalimatnya bisa memakai dua objek: 我送她一个礼物 (aku memberinya sebuah hadiah). Pola 把 dipakai ketika bendanya sudah jelas dan kita ingin menekankan apa yang terjadi pada benda itu: 我把礼物送给她了 (hadiah itu sudah kuberikan kepadanya).", "Jebakan bagi pelajar Indonesia: susunan Indonesia \"berikan hadiah itu kepadanya\" membuat pelajar menulis 我送给她把礼物 atau 我把礼物送她给. Ingat urutannya: 把 + benda + KK给 + orang. 给 menempel pada kata kerja dan langsung diikuti orang.", "Jangan lupa orang penerima setelah 给: 我把书还给了 kurang lengkap; seharusnya 我把书还给他了. Partikel 了 boleh sesudah orang atau sesudah 给: 我把礼物送给她了 / 我把礼物送给了她."], "poin": ["把 + benda tertentu + KK给 + orang.", "KK: 还/送/带/借/交/发 + 给.", "没/不/要 sebelum 把.", "Orang penerima wajib ada sesudah 给."], "contoh": [{"zh": "你明天再把书还给我。", "py": "Nǐ míngtiān zài bǎ shū huán gěi wǒ.", "id": "Besok kembalikan buku itu kepadaku.", "b": true, "tr": null}, {"zh": "我把礼物送给她了。", "py": "Wǒ bǎ lǐwù sòng gěi tā le.", "id": "Hadiahnya sudah kuberikan kepadanya.", "b": true, "tr": null}, {"zh": "请你把这本书带给老师。", "py": "Qǐng nǐ bǎ zhè běn shū dài gěi lǎoshī.", "id": "Tolong bawakan buku ini kepada guru.", "b": true, "tr": null}, {"zh": "你们回家也做一做，明天再把书还给我。", "py": "Nǐmen huí jiā yě zuò yí zuò, míngtiān zài bǎ shū huán gěi wǒ.", "id": "Kalian kerjakan juga di rumah, besok kembalikan bukunya kepadaku.", "b": true, "tr": "10-5"}, {"zh": "我想把这些吃的送给奶奶。", "py": "Wǒ xiǎng bǎ zhèxiē chī de sòng gěi nǎinai.", "id": "Aku ingin memberikan makanan-makanan ini kepada nenek.", "b": false, "tr": null}, {"zh": "我把今天上课的笔记借给他了。", "py": "Wǒ bǎ jīntiān shàngkè de bǐjì jiè gěi tā le.", "id": "Catatan kuliah hari ini sudah kupinjamkan kepadanya.", "b": false, "tr": null}, {"zh": "今天是妈妈的生日，我要把这些花送给她。", "py":
